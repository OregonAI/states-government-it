name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontmatter:
    uses: OregonAI/corpus-toolkit/.github/workflows/validate-frontmatter.yml@v1
  provenance:
    uses: OregonAI/corpus-toolkit/.github/workflows/verify-provenance.yml@v1
  links:
    uses: OregonAI/corpus-toolkit/.github/workflows/check-links.yml@v1
    with:
      # lychee walks './**/*.md'. Without these exclusions it crawls
      # _meta/templates/document.md — a skeleton whose example URLs are not meant
      # to resolve — and every PR fails on link rot that is not link rot.
      # _meta/snapshots/ is excluded because a large corpus's snapshots would drag
      # hundreds of upstream URLs into a per-PR gate; upstream availability is what
      # the scheduled drift job is for.
      exclude-paths: |
        _meta/snapshots
        _meta/templates
        docs/research
        statutes
        rules
        executive-orders
        policies
        standards
      # The five content folders are excluded because "## Full text" is the official text
      # verbatim, including the links the state printed in it. Some of those are dead at the
      # source (WaTech policies still link ocio.wa.gov pages that 404), and many state sites
      # refuse automated clients. A dead link inside mirrored text is a fact about the source,
      # not a defect a PR can fix; whether each document's own source URL still answers is
      # the scheduled drift job's question.
      # docs/research is excluded because those files are dated findings that cite hundreds
      # of state sites, many of which refuse automated clients or have since moved. They
      # record what was observed; a per-PR gate on them would be red for reasons no PR caused.

  # EVERY COMMITTED GENERATED ARTIFACT MUST BE CURRENT, checked on every PR.
  #
  # The toolkit only READS _meta/graph.json, so nothing upstream notices when a document is
  # added and the graph is not rebuilt -- resolve_citation and graph_neighbors simply stop
  # finding it, silently, with no error anywhere. The same is true of a stale STATUS.md and
  # of an llms.txt still carrying the template's Contents stub (corpus-template#16: five
  # live corpora advertised an empty agent entry point for weeks).
  #
  # Those three gates are what every template-shaped corpus owes regardless of content, so
  # they run from ONE place -- the toolkit's reusable template-gates.yml on the CI track
  # (`@v1`, ADR-0014) -- and cannot drop out of this file one at a time, which is exactly
  # what happened when each corpus carried its own copy (corpus-toolkit v1.35.0; CONTEXT.md
  # "Template gates"). Where a gate genuinely does not apply, say so with an input
  # (`graph-check: false`, `status-check: false`) rather than deleting the job.
  #
  # _meta/corpus-index.json is deliberately NOT gated. The platform builds it at deploy
  # time in publish-index.yml and never commits it, precisely so it cannot fall behind its
  # own corpus in a way that damages a SIBLING repo's citation resolution.
  #
  # ADD A JOB FOR EVERY OTHER GENERATED FILE YOU COMMIT -- a `generated` job installing the
  # toolkit at the SERVING pin (`pip install -r requirements.txt`) with one `--check` step per
  # artifact, as oregon-budget and oregon-kpm do. A generated file with no check is the
  # failure this whole arrangement exists to prevent, and it is silent by construction.
  # Prefer `--check` to `git diff --exit-code`: STATUS.md carries a "Generated <date>" line.
  template-gates:
    uses: OregonAI/corpus-toolkit/.github/workflows/template-gates.yml@v1

  # `generated` is where a corpus adds `--check` steps for the generated files IT commits beyond
  # the template's (graph, STATUS.md, llms.txt are template-gates' job). The template itself
  # commits none, so this is the empty required check a new corpus fills in.
  generated:
    # Pinned to 24.04, not ubuntu-latest: `ingest.py --check` re-derives PDF text with the
    # system pdftotext, and its -layout output differs between poppler releases. The committed
    # text was made with poppler-utils 24.02 (Ubuntu 24.04); on 26.04 (poppler 26.01) two
    # documents re-derive differently and the check fails. Move this pin and re-ingest together.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # The ingester and every state module (found lazily by src.states.modules()) must at least import against the pinned toolkit: a template that
      # ships a broken starting point ships it to every corpus instantiated from it.
      - run: python3 -c "import src.ingest, src.states; src.states.modules()"
      # The seed list (_meta/sources/<state>.yml, one file per state) is hand-written, not generated, but it
      # is the owner's approval gate and must stay valid against domain.yml.
      - run: python3 src/check_seed_list.py --check
      # llms.txt (its states are the seed files) and CHANGELOG.md (built from changelog.d/) are generated
      # by scripts/regen.sh, like graph.json and STATUS.md (those two are template-gates' job above).
      - run: python3 src/build_llms.py --check
      - run: python3 src/build_changelog.py --check
      # The 20 analyst questions against the hand-listed expected documents (src/eval_questions.py). Offline, the
      # pinned toolkit's keyword leg only: it fails on an invalid expected file (a quote not in its document,
      # an unknown or stub id, a missing question), on a baseline out of date with the expected files, and on
      # a cell that passes in _meta/eval/baseline.json and no longer does. It does not fail on a low pass rate.
      # The hybrid leg needs the embeddings and torch, which CI does not have; run it with --report.
      - run: python3 src/eval_questions.py --check
      # Every committed snapshot .txt and document is re-derived offline from its raw
      # snapshot (src/ingest.py --check). The PDFs go through pdftotext, a system binary.
      #
      # Word files (.docx) are read with pandoc, a system binary like pdftotext. The committed text
      # was made with pandoc 3.11, and CI installs that same release (below). Ubuntu 24.04's own
      # pandoc 3.1.3 reads 19 of the 20 Word files identically but drops one file's cover page.
      # The check does not depend on that staying true: for a Word file `--check` re-derives the text
      # and requires the same words in the same order as the committed text (layout may differ),
      # so a changed word, a dropped paragraph or an edited .txt still fails it. pandoc is missing
      # => the check fails with "pandoc is not installed", it never passes unread.
      #
      # Scanned PDFs (a seed entry with `ocr:`) are checked by re-running tesseract on the committed scan:
      # the committed text must agree with that reading on 95% of the word sequence (src/ingest.py,
      # check_ocr). Ubuntu 24.04's tesseract 5.3.4 and ocrmypdf 15.2.0 are the versions that made the
      # committed text. The second engine, PaddleOCR, is not installed here: its text is committed
      # beside the snapshot (<id>.paddle.txt) and the agreement between the two texts is recomputed
      # from the committed files, so an edited text or a swapped second reading still fails.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils ocrmypdf tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd
      # pandoc 3.11 from its own release, checksum-pinned, not Ubuntu's 3.1.3: 3.1.3 drops the cover
      # page of nc-it-procurement-manual.docx (21 words), measured 2026-11-11. The other 19 Word
      # files read the same under both.
      - run: |
          curl -sSL -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb
          echo "89d4c9d97818c62a97157f0072844e4602c6cee795bf84abd1aee7273abcda99  /tmp/pandoc.deb" | sha256sum -c -
          sudo dpkg -i /tmp/pandoc.deb
      - run: pandoc --version | head -1 && tesseract --version | head -1 && ocrmypdf --version
      - run: python3 src/ingest.py --check

  unit-tests:
    # Same poppler pin as `generated`, for the same reason.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # tests/test_ingest.py runs the system binary `pdftotext` (poppler-utils) on real PDFs;
      # install it explicitly rather than rely on what the runner image happens to ship. The Word
      # file tests (tests/test_ingest_docx.py) need pandoc and skip without it, so CI installs it:
      # a skipped test here would be a gate that cannot fail.
      # The OCR tests (tests/test_ingest_ocr.py) run tesseract through ocrmypdf on real scans, for the
      # same reason.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils ocrmypdf tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd
      # pandoc 3.11 from its own release, checksum-pinned, not Ubuntu's 3.1.3: 3.1.3 drops the cover
      # page of nc-it-procurement-manual.docx (21 words), measured 2026-11-11. The other 19 Word
      # files read the same under both.
      - run: |
          curl -sSL -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb
          echo "89d4c9d97818c62a97157f0072844e4602c6cee795bf84abd1aee7273abcda99  /tmp/pandoc.deb" | sha256sum -c -
          sudo dpkg -i /tmp/pandoc.deb
      - run: python3 -m pytest tests/ -q
