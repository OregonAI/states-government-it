<p class="RegularParagraphs"><b>     [§</b><b>27G-2]  Charges for services.  </b>Any
law to the contrary notwithstanding, government agencies may charge for value
added electronic services provided through the portal manager. [L 2007, c 172,
pt of §2]</p>
