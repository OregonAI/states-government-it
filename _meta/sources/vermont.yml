    sha256: "b57c9bbe9304b09df0fe1d7e22b67aa1822200e117a841acc323de51a18c1ff2"
    url: "https://digitalservices.vermont.gov/sites/digitalservices/files/documents/ADSInternalRecordsManagementPolicyandGuidelinesVersion1.0.pdf"
    format: "pdf"
    citation: "Records Management Policy and Guidelines, Version 1.0"
    title: "Records Management Policy and Guidelines (listed as 'Agency of Digital Services - Internal Records Management Policy and Guidelines')"
    doc_type: "policy"
