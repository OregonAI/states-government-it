# Vermont seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Discovery 2026-11-12 through the toolkit Fetcher: legislature.vermont.gov (Vermont Statutes Online: title, chapter and full-chapter pages), digitalservices.vermont.gov (Agency of Digital Services: policies, cybersecurity standards and directives, artificial intelligence, governing statutes, procurement, web portal board and cybersecurity advisory council pages), governor.vermont.gov (executive order list, 14 pages, and order pages), vermont.gov (web policies), cmo.vermont.gov (web design and accessibility), aoa.vermont.gov (Bulletin 3.5), sos.vermont.gov and lexisnexis.com (administrative rules).
sources:


  # ---- Statutes: Vermont Statutes Online full-chapter pages (unofficial copy the Legislature provides; the only text the State serves)
  - id: "vt-3-vsa-56"
    sha256: "074ed503fa55548ffd4c00e4caab10047f7be8075bdeb596438d3194cea003de"
    url: "https://legislature.vermont.gov/statutes/fullchapter/03/056"
    format: "html"
    citation: "3 V.S.A. chapter 56"
    title: "Title 3, Chapter 56. Agency of Digital Services"
    doc_type: "statute"
    jurisdiction: "vermont"
    issuing_body: "Vermont General Assembly"
    tags: [governance, oversight, procurement, funding, cybersecurity, data, ai, digital-services]
    recheck: "monthly"
    found_via: "https://digitalservices.vermont.gov/accountability/governing-statutes (ADS page that points to the statutes); the chapter page https://legislature.vermont.gov/statutes/chapter/03/056 links this full-chapter page as 'Full Text of Chapter 056'"
    why_relevant: "The enabling statute of the Agency of Digital Services (ADS) and the State's Chief Information Officer. Its sections: ADS created, with duties for all information technology and cybersecurity activity in executive-branch State government, including reviewing and approving IT activities and developing IT and cybersecurity policies (3301); the Secretary of Digital Services as State CIO, who reviews and approves State IT and cybersecurity policies and supervises IT staff and contractors (3302); the annual report and budget, strategic plan, records, independent expert review of IT projects of $1,000,000.00 or more, and the project inventory (3303); the Information Technology Internal Service Fund (3304); the automated decision system definitions and the inventory of automated decision systems that State government develops, employs or procures (3305); and the Technology Modernization Special Fund (3306). The ADS cybersecurity standards cite 3 V.S.A. 2283(b) and 2222(a) as their authority; ADS's own page says 2283b was the enabling statute of the former Department of Information and Innovation."
  - id: "vt-3-vsa-69"
    sha256: "91ee7796fa5fb4406bac8d3b362d4b886e1a0843b4c975195d690b74e215d620"
    url: "https://legislature.vermont.gov/statutes/fullchapter/03/069"
    format: "html"
    citation: "3 V.S.A. chapter 69"
    title: "Title 3, Chapter 69. Division of Artificial Intelligence"
    doc_type: "statute"
    jurisdiction: "vermont"
    issuing_body: "Vermont General Assembly"
    tags: [governance, ai]
    recheck: "monthly"
    found_via: "https://digitalservices.vermont.gov/ai (ADS AI page, which names 2022 Act 132 as creating the bodies); the chapter page https://legislature.vermont.gov/statutes/chapter/03/069 links this full-chapter page as 'Full Text of Chapter 069'"
    why_relevant: "The statute on State government's use of artificial intelligence: the definition of artificial intelligence systems (5021); the Division of Artificial Intelligence within ADS, which reviews AI systems developed, employed or procured in State government, proposes a State code of ethics for AI that ADS adopts and updates annually, advises the General Assembly, and reviews the automated decision systems inventory (5022); and the Artificial Intelligence Advisory Council (5023, printed 'Repealed effective June 30, 2030'). The ADS Code of Ethics and the Guidelines for Use of Generative AI cite 3 V.S.A. 5022 as their authority."
  - id: "vt-22-vsa-16"
    sha256: "e93d09299f31d8a5da10221c20feece4bce09d62255393b9fb689a9cdd9f89e5"
    url: "https://legislature.vermont.gov/statutes/fullchapter/22/016"
    format: "html"
    citation: "22 V.S.A. chapter 16"
    title: "Title 22, Chapter 16. The Vermont Web Portal"
    doc_type: "statute"
    jurisdiction: "vermont"
    issuing_body: "Vermont General Assembly"
    tags: [governance, digital-services, funding]
    recheck: "monthly"
    found_via: "https://digitalservices.vermont.gov/about-us/web-portal-board (the page links https://legislature.vermont.gov/statutes/fullchapter/22/016)"
    why_relevant: "The statute for the State's web portal (sections 950 to 953): purpose, definitions, the Vermont Web Portal Board and its membership (the Secretary of Digital Services and the Chief Data Officer of ADS sit on it), and the Board's duties. ADS's Web Portal Board page names this chapter as the Board's statute."
  - id: "vt-20-vsa-208"
    sha256: "82583f1c235118f6f2fe2f6d8976c9afef42bb2b8c9acbb5ee609824d8e69c04"
    url: "https://legislature.vermont.gov/statutes/fullchapter/20/208"
    format: "html"
    citation: "20 V.S.A. chapter 208"
    title: "Title 20, Chapter 208. Cybersecurity [Repealed effective June 30, 2033]"
    doc_type: "statute"
    jurisdiction: "vermont"
    issuing_body: "Vermont General Assembly"
    tags: [cybersecurity, governance]
    recheck: "monthly"
    found_via: "https://digitalservices.vermont.gov/cybersecurity/cybersecurity-advisory-council (names Act 71 and 20 V.S.A. chapter 208); the full-chapter URL is built from the Legislature's fullchapter pattern (found_via note: the chapter 56 and 69 pages show it) and the title block in the fetched bytes is 'Title 20 ... Chapter 208: Cybersecurity'"
    why_relevant: "The cybersecurity statute: definitions (4661) and the Cybersecurity Advisory Council (4662), created by Act 71 of 2023, chaired by the Chief Information Officer, with the duty to develop a strategic plan for protecting the State's public sector and private sector information and systems and to evaluate statewide cybersecurity readiness. The chapter is printed 'Repealed effective June 30, 2033', so it is in force today. It also reaches private-sector members and critical infrastructure; the Council is a State body."
  - id: "vt-9-vsa-62"
    sha256: "dc7c447be1189802679e45d17391663738f58a859d6e155c23ed018771968b4d"
    url: "https://legislature.vermont.gov/statutes/fullchapter/09/062"
    format: "html"
    citation: "9 V.S.A. chapter 62"
    title: "Title 9, Chapter 62. Protection of Personal Information"
    doc_type: "statute"
    jurisdiction: "vermont"
    issuing_body: "Vermont General Assembly"
    tags: [cybersecurity, data]
    recheck: "monthly"
    found_via: "legislature.vermont.gov Title 9 chapter list (https://legislature.vermont.gov/statutes/title/09); the full-chapter URL is built from the Legislature's fullchapter pattern and the title block in the fetched bytes is 'Title 9: Commerce and Trade / Chapter 062: Protection of Personal Information'"
    why_relevant: "The personal-information chapter. 'Data collector' is defined to include the State, State agencies and political subdivisions, so the Security Breach Notice Act (subchapter 2, section 2435) binds State agencies, and the Social Security Number Protection Act (subchapter 3, section 2440) restricts what the State and State agencies may do with Social Security numbers. Most of the rest of the chapter binds private businesses and is served on the same page (OWNER DECISION: section-level slicing; see left_out). Sections print both an 'effective until January 1, 2027' and an 'effective January 1, 2027' version, and the page serves both."

  - id: "vt-3-vsa-10"
    sha256: "d43cb2cc9e554c28caf411fb6dc97584544e15e9dab3125235192c08f2e0f075"
    url: "https://legislature.vermont.gov/statutes/fullchapter/03/010"
    format: "html"
    citation: "3 V.S.A. chapter 10"
    title: "Title 3, Chapter 10. Federal Tax Information"
    doc_type: "statute"
    jurisdiction: "vermont"
    issuing_body: "Vermont General Assembly"
    tags: [data, cybersecurity]
    recheck: "monthly"
    found_via: "legislature.vermont.gov Title 3 chapter list (https://legislature.vermont.gov/statutes/title/03); the full-chapter URL is built from the Legislature's fullchapter pattern and the title block in the fetched bytes is 'Title 3: Executive / Chapter 010: Federal Tax Information'"
    why_relevant: "Section 241 binds named executive-branch 'Recipients' of federal tax information (the Agency of Human Services and four of its departments, the Departments of Labor, Motor Vehicles, Taxes and Buildings and General Services, and the Agency of Digital Services): an initial background investigation and a reinvestigation at least every 10 years of any employee, volunteer, contractor or subcontractor given access to FTI, by fingerprint-based criminal history record checks through the Vermont Crime Information Center. A State agency is the obligated party and the subject is the security of government-held data. It is a personnel-screening rule, so it is a close call on scope; seeded, not left out (OWNER DECISION whether to keep it). Sections 242 to 250 print 'Repealed. 1987, No. 243 (Adj. Sess.), 6, eff. June 13, 1988'."

  # ---- Executive orders: PDFs the Governor's office posts (the Vermont Statutes Online Title 3 Appendix is an unofficial copy and is not used)
  - id: "vt-eo-06-17"
    sha256: "9a65920919ac7167338ed872de93679638ca6d758e6f60a0192603f9f9a9ef64"
    url: "https://governor.vermont.gov/sites/scott/files/documents/EO%206.IT%20REORG%20FINAL.pdf"
    format: "pdf"
    citation: "Executive Order 06-17"
    title: "Executive Order No. 06-17: Creation of the Agency of Digital Services"
    doc_type: "executive_order"
    jurisdiction: "vermont"
    issuing_body: "Governor of Vermont"
    tags: [governance, oversight, cybersecurity, digital-services]
    recheck: "monthly"
    found_via: "https://digitalservices.vermont.gov/accountability/governing-statutes (links governor.vermont.gov/content/creation-agency-digital-services-executive-order-06-17, whose file link is this PDF); the Governor's order list shows it dated January 17, 2017"
    why_relevant: "The order that created ADS, signed January 15, 2017 (the Governor's list dates it January 17, 2017) and taking effect April 17, 2017 unless disapproved by the General Assembly: it unified the State's IT operations in one agency headed by the Secretary of Digital Services (the State CIO), with divisions, and brought agency technology leaders under the CIO. The ADS governing statutes page links it; it is the executive-order base for the later statute (3 V.S.A. chapter 56). Inference, not printed in either document: chapter 56 (2019 Act 49) now creates ADS and sets the Secretary's duties by statute, so the order's creation of the agency is carried by the statute; the Governor's office still posts the order and nothing read says it was revoked, so it stays seeded."
  - id: "vt-eo-18-17"
    sha256: "affde5b0578fa6cff6fae886ffeb5b41233f7cb46ddcfd029f4ef0b55990dc44"
    url: "https://governor.vermont.gov/sites/scott/files/documents/EO%2018-17%20-%20Governor%27s%20Cybersecurity%20Advisory%20Team.pdf"
    format: "pdf"
    citation: "Executive Order 18-17"
    title: "Executive Order No. 18-17: Governor's Cybersecurity Advisory Team"
    doc_type: "executive_order"
    jurisdiction: "vermont"
    issuing_body: "Governor of Vermont"
    tags: [cybersecurity, governance]
    recheck: "monthly"
    found_via: "https://governor.vermont.gov/document-types/executive-orders (list, October 10, 2017) and https://governor.vermont.gov/content/governors-cybersecurity-advisory-team-executive-order-18-17"
    why_relevant: "Creates the Governor's Cybersecurity Advisory Team (October 10, 2017), with the State CIO and the Chief Information Security Officer among its members and ADS staffing it, to advise the Governor on the State's cybersecurity posture and develop a strategic plan. No order rescinding it was found on the Governor's list (14 pages read), but Act 71 of 2023 later created a statutory Cybersecurity Advisory Council with a similar charge (20 V.S.A. chapter 208)."
  - id: "vt-eo-04-26"
    sha256: "3a2c929b83a8b0ce985cad61a42c505ad1d352e45deb106dbf87c6cc175191c0"
    url: "https://governor.vermont.gov/sites/scott/files/documents/Establishing%20the%20Vermont%20AI%20Economic%20Taskforce%20-%20EO%2004-26.pdf"
    format: "pdf"
    citation: "Executive Order 04-26"
    title: "Executive Order No. 04-26: Establishing the Vermont AI Economic Taskforce"
    doc_type: "executive_order"
    jurisdiction: "vermont"
    issuing_body: "Governor of Vermont"
    tags: [ai, governance]
    recheck: "monthly"
    found_via: "https://governor.vermont.gov/document-types/executive-orders (list, May 18, 2026) and https://governor.vermont.gov/document/executive-order-no-04-26"
    why_relevant: "Establishes the Vermont AI Economic Taskforce (May 18, 2026; in force two years unless extended, modified or rescinded). Mainly an economy and workforce body, but it directs the Chair with the ADS Secretary to identify up to five priority AI opportunities inside State government and to deliver an education program for State agency leaders (paragraph 7), and requires the Taskforce's own AI use to follow the Code of Ethics and AI Inventory (paragraph 11). The order is mixed; its economic parts ride along."

