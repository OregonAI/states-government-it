    tags: [data]
    recheck: "monthly"
    found_via: "https://digitalservices.vermont.gov/working-us/policies (Information Management)"
    identity_text: "Records Management Policy and Guidelines"
    stub: true
    stub_reason: "In scope and published by ADS, but its text cannot be committed cleanly, measured 2026-11-12. The Fetcher read the PDF (HTTP 200, 212,161 bytes, 11 pages). Pages 2 to 11 have a clean text layer, but page 1 is a scanned memorandum (a 1275 by 1650 pixel image) carrying a hidden OCR text layer with errors (pdftotext prints 'Tq\\\"VERMONT', 'Stote CIO', 'Shown Nailor', 'Montpelier, VT 05609-200L', 'February 20,2019'). The shared OCR procedure refuses a page that has a text layer (ocr: [1] was tried: 'PDF page 1 has a text layer but the seed entry lists it in ocr'), and committing the layer would put misread names and dates into the verbatim text. Becomes a document when the ingester can OCR a page over a bad text layer, or ADS posts a clean copy. The policy itself (version 1.0, effective March 1, 2019, adopted under 3 V.S.A. 218(b) for all ADS employees) is on pages 2 to 11."
    why_relevant: "ADS's records management policy (version 1.0, effective March 1, 2019), adopted by memorandum of the Secretary under 3 V.S.A. 218(b) for all ADS employees: ADS records are public records, managed under the Public Records Law and State Archives guidance. It binds ADS only, not other agencies. The first page is a scanned memorandum with a poor text layer, so the entry is a stub."
  - id: "vt-ai-code-of-ethics"
    sha256: "ebfb0244c58c47ee6bddb8dfc6e1dc38d0f273887f5d0e5e7d4bdebdd26f621a"
    url: "https://digitalservices.vermont.gov/sites/digitalservices/files/documents/AI%20Code%20of%20Ethics%20v2_0.pdf"
    format: "pdf"
