left_out:
- text: |-
    Vermont: found and left out (each was seen on an official page on 2026-11-12 and fetched through the Fetcher; the reason is recorded here).
- text: |-
    ADS indexes, read row by row. https://digitalservices.vermont.gov/working-us/policies: 6 policy rows plus web links. Seeded: the Internal Records Management Policy and Guidelines (vt-ads-records-management-policy) and the Web Accessibility Policy (vt-web-accessibility-policy); the Cybersecurity Standards and Directives row is the watched page below it (its two items are seeded). Left out: 'Contracting Procedures in Bulletin 3.5' (Agency of Administration Bulletin No. 3.5, Procurement and Contracting Procedures, revised December 7, 2023, 88 pages at https://aoa.vermont.gov/sites/aoa/files/documents/03-22-24_Revised_2023-12-07_Bulletin_3.5_Vermont_Edit_Manual.pdf: general contracting rules for every State purchase, of which IT is one part; the IT-specific companion, the IT Procurement Guideline, is seeded; OWNER DECISION whether Bulletin 3.5 enters); 'Web Design System' (https://cmo.vermont.gov/web-design-system, a hub of six guidance pages for building State websites: design and content strategy, writing for the web, website accessibility, web template regions, content types, content editing; guidance and template instructions, not an instrument; the hub's closing paragraph says to link the system in vendor statements of work); 'Universal Digital Accessibility' (watched hub; its step-by-step tasks, document exceptions, checklists, office hours, steering committee, communications and template pages are guidance); 'Plain Language Guide and Policy' (https://cmo.vermont.gov/accessibility/communications/plain-language, advice on writing for the public, not IT).
- text: |-
    https://digitalservices.vermont.gov/cybersecurity/cybersecurity-standards-and-directives: 2 rows, both seeded. Not on any index. Cybersecurity_Standard_2202-01.pdf (HTTP 200 through the Fetcher under /sites/digitalservices/files/doc_library/; its bytes confirm it is superseded by 2023-01, which states that it supersedes updates 19-01 and 2022-01, so it is not in force). ADS_Cybersecurity_Standard_Update_19-01.pdf and ADS_Cybersecurity_Directive_19-01.pdf were named by a web search (discovery only) and are not reachable at https://digitalservices.vermont.gov/sites/digitalservices/files/doc_library/ADS_Cybersecurity_Standard_Update_19-01.pdf or https://digitalservices.vermont.gov/sites/digitalservices/files/doc_library/ADS_Cybersecurity_Directive_19-01.pdf (both HTTP 404 through the Fetcher, 2026-11-12); no other address for them was fetched, and the 2023-01 standard says it supersedes update 19-01, so they are not in force either way; SoV_Information_Security_Standard.pdf (https://digitalservices.vermont.gov/sites/digitalservices/files/doc_library/SoV_Information_Security_Standard.pdf, 'Information Security Standards', ADS, January 15, 2020, 27 pages) and ADS-WebDomainNamePolicy2013.pdf (https://digitalservices.vermont.gov/sites/digitalservices/files/documents/web-policy/ADS-WebDomainNamePolicy2013.pdf, Web Domain Name Policy, original adoption February 1, 2006, updated 8/1/2017, 2 pages). The last two are listed on no ADS index read, and whether either is in force is not shown by the bytes (the 2020 standard is ADS's earlier security baseline and the 2026 Foundations Policy does not say it replaces it); nothing enters by crawling, so they are left out. OWNER DECISION whether to add them.
- text: |-
    https://digitalservices.vermont.gov/ai, Key documents (read row by row): seeded are the Code of Ethics, the Guidelines for State Employee Use of Generative AI and (as a stub) the Vendor AI Usage Disclosure. Left out as reports, not instruments: the Inventory of Automated Decision Systems (the 2025, 2024 and 'Original report' links; the ADS 2024 Annual Report PDF and https://legislature.vermont.gov/assets/Legislative-Reports/Agency-of-Digital-Services-Report-on-AI-Inventory.pdf), the 2025 Report on the Future of the AI Council in Vermont, the 2024 AI Council Report on AI Use & Data Management, and the 2020 Final Report of the AI Task Force. Also left out: the meeting minutes and recordings page (https://digitalservices.vermont.gov/ai/minutes) and the council's agenda and member list.
- text: |-
    Cybersecurity Advisory Council page (https://digitalservices.vermont.gov/cybersecurity/cybersecurity-advisory-council), Web Portal Board page (https://digitalservices.vermont.gov/about-us/web-portal-board), ADS strategic plans (ADS-Strategic-Plan-FY25.pdf, the FY26 ADS Strategic Plan), the OneADS operating model and playbook, the annual reports, the Cybersecurity Advisory Council annual reports, meeting agendas, minutes and resolutions: reports, strategy documents and meeting records, not instruments. The Cybersecurity Advisory Council page links Act 71 of 2023 (https://legislature.vermont.gov/Documents/2024/Docs/ACTS/ACT071/ACT071%20As%20Enacted.pdf), whose enacted text is in 20 V.S.A. chapter 208, seeded. The ADS procurement page's IT SOW Directory and retainer-vendor information: a directory of contract documents, not an instrument. Not read: https://digitalservices.vermont.gov/cybersecurity (HTTP 404 through the Fetcher).
- text: |-
    Statutes left out. 3 V.S.A. 2222 (chapter 45, Administration; ADS's governing statutes page cites 2222(a)(10) for the definition of information technology, its procurement page cites 2222, and the cybersecurity standards cite 2222(a)), 3 V.S.A. chapter 45 as a whole is the Agency of Administration's chapter, not an IT chapter: section-level slicing is an OWNER DECISION. Repealed, so not in force, though the ADS governing statutes page still cites them: 3 V.S.A. 2283b ('Repealed. 2019, No. 49, 4, eff. June 10, 2019'), 32 V.S.A. 315 ('Repealed. 2019, No. 49, 12'), 22 V.S.A. chapter 15 and section 901 (Department of Information and Innovation; 'Repealed. 2019, No. 49, 7 eff. June 10, 2019'), and 29 V.S.A. chapter 63, Data Processing (sections 1701 and 1702 'Repealed. 2007, No. 65'). 30 V.S.A. 202d and 227b (telecommunications plan and assets; telecom is out of scope). 29 V.S.A. chapter 51, Purchasing, and 1 V.S.A. chapter 5, subchapter 3 (Public Records Law): procurement and public-records chapters that are not IT chapters (OWNER DECISION on section-level slicing). 20 V.S.A. chapter 207, Protection of Personally Identifying Information (section 4651 bars a public agency from collecting religious-affiliation information for registration or disclosing personally identifying information to a federal agency for registration; section 4652 on agreements under 8 U.S.C. 1357(g)): about disclosure to federal registration programs, not an IT or data-governance instrument; OWNER DECISION. 9 V.S.A. chapter 61A, Data Privacy, 'Effective January 1, 2028' (the Vermont Data Privacy and Online Surveillance Act): a consumer-privacy law on businesses, not yet in effect; its exemptions section was seen to exempt government in part (not read in full). 9 V.S.A. chapter 20 (Uniform Electronic Transactions Act): general commercial law, not read. The Legislature's page calls the Vermont Statutes Online an unofficial copy, and it is the only statute text the State serves; the printed Vermont Statutes Annotated governs.
- text: |-
    9 V.S.A. chapter 62 rides along (seeded as a whole chapter, OWNER DECISION on slicing): subchapters 1 (definitions and brokered personal information), 3A (Student Privacy), 3B (Educational Technology, effective January 1, 2027), 5 (Data Brokers) and 6 (Vermont Age-Appropriate Design Code Act) bind businesses, operators and data brokers; subchapter 4 (Document Safe Destruction Act) defines the businesses it covers so as not to include the State. Subchapters 2 (breach notice) and 3 (Social Security numbers) bind State agencies.
- text: |-
    Administrative rules: none seeded. The State publishes the Code of Vermont Rules only through a Lexis portal (https://www.lexisnexis.com/hottopics/codeofvtrules/, linked from the Legislature's statutes page and from the Secretary of State's APA page https://sos.vermont.gov/secretary-of-state-services/apa-rules/). The Fetcher got HTTP 200 and 3,380 bytes: a script that sets a cookie and redirects, with no rule text. The Secretary of State's rulemaking notices page (https://secure.vermont.gov/SOS/rules/) lists proposed rules (a 2026 list of notices by number) and is not the text of rules in force. So no ADS rule or other IT rule could be identified or read, and no 'none found' claim is made: whether ADS has administrative rules is not shown by anything read. A Lexis rule portal is not seeded as a watched page because its address carries a per-session token and its body is a script.
- text: |-
    Executive orders, read from the Governor's list (https://governor.vermont.gov/document-types/executive-orders, pages 0 to 13 had items, pages 14 to 20 returned the same empty page; every title and summary on pages 0 to 13 was read; the list holds Governor Scott's orders from January 2017). Seeded: 06-17, 18-17, 04-26. Left out: 02-18 Internet Neutrality in State Procurement (https://governor.vermont.gov/sites/scott/files/documents/EO%2002-18%20-%20Internet%20Neutrality%20in%20State%20Procurement%20-%20Final.pdf, February 15, 2018, which requires State agency contracts with internet service providers to carry net neutrality protections; it prints 'No. 2-18'; broadband is out of scope in domain.yml, OWNER DECISION); 03-17 Governor's Government Modernization and Efficiency Team (January 5, 2017, an advisory team on efficiency whose charge includes strategic IT planning among other aims; not primarily IT, OWNER DECISION); 05-26 Expanding Affordable Health Insurance Choices for Vermonters and 06-26 (the page slug reads 'local media considerations state marketing and advertising purchasing') are not IT; the 2019 order reconstituting the Vermont Public Safety Broadband Network Commission as the Emergency Communications Advisory Council (05-19) is telecommunications and 911; every other order on the list is on emergencies, housing, environment, property transfers, ethics, reorganizations or similar subjects. The Vermont Statutes Online Title 3 Appendix (an unofficial copy, https://legislature.vermont.gov/statutes/title/03APPENDIX) holds orders of earlier Governors by subject; chapter 3 (101 numbered orders) was read by title and chapters 20, 22 and 29 were searched for IT terms. From it: 3-57 (No. 02-13, Transfer of Certain Technology Positions to the Department of Information and Innovation; the Appendix prints no note of supersession; INFERENCE, not printed: it is spent, because the Department of Information and Innovation was repealed by 2019 Act 49 (22 V.S.A. chapter 15, 'Repealed. 2019, No. 49, 7') and 06-17 made ADS the successor), 3-29 (No. 12-94, Telecommunications Technology Council of Vermont; telecom) and 3-22 (No. 3A-92, Vermont Center for Geographic Information; the Appendix prints under it 'Revoked and rescinded by Executive Order 06-05 (codified as Executive Order No. 3-46), dated September 13, 2005', so it is not in force and needs no owner decision) were seen and not seeded. Chapters of the Appendix not named above were not read, so no claim is made that no earlier order on IT remains in force.
- text: |-
    vermont.gov web policies (https://www.vermont.gov/policies): the Privacy Policy (https://www.vermont.gov/policies/privacy, the portal's notice of what it collects from visitors) and the Disclaimer are on the portal's page, not on any ADS index; the privacy notice is the web portal's rather than an instrument of State agencies (OWNER DECISION). The page's own 'Accessibility Policy' paragraph ('It is the policy of the State of Vermont to ensure that people with hearing, visual and other disabilities have equal access...') is the older text of the same subject as the seeded accessibility statement. The ADA grievance procedure it links (Department of Human Resources manual number 10.2) is a personnel procedure.
- text: |-
    Vendor AI Usage Disclosure (seeded as a stub: a Word clause with a questionnaire and a check-box item) is not a document; the State's Legislature-reports PDFs on AI are reports. The Vermont Web Design System and accessibility checklists are guidance. Not an instrument: ADS Business Intake Form, the COMPASS FAQ (a SharePoint site), the ADS performance dashboards and project dashboards (epmo.vermont.gov): forms, sign-in sites and dashboards.
