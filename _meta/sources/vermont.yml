    identity_text: "Guidelines for Use of Generative AI"
    why_relevant: "Guidance from the Division of Artificial Intelligence (last updated July 1, 2026) under 3 V.S.A. 5022 for State employees who use generative AI tools in official duties: public and internal tool categories, which data may be entered, and citation and approval requirements by content type. Departments may issue more restrictive guidelines."
  - id: "vt-ai-vendor-usage-disclosure"
    sha256: "f3f0c7c678472bc90280cb0bc714807feb1003b2751808d047c3075d1a1a3f14"
    url: "https://digitalservices.vermont.gov/sites/digitalservices/files/documents/AI%20Usage%20Disclosure.docx"
    format: "docx"
    citation: "Vendor AI Usage Disclosure"
    title: "Requirement for Bidders to Disclose AI Usage in Proposals (listed as 'Vendor AI Usage Disclosure')"
    doc_type: "policy"
    jurisdiction: "vermont"
    issuing_body: "Agency of Digital Services"
    tags: [ai, procurement]
    recheck: "monthly"
    found_via: "https://digitalservices.vermont.gov/ai (Key documents: 'Vendor AI Usage Disclosure')"
    identity_text: "Requirement for Bidders to Disclose AI Usage in Proposals"
    stub: true
    stub_reason: "A Word file (HTTP 200, read with pandoc 2026-11-12) that is a solicitation clause with a questionnaire for bidders to answer, including a check-box item ('[_] Yes, by a 3rd party; [_] Yes, internally; or [_] No') and lettered response prompts. It also carries a binding requirement (AI may be used only with the State's prior written approval and must follow the Code of Ethics). Under the interim forms rule in .claude/rules/documents.md a form or template stays a stub, and this one holds check boxes and a questionnaire; OWNER DECISION whether such solicitation clauses enter as policy. Becomes a document when the owner rules on forms (docs/spec.md, Open)."
    why_relevant: "The solicitation language ADS provides: AI may be used to provide goods and services for the State only with prior written approval, any use must follow the Code of Ethics, and a bidder planning to use AI must answer three questions (technologies and functions, decision capabilities under 3 V.S.A. 3305, human evaluation and fail-safes). It binds vendors under State solicitations. It is a Word clause for insertion in solicitations with a questionnaire and a check-box item, so the entry is a stub."
