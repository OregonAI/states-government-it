    why_relevant: "A memorandum of February 16, 2023 from the Secretary of Digital Services to all executive-branch agencies, departments and offices that revises and supersedes Cybersecurity Standard Updates 19-01 and 2022-01. It is issued as direction to executive-branch State agencies under 3 V.S.A. 2283(b) and 2222(a) to safeguard State information and information systems."
