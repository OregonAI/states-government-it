    title: "Artificial Intelligence Code of Ethics"
    doc_type: "policy"
    jurisdiction: "vermont"
    issuing_body: "Agency of Digital Services and Council on Artificial Intelligence"
    tags: [ai]
    recheck: "monthly"
    found_via: "https://digitalservices.vermont.gov/ai (Key documents: 'Code of Ethics', link /sites/digitalservices/files/documents/AI%20Code%20of%20Ethics%20v2_0.pdf)"
    why_relevant: "The State's AI Code of Ethics (version 2, last updated 06/03/2026), which ADS is directed to create by 3 V.S.A. 5022(b)(1) and (c)(3). It defines AI systems by reference to 3 V.S.A. 5021, separates 'direct impact' from 'indirect impact' systems, and applies to the executive branch; agencies may adopt stricter policies with ADS's consent."
