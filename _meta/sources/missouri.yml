  recheck: monthly
  why_relevant: 'Found on the Secretary of State''s year index for 2003 (https://www.sos.mo.gov/library/reference/orders/2003) and read as a candidate among the orders whose text names information technology. It reestablishes the Office of Information Technology, located in the Office of Administration and directed by a Chief Information Officer who serves at the will of the Governor, convenes an Information Technology Advisory Board, may establish a state enterprise IT architecture and state-wide IT policies, and files an annual ''State of Information Technology in Missouri'' report. In force: the page prints no rescission (the same office''s order 24-11 rescinded 177 orders and does not list 03-26); amended by Executive Order 06-34, and the office it created was assigned to the Division of Information Services by 05-07.'
