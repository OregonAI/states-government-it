  recheck: monthly
  why_relevant: The adjutant general administers the Cybersecurity Mission Act (sections 41.1015 to 41.1018, Chapter 41, effective 28 August 2026, L. 2026 H.B. 2593) and may adopt rules under Chapter 536.
