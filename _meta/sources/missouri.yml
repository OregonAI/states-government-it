  why_relevant: Row 'ITPS-001 Laptop Encryption' of the Statewide Policies page (https://oa.mo.gov/commissioners-office/policies/statewide). The administrative policy, category Information Technology Security, originating unit OA ITSD ISMO, requires whole disk encryption on state-owned laptops and other portable computers. The PDF prints ISSUED 10/27/2008 and REVISED 10/5/2012. KNOWN TEXT-LAYER DEFECT of the official PDF. pdftotext reports a non-embedded font using identity encoding (TimesNewRoman,Bold), and the first section heading reads 'I. General StatemenW' both in the text layer and in a poppler rendering of the page, where the word is presumably Statement; a viewer with that font installed may show it differently (not checked). The committed text keeps the defect as extracted; the other section headings (II to V) read correctly. OWNER DECISION, see left_out. Keep as a document with the defect recorded, or make it a stub.
