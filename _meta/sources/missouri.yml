  title: 'Section 41.1016, RSMo: Definitions (Cybersecurity Mission Act)'
  doc_type: statute
  jurisdiction: missouri
  issuing_body: Missouri General Assembly (Revisor of Statutes)
  tags:
  - cybersecurity
  recheck: monthly
  why_relevant: 'Definitions for the Cybersecurity Mission Act (sections 41.1015 to 41.1018, Chapter 41, effective 28 August 2026, L. 2026 H.B. 2593): cybersecurity, cyber-attack prevention, response and support, among others.'
- id: mo-rsmo-41-1017
  sha256: "3eb77bd74ad383e24766261a2e2bf5a13234906be3825f8279e6759e1d9c6160"
  url: https://revisor.mo.gov/main/OneSection.aspx?section=41.1017
  format: html
  citation: Section 41.1017, RSMo
  title: 'Section 41.1017, RSMo: Cybersecurity and cyber attacks, agreements to render aid, expenses, fund created, use of moneys'
  doc_type: statute
  jurisdiction: missouri
  issuing_body: Missouri General Assembly (Revisor of Statutes)
  tags:
  - cybersecurity
  - funding
  recheck: monthly
  why_relevant: 'The operative section of the Cybersecurity Mission Act (sections 41.1015 to 41.1018, Chapter 41, effective 28 August 2026, L. 2026 H.B. 2593): on request of the director of the Department of Public Safety the Missouri National Guard may agree to render cybersecurity aid to the state and to local and public entities, the adjutant general may activate members on state orders and charge for expenses, and the Missouri National Guard Cybersecurity Revolving Fund is created. It binds a state entity (the Guard) and covers state systems among others; it is the only cybersecurity statute found for state systems.'
