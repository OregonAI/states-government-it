left_out:
- text: '---- Missouri: found and left out (each was seen on an official page on 2026-11-12 and read through the Fetcher; the reason is recorded here). ''Not found'' statements name the list that was read.'
- text: |-
    Central IT body, CIO and statutes. The statute pages seeded are the Revisor of Statutes' one-section pages (revisor.mo.gov OneSection). The section lists of Chapter 37 (Office of Administration) and Chapter 41 (Military Forces) were read whole (https://revisor.mo.gov/main/OneChapter.aspx?chapter=37 and ?chapter=41) and are watched. No section names a 'chief information officer' or 'state CIO': the enabling statute is 37.110 (the information technology services division); the CIO is named only on the ITSD page https://itsd.oa.mo.gov/chief-information-officer. Found and left out:
     - Section 37.010 (the commissioner of administration heads the information technology services division among other divisions): the section is the commissioner's appointment, oath, bond and duties; its one IT clause repeats 37.110. Left out as a non-IT section (playbook: statute sections inside non-IT chapters are left out pending an owner decision on section-level slicing); 37.005 is seeded because its subsection 8 is the IT authority.
     - Sections 37.070 (Departmental transparency) and 37.850 (Missouri accountability portal), and 1 CSR 10-7 (Missouri Accountability Portal rules): financial transparency and public spending data, not IT governance. OWNER DECISION: the portal is a state data system; the owner may want these seeded as data governance.
     - Sections 37.1090 to 37.1098 (the local government expenditure database on the Missouri accountability portal: definitions, database creation and availability on the portal and the department website, contents, downloadable record of expenditures, local government participation, public comment, confidential information excluded from the database with state immunity, an internet link on local government websites, rulemaking), read in the Chapter 37 section list and not fetched as pages: financial transparency and public spending data, as 37.850. OWNER DECISION, together with 37.070, 37.850 and 1 CSR 10-7: the portal is a state data system and the owner may want these seeded as data governance.
     - Section 37.007 (credit card, debit card and other electronic payments, statewide system): payment processing for state revenue, not IT governance. Left out.
     - Section 37.710 (access to information, authority of the office, confidentiality of information): sits in the child advocate office sections (37.700 to 37.730) and gives that office access to records and confidentiality duties. Left out as not IT.
     - Chapter 34 (state purchasing) and other procurement sections that buy IT: procurement law of general scope, not read for IT sections; left out under the playbook's rule on non-IT chapters.
     - Sections 375.1400 to 375.1427 (Insurance Data Security Act, seen in search results only, not fetched): bind insurance licensees, not state agencies.
     - Artificial intelligence: no enacted Missouri statute on state-agency AI use was found. The section lists of Chapters 37 and 41 were read; the Revisor's keyword search endpoint was not used (it is an internal search form, not a link a visitor follows). Web search (discovery only, nothing in the repo from it) reported 2026 bills (SB 1012, SB 1324, SB 1474 among them) that are not enacted law; bills not yet enacted are out of scope. The AI instruments seeded are Executive Order 26-02 and statewide policy SP-19.
- text: 'OWNER DECISION, Missouri GIS Advisory Council (sections 37.1300, 37.1310, 37.1320, effective 28 August 2026, L. 2026 S.B. 959): seeded as documents. The council is established within ITSD to advise on a statewide geospatial data infrastructure, which is state data governance, but it also names NG9-1-1 life-safety users and a Missouri 911 service board member, and domain.yml scopes out 911. The owner may prefer them left out as GIS rather than IT; section 37.1330 is cited by 37.1300 and the page says it does not exist.'
- text: Mixed sections seeded whole. Section 37.005 (Office of Administration powers, generally) and section 407.1500 (breach notification) are served by the Revisor one section per page, so non-IT subsections of 37.005 and the private-sector duties of 407.1500 ride along; recorded here for the owner (section-level slicing is not available from the page).
- text: 'Rules. https://www.sos.mo.gov/adrules/csr/current/1csr/1csr (Code of State Regulations Title 1, Office of Administration) was read whole: Division 10 (Commissioner of Administration, 16 chapters), Division 15 (Administrative Hearing Commission), Division 20 (Personnel Advisory Board and Division of Personnel), Divisions 30 and 35 (facilities), Division 40 (Purchasing and Materials Management, Chapter 1 Procurement), Division 50 (Missouri Ethics Commission), Division 60 (Joint Oversight Task Force for Prescription Drug Monitoring), Division 70 (Assistive Technology Advisory Council, moved to 5 CSR 110-1). The IT agency''s own rules are one chapter: 1 CSR 10-2 Privacy of Computer-accessible, Confidential Personal Information, a STUB (two-column PDF the shared reader cannot put in reading order; see its stub_reason). No rule of Division 10 is issued by ITSD as such; the rest of the title is left out as not IT: Division 10 chapters 1, 3, 4, 5, 8, 9, 10, 11, 12, 13, 15, 16, 17 and 18 (organization, claims, payroll, parking, direct deposit, shared leave, travel, social security, lottery prizes, cafeteria plan, convention complex, equal opportunity, retirement) and Divisions 15 to 70, and Division 10 Chapter 7 (see the accountability portal item above). Other agencies'' rules on IT are out of this seed''s reach: the Code was not searched across titles (it has no static index of subjects).'
- text: 'Statewide Policies page (https://oa.mo.gov/commissioners-office/policies/statewide), reconciled row by row: 18 rows (ITPS-001, SP-01, SP-02, SP-03, SP-04, SP-05, SP-06, SP-08, SP-09, SP-10, SP-11, SP-12, SP-13, SP-14, SP-17, SP-18, SP-19 and the State of MO Purchasing Card Policy and Procedure Manual; the page prints no SP-07, SP-15 or SP-16). 3 are seeded (ITPS-001, SP-18, SP-19), 15 are left out: SP-03 ''Wireless Telephone Equipment and Services Usage'' (policy on buying and monitoring state wireless telephone service and the cost of personal calls: telecom, which domain.yml scopes out); SP-01, SP-02, SP-04, SP-05, SP-06, SP-08, SP-09, SP-10, SP-11, SP-12, SP-13, SP-14 and SP-17 (tuition and dues reimbursement, vehicles, food, travel, aircraft, background checks, smoking, code of conduct, direct deposit, debt issuance: not IT); and the Purchasing Card manual (a card-program manual for purchases, not IT). The page marks no row as rescinded or superseded. ITPS-001 and SP-18 and SP-19 PDFs were read through the Fetcher (pdftotext, text layer present).'
- text: 'OA Administrative Policies page (https://oa.mo.gov/commissioners-office/policies/administrative), reconciled row by row: 51 rows (B-02 to B-40, C-01 to C-20 and the OA series). 4 are seeded (C-09 Software Use and Piracy, C-12 Internet Acceptable Use, C-16 Information Technology Projects, C-19 Breach Policy), 47 are left out: C-17 ''Wireless Telephone Equipment and Services'' (telecom, as SP-03); and 46 human resources, vehicle, travel, safety, property, ethics and work-schedule policies (for example B-36 Open Records, B-38 Background Checks, C-05 Code of Ethics, C-06 State Property, C-11 Travel, OA-32 Alternative Work Location), none about IT. These policies bind the Office of Administration''s own staff, as each seeded entry says. The page also links the ''OA Periodic Rule Review'' PDF (the Office''s rule-review plan under section 536.021, not an instrument: left out).'
- text: 'ITSD Approved Standards page (https://itsd.oa.mo.gov/it-governance/enterprise-architecture/security-domain/approved-standards-security-domain), reconciled row by row: 97 viewer-page links (3 disciplines: Management Controls, Operational Controls, Technical Controls; 22 technology areas; 72 compliance components), all 97 seeded and none left out. The Security Domain page (https://itsd.oa.mo.gov/it-governance/enterprise-architecture/security-domain) lists only the domain''s disciplines and technology areas; no other architecture domain page exists on the ITSD site (the Enterprise Architecture page links only the Security Domain). Two rows are titled ''Cryptography'' (a technology area and a compliance component): both are seeded under their own addresses. Where the PDF''s printed ''Name'' row differs from the index title (19 rows) the entry sets identity_text to the printed name. The compliance components print a creation date, review dates and an approval date in an audit-trail table, and their Emerging/Current/Twilight/Sunset and In Development/Under Review/Approved/Rejected check boxes are drawn marks with no text layer; they were read by rendering the classification and status rows of each committed PDF (pdftoppm, then a check of the drawn marks, with the unclear ones looked at by eye). Result for the 97 PDFs: none is marked Twilight or Sunset; each entry records its printed classification and status. 81 are marked Approved, two of them also Under Review (Current and Approved for most; the technology-area and discipline documents carry a status row only; mo-criteria-wireless-cc is Emerging and Approved; mo-firewall-environments-cc has no classification marked and is Approved); 16 are marked Under Review and not Approved (see the next item); the page lists all 97 as approved standards. The reading of the marks is by rendering and by eye, not by the text layer.'
- text: 'OWNER DECISION, Approved Standards marked Under Review. 16 standards print the status Under Review and not Approved: mo-information-security-policy-cc, mo-separation-duties-cc, mo-system-life-cycle-security, mo-disposal-phase-cc, mo-enterprise-patch-management-cc, mo-system-security-planning-procedure-cc, mo-configuration-management-cc, mo-physical-and-environmental-protection-controls-cc, mo-security-awareness-training-and-education, mo-contingency-plan-testing-training-exercises-and-maintenance-cc, mo-cryptography-cc, mo-password-controls-cc, mo-access-controls-cc, mo-securing-remote-connections-cc, mo-securing-mobile-devices-cc, mo-security-voice-over-internet-protocol-voip-cc. 2 print both Under Review and Approved marked: mo-background-screening-cc, mo-digital-signature-cc. For example mo-separation-duties-cc prints Under Review although its Date Approved / Rejected reads 12/18/2025. All are listed on the index page as Approved Standards and are kept as documents on that label as the status of record, and each entry says so; the owner may instead treat the 16 as under-review revisions and drop them, and decide for the 2 double-marked ones which mark governs.'
- text: 'OWNER DECISION, two published PDFs with a defective text layer or redline. (1) mo-management-controls (dsp-management-controls-12-31-02.pdf.pdf) prints unaccepted Word tracked changes, with Deleted margin balloons and red underlined insertions on page 2; the token Deleted followed by a colon rides along twice in the committed text (snapshot lines 127 and 133), and the file may be a draft or redline copy. (2) mo-itps-001 (ITPS-001, Laptop Encryption): the bold heading font is not embedded (pdftotext reports a non-embedded font using identity encoding, TimesNewRoman,Bold), so the heading reads ''I. General StatemenW'' in the text layer and in a poppler rendering; the committed text keeps the defect. Both are kept as documents with the defect recorded in the entry; the owner may prefer a stub for either (North Carolina precedent for a damaged text layer).'
- text: 'ITSD Enterprise Project Management Office page (https://itsd.oa.mo.gov/it-governance/enterprise-project-management-office): 6 links. 1 seeded (ITSD Change Control Policy). 5 left out as forms, templates and instructions: ''State of Missouri Fingerprint Background Screening Instructions'' (instructions for contractor fingerprinting), ''Contractor Agreement Form'', ''Project Deliverable Acceptance Form (PDAF)'', ''SOW FAQs (Project Based IT Consulting QVL)'' (FAQ for a vendor qualified list) and ''Status Report Template'' (a download).'
- text: 'ITSD Cost Allocation Plans page (https://itsd.oa.mo.gov/it-governance/cost-allocation-plans): 10 plans (Telecommunications and State Data Center, each FY23 to FY27), the billing-rate methodologies for ITSD services under section 37.005. Left out: financial plans and reports, not instruments (playbook: reports are not instruments). OWNER DECISION: the owner may want the current-year (FY27) plans as funding documents.'
- text: 'Pages read that carry no instrument and are left out: ITSD home, About ITSD, Chief Information Officer, IT Governance, Information Security (describes the Office of Cyber Security), Enterprise Architecture, Application Portfolio Management, Contracts & Bidding (points to the Division of Purchasing), Missouri Information Technology Advisory Council (MITAC) page and its linked ''Agenda for the August 2026 MITAC meeting'' (a meeting agenda); cybersecurity.mo.gov (public security-awareness tips and a travel checklist for employees, not an instrument); https://www.mo.gov/data-policy/ (the terms on which the public may reuse the site''s data, which binds the public).'
- text: |-
    Executive orders. The Governor's list (https://governor.mo.gov/actions/executive-orders, 4 pages, 25-02 to 26-22; its year filter offers 2024 to 2026) and the Secretary of State's year pages for 1980 to 2026 (https://www.sos.mo.gov/library/reference/orders and one page per year, all governors) were read. The Secretary of State's pages carry no summary, so every order page they link that the Fetcher returned (HTTP 200) was fetched and searched for information technology, cyber, artificial intelligence, computer, software, network, internet, data, privacy, e-government and technology; every order with a hit was read. 4 are seeded: 03-26, 05-07, 06-34 and 26-02. Left out:
     - OWNER DECISION: Executive Order 26-03 (Missouri GREAT initiative and operational task force, 01/13/2026): a government-efficiency order; one clause tells departments to explore modernized software and AI applications 'provided that any such initiative adheres strictly to the safety and security standards established in Executive Order 26-02'. Not an IT order; the owner may want it as a cross-reference to 26-02.
     - OWNER DECISION: Executive Order 26-18 (Automated License Plate Reader minimum standards, 09/16/2026): sets 30-day deletion, government ownership of data, vendor certification, search logging and a ban on AI facial-recognition integration for state agencies and state-funded local law enforcement using ALPR. It binds state entities and governs government-held data, but ALPR is law-enforcement technology, which domain.yml scopes out.
     - Executive Order 07-24 (Missouri Accountability Portal): financial transparency, with section 37.850 and 1 CSR 10-7 (see above).
     - Executive Order 07-31 (Rural High-Speed Internet Access Task Force): broadband, scoped out.
     - Executive Order 04-09 (certification of the location of vendors' work, offshore outsourcing, in bids): general procurement, with a recital on privacy of residents' personal information; not an IT order.
     - Executive Order 05-20 (Homeland Security Advisory Council, which lists the Chief Information Officer among its members) and Executive Order 18-03 (the same council): homeland security.
     - Executive Order 24-11 (rescinds 177 earlier orders, 80-11 to 18-12): a housekeeping order. It rescinded the IT orders 02-11 (state software piracy policy), 03-25 (cyber security policy), 06-03 and 09-27 (health information technology, health information exchange), which are therefore not in force; 02-15 (Missouri Security Council with a Cyber Security Committee) was rescinded by 05-20 and 03-18 (interoperable communications) by 24-11. None is seeded.
     - Every other order read has no information technology subject: emergencies and extensions, disaster declarations, boards, task forces, reorganization plans (the 1980 personnel plan 80-6 names the Department of Revenue's Information Systems Division only as an employer), closures of state offices, pardons and clemency, appointments.
     - Reading limits: 1,039 order pages (every order link on the 47 year pages, 1980 to 2026) were fetched through the Fetcher; for 164 of them the heading or layout is not one the Missouri reader accepts (1980 to 1996 notices, plans and brief orders, headings such as 'EXECUTIVE ORDER NO96-04', and several 2003 and 2021 pages), so they were searched with tags stripped. The search is by keyword: an order about IT that uses none of those words would be missed. Not verified: whether a later order amended 03-26, 05-07 or 06-34 without the page saying so (06-34 amends 03-26 expressly); the pages print 'Rescinded by' lines and none is printed on the four seeded orders.
