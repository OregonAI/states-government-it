  title: 'Section 407.1500, RSMo: Definitions, notice to consumer for breach of security, procedure, attorney general may bring action for damages'
  doc_type: statute
  jurisdiction: missouri
  issuing_body: Missouri General Assembly (Revisor of Statutes)
  tags:
  - data
  - cybersecurity
  recheck: monthly
  why_relevant: Missouri's breach-notification statute. It is seeded because its definition of 'person' includes 'government, governmental subdivision, governmental agency, governmental instrumentality', so it binds state agencies that own or license personal information of Missouri residents (notice to the affected consumer, to the attorney general and to consumer reporting agencies, after a breach of computerized personal information). The same section binds private persons; the page serves the whole section.
- id: mo-1-csr-10-2
  sha256: ''
  url: https://www.sos.mo.gov/cmsimages/adrules/csr/current/1csr/1c10-2.pdf
  format: pdf
  citation: 1 CSR 10-2
  title: 'Chapter 2: Privacy of Computer-accessible, Confidential Personal Information (1 CSR 10-2.010 and 1 CSR 10-2.020)'
  doc_type: rule
  jurisdiction: missouri
  issuing_body: Office of Administration (Commissioner of Administration), published in the Code of State Regulations
  tags:
  - data
  recheck: monthly
  stub: true
  stub_reason: The Secretary of State's file for the chapter (linked from https://www.sos.mo.gov/adrules/csr/current/1csr/1csr, Division 10, Chapter 2) is a 2-page, 62,312-byte PDF (HTTP 200, application/pdf, fetched through the toolkit Fetcher on 2026-11-12) set in two columns. The shared reader (pdftotext -layout) prints the two columns side by side on every line, so each printed line mixes a sentence of the left column with a sentence of the right one (for example '(1) Individual is any man, woman or child     (3) A written agreement to protect the right to'), and the extracted text is not the rule's text in reading order. Nothing could be committed as verbatim. The needed change is in the shared PDF reader (see shared_changes_needed); a Missouri module cannot override the PDF path.
  why_relevant: The Commissioner of Administration's rules (authority section 37.005.7, RSMo) requiring executive-branch agencies to keep a policy and procedure protecting computer-accessible, confidential personal information, to describe the information and who has access, to sign a written agreement before sharing it, and to certify annually. The chapter is two rules (definitions; privacy).
