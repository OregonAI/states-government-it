  doc_type: statute
  jurisdiction: missouri
  issuing_body: Missouri General Assembly (Revisor of Statutes)
  tags:
  - cybersecurity
  recheck: monthly
  why_relevant: Names the Cybersecurity Mission Act (sections 41.1015 to 41.1018, Chapter 41, effective 28 August 2026, L. 2026 H.B. 2593), the statute under which the Missouri National Guard may render cybersecurity aid to the state and to political subdivisions, public colleges and universities, law enforcement agencies, utility companies and critical infrastructure facilities.
- id: mo-rsmo-41-1016
  sha256: "ea7708bb9a9b0505659d87da712a83e54a743f861c9534b30eaa72631389fc03"
  url: https://revisor.mo.gov/main/OneSection.aspx?section=41.1016
  format: html
