# Missouri seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Discovery 2026-11-12 through the toolkit Fetcher: the ITSD site (itsd.oa.mo.gov: IT governance, enterprise architecture,
# Security Domain Approved Standards, EPMO, MITAC, cost allocation plans, application portfolio, information security,
# CIO pages), the Office of Administration's Statewide Policies and OA Administrative Policies pages (oa.mo.gov), the
# Revisor of Statutes (chapter 37 and 41 section lists and the section pages seeded), the Secretary of State's Code of
# State Regulations (Title 1) and executive-order pages, the Governor's executive-order list, cybersecurity.mo.gov.
sources:
- id: mo-rsmo-37-005
  sha256: "695d8ac185681ca074bc90c580981617d8c612ac9f597543f545aa663c020d2d"
  url: https://revisor.mo.gov/main/OneSection.aspx?section=37.005
  format: html
  citation: Section 37.005, RSMo
  title: 'Section 37.005, RSMo: Office of administration, powers and duties, generally'
  doc_type: statute
  jurisdiction: missouri
  issuing_body: Missouri General Assembly (Revisor of Statutes)
  tags:
  - governance
  - oversight
  - procurement
  - data
  recheck: monthly
  why_relevant: 'A section of the Office of Administration''s general powers (Chapter 37) that carries the statutory authority over state IT. The Revisor''s page serves the whole section, so the non-IT subsections ride along. Subsection 8 authorizes the commissioner of administration to coordinate and control the acquisition and use of network, telecommunications and data processing services in the executive branch: a long-range computer facilities plan, approval of additions and deletions of hardware, software and support services, standards for annual data processing application plans, review of applications against the state information systems plan, procurement procedures, and an inventory with an annual report to the General Assembly; the commissioner also adopts rules protecting the privacy of citizens and the confidentiality of information on computer storage. The authority section cited by 1 CSR 10-2.'
- id: mo-rsmo-37-110
  sha256: "b9e89f47c7f20ffa83ed0d3b2312a6d8ad805b136aff54c45ac4b01956662925"
  url: https://revisor.mo.gov/main/OneSection.aspx?section=37.110
  format: html
  citation: Section 37.110, RSMo
  title: 'Section 37.110, RSMo: Information technology services division established'
  doc_type: statute
  jurisdiction: missouri
  issuing_body: Missouri General Assembly (Revisor of Statutes)
  tags:
  - governance
  - oversight
  recheck: monthly
  why_relevant: 'The enabling statute for the Information Technology Services Division of the Office of Administration, the state''s central IT body (the division''s head is the state Chief Information Officer, a title the statute does not print): it requires the commissioner of administration to establish the division, which makes recommendations to all agencies and departments and to the General Assembly, and bars any agency from adding or disposing of state data processing equipment without the division''s approval. The Chief Information Officer is not named in any section found; the ITSD page ''Chief Information Officer'' (https://itsd.oa.mo.gov/chief-information-officer) describes the office.'
- id: mo-rsmo-37-920
  sha256: "55ba3b0fb4976dc0d780cc526c7e320ed919dd7c6225941eefba1a04b363256b"
  url: https://revisor.mo.gov/main/OneSection.aspx?section=37.920
  format: html
  citation: Section 37.920, RSMo
  title: 'Section 37.920, RSMo: Trust fund created for information technology expenses, use of moneys'
  doc_type: statute
  jurisdiction: missouri
  issuing_body: Missouri General Assembly (Revisor of Statutes)
  tags:
  - funding
  recheck: monthly
  why_relevant: Creates the Missouri Revolving Information Technology Trust Fund in the state treasury, to hold moneys transferred or paid to the Office of Administration by any state agency for information technology expenses to ensure the proper use and operation of IT equipment, software or systems; the funding model for ITSD charge-back.
- id: mo-rsmo-41-1015
