    citation: "N.J.S.A. 52:27B-67.2"
    title: "Disposition of surplus State computers and electronic devices"
    doc_type: "statute"
    jurisdiction: "new-jersey"
    issuing_body: "New Jersey Legislature"
    tags: [cybersecurity, data, procurement]
    recheck: "monthly"
    sections: ["52:27B-67.2"]
    found_via: "https://pub.njleg.gov/statutes/ (STATUTES-TEXT.zip, STATUTES.TXT)"
    why_relevant: "Binds every State entity: a surplus computer, equipment or portable communication device with a data storage device has its storage device removed and destroyed by any means the Office of Information Technology approves for data security, under the Office of Information Technology Reorganization Act. The Division of Purchase and Property develops the disposition program in consultation with the Chief Technology Officer. A single section in a non-IT chapter (OWNER DECISION, see left_out)."

  - id: "nj-eo-corzine-42"
    sha256: "3a03193853b74acb45392ac1009f885208b719335b226a11343b4b161ce39e25"
    url: "https://www.nj.gov/infobank/circular/eojsc42.htm"
    format: "html"
    citation: "Executive Order No. 42 (Corzine, 2006)"
    title: "Executive Order No. 42 (Corzine): Chief Technology Officer and Project Review Board (the Technology Governing Board provisions rescinded by Executive Order No. 414, 2026)"
    doc_type: "executive_order"
    jurisdiction: "new-jersey"
    issuing_body: "Governor of New Jersey"
    tags: [governance, oversight, funding]
    recheck: "annual"
    found_via: "https://www.nj.gov/infobank/eo/ (the Governor's executive order lists, every governor's page read)"
    why_relevant: "Establishes the State of New Jersey Technology Governing Board (direction, standards and priorities for executive branch IT; review of the Office of Information Technology's budget and of agency IT spending), the position of Chief Technology Officer with overall responsibility and authority for IT operations, the Project Review Board, and abolishes the Office's earlier governing board, rescinding provisions of Executive Orders 84 (1984) and 87 (1998). PARTLY RESCINDED: Murphy Executive Order No. 414 (signed 16 January 2026, https://www.nj.gov/infobank/eo/056murphy/pdf/EO-414.pdf) lists '49. the State of New Jersey Technology Governing Board, established pursuant to, inter alia, Executive Order No. 42 (2006)' among the Advisory Entities 'hereby terminated and abolished' and rescinds the portions of the orders that authorized them (it does the same for the Office of Information Technology Governing Board of Executive Order 87, item 31). What remains of Order 42 is the Chief Technology Officer, the Office's direction, the Deputy Chief Technology Officers, the Project Review Board (section 8, which reports to the abolished Board), the service level agreements, the annual report and the cooperation duty; whether the Project Review Board and the rest outlive the Board it reported to was not determined. N.J.S.A. 52:18A-227(f) continues the functions Order 42 granted. OWNER DECISION: whether a partly rescinded order stays in the corpus; the text is the order as the Governor's page prints it, with no marking of the rescission."

