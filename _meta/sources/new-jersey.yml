    title: "Cybersecurity incident reporting to the Office of Homeland Security and Preparedness"
    doc_type: "statute"
    jurisdiction: "new-jersey"
    issuing_body: "New Jersey Legislature"
    tags: [cybersecurity]
    recheck: "monthly"
    sections: ["52:17B-193.2", "52:17B-193.3", "52:17B-193.4"]
    found_via: "https://pub.njleg.gov/statutes/ (STATUTES-TEXT.zip, STATUTES.TXT)"
