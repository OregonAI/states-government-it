    doc_type: "statute"
    jurisdiction: "new-jersey"
    issuing_body: "New Jersey Legislature"
    tags: [data, cybersecurity]
    recheck: "monthly"
    sections: ["56:8-161", "56:8-163"]
    found_via: "https://pub.njleg.gov/statutes/ (STATUTES-TEXT.zip, STATUTES.TXT)"
    why_relevant: "Included for the provision that binds State agencies: a public entity that compiles or maintains computerized records with personal information must disclose a breach of security to affected New Jersey residents (56:8-163), with the definitions that go with it (56:8-161). The same sections bind any business that does business in New Jersey; the sections sit inside the Consumer Fraud Act chapter, so they are a section-level slice of a non-IT chapter (OWNER DECISION, see left_out)."

  - id: "nj-njsa-52-27b-67-2"
    sha256: "544c72c3a44669f52443225ca9eb4e415eef7896cdd58c6cc776d0bbd87594df"
    url: "https://pub.njleg.gov/statutes/STATUTES-TEXT.zip#52:27B-67.2"
