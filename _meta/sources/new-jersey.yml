# New Jersey seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Discovery 2026-11-11 through the toolkit Fetcher: the NJOIT Policy Library and Enterprise Governance pages, the Legislature's
# bulk statutes file (pub.njleg.gov), the Governor's executive order lists (nj.gov/infobank/eo), the Treasury's circular letters
# and rule-actions pages, the Office of Administrative Law's pages. Statute entries share one source file (see left_out, last item).
# Statute entries (7): each url is the 41 MB STATUTES-TEXT.zip with a #section fragment that is never sent, but the entry's sha256 is a
# hash of the JSON slice bundle cut from the file. The monthly drift run (corpus-detect-changes) GETs each url whole and hashes the zip, so
# it would download the zip seven times and report every one of these seven entries as changed every run: treat that as noise until
# corpus-toolkit can recheck a sliced bulk source (`recheck:` is not honoured by the toolkit). Drift is the toolkit's; it was not run here.
# Same noise as California's pubinfo slices (see california.yml). Shared change for the PR: a toolkit change to recheck a sliced source.
sources:

