left_out:
  - text: "---- New Jersey: found and left out (each was seen on an official page on 2026-11-11; the reason is recorded here). Every page was fetched through the toolkit Fetcher; nothing was read by any other client."
  - text: "NJOIT Policy Library (https://www.nj.gov/it/whatwedo/policylibrary/), read row by row: 38 table rows in 9 accordion sections as a visitor sees them (the HTML also holds 27 comments, four of which wrap table rows, listed below). Every row ends as follows.\n - Documents, 26: 17-03-NJOIT, 18-02-NJOIT, 09-05-NJOIT, 09-05-S1-NJOIT, 15-03-NJOIT, 11-01-S1-NJOIT, 15-06-NJOIT, 09-11 (listed as 09-11-P1-NJOIT), 07-10-NJOIT, 16-02-NJOIT, 16-02-P1-NJOIT, 11-05-NJOIT, 18-01-NJOIT, 13-09-NJOIT, 25-OIT-001, 22-07-NJOIT, 20-01-NJOIT, 20-01-A-NJOIT, 19-01-NJOIT, 16-05-NJOIT, 16-05-P1-NJOIT, 16-03-NJOIT, 15-05-NJOIT, 14-11-NJOIT, 06-06-NJOIT and the Cybersecurity Incident Response Plan.\n - Stubs, 2: the Statewide Information Security Manual (the only link is behind an Incapsula challenge) and 11-01-P1-NJOIT (the row has no link).\n - Left out, 9, all forms, templates, workbooks or contact rosters, not instruments: 'Form to 09-11-P1-NJOIT' Extranet Connection Form (0145_NJOIT_Extranet_Connection_Form.pdf, a blank form); 16-02-NJOIT-F1 New Jersey Information Technology Expenditure Report (an .xlsx workbook; no policy text); 16-02-NJOIT-F2 Expenditures Report Agency Certification Form (a 1-page signature form); 18-01-F1-NJOIT Employee Expenditure Worksheet (a blank worksheet); Appendix A and Appendix B to 11-01-P1-NJOIT, the Remote Access Registration Forms for Non-State and State Employees (blank registration forms); Risk Management Remediation Report Template (0166_...xls, a spreadsheet template); Cellular Wireless Device and Portable Computing Device Request (0151_..., a blank order form); and 'OIT Cybersecurity Incident Response Plan Team Roles & Contact Information' (NJOIT_Cybersecurity_Incident_Response_Team_Roles_Contacts.pdf, 10 pages: a quick user guide that summarises the Plan and lists team contacts; OWNER DECISION, the library lists it as a document and it is the Plan's contact appendix).\n - One empty row in the Governance section (no text, no link).\n - Rows the page's own HTML comments hide from a visitor (not shown, not seeded): the Governance-section copies of 09-05-S1 and 09-05 (moved to Governance, which are seeded from the visible rows), 15-03 under Network Management, and, under Prevention and Protection, Portable Computing User Agreement (0159), State-Owned Property Removal Form (0045), Media Disposal Forms (0121-0124); under Privacy, 14-04-NJOIT Disclaimer Policy, 14-04-S1-NJOIT Disclaimer Standard and an older 13-09 link; SAS Software Request Form (0204); in Enterprise Architecture, J2EE Application Deployment Policy and Procedures and NJ Shared IT Architecture (Shared_IT_Architecture.pdf). The commented-out status of each is the site's, and none is a current visible row."
  - text: "Second NJOIT listings of the same agency's instruments. Enterprise Governance (https://www.nj.gov/it/whatwedo/governance/, 5 rows): 25-OIT-001 and 16-03-S1 to S4, all seeded; the S1 to S4 standards are not in the policy library. System Architecture Review (https://www.nj.gov/it/whatwedo/sar/): lists 16-05-NJOIT and 16-05-P1-NJOIT (seeded); left out: the TIP and Business Impact Analysis Survey (SimpliGov web forms), the four LSAR and Implementation Review templates (.docx, blank templates), and the SAR FAQs page (/it/whatwedo/sar/faqs.shtml, linked, not fetched; an FAQ is not an instrument). OIT Tactical Planning (https://www.nj.gov/it/whatwedo/tpu/): a survey, an intermittent submission form, the Tactical Planning Process FAQs (0232, PDF), the Project Portfolio Status Template (.xlsx) and the Maintenance and Refresh Cost Estimates Templates (.docx, .xlsx); forms, templates and FAQs, none seeded. For Agencies (https://www.nj.gov/it/business/agencies/): an RFP template marked 'under revision' and the Project Management Appendix (an RFP appendix, linked, not fetched). For Vendors (https://www.nj.gov/it/business/vendors/): the vendor relations portal, NJSTART, a Mutual Non-Disclosure Agreement (.doc), commodity code and bidding links: forms and portals. About Us (https://www.nj.gov/it/about/overview/) describes the Office and was read for background; the NJOIT Strategic Plan (https://www.nj.gov/it/docs/NJOIT_Strategic_Plan.pdf, linked from its menu, not fetched) is a strategy document, not an instrument. NJ Web Presence Hub: the Guidelines page and the Accessibility page (which explains the federal ADA Title II web rule for State agencies and links an accessibility checklist, /it/wphub/docs/accessibility_checklist.pdf, not fetched) are web pages that describe and link; the Guidelines PDF is seeded as a standard (OWNER DECISION: it is branding and usability standards from the Digital Services Unit, not in the policy library; the Website Service Proposal and Universal NJ Icon Usage it links were not fetched)."
  - text: "Joint Circular 23-OIT-007 (State of New Jersey Interim Guidance on Responsible Use of Generative AI, https://www.nj.gov/circulars/23-oit-007.pdf, fetched and read): not in the library; its replacement 25-OIT-001 prints 'SUPERSEDES: 23-OIT-007', so it is not in force and is not seeded. The NJ AI Assistant and AI training pages on innovation.nj.gov were named by a web search only and not fetched, so nothing from them is used."
  - text: "State circular letters (https://www.nj.gov/infobank/circular/, 102 rows read in full). Seeded: 24-04-OMB/DPP/OIT (IT procurement) and, as stubs because the PDFs are scans, 15-05-OMB/OIT, 15-04-OMB/OIT, 14-15-DPMC/OIT and 14-12-DORES/OIT (the rows whose number names the Office of Information Technology) and 13-18-DPP (a Treasury circular on surplus computers, included by subject). Left out, joint with OIT: 24-22-DPP/OMB/OIT 'Professional Services: Review, Control, Monitoring, and Extensions' (fetched and read: a general professional-services procurement circular, not an IT instrument). Left out, issued by the Treasury alone, OWNER DECISION on whether a Treasury circular on IT as a function is in the corpus (13-18-DPP, on disposal of surplus computers, is a stub like the four joint scans because it carries out a seeded statute; the ones below are accounting, records or reporting circulars): 23-05-OMB (accounting for subscription-based IT agreements under GASB 96; an accounting instruction, fetched), 26-12-OMB (year-end reporting, including software reporting; not fetched), 19-12-OMB (asset inventory including software; not fetched), 10-02-OMB 'Automated Records Management/Storage Systems and Related Services', 03-10-ST 'Managing Electronic Mail: Guidelines and Best Practices', 01-01-ST 'UETA Guidance' and 10-08-ST 'Microfilming of Public Records and Purchase of Micrographic Equipment' (none fetched). The remaining rows are budget, payroll, travel, vehicles, real property and benefits circulars, not IT."
  - text: "Executive orders. Lists read in full through the Fetcher with every governor's page: Sherrill (/infobank/eo/057sherrill/approved/eo_archive.shtml, orders 1 to 28), Murphy (eo_archive.shtml, orders to 415, re-read in full on 2026-11-11 after review, and eo_archive.html, orders to 277), Christie, Corzine, Codey, McGreevey, Bennett, DiFrancesco, Whitman, Florio and Kean (the earlier governors' index pages). Rows matching technology, cyber, information, data, artificial, computer, internet, website, geographic, network, security, telecom or privacy were read; seeded: Corzine 42, Christie 178 and 225, Murphy 44, 346 and 404. Left out: Corzine 5 (2006, creates the Office of Homeland Security and Preparedness; fetched; Order 404 section 29 prints 'Executive Order No. 5 (2006) is hereby superseded', so Order 5 is not in force and is not seeded; there is no owner decision to make); Murphy 414 (16 January 2026, https://www.nj.gov/infobank/eo/056murphy/pdf/EO-414.pdf, fetched and read in full: terminates 51 advisory entities and rescinds the portions of earlier orders that created them; it is not an IT instrument itself, so it is not seeded, but item 49 (the State of New Jersey Technology Governing Board, Corzine 42) and item 31 (the Office of Information Technology Governing Board, Whitman 87) rescind IT-governance provisions, recorded on the Corzine 42 entry) and Murphy 415 (16 January 2026, terminates States of Emergency; not read beyond its list description, not IT); Kean 84 (1984) and Whitman 87 (1998), rescinded by Corzine 42 and Corzine's 42 itself lists them as rescinded; Whitman 122 (Geographic Information Council in OIT; the Whitman list marks it 'Rescinded by EO #40 Christie'); Murphy 9 (2018, requires that Internet, data and telecommunications contracts go to providers that follow net neutrality principles; fetched; telecommunications, out of scope); Murphy 41 (Future of Work Task Force, workforce and economy); Sherrill 4, 5 and 6 (office of the Chief Operating Officer; regulatory simplification teams; children's mental health and digital environments, fetched 5 and 6: not state IT); McGreevey 111 (Homeland Security Technology Systems Center at NJIT, a university center); Corzine 51 (appointments database; only its list description was read). Sherrill's orders 1 to 28 contain none on State IT, data or AI. Policy 17-03-NJOIT prints 'Executive Order #404 (Murphy 11/18/26)'; the Governor's list dates Order 404 2025/11/12 and the order itself is signed in 2025 (the printed date in 17-03-NJOIT is as published)."
  - text: "Statutes. Source: the Legislature's STATUTES-TEXT.zip (https://pub.njleg.gov/statutes/, one 84 MB file, STATUTES.TXT, 53,807 section headings, banner 'UPDATED THROUGH P.L.2026, c.50, and J.R.1'; the directory listing dates it 11/11/2026 6:00 AM). Seeded: seven slices (see sources). Searched in the whole file: 'artificial intelligence' (17 hits in 9 sections), 'machine learning', 'generative', 'algorithm', 'deepfake', 'automated', 'Office of Information Technology' (31 sections), 'Chief Technology Officer' (24), 'Chief Information Officer', 'cybersecurity' (17), 'Cybersecurity and Communications', 'information technology' (91), 'public entity', 'breach of security', 'TikTok', 'ByteDance', 'covered application'. The only statute that tells State agencies to do anything about AI is N.J.S.A. 52:18A-230(f) (the Chief Technology Officer's annual evaluation of AI, machine learning and cloud services by State agencies), inside the seeded Act. Left out, AI: 34:1B-323, 34:1B-395, 34:1B-397, 34:1B-398 (tax credits for companies; private), 2C:21-17.7 and 2C:21-17.8 (deepfake crimes; out of scope), 45:5A-2 (alarm contractor licensing), 56:9-22 (an antitrust algorithm definition). Left out after the review, each read in the file on 2026-11-11: 2C:52-5.4 (the State's automated 'clean slate' process for expungement; the Chief Technology Officer sits on its task force; criminal records, not State IT policy), 39:3-10w (a verifier or digital wallet provider must report cybersecurity incidents involving digital driver's licenses to the Motor Vehicle Commission; binds private verifiers and wallet providers; OWNER DECISION, it is a cybersecurity reporting duty inside the motor vehicle chapter), 35:3-4 (a public entity whose website suffers a cyberattack may publish legal notices elsewhere; publication law), 18A:64A-93 (a pathways-to-careers programme that lists cybersecurity among fields; education), 24:6I-7.2 and 24:6I-36 (cannabis permit and licence applications that must include cybersecurity procedures; private applicants), 30:4D-67 (the iPHD project governing board in the Department of Health; health data project, not State IT policy), 5:12-14.2a (a casino definition of 'Corporate Officer' that names a chief information officer), and 52:27B-67.1 (distribution of surplus State computer equipment to schools and nonprofits, the neighbour of the seeded 52:27B-67.2 and cross-referenced by it; property disposition rather than data security; OWNER DECISION on whether it belongs beside 67.2). Left out, sections that mention the Office or the Chief Technology Officer but are not about State IT: 52:17C-1 to 52:17C-20 (Office of Emergency Telecommunications Services, 9-1-1; out of scope) and 52:17C-3.4 (Big Data Alliance, a research consortium), 52:27C-97 (a foundation's board), 30:1A-12.1 (a hunger link on department websites), 52:14-43 and 52:14-44 (language access plans), 52:14-15.107 (salaries), 52:16A-111 (a nonprofit information icon), 52:34A-8 (electronic procurement practices in the Treasury's procurement rules), 52:27D-10.1 (fees for a State computer network), 6:1-44.3 (airport directory), 40A:65-6.1 (local shared IT services), 58:31-2 to 58:31-4.2 (cybersecurity programs of water purveyors; binds water systems, not State agencies), 56:8-166.20 (data broker registration; private), 56:8-162, 56:8-164 and 56:8-165 (the rest of the personal-information article: business record destruction, Social Security number display and rules), 47:1A (Open Public Records Act) and 47:3 (public records; records management), 12A:12 (Uniform Electronic Transactions Act, general commercial law), 52:18A-235 on (school facilities) and 52:18A-220 to 223 (risk management). OWNER DECISION: the playbook leaves sections inside non-IT chapters out pending a decision on section-level slicing; this source is one file of all sections, so every New Jersey statute document is a section list. Two are in non-IT chapters and are seeded on the playbook's own item 2 (breach and data statutes where they bind State agencies): 56:8-161 and 56:8-163 in the Consumer Fraud Act chapter, and 52:27B-67.2 in the Division of Property Management article; a reviewer who wants none of the slicing can remove those two entries."
  - text: "Administrative rules (N.J.A.C.). The Administrative Code is published for reading only through a Lexis portal: the Office of Administrative Law's pages (https://www.nj.gov/oal/rules/overview/ and /oal/rules/portal/, HTTP 200, read) link http://www.lexisnexis.com/hottopics/njcode/, which redirects to an advance.lexis.com container and answered HTTP 200 with a 3,696-byte script shell, no rule text. No rule is a document. The list read for the Office of Information Technology's rules is the Treasury's rule-actions table (https://nj.gov/treasury/rulesamend.shtml, 284 rows; watched below): three rows name the Office of Information Technology, all for N.J.A.C. 17:24, the 9-1-1 Emergency Telephone System (proposal 2018-03-05, readoption 2018-10-01, notice of readoption 2025-08-18, https://www.nj.gov/njbonds/treasury/proposed_rules/17_24NofR-57NJR1884a.pdf by its link, not fetched). 9-1-1 is out of scope (domain.yml: broadband, 911 and telecom), so chapter 17:24 is left out, not stubbed. No other chapter of the Code was found to belong to the Office of Information Technology in any page read; this is a statement about that table only, and the Code itself could not be searched."
  - text: "Seed-list shape (for the reviewer). The seven statute entries share one source file, so they are distinguished two ways the shared seed check required: the entry's url carries a fragment naming its first section (the zip address followed by # and the section, as in STATUTES-TEXT.zip#52:18A-224; a fragment is never sent in a request, and the state module removes it) and the sections it holds are listed in a `sections` key of the entry, because the shared check accepts a `slice` only on California and Colorado entries. The drift run (never run here) would fetch the 41 MB zip once per entry. Shared change proposed in the PR body: let the seed check accept `slice.sections` for new-jersey."
