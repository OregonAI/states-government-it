    title: "Office of Information Technology Reorganization Act"
    doc_type: "statute"
    jurisdiction: "new-jersey"
    issuing_body: "New Jersey Legislature"
    tags: [governance, oversight, ai, cloud-resilience]
    recheck: "monthly"
    sections: ["52:18A-224", "52:18A-225", "52:18A-226", "52:18A-227", "52:18A-229", "52:18A-230", "52:18A-231", "52:18A-232", "52:18A-233", "52:18A-234"]
    found_via: "https://pub.njleg.gov/statutes/ (STATUTES-TEXT.zip, STATUTES.TXT)"
    why_relevant: "The enabling statute for the Office of Information Technology (NJOIT) and the State Chief Technology Officer (the State's CIO): the Act's short title, findings and definitions, the Office (in but not of the Department of Treasury, responsible for the information technology infrastructure of the Executive Branch), the Chief Technology Officer's appointment and authority (including the annual evaluation of artificial intelligence, machine learning and commercial cloud services by State agencies, 52:18A-230(f)), the Deputy Chief Technology Officers, the New Jersey Information Technology Project Review Board, reports, and the duty of State agencies to cooperate. The file prints no section 52:18A-228. The sections printed between 52:18A-233 and 52:18A-234 belong to a separate act and are the next document."

