# South Dakota seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Discovery 2026-11-12 through the toolkit Fetcher: the Legislature's statute API (chapter pages 1, 1-13, 1-27, 1-33,
# 5, 5-18A, 5-18D, 22-40 and the sections of 1-13, 1-33, 5-18A and 22-40 named below), its rules API and sitemaps
# (Rules.xml, Rules.1.xml, Statutes.xml, Statutes.1.xml), rules.sd.gov, the Secretary of State's executive-order page
# (sdsos.gov) and every order PDF named below, the Bureau of Information and Technology and Bureau of Human Resources
# and Administration portal pages (sd.gov), and the Legislative Research Council's issue memorandum on AI in government.
sources:

- id: sd-sdcl-1-33-bit
  sha256: "b2db500cf84ea370a013d0753a7e4fb5be029dca3960d0803d276ccffe668f9e"
  url: https://sdlegislature.gov/api/Statutes/1-33.html#1-33-31
  format: json
  citation: SDCL 1-33-31, 1-33-33, 1-33-37 to 1-33-51, 1-33-53 to 1-33-55, 1-33-63 to 1-33-65
  title: Department of Executive Management, Bureau of Information and Technology (sections of SDCL chapter 1-33)
  doc_type: statute
  jurisdiction: south-dakota
  issuing_body: South Dakota Legislature
  tags: [governance, oversight, procurement, funding, cybersecurity]
  recheck: monthly
  sections: ["1-33-31", "1-33-33", "1-33-37", "1-33-38", "1-33-39", "1-33-40", "1-33-41", "1-33-42", "1-33-43", "1-33-44", "1-33-45", "1-33-46", "1-33-47", "1-33-48", "1-33-49", "1-33-50", "1-33-51", "1-33-53", "1-33-54", "1-33-55", "1-33-63", "1-33-64", "1-33-65"]
  found_via: https://sdlegislature.gov/api/Statutes/1-33.html (the chapter's list of sections; each section page is https://sdlegislature.gov/api/Statutes/<section>.html)
  why_relevant: 'The enabling statute for the Bureau of Information and Technology (formerly Information and Telecommunications; renamed by Executive Reorganization Order 2026-02, SL 2026, ch 1) and its commissioner: the Bureau created in the Department of Executive Management (1-33-37), the commissioner''s powers and duties and the commissioner''s appointment by the Governor (1-33-38, 1-33-39), the Bureau''s divisions and contracting (1-33-31, 1-33-40, 1-33-41), definitions (1-33-42), its functions including proposing operational technical standards for the state information systems (1-33-43), the Bureau''s approval of agency requests to acquire data processing, telecommunication and office equipment and services (1-33-44), the data processing service agency and agreements with political subdivisions (1-33-45), equipment funds and lease-purchase (1-33-47, 1-33-48), rulemaking and administrative charges (1-33-49, 1-33-64), the data processing internal service fund and its fee schedule (1-33-50, 1-33-51), leasing, maintenance and termination terms for data processing contracts (1-33-53 to 1-33-55), background investigation of information technology employees and contractors (1-33-63), and the Bureau''s arrangement of data processing, office systems and telecommunications for the Bureau of Human Resources and Administration''s contracts (1-33-65). Sections 1-33-31 and 1-33-33 name the Bureau and, as printed, the network it operates. Sections of the chapter that are repealed are not included; sections about educational telecommunications are left out (see left_out).'

- id: sd-eo-2022-10
  sha256: "0622bd49149406b0db715e3558a804e69db67260a0e5847a32ddaf0efd81a1b7"
  url: https://sdsos.gov/general-information/executive-actions/executive-orders/assets/2022-10.PDF
  format: pdf
  citation: Executive Order 2022-10
  title: Prohibition of the Use of TikTok Application on Government-Issued Devices
  doc_type: executive_order
  jurisdiction: south-dakota
  issuing_body: Office of the Governor
  tags: [cybersecurity, governance]
  recheck: monthly
  ocr: true   # a scan with no text layer: read by the two-engine OCR procedure (src/ingest.py); the text is a machine reading
  found_via: https://sdsos.gov/general-information/executive-actions/executive-orders/search/ (row 2022-10, filed 20221129; the link as the page prints it)
  why_relevant: 'Governor Noem''s order that no state employee or agency may download or use the TikTok application or visit its website on government-issued devices, and that no person or entity contracting with the State may do so on state-owned or state-leased equipment. In force: it is on the Secretary of State''s list and is not among the orders rescinded by Executive Order 2025-08 (its list read in full by OCR, about 150 numbers; 2022-10 is not in it); Executive Order 2023-06 continues it.'

- id: sd-eo-2023-06
  sha256: "f17145103e675115802f2e8d9c08cef167e265629a467d840ac980eecc5a6f47"
  url: https://sdsos.gov/general-information/executive-actions/executive-orders/assets/2023_Executive_Orders/2023-06.PDF
  format: pdf
  citation: Executive Order 2023-06
  title: Banning Tencent for State Government
  doc_type: executive_order
  jurisdiction: south-dakota
  issuing_body: Office of the Governor
  tags: [cybersecurity, governance]
  recheck: monthly
  ocr: true   # a scan with no text layer: read by the two-engine OCR procedure (src/ingest.py); the text is a machine reading
  ocr_psm: 4
  found_via: https://sdsos.gov/general-information/executive-actions/executive-orders/search/ (row 2023-06, filed 20230504; the link as the page prints it)
  why_relevant: 'Governor Noem''s order barring state employees, agencies and state contractors from downloading or using any application or website owned or controlled by Tencent Holdings, including WeChat, on government devices or state-owned or state-leased equipment, and directing the Commissioner of the Bureau of Information and Telecommunications to designate other applications, websites and services detrimental to state security (consistent with Executive Order 2022-10) and to keep a public list of them. The Commissioner''s designations are the authority for later bans of other applications. In force: not among the orders rescinded by Executive Order 2025-08.'

- id: sd-eo-2026-02
  url: https://sdsos.gov/general-information/executive-actions/executive-orders/assets/2026%20Executive%20Orders/2026-02.pdf
  format: pdf
  citation: Executive Order 2026-02
  title: Executive Reorganization Order 2026-02 (Rename BIT)
  doc_type: executive_order
  jurisdiction: south-dakota
  issuing_body: Office of the Governor
  tags: [governance]
  recheck: monthly
  stub: true
  stub_reason: 'A scan with no text layer (3 pages). The two-engine OCR procedure refuses it: tesseract and PaddleOCR agree on the words but only 57% to 64% of the 190 to 243 figures (needs 90%) under page-segmentation modes 3, 4, 6, 11 and 1, because page 3 is a dense list of section numbers (Title 1: 1-13-1.1; 1-33-26 to 1-33-64 and so on) on a dark scan. The ingester will not promote a reading whose section numbers are contested. Retry when the Secretary of State serves a cleaner file or the owner approves a manual reading.'
  found_via: https://sdsos.gov/general-information/executive-actions/executive-orders/search/ (row 2026-02 "Rename BIT", filed 20260113; the link as the page prints it, with its space written %20)
  why_relevant: 'Governor Rhoden''s reorganization order, submitted to the Legislature on 13 January 2026 and effective ninety days after submission: transfers the functions and programs of the former Bureau of Information and Telecommunications and of its Commissioner to the Bureau of Information and Technology and the Commissioner of Information and Technology, and directs the Code Commission to make the name change in the listed sections of the Codified Laws (which is why the section pages of SDCL 1-33 cite SL 2026, ch 1 (Ex. Ord. 26-2)). The title is the Secretary of State list''s row title wrapped around the order''s own heading.'

- id: sd-itsp-contractor-6-0
  url: https://www.sd.gov/bit?id=kb_article_view&sysparm_article=KB0010792
  format: html
  citation: BIT Information Technology Security Policy (ITSP) - Contractor
  title: Information Technology Security Policy (ITSP) - Contractor
  doc_type: policy
  jurisdiction: south-dakota
  issuing_body: Bureau of Information and Technology
  tags: [cybersecurity, governance]
  recheck: monthly
  stub: true
  stub_reason: 'The Bureau''s knowledge-base page serves a 950,996-byte shell whose title is the policy''s name and whose body is the word Loading: its text and attachment links are drawn by the portal''s script from endpoints this corpus may not call (no policy text and no link in the bytes). The same policy is public as a procurement attachment, https://bfm.sd.gov/solicitations/23RFP8794_ITSecPolicy.pdf (68 pages, cover "Contractor Version 6.0 March 2022", PDF dated 30 March 2026), but 67 of its 68 pages print the footer NOT FOR PUBLIC DISTRIBUTION (the cover has none; measured with pdftotext) and it is not the Bureau''s own page. Its currency is also unconfirmed: this is the March 2022 edition (footer 03/2022) while the client version is dated March 2026, so it may not be the current contractor edition (a web search, not confirmed in bytes, names a March 2024 contractor version). OWNER DECISION whether to mirror it, covering both the legend and the currency (it reads as text with pdftotext).'
  found_via: web search for the Bureau's ITSP; the title is the page title in the bytes fetched
  why_relevant: 'The Bureau''s statewide information technology security policy for contractors working on or with State IT resources: general policy, the Chief Information Security Officer, the Security Infrastructure and Security Operations Teams and the BIT Executive Working Group on Cyber Security, background checks, confidentiality, incident reporting and the platform security sections (per the contents of the bfm.sd.gov copy).'

- id: sd-itsp-client-6-0
  url: https://www.sd.gov/sys_attachment.do?sys_id=bf0ea0f39710c350b369b94de053af82
  format: pdf
  citation: BIT Information Technology Security Policy, Client Version 6.0 (March 2026)
  title: Information Technology Security Policy, Client Version 6.0
  doc_type: policy
  jurisdiction: south-dakota
  issuing_body: Bureau of Information and Technology
  tags: [cybersecurity, governance]
  recheck: monthly
  stub: true
  stub_reason: 'The file is served to the Fetcher (HTTP 200, a 113-page PDF with a text layer, PDF dated 23 April 2026) from sd.gov''s attachment path, but no page in the bytes fetched links to it (the Bureau''s portal pages are scripted shells), and every page prints the footer NOT FOR PUBLIC DISTRIBUTION (112 occurrences of the footer in 113 pages; cover "Client Version 6.0 March 2026", footer date 03/2025). OWNER DECISION whether the legend bars mirroring a file the State serves openly; if not, remove stub and stub_reason and run the ingester.'
  found_via: web search; the URL was not on a page read through the Fetcher
  why_relevant: 'The Bureau''s statewide information technology security policy for State employees and agencies (the client version of the policy whose contractor version is the entry above): general policy, the CISO and security teams, electronic monitoring, remote access, confidentiality, security awareness, regulated data, incident reporting, social media, and mainframe, server, network and data-center security sections.'

- id: sd-bit-ai-guidance
  url: https://www.sd.gov/bit?id=bit_standards_ai_guidance
  format: html
  citation: BIT Standards AI Guidance
  title: BIT Standards AI Guidance
  doc_type: standard
  jurisdiction: south-dakota
  issuing_body: Bureau of Information and Technology
  tags: [ai, governance]
  recheck: monthly
  stub: true
  stub_reason: 'The page exists (its title in the bytes is "BIT - Standards AI Guidance") but is the same scripted shell as every page of the Bureau''s portal: 950,832 bytes with no text of the guidance and no link to a document; the text is drawn from portal endpoints this corpus may not call.'
  found_via: a third-party index of the State's generative-AI guidance named this URL; the page title is from the bytes fetched
  why_relevant: The Bureau's guidance on artificial intelligence for state agencies, which a third-party index dates to 2024 and describes as guidelines for responsible use of AI-generated content (not confirmed in bytes).

- id: sd-bhra-genai-acceptable-use
  url: https://www.sd.gov/bhra?id=cs_kb_article_view&sysparm_article=KB0044679&sys_kb_id=21e2888497f90350b369b94de053af30&spa=1
  format: html
  citation: State of South Dakota Generative Artificial Intelligence Acceptable Use Policy
  title: State of South Dakota Generative Artificial Intelligence Acceptable Use Policy
  doc_type: policy
  jurisdiction: south-dakota
  issuing_body: Bureau of Human Resources and Administration
  tags: [ai, governance]
  recheck: monthly
  stub: true
  stub_reason: 'The portal page (title in the bytes "BHRA - Bureau of Human Resources and Administration - Statewide Policies") is a 968,188-byte scripted shell with no policy text; the policy''s title and this URL are from footnote 7 of the Legislative Research Council''s issue memorandum "Artificial Intelligence in Government" (https://mylrc.sdlegislature.gov/api/Documents/307445.pdf, read through the Fetcher), which also quotes it. The quotation is not the document.'
  found_via: footnote 7 of https://mylrc.sdlegislature.gov/api/Documents/307445.pdf
  why_relevant: 'The executive branch''s generative-AI policy as the Legislative Research Council''s memorandum describes it: an employee may use generative AI tools for work only with the approval of agency leadership, must review the output, and must follow the agency''s rules for sensitive or confidential data. It is a Bureau of Human Resources and Administration policy that governs state employees'' use of AI.'

- id: sd-accessibility-policy
  url: https://www.sd.gov/cs?id=kb_article_view&sysparm_article=KB0010219
  format: html
  citation: South Dakota Online Accessibility Policy
  title: South Dakota Online Accessibility Policy
  doc_type: policy
  jurisdiction: south-dakota
  issuing_body: State of South Dakota
  tags: [digital-services, governance]
  recheck: monthly
  stub: true
  stub_reason: 'The policy''s page is a 979,480-byte scripted portal shell (title in the bytes "CS Knowledge Article View - Citizen Services") with no policy text; the text is drawn by the portal''s script from endpoints this corpus may not call. The old address https://public.sd.gov/accpolicy.aspx (titled "Accessibility Policy - sd.gov", heading "South Dakota Online Accessibility Policy") prints only: "The accessibility policy for SD State Government has moved. Please visit" the KB0010219 URL.'
  found_via: the redirect notice on https://public.sd.gov/accpolicy.aspx (the address http://sd.gov/accpolicy.aspx is linked from the footer of the Secretary of State's executive-order list page); the title is the heading of that notice
  why_relevant: The accessibility policy for South Dakota State Government's online presence, a statewide digital-services policy binding state government web content (its text could not be read, so its terms are not described here).

