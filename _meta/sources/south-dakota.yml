  why_relevant: 'The list of the Governor''s executive orders by year (this read: 2026-01 to 2026-11 down to 2020-34), with the three sets of orders rescinded by Executive Order 2025-08. An order added or removed raises a review-the-seed-list report. The Governor''s own executive-orders page answered the Fetcher with an error page ("Oops! There seems to have been an error").'

left_out:
- text: |-
    Bureau of Information and Technology policy and standards library: NOT ENUMERABLE, so the playbook's "every item in the statewide library" is not met. The Bureau's pages (https://www.sd.gov/bit, https://bit.sd.gov/, https://bit.sd.gov/bit?id=bit_policies_standards, https://www.sd.gov/bit?id=bit_policies, https://www.sd.gov/bit?id=bit_standards) were fetched. Each is a ServiceNow Service Portal shell of about 950,000 bytes whose body is the word Loading: no policy name, no document link and no attachment path (0 occurrences of "sys_attachment" in the bytes). Three of the five (bit_policies_standards, bit_policies, bit_standards) carry "Not Found" in their title. The list is drawn by the portal's script from the portal's own endpoints, which this corpus may not call, so no row of the library was read, and no watch entry is possible (the shell carries no list to hash). Items known only from other sources are the stubs above (ITSP contractor and client versions, the AI guidance page). The Bureau's list of banned applications that Executive Order 2023-06 orders to be kept public on the Bureau's website was not found for the same reason. NEEDS A DECISION: a documented list feed or static export from the Bureau, or an owner-approved route.
- text: |-
    Bureau of Human Resources and Administration "Statewide Policies" portal page (the page the AI acceptable-use stub points to): the same shell, title only. Its other statewide policies are human-resources policies and are outside the domain unless they govern IT or AI; none could be read.
- text: |-
    Administrative rules of the IT agency: none found. The Legislature's rules sitemap (https://sdlegislature.gov/Rules.xml, https://sdlegislature.gov/Rules.1.xml) lists 555 articles; the title indexes of Titles 1 to 8 and 10 (Governor, Attorney General, Auditor, School and Public Lands, Secretary of State, Treasurer, Legislature, the reserved Titles 8 and 9, Bureau of Human Resources and Administration) were read and none is the Bureau of Information and Technology's; rules.sd.gov's archive of rulemaking notices lists the Bureau with no notice (agencies with notices show a count). The statute directs the commissioner to make rules on administrative charges (SDCL 1-33-49, 1-33-64) and no rule was found to carry them. The title indexes of the later titles were not read (the API resolved those two-digit numbers to individual rules), so 'none found' covers what is listed here only. Article 1:15 (Telecommunications network, https://sdlegislature.gov/api/Rules/Rule/01:15.html) is left out: its board and site rules are for the rural development telecommunications network under repealed SDCL 1-33-36 (a telecommunications network, outside the domain).
- text: |-
    Statutes in chapter 1-33 not seeded: 1-33-57, 1-33-58 and 1-33-61 (the Office of Educational Telecommunications and its Board, chapter 13-47: broadcasting and telecommunications, outside the domain; 1-33-42 defines its terms for 1-33-37 to 1-33-61 and is seeded); 1-33-1 to 1-33-9.1 and their neighbours (Department and Bureau of Human Resources and Administration provisions, not IT); repealed or transferred sections (1-33-26, 1-33-30, 1-33-32, 1-33-35, 1-33-36, 1-33-52, 1-33-59 and others the chapter list prints as repealed). The seeded document is a list of sections, not the whole chapter, because the chapter mixes human-resources and educational-broadcasting sections with the Bureau's.
- text: |-
    SDCL chapter 1-13 (State communications system, https://sdlegislature.gov/api/Statutes/1-13.html): 1-13-1 (the Bureau operates a state communications system), 1-13-11, 1-13-16 and 1-13-17 (the Department of Public Safety's law-enforcement telecommunications and data network, its rules, and termination of service for a security or privacy risk) were read; they are radio, dispatch and law-enforcement telecommunications, outside the domain (telecom and law-enforcement technology). OWNER DECISION if 1-13-1 should be seeded alone.
- text: |-
    SDCL 5-18A-50 to 5-18A-53 (prohibited foreign contracts, enacted by 2023 SB 189; read): sections of the public-agency procurement chapter 5-18A, general to every contract and not about IT; left out pending the owner's decision on section-level slicing of non-IT chapters. The ban on information and communication technology from prohibited entities that Executive Order 2023-02 imposed was recited in the order that rescinded it as codified by SB 189; the enrolled bill read (https://mylrc.sdlegislature.gov/api/Documents/250985.pdf) amends only 5-18A-1 and adds the contract sections, and the technology ban was not found in the code sections read. Chapters 5-18A and 5-18D were searched on their section lists only (captions), not their text.
- text: |-
    SDCL 22-40-19 to 22-40-26 (data breach notification, sections 22-40-19, -20 and -21 read): binds an "information holder", defined as any person or business that conducts business in the state; not state agencies, and a private-sector law, outside the domain. SDCL chapter 1-27 (public records, section list read) is a general public-records chapter, not seeded; OWNER DECISION if its security-related exemptions should be.
- text: |-
    Artificial intelligence statutes: none binding state agencies was found. Read: the Legislative Research Council's issue memorandum on AI in government (https://mylrc.sdlegislature.gov/api/Documents/307445.pdf), which describes other states' laws and South Dakota's executive-branch policy and cites no South Dakota statute on agency AI use. Web search (not fetched, so not relied on) names a 2025 election-deepfake disclosure law and a 2026 deepfake sexual-image felony; both are private-conduct or crime laws and outside the domain (domain.yml: deepfakes and AI crimes, out). The Legislature's own search was not used (no documented public API for it), so 'none found' covers the sections and chapters named in this file.
- text: |-
    Executive orders read and left out. 2023-02 (Emergency Cybersecurity Declaration, https://sdsos.gov/general-information/executive-actions/executive-orders/assets/2023_Executive_Orders/2023-02.PDF): prohibited executive agencies from contracting with, or buying information and communication technology from, entities controlled from six named countries; rescinded effective 1 July 2023 by Executive Order 2023-10 (read), which says Senate Bill 189 codified it. 2023-10 itself (rescission of 2004-08 and 2023-02): a rescission, no continuing obligation. 2025-08 (Rescind Obsolete Executive Orders): its two pages read in full by OCR (a reading for discovery, not repo text): a list of about 150 order numbers and dates, none of them 2022-10, 2023-06 or 2026-02; its three sets of rescinded orders (https://sdsos.gov/general-information/executive-actions/executive-orders/assets/2025%20Executive%20Orders/2025-08%20EOs/EOSet1.pdf and Set2, Set3, 197, 176 and 105 pages of scans) were fetched but not read page by page, so an older order on IT could be in them and is unknown. 2024-01 (Bureau of Human Resources and Administration reorganization; only page 1 read) and 2021-03 (reorganization, not read beyond its title): human-resources reorganizations, left out; OWNER DECISION if the sections of 2024-01 that touch the Bureau of Information and Technology (the codified sections cite it) should be read. The other 2020 to 2026 orders on the Secretary of State's list are by title emergency, disaster, task-force, personnel and policy orders outside the domain (the list was read in full; no order beyond the titles was read). The list covers 2020 to 2026; orders before 2020 are not on it.
- text: |-
    Other leads, not read: South Dakota Board of Regents policies on information technology (public universities have their own regime; found by web search only); the Bureau's "Executive Working Group on Cyber Security" is described in the ITSP and no instrument creating it was found.
