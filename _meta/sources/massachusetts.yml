left_out:
- text: |-
    Massachusetts: found and left out (each was seen on an official page on 2026-11-11 and fetched through the Fetcher; the reason is recorded here).
- text: |-
    EOTSS policy collection (https://www.mass.gov/collections/executive-office-of-technology-services-and-security-policies): all 100 rows were read (10 pages of 10, sorted by title, the visitor's own sort links; page 11 is empty; the 'Displaying 1 - 10 of 100' counter agrees). The collection is a mixed list of policies, standards, services, how-to pages and portal links; rows are judged on their title, description and the fetched page. Filter applied: an instrument is a policy, standard, directive or guidance document that EOTSS (or the state under statute) directs at state agencies or their staff, in force, a document of its own. Disposition of the 100 rows:
     - 35 rows are seeded documents (the ten ISP policies and seventeen IS standards, the generative AI policy, the data privacy policy, the Website Domain Policy, the Mass.gov Privacy Policy, the Secure Email Terms of Use, the Zoom memo, the cellular extenders guidance, and the Guidance on Administrative Directive 2021-1; the cellular extenders guidance is listed twice, as a policy advisory and as its PDF, and the three ISP policies at /advisory/ URLs and the other standards at /policy-advisory/ URLs are the current ones).
     - 3 rows are watched index pages (Administrative Directives, Enterprise Information Security Policies, Digital Policies and Guidelines); 4 are stubs (Anti-Malware/Antivirus Standard, Device Disposal Standards, Facility Planning and Timeline Considerations, Secure Wifi Standards).
     - 8 rows are superseded 2018 duplicates: pages at /advisory/ or /policy-advisory/compliance-standard dated 10/05/2018 for the Communication and Network Security, Compliance, Cryptographic Management, Information Security Risk Management, Physical and Environmental Security, Secure System and Software Lifecycle Management, Third-Party Information Security and Vulnerability Management standards. Each is a summary page with no download; the 2025 pages and PDFs for the same standards (IS.017, IS.018, IS.019, IS.021, IS.024, IS.025, IS.026, IS.027) are seeded.
     - 14 rows are service, how-to or product pages, not instruments: Adobe Sign License, Chargeback Services, Commonwealth VPN Service, Commonwealth Web Content Filtering Service, Create a SharePoint Site, EOTSS End User Support Services, EOTSS Office of Capital Planning, MassMail/Coreview, Microsoft M365 G5 and Mailbox Licensing Guidance, Multi-factor authentication, Network Engineering General Inquiry, Request help with a computer problem, ServiceNow, Site-to-Site VPN Tunnel.
     - 12 rows link to sign-in portals, a knowledge base or a consumer guide, not to an instrument: Business Applications, Device Advanced Threat Protection, Device Encryption, eDaaS - eDiscovery as a Service, Hosting and Mobile Device and Mobile Application Management (all the EOTSS ServiceNow service portal, 'Login - EOTSS Service Portal'), Contract Management Guidance & Templates and two 'Data and Privacy' rows (EOTSS SharePoint sites; the first answers with the Microsoft sign-in page), Knowledge Base (a GitBook), and Home Internet Connectivity and Mi-Fi / Hotspots (an FCC household broadband guide).
     - 7 rows are guidance pages: Cybersecurity Best Practices, Get trained on cybersecurity awareness, How to secure your home network, Password Best Practices and Recommendations, Report a cybersecurity incident, Telework & Cybersecurity Fundamentals, Virtual Meeting Best Practices (advice to staff; OWNER DECISION whether any of it should enter).
     - 5 rows link files: Cabling Standards (https://www.mass.gov/doc/eotss-cabling-and-standards-guidelines/download, a 68-page 'Telecommunications Cabling Specification' of building-construction sections, September 2020: telecommunications is out of scope in domain.yml; OWNER DECISION), MassVoice (a three-page cloud telephone service description), Enterprise Print Services (an August 12, 2021 memo asking agencies' help preparing for a print platform), EOTSS Information Governance Framework (a 29-page report sent to the Legislature under Chapter 41 of the Acts of 2019, issued 12/31/2019: a report) and 'Microsoft Teams' (https://www.mass.gov/doc/eotss-hardware-and-software-standards/download, 8 pages whose first line reads 'PLEASE BE ADVISED: THIS DOCUMENT IS OUT OF DATE AS OF 6/5/2023').
     - 3 rows answer HTTP 404 through the Fetcher: 'Reporting a Suspected Cyber Security Threat for State Employees' (/files/documents/2022/03/23/IS.016 Vulnerability Management Standard_0.pdf), 'Security Vulnerability Management Program (VMP)' (/doc/is016-vulnerability-management-standard/download) and 'Wireless Providers' (/files/documents/2022/11/17/ITT72 Cat 1 PSGW.pdf). The standard the first two named is seeded as IS.027.
     - 2 rows are policy-like but not seeded, OWNER DECISION: 'Mass.gov Social Media Policy' (the comment and account policy of the Mass.gov team, public-facing) and 'Mass.gov Linking Policy' (no resolvable url: the list's link is an internal 'entity:node/693731' reference; the policy was not found at any fetched page). 'Digital Policy Version Numbers' (the semantic-versioning guide for EOTSS digital policies) and 'Massachusetts Design System' / 'MassGIS standards and best practices' (design and GIS guidance, not IT governance), 'Digital Accessibility Policy Requirements' (a resource page; the Enterprise Digital Accessibility Policy it links is seeded) and 'EOTSS policies, standards, and guidelines' (a pointer page that links this collection) are left out.
     - 2 rows from page 5 carry no heading in the list and are left out: 'EOTSS Product and Service Catalog' (a service catalog page) and 'EOTSS Settlement Policy' (GC.001, the EOTSS legal office's rule on who approves settlements, effective 4/25/2025: internal legal and financial process, not IT; OWNER DECISION). A download-only row for 'Guidelines for Acceptable Use of Cellular Extenders...' duplicates the seeded cellular extenders guidance.
- text: |-
    EOTSS Technology Standards and Guidelines list (https://www.mass.gov/lists/eotss-technology-standards-and-guidelines): every row was read. The 17 IS.011 to IS.027 standards are seeded. 'EOTSS Defined Standards' lists nine files on the EOTSS SharePoint tenant; seven are stubs (Facility Planning and Timeline Considerations, Hardware Standards, Mobile Hardware and Application Standards, Secure WiFi Standards, Software Standards, Device Disposal Standards, MDM and MAM Standard: each ended at the Microsoft sign-in page, 59,236 to 59,516 bytes), 'EOTSS Cabling and Standards Guidelines' is the left-out cabling specification above (the policy collection links the same file on mass.gov), and 'OSD Format Approved Spreadsheet for Device Disposal' is an .xlsx workbook, left out as a spreadsheet. The 'Guidance' row (Guidance on Administrative Directive 2021-1, SOE.001) is seeded. Enterprise Information Security Policies handbook (https://www.mass.gov/handbook/enterprise-information-security-policies): all ten ISP policies are seeded; its 'Enterprise Information Security Policies and Standards Glossary of Terms' PDF is a glossary, left out as a reference document.
- text: |-
    Administrative Directives handbook (https://www.mass.gov/handbook/administrative-directives): all five directives (2018-1, 2021-1, 2021-2, 2022-1, 2024-1) are seeded from their pages, with the two guidance PDFs (SOE.001 and the 2024-1 guidance). 'Administrative Directive 2024-1: Frequently Asked Questions (FAQs)' (https://www.mass.gov/doc/administrative-directive-2024-1-frequently-asked-questions-faqs/download, 3 pages of questions and answers) is left out as an FAQ, not an instrument. Directive 2021-2's deadline (October 31, 2021) has passed and the page shows no withdrawal; it is seeded as the handbook lists it (OWNER DECISION). The page 'Administrative Directive 2018-1' also links a PDF, 'EOTSS Administrative Directive 2018-1 Cybersecurity Policies and Training'; the page text is seeded, the PDF (https://www.mass.gov/doc/eotss-administrative-directive-2018-1-cybersecurity-policies-and-training-0/download, HTTP 200, 209,170 bytes, the '-0' URL) is a 3-page scan (Creator 'GlobalScan NX', Producer 'RICOH PDF Library') with no text layer: pdftotext returns 3 bytes. The page text is the only readable text and stays the text of record.
- text: |-
    Digital Policies and Guidelines handbook (https://www.mass.gov/handbook/digital-policies-and-guidelines): the Website Domain Policy, Enterprise Digital Accessibility Policy and Mass.gov Privacy Policy are seeded; the Mass.gov Social Media Policy, Digital Policy Version Numbers and Massachusetts Design System are left out as recorded above.
- text: |-
    Executive orders. All governors were checked: the law-library lists of orders 500-599 and 600-699, Governor Healey's list (56 orders) and the five 'Massachusetts Executive Orders by Subject' index pages (745 links, A-D, E-H, I-L, M-P, Q-Z) were read, and the order page of every IT, data, cybersecurity or AI title was fetched to read its own rescission markers (32 pages, plus orders 549 and 603). Seeded (no rescission marker on the page): 629, 602, 614, 286, 166 and 111; 286, 166 and 111 are old orders whose subjects later statutes or agencies took over, OWNER DECISION whether they are in force in substance (the evidence for 166 is in its entry: EO 588's recital of Chapter 64 of the Acts of 2017; 111 is a 1974 order that predates G.L. c. 66A, which covers the same subject; 286, 1990, software licence compliance, is named by no later order or statute read here). Left out because the page prints a rescission or supersession: No. 628 (AI task force, rescinded and replaced by 629), 504 (security and confidentiality of personal information, 'Rescinded by: Executive Order No. 588'; 588, 08/26/2019, rescinds 504 and 549, and the MassGov privacy policy still names 504), 549 (IT efficiency, rescinded by 588), 532 (No. 532, Patrick, 05/09/2011, 'Enhancing the efficiency and effectiveness of the Executive Department's information technology systems': its own page prints 'Superseding: Executive Order 510' and no rescission, but it was in substance superseded by 549, and 549 was then rescinded by 588. Evidence read from the pages: (1) 549 (Patrick, 02/03/2014, Mass Register No. 1255) has the identical title, and 47 of its 89 text lines appear verbatim in 532; (2) 549's page prints 'Superseding: Executive Order No. 523', but 523 is the unrelated small-business purchasing program on the 500-599 list, so that marker is evidently a transposition of 532; (3) 549's page prints 'Rescinded by: Executive Order No. 588'; (4) 588 (Baker, 08/26/2019) recites that 'Chapter 64 of the Acts of 2017 ... went into effect' and that the Act 'authorizes EOTSS to adopt policies, standards and procedures that will, upon implementation, replace the requirements set forth in Executive Orders 504 and 549'; (5) 532 still assigns the migration of infrastructure services to the Information Technology Division ('ITD') and to the Commonwealth CIO, which that Act replaced (the CCIO under G.L. c. 7, sec. 4A(d) is named in 549's text, not 532's). Left out as superseded then rescinded; this is the New York pattern, the order's own page is clean and a later order says otherwise), 510 (superseded by 532, itself superseded by 549 and rescinded by 588), 412 (revoked by 504), 348 (revoked and superseded by 614), 132, 175, 188 (rescinded and replaced by 231), 231 (revoked by 283), 283 (revoked by 326), 322, 324, 326, 337 (revoked by 383), 574 (superseded by 585). Left out as not IT governance (title read): 585 (Digital Healthcare Council), 581 (Commission on Digital Innovation and Lifelong Learning), 612 (equity assessment and the Inter-Agency Coordinating Committee on Increasing Equity Through Data), 615 (language access), 658 (requirements for data center development and operations, an energy and ratepayer order for private data centers), 476 (Fusion Center), 490 (continuity of government plans), 495 (criminal offender record information), 115 (Security and Privacy Council of 1975), 344 (1992 electronic equipment access policy: amended by 348, which 614 revoked, but 344 itself carries no revocation; its subject is covered by 614; OWNER DECISION), 572 (rescinded by 603), 541 and 583 (security task forces). Orders 1 to 499 were searched by title in the subject index only; their pages were fetched only for the titles named here.
- text: |-
    Statutes. Seeded: G.L. c. 7D (every section the chapter page links: 1 to 11, 4A, 4B and 4C), c. 66A, c. 93H, c. 93I. The Legislature serves a chapter as a table of contents and one page per section; the ingester bundles them. The site says its General Laws are an unofficial version. Not seeded, OWNER DECISION on section-level slicing of non-IT chapters: G.L. c. 6A section 7A (EOTSS approval of IT functions performed by other executive offices; transfer provisions) and c. 6A section 109 (collection of personal identifying information by government agencies), whose chapters are the executive office organization act, and c. 7 (administration and finance; the sections in its table of contents whose titles mention information, data, electronic, computer or software were 3E, 3F and 4R, all reports, records and forecasting). Chapters 93H and 93I bind private 'persons' as well as agencies and ride along whole (OWNER DECISION). AI statutes: none found. What was read: the General Laws index page, the table-of-contents pages of c. 7D (no section title mentions AI), c. 66A, c. 93H, c. 93I, c. 6A and c. 7, and the Legislature's search page for 'artificial intelligence' (first 25 of about 192 results, all bills and session-law text, none a chapter of the General Laws). No enacted AI statute for state agencies was confirmed in bytes; the generative AI policy and Executive Order 629 are seeded. Not read: the other General Laws chapters.
- text: |-
    Administrative rules (CMR). The CMR index pages (https://www.mass.gov/guides/code-of-massachusetts-regulations-cmr-by-number, 152 chapters listed) show no EOTSS or Information Technology Division rule: the 801-815, 940, 950 and 201 CMR chapter lists were read (801, 802, 803, 804, 805, 806, 808, 810, 811, 812, 815, 831, 940, 950, 201) and titles with 'information', 'data', 'record', 'electronic', 'computer', 'privacy', 'personal', 'security', 'technology', 'digital' or 'cyber' were opened. Seeded: 801 CMR 3.00, 950 CMR 33.00, 940 CMR 11.00, 950 CMR 120.00; stub: 801 CMR 8.00. Left out: 201 CMR 17.00 (standards for the protection of personal information of residents of the Commonwealth: its PDF, fetched, says it implements c. 93H 'relative to the standards to be met by persons who own or license personal information' and 'applies to all persons that own or license personal information' (17.01); it does not say it binds state agencies, so it is treated as a private-sector rule, OWNER DECISION) and 201 CMR 16.00 (security freezes), 940 CMR 27.00 (safeguard of personal information, the Attorney General's rule for consumer and employee information held by businesses, authority c. 93H section 2(c)), 803 CMR 2.00, 5.00, 7.00, 8.00, 10.00 and 806 CMR 4.00 (criminal offender record information and the criminal justice information system: law-enforcement records, out of scope), 815 CMR 10.00 (records management of bills, vouchers and contracts: comptroller records), 804 CMR 12.00 (fees for public records), 950 CMR 32.00 (public records access), 950 CMR 31.00, 38.00 (fragile records) and 54.00 (voting and counting procedures for electronic voting systems: election systems), 802 CMR 3.00 (surplus state property). The CMR pages say the online version is not the official one (the print edition is); the PDFs are what mass.gov posts. Only chapters 7D, 66A, 93H, 93I and the CMR chapters above were examined; other agencies' own rules under c. 66A (each agency may adopt its own) were not enumerated beyond 940, 950 and 801, OWNER DECISION.
- text: |-
    Other pages read and not seeded: EOTSS organization pages (https://www.mass.gov/orgs/executive-office-of-technology-services-and-security, /orgs/cybersecurity-and-enterprise-risk-management, /orgs/office-of-security-and-operations, /info-details/eotss-legal-and-privacy-office, /info-details/eotss-enterprise-risk-management-office), the AI page (https://www.mass.gov/ai, which tells agencies to follow the generative AI policy and lists the AI principles; a web page of principles, not seeded: OWNER DECISION), Executive Order 629's page, the 'Statewide IT Strategy for 2026-2028' (a strategy document), EOTSS annual and legislative reports and the 2024 AI Strategic Task Force report (reports), and the Office of Municipal and School Technology (local government, out of scope).
