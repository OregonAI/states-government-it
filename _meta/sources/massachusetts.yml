    issuing_body: "Governor Maura Healey"
    tags: [ai, governance]
    recheck: "monthly"
    found_via: "https://www.mass.gov/info-details/massachusetts-executive-orders-by-subject-i-l and the law library lists by number"
    why_relevant: "The governor's order on AI (Mass Register No. 1516, 02/15/2024; it replaces Executive Order No. 628, which the list shows as rescinded and replaced by it): a task force led by the Secretaries of Economic Development and of EOTSS, one of whose charges is integrating AI into the operations of the executive branch. It binds no agency to a rule; it is the order that sets the state's AI work in motion and EOTSS's generative AI policy cites the task force."
