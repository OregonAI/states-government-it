    issuing_body: "Office of the Attorney General"
    tags: [data]
    recheck: "monthly"
    found_via: "https://www.mass.gov/regulations/940-CMR-1100-fair-information-practices-act"
    why_relevant: "The Attorney General's rule under G.L. c. 66A, section 3 on the collection, maintenance and dissemination of personal data in the personal data systems of the Attorney General's Office (the page dates it 06/19/2026). One agency's own personal-data rule, seeded because it binds a state entity's data systems. mass.gov posts the regulation as a PDF on a page of the Trial Court Law Libraries and says the online version is not the official one (the print edition from the State Bookstore is)."
  - id: "ma-950-cmr-120"
    sha256: "60e32da520a4d43036543bef190619ee4de96cd40055a339e35de68dd8c2c809"
    url: "https://www.mass.gov/doc/950-cmr-120-information-technology-purchasing-process/download"
    format: "pdf"
    citation: "950 CMR 120.00"
    title: "950 CMR 120.00: Information technology purchasing process"
    doc_type: "rule"
    jurisdiction: "massachusetts"
    issuing_body: "Office of the Secretary of the Commonwealth"
    tags: [procurement]
    recheck: "monthly"
    found_via: "https://www.mass.gov/regulations/950-CMR-12000-information-technology-purchasing-process"
    why_relevant: "Uniform rules and standards for the technology purchases of the Registries of Deeds, for consistency and compatibility with the Secretary of the Commonwealth's Office (authority G.L. c. 36, section 40). Binds two state-level offices only; it is the one rule in the CMR whose title names IT purchasing. mass.gov posts the regulation as a PDF on a page of the Trial Court Law Libraries and says the online version is not the official one (the print edition from the State Bookstore is)."

  # ---- Executive orders: the pages print no rescission marker
  - id: "ma-eo-629"
