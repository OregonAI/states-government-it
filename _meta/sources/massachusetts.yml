    doc_type: "executive_order"
    jurisdiction: "massachusetts"
    issuing_body: "Governor Maura Healey"
    tags: [digital-services, governance]
    recheck: "monthly"
    found_via: "https://www.mass.gov/info-details/massachusetts-executive-orders-by-subject-i-l and the law library lists by number"
    why_relevant: "Establishes the Digital Accessibility and Equity Governance Board within EOTSS, the Chief IT Accessibility Officer and a Secretariat IT Accessibility Officer in each executive office (Mass Register No. 1502, 07/26/2023); revokes Executive Order 348. The Enterprise Digital Accessibility Policy cites it."
  - id: "ma-eo-286"
    sha256: "0bbf43f3bb8b6d955ea4e709b8be70c5a33154b4247ab6a5e98dfb44f42b8484"
    url: "https://www.mass.gov/executive-orders/no-286-software-copyright-compliance"
    format: "html"
    citation: "Executive Order No. 286"
    title: "No. 286: Software Copyright Compliance"
    doc_type: "executive_order"
    jurisdiction: "massachusetts"
    issuing_body: "Governor Michael S. Dukakis"
    tags: [procurement, governance]
    recheck: "monthly"
    found_via: "https://www.mass.gov/info-details/massachusetts-executive-orders-by-subject-i-l and the law library lists by number"
    why_relevant: "Requires each Commonwealth agency using personal computers or mainframes to hold a license for all proprietary software in use and makes agency managers responsible for enforcement (Mass Register No. 627, 01/10/1990). The page prints no rescission (OWNER DECISION on whether a 1990 order still stands)."
  - id: "ma-eo-166"
    sha256: "5e39c2ff44cf5637b7d8bc78f83bfd251e8cb8757339916a20ddceceeff5c90b"
    url: "https://www.mass.gov/executive-orders/no-166-providing-for-the-establishment-of-an-electronic-data-processing-center-and-planning-unit-in-the-executive-office-for-administration-and-finance"
    format: "html"
    citation: "Executive Order No. 166"
    title: "No. 166: Providing for the establishment of an electronic data processing center and planning unit in the Executive Office for Administration and Finance"
    doc_type: "executive_order"
    jurisdiction: "massachusetts"
    issuing_body: "Governor Edward J. King"
    tags: [governance, oversight]
    recheck: "monthly"
    found_via: "https://www.mass.gov/info-details/massachusetts-executive-orders-by-subject-i-l and the law library lists by number"
    why_relevant: "Directs the consolidation of state data-processing functions in an Administration and Finance unit with a users' advisory group (Mass Register No. 171, 08/10/1979). The page prints no rescission. Evidence that it is overtaken: EO 588 (08/26/2019) recites that Chapter 64 of the Acts of 2017 reorganized the Commonwealth's information technology function under EOTSS, and orders 510, 532 and 549 restructured the same function after 166 (the A&F data-processing unit it created is not named by any later order read); OWNER DECISION whether it is still in force in substance or is replaced by statute and moves to left_out."
  - id: "ma-eo-111"
    sha256: "f34b765f522eb396bab65f61d2b1a4b07699e40ea04e4f5b69ee16e545048ec6"
    url: "https://www.mass.gov/executive-orders/no-111-fair-information-practices"
    format: "html"
    citation: "Executive Order No. 111"
    title: "No. 111: Fair information practices"
    doc_type: "executive_order"
    jurisdiction: "massachusetts"
    issuing_body: "Governor Francis W. Sargent"
    tags: [data]
    recheck: "monthly"
    found_via: "https://www.mass.gov/info-details/massachusetts-executive-orders-by-subject-i-l and the law library lists by number"
    why_relevant: "State agencies must tell a person asked for personal data how it will be used and whether supplying it is required, and give a person access to personal data an agency holds on them (10/11/1974). The page prints no rescission; G.L. c. 66A later covered the subject (OWNER DECISION whether it is still in force in substance)."

