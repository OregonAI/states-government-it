# Massachusetts seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Discovery 2026-11-11 through the toolkit Fetcher: mass.gov (EOTSS handbook, technology standards list, the 100-row EOTSS policy collection, administrative directives, digital policies, executive order lists by number and subject, CMR law-library pages), malegislature.gov (General Laws chapter and section pages).
sources:

  # ---- Statutes: General Laws chapters, one bundle of the chapter page and its section pages each
  - id: "ma-gl-7d"
    sha256: "70e6154fa1f397029a293d4cc72a2605609df6bd74d001f01b067ae088fe361c"
    url: "https://malegislature.gov/Laws/GeneralLaws/PartI/TitleII/Chapter7D"
    format: "html"
    citation: "G.L. c. 7D"
    title: "General Laws, Chapter 7D. Massachusetts Office of Information Technology"
    doc_type: "statute"
    jurisdiction: "massachusetts"
    issuing_body: "Massachusetts Legislature"
    tags: [governance, oversight, procurement, funding, cybersecurity, data, digital-services, cloud-resilience]
    recheck: "monthly"
    why_relevant: "The enabling statute for the Executive Office of Technology Services and Security (EOTSS), its secretary and the Commonwealth's chief information officer. The chapter heading is printed 'MASSACHUSETTS OFFICE OF INFORMATION TECHNOLOGY', the older name; section 2 creates the executive office of technology services and security, makes the secretary the supervisor of all state-agency IT and binds executive department agencies to EOTSS policies, procedures and objectives. Its sections: definitions (1), the office and secretary (2), powers and duties (3), the enterprise chief information security officer (4), chief data officer (4A), chief privacy officer (4B), chief digital officer (4C), the bureau of geographic information (5), secretariat chief information officers and IT strategy plans (6), the financial threshold and approval of IT expenditures (7), interagency service agreements (8), the statewide IT plan (9), data authorization (10) and the inter-branch, interagency oversight board (11). Every EOTSS policy and standard seeded below cites sections 2 and 3 as its authority."
  - id: "ma-gl-66a"
    sha256: "9d063b93ed0ee5717cb341b71fa04ba01283ad63236cd1e6d0bd8eb047551ed1"
    url: "https://malegislature.gov/Laws/GeneralLaws/PartI/TitleX/Chapter66A"
    format: "html"
    citation: "G.L. c. 66A"
    title: "General Laws, Chapter 66A. Fair Information Practices"
    doc_type: "statute"
    jurisdiction: "massachusetts"
    issuing_body: "Massachusetts Legislature"
    tags: [data]
    recheck: "monthly"
    why_relevant: "The fair information practices act: the duties of every executive-branch 'holder' that maintains a personal data system, including an 'automated personal data system' kept in a computer (identify the responsible individual, safeguards, access and correction rights, rules under section 3). It is the statute under which the seeded 801 CMR 3.00 and the agency rules 940 CMR 11.00 and 950 CMR 33.00 are issued, and the Enterprise Data Privacy Policy cites it."
  - id: "ma-gl-93h"
    sha256: "531088909dd8f4ccebcd1f2adfd047c2e3d725837c03c6d5333591771e0d53b1"
    url: "https://malegislature.gov/Laws/GeneralLaws/PartI/TitleXV/Chapter93H"
    format: "html"
    citation: "G.L. c. 93H"
    title: "General Laws, Chapter 93H. Security Breaches"
    doc_type: "statute"
    jurisdiction: "massachusetts"
    issuing_body: "Massachusetts Legislature"
    tags: [cybersecurity, data]
    recheck: "monthly"
    why_relevant: "The breach statute. It defines 'agency' to include departments, divisions, boards, commissions and authorities of the Commonwealth and binds an agency that owns or licenses personal information to report a known breach (section 3) and offer credit monitoring after a breach involving social security numbers (3A); section 2 directs the safeguarding rules for personal information held by state executive offices. Most of the chapter also binds private 'persons' and those provisions ride along because the Legislature serves the whole chapter (OWNER DECISION, see left_out). The Enterprise Data Privacy Policy and EOTSS incident standards cite it."
  - id: "ma-gl-93i"
    sha256: "1da196a8d95788be94d7a2dfa120eb3f0fe37fc7e0241a00bf0e33a4412d5855"
    url: "https://malegislature.gov/Laws/GeneralLaws/PartI/TitleXV/Chapter93I"
    format: "html"
    citation: "G.L. c. 93I"
    title: "General Laws, Chapter 93I. Dispositions and Destruction of Records"
    doc_type: "statute"
    jurisdiction: "massachusetts"
    issuing_body: "Massachusetts Legislature"
    tags: [data, cybersecurity]
    recheck: "monthly"
    why_relevant: "Standards for the disposal of records containing personal information, which bind an 'agency or person' alike: the Enterprise Data Privacy Policy lists it among its authorities and the information disposal controls of ISP.001 follow it. The chapter is short and also binds private persons (OWNER DECISION, see left_out)."

  # ---- Administrative rules (CMR): PDFs posted on mass.gov
  - id: "ma-801-cmr-3"
    sha256: "314bd23d516ab73ffba90af462ace2e6ced75e1b644b6510fb5fc740f7433f6e"
