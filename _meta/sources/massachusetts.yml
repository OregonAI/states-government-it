    why_relevant: "The Secretary of the Commonwealth's rule under G.L. c. 66A on personal data in 'manual or computerized personal data systems', applying to the State Secretary's Office and all agencies in it. One agency's own personal-data rule, seeded because it binds a state entity's data systems. mass.gov posts the regulation as a PDF on a page of the Trial Court Law Libraries and says the online version is not the official one (the print edition from the State Bookstore is)."
  - id: "ma-940-cmr-11"
    sha256: "ecdb02123ec0fd6b5d0c1d1fb0f40d68d9dea36e3b45846ce7233445b0c63f18"
