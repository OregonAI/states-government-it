    tags: [cybersecurity, governance]
    recheck: "monthly"
    found_via: "https://www.mass.gov/info-details/massachusetts-executive-orders-by-subject-i-l and the law library lists by number"
    why_relevant: "Establishes the Massachusetts Cyber Incident Response Team (MA-CIRT), led by the EOTSS Secretary, and has executive department agencies and the other state agencies EOTSS serves identify and report significant cybersecurity incidents (Mass Register No. 1486, 12/14/2022)."
  - id: "ma-eo-614"
