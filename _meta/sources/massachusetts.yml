    doc_type: "rule"
    jurisdiction: "massachusetts"
    issuing_body: "Executive Office for Administration and Finance"
    tags: [data]
    recheck: "monthly"
    found_via: "https://www.mass.gov/regulations/801-CMR-300-privacy-and-confidentiality"
    why_relevant: "The rule under G.L. c. 66A, section 3 on the collection, maintenance and dissemination of personal data, jointly promulgated for the executive offices (Administration and Finance, Education, Energy and Environmental Affairs, Health and Human Services, Transportation, Public Safety and Security, Housing and Economic Development, Labor and Workforce Development) and their agencies, and for any agency outside an executive office unless it adopts its own. Its applicability section authorizes access to personal data by MassIT in connection with services under c. 7D. mass.gov posts the regulation as a PDF on a page of the Trial Court Law Libraries and says the online version is not the official one (the print edition from the State Bookstore is)."
  - id: "ma-950-cmr-33"
