left_out:
- text: '---- Michigan: found and left out (each was seen on an official page on 2026-11-12 through the toolkit Fetcher unless it says it was seen only in a web search; the reason is recorded here)'
- text: 'DTMB statewide IT policy and standards library: NOT READABLE, SO NOT RECONCILED ROW BY ROW, AND NOT WATCHED. On 2026-11-12 every michigan.gov page tried answered HTTP 403 to the Fetcher (crawler User-Agent, curl transport enabled by make_fetcher; the response carries no cf-mitigated header, so the curl fallback is not triggered): the home page, /robots.txt, /dtmb, /dtmb/policies, /whitmer, /whitmer/news/executive-orders, /whitmer/news/state-orders-and-directives, /sos, and further michigan.gov pages and PDFs that a web search suggested (audgen.michigan.gov and dtmb.state.mi.us were refused too). Consequence: the library''s rows were never read and no DTMB policy is confirmed in bytes, so ''every item in the library'' cannot be claimed and nothing is seeded from it; the index is a stub (mi-stub-dtmb-policy-library). A web search suggested further DTMB policies and AI guidance; none could be fetched (403), so no number, title or URL of any is recorded here. OWNER DECISION: a reviewer with a browser, or the owner''s request to the state for an allowance, is needed to read the library; its information security family and any AI guidance are the highest value items.'
- text: 'MDHHS agency policies on a different host answered the Fetcher (fetched again 2026-11-12): https://dhhs.michigan.gov/OLMWEB/EX/AP/Public/APS/1360.pdf (7 pages, ''SYSTEM AND COMMUNICATIONS PROTECTION'', APS 1360, issued 6/01/2024, next review 6/01/2025) and https://dhhs.michigan.gov/OLMWEB/EX/AP/Public/APS/1310.pdf (12 pages, ''ACCESS CONTROL'', APS 1310, issued 6-1-2024). They are one department''s administrative policies, not the statewide library, and the department''s index (https://dhhs.michigan.gov/OLMWEB/EX/AP/Public/ and the site root) answered 403, so the set could not be enumerated. Left out. OWNER DECISION whether agency-level IT policies belong in the corpus.'
- text: 'Statutes read: the Legislature''s bulk MCL directory https://legislature.mi.gov/documents/mcl/ (Chapter 18.xml, Chapter 445.xml and Chapter 450.xml fetched and every act name, short title and repealed flag read; the statute text seeded is each act''s own official PDF at documents/mcl/pdf/MCL-ACT-<n>-OF-<year>.pdf, a URL built from the pattern, confirmed by each PDF''s own title block and ''Act <n> of <year>'' line). Seeded: Act 431 of 1984 (the enabling act), Act 132 of 2017 (Cyber Civilian Corps), Act 452 of 2004 (Identity Theft Protection, breach notice binds agencies), Act 454 of 2004 (Social Security Number Privacy, ''person'' includes state agencies), Act 305 of 2000 (Uniform Electronic Transactions, DTMB''s role at 450.848). Each PDF is the whole act and prints a footer ''Rendered <date>'' that changes whenever it is re-rendered, so the drift run may report a change with no change in the law. Chapter 18 (Department of Management and Budget) holds 46 entries, 37 of them not repealed (11 acts and 26 executive reorganization orders), all read by name; apart from the two seeded acts they are left out as not IT: the executive reorganization orders compiled there are the same instruments as the executive orders (E.R.O. 2009-39 is Executive Order 2009-55; the other IT ones are seeded as orders), and the 9 other acts concern art in public places (Act 105 of 1980), the federal surplus property program (Act 139 of 1961), Hispanic/Latino affairs (Act 164 of 1975), crime victim services (Act 223 of 1976), criminal justice and juvenile justice commissions (Act 541 of 1978), the justice training commission (Act 302 of 1982), fish product purchasing (Act 183 of 1987), governmental energy use (Act 625 of 2012) and economic development incentive evaluation (Act 540 of 2018).'
- text: 'Statutes left out: Act 310 of 1984 (cooperative identity protection, private names), Act 378 of 1988 (privacy in purchase, rental or borrowing of materials, private) and Act 113 of 2026 (motor vehicle dealer data collection, private): they bind private persons only. No other act of chapters 445 and 450 was read for IT content beyond the five seeded, because the lists read there were the acts whose titles or short titles contain identity, electronic, security number, information, data, record or privacy; chapters other than 18, 445 and 450 were NOT read, so a statute on state IT in another chapter (for example the Freedom of Information Act, the Law Enforcement Information Network act, records and library acts) was not looked for and is not claimed absent. Not seeded as out of scope by the domain test: telecommunications and the Public Safety Communications System statute (1929 PA 152, MCL 28.281, named in Executive Order 2005-2).'
- text: 'Artificial intelligence: no enacted statute on state-agency use of AI was found. Searched: the text of the five seeded acts (no ''artificial intelligence'' or ''machine learning''; ''automated'' appears only as automated data processing, automated fingerprint database and automated transactions). Confirmed in bytes fetched through the Fetcher on 2026-11-12 from the Legislature''s website: House Bill 5899 of 2026 (https://www.legislature.mi.gov/Bills/Bill?ObjectName=2026-HB-5899) is summarized there as ''State management: other; artificial intelligence pilot program; establish for state departments and agencies. Creates new act.'' (categories ''State management: other ; Communications: artificial intelligence''); it was introduced 4/23/2026, referred to the Committee on Communications and Technology, and on 5/19/2026 reported with recommendation for referral to the Committee on Rules; its page shows no enactment, so it is a bill, not law, and it is not seeded. Four enacted acts that mention AI or deep fakes were fetched at the Legislature''s public act pages (URLs built from the pattern documents/<session>/publicact/htm/<year>-PA-<number>.htm, each confirmed by its own ''Act No. n Public Acts of year'' heading): 2023 PA 263 and 264 (enrolled House Bills 5141 and 5143, amending 1976 PA 388, the campaign finance act), 2023 PA 265 (enrolled House Bill 5144, amending 1954 PA 116, the election law) and 2025 PA 11 (enrolled House Bill 4047, the protection from intimate deep fakes act); they regulate political activity, elections and private creation or distribution of deep fakes, not state-agency use of AI, so they are left out as out of scope by the domain test. The Legislature''s MCL search was not run.'
- text: 'Administrative rules: none on IT. The ARS list of all rule sets (https://ars.apps.lara.state.mi.us/AdminCode/DeptBureauAdminCode, 770 rows, read in full; the page has no department column and the department filter is a form post to an internal endpoint, which was not used) shows these sets under rule numbers R 18 (the Department of Management and Budget''s chapter-18 numbering): Conduct on State Property (R 18.201-18.208), Parking on State Property (R 18.401-18.426), Real Estate Services (R 18.501-18.509), Crime Victim Services General Rules (R 18.351-18.367) and Justice Training Fund Programs (R 18.14901-18.14910). None is about information technology, so none is seeded; that these are DTMB''s is inferred from the R 18 numbering and from search results, not read from the page. Other rule sets read and left out: Criminal Justice Information Systems (R 28.5101-28.5414, State Police, law enforcement technology), Electronic Voting Systems, Use of Electronic Pollbook and Electronic Return of Absent Voter Ballots (elections), Tax Electronic Recordkeeping and Retention Rules (R 205.4101-205.4114, Treasury tax records), Standards for Safeguarding Customer Information (R 500.551-500.560, insurance and financial firms, private), Deferred Presentment Statewide Database (R 487.2121-487.2123, a private industry database), telecommunications rule sets and utility record rules. The index is watched (mi-watch-ars-admin-code).'
- text: 'Executive orders: the Legislature''s list https://www.legislature.mi.gov/Laws/ExecutiveOrders?year=YYYY for every year 1993 to 2026 (34 pages, 834 rows, all governors, fetched through the Fetcher on 2026-11-12). A keyword filter over the row descriptions (technolog, information, cyber, data, digital, artificial, AI, computer, security, internet, e-Michigan, telecom, broadband, privacy, records, network, innovation, transform, electronic) matched 70 rows (69 distinct orders; 2020-131 is listed twice). Every matched row ends here by number: Seeded as documents (in force as far as the text and the MCL show; the in-force question is an OWNER DECISION on each, see the entries) [1994-15, 1995-10, 2001-3, 2002-14, 2005-2, 2006-19, 2009-55]; Stubs (the PDFs'' text layer is machine OCR that cannot be committed; see the two stubs) [2016-24, 2022-11]; Left out, text read: 1995-14 (Michigan Information Network; its advisory board is abolished by 2001-3: superseded in part; OWNER DECISION), 2000-6 (e-Michigan Office; abolished by 2002-2), 2009-18 (Chief Privacy Officer and Information Privacy Protection Council; rescinded in its entirety by 2016-24), and 2002-19 (fetched 2026-11-12 and read: it places the executive direction and management of the Human Resource Management Network System, the state''s HR and payroll business system, in the Department of Civil Service, under an advisory committee on which the Department of Information Technology sat; Executive Order 2009-55 abolishes that department''s seat. It is a human-resources system reorganization, not IT governance, so it is left out; OWNER DECISION, because the HRMN System is an enterprise IT system) [1995-14, 2000-6, 2009-18, 2002-19]; Left out, superseded or abolished by an order above (list row read, order not fetched): 2002-2 (upgrades the e-Michigan Office, which 2002-14 then moves and abolishes; OWNER DECISION), 2006-2 (abolishes the technology tri-corridor committee), 2010-13 (abolishes the Center for Innovation and Reinvention Board), 2010-14 (abolishes the census complete count committee), 2008-17 (abolishes the Criminal Justice Information Systems Policy Council), 2004-24 (abolishes the Commission on Genetic Privacy and Progress), 2010-16 (abolishes the Center for Educational Performance and Information advisory committee), 2000-9 (CEPI; marked RESCINDED on the list) [2002-2, 2006-2, 2010-13, 2010-14, 2008-17, 2004-24, 2010-16, 2000-9]; Left out, telecommunications (out of scope by _meta/domain.yml; row read, not fetched): 1993-13 and 1993-22 (Council on Telecommunications Services for Public Education), 2005-8 (abolishes the Public Safety Communications System Advisory Board), 2009-50 (abolishes the Telecommunications Relay Service Advisory Board) [1993-13, 1993-22, 2005-8, 2009-50]; Left out, law enforcement, homeland security or intelligence information (row read, not fetched): 1998-1 (Criminal Justice Information Systems Policy Council), 2011-7 (State Police Criminal Justice Information Systems Board), 2003-6, 2007-47, 2009-30, 2009-52 and 2012-5 (homeland security and the Michigan Intelligence Operations Center) [1998-1, 2011-7, 2003-6, 2007-47, 2009-30, 2009-52, 2012-5]; Left out, data or records of another field (row read, not fetched; OWNER DECISION on 2010-15 and 2018-2): 2010-15 (P-20 Longitudinal Data System Advisory Council, education data), 2018-2 (Michigan Consortium of Advanced Networks, a research network), 2007-10 (Laboratory Data Quality Assurance Advisory Council, environmental labs), 2007-54 (State Historical Records Advisory Board), 1997-14 (Commission on Genetic Privacy and Progress), 2009-11 (Poison Control Center Network Advisory Committee), 2003-19 (technology corridor steering committee, economic development) [2010-15, 2018-2, 2007-10, 2007-54, 1997-14, 2009-11, 2003-19]; Left out, matched a keyword only through a department name or an unrelated word (row read, not fetched): 1994-2, 1995-8, 1997-12 and 1997-18 (Employment Security), 2004-3 (biosecurity of privately owned cervids), 2008-20, 2009-34 (census committee, a Department of Information Technology reorganization), 2010-5, 2010-19, 2011-4, 2011-6, 2012-2, 2012-3, 2014-6, 2015-9, 2016-4 (Office of Performance and Transformation), 2017-5, 2019-2, 2019-6, 2019-13, 2020-167 (Food Security Council), 2021-5 (Jail Reform Advisory Council), 2023-6 and 2024-5. These reorganize other bodies and name DTMB or its predecessors among several departments; none is about IT [1994-2, 1995-8, 1997-12, 1997-18, 2004-3, 2008-20, 2009-34, 2010-5, 2010-19, 2011-4, 2011-6, 2012-2, 2012-3, 2014-6, 2015-9, 2016-4, 2017-5, 2019-2, 2019-6, 2019-13, 2020-167, 2021-5, 2023-6, 2024-5]; Left out, temporary: the COVID-19 electronic-signature and remote-notarization orders 2020-41, 2020-74, 2020-131 (listed twice), 2020-158, 2020-173 and 2020-187. Each list row for 2020-74, 131, 158 and 173 says it rescinds the one before it; 2020-187 is the last of the series and its status is not stated on the list. The six PDFs have no text layer (pdftotext returns nothing for 2020-41 and 2020-187; the others were not opened), so none was read; they are pandemic-emergency orders about notarization, witnessing and visitation, not state IT policy [2020-41, 2020-74, 2020-131, 2020-158, 2020-173, 2020-187]. Of the 2023 to 2026 rows only 2023-6 and 2024-5 matched; no order on the list has an artificial intelligence title. Rows that did not match the filter were not read for IT content beyond their descriptions.'
- text: 'Executive directives and the Governor''s own order pages are on michigan.gov (403): the Legislature''s list carries numbered executive orders only, so executive directives (for example on IT or AI) could not be looked for and none is confirmed. The only directive named in bytes fetched is Executive Directive 2013-1, which the text layer of the Executive Order 2016-24 PDF recites (''on November 1, 2013, I issued Executive Directive 2013-1, directing the Director of the Department of Technology, Management and Budget (DTMB) to establish and implement an Enterprise Information Management (EIM) program''); the directive itself was not fetched. A web search suggested further directives; none could be fetched, so no number or title of any is recorded. The page is a stub (mi-stub-governor-orders-page). The executive orders watch page covers the current year only (the other years are ?year=YYYY pages and are not watched), so an order of an earlier year cannot appear.'
- text: The Michigan Legislature's Automated Data Collection Policy (https://www.legislature.mi.gov/Home/AutomatedDataCollectionPolicy, read) permits automated collection at no more than one request per second and points to the bulk MCL directory and the LitWebServices public API; the Fetcher's per-host interval is 2 seconds and the bulk directory and per-act PDFs were used. The LitWebServices API was not used.
