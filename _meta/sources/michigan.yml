  why_relevant: 'The state''s cybersecurity statute: DTMB runs the Michigan cyber civilian corps, volunteers who respond to cybersecurity incidents at municipal, educational, nonprofit and critical infrastructure organizations (18.223 to 18.228), with the advisory board (18.229) and the chief information officer''s duties, operating guidelines and client contracts (18.230). It governs a state program and the department''s powers; it does not set security requirements for state agency systems (those are in DTMB policy, which could not be read: see the left-out record).'
