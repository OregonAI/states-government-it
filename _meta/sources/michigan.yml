  stub: true
  stub_reason: 'The PDF is a scan (made on a RICOH MP C3503, run through Adobe Acrobat 10.0 Paper Capture) whose text layer is machine OCR, not real text: it reads ''EIM'' as ''ElM'' 29 times, ''III.'' as ''Ill.'' and ''STATE OF MICHIGAN'' as ''STATE OF MICIDGAN'', so it cannot be committed as verbatim text. Read 2026-11-12 by the two-engine OCR procedure in a scratch run, and NOT promoted: the two engines agree on only 85% of the 57 figures, under the 90% bar (the words agree). The shared reader (src/ingest_ocr.py) also refuses this PDF before reading it, because ocrmypdf aborts on a page that already has a text layer (PriorOcrFoundError; the scratch run had to add --force-ocr, which the shared code does not pass). Reopens when the reader forces OCR over an existing text layer AND a reading passes the figure bar, or a human transcription is supplied.'
  found_via: https://www.legislature.mi.gov/Laws/ExecutiveOrders?year=2016 (row read; the document is the row's link)
