- id: mi-act-431-1984
  sha256: "b86fb8e32b5a34e9d0cd9d83af31f164c7f17ee8cd18507887dc6515f3f26aec"
  url: https://www.legislature.mi.gov/documents/mcl/pdf/MCL-ACT-431-OF-1984.pdf
