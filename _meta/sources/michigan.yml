  recheck: monthly
  found_via: 'https://www.legislature.mi.gov/documents/mcl/ (directory listing, Chapter 18.xml, read through the Fetcher: Act 431 of 1984 is the act headed THE MANAGEMENT AND BUDGET ACT, 233 sections); the act''s own PDF at documents/mcl/pdf/MCL-ACT-431-OF-1984.pdf'
  why_relevant: 'The enabling act of the Department of Technology, Management, and Budget (DTMB). It creates the director''s office and the chief information officer (18.1123, 18.1124: the CIO reports to the governor on information technology services; the department leads the executive branch''s strategic IT plan, reengineers IT infrastructure and serves as general contractor between users and private IT providers), lets the department issue directives binding state agencies (18.1203), covers state automated information processing installations and telecommunications (18.1203, 18.1271), purchasing including IT (18.1261 to 18.1264), the records management program (18.1284 to 18.1292), the enterprise portfolio management office (18.1490) and the executive budget and capital outlay law. The official source is the whole act, so its budget, capital outlay, building and appropriation articles ride along as out-of-scope sections; OWNER DECISION whether the act stays whole or is sliced to the IT, procurement and records sections. The act prints no provision on artificial intelligence (the text was searched for ''artificial'', ''machine learning'' and ''automated'': only automated data processing installations).'
