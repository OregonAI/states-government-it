# Michigan seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Issue #34. Discovery 2026-11-12 through the toolkit Fetcher: the Legislature's website (MCL bulk directory and per-act PDFs,
# the executive order lists and archive documents) and LARA's Administrative Rulemaking System list. Every michigan.gov page
# (DTMB policy library, the Governor's pages) answers HTTP 403 to the Fetcher: see the left-out record and the two stubs.
# The pre-approved-seed exception applies: the owner reviews this list in the PR.
