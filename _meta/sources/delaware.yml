left_out:
- text: "---- Delaware: found and left out (each was seen on an official page on 2026-11-11, unless the item says otherwise; the reason is recorded here). 'Owner decision' marks a judgment call a reviewer should confirm."
- text: "DTI Standards and Policies library (https://dti.delaware.gov/technology-services/standards-and-policies, 38 rows in 9 sections: Access 8, Application 5, Architecture 1, Information 4, Network 1, Other 2, Privacy 2, Security 14, System Management 1). Reconciled row by row: 29 documents (17 Enterprise Policies and 12 standards and guidelines), 3 stubs (Enterprise Services Guide and Systems Architecture Standard, State-network only; the blank Cloud Services and Data Usage Agreement) and 6 left out, listed next. The library has no status column and marks no row retired or draft; the older address dti.delaware.gov/information/standards-policies.shtml serves the same page (identical size). Guidelines are seeded as doc_type standard (the library files them with the standards and several print a 'Standard ID'; owner decision, as for Virginia's guidelines)."
- text: "Library rows left out: (1) 'Acceptable Use Policy Self Test' (https://dti.delaware.gov/security/delaware-acceptable-use-policy-self-test/): a quiz page, not an instrument; not fetched. (2) 'Website CLF Supporting Documents' (https://gic.delaware.gov/common-look-feel/): a page of another agency's supporting files (the Government Information Center); not fetched. (3) 'eRecord Request Form' (eRecords_Request_Form.pdf, 3 pages, fetched): a request form with selection descriptions, drop-downs and a signature line; a form, not an instrument. (4) 'Data Destruction Certification Form' (DataDestructionCertificationForm.pdf, 1 page, fetched): a certificate a vendor fills in ('Form: DTI - DES 001'); a form. (5) 'Terms and Conditions Governing Cloud Security FAQ' (Cloud Security Terms and Conditions FAQ.pdf, 3 pages, fetched): questions and answers on how the cloud policy and agreement are used in an RFP; explanatory, prints no policy number; owner decision, it could be a policy-level guidance document. (6) 'Authorized ProWatch Vendors' (https://mmp.delaware.gov/Contracts/Details/4581): a contract details page on another host; not fetched."
- text: "The library's bulk download (https://webfiles.dti.delaware.gov/pdfs/pp/State_of_DE_Standards_Policies.zip, 15,006,522 bytes, fetched): a zip of 35 PDFs; not seeded as a file, the individual PDFs are the sources. 33 of its files are the PDFs the library page links; two are not linked from the page. (1) 'Generative Artificial Intelligence Examples.pdf': the GenAI examples and Prohibited GenAI Tools list that the Generative Artificial Intelligence Policy OT-AI-001 links; its text is identical to the file fetched at its own address (webfiles.dti.delaware.gov/pdfs/pp/Generative%20Artificial%20Intelligence%20Examples.pdf, HTTP 200, 1 page); seeded as de-ot-ai-001-examples (owner decision on type, see its entry). (2) 'eRecords Designation Form.pdf' (1 page, 'ELECTRONIC RECORDS (RESOURCES) DESIGNATION FORM', March 1, 2023, with a Clear Form button, blank name, title, phone and signature fields): a form an organization head fills in to name a designee under the eRecords policy; a form, not an instrument; left out."
- text: "Statutes read and seeded: Title 29, Chapter 90C (the whole chapter, as its four subchapter pages: the CIO and Department, internet privacy, cyber security, the AI Commission) and Title 6, Chapter 12B (computer security breaches; owner decision: it binds 'any person who conducts business in this State' and defines person to include a government agency, and DTI's cloud policy and agreement cite it, but whether a state agency conducts business is a legal question)."
- text: "Statutes read and left out: Title 6 Chapter 12D (Delaware Personal Data Privacy Act): the page's section on applicability says the chapter does not apply to 'any regulatory, administrative, advisory, executive, appointive, legislative, or judicial body of the State ... including any board, bureau, commission, agency of the State'; it binds private persons. Title 6 Chapter 50C (Safe Destruction of Records Containing Personal Identifying Information): binds a 'commercial entity'; its exclusions include 'any government, governmental subdivision, agency, or instrumentality'. Title 6 Chapter 12A (Uniform Electronic Transactions Act): a general commercial-transactions law; its definition of 'governmental agency' and a subsection that leaves a state agency free to specify additional retention requirements for its own records were seen, but the chapter is not about state IT; owner decision, a section-level slice is possible. Title 6 Chapter 12C (Delaware Online Privacy and Protection Act): its definitions concern operators of websites and advertising services, i.e. private operators; DTI's cloud policy cites its section 1202C only for the definition of personal information; the chapter was not read beyond the definitions. Title 29 Chapter 5, Subchapter I (Public Records, the Delaware Public Archives): records management for all public records, with a definition of 'electronic record' (section 502); read in outline (section list and definitions); not an IT-governance statute, owner decision (it is the closest statute to a data-retention rule for state agencies). Title 29 Chapter 100 (Freedom of Information Act), Chapter 66C (Delaware Children's Internet Protection Act, a library and school filtering law), Chapter 73 (Architectural Accessibility Act, buildings) and Chapter 69 (state procurement) were seen only as titles in the Title 29 chapter list (https://delcode.delaware.gov/title29/index.html) and not read: none is a statute of IT, data or AI as a state function by its title."
- text: "AI statutes: the only one found binding state agencies is Title 29 Chapter 90C Subchapter IV (the AI Commission, seeded). Basis of that claim: the Title 29 and Title 6 chapter lists were read, and discovery searches on the web (not fetched, so nothing from them is in the repo) named only House Bill 333 (2024; creates the Commission, 84 Del. Laws, c. 307) and House Bill 16 (2025; 85 Del. Laws, c. 17, the student member), both of which are in the codified subchapter. The Delaware Code Online has no text search the Fetcher could use without a form, so a statute that mentions AI inside a chapter of another subject would not have been found. Governor Meyer's AI Sandbox joint resolution, a Department of Education K-12 generative AI guidance and the Supreme Court's interim policy on generative AI were named in web-search results only; they were not fetched and are out of scope by type (a resolution is not binding law, K-12 edtech and the judicial branch are out_of_scope in domain.yml)."
- text: "Rules: the Administrative Code. regulations.delaware.gov/AdminCode/ is a JavaScript application: the Fetcher received a 2,709-byte shell with no content. The old static site (https://archive.regulations.delaware.gov/AdminCode/, read) lists 20 titles (1 to 10, 12, 14, 15, 16, 18, 19, 20, 24, 26, 29); Title 8 (Public Information, FOIA) lists '1300 Policies and Procedures Regarding FOIA Requests' under 'Department of Technology and Information, Office of the Secretary' (the PDF 1300.pdf, fetched, is DTI's policy for answering public-records requests under 29 Del. C. ch. 100). It is DTI's only rule found. Left out: a public-records procedure, not an IT, data or AI instrument, and the only text the Fetcher could read is on the archive host, whose currency is unknown (its pages list Governor Markell and Attorney General Biden in the header, so it is a snapshot from about 2015). Owner decision: held out as outside the domain; seeding it needs the current text from the new site. The 'api/register' route named in the issue was not followed: it is an endpoint of the application, not a page or file a visitor's link points to, and no documented public API for the Administrative Code was found. No other DTI rule was found in the archive's title list (Titles 1 to 29 headings read, none for technology)."
- text: "Executive orders. Governor Meyer's page (https://governor.delaware.gov/executive-orders/, both pages, Executive Orders 1 to 28, titles read): none concerns IT, data or AI as a state function. Executive Order 3 (January 22, 2025, 'Committing to a Good Government That Is Ethical, Transparent, and Effective') was read in full: it says state agencies shall be 'as transparent with policies, data, and information as the law allows' (paragraph 12) but is an ethics and efficiency order; left out. Executive Orders 16 and 18 (smart growth; the Delaware Permitting Accelerator) were seen by title only. Previous governors (Delaware Public Archives, https://archives.delaware.gov/executive-orders/, all 14 governor pages fetched; the orders of Carney 65 and Markell 63 were listed in full, those of the other twelve were filtered by title for technology, information, cyber, data, digital, computer, internet, artificial, AI, electronic, security, software, broadband, privacy and records): seeded are Markell 20 (IT consolidation, 2010), Carney 18 (Open Data Council, 2018) and Hall-Long 3. The archive page has no status column, so 'in force' rests on the order's own text and the absence of a rescission in the lists read; both are owner decisions. Left out: Markell 55 (Delaware Cyber Security Advisory Council, October 28, 2015; fetched and read): its council is now established by 29 Del. C. section 9030C (seeded), no order rescinding it was found; held out as superseded by the statute, owner decision. Markell 57 (Open Data Council, dated 'January 27, 2017' on the archive list, 'January, 2016' in its text; fetched and read): rescinded by paragraph 10 of Carney 18. Markell 31 (uniform FOIA procedures, 2011): public-records procedure, title only. Minner 102 (Delaware Information Assurance Task Force, September 20, 2007; fetched and read): a task force whose report was due December 15, 2007. Carper 77 (Electronic Government Steering Committee, February 22, 2000; fetched and read): a steering committee of 2000 with no end date in its text; the Minner list repeats the title (not fetched); both predate and are overtaken by DTI's statute, but no rescission was found; owner decision, older than the domain's use. Titles only, not fetched: Minner's Governor's Information Task Force, Enhanced Public Access Technology Task Force and Delaware Spatial Data I-Team; Tribbitt's and du Pont's Advisory Councils on Data Processing; Castle's High Technology Task Force and Delaware Technology Park orders; Markell 15 (STEM Council). Hall-Long Executive Order 3 (Commission on the Social Drivers of Health, January 17, 2025) is seeded as an AI order, owner decision; Hall-Long Executive Orders 1 (LGBTQ+ Commission, title only) and 2 (Smart Food Program: a report on an AI-driven food-coupon app pilot, due October 15, 2025; fetched and read) are left out as not IT governance and, for 2, a one-time report order."
- text: "Not searched, so no claim is made: the Delaware Code beyond the chapter lists of Titles 6 and 29 (for example Title 11, the Delaware Criminal Justice Information System, which is law-enforcement technology and out_of_scope in domain.yml); the Office of Management and Budget's and Department of Finance's own IT-related policies (the OMB Budget and Accounting Policy Manual, procurement rules); DTI's other web pages (Security, Digital Accessibility, IT Business Cases, Go DE), which are descriptive pages and were seen only as menu items; legislative and judicial branch IT policies (out_of_scope)."
- text: "Links on the library page that are not library rows (both fetched 2026-11-11): the 'ARB Templates page' (https://dti.delaware.gov/about-dti/arb-templates/, in the page's introduction): a page about the Architecture Review Board's templates and requests; templates are not instruments; left out by type. The footer 'FOIA Policy' (https://dti.delaware.gov/about-dti/foia-policy/): DTI's current page on public-records requests; it states that 'The FOIA Policy establishes the guidelines governing the providing of Delaware Department of Technology and Information public records' and cites 'Policy and Procedures Regarding FOIA Requests [ 15 DE Reg 906-910 ]', Delaware Register of Regulations, Volume 15, Issue 6, December 1, 2011. That is the rule the archived Administrative Code lists as 1300 (Title 8), so the page is the current form of the same rule, and the 2011 register date is its currency evidence. It is held out, as the archived rule is, as a public-records procedure (an answer to FOIA requests under 29 Del. C. ch. 100), not an IT, data or AI instrument; owner decision."
