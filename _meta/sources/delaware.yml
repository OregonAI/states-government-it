# Delaware seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Issue #26. Discovery 2026-11-11: the Delaware Code Online (Title 29 chapter list, chapter 90C and its four subchapter pages, Title 6 chapters 12A, 12B, 12C, 12D, 50C),
# DTI's Standards and Policies library (38 rows) and its PDFs, the regulations.delaware.gov Administrative Code shell and the old static Administrative Code site, the Governor's
# executive order list (two pages) and the Delaware Public Archives' order lists for every governor. The three executive orders are scans read by the OCR procedure.
sources:
- id: de-code-29-ch-90c-subch-i
  sha256: "1dc137026d7093b8c9a72bfb722a84e4c647c08d0822e6397997be062ea2e543"
  url: https://delcode.delaware.gov/title29/c090c/sc01/index.html
  format: html
  citation: 29 Del. C. ch. 90C, subch. I
  title: 'Title 29, Chapter 90C, Subchapter I: General Provisions (§§ 9001C to 9016G)'
  doc_type: statute
  issuing_body: Delaware General Assembly; compiled and published by the Division of Research on the Delaware Code Online
  tags:
  - governance
  - oversight
  - procurement
  - funding
  - cybersecurity
  - data
  found_via: https://delcode.delaware.gov/title29/c090c/index.html (the chapter page links its four subchapter pages; the full Title 29 chapter list was read at https://delcode.delaware.gov/title29/index.html)
  why_relevant: 'The enabling statute for DTI and the State Chief Information Officer: intent (9001C), establishment of the Department (9002C), definitions including ''Agency'' and ''Technology'' (9003C), the Department''s powers including statewide technology policies, standards and guidelines (9004C), requirements for agency technology projects and the statewide data dictionary (9006C), the CIO (9007C, 9008C), budgeting and chargeback (9009C), the state information security requirements and the Security Operations Center (9011C), mandatory statewide technology contracts and standards for procurement (9016E), reallocation of technology personnel and equipment (9016F) and criminal background checks (9016G). The page prints the repealed sections 9005C (transferred), 9012C, 9013C and 9014C as headings with their repeal notes.'
  jurisdiction: delaware
  recheck: monthly
- id: de-code-29-ch-90c-subch-ii
  sha256: "1a2d67be4603f1b5f10e4ca950aad0743702f462aa008079bf7203aa0cb632c0"
  url: https://delcode.delaware.gov/title29/c090c/sc02/index.html
  format: html
  citation: 29 Del. C. ch. 90C, subch. II
  title: 'Title 29, Chapter 90C, Subchapter II: Internet Privacy (§§ 9017C to 9022C)'
  doc_type: statute
  issuing_body: Delaware General Assembly; compiled and published by the Division of Research on the Delaware Code Online
  tags:
  - data
  - digital-services
  found_via: https://delcode.delaware.gov/title29/c090c/index.html (the chapter page links its four subchapter pages; the full Title 29 chapter list was read at https://delcode.delaware.gov/title29/index.html)
  why_relevant: 'Obligations of every state agency that maintains a website: a privacy policy built to the elements in 9018C (DTI writes a model policy), posting it with a link (9019C), and no disclosure of a user''s personal information without consent except as 9021C allows.'
  jurisdiction: delaware
  recheck: monthly
- id: de-code-29-ch-90c-subch-iii
  sha256: "d3c4df690de2e927cc61f790475ade27a3acaecd3a0f22c1228b94afa242993e"
  url: https://delcode.delaware.gov/title29/c090c/sc03/index.html
  format: html
  citation: 29 Del. C. ch. 90C, subch. III
  title: 'Title 29, Chapter 90C, Subchapter III: Cyber Security (§ 9030C)'
  doc_type: statute
  issuing_body: Delaware General Assembly; compiled and published by the Division of Research on the Delaware Code Online
  tags:
  - cybersecurity
  - governance
  found_via: https://delcode.delaware.gov/title29/c090c/index.html (the chapter page links its four subchapter pages; the full Title 29 chapter list was read at https://delcode.delaware.gov/title29/index.html)
  why_relevant: Establishes the Delaware Cyber Security Advisory Council, chaired by the State CIO, with DTI providing staff and fiscal support (9030C). It is the statute that continues the council Executive Order 55 (2015) created.
  jurisdiction: delaware
  recheck: monthly
- id: de-code-29-ch-90c-subch-iv
  sha256: "11b89f3c76ed3930b07ec4f35e4ace4486aa0c4e04af2a97b0f695fa04e78db6"
  url: https://delcode.delaware.gov/title29/c090c/sc04/index.html
  format: html
  citation: 29 Del. C. ch. 90C, subch. IV
  title: 'Title 29, Chapter 90C, Subchapter IV: Delaware Artificial Intelligence (AI) Commission (§§ 9041C to 9047C)'
  doc_type: statute
  issuing_body: Delaware General Assembly; compiled and published by the Division of Research on the Delaware Code Online
  tags:
  - ai
  - governance
  found_via: https://delcode.delaware.gov/title29/c090c/index.html (the chapter page links its four subchapter pages; the full Title 29 chapter list was read at https://delcode.delaware.gov/title29/index.html)
  why_relevant: 'The AI statute for state agencies: the Delaware AI Commission, placed within DTI with the CIO providing staff, recommends statewide processes, principles and guidelines for executive, legislative and judicial agencies on the use of AI and conducts an inventory of generative AI use in those agencies (9041C, 9044C). Defines ''Artificial Intelligence'' and ''Generative AI'' (9042C); annual report (9047C). The page''s head reads ''Expires July 17, 2034, pursuant to 84 Del. Laws, c. 307, § 3''. The commission member change of 85 Del. Laws, c. 17 is in the codified text.'
  jurisdiction: delaware
  recheck: monthly
- id: de-code-6-ch-12b
  sha256: "4569af46ea48a5fab98d9f066910912b36a9ba867ebb9170d27d290e3c04052e"
  url: https://delcode.delaware.gov/title6/c012b/index.html
  format: html
  citation: 6 Del. C. ch. 12B
  title: 'Title 6, Chapter 12B: Computer Security Breaches (§§ 12B-100 to 12B-104)'
  doc_type: statute
  issuing_body: Delaware General Assembly; compiled and published by the Division of Research on the Delaware Code Online
  tags:
  - cybersecurity
  - data
  found_via: Cited by DTI's State of Delaware Information Security Policy (SE-ESP-001) and Cloud Services policy (SE-CLD-001) and agreement; page at https://delcode.delaware.gov/title6/c012b/index.html
  why_relevant: The breach statute DTI's cloud policy and agreement tell providers to follow ('6 Del. C. §12B-100 et seq.'). It binds 'any person who conducts business in this State', and 12B-101(6) defines 'Person' to include 'government; governmental subdivision, agency, or instrumentality', which is why it is held; whether a state agency 'conducts business' is the owner's call (see the left-out record).
  jurisdiction: delaware
  recheck: monthly
- id: de-eo-markell-20
  url: https://archivesfiles.delaware.gov/Executive-Orders/Markell/Markell_EO20.pdf
  format: pdf
  citation: Del. Governor Markell, Exec. Order No. 20
  title: More Effectively Utilizing Information Technology Resources to Drive Cost Savings in State Government
  doc_type: executive_order
  issuing_body: Governor of Delaware (Jack A. Markell)
  tags:
  - governance
  - oversight
  - procurement
  - funding
  found_via: https://archives.delaware.gov/executive-orders/governor-jack-markell/ (row 20, dated August 27, 2010)
  why_relevant: Directs DTI to review each Executive Branch Agency for IT consolidation, centralize IT funding with OMB, write policies for managing IT vendors and a state-wide rate card, and review any IT purchase over $10,000 before a purchase order or contract. No rescission was found; the Public Archives list carries no status column (see the left-out record).
  jurisdiction: delaware
  recheck: monthly
  stub: true
  stub_reason: "Markell_EO20.pdf (3 pages) is a scan: each page is one 200 dpi image under a text layer that Adobe Paper Capture made (pdfimages and pdfinfo, 2026-11-11). The shared OCR procedure (src/ingest_ocr.py) runs ocrmypdf without --force-ocr or --skip-text and stops on such a page with 'PriorOcrFoundError: page already has text!' (ingest run 2026-11-11, ocrmypdf exit 6). The embedded layer was not used: it carries recognition errors (for example \"State' s General Fund\" with a space inside the possessive) and is not a human-verified reading. Needs a shared change (see the PR body: an `ocr_force` seed key or --skip-text)."
- id: de-eo-carney-18
  url: https://archivesfiles.delaware.gov/Executive-Orders/Carney/Carney_EO18.pdf
  format: pdf
  citation: Del. Governor Carney, Exec. Order No. 18
  title: Delaware Open Data Council to Promote a More Open, Accountable and Effective Government
  doc_type: executive_order
  issuing_body: Governor of Delaware (John C. Carney)
  tags:
  - data
  - governance
  found_via: https://archives.delaware.gov/executive-orders/governor-john-carney/ (row 18, dated February 12, 2018)
  why_relevant: Continues the Delaware Open Data Council, co-chaired by the State CIO and the Director of the Government Information Center, to recommend standards and policies to DTI and the cabinet agencies on data strategy, open data and data sharing, and requires agencies to inventory and publish datasets on the Open Data Portal. Its paragraph 10 rescinds Executive Order 57 of January 27, 2016 (Markell).
  jurisdiction: delaware
  recheck: monthly
  stub: true
  stub_reason: "Carney_EO18.pdf (3 pages) is a scan: each page is one 200 dpi image under a text layer that Adobe Paper Capture made (pdfimages and pdfinfo, 2026-11-11). The shared OCR procedure (src/ingest_ocr.py) runs ocrmypdf without --force-ocr or --skip-text and stops on such a page with 'PriorOcrFoundError: page already has text!' (ingest run 2026-11-11, ocrmypdf exit 6). The embedded layer was not used: it carries recognition errors ('Counci l', '20 18') and is not a human-verified reading. Needs a shared change (see the PR body: an `ocr_force` seed key or --skip-text)."
- id: de-eo-hall-long-3
  url: https://archivesfiles.delaware.gov/Executive-Orders/Hall-Long/Hall-Long-EO003.pdf
  format: pdf
  citation: Del. Governor Hall-Long, Exec. Order No. 3
  title: Creation of the Delaware Commission on the Social Drivers of Health
  doc_type: executive_order
  issuing_body: Governor of Delaware (Bethany A. Hall-Long)
  tags:
  - ai
  - data
  - governance
  found_via: https://archives.delaware.gov/governor-hall-long/ (row 3, dated January 17, 2025; the Public Archives list for the 14 days Hall-Long served as Governor has three orders)
  why_relevant: 'The one executive order found that is about AI in state programs: it establishes a Commission appointed by the Governor ''to address and recommend solutions to facilitate the integration of artificial intelligence (AI) technology and data-driven programs'' for health, housing, labor and vulnerable populations, with a representative of the Delaware Artificial Intelligence Commission as a member, and names an AI-driven Smart Food Program app as a priority project. Owner decisions: it is a health and social-policy commission that uses AI as a tool, and no rescission or later status was found. Scan (a copier''s output with a text layer) read by the two-engine OCR procedure.'
  jurisdiction: delaware
  recheck: monthly
  stub: true
  stub_reason: "Hall-Long-EO003.pdf (5 pages) is a scan from a Canon copier (Creator 'Canon iR-ADV C5840 PDF', page images and masks, pdfimages 2026-11-11) under a text layer. The shared OCR procedure (src/ingest_ocr.py) runs ocrmypdf without --force-ocr or --skip-text and stops on such a page with 'PriorOcrFoundError: page already has text!' (ingest run 2026-11-11, ocrmypdf exit 6). The embedded layer was not used: it carries recognition errors ('I 0.7%', '(Al)' for '(AI)', signature noise) and is not a human-verified reading. Needs a shared change (see the PR body: an `ocr_force` seed key or --skip-text)."
