# Rhode Island seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Discovery 2026-11-12 through the toolkit Fetcher: rilegislature.gov (the General Laws, Titles 11, 35, 37, 38 and 42 chapter lists and the chapters named below), the Department of Administration's Enterprise Policies list on ri.gov and its policy PDFs, rules.sos.ri.gov (the code of regulations), the Governor's order PDF, the Secretary of State's State Library executive-order search page.
sources:

  # ---- Statutes: General Laws, served one section per page (a chapter is bundled from its index and sections)
  - id: "ri-gl-42-11-2-8"
    sha256: ""
    url: "https://webserver.rilegislature.gov/Statutes/TITLE42/42-11/42-11-2.8.htm"
    format: "html"
    citation: "R.I. Gen. Laws § 42-11-2.8"
    title: "Division of enterprise technology strategy and services established"
    doc_type: "statute"
    jurisdiction: "rhode-island"
    issuing_body: "Rhode Island General Assembly"
    tags: [governance, oversight, digital-services]
    recheck: "monthly"
    why_relevant: "The enabling statute for the central IT body: it establishes the division of enterprise technology strategy and services (ETSS) in the department of administration, with the office of information technology, the office of digital excellence and the office of library and information services, under a chief digital officer who supervises the state's chief information officer, chief technology officer and chief information security officer. It says any earlier statutory reference to the division of information technology now means ETSS, charges ETSS with leading strategic technology decisions across executive-branch agencies, and requires an annual report by January 31. The section is one of the sections of chapter 42-11 (Department of Administration), a non-IT chapter; the Legislature serves each section as its own page and it is seeded as that page (OWNER DECISION, see left_out)."
  - id: "ri-gl-42-11-2-6"
    sha256: ""
    url: "https://webserver.rilegislature.gov/Statutes/TITLE42/42-11/42-11-2.6.htm"
    format: "html"
    citation: "R.I. Gen. Laws § 42-11-2.6"
    title: "Office of Digital Excellence established"
    doc_type: "statute"
    jurisdiction: "rhode-island"
    issuing_body: "Rhode Island General Assembly"
    tags: [governance, digital-services, oversight]
    recheck: "monthly"
    why_relevant: "Establishes the Office of Digital Excellence within ETSS and the chief digital officer (appointed by the director of administration), who manages new and mission-critical technology infrastructure projects and upgrades for state agencies, online services, the state's websites and its social media and mobile applications, and coordinates projects paid from the information technology restricted receipt account and the large systems initiatives fund; annual report each January 31. One section of chapter 42-11, seeded as its own page (OWNER DECISION, see left_out)."
  - id: "ri-gl-42-11-2-5"
    sha256: ""
    url: "https://webserver.rilegislature.gov/Statutes/TITLE42/42-11/42-11-2.5.htm"
    format: "html"
    citation: "R.I. Gen. Laws § 42-11-2.5"
    title: "Information technology restricted receipt account and large systems initiatives fund"
    doc_type: "statute"
    jurisdiction: "rhode-island"
    issuing_body: "Rhode Island General Assembly"
    tags: [funding, oversight]
    recheck: "monthly"
    why_relevant: "The IT funding statute: the information technology restricted receipt account (ITRR account) for acquiring IT improvements for state departments and agencies, the large systems initiatives fund (LSI fund) administered by the chief information officer for enterprise-wide software projects in executive-branch departments, ETSS's duty to adopt rules for disbursement from the ITRR account, and the assignment of an IT project manager to every IT request for proposals. One section of chapter 42-11, seeded as its own page (OWNER DECISION, see left_out)."
  - id: "ri-gl-11-49-3"
    sha256: ""
    url: "https://webserver.rilegislature.gov/Statutes/TITLE11/11-49.3/INDEX.htm"
    format: "html"
    citation: "R.I. Gen. Laws ch. 11-49.3"
    title: "Identity Theft Protection Act of 2015"
    doc_type: "statute"
    jurisdiction: "rhode-island"
    issuing_body: "Rhode Island General Assembly"
    tags: [cybersecurity, data]
    recheck: "monthly"
    why_relevant: "The data-security and breach statute, and the state's cybersecurity-incident statute. Section 11-49.3-2 requires a municipal agency, state agency or person that holds personal information about a Rhode Island resident to keep a risk-based information security program, limit retention and destroy information securely; 11-49.3-4 and 11-49.3-6 govern breach notification by agencies and persons; 11-49.3-7 requires any municipal or state agency that detects a cybersecurity incident to notify the Rhode Island state police within twenty-four hours. Most of the chapter also binds private 'persons' and rides along because the Legislature serves the chapter as a whole (OWNER DECISION, see left_out). The Legislature's list of sections (11-49.3-1 to 11-49.3-7) is bundled, index first."
  - id: "ri-gl-42-165"
    sha256: ""
    url: "https://webserver.rilegislature.gov/Statutes/TITLE42/42-165/INDEX.htm"
    format: "html"
    citation: "R.I. Gen. Laws ch. 42-165"
    title: "Rhode Island Integrated Data System Act"
    doc_type: "statute"
    jurisdiction: "rhode-island"
    issuing_body: "Rhode Island General Assembly"
    tags: [data, governance]
    recheck: "monthly"
    why_relevant: "Creates the Rhode Island integrated data system, its governing board and the participating state agencies, which share and link agency data (the Rhode Island longitudinal data system center). The Governor's Executive Order 24-06 recites that this chapter's executive board issued the Rhode Island Data Governance Program Plan. The statute binds state agencies' use of their own data, so it is the data-governance statute seeded. The Legislature's sections 42-165-1 to 42-165-7 are bundled, index first."

  # ---- Executive order: the PDF on the Governor's files host
  - id: "ri-eo-24-06"
    sha256: ""
    url: "https://governor.ri.gov/sites/g/files/xkgbur236/files/2024-02/Executive-Order-24-06.pdf"
    format: "pdf"
    citation: "Executive Order 24-06"
    title: "Artificial Intelligence and Data Centers of Excellence"
    doc_type: "executive_order"
    jurisdiction: "rhode-island"
    issuing_body: "Governor Daniel J. McKee"
    tags: [ai, data, governance]
    recheck: "monthly"
    found_via: "Discovered by web search (the governor.ri.gov files path); the bytes were fetched through the Fetcher, which got HTTP 200 and 219,025 bytes of PDF printing 'EXECUTIVE ORDER 24-06 February 29, 2024'."
    stub: true
    stub_reason: "The PDF (HTTP 200, 219,025 bytes, 5 pages) is a scan: pdfinfo gives Producer 'KONICA MINOLTA bizhub C360i' and Creator 'publicinfoprint03', and pdfimages shows a full-page image (1288-1292 x 1660-1663 at 150 ppi) on every page. Its text layer is the scanner's own OCR and has errors: 'This Executive Order shall take effect immediately upon the date hereof.' reads '• s Executive Order shall take effect immediately upon the date hereof.', 'So Ordered:' reads 'ed:', 'AI' reads 'Al', and stamp junk heads the page. ocrmypdf refuses the file's prior text layer (ocr: [true] was tried: ocrmypdf exit 6, PriorOcrFoundError: page already has text) and needs --redo-ocr, which src/ingest_ocr.py does not pass (see shared_changes_needed in the PR). Committing the layer as verbatim text would put machine errors in the text of record. No text of record was committed."
    why_relevant: "Governor McKee's order of February 29, 2024: establishes an artificial intelligence task force and a Center of Excellence for AI and data in the Department of Administration, a data center of excellence in the state's Division of Information Technology and a chief data officer, and a statewide federated data platform. The PDF is the only copy the Fetcher could read: the order's page on governor.ri.gov answered the Fetcher with a Cloudflare managed challenge (see the stub below), so its in-force status was not read from the Governor's list (OWNER DECISION, see left_out)."

