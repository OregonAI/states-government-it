left_out:
- text: |-
    Rhode Island: found and left out, or read and found empty (each was seen on an official page and fetched through the Fetcher on 2026-11-12; the reason is recorded here). Seeded: 5 statutes, 0 executive orders (EO 24-06 is a stub), 23 policy and standard documents; 7 stubs (the Governor's order list, EO 24-06 and five scanned policies whose prior text layer or signature the shared OCR code refuses); 3 watched index pages. Statutes carry no effective date (a chapter is many sections); orders and policies carry the dates they print.
- text: |-
    Enterprise Policies list (https://www.ri.gov/app/doa/policies/, the Department of Administration's list of enterprise policies and the statewide IT policy library; the Division of Enterprise Technology Strategy and Services (ETSS) publishes its policies there, as PDFs on rigov-policies.s3.amazonaws.com): all 7 pages were read (20 rows a page; page 8 is empty), 123 rows. Filter applied: the list's own Division column. Its filter has an option 'Division of Enterprise Technology Strategy and Services'; the filtered list (2 pages, 20 + 8 rows) gives the same 28 rows as the ETSS rows of the unfiltered list, and every one of the 28 is in the seed (23 documents and 5 stubs). Not seeded: the other 95 rows, which belong to other divisions and are not IT, data or AI policies: Office of Accounts and Control 47 (accounting, payroll, travel, grants, purchase cards, state property), Division of Human Resources 21 (leave, compensatory time, conduct, workplace and COVID-19 policies), Office of Management and Budget 9 (budget and regulatory review), DCAMM 7 (state fleet, buildings, real estate), Pandemic Recovery Office 5, Division of Purchases 2 (advance payment; vendor engagement in requests for proposals), Department of Administration 2 (building closure; adverse weather), Legal 2 (litigation hold; visitor incident reporting). Of these, 5 rows are forms (the COVID-19 compensatory time payout form, the two Moving - Relocation Expenses forms, the State-Additional Business Transponder Request Form and the Transfer E-Form) and one policy is marked 'EXPIRED!' in its title (the COVID-19 vaccine policy). Borderline, left out, OWNER DECISION: 'Personal Use of State-Issued Cellular Phones and Other State-Provided Portable Communications Devices' (A-69, Office of Accounts and Control, 2019-03-19), 'Procedure for Inactive RIFANS Users' (A-70, the state accounting system's user accounts), 'RIFANS Delegation' (A-60), 'RIFANS Open Invoice Report' (A-72), 'Personal Social Media Use Policy' (Division of Human Resources, 2020-10-29), 'Teleworking' (Division of Human Resources), 'HIPAA Confidentiality' and 'HIPAA-DOA's Designation as a Hybrid under HIPAA' (Division of Human Resources), 'Identification/Access Card Policy' (DCAMM, a building-access card). Their subjects are conduct, finance or facilities rather than IT governance; the index lists each under another division. Each ETSS row's own file prints its dates, which differ from the list's 'Last Revision Date' for several (for example the list gives 2026-07-29 for Policy 300.6, whose file prints Effective Date 15 July 2026); the documents carry the dates the files print. ETSS rows whose files do not say whether they replaced the other: the 2018 Annual Cybersecurity Awareness Training policy and the 2026 Awareness and Training Policy 950.2, the 2016 Bring Your Own Device and 2011 Social Networking policies (both still listed, issued by the Division of Information Technology, which the statute now calls ETSS); all are seeded as listed (OWNER DECISION whether the older three are in force in substance). Policy 09-01 (cell phone and mobile broadband devices) is seeded, though telecommunications is out of scope in domain.yml (OWNER DECISION). The Data Classification Guideline (400.1G) calls itself an advisory, 'not policy'; seeded as a standard-type guidance document (OWNER DECISION). Policy 300.13's Appendix B (Security Categorization Decision Flow) is a diagram whose only text is its heading.
- text: |-
    ETSS's own site: https://etss.ri.gov/ (the home page, /cybersecurity and the pages named in search results) answered the Fetcher with HTTP 403 and a Cloudflare managed challenge, as did https://doit.ri.gov/, https://doit.ri.gov/policies and https://admin.ri.gov/ ; https://doa.ri.gov/ did not resolve. No other endpoint was tried. The ETSS policy PDFs themselves are served from rigov-policies.s3.amazonaws.com, which answered (HTTP 200) for the 28 files linked from the Enterprise Policies list; a file name from a search result that the list does not link (ETSS_Policy_10-16_Physical_and_Environmental_Security__PE_.pdf) answered HTTP 403, and the list's current Physical and Environmental Security policy is 100.11. If ETSS posts policies on etss.ri.gov that the Enterprise Policies list does not carry, they were not seen. The RI.gov Security Policy page (https://www.ri.gov/policies/security/, read) is the public statement of the RI.gov portal's security practices, not an instrument binding agencies: left out, OWNER DECISION.
- text: |-
    Statutes. What was read: the Title 42 chapter list (42-1 to 42-168), the chapter lists of Titles 11, 35, 37 and 38, and the section lists of chapters 42-11, 11-49.3, 42-165, 42-84, 42-127.1 and 42-153. Seeded: § 42-11-2.8 (ETSS established), § 42-11-2.6 (Office of Digital Excellence), § 42-11-2.5 (IT restricted receipt account and large systems initiatives fund), chapter 11-49.3 (every section its index links: 11-49.3-1 to 11-49.3-7) and chapter 42-165 (42-165-1 to 42-165-7). Sections 42-11-2.5, 2.6 and 2.8 sit in chapter 42-11, the Department of Administration's chapter, a non-IT chapter; the Legislature serves each section as its own page, so each is seeded as that page and no slicing is done. The playbook leaves sections of non-IT chapters to an owner decision on section-level slicing: OWNER DECISION whether these three stay. Chapter 11-49.3 binds private 'persons' as well as state and municipal agencies and rides along whole, as Massachusetts c. 93H does (OWNER DECISION). Not seeded, OWNER DECISION: § 42-11-2 (powers and duties of the department of administration: one clause, (19), lets the department operate a data processing center and approve state agencies' acquisition of electronic data processing services; the other powers are general), chapter 42-127.1 (Uniform Electronic Transactions Act: it governs electronic records and signatures generally; read its section list, not its text), chapter 42-84 (Forms Management Center Act: a paper-forms management center), chapter 42-153 (Restricting Radio Frequency Identification Devices: identification documents), chapter 38-2 (Access to Public Records) and 38-3 (Public Records Administration): open-records and records-administration law, chapter 11-52 (Computer Crime): criminal law binding everyone, chapter 42-28.10 (public safety computer aided records system: law-enforcement technology, out of scope), chapter 42-163 (broadband: out of scope), and Title 37 and Title 35 chapters (public property and works, public finance), whose chapter titles name no IT subject. Statutes for private persons only, such as chapter 6-48.1 and the 2025 financial-institutions cybersecurity act, are out of scope by domain.yml and were not read. AI statutes: none found. The chapter titles of Titles 11, 35, 37, 38 and 42 name no AI subject, and none of the five seeded statutes mentions it. Web search (not bytes) turned up unenacted 2025 and 2026 House bills on a state-agency AI inventory (H 5123, H 7119) and 2026 bills on ETSS breach notification (H 7509, S 2638A); none is a General Laws chapter in the lists read, so none is seeded. Titles other than 11, 35, 37, 38 and 42 were not read, and the Legislature's own search was not used.
- text: |-
    Administrative rules (https://rules.sos.ri.gov/organizations, 78 agency links listed): the agency page for Title 220, Department of Administration, and the chapter and subchapter pages of Chapter 60, Enterprise Technology Strategy and Service (220-RICR-60) were read. Its subchapter 05 (Information Technology) and subchapter 10 (Digital Excellence) answer 'There are no Parts in this Subchapter'; subchapter 15 (Library and Information Services) holds four library rules (220-RICR-60-15-1 to 60-15-4: public library construction reimbursement, public library standards, Library of Rhode Island standards, institutional libraries), left out as library regulation, not IT. So the IT agency has issued no administrative rule in force that was found; the chapter page is watched. The table of contents on the organizations page loads each subchapter's parts by script; the pages named here are the visitor's own chapter and subchapter links. Not read: other agencies' rules; the Secretary of State's records management and records retention schedules (the State Archives chapter of the code, 'Records Management') are records rules, out of scope as records administration (OWNER DECISION).
- text: |-
    Executive orders. All governors' orders could not be checked, so which orders on IT, cybersecurity, data or AI are in force is not established. The Governor's list (the executive-orders page on governor.ri.gov, its archive page and the order page for 24-06) answered the Fetcher with HTTP 403 and a Cloudflare managed challenge (recorded as the stub ri-stub-governor-executive-orders). The Secretary of State's State Library executive order search page (https://statelibrarycatalog.sos.ri.gov/cgi-bin/koha/pages.pl?p=govorder, read; it says the library has all orders from 1973 to the present digitally, searchable by keyword or governor) is a visitor's search form, and five of its searches (limit to McKee; 'artificial intelligence'; 'cybersecurity'; 'information technology'; 'data') each answered HTTP 429 after the Fetcher's backoff, two of them with a Cloudflare managed challenge. They were not retried or worked around. Seeded: Executive Order 24-06 (Artificial Intelligence and Data Centers of Excellence, February 29, 2024), whose PDF on the Governor's files host answered (HTTP 200) and prints its own heading; it was found by web search and confirmed only in those bytes, so whether a later order amended or ended it, and whether older orders on IT, cybersecurity or data (any governor) are still in force, were not read: OWNER DECISION and a follow-up once the list is reachable. The order's text says it takes effect on signing and prints no end date.
- text: |-
    Not instruments or not examined: the ETSS annual report (https://etss.ri.gov/sites/g/files/xkgbur466/files/2026-02/Enterprise-Technology-Strategy-and-Services-Annual-Report-2025.pdf, named by web search, not fetched: a report); task-force and commission reports. No statewide IT standards list or enterprise architecture standards page separate from the Enterprise Policies list was found on ri.gov (its home page and policy list were read); ETSS's own pages were challenged (above).
