    citation: Cal. Gov. Code § 7405
    title: 'Government Code, Title 1, Division 7, Chapter 18.1: Electronic and Information Technology'
    doc_type: statute
    jurisdiction: california
    issuing_body: California Legislature
    tags: [digital-services]
    recheck: monthly
    slice: {code: GOV, path: 2.10.52}
    why_relevant: Requires state governmental entities, in developing, procuring, maintaining or using electronic or information technology, to comply with the accessibility requirements of Section 508 of the federal Rehabilitation Act (29 U.S.C. Sec. 794d) and 36 CFR Part 1194.
  - id: ca-gov-11015-5
    sha256: "f193e4a4932034763918ba1d6b43b868c792f1820843da834c280fd4de2917e0"
    url: https://downloads.leginfo.legislature.ca.gov/pubinfo_2025.zip
    format: json
    citation: Cal. Gov. Code § 11015.5
    title: 'Government Code section 11015.5: Electronic collection of personal information by state agencies'
    doc_type: statute
    jurisdiction: california
    issuing_body: California Legislature
    tags: [data, digital-services]
    recheck: monthly
    slice: {code: GOV, section: '11015.5'}
    why_relevant: Every state agency that uses a method, device, identifier or database application on the internet to collect personal information electronically must prominently display a notice at the point of communication with the user.
  - id: ca-gov-11019-9
    sha256: "ebc9656b01a15914ffa368522fbe87630af93275880cdfa28507e97c5386c961"
    url: https://downloads.leginfo.legislature.ca.gov/pubinfo_2025.zip
    format: json
    citation: Cal. Gov. Code § 11019.9
    title: 'Government Code section 11019.9: Privacy policy of each state department and agency'
    doc_type: statute
    jurisdiction: california
    issuing_body: California Legislature
    tags: [data]
    recheck: monthly
    slice: {code: GOV, section: '11019.9'}
    why_relevant: Each state department and state agency must enact and maintain a permanent privacy policy, in adherence with the Information Practices Act of 1977, and post it conspicuously on its Internet Web site; the section sets the principles the policy must include.
  - id: ca-gov-11786-11786-6
    sha256: "50062601bfbb389884997e6ef376e952520023bbe94af13bd49082ea711c1791"
    url: https://downloads.leginfo.legislature.ca.gov/pubinfo_2025.zip
    format: json
    citation: Cal. Gov. Code §§ 11786-11786.6
    title: 'Government Code, Title 2, Division 3, Part 1, Chapter 7.2: Information Technology Innovation Grants Program'
    doc_type: statute
    jurisdiction: california
    issuing_body: California Legislature
    tags: [funding, oversight]
    recheck: monthly
    slice: {code: GOV, path: 3.3.1.14}
    why_relevant: 'An IT grant program for state agencies: the Information Technology Innovation Council (11786), grant guidelines and applications (11786.1), evaluation and funding notice (11786.2, 11786.3), independent evaluation (11786.4), and funding subject to appropriation (11786.6). The chapter still names the Department of Information Technology, which no longer exists; it is in force as published.'
  - id: ca-gov-7929-210
    sha256: "dfc7d74aabc6f12f6df64e9b4173cfe1543d2f4a5cf0b07422f43194e9310c0e"
    url: https://downloads.leginfo.legislature.ca.gov/pubinfo_2025.zip
    format: json
    citation: Cal. Gov. Code § 7929.210
    title: 'Government Code section 7929.210: Information security records of a public agency (California Public Records Act)'
    doc_type: statute
    jurisdiction: california
    issuing_body: California Legislature
    tags: [cybersecurity, data]
    recheck: monthly
    slice: {code: GOV, section: '7929.210'}
    why_relevant: The Public Records Act's exemption for a public agency's information security record whose disclosure 'would reveal vulnerabilities to, or otherwise increase the potential for an attack on, an information technology system of a public agency'; records stored within an IT system that are not otherwise exempt stay disclosable. The one IT-specific provision of the Act; the rest of the Act is out of scope.
  - id: ca-civ-1798-1798-78
    sha256: "6692000fc633ce7856150be793836be257aaca3c3e7187022489f1e6e095322f"
    url: https://downloads.leginfo.legislature.ca.gov/pubinfo_2025.zip
    format: json
    citation: Cal. Civ. Code §§ 1798-1798.78
    title: 'Civil Code, Division 3, Part 4, Title 1.8, Chapter 1: Information Practices Act of 1977'
    doc_type: statute
    jurisdiction: california
    issuing_body: California Legislature
    tags: [data]
    recheck: monthly
    slice: {code: CIV, path: 8.4.34.1}
    why_relevant: 'The statute that governs how state agencies collect, maintain, use and disclose personal information about individuals: agency requirements, conditions of disclosure, accounting of disclosures, individual access and correction, civil remedies and penalties, and the agency breach notification requirement of section 1798.29.'
  - id: ca-pcc-12100-12113
    sha256: "b43479eca250bfdb1a520b60a46421883ce0b5089d97d65a56194921a9c267de"
    url: https://downloads.leginfo.legislature.ca.gov/pubinfo_2025.zip
    format: json
    citation: Cal. Pub. Contract Code §§ 12100-12113
    title: 'Public Contract Code, Division 2, Part 2, Chapter 3: Acquisition of Information Technology Goods and Services'
    doc_type: statute
    jurisdiction: california
    issuing_body: California Legislature
    tags: [procurement]
    recheck: monthly
    slice: {code: PCC, path: 3.2.6}
    why_relevant: 'The state''s information technology acquisition law: 12100 finds that ''the unique aspects of information technology goods and services'' warrant a separate chapter; the Department of General Services and the Department of Technology maintain IT acquisition policies in the State Administrative Manual (12102, 12102.1), award rules for large-scale systems integration projects (12102.2), and postevaluation of IT services contracts (12102.3).'
  - id: ca-gov-16-5
    sha256: "d73445d5820f3fb26b8a743694421088dc4908d13b2dd1bd5a59639690ca0045"
    url: https://downloads.leginfo.legislature.ca.gov/pubinfo_2025.zip
    format: json
    citation: Cal. Gov. Code § 16.5
    title: 'Government Code section 16.5: Digital signatures in written communications with a public entity'
    doc_type: statute
    jurisdiction: california
    issuing_body: California Legislature
    tags: [digital-services, governance]
    recheck: monthly
    slice: {code: GOV, section: '16.5'}
    why_relevant: 'The digital-signature statute for written communications with a public entity: a digital signature has the force of a manual signature if it embodies the attributes listed (16.5(a)), including that it ''conforms to regulations adopted by the Secretary of State'' (16.5(a)(5)). Those regulations are the Secretary of State''s Cal. Code Regs., tit. 2, div. 7, ch. 10 (ingested below), whose notes cite this section as their authority.'
  - id: ca-gov-12168-7
    sha256: "28334f49fc8857a436d797c3ad5d6a9af07a75633d80c87db70ee6969dc2125d"
    url: https://downloads.leginfo.legislature.ca.gov/pubinfo_2025.zip
    format: json
    citation: Cal. Gov. Code § 12168.7
    title: 'Government Code section 12168.7: Uniform statewide standards for public records in electronic media or cloud storage (trusted systems)'
    doc_type: statute
    jurisdiction: california
    issuing_body: California Legislature
    tags: [data, cloud-resilience]
    recheck: monthly
    slice: {code: GOV, section: '12168.7'}
    why_relevant: Has the Secretary of State, 'in consultation with the Department of Technology', approve and adopt uniform statewide standards for storing and recording public records in electronic media or in a cloud computing storage service, including a requirement that a trusted system be used (12168.7(b), (c)); a state agency's records must comply (12168.7(d)(2)). Cal. Code Regs., tit. 2, div. 7, ch. 15 (ingested below) implements it and cites it as its authority.

  # ---- Administrative rules: California Code of Regulations (CCR)
  # The CCR is published only through Westlaw (OAL contract with Thomson Reuters; oal.ca.gov answered the toolkit's Fetcher with HTTP 403, Cloudflare managed challenge, on the first pass, and with HTTP 200 through the curl transport on 2026-11-11, but it links to Westlaw for the text), so
  # the expectation was that every California rule is a stub. Two chapters are the exception: the Secretary of State publishes them on its own site (www.sos.ca.gov, which
  # loads for the Fetcher), under Title 2, Division 7. No Department of Technology or Office of Information Security regulation was found (a web search on 2026-11-11
  # found only conflict-of-interest codes under Title 2, Division 8, which are out of scope).
  - id: ca-ccr-2-div-7-ch-10
    sha256: "f3ae411940f66114f952b81a69ea344b24facbee60eebd3316893f1c97be2d57"
    url: https://www.sos.ca.gov/administration/regulations/current-regulations/technology/digital-signatures
    format: html
    citation: Cal. Code Regs., tit. 2, div. 7, ch. 10
    title: Digital Signatures
    doc_type: rule
    jurisdiction: california
    issuing_body: California Secretary of State
    tags: [digital-services, cybersecurity]
    recheck: monthly
    why_relevant: 'The Secretary of State''s regulations (sections 22000-22005) on digital signatures used with public entities: a digital signature must be created by a technology acceptable for use by the State of California (22001), the criteria for acceptable technologies (22002, 22003), and the criteria a public entity must apply before accepting a digital signature (22005: security of identifying the signer, security of transmission, certificate format).'
  - id: ca-ccr-2-div-7-ch-15
    sha256: "be1e67fec16a707ad2707affed77990c9dec94037d39f805d4314497440f48fd"
    url: https://www.sos.ca.gov/administration/regulations/current-regulations/technology/trustworthy-electronic-document-or-record-preservation
    format: html
    citation: Cal. Code Regs., tit. 2, div. 7, ch. 15
    title: Trustworthy Electronic Document or Record Preservation
    doc_type: rule
    jurisdiction: california
    issuing_body: California Secretary of State
    tags: [data, cloud-resilience]
    recheck: monthly
    why_relevant: The uniform statewide standards (sections 22620.1-22620.8) adopted by the Secretary of State, in consultation with the Department of General Services, for recording, storing and reproducing documents and records in electronic media; they apply to state agencies under Government Code section 12168.7 (b) and (d) and set the conditions of a trusted system.

