  # contents (https://www.dgs.ca.gov/Resources/SAM/TOC), read on 2026-11-11; the IT chapters are 4800 to 5300 and 5900. SAM is the policy
  # manual the Department of Technology and the Office of Information Security write their policies into (Gov. Code 11549.3 (a)(1)).
