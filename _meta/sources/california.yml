# California seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
sources:

  # ================================================================ California
  # Seed list for California (issue #6). Evidence base: pages read on 2026-11-11; see each block comment for what the toolkit Fetcher could and could not reach.

  # ---- Statutes: California Government, Civil and Public Contract Codes (document = one slice of the Legislature's bulk download)
  # leginfo.legislature.ca.gov (the per-section code pages) answers the toolkit's Fetcher with HTTP 403 (Cloudflare managed challenge).
  # The Legislature's own bulk download does load: downloads.leginfo.legislature.ca.gov/pubinfo_2025.zip (the 2025-26 session's law
  # tables, 1.2 GB, last modified 2026-11-08 21:26 on the directory listing). Each statute entry below is one slice of it, read by HTTP
  # range requests with the Fetcher's client (the zip's directory, three tables, one small file per section): `slice.path` is a table-of-
  # contents node of LAW_TOC_TBL.dat (every section under it), `slice.section` is one section number. The snapshot is a JSON bundle of
  # that slice's raw rows and section files; the zip is not committed. The url is the zip, so the monthly drift run (corpus-detect-changes, which GETs each entry's url whole and compares a hash of
  # the body with the entry's `sha256`) will download the 1.2 GB zip once per entry (15 times) and cannot compare it with a baseline taken over a JSON slice bundle: expect it to
  # report these entries as changed or unreadable every month, and treat that as noise until corpus-toolkit can recheck a ranged or sliced source (`recheck:` is not honoured by the
  # toolkit, so it cannot route these entries elsewhere). Drift is the toolkit's; this repo has not run it for these entries.
  - id: ca-gov-11531-11544
    sha256: "991bf4ab85daf144df8df71a73f11aaef171ae53d4f2e9c9b82ad57f4d9e4b24"
    url: https://downloads.leginfo.legislature.ca.gov/pubinfo_2025.zip
    format: json
    citation: Cal. Gov. Code §§ 11531-11544
    title: 'Government Code, Title 2, Division 3, Part 1, Chapter 5.5: Technology (Technology Act of 2005; Office of Technology Services)'
    doc_type: statute
    jurisdiction: california
    issuing_body: California Legislature
    tags: [governance, funding, cloud-resilience]
    recheck: monthly
    slice: {code: GOV, path: 3.3.1.8}
    why_relevant: 'The Office of Technology Services within the Department of Technology, the state''s general-purpose technology services provider (11534 ''to serve the common technology needs of executive branch entities''): its chief reports to the Director of Technology (11538), rates are proposed by the Director of Technology and approved by the Director of Finance (11540), the state data centers are consolidated into it (11542), and the Technology Services Revolving Fund receives its revenue (11544).'
  - id: ca-gov-11545-11548
    sha256: "31dc965e0684e4958a4fb3ba55704c98269a5898d4bd904fcbef83a039ba6f3c"
    url: https://downloads.leginfo.legislature.ca.gov/pubinfo_2025.zip
    format: json
    citation: Cal. Gov. Code §§ 11545-11548
    title: 'Government Code, Title 2, Division 3, Part 1, Chapter 5.6: Department of Technology'
    doc_type: statute
    jurisdiction: california
    issuing_body: California Legislature
    tags: [governance, oversight, ai, digital-services]
    recheck: monthly
    slice: {code: GOV, path: 3.3.1.9}
    why_relevant: 'The enabling statute for the central IT body and the state CIO: 11545 creates the Department of Technology within the Government Operations Agency, with a Director appointed by the Governor ''subject to Senate confirmation'' who ''shall be the State Chief Information Officer''; 11546 makes it responsible for approval and oversight of IT projects and for state IT strategic plans, policies and standards; 11546.1 requires a chief information officer in each state agency and state entity; 11546.2 annual IT cost reports; 11546.45 high-risk, critical IT systems modernization; 11546.45.5 inventory of high-risk automated decision systems and definitions of artificial intelligence; 11546.46 state digital equity plan; 11546.8 the CalCompute consortium; 11547 Department of Finance fiscal oversight of IT projects. Two versions of 11546.1 are printed, as the Legislature''s table holds them. The FIRST (it ends ''(g) This section shall become inoperative on July 1, 2026, and, as of January 1, 2027, is repealed.'' and its history line says ''Inoperative July 1, 2026, by its own provisions'') is no longer operative. The SECOND (''(g) This section shall become operative on July 1, 2026''; history: ''Repealed (in Sec. 26) and added by Stats. 2026, Ch. 28, Sec. 27. (SB 170) Effective June 29, 2026. Operative July 1, 2026'') is the version in force. The two differ in subdivision (e), the list of agencies that are a ''state agency''. Quote the second. The first is repealed by its own terms as of January 1, 2027: re-ingest this document after that date.'
  - id: ca-gov-11549-11549-10
    sha256: "22a66b072954f66b9dc6e122fa63bfd0e0da832ad5ad9a3c23d91feed8f6980e"
    url: https://downloads.leginfo.legislature.ca.gov/pubinfo_2025.zip
    format: json
    citation: Cal. Gov. Code §§ 11549-11549.10
    title: 'Government Code, Title 2, Division 3, Part 1, Chapter 5.7: Office of Information Security and Office of Privacy Protection'
    doc_type: statute
    jurisdiction: california
    issuing_body: California Legislature
    tags: [cybersecurity, data, governance]
    recheck: monthly
    slice: {code: GOV, path: 3.3.1.10}
    why_relevant: 'The cybersecurity statute for state agencies: 11549 creates the Office of Information Security in the Department of Technology ''to ensure the confidentiality, integrity, and availability of state systems and applications''; 11549.3 has its chief establish an information security program, publishing information security and privacy policies, standards and procedures for state agencies in the State Administrative Manual. Article 2 (11549.5-11549.10) creates the Office of Privacy Protection.'
  - id: ca-gov-11549-63-11549-66
    sha256: "4b7693b9426a66d4800ec06ea7576121492ab3b5792152c3a042f4fe0ec5114f"
    url: https://downloads.leginfo.legislature.ca.gov/pubinfo_2025.zip
    format: json
    citation: Cal. Gov. Code §§ 11549.63-11549.66
    title: 'Government Code, Title 2, Division 3, Part 1, Chapter 5.9: Generative Artificial Intelligence Tools'
    doc_type: statute
    jurisdiction: california
    issuing_body: California Legislature
    tags: [ai, governance]
    recheck: monthly
    slice: {code: GOV, path: 3.3.1.12}
    why_relevant: 'The statute on state agency use of generative AI (SB 896, 2024): legislative findings (11549.63), definitions (11549.64), the Department of Technology''s reporting and update duties with the Government Operations Agency, the Office of Data and Innovation and the Department of Human Resources (11549.65), and the requirement that a state agency using GenAI to communicate directly with a person about government services and benefits include a disclaimer (11549.66).'
  - id: ca-gov-8592-30-8592-50
    sha256: "979eb7e61dbfd00bb16a9c6d38175253444fc08b5bf71026112586373af398e2"
    url: https://downloads.leginfo.legislature.ca.gov/pubinfo_2025.zip
    format: json
    citation: Cal. Gov. Code §§ 8592.30-8592.50
    title: 'Government Code, Title 2, Division 1, Chapter 7, Article 6.4: Cybersecurity'
    doc_type: statute
    jurisdiction: california
    issuing_body: California Legislature
    tags: [cybersecurity]
    recheck: monthly
    slice: {code: GOV, path: 3.1.27.20}
    why_relevant: 'Cybersecurity of state agencies'' critical infrastructure controls: definitions (8592.30), the Department of Technology''s update of the Technology Recovery Plan element of the State Administrative Manual with cybersecurity incident response standards (8592.35), agency compliance reporting (8592.40), confidentiality of the reports (8592.45), and an outreach plan by the California Cybersecurity Integration Center for the food and agriculture and water sectors (8592.50).'
  - id: ca-gov-8586-5
    sha256: "cd3b0e7e0bbdbf36f8044206b3db2d9ab8b0ad1836cbb02719e9c1eef6b2ff39"
    url: https://downloads.leginfo.legislature.ca.gov/pubinfo_2025.zip
    format: json
    citation: Cal. Gov. Code § 8586.5
    title: 'Government Code section 8586.5: California Cybersecurity Integration Center'
    doc_type: statute
    jurisdiction: california
    issuing_body: California Legislature
    tags: [cybersecurity, governance]
    recheck: monthly
    slice: {code: GOV, section: '8586.5'}
    why_relevant: Establishes the California Cybersecurity Integration Center under the Office of Emergency Services as 'the central organizing hub of state government's cybersecurity activities', to reduce the likelihood and severity of cyber incidents against the state's economy, critical infrastructure and public and private sector computer networks.
  - id: ca-gov-7405
    sha256: "b646210af17f14b8a185d5850efd768caa34990ad270abf2be50e9272cf5e1c5"
    url: https://downloads.leginfo.legislature.ca.gov/pubinfo_2025.zip
