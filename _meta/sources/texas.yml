left_out:
- text: '---- Texas: found and left out (each was seen on an official page on 2026-11-11; the reason is recorded here)'
- text: |-
    DIR resource library: all 1,367 rows were read (visitor filter forms and the pager, through the Fetcher; the 'All' page size answered HTTP 503, so rows were read by type filter and 28 pages of 50, and the two lists agree at 1,367).
    Filter applied: an instrument is a policy, standard or program manual that DIR (or the state under statute) directs at state agencies, in force, a document of its own. Rows by library type, and what was left out of each:
     - Form, 464 rows: forms, vendor and customer interlocal contract forms, bulk purchase forms; not instruments.
     - Report/Presentation, 357 rows: board agendas and minutes, legislative and statutory reports, webinar slides, conference decks, the strategic plan. Not instruments. Two are directive in tone and borderline, OWNER DECISION: '2026 Agency Risk Assessment Methodology and Remediation Plan Requirements' (September 2026, the method for the IRDR and the remediation plans Gov't Code 2054.068 and 2054.0965 require) and 'Data Ethics in Data Management' (a guide).
     - Policy, 156 rows, of which 3 are seeded: 105 interlocal and customer contracts with named public entities (DIR-TSO-IC series and TSDEC data-center agreements), 32 bulk purchase agreements, ITSAC pricing and statements of work, 7 committee bylaws (SACC, SAIAF subcommittees), and 9 others: DIR Ethics Policy and DIR Leave Administration Policy (DIR's internal personnel rules, not IT), 'Texas Cybersecurity Council Charter' (v8.0, July 2021, the charter of an advisory body), 'Software Currency Policy' (a .docx whose first page reads 'This template is not a guideline for action at your agency'), a data use agreement FAQ, a browser list, an exhibitor kit, a data management learning guide and a conversion template. The 'Software Currency Policy' template and the 'Acceptable Use of the Internet Policy' (a 2015 'Guidelines for State Agencies and Institutions of Higher Education', listed under Guidelines) are the two the title names as policy; both are guidance for agencies to write their own, left out as templates and guidelines (OWNER DECISION).
     - Tool/Template, 133 rows: templates, checklists and workbooks, including 'Model State Agency Policy for Preventing Use of Prohibited Technology' (Jan. 2023) and 'Model Policy for Preventing Use of Prohibited Technology and Covered Applications' (Sept. 2024), models for agencies to adopt (Gov't Code 620.003): left out as templates; OWNER DECISION.
     - No type shown, 85 rows, of which 2 (one file) are seeded: board agendas and minutes, flyers, AI training videos, bulk purchase agreements, the 2026 information security plan template, quick start guides, the 'TEXAS GRANT MANAGEMENT STANDARDS' reader (a grants guide).
     - Guidelines, 57 rows, of which 4 are seeded (the Security Control Standards Catalog, the TX-RAMP manual, the videoconferencing standards and the IRM Continuing Education Guide, the 2023 file behind the row 'IRM Continuing Education Requirements'): guides and instructions (IRCAP and IRDR instructions and FAQs, strategic plan quick reference, data classification guide v1.1 (2018), lease versus purchase, PC life cycle, legacy modernization guide, MFA best practices, cloud services guide, incident response redbook, UETA guidelines, Project Delivery Framework Reference Guides of 2021 and 2023, Prohibited Technologies Exception Request Guide, Web Modernization Best Practice Standards (Feb. 2026, best practices under Gov't Code 2054.652), the Texas Cybersecurity Framework controls and definitions (42 control objectives; DIR's TCF page says the framework is used 'without placing additional regulatory requirements on agencies'), superseded TX-RAMP manual 1.0 and baselines, and 'Videoconferencing Guidelines' and 'IRM Continuing Education Requirements', which are seeded). OWNER DECISION on whether the Project Delivery Framework Reference Guide (the framework Gov't Code 2054 subchapter J requires) is an instrument.
     - Training 43, User Guide 39, News/Events 25, Standard Operating Procedure 4, CPO 3: training decks and instructions, portal user guides, agendas and flyers, PM essentials, three bulk purchase agreements; not instruments. Older fiscal-year certification standards (FY 20-21 to FY 24-25) are superseded by the FY 26-27 files seeded.
     - 'AI Notice' (https://dir.texas.gov/resource-library-item/ai-notice) and 'AI System Facts' (DASH chatbot): DIR's own notice and sample of the standardized notice under Gov't Code 2054.711, a filled-in form.
- text: |-
    Administrative rules (1 TAC, Part 10, Department of Information Resources, and Part 19, Texas Cyber Command): the Texas Administrative Code has no static official source (the Secretary of State's portal pages answer HTTP 200 with an empty script shell, measured 2,530 bytes each for chapters 202, 206, 213, 219 and 477), so no rule is a document and four chapters are stubs. Stubbed: 477 (Information Security Standards; formerly 1 TAC chapter 202, transferred from DIR Part 10 to Texas Cyber Command Part 19 effective August 1, 2026 per the Texas Register's Transferred Rules page of June 26, 2026, https://www.sos.state.tx.us/texreg/archive/June262026/Transferred%20Rules/Transferred%20Rules.html), 206 (State Web Sites; printed in the committed Internet and Email Domain Name Management Policy and State Website Linking and Privacy Policy), 213 (Electronic and Information Resources; printed in the committed FY 26-27 Training Program Certification Standards and in the June 12, 2026 Texas Register adoption, https://www.sos.state.tx.us/texreg/archive/June122026/Adopted%20Rules/1.ADMINISTRATION.html, which carries only the sections adopted) and 219 (Artificial Intelligence). DIR's own pages and policies still cite the chapter as 202; the DIR page watched below is about chapter 202 and where the move shows. Chapters 201 and 203 were added as stubs on 2026-11-12 under the owner's 2026-11-13 decisions (see the last item below). OWNER DECISION: chapters 209 (videoconference meetings) and 211 (information resources managers) and others of Part 10 were named only in a web search, not in any byte fetched from an official site, so they are not seeded; a reviewer with the portal can add them as stubs.
- text: |-
    Executive orders: none seeded. The Governor's executive order list (https://gov.texas.gov/news/category/executive-order) is script-rendered: the page (90,814 bytes, HTTP 200) carries no list items, and the site's RSS feed (https://gov.texas.gov/news/rss) holds only the newest ten news items. One numbered order was found, Executive Order GA-48 'relating to the hardening of state government' (November 19, 2024), served at https://gov.texas.gov/uploads/files/press/EO-GA-48_Hardening_State_Government_FINAL_11-19-2024.pdf (HTTP 200, 542,653 bytes through the Fetcher). It is an image-only scan (pdffonts lists no fonts), so it was not read as text of record; discovery-only OCR shows it binds state agencies and public universities (foreign-adversary vendor certification for state contracts; critical-infrastructure personnel reviews through DPS). It is not seeded: OWNER DECISION on scope (state-government security and contracting rather than IT as such), and if the owner wants it, it is seeded with ocr: true through the two-engine procedure. No other numbered executive order on state IT, cybersecurity, data or AI could be confirmed in bytes. What else was found, from DIR's prohibited technologies page and the three Governor news posts it links (all read): the Governor's December 7, 2022 directive to state agencies banning TikTok and other prohibited technologies, the January 31, 2025 proclamation banning PRC-affiliated AI and social media apps on government-issued devices (a PDF named PROC_..._IMAGE, an image file; not fetched), and the January 2026 update naming the Texas Cyber Command and the model security plan. These three are directives and proclamations rather than numbered executive orders; DIR's Statewide Security Plan, which implements the December 2022 directive, is seeded. OWNER DECISION whether the proclamation and the directive enter, and the executive order index could not be watched because it holds no list in the page.
- text: |-
    Statutes not seeded:
     - Government Code ch. 2060 (Interagency Data Transparency Commission): a study commission whose final report was due September 1, 2016; spent.
     - Government Code ch. 2275 (contracts with certain foreign-owned companies in connection with critical infrastructure) and ch. 2274 (firearm and ammunition industry contract clauses): contracting restrictions with no IT subject.
     - Business and Commerce Code ch. 521 (Identity Theft Enforcement and Protection Act): the duty to protect sensitive personal information and the breach-notice duty bind a 'business' and 'person who conducts business'; the only mention of a governmental entity is as a recipient of a copy of a court order declaring someone a victim of identity theft (subchapter C), not as an obligated party. State agency incident reporting is in Gov't Code 2063.302, seeded. 
     - Government Code ch. 2056 (strategic plans of operation), ch. 2051 and 2052 (government documents, publications and notices; state agency reports), ch. 2053 (report by the Governor on organization and efficiency), ch. 2058 (recognition of federal census), ch. 2170 to 2172 (telecommunications services; travel and vehicle fleet; miscellaneous comptroller services): read at their chapter pages and left out as budget, records, publication, telecom or general-services law with no IT-governance subject (telecommunications is out of scope in domain.yml). The Public Information Act (ch. 552) and the general procurement chapters were not examined. (Superseded 2026-11-13: the owner approved a provision of non-IT law as a section slice when its own focus is the governance of state IT; the candidates read under that decision are recorded in the last item below.)
     - Private-sector AI and privacy law is out of scope (domain.yml). Business and Commerce Code chapter 552 (seeded) is mixed: its governmental entity provisions are the reason it is in; its provisions on any 'person' (manipulation of human behavior, unlawful discrimination, sexually explicit content, the attorney general's enforcement, the sandbox of 'persons') ride along. OWNER DECISION.
     - Gov't Code ch. 2054 sections on telecommunications planning (subchapter H) ride along in the seeded chapter.
- text: |-
    Other DIR program pages read and not seeded: https://dir.texas.gov/information-security/security-policy-and-planning (links the TAC 202 page, the Texas Cybersecurity Framework, TX-RAMP, the Biennial Information Security Plan, SPECTRIM, GRC, the Cybersecurity Council and its charter), https://dir.texas.gov/ai-and-innovation, https://dir.texas.gov/information-security/security-policy-and-planning/texas-cybersecurity-framework, https://dir.texas.gov/information-security/texas-risk-and-authorization-management-program-tx-ramp (its listed 'TX-RAMP Program Manual' item is the version 4.0 file seeded; the page links the TX-RAMP certified products list, requirements and FAQs as pages and files that are guidance or lists). https://dir.texas.gov/technology-legislation and https://dir.texas.gov/strategic-planning-and-reporting: lists of bills and reports, not instruments. The 'Control Crosswalk' (a mapping of the catalog to other control sets) is a reference table, not an instrument.
- text: |-
    Owner decisions of 2026-11-13 applied to Texas (each candidate was read on 2026-11-12 in bytes fetched through the Fetcher; the test is whether the provision's own focus is the governance of state IT):
     - Gov't Code 551.127 (videoconference call), https://tcss.legis.texas.gov/resources/GV/htm/GV.551.htm (HTTP 200, 165,001 bytes): declined. The section is the Open Meetings Act's rule for how a governmental body holds a meeting ('this chapter does not prohibit a governmental body from holding an open or closed meeting by videoconference call'; quorum presence, notice, recording, public visibility). Only subsection (i) turns to IT ('The Department of Information Resources by rule shall specify minimum standards for audio and video signals at a meeting held by videoconference call'), a delegation inside a meeting-procedure section. Its focus is open meetings, not IT governance.
     - Gov't Code 572.070 (foreign influence), https://tcss.legis.texas.gov/resources/GV/htm/GV.572.htm (HTTP 200, 106,917 bytes): declined. It bars employees and volunteers of state agencies and political subdivisions from accepting travel, lodging or gifts from a foreign adversary, requires reports to the Ethics Commission and creates a state jail felony. It is ethics and criminal law about people, with no IT subject.
     - Gov't Code 441.185 (record retention schedules), https://tcss.legis.texas.gov/resources/GV/htm/GV.441.htm (HTTP 200, 257,321 bytes): declined. It binds every state agency's records management officer to survey 'the state records of the agency' and submit a retention schedule, for all records in every medium; electronic records are not its subject (Gov't Code 441.189, 'Electronic state records', is a different section and was not a candidate, so it is not seeded). 13 TAC chapter 6 is different in part: its Subchapter C, 'Standards and Procedures for Management of Electronic Records' (printed in the Texas Register of August 21, 2026, page 5507), is a records provision on electronic records, so it qualifies under decision 1 and is seeded as the stub tx-tac-13-6-subch-c (the portal page is the same script shell as the other chapters; the Library proposed on August 21, 2026 to repeal 13 TAC 6.98, no adoption found through the November 6 issue). The rest of chapter 6, general retention for records in every medium, is declined for the same reason as 441.185.
     - Business and Commerce Code chapter 521 (521.002, 521.053), https://tcss.legis.texas.gov/resources/BC/htm/BC.521.htm (HTTP 200, 33,214 bytes): declined. 521.052 binds 'a business' and 521.053 'a person' who conducts business and holds sensitive personal information; no section binds a state agency's systems (the page's only state mention is the court-order subchapter). Private-sector law, out of scope in domain.yml.
     - 1 TAC chapters 201, 203 and 206: seeded as stubs (the portal serves no rule text; measured again 2026-11-12). 203, electronic transactions and signed records of state agencies, qualifies under decision 1; it is a stub because its text cannot be read.
