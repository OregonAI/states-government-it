# Texas seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Discovery 2026-11-11 through the toolkit Fetcher: DIR resource library (1,367 rows read in full), DIR program pages,
# the Legislature's statute pages (tcss.legis.texas.gov), the Secretary of State's Texas Register archive, gov.texas.gov.
sources:

  # ---- Statutes: one static chapter page per chapter, on the Legislature's own host
  - id: tx-gv-2054
    sha256: "ac3bfff6548f837bbdf1dc163cfee9167bd12f84bf9c8aceb6ce5f516777d547"
    url: "https://tcss.legis.texas.gov/resources/GV/htm/GV.2054.htm"
    format: html
    citation: "Government Code chapter 2054"
    title: "Government Code, Chapter 2054. Information Resources"
    doc_type: statute
    jurisdiction: texas
    issuing_body: Texas Legislature
    tags: [governance, oversight, procurement, funding, cybersecurity, data, ai, digital-services, cloud-resilience]
    recheck: monthly
    why_relevant: "The enabling statute for the Department of Information Resources (DIR) and the state's chief information officer, and the statewide information resources law. Its subchapters, as the page prints them: general provisions and definitions, including heightened scrutiny artificial intelligence systems (A); administration of the department (B); general powers and duties of the department (C); information resources managers (D); strategic and operating plans (E); other powers and duties of state agencies, including the information technology infrastructure report (2054.068), the deployment review (2054.0965) and the website policy (2054.126) (F); project management practices (G); telecommunications planning (H); the state electronic Internet portal (I); the Texas Project Delivery Framework (J); occupational licensing transactions (K); statewide technology centers (L); access to electronic and information resources (M); cybersecurity and artificial intelligence training (N-1); major outsourced contracts (O); additional provisions on contracting (P); legacy system modernization (Q); information resources of governmental entities (R); and three subchapters lettered S (Acts 2025, 89th Leg., R.S., from different bills): modernization of agency websites and digital services (including 2054.652), the artificial intelligence division, and artificial intelligence (code of ethics, heightened scrutiny systems, disclosure, impact assessments, complaint page, standardized notice). The page keeps their colliding section numbers 2054.701 to 2054.713 as published."
  - id: tx-gv-2059
    sha256: "b12700d7da931faaa5a12463a8efc10fd58e7379a3d2baf0c61ebb580441b7df"
    url: "https://tcss.legis.texas.gov/resources/GV/htm/GV.2059.htm"
    format: html
    citation: "Government Code chapter 2059"
    title: "Government Code, Chapter 2059. Texas Computer Network Security System"
    doc_type: statute
    jurisdiction: texas
    issuing_body: Texas Legislature
    tags: [cybersecurity]
    recheck: monthly
    why_relevant: "The statewide network security service for state agencies: the Texas Cyber Command's duty to provide computer network security services, the network security center and its managed security services, network security guidelines and standard operating procedures, disconnection in a state of disaster, and the revolving fund."
  - id: tx-gv-2063
    sha256: "2ee316e335a561aa6d6cff6c5e60932cdcf047a3f37a40775fbfcd2558067970"
    url: "https://tcss.legis.texas.gov/resources/GV/htm/GV.2063.htm"
    format: html
    citation: "Government Code chapter 2063"
    title: "Government Code, Chapter 2063. Texas Cyber Command"
    doc_type: statute
    jurisdiction: texas
    issuing_body: Texas Legislature
    tags: [governance, cybersecurity]
    recheck: monthly
    why_relevant: "The cybersecurity statute for state systems: creates the Texas Cyber Command as a state agency, its chief and powers; minimum standards and certified cybersecurity training (subchapter B); the threat intelligence center, incident response unit and digital forensics laboratory (C); incident notification and reporting by state agencies and local governments (D, including 2063.302); each state agency's information security officer and information security plan, the cybersecurity council, the cloud state risk and authorization program and required penetration tests (E); the volunteer incident response team (F); regional security operations centers (G)."
  - id: tx-gv-2157
    sha256: "936fada400a0696fb96636a467f42b7c623398aceb6f957de6a15c60de1cc296"
    url: "https://tcss.legis.texas.gov/resources/GV/htm/GV.2157.htm"
    format: html
    citation: "Government Code chapter 2157"
    title: "Government Code, Chapter 2157. Purchasing: Purchase of Automated Information Systems"
    doc_type: statute
    jurisdiction: texas
    issuing_body: Texas Legislature
    tags: [procurement, cloud-resilience]
    recheck: monthly
    why_relevant: "The IT procurement chapter for state agencies subject to chapter 2054: best value for automated information systems, purchasing methods, cloud computing service purchases, and the purchase of information technology commodity items (subchapter B). The whole chapter concerns information technology purchasing, unlike the general procurement chapters left out below."
  - id: tx-gv-620
    sha256: "bccccfde1b926c9b5d83bf435e313f5311abbc5d65ad6583da1413126473dfde"
    url: "https://tcss.legis.texas.gov/resources/GV/htm/GV.620.htm"
    format: html
    citation: "Government Code chapter 620"
    title: "Government Code, Chapter 620. Use of Certain Social Media Applications and Services on Governmental Entity Devices Prohibited"
    doc_type: statute
    jurisdiction: texas
    issuing_body: Texas Legislature
    tags: [cybersecurity, ai]
    recheck: monthly
    why_relevant: "Requires each governmental entity to adopt a policy prohibiting the installation or use of a covered application on devices it owns or leases, with the model policy, the exceptions, and the applications identified by gubernatorial proclamation or by DIR and the Department of Public Safety. The page's definitions bind state and local governmental entities alike."
  - id: tx-gv-559
    sha256: "56a3a974cd61ff3257ed6ed38c816edec6c78f231d74e1c0cc601a16cff6bd20"
    url: "https://tcss.legis.texas.gov/resources/GV/htm/GV.559.htm"
    format: html
    citation: "Government Code chapter 559"
    title: "Government Code, Chapter 559. State Government Privacy Policies"
    doc_type: statute
    jurisdiction: texas
    issuing_body: Texas Legislature
    tags: [data]
    recheck: monthly
    why_relevant: "Privacy duties of state governmental bodies for information they collect about individuals: the right to be informed, notice on forms filed on paper or on an Internet site, and correction of incorrect information. Government-held data; the Public Information Act itself (chapter 552) is out of scope."
  - id: tx-gv-560
    sha256: "1e1d3e7f0a43a53f30ee4a4c612deebc56d0b6a01c820329aea8a84c731d2c19"
    url: "https://tcss.legis.texas.gov/resources/GV/htm/GV.560.htm"
    format: html
    citation: "Government Code chapter 560"
    title: "Government Code, Chapter 560. Biometric Identifier"
    doc_type: statute
    jurisdiction: texas
    issuing_body: Texas Legislature
    tags: [data]
    recheck: monthly
    why_relevant: "A governmental body that possesses an individual's biometric identifier may not sell, lease or disclose it without consent or a legal basis, must store, transmit and protect it with at least the care it gives its other confidential information, and the identifier is exempt from public disclosure. Government-held data."
  - id: tx-gv-2062
    sha256: "f3788179a57df9dad545cffc4e522ddd137096bb626344cc2af4b90d6a7a7f2e"
    url: "https://tcss.legis.texas.gov/resources/GV/htm/GV.2062.htm"
    format: html
    citation: "Government Code chapter 2062"
    title: "Government Code, Chapter 2062. Restrictions on State Agency Use and Dissemination of Certain Personal Information"
    doc_type: statute
    jurisdiction: texas
    issuing_body: Texas Legislature
    tags: [data]
    recheck: monthly
    why_relevant: "A state agency may not use GPS, contact tracing or biometric-identifier technology to acquire information that identifies an individual or the individual's location, or retain or disseminate it, without consent (2062.002), and may not disseminate certain personal identifying information of a person who submits information to it without written consent (2062.003, added by H.B. 5129, 2025). Government-held data."
  - id: tx-bc-552
    sha256: "d75f23dd5a0600cb2304eb9f9adacaf94c3b463a35d55335380afcdd623d3d75"
    url: "https://tcss.legis.texas.gov/resources/BC/htm/BC.552.htm"
    format: html
    citation: "Business and Commerce Code chapter 552"
    title: "Business and Commerce Code, Chapter 552. Artificial Intelligence Protection"
    doc_type: statute
    jurisdiction: texas
    issuing_body: Texas Legislature
    tags: [ai]
    recheck: monthly
    why_relevant: "Included for its provisions that bind governmental entities: the disclosure a governmental agency owes consumers who interact with its AI system (552.051(b)), the ban on a governmental entity's AI social scoring (552.053) and on its AI identification of individuals from biometric data or scraped media (552.054(b)). Most of the chapter binds any 'person' and its enforcement runs through the attorney general; those private-sector provisions ride along because the page serves the whole chapter (OWNER DECISION, see left_out)."

