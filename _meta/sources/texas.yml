    sha256: ""
    url: "https://texas-sos.appianportalsgov.com/rules-and-meetings?chapter=203&interface=VIEW_TAC&part=10&title=1"
    format: html
    citation: "1 TAC chapter 203"
    title: "Chapter 203. Management of Electronic Transactions and Signed Records"
    doc_type: rule
    jurisdiction: texas
    issuing_body: Texas Department of Information Resources
    tags: [digital-services, data]
