    tags: [cybersecurity, ai]
    recheck: monthly
    identity_text: "Model Security Plan for Prohibited Technologies"
    found_via: "https://dir.texas.gov/information-security/covered-applications-and-prohibited-technologies (not a resource library row)"
    why_relevant: "The file prints 'Model Security Plan for Prohibited Technologies', 'Date: Jan 26, 2023' and 'Version: 1.0' (DIR's page links it as 'Statewide Security Plan for Prohibited Technologies'; the PDF's file name, not used as the title, reads 'Statewide_Plan_for_Preventing_Use_of_Prohibited_Technology_in_State_Agencies'). The text says the Governor directed the Department of Public Safety (DPS) and DIR to develop it, so DPS is a co-developer; the issuing body is recorded as DIR because the file is hosted by DIR and DIR and DPS jointly maintain the prohibited list it describes. It sets out, after the Governor's December 7, 2022 directive, each state agency's objectives for prohibiting prohibited technologies on state-issued devices and on personal devices used for state business, sensitive locations, network restrictions, exceptions and compliance. The list of prohibited software and hardware, which the Governor and the Texas Cyber Command update, is on the page this was found through, which is watched."
