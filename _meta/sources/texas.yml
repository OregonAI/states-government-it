    stub: true
    stub_reason: "Approved under the owner's 2026-11-13 decision on adjacent subjects (a records provision on electronic records and their retention is IT governance). Existence and title seen in bytes fetched through the Fetcher on 2026-11-12: page 5507 of the Texas Register of August 21, 2026 (https://www.sos.state.tx.us/texreg/pdf/backview/0821/0821is.pdf) prints 'SUBCHAPTER C. STANDARDS AND PROCEDURES FOR MANAGEMENT OF ELECTRONIC RECORDS' over '13 TAC 6.98', and says 6.98 'was adopted in 2017 to provide guidelines regarding the use of electronic records and electronic signatures by state agencies'. The portal page for Title 13, Part 1, Chapter 6 (https://texas-sos.appianportalsgov.com/rules-and-meetings?chapter=6&interface=VIEW_TAC&part=1&title=13) is HTTP 200, 2,528 bytes, an empty script shell (measured 2026-11-12, as for 1 TAC chapters 201 and 203), with the text reachable only through the portal's JavaScript API, which is not called. No static official page serves the chapter. Scope: the same issue proposes to repeal 13 TAC 6.98 (Uniform Electronic Transactions Act; earliest adoption September 20, 2026, 30 days after publication). The Texas Register issues of September 25, October 2, 9, 16, 23 and 30 and November 6, 2026 (the same backview path, fetched and text-searched 2026-11-12) print no notice mentioning 6.98, so no adoption was found and the repeal is neither confirmed nor ruled out; if 6.98 is repealed, it is out of this stub's scope, and the subchapter's other sections (not named in any byte read) would have to be confirmed from the codified text before a document is made."
