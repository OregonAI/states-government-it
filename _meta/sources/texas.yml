    identity_text: "Videoconferencing"
    found_via: "https://dir.texas.gov/resource-library (type Guidelines, titled 'Videoconferencing Guidelines')"
    why_relevant: "The minimum technical standards (bandwidth, cameras, audio, high-definition and non-high-definition video) that governmental bodies' videoconference meetings must meet, set by DIR as Government Code 551.127(i) requires for meetings held by videoconference under the Open Meetings Act. Binds state and local governmental bodies; borderline as IT governance (OWNER DECISION). The library row is titled Guidelines and the file Standards; no newer version is listed."
  - id: tx-dir-irm-continuing-education-guide
    sha256: "6b2635626b5f4a41afdfa32261985fc1acf0e5901331538e48201d40a5ba45d5"
    url: "https://dir.texas.gov/sites/default/files/2023-04/IRM%20Cont%20Ed%20Guide%202023.pdf"
    format: pdf
    citation: "DIR Continuing Education Guide for State Agency Information Resources Managers (IRMs), 2023"
    title: "Continuing Education Guide for State Agency Information Resources Managers (IRMs)"
    doc_type: standard
    jurisdiction: texas
    issuing_body: Texas Department of Information Resources
    tags: [governance]
    recheck: monthly
    identity_text: "Continuing Education Guide for State Agency Information Resources Managers"
    found_via: "https://dir.texas.gov/resource-library (type Guidelines, row 'IRM Continuing Education Requirements')"
    why_relevant: "The mandatory initial and continuing education requirements for the information resources managers (IRMs) of state agencies and institutions of higher education, which Government Code 2054.076(b) requires DIR to provide ('The department shall provide mandatory guidelines to state agencies regarding the initial and continuing education requirements needed for information resources managers'): classification levels by biennial IR budget, core knowledge areas, reporting to DIR by August 31 each fiscal year, waivers. The library types it Guidelines and the file calls itself a guide; seeded as a standard because it sets requirements the agencies' IRMs must meet (OWNER DECISION)."

  # ---- Administrative Code: stubs. The Secretary of State's rule portal serves a script shell (measured below).
  - id: tx-tac-1-477
    sha256: ""
    url: "https://texas-sos.appianportalsgov.com/rules-and-meetings?chapter=477&interface=VIEW_TAC&part=19&title=1"
    format: html
    citation: "1 TAC chapter 477"
    title: "Chapter 477. Information Security Standards"
    doc_type: rule
    jurisdiction: texas
    issuing_body: Texas Cyber Command
    tags: [cybersecurity, governance]
    recheck: monthly
    stub: true
    stub_reason: "The only official source of the codified text is the Secretary of State's Texas Administrative Code portal. The Fetcher got HTTP 200 and 2,530 bytes from the portal page for Title 1, Part 19, Chapter 477: an empty script shell (<div id=\"content\"></div> and a script bundle), no rule text; the text exists only behind the portal's own JavaScript API, which is not a page a visitor's link points to and is not called. The old texreg.sos.state.tx.us viewer answers 'Site Has Moved'. This chapter is the former 1 TAC Part 10, Chapter 202 (DIR): the Texas Register's Transferred Rules page for June 26, 2026 (https://www.sos.state.tx.us/texreg/archive/June262026/Transferred%20Rules/Transferred%20Rules.html, HTTP 200, 2,601 bytes, read) says the Department of Information Resources' substantive rules in Title 1, Part 10, Chapter 202 (Information Security Standards) 'are transferred to Texas Cyber Command under Texas Administrative Code, Title 1, Part 19, Chapter 477 (Information Security Standards)' and that 'The rules will be transferred in the Texas Administrative Code effective August 1, 2026'; the notice's table (https://www.sos.state.tx.us/texreg/archive/June262026/Transferred%20Rules/202602468-1.pdf) renumbers sections 202.1 to 202.5, 202.20 to 202.27 and 202.70 to 202.77 as 477.1 to 477.77. DIR's own pages and the seeded DIR documents still cite Chapter 202 by its old number. Texas Register adoption notices carry only the sections adopted, not the codified chapter."
    why_relevant: "The information security standards for state agencies and institutions of higher education (the agency head, ISO and staff duties, security reporting, the agency information security program, the Security Control Standards Catalog, TX-RAMP), issued by DIR as 1 TAC chapter 202 until the transfer to the Texas Cyber Command as chapter 477 took effect August 1, 2026. The standards catalog seeded above is its required control set."
  - id: tx-tac-1-219
    sha256: ""
    url: "https://texas-sos.appianportalsgov.com/rules-and-meetings?chapter=219&interface=VIEW_TAC&part=10&title=1"
    format: html
    citation: "1 TAC chapter 219"
    title: "Chapter 219. Artificial Intelligence"
    doc_type: rule
    jurisdiction: texas
    issuing_body: Texas Department of Information Resources
    tags: [ai]
    recheck: monthly
    stub: true
    stub_reason: "DIR's AI and Innovation page links this chapter as 'AI Code of Ethics' (and its AI templates page as 'TAC 219', the code of ethics and minimum standards under Government Code 2054.702 and 2054.703); DIR's AI Acceptable Use Policy cites 'Texas Administrative Code, Title 1, Chapter 219 (\"Artificial Intelligence\")'. The portal page is the same empty script shell as for chapter 202 (HTTP 200, 2,530 bytes, no rule text), and the text is reachable only through the portal's JavaScript API. The chapter's sections and adoption were not found in any static official page."
    why_relevant: "DIR's AI system code of ethics and minimum risk management and governance standards for heightened scrutiny AI systems, which Government Code 2054.702 and 2054.703 require state agencies to adopt."
  - id: tx-tac-1-201
    sha256: ""
    url: "https://texas-sos.appianportalsgov.com/rules-and-meetings?chapter=201&interface=VIEW_TAC&part=10&title=1"
    format: html
    citation: "1 TAC chapter 201"
    title: "Chapter 201 (Department of Information Resources rules; section 201.4 on the IRM continuing education waiver)"
    doc_type: rule
    jurisdiction: texas
    issuing_body: Texas Department of Information Resources
    tags: [governance, oversight]
    recheck: monthly
    stub: true
    stub_reason: "Approved owner seed (2026-11-13, seed whole). Seen in bytes fetched from DIR's own host: the IRM Continuing Education Guide (the seeded file) prints 'The DIR Executive Director has the authority to permit a waiver of the mandatory IRM requirements for an agency under 1 Texas Administrative Code Section 201.4'. Re-measured 2026-11-12 through the Fetcher: the Secretary of State's portal page for Title 1, Part 10, Chapter 201 is HTTP 200, 2,530 bytes, the same empty script shell as for chapters 477, 206, 213 and 219 (no rule text); the text is reachable only through the portal's JavaScript API, which is not a page a visitor's link points to and is not called. No static official page serves the chapter, and no official byte read this run names the chapter's title or confirms its current text, so it is not a document. The chapter heading is therefore not stated here."
    why_relevant: "A DIR rule chapter, cited by DIR's IRM Continuing Education Guide for the executive director's power to waive an agency's information resources manager requirements (section 201.4): the state IT authority's direction of agency IT management. Its text was not read."
