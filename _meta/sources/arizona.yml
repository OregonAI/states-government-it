    title: 41-151.16 - Production and reproduction of records by agencies of the state and political subdivisions; admissibility; violation; classification
    doc_type: statute
    jurisdiction: arizona
    issuing_body: Arizona Legislature
    tags: [data]
    recheck: monthly
    found_via: "https://www.azleg.gov/arsDetail?title=41"
    why_relevant: 'A records-law section that is itself about state electronic records: an agency of this state may reproduce records on "film, microfiche, digital imaging or other electronic media", but "shall obtain approval from the director" (of the state library) of the types of records, "the methods of production, reproduction and storage and the equipment" before a program starts, approval is "necessary for digitizing programs", and source documents may be destroyed only after an administrative audit and safeguards. Seeded under the owner decision of 2026-11-13 (a provision whose own focus is the governance of state IT, data or electronic records).'

