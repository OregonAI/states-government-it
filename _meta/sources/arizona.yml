    doc_type: statute
    jurisdiction: arizona
    issuing_body: Arizona Legislature
    tags: [governance, oversight, cybersecurity, data, cloud-resilience]
    recheck: monthly
    found_via: "https://www.azleg.gov/arsDetail?title=18"
    why_relevant: 'The enabling statute for the Department of Administration''s statewide information technology role: the statewide information technology plan and standards, approval or rejection of budget unit plans and projects by cost threshold (referral to the information technology authorization committee above $1,000,000, independent third-party review above $5,000,000), monitoring and suspension of failing projects, the statewide data strategic plan, disaster recovery, the enterprise-level infrastructure (with the statewide information security and privacy office managing its security aspects) and strategies to protect the infrastructure and data.'

