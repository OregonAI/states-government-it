left_out:
- text: '---- Arizona: found and left out (each reason is recorded here; items marked "named only in web search" were not seen in fetched bytes and are not verified)'
- text: |-
    Statutes: the index of every title of the Arizona Revised Statutes (titles 1 to 49, 49 pages) was read through the Fetcher and every section caption was searched for artificial intelligence, automated decision, algorithm, machine learning, generative, synthetic, deepfake, cyber, information security, information technology, data governance, breach, digital, website, privacy. NO STATUTE ON STATE-AGENCY USE OF AI WAS FOUND in the compilation as it stands (the Legislature's notice says it includes the 57th Legislature, 2nd Regular Session revisions). Two 2026 bills named only in web search, not verified: HB 2592 and HB 2311. Neither appears in the compilation, and bills not enacted are out of scope. The only AI captions found were private-law: A.R.S. 16-1023 and 16-1024 (digital impersonation and deepfakes of candidates; election law, out of scope).
- text: |-
    Statutes not seeded, read at their section pages:
     - Title 18, chapter 3 (18-301 to 18-305): reporting by local governments and the state to the Department of Administration. 18-302 (web portal of local governments) and 18-303 (local expenditure reports) concern local government (out of scope); 18-304 (debt reporting) is budget law; 18-305 (state agencies may submit statutorily required reports electronically and must post them on the agency website) is a reporting rule, left out while 18-203, which the article titled Acceptable Use Policy holds, is seeded. OWNER DECISION on 18-305.
     - 18-402 (statewide e-rate program fund): broadband and telecommunications for schools and libraries (out of scope: broadband). 18-441 (secretary of state data processing acquisition fund), 18-443 (secretary of state electronic database system for financial disclosures and lobbyist reporting) and 18-444 (financial disclosure statements): a single office's recording fee fund, a disclosure database and a disclosure duty; borderline, OWNER DECISION on 18-441 and 18-443.
     - 18-501 to 18-504 (computer spyware), 18-541 to 18-544 (internet representations), 18-601 to 18-611 (property technology sandbox) and 18-701 (internet pornography age verification, a duty on websites): bind private persons, out of scope.
     - 41-4251 (definitions), 41-4253 (department employees) and 41-4255 (annual homeland security allocation report): not about information security.
     - 41-712 and 41-713 (telecommunications program office and fund): telecommunications is out of scope in domain.yml.
     - 41-1969 (information technology personnel and employees with access to federal tax information, Department of Economic Security) and 36-113 (fingerprint clearance, information technology positions, Department of Health Services): agency-specific personnel clearance rules, left out while 41-710 (the Department of Administration's own) is seeded. OWNER DECISION.
     - 41-622 (risk management revolving fund, which includes the cyber risk insurance fund): insurance and budget law. 41-2673 and the online bidding article (41-2661 and following) were seen in the index and not read: e-procurement and procurement code sections (non-IT chapters, OWNER DECISION on section slicing as for the other states).
     - Records law, decided 2026-11-13 under the owner's decision that a provision whose own focus is the governance of state IT is in scope as a section slice (each section read at azleg.gov through the Fetcher): 41-151.16 (state agencies' digital imaging and electronic reproduction of records, director's approval of methods, storage and equipment) is SEEDED. Declined, because the section's own focus is not IT: 41-151 (definition of records), 41-151.12 (the director's general records-management duties and fees), 41-151.13 (records management officer and records center, in which micrographics and digital imaging are one function among several), 41-151.14 (every agency's general records program and its misdemeanor), 41-151.15 (preservation of public records in general: it mentions electronic records and, in subsection B, a trusted electronic records repository, but the section as a whole is the general duty to preserve public records), 41-151.17 (records of historical value), 41-151.18 (the Arizona uniform laws commission) and 41-151.19 (determination of value and disposition of records). Also not seeded: 41-151.22 (privacy of library user records), 39-101 and 39-121 and following (public records: the general right of access).
     - 41-1802 and 41-1803 (critical infrastructure information system, Department of Public Safety), 41-5504 to 41-5508 (Uniform Electronic Legal Material Act), 44-7001 and following (the rest of the Uniform Electronic Transactions Act: transactions between persons; 44-7012, electronic records retention, was read on 2026-11-13 under the owner's decision and declined: it tells a person that an electronic record satisfies any law requiring a record to be retained, which is general private and commercial law and not a duty on state IT; the state-agency rule is 44-7042, which is held), 44-7601, 44-1373 (private-sector personal identifying information), 15-1045 and 15-1046 (pupil data privacy: K-12 edtech, out of scope), 16-625 (ballots: election systems, out of scope), 40-360.33 (one-call notification center data security: a utility service).
     - 26-183 is seeded; the rest of Title 26 was not examined beyond its captions.
- text: |-
    Executive orders: the Governor's list (https://azgovernor.gov/executive-orders, pages 0 to 4 hold 50 orders, page 5 is empty) lists only Governor Hobbs' orders, 2023-01 to 2026-03; no filter for other governors was found on the page, and earlier governors' orders were not listed or read. One is seeded (2023-10). Read on their order pages and left out as not about state information technology: 2024-05 (continuity of operations and continuity of government planning: DEMA leads agency continuity plans; a general emergency order), 2025-14 (grants the Department of Homeland Security authority to receive criminal history record information on its own employees and applicants; personnel; it cites A.R.S. 41-4254), 2026-02 (state employees may not use nonpublic information for personal profit; ethics), 2023-21 and 2025-11 (repealers of earlier orders; 2023-21 repeals 2004-23, 2016-01, 2016-05, 2016-06, 2017-01, 2018-04, 2020-31, 2020-34, 2020-60, 2021-02, 2021-17, 2021-18, 2022-01 and 2022-03 (read by OCR of its scan, discovery only) and 2025-11 repeals 2011-08, 2013-02 and 2024-01 (read in page text); neither repeals 2023-10). Every other title on the list was read and is not about state IT, cybersecurity, data or AI. OWNER DECISION: earlier governors' orders still in force on state IT (the list does not show them); a reviewer with the Governor's archive can add them.
- text: |-
    Policy libraries (ASET and the Department of Homeland Security's information security library) and Administrative Code: unreadable (see the three stubs). Policies named only in web-search results, NOT in any byte fetched and therefore not seeded and not verified: P1000, P2000 and 2000PR (names only: a statewide IT governance policy, a generative AI policy and a companion procedure; named only in web search, not verified), and a P8000 series of information security policies (recorded as the stub az-dohs-security-psp-library). A reviewer able to read the ASET and Department of Homeland Security sites should reconcile the library row by row; zero rows could be reconciled in this run because the index could not be read. The statewide AI instrument most likely to exist is P2000 and its existence is unverified. OWNER DECISION on whether to add it as a stub of its own.
