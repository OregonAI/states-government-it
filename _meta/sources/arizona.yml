  # ---- Executive order: the Governor's own order page (born-digital HTML; the PDF beside it is an image-only scan)
  - id: az-eo-2023-10
    sha256: "877f95497568a1edc6ccef600bfa81a60b4a67d5f199afa32f22feeeeb1f17af"
    url: "https://azgovernor.gov/office-arizona-governor/executive-order/executive-order-2023-10"
    format: html
    citation: "Executive Order 2023-10"
    title: "Protecting the State's Cybersecurity Interests"
    doc_type: executive_order
    jurisdiction: arizona
    issuing_body: Office of the Governor
    tags: [cybersecurity, governance]
    recheck: monthly
    found_via: "https://azgovernor.gov/executive-orders (the Governor's list, page 1 to 5; the order's own page)"
    why_relevant: "Governor Hobbs' April 4, 2023 order: all state agencies remove TikTok from state-owned and state-leased information technology and from personal devices used for state work, the Department of Administration and the Department of Homeland Security jointly plan the prohibition of download and access, and report each December 1 on other applications that may need to be restricted, with an exception request process. The text is the order page's HTML (the page prints the order through section 9 but not the signature and seal block). The page's PDF (https://azgovernor.gov/sites/default/files/eo_2023-10_protecting_the_states_cybersecurity_interests.pdf) is an image-only scan (no text layer) and was read by OCR in the first pass; the page was preferred because OCR left visible misreadings. The order is not among those repealed by Executive Orders 2023-21 or 2025-11 (the repealed lists were read)."

