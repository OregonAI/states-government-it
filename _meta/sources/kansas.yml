left_out:
- text: '---- Kansas: found and left out (each was read on an official page on 2026-11-12 unless it says otherwise; the reason is recorded here)'
- text: |-
    ITEC policy and standards library (the statewide IT policy library) and the Kansas Information Security Office (KISO) pages: NOT READ. Every request to ebit.ks.gov and www.ebit.ks.gov through the Fetcher answered HTTP 403 on 2026-11-12 (home page, the ITEC policies page, a showpublisheddocument policy file), so no row of the library was read, no policy was counted and every 'none found' claim for it is withheld. The Fetcher's crawler User-Agent is the only client used; no other route was tried. Named in bytes this run did fetch (the Department of Administration's IT Security page, admin.ks.gov/offices/systems-management/it-security, 'a selection of ITEC policies'): four list items, copied as the page prints them: 'ITEC 1200 Acceptable Internet Use'; 'ITEC 7046-P, 7230a (Section 8) Security Awareness Training'; 'ITEC 7230a (Section 9) Authentication, Accounts, Authorization & Passwords'; 'ITEC 7230a (Section 10) Systems changes, protections, data'. The page gives no address for them; they are not seeded. The Department's pages also point to https://ebit.ks.gov/kiso/home, https://ebit.ks.gov/itec/home, https://ebit.ks.gov/kiso/resources/laws-statutes and https://www.ebit.ks.gov/resources/statutes (same host, same refusal). Web search results (discovery only, nothing from them is in this repo) name other ITEC numbers (3000-P, 4010, 4020, 7000-P, 7230) and a pending ITEC 8000 data series and generative-AI policy: none confirmed in fetched bytes. OWNER DECISION: have the State allow the crawler User-Agent on ebit.ks.gov, or decide how this library is to be read. Two stubs record it (ks-itec-policies-library, ks-itec-1210).
- text: |-
    Governor's executive orders: NOT READ. governor.kansas.gov answered HTTP 403 (home page, /executive-orders/, and www.governor.kansas.gov), so no executive order list was read and no order is seeded. A web search (discovery only) reports that the Governor directed executive branch agencies in August 2023 to adopt a generative AI policy written by OITS; whether that is an executive order or an OITS policy memo, its number and whether it is in force were not confirmed in bytes. Nothing was seeded from it.
- text: |-
    Kansas Administrative Regulations (rules): no rule seeded. https://rules.ks.gov/ answers HTTP 200 with a 749-byte script shell ('Kansas SOS', an empty root div and two JavaScript bundles): the rule text is drawn by script and no data route that a visitor's links point to was found (the issue says to expect this). The Secretary of State's K.A.R. page (sos.ks.gov/publications/pubs_kar.aspx) links only to rules.ks.gov for current regulations; its 'Regulation Resources' page offers 2022 volume PDFs, which are not the current regulations and were not fetched. No K.A.R. section of the IT agency was seen, so none is named; K.S.A. 75-4703, 75-4712, 75-4718 and 75-7203 authorize OITS and ITEC to adopt rules and K.S.A. 75-7243 authorizes rules on cybersecurity service costs. The Secretary of State's regulation modernization page says its new regulation system 'go[es] live May 2026'.
- text: |-
    https://www.da.ks.gov/ and https://da.ks.gov/ (the Department of Administration's older host): the Fetcher refused the TLS connection, 'TLS chain incomplete (server omits its intermediate)', and names a reviewed chain supplement at _meta/tls-chain/da.ks.gov.pem as the remedy. That folder is a shared file area, so no supplement was added in this state's branch (see shared_changes_needed in the PR body). admin.ks.gov, the Department's current host, answered and was used for discovery only.
- text: |-
    Statute sections read and left out, with the reason (K.S.A. article 47 of chapter 75, article 72, and the sections found by caption in chapters 16, 45, 46, 50, 74 and 75; the chapter contents pages were read row by row for the words technology, computer, cyber, artificial, electronic, privacy, digital, internet, network, accessib, website, data, information system and security, and the article 47 and 72 rows in full):
     - Repealed or reserved, the page prints only a history line or 'Reserved': 75-4701a, 75-4702a, 75-4702d, 75-4706, 75-4708, 75-4711, 75-4740, 75-4741 through 75-4743, 75-4744, 75-7213 through 75-7220, 75-7228, 75-7229 through 75-7235. The chapter 75 contents page marks 75-4701a to 75-4702d (other than 75-4702b, 75-4702c, 75-4702e), 75-4706, 75-4708, 75-4711 and 75-4740 to 75-4744 as Repealed.
     - 75-4702 (transfer of the 1972 director's powers to the executive CITO), 75-4702b, 75-4702c and 75-4702e (1984 transition of positions, property and legal actions to the new division) and 75-7212 (abolition of KIRC and the chief information architect and transfers): transition provisions whose work was done, not directives on current IT.
     - Telecommunications: 75-4709, 75-4710, 75-4713, 75-4714, 75-4717 (OITS telecommunications services, the negotiating committee, fees, definitions). Domain.yml puts broadband, 911 and telecom out of scope. 75-4712 (the CITO's rulemaking for telecommunications services for state agencies) is seeded because it is the OITS rulemaking authority.
     - Judicial and legislative branch IT, out of scope under domain.yml: 75-7206 (judicial CITO), 75-7206a (judicial branch CISO), 75-7207 and 75-7208 (legislative CITO), 75-7208a (legislative branch CISO), 46-1501 to 46-1503 (the legislature's information system, by caption). OWNER DECISION: these sit in the same article as the executive provisions and state the CISO structure the cybersecurity act relies on.
     - KAN-ED (broadband for schools, libraries and hospitals, Board of Regents): 75-7221 through 75-7227. Broadband is out of scope.
     - 75-3739a (reverse auction in the general procurement code), 75-444 (the Secretary of State's technology communication fee fund): not IT governance of the state (procurement method; a fee fund for business filings). Section-level slicing of procurement law is the owner's open decision (playbook).
     - 74-72,123 (Kansas taxpayer transparency act: the searchable website of state spending): a transparency-reporting duty, borderline, OWNER DECISION.
     - 74-99f01 (short title) and 74-99f02 (purpose) of the Kansas one map act, and 74-9303, 74-9305, 74-9307, 74-9308, 74-9309 of the Information Network of Kansas act (the corporation's board, manager, financing, deposits and citation): the act's organization and finance, not directives on state IT. The other sections of both acts are seeded; whether GIS and the INK portal are 'IT as a government function' is an OWNER DECISION.
     - 75-2589 (Kansas children's internet protection act: public libraries and school districts) and the other chapter 75 and chapter 74 sections that matched a keyword only: 75-3707e is seeded; those on retirement systems, gaming machines, data centers sales-tax exemptions, health data registries, criminal justice information, technology grants and the Kansas technology enterprise corporation are not state IT governance.
     - Other laws that may bind state agencies and were not read in full: the Kansas open records act and the records-retention law (chapter 45, public records) beyond 45-414 and 45-501; the Kansas computer crimes statute (crime, out of scope).
- text: |-
    Breach statute: K.S.A. 50-7a01 and 50-7a02 are seeded because 50-7a02(a) binds 'a government, governmental subdivision or agency that owns or licenses computerized data that includes personal information'. They bind private persons that conduct business in Kansas as well, and those provisions ride along (the page serves the whole section). OWNER DECISION on the ride-along text, as for other states.
- text: |-
    AI instruments: the only AI statute found is K.S.A. 75-4720 (2025 HB 2313), seeded. The caption lists of chapters 16, 45, 46, 50, 74 and 75 hold no other caption with 'artificial'. Other chapters' captions were not read, so no 'none found' is claimed for them. No executive order or policy on AI could be read (see above).
- text: |-
    The Revisor's section pages lag the 2026 session, and how that was handled. The Revisor's 2026 Composite Listing of New, Amended and Repealed Statutes (K.S.A. Order, dated August 13, 2026, https://www.ksrevisor.gov/rpts/2026NewAmendsAndRepealsKSAOrder.pdf, fetched 2026-11-12; the page of every section links it as '2026 Composite List By KSA') was read row by row, all four tables, for chapters 16, 20, 45, 46, 50, 74 and 75 and every seeded citation was looked up in it. Sixteen seeded sections are listed as amended (Am) effective 7/1/2026 while the Revisor's section pages still printed the K.S.A. 2025 Supp. text: 46-1135, 75-4704, 75-4705 and 75-7205 (House Substitute for Senate Bill 51, L. 2026 ch. 153, §§ 2, 3, 4 and 7, approved April 27, 2026) and 75-413, 75-623, 75-710, 75-711, 75-7202, 75-7203, 75-7237, 75-7238, 75-7239, 75-7240, 75-7245 and 75-7246 (House Bill 2574, L. 2026 ch. 53, §§ 4 to 9 and 12 to 17, approved April 6, 2026). For these the document text is the section cut from the Secretary of State's session-law page (www.sos.ks.gov/publications/sessionlaws/2026/Chapter-153-SB-51.html and Chapter-53-HB-2574.html) with the struck text dropped and the new text kept, because the Revisor's printed text is not the law in force; each document says so and cites the Act. The Act prints no caption, so the title is the Revisor's caption. When the Revisor republishes, these entries should go back to the Revisor's section page (the watch entry for the Composite Listing shows when). The same Act (SB 51, § 1, 'New Section 1') adds K.S.A. 75-7247, which the Revisor has not published (its section page, built from the 75-7246 pattern, answers 404) and the chapter 75 contents page does not list; it is seeded from the session law with the number the Composite Listing gives (Table One: New, SB 51, § 1, ch. 153).
- text: |-
    The 'CAUTION' lines on K.S.A. 75-7201 and 75-7209: the Revisor's pages print that a section 'was further amended by L. 2024, ch. 95' to take effect July 1, 2026. Those delayed 2024 versions were repealed before they took effect by L. 2026, ch. 53, § 18 (House Bill 2574, § 18 names K.S.A. 75-7203, 75-7205, 75-7201, 75-7202, 75-7206, 75-7208, 75-7209, 75-7237, 75-7238, 75-7239 and 75-7240 'as amended by' chapter 95 of the 2024 Session Laws); the Composite Listing shows each as 'Rep' (Table One, comment 'As amended by § N, Ch. 95 of the 2024 Session Laws of Kansas') and Table Three lists the 2024 amendments with '53, § 18'. So 75-7201 and 75-7209 stand as printed and the caution lines point to versions that never took effect; both documents carry a curator note saying so and keep the caution line as the page prints it. The same repeal removed the delayed versions of 75-7206 and 75-7208 (judicial and legislative branch, left out above).
- text: |-
    2026 new and amended sections found in the Composite Listing and left out:
     - K.S.A. 46-4201 (Supp.), New, HB 2574 § 1, L. 2026 ch. 53, effective 7/1/2026: 'There is hereby established the legislative branch information technology oversight council.' (the Act prints no caption). A legislative-branch body that sets standards and policies for legislative branch IT: out of scope under domain.yml (legislative branch), with 75-7207, 75-7208 and 75-7208a. OWNER DECISION with the other legislative and judicial branch provisions above.
     - K.S.A. 20-174 (Supp.), New, HB 2574 § 2, L. 2026 ch. 53, effective 7/1/2026: 'There is hereby established the judicial branch technology oversight council.' (no caption in the Act). A judicial-branch body, out of scope under domain.yml. OWNER DECISION, as above. The Revisor's address built from the pattern, https://www.ksrevisor.gov/statutes/chapters/ch20/020_001_0074.html, answers with a page that prints '20-174. Reserved.' (fetched 2026-11-12), so the new section is not yet published there.
     - K.S.A. 75-7206a and 75-7208a (the judicial and legislative branch chief information security officers, amended by HB 2574 §§ 10 and 11) and 75-4709 and 75-4714 (OITS telecommunications services, amended by SB 51 §§ 5 and 6): already left out above; the 2026 amendment does not change that.
     - Other new 2026 sections in the Composite Listing for chapters 16, 20, 45, 46, 50, 74 and 75 whose session-law title was read in this run (through www.sos.ks.gov/publications/sessionlaws/2026/): 75-795 (HB 2347, crimes), 46-162 and 46-163 (HB 2332, legislative seals), 75-796 (HB 2537, sexual extortion), 46-4101 (SB 325, vehicle services modernization task force), 75-7f01 to 75-7f08 (HB 2700, Kansas digital right-to-repair act, a private-sector duty), 75-659 (SB 232, born to invest act), 74-99g01 to 74-99g08 (HB 2466, Kansas sports authority act), 50-1401 to 50-1404 (HB 2518, consumer legal funding), 75-797 and 75-4384 (Senate Sub. for HB 2372, law enforcement), 50-6,151 to 50-6,156 (SB 375, proxy advisors), 75-658 (SB 361, scholarship tax credit), 75-5097 to 75-50,100 (HB 2647, a Kansas department of transportation conduit system for fiber optic broadband, out of scope as broadband), 75-52,174 (Sub. for HB 2099, conveyance of state real property), 75-53,106 (Sub. for HB 2004, information exchange on public assistance fraud investigations, not IT governance). The remaining 2026 new and amended sections in those chapters were matched by number against the seeded and the left-out sections and against articles 47 and 72 of chapter 75 only; their Acts were not read, so no 'none found' is claimed for them.
- text: |-
    OWNER DECISION, section-level inclusion of non-IT chapters: these sections were seeded whole, and the page serves the whole section, so text outside the state-IT scope rides along. K.S.A. 75-413, 75-623, 75-710 and 75-711 are mainly about appointing assistants and clerks of the Secretary of State, the State Treasurer and the Attorney General and the Kansas bureau of investigation (75-711 also establishes the KBI); a chief information security officer subsection rides along in each, and it is the reason for inclusion (the Act that amended them in 2026, HB 2574, concerns branch and agency information technology). K.S.A. 45-414 (state archivist duties, fees) and 45-501 (records on electronic media) are records-management sections of which the electronic-record parts are the reason for inclusion. K.S.A. 16-1605 sits in the uniform electronic transactions act, whose other sections bind private transactions. K.S.A. 46-2102 (joint committee on information technology) and 46-1135 (post audit IT audits) sit in legislative chapters and bind legislative bodies, as their why_relevant says. The playbook leaves section-level slicing of non-IT chapters to the owner: say whether to keep these whole, slice them, or move them to left out.
