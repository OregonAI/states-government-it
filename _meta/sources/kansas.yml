  doc_type: statute
  jurisdiction: kansas
  issuing_body: Kansas Legislature
  tags: [ai, cybersecurity]
  recheck: monthly
  why_relevant: 'The Kansas statute on state agency use of AI (2025 HB 2313): bars use of an artificial intelligence platform of concern (DeepSeek and models controlled by a country of concern) on any state-owned or employee-issued device and any state-operated network, requires agencies to delete accounts with such a platform, and exempts law enforcement and cybersecurity investigations.'
