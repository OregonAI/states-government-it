# Kansas seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# slice: {article: N} is the section of the 2026 Act (the seed-list check allows only article and part): "Sec. N." of the
# session law the url serves. A new section is {article: New Section 1, part: <K.S.A. number from the Composite Listing>}.
# Discovery 2026-11-12 through the toolkit Fetcher (crawler User-Agent): the Revisor of Statutes (ksrevisor.gov, one page per
# section), the Secretary of State's regulations pages, the Department of Administration (admin.ks.gov). The policy library
# (ebit.ks.gov) and the Governor's site refuse the Fetcher (HTTP 403): see the stubs and left_out. The statute pages were read
# from the chapter contents pages (ksa_ch16, ch45, ch46, ch50, ch74, ch75) row by row.
