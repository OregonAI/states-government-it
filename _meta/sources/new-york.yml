# New York seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md. Playbook: issue #13; this state: issue #15.
# Discovery on 2026-11-11 through the toolkit Fetcher: ITS policy library (its.ny.gov/policies, 64 results),
# the ITS Laws page, the Senate Open Legislation API (statutes), the Governor's executive order lists.
sources:

  # ---- Statutes: State Technology Law, one article per entry (Open Legislation API; the key is added by src/states/new-york.py on the request only)
  - id: "ny-stt-art-1"
    sha256: "df8e6ab745c20723af400121214a04ca028f4839d465f19414f12838b9a74d96"
    url: "https://legislation.nysenate.gov/api/3/laws/STT?full=true&fromLocation=A1&toLocation=A1"
    format: "json"
    citation: "State Technology Law, Article 1 (sections 101-107)"
    title: "State Technology Law, Article 1 - Office of Information Technology Services"
    doc_type: "statute"
    jurisdiction: "new-york"
    issuing_body: "New York State Legislature; served by the New York State Senate Open Legislation API"
    tags: [governance, oversight, procurement, cybersecurity, data, ai, digital-services, cloud-resilience]
    recheck: "monthly"
    slice: {article: "A1"}
    why_relevant: "The enabling article for ITS and its director, the State CIO (sections 101-103): ITS powers and duties including statewide technology policies and standards (103), the State IT innovation center (103-a), gender-neutral terminology on state agency websites (103-b), mobile-friendly websites and cloud computing (103-c, two sections), website accessibility (103-d), the artificial intelligence inventory (103-e), cybersecurity awareness training for state employees (103-f), a second section 103-f on the automated decision-making tool inventory (the API's text), and the advisory council for technology (104-105). The article also holds FOIL for certain data (106), health care proxy information (106-a) and biometric identifying technology in schools (106-b, K-12, which is outside the corpus scope and rides along because the API serves the whole article)."
  - id: "ny-stt-art-2"
    sha256: "9a5afec552a92f0ea74e4ab85dfed1a796905f8c7ecaa238b52b5d78b14e2277"
    url: "https://legislation.nysenate.gov/api/3/laws/STT?full=true&fromLocation=A2&toLocation=A2"
    format: "json"
    citation: "State Technology Law, Article 2 (sections 201-210)"
    title: "State Technology Law, Article 2 - Internet Security and Privacy Act"
    doc_type: "statute"
    jurisdiction: "new-york"
    issuing_body: "New York State Legislature; served by the New York State Senate Open Legislation API"
    tags: [data, cybersecurity, digital-services]
    recheck: "monthly"
    slice: {article: "A2"}
    why_relevant: "State entity duties on internet privacy policies and the collection and disclosure of personal information (203-206), notification of a breach of private information (208-209) and the cybersecurity protection section (210), which requires state entities to adopt cybersecurity policies consistent with the ITS standards. Binds state entities; the API serves the whole article."
  - id: "ny-stt-art-3"
    sha256: "b0301f75cd3feccce7da3878a9faca57600814e59b17288fcd9fd4b620be2363"
    url: "https://legislation.nysenate.gov/api/3/laws/STT?full=true&fromLocation=A3&toLocation=A3"
    format: "json"
    citation: "State Technology Law, Article 3 (sections 301-309)"
    title: "State Technology Law, Article 3 - Electronic Signatures and Records Act"
    doc_type: "statute"
    jurisdiction: "new-york"
    issuing_body: "New York State Legislature; served by the New York State Senate Open Legislation API"
    tags: [digital-services, data]
    recheck: "monthly"
    slice: {article: "A3"}
    why_relevant: "ESRA: ITS as electronic facilitator and the use and acceptance of electronic signatures and records by state entities (301-309); the basis of 9 NYCRR Part 540 and of ITS guideline NYS-G04-001."
  - id: "ny-stt-art-4"
    sha256: "ae4aabb644ccc0ec4f0b53baa1a7f56f19944dceeb469497274d0a7a7bf92b64"
    url: "https://legislation.nysenate.gov/api/3/laws/STT?full=true&fromLocation=A4&toLocation=A4"
    format: "json"
    citation: "State Technology Law, Article 4 (sections 401-402-a)"
    title: "State Technology Law, Article 4 - Automated Employment Decision-making In State Government"
    doc_type: "statute"
    jurisdiction: "new-york"
    issuing_body: "New York State Legislature; served by the New York State Senate Open Legislation API"
    tags: [ai, governance]
    recheck: "monthly"
    slice: {article: "A4"}
    why_relevant: "State agencies that use automated employment decision-making tools must publish a list of them annually (401-402); section 402-a asks the same of covered local entities and rides along. Sections 402 and 402-a carry sunset notes the text prints (effective until, and repealed, July 1, 2028)."
  - id: "ny-stt-art-5"
    sha256: "23b20dcc6b9a8458f514a94cbb47698d2b7df8ebb9d2835d671fdf86c469fcbf"
    url: "https://legislation.nysenate.gov/api/3/laws/STT?full=true&fromLocation=A5&toLocation=A5"
    format: "json"
    citation: "State Technology Law, Article 5 (sections 501-504)"
    title: "State Technology Law, Article 5 - Automated Decision-making In Government Agencies"
    doc_type: "statute"
    jurisdiction: "new-york"
    issuing_body: "New York State Legislature; served by the New York State Senate Open Legislation API"
    tags: [ai, governance, oversight]
    recheck: "monthly"
    slice: {article: "A5"}
    why_relevant: "Article V, as the API serves it: definitions, disclosure of automated decision-making tools by government agencies, impact assessments and the report to the Governor and Legislature (501-504). The text prints 'NB Repealed July 1, 2028'. The API's tree marks the article and its sections repealed with a date of 2026-02-27, which is the date the version that added that note was published; the earlier version 2026-01-09 printed 'NB Effective December 19, 2026'. Enacted law with a sunset, not a bill; whether it is in force today is an owner decision (see the left-out notes)."

  # ---- Rules and executive orders
  - id: "ny-nycrr-551"
    sha256: "0301fca4618fb813307080e7694f4e4caf6a2c93fedb5fb2c30791dd7f3ae6e9"
    url: "https://its.ny.gov/ciooft-personal-privacy-protection-regulations"
    format: "html"
    citation: "9 NYCRR Part 551"
    title: "CIO/OFT Personal Privacy Protection Regulations"
    doc_type: "rule"
    jurisdiction: "new-york"
    issuing_body: "New York State Office of Information Technology Services (ITS)"
    tags: [data]
    recheck: "monthly"
    why_relevant: "ITS's regulation under the Personal Privacy Protection Law (Public Officers Law article 6-A): what personal information ITS keeps and how a person asks to see or correct it (Title 9, Subtitle N Office for Technology, Part 551). Taken from ITS's own page: the official NYCRR on Westlaw refused the Fetcher (HTTP 403, Cloudflare managed challenge, 2026-11-11)."
  - id: "ny-nycrr-540"
    url: "https://its.ny.gov/electronic-signatures-and-records-act-esra-regulation"
    format: "html"
    citation: "9 NYCRR Part 540"
    title: "Electronic Signatures and Records (ESRA Regulation)"
    doc_type: "rule"
    jurisdiction: "new-york"
    issuing_body: "New York State Office of Information Technology Services (ITS)"
    tags: [digital-services, data]
    recheck: "monthly"
    stub: true
    stub_reason: "The only text reachable is ITS's page, which prints 'This is an unofficial copy of the ESRA regulation, posted here merely for convenience.' The official NYCRR (govt.westlaw.com/nycrr, the source ITS's own Laws page links) answered the Fetcher with HTTP 403, a Cloudflare managed challenge (measured 2026-11-11, with the toolkit's curl fallback), and the corpus does not solve challenges. An agency page that calls itself unofficial is not text of record. Becomes a document if the owner accepts the agency copy (it fetches and reads cleanly with the Part 551 reader) or when the official source answers."
    why_relevant: "9 NYCRR Part 540: standards and procedures for electronic signatures and records under article 3 of the State Technology Law (ESRA), where ITS is the electronic facilitator and state entities use or accept electronic signatures and records."
  - id: "ny-eo-117"
    sha256: "a17ff03f590935dbac11ca0acccf88fa3671fbf5b237784d92b48a4ce01f0865"
    url: "https://its.ny.gov/executive-order-117"
    format: "html"
    citation: "Executive Order No. 117"
    title: "Establishing the Position of Chief Information Officer (CIO) of the State of New York"
    doc_type: "executive_order"
    jurisdiction: "new-york"
    issuing_body: "Governor George E. Pataki (continued by later Governors); text as printed by ITS"
    tags: ["governance"]
    recheck: "annual"
    why_relevant: "Issued 2002-01-28 by Governor Pataki: creates the State CIO, who oversees the Office for Technology and coordinates statewide IT policies, protocols and standards for State government. Listed on the Governor's page of prior executive orders that remain in effect, and cited as continued (by Executive Order 6 of 2021) in the footnotes of ITS policies. Text is ITS's own page of the order: the Governor's PDF of it is a scan that did not pass the OCR gates (figure agreement 43% of 14, bar 90%; tesseract page-segmentation modes 3, 4 and 6 tried, 2026-11-11)."
  - id: "ny-eo-95"
    url: "https://www.governor.ny.gov/sites/default/files/atoms/files/EO95_0.pdf"
    format: "pdf"
    citation: "Executive Order No. 95"
    title: "Using Technology to Promote Transparency, Improve Government Performance and Enhance Citizen Engagement"
    doc_type: "executive_order"
    jurisdiction: "new-york"
    issuing_body: "Governor Andrew M. Cuomo (continued by later Governors)"
    tags: ["data", "digital-services"]
    recheck: "annual"
    stub: true
    stub_reason: "The Governor's PDF (4 pages, issued 2013-03-11) is a scan with no text layer and ITS's Laws page lists no copy of it. The two-engine OCR run (tesseract and PaddleOCR) agreed on 98% of the words but on only 81% of the 26 figures (bar 90%; tesseract page-segmentation modes 3, 4 and 6 gave 81%, 83% and 75%), so the OCR is not promotable (run 2026-11-11). Fetched through the Fetcher; no document is written."
    why_relevant: "Issued 2013-03-11: directs state agencies to make public data available in open, machine-readable form and to use technology to improve transparency and engagement (the Open NY order). Listed on the Governor's page of prior executive orders that remain in effect."

