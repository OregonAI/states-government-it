left_out:
- text: '---- New York: found and left out (each was seen on an official page on 2026-11-11; the reason is recorded here)'
- text: |-
    Policy library (https://its.ny.gov/policies, 64 results, reconciled row by row from the 7 listing pages): 57 rows are documents,
    1 is a stub (ITS-P20-004, see its entry), 6 are left out here, and 0 were hidden: the listing has no status column and
    no row is rescinded, archived or draft (checked: no row's PDF prints a rescinded, archived or draft status; the words
    appear only in policy text about other things). The 6 left out fail the inclusion test (their subject is not IT, data or AI
    as a government function); each is an ITS-issued policy under ITS's policy authority, so this is an OWNER DECISION and each
    becomes a document if the owner reads the test more widely:
     - ITS-P06-004 'Ethics Responsibilities of ITS Employees': ethics responsibilities of ITS employees (outside activities, gifts, conflicts: a personnel and ethics matter).
     - ITS-P10-003 'Telecommuting': the ITS telecommuting program (a human-resources program for ITS staff).
     - ITS-P18-006 'Immigration': handling of immigration-status requests about ITS contractors and consultants (a legal and personnel matter).
     - ITS-P08-004 'Gender-Based and Domestic Violence and the Workplace': workplace policy on domestic and gender-based violence (a personnel matter).
     - ITS-P13-001 'Project Sunlight': Project Sunlight training and reporting for covered employees (lobbying transparency, not IT).
     - ITS-S18-001 'Fleet Management Usage': ITS vehicle fleet use (vehicles, not IT).
- text: |-
    Library attachments and linked items not seeded (forms, workbooks, glossary): the four library items that print no
    PDF at their own listing link carry attachments: Digital Identity Risk Management (DIRM) Alignment Form (NYS-S20-001),
    NYS-P13-001 Information Security Exception Form Directions and the Information Security Exception Policy Form,
    Information Asset Identification and Classification Form (NYS-S14-002), and the AI Inventory Excel Workbook (NYS-G25-001).
    Forms and workbooks are not instruments. The listing also links the NYS IT Policies, Standards, and Best Practice
    Guidelines Glossary (a list of defined terms): linked, not fetched, not seeded. OWNER DECISION whether the glossary enters.
    The four items above are seeded from the PDF that each item's own page links (the listing link answers with that PDF for
    the other 60 rows and with an HTML page, whose Download link was followed, for these four).
- text: |-
    Statutes: the State Technology Law (chapter 57-A, lawId STT) is held as its five articles (101-107, 201-210, 301-309, 401-402-a,
    501-504); the chapter has no other. Searching the Open Legislation API (documented public search, terms 'artificial
    intelligence', 'automated decision', 'cybersecurity', 'chief information officer', 'information technology services') found
    these outside it, left out:
     - State Finance Law 163-e and 165 and General Municipal Law 103-h (restrictions on purchasing technology that poses a
       security threat; General Municipal Law 103-h is the local-government twin): sections inside the procurement chapters.
       The playbook leaves such sections out pending an owner decision on section-level slicing. OWNER DECISION.
     - Executive Law 711-c (cybersecurity incident reviews, Division of Homeland Security and Emergency Services, article 26):
       a section of the Executive Law, not an IT chapter; same pending decision. OWNER DECISION.
     - General Municipal Law article 19-C (995-a to 995-c, cybersecurity incident reporting by municipal corporations and
       public authorities): local government, out of scope.
     - Public Officers Law article 6-A (the Personal Privacy Protection Law, the statute 9 NYCRR Part 551 implements): named in
       the rule and the ITS pages, not fetched; a data-privacy article of a non-IT chapter, same pending decision. OWNER DECISION.
     - Economic Development (Commerce) Law section 361 (Empire AI research program) and General Business Law article 47 (AI
       companion models): a research consortium and a private-sector rule, out of scope.
    Article 5 of the State Technology Law (501-504) and the second section 103-f in article 1 (the automated decision-making
    tool inventory) are held as documents. The API marks them repealed (repealed true, repealedDate 2026-02-27) while the text
    prints 'NB Repealed July 1, 2028'; the same 501 text printed 'NB Effective December 19, 2026' in the 2026-01-09 version
    (fetched with the API's date parameter). Read as enacted law with a sunset, not a repeal already in effect; whether it is
    in force today, and whether the flag means otherwise, is an OWNER DECISION. Article 1 also carries 106-b (biometric
    identifying technology in schools), outside scope, because the API serves the article whole.
    ITS's own page 'NYS Technology Law' is an unofficial copy (it says so) and was not used for text.
- text: |-
    Rules: ITS's Laws page lists three regulations and the NYCRR link. 9 NYCRR Part 551 is a document. Part 540 (ESRA) is a
    stub (the ITS copy calls itself unofficial; the official NYCRR on Westlaw answers the Fetcher with a Cloudflare managed
    challenge, HTTP 403). The ITS FOIL regulations (ITS's procedures for Freedom of Information Law requests) are left out:
    public-records procedure, the category Oregon and Washington left out; OWNER DECISION. The official NYCRR is only on
    Westlaw, so no search of other agencies' Title 9 or other titles for IT rules could be made through the Fetcher; any
    IT rule outside ITS's two Parts is unknown.
- text: |-
    Executive orders: the Governor's current list (238 orders, 3 listing pages at 100 a page) was read by title: none concerns
    state IT, cybersecurity, data or AI. No AI executive order exists in it. Left out from it: No. 62 (temporary moratorium
    on data centers: energy, water and environmental permitting for private data centers, not state agency IT; OWNER DECISION).
    The Governor's page of prior executive orders that remain in effect (about 120 orders from five administrations) was read by
    title; in scope and seeded: No. 117 (State CIO) and No. 95 (open data and technology). Left out: No. 183 of 2018 (confidentiality
    of public-sector workers' personal information: personnel privacy, not data governance; OWNER DECISION), No. 3 of 2007
    (Spitzer, webcasting of public meetings: open meetings), No. 175 of 2018 (net neutrality in state contracts: telecom,
    out of scope), Nos. 42 and 7 of 2008-2010 (Paterson: Executive Chamber records management; personal use of state property),
    and the rest (disaster, appointments, labor, environment). ITS also prints No. 117 and No. 3 as HTML pages; the Governor's
    PDFs are the text of record, and the ITS HTML copies were not used.
- text: |-
    Pages that are not instruments: ITS landing pages for Artificial Intelligence (training pilot, news and interviews; it names
    a Chief AI Officer and points to the AI policy and the inventory guidance, both seeded), Data Privacy (how to request personal
    records), Procurement (vendor information) and Cybersecurity (awareness material).
- text: |-
    No watch entry exists for the statutes: the Open Legislation API needs a key, and a drift run fetches a seed entry's keyless
    url, so the five statute entries cannot be drift-checked as they stand. The ITS Laws page is watched instead.
