  why_relevant: 'Each state agency determines whether and how far it will "send and receive electronic records and electronic signatures" and "create, generate, communicate, store, process, use, and rely upon" them (division A); it may waive Revised Code requirements on the method of posting, sending or formatting records only under criteria consistent with the Department of Administrative Services'' rules (division B); agency electronic-records rules must be consistent with those rules, records are created, used, received and retained in accordance with R.C. 149.40, and electronic signatures follow the department''s rules (divisions C and D); an electronic filing has the same effect as a paper filing where the agency has agreed to it (division F); and division H defines "state agency" for the electronic transaction sections. One section of the Uniform Electronic Transactions Act chapter, which otherwise binds private persons, seeded as its own page (owner decision 2026-11-13: seed whole candidate, the definition of state agency cited by R.C. 1306.21).'
  recheck: monthly
