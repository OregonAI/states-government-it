  why_relevant: 'The enabling statute for the Office of Information Technology in the Department of Administrative Services and the state chief information officer: the office and CIO (division A), the CIO''s duty to set policies and standards for state agency IT, including security and the extension of service life, with which state agencies shall comply, project alignment and oversight criteria, policies for the security of personal information, the chief information security officer and the chief privacy officer (division B), and IT purchase review. R.C. 125.18 is one section of chapter 125 (Department of Administrative Services - Office Services, mostly procurement), so it is seeded as its own page, which codes.ohio.gov serves per section.'
