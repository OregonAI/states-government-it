left_out:
- text: '---- Ohio: found and left out (each was seen in bytes fetched through the toolkit Fetcher on 2026-11-12, or in a web search where it says so; the reason is recorded here). ''Owner decision'' marks a judgment call a reviewer should confirm.'
- text: 'The statewide IT policy library, reconciled as far as its pages allow. The library''s index, https://das.ohio.gov/technology-and-strategy/policies (title ''Policy Finder'', HTTP 200, 363,348 bytes), draws its list of policies by script: the rows are not in the page bytes, and the feed behind it is an internal endpoint that was not called. So the list could not be read row by row. The policies were found from links a visitor can follow: the per-policy pages'' own links to each other, the Resources of IT-17, the ''Related Policies'' page of IT Strategic Investment and Architecture (https://das.ohio.gov/technology-and-strategy/it-strategic-investment-and-architecture/related-policies, which lists IT-01, IT-02 and IT-16), the IT-01 page''s table of enumeration (IT-##, ITS-[domain]-##, OEP-[division].####) and the pattern of the policy addresses. Fetched with HTTP 200 and seeded: IT-01 to IT-21 (21 policies; 12 of the addresses, IT-01, 02, 03, 06, 07, 09, 10, 11, 12, 15, 20 and 21, are built from the it-NN pattern, say so in their found_via, and each page''s own heading confirms its number and title; IT-11 answered 502 Bad Gateway in the review run and 200 here; IT-21 answered 502 on the first request and 200 on retry); ITS-SEC-01 and ITS-SEC-02 (PDF attachments of their DAS pages); three more standards are stubs (ITS-SEC-03, -04, -06: sign-in only). IT-22, IT-23 and IT-24 and the das.ohio.gov address of ITS-SEC-03, -04, -05 and -06 answer 200 with the portal''s ''No content found'' page (its-sec-05 is a guessed address): nothing is published there. ''None found'' is claimed only for those addresses, not for the library as a whole. Every policy page seeded prints ''Effective:'' with a date on or before 2026-09-01 (IT-16 takes effect September 1, 2026, which is past on 2026-11-12) and none is marked rescinded, superseded or draft. ITS-SEC-05 ''IT Supplier Risk Management'' is named by IT-21 and has no page or file found (left out; owner decision: it belongs in the corpus when DAS publishes it). ''OEP-'' Enterprise IT Procedures are named by IT-01 and none was found published. The IT Policy Glossary (https://das.ohio.gov/technology-and-strategy/it-policy-glossary) defines the capitalized terms every policy uses by link: a reference list, left out (owner decision: the policies incorporate its definitions by reference, so it could be seeded as a policy).'
- text: 'Left out of the library, by type (each seen on an IT-17, IT-02, IT-18 or IT-20 page fetched 2026-11-12). Spreadsheets: AI_Governance_Roles_and_Responsibilities.xlsx and State_of_Ohio_Generative_AI_Central_Repository.xlsx (linked from IT-17), the AI Governance Operations Chart (xlsx). Word templates: AI_Procurement_Checklist_for_State_Agencies.dotx and State_of_Ohio_Generative_AI_Central_Repository_Template_Accessible.dotx (IT-17). Forms: the Supplier Assessment for Generative AI Solutions form on the State of Ohio IT Hub (IT-17; a form, linked not fetched). Supporting pages: ''AI Governance Operations Chart'' (https://das.ohio.gov/technology-and-strategy/policies/ai+governance+operations+chart, an HTML table of roles) and ''AI Comparison Criteria'' (https://das.ohio.gov/technology-and-strategy/policies/ai+comparison+criteria, a table comparing conventional and generative AI): reference material the IT-17 page lists, not instruments. Planning tools of IT-02: the Enterprise Planning Portfolio Decision Making Framework and the Criteria for Prioritization and Rating Scale (PDFs on dam.assets.ohio.gov and das.ohio.gov/static, not fetched; process tools and rating scales, not instruments), and the ''Strategic Resources'' strategy pages. Guidance documents by the State CISO that support a policy: ''State of Ohio Cybersecurity Guidance: Incident Response'' (7 pages, issued 11/05/2025, supports IT-18 and ITS-SEC-06) and ''Vulnerability Management Implementation Support'' (4 pages, issued 09/22/2025, supports IT-20 and ITS-SEC-03), both fetched with a text layer: left out as guidance, not policy (owner decision: they are DAS publications that state agencies are expected to follow, so they could be seeded as policies). The ''Use of AI FAQs'' (seen in web search only, not fetched: a FAQ). The OIT Strategic Vision 2024-2026 and IT Innovation Strategic Plan (seen in web search only: strategy documents). DAS policies outside IT that the pages link (PM-01 Purchasing Goods and Services, PM-02 Emergency Purchasing Procedures, AM-02 Disposal of Excess Surplus Property, the employee-relations disability inclusion and accessibility policy, the State of Ohio Procurement Manual): procurement, property and personnel policies, out of this domain (owner decision for PM-01 and the Procurement Manual, which govern IT purchases among others). DAS internal policies 700-01, 700-02, 100-11 and 2100-04 were seen in web search results on older addresses only; they were not found in the pages read and were not fetched.'
- text: 'AI Governance Framework and AI Council Charter: decided from the IT-17 page, 2026-11-12. The IT-17 page lists both, with the AI Governance Operations Chart, as ''Additional Downloads'' under the policy, not as library policies. The State of Ohio AI Governance Framework (https://dam.assets.ohio.gov/image/upload/das.ohio.gov/technology-strategy/policy/State%20of%20Ohio%20AI%20Governance%20Framework.pdf, the first pass seeded it; 2 pages: a diagram of the governing bodies and their roles and a narrative of the principles) is a diagram with a narrative, the kind of strategy document the playbook leaves out, and its content is in IT-17''s own text: LEFT OUT and removed from the seed list (owner decision: borderline). The State of Ohio AI Council Charter (seeded, oh-ai-council-charter) is kept: it is not a diagram or a plan but the governing document of the AI Council to which IT-17 sends agency use cases, with membership and duties (owner decision: borderline; a reviewer may prefer to treat it as a supporting download and drop it).'
- text: 'Enterprise Architecture: ''State of Ohio Technology Standards Document'' (revision history to 03/04/2024; the PDF https://dam.assets.ohio.gov/image/upload/ohioairquality.ohio.gov/About%20Us/RFQ/State_of_Ohio_-_Enterprise_Architecture_Technology_Standards_03042024.pdf, fetched 2026-11-12, 12 pages with a text layer) is the DAS statewide technology standards document, but this copy is an attachment on the Ohio EPA air quality office''s RFQ page, not the DAS library''s own file, and a later revision may exist: left out because the in-force version cannot be confirmed: the library''s list is drawn by script and the DAS IT Strategic Investment and Architecture pages read (the section page, Strategic Resources, Agency EPP Resources and Tools, Related Policies) link no technology standards document (owner decision; it should be seeded from the DAS library when a DAS page for it is found). The Office of Procurement''s solicitation attachments ''Supplement 2: State Architecture, Security, Privacy and Data Handling'' (e.g. https://dam.assets.ohio.gov/image/upload/procure.ohio.gov/pdf/CSP902320%20DOH046%20Supplement%20Two.pdf, 24 pages, revision history to 2017) and ''Supplement 1: State IT Policy, Standard and Service Requirements'' are DAS/OIT requirements for vendors, but the copies found are per-solicitation attachments of various vintages, not the library''s current files: left out (owner decision: they bind vendors under state contracts, which is in scope, if a current canonical copy is found).'
- text: 'Executive orders. The Governor''s list, https://governor.ohio.gov/media/executive-orders (and /executive-orders/executive-orders), answered HTTP 200 through the Fetcher (376,593 and 376,741 bytes), but the list is drawn by script (the rows are not in the page bytes; the feed behind it is an internal endpoint that was not called), so no order list was read and no all-governors check was possible: ''none found'' is not claimed. Each order''s own page is a visitor''s link and was fetched: Executive Order 2022-07D (governor.ohio.gov/media/executive-orders/, page executive-order-2022-07D), 2019-15D (.../2019-15d) and 2023-03D (.../Executive-Order-2023-03D-01092023, an address cited by the Legislative Service Commission''s analysis of H.B. 33; the pattern executive-order-2023-03D answered 200 with a ''Media'' page and no order). All three are seeded from the page text, each page heading being the order''s number (the Governor''s pages print the order text in HTML and attach a signed PDF). Executive Order 2023-03D is therefore no longer a stub: the earlier stub rested on a scanner-made PDF with a poor text layer, which is a file of the same size (672,493 bytes) as the one the Governor''s page links as its attachment. In force: each order prints its own term (2019-15D ''will not expire unless it is rescinded''; 2022-07D ''remain in force unless rescinded''; 2023-03D expires ten calendar days after the Governor''s last day in office); whether a later order rescinded any of them could not be checked against the list (owner decision: confirm on the Governor''s list). Executive Order 2019-14D (InnovateOhio advisory board) was seen in web search; the Governor''s page address built from the 2019-15D pattern (''executive-order-2019-14D'') answered 200 with a ''Media'' page, not an order, and the address of 2019-14D was not found: left out, not examined. Executive Order 2022-02D (Russia and Ukraine: divestment and purchasing) was fetched in the first pass (3 pages) and is left out: it is not about state IT. Executive orders 2025-01D, 2025-07D and 2026-01D to 2026-05D were seen in search snippets as unrelated (return to office, TANF, Medicaid revalidation, recovery housing, student-athlete eligibility, dyed diesel). No Ohio executive order on AI was found in search; a GovTech piece names an ''Executive Order 26-02'' on AI that is not an Ohio numbering and was not pursued.'
- text: 'Statutes about AI: R.C. 5162.90 and 5164.11 (the Department of Medicaid''s automated review tools, effective October 6, 2026) are the only provisions found that bind a state agency on AI, by web search and the codes.ohio.gov pages. Left out: R.C. 3301.24 (AI policy for school districts, community schools and STEM schools, H.B. 96, effective September 30, 2025; it binds local school entities and the Department of Education and Workforce''s model policy: K-12 is out of scope per domain.yml; owner decision if the Department''s model-policy duty should count). A Legislative Service Commission analysis of October 2025 describing a bill that would define ''state agency'' and AI systems was seen in search and not confirmed as enacted. ''Not found'' is stated only for the searches made: three web searches for ''artificial intelligence'' with state-agency terms and the full texts of 125.18, 125.183, 125.32, 125.70, 126.41, 126.506, 1347, 5922, 1306.21 and 1306.23.'
- text: 'Statutes in chapter 125 seen on the chapter page and left out: 125.073 (promotes electronic procurement and reverse auctions: procurement-method law; left out as a section in a procurement chapter, pending the owner''s decision on section-level slicing of procurement chapters), 125.112 (web site listing contract awards; transparency of contracts), 125.182 (the official public notice web site, run by a newspaper trade association: not a state IT function), 125.20 (publishes state employee pay and tax credit databases: transparency, not IT governance; owner decision), 125.901 and 125.902 (the geographically referenced information program council, chaired by the state CIO but its text coordinates state-owned real property; owner decision), 125.903 (database of real property under state control) and the other procurement, surplus, fleet, printing and community rehabilitation sections of chapter 125 (the chapter page lists 86 section headings, read on 2026-11-12). The chapter page is a watch entry.'
- text: 'Other statutes seen and left out: R.C. 9.64 (political subdivision cybersecurity: local government, out per the issue), R.C. 3301.24 (above), R.C. 1354.02 (affirmative defense for private businesses with cybersecurity programs: private persons), the rest of chapter 1306 (the Uniform Electronic Transactions Act between private persons; 1306.22 says the general assembly and courts need not use electronic records), R.C. 149.21 (uniform electronic legal material: legal publication), 149.45 and 149.434 (public offices'' personal information and employee databases: public records law), R.C. 5923.12 (military pay rates for the cyber reserve: a pay section of the militia chapter), and chapters 123 and 124 of title 1 (public works and personnel). Chapters 9, 125, 126, 149 and 1306 were read as chapter pages and filtered by section heading for information, technology, computer, electronic, cyber, data, digital, internet, system and record words; chapter 121 (State Departments) and the rest of title 1 were not read.'
- text: 'Administrative Code: Title 123:3 (Office of Information Technology) lists two chapters (123:3-1, 123:3-2), both seeded; the DAS chapter 123-4 is seeded. Every other state agency adopts its own rule under R.C. 1347.15 on its employees'' access to confidential personal information, one chapter per agency in that agency''s title (the rule''s own definitions are 123:3-2): those agency rule chapters were not enumerated (the site''s search is an internal endpoint and was not used), so they are left out as a pattern, not counted (owner decision: enumerate them from the title pages if the corpus should hold them). Other titles of the Administrative Code were not searched for IT rules; the Ohio Cyber Reserve''s rules under R.C. 5922.02 were not searched for. The codes.ohio.gov rules pages are the Administrative Code as the Joint Committee on Agency Rule Review publishes it; each rule prints its effective date and a five-year review date, and no rule read is marked rescinded.'
- text: 'Access terms, for the owner. https://codes.ohio.gov/robots.txt (fetched 2026-11-12, 26 bytes) reads ''User-agent: * Disallow: /'', a blanket disallow of every path for every agent. The toolkit Fetcher does not enforce robots.txt, and docs/spec.md decision 7 sets robots.txt and no-scrape terms aside for the pilot, so the Revised Code and Administrative Code pages were fetched (about 40 pages in all, at the Fetcher''s per-host rate); the owner should confirm that decision for Ohio, whose research row (docs/research/02-source-availability.md) rates it ''Medium: blanket robots disallow'', and whose codes.ohio.gov/legal/disclaimer was not re-read in this run. https://das.ohio.gov/robots.txt answers 200 (512 bytes): it disallows /wps/wcm/connect/gov/ohio+content+english/ (four spellings), /wps/portal/gov/das/search/, /search/ and the public records request pages, and names https://das.ohio.gov/sitemap.xml (which lists only five section pages, no policy). The policy pages (/technology-and-strategy/policies/...) and the standards'' PDFs (/wps/wcm/connect/gov/<id>/...) are outside those disallowed paths. https://governor.ohio.gov/robots.txt answers 200 with the same disallowed content paths and /search/; the order pages are outside them. https://dam.assets.ohio.gov/robots.txt answers 200 with comment lines only (no disallow). https://ohid.ohio.gov/robots.txt answers HTTP 403 (refused); the ohid.ohio.gov standards addresses answer 200 with a sign-in form (see the stubs). https://content.govdelivery.com/robots.txt answers 404.'
- text: 'Fetching notes. Every request went through the toolkit Fetcher (src.ingest.make_fetcher) of the pinned corpus-toolkit v1.37.1, whose User-Agent is ''Mozilla/5.0 (compatible; OregonAI-CivicCorpus/1.37.1; +https://github.com/OregonAI/states-government-it)'' (printed from the Fetcher on 2026-11-12). The first pass recorded the User-Agent as ''OregonAI-CivicCorpus/1.26.1'', a toolkit older than the pin that was loaded from outside the worktree''s virtual environment (the system Python of the build machine has 1.26.1; the repository itself has no trace of which one ran), and that non-Mozilla form is the likely reason every das.ohio.gov, governor.ohio.gov, ohio.gov and procure.ohio.gov page answered 404 to that run: with v1.37.1 das.ohio.gov, governor.ohio.gov, ohio.gov and procure.ohio.gov answer 200. Each section or chapter page of codes.ohio.gov is one HTML file; the page prints the section''s own effective date, which is kept in the text, and the Code is ''updated on an ongoing basis'' by the Legislative Service Commission after its act review, so a very recent act may not yet be reflected (the page says so). The version printed is the current version. The DAS policy pages and the Governor''s order pages are HTML pages of the state''s web portal (IBM WebSphere): the content between the page''s heading and the end-of-body comment is read, with list numbers written out, and the policy''s own ''Effective:'' date is kept. The two standards'' PDFs and the charter have a text layer on every page.'
- text: 'Authority-reference candidates read in the official section pages (codes.ohio.gov, fetched through the toolkit Fetcher 2026-11-13) under the owner''s decision of 2026-11-13 (a provision not itself about IT is in scope when its own focus is the governance of state IT) and declined, each on the focus of the words printed. R.C. 126.08 (cited as authority by IT-16): ''The director of budget and management may exercise control over the financial transactions of state agencies, including approving, disapproving, voiding, or invalidating encumbrances'' by requiring encumbrancing documents, allotments and rules; it is general financial control and says nothing of information technology, so its focus is not IT. R.C. 125.02 (authority of IT-06): the department of administrative services ''shall establish contracts for supplies and services, including telephone, other telecommunications, and computer services, for the use of state agencies''; computer services is one item in a list in a general purchasing section on releases, permits, cooperative purchasing and insurance, so the section merely applies to IT along with everything else. R.C. 125.04 (authority of IT-06): which supplies and services DAS contracts cover and who may join them (higher education, political subdivisions, schools, fire companies); it never mentions information technology. R.C. 149.34 (cited by IT-07): ''The head of each state agency ... shall ... establish, maintain, and direct an active continuing program for the effective management of the records of the state agency'' and submit retention schedules; it governs records of every kind and prints no word about electronic records or systems, so it is general records management, not IT governance (R.C. 1306.20(C)(2) requires electronic records to be kept in accordance with R.C. 149.40, a general section on making only necessary records, "The head of each public office shall cause to be made only such records as are necessary ...", which was not a candidate and is left unseeded as general records law, not IT governance). R.C. 149.11 (cited by IT-07): state publications delivered to the state library; division C asks agencies to notify the library of publications ''made available electronically on its internet web site'', a library deposit duty for publications, not a governance of state IT or electronic records, so its focus is not IT. Decision: owner decision 2026-11-13 (decision 1) applied; reviewers may overrule any of the five.'
