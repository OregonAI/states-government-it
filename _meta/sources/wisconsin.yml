sources:

  # ======================================================================================
  # WISCONSIN (issue #50). Discovery 2026-11-12: DOA Division of Enterprise Technology (DET) policies page
  # (det.wi.gov/Pages/policies.aspx, 4 items), the Legislature's statute and administrative-code pages
  # (docs.legis.wisconsin.gov), the Legislature's executive-order archive by governor and its LRB subject index.
  # A statute URL is built from the site's own link pattern (/document/statutes/<section>); the page serves a window
  # of neighbouring sections; the page's own <title> names the one asked for, and the ingester keeps only that section.
  # ======================================================================================
  # ---- Statutes: Wisconsin Statutes, one section per entry (the Legislature's page serves a window of sections)
  - id: wi-stat-15-103
    sha256: "ac5b4d5e419b5079db6c4c0e683bae5ae576cc0777fb3a778dcaa2031bf53795"
    url: "https://docs.legis.wisconsin.gov/document/statutes/15.103"
    format: html
    citation: "Wis. Stat. s. 15.103"
    title: "Wis. Stat. 15.103 - Same; specified divisions"
    doc_type: statute
    jurisdiction: wisconsin
    issuing_body: Wisconsin State Legislature; published by the Legislative Reference Bureau
    tags: [governance]
    recheck: monthly
    why_relevant: "Creates the Division of Enterprise Technology in the Department of Administration (sub. (5)), the central IT agency whose administrator is the State Chief Information Officer. The section lists every specified division of the department, so the creation of the divisions of hearings and appeals, legal services, gaming, trust lands and investments and personnel management rides along with sub. (5)."
  - id: wi-stat-16-97
    sha256: "d03b8c1e1f49f61b7b581a081f7907ed1d921ed5108df2192c49e7f9b6f353d1"
    url: "https://docs.legis.wisconsin.gov/document/statutes/16.97"
    format: html
    citation: "Wis. Stat. s. 16.97"
    title: "Wis. Stat. 16.97 - Definitions"
    doc_type: statute
    jurisdiction: wisconsin
    issuing_body: Wisconsin State Legislature; published by the Legislative Reference Bureau
    tags: [governance]
    recheck: monthly
    why_relevant: "Definitions for the information technology subchapter (subch. VII of ch. 16): agency, executive branch agency, information technology, information technology portfolio, telecommunications."
  - id: wi-stat-16-971
    sha256: "58af16a561992a2f33534f3f22a5217d791e539f1748e9610d195936ba7027c6"
    url: "https://docs.legis.wisconsin.gov/document/statutes/16.971"
    format: html
    citation: "Wis. Stat. s. 16.971"
    title: "Wis. Stat. 16.971 - Responsibilities of department"
    doc_type: statute
    jurisdiction: wisconsin
    issuing_body: Wisconsin State Legislature; published by the Legislative Reference Bureau
    tags: [governance, oversight, cybersecurity, data, procurement]
    recheck: monthly
    why_relevant: "The core grant of authority over executive branch IT: the department must set the policies, procedures and planning processes executive branch agencies follow and monitor adherence (sub. (2)(a)), prescribe data and integration standards, review and approve IT acquisitions, ensure agencies adopt guidelines and standards for systems development, and ensure state data processing facilities develop proper privacy and security procedures and safeguards (sub. (2)(k)); it also requires each agency's annual strategic IT plan and sets forms management duties. Cited by the DET security policy and standards handbooks and the acceptable-use policy as the authority for those documents. Also covers some telecommunications access provisions for schools and libraries (subs. (13) to (17)) and a case management system for district attorneys (sub. (10)), which ride along."
  - id: wi-stat-16-972
    sha256: "af6e9b71b2fd7c28ebc0256db07a41b329aa567653ecaaedff9b01d30b7dd888"
    url: "https://docs.legis.wisconsin.gov/document/statutes/16.972"
    format: html
    citation: "Wis. Stat. s. 16.972"
    title: "Wis. Stat. 16.972 - Powers of the department"
    doc_type: statute
    jurisdiction: wisconsin
    issuing_body: Wisconsin State Legislature; published by the Legislative Reference Bureau
    tags: [governance]
    recheck: monthly
    why_relevant: "Powers of the department to provide telecommunications, computer, supercomputer and technical services to agencies, local governmental units and others, to study and appoint advisory councils, and to acquire, operate and maintain IT equipment and systems. Sub. (1) defines terms for educational users, which ride along."
  - id: wi-stat-16-973
    sha256: "9afee2f5a39f9179b5a962f5a12a8a0ceafdd7af86c92bb3bf87a3efbc4f8f50"
    url: "https://docs.legis.wisconsin.gov/document/statutes/16.973"
    format: html
    citation: "Wis. Stat. s. 16.973"
    title: "Wis. Stat. 16.973 - Duties of the department"
    doc_type: statute
    jurisdiction: wisconsin
    issuing_body: Wisconsin State Legislature; published by the Legislative Reference Bureau
    tags: [governance, cybersecurity, data, funding]
    recheck: monthly
    why_relevant: "Duties of the department: provide computer services to agencies, promulgate fee methodologies, develop policies and programs that protect the privacy of individuals in agency databases and set technical standards (sub. (3)), and use all feasible technical means to ensure the security of all information submitted to the department for processing (sub. (5)). The acceptable-use policy cites subs. (3), (4) and (5)."
  - id: wi-stat-16-974
    sha256: "c9238d3b9f7c9522096cdc79510b838eb0a900dd5f455f8aa0f616dc9ea00ad3"
    url: "https://docs.legis.wisconsin.gov/document/statutes/16.974"
    format: html
    citation: "Wis. Stat. s. 16.974"
    title: "Wis. Stat. 16.974 - Powers of the department"
    doc_type: statute
    jurisdiction: wisconsin
    issuing_body: Wisconsin State Legislature; published by the Legislative Reference Bureau
    tags: [governance, procurement, funding]
    recheck: monthly
    why_relevant: "Powers of the department to collect charges for its services, enter service agreements, run Internet or telephone access systems to agency program information, and review and approve, modify or disapprove proposed executive branch contracts for IT or telecommunications (sub. (5))."
  - id: wi-stat-16-975
    sha256: "274dbe6ae54d33b70b9b83b90aa4e060c25a24b8b6adcd689fc4b5cc3a5de172"
    url: "https://docs.legis.wisconsin.gov/document/statutes/16.975"
    format: html
    citation: "Wis. Stat. s. 16.975"
    title: "Wis. Stat. 16.975 - Access to information"
    doc_type: statute
    jurisdiction: wisconsin
    issuing_body: Wisconsin State Legislature; published by the Legislative Reference Bureau
    tags: [data]
    recheck: monthly
    why_relevant: "Requires the department to withhold from public-records access the information agencies and others submit to it for processing, and leaves the submitting agency the custodian: the data-custody rule for the state's central processing."
  - id: wi-stat-16-976
    sha256: "22ad5777581a12f72b07e11680e531f3dc57fde6a91b9289f941e6a7568fecc3"
    url: "https://docs.legis.wisconsin.gov/document/statutes/16.976"
    format: html
    citation: "Wis. Stat. s. 16.976"
    title: "Wis. Stat. 16.976 - Strategic plans for executive branch agencies"
    doc_type: statute
    jurisdiction: wisconsin
    issuing_body: Wisconsin State Legislature; published by the Legislative Reference Bureau
    tags: [oversight]
    recheck: monthly
    why_relevant: "The annual strategic IT plan process: each executive branch agency must address its business needs and identify proposed IT initiatives, the department reviews and approves or disapproves each plan by June 15, and no agency may implement a new or revised IT development project under a plan before the department approves it."
  - id: wi-stat-16-977
    sha256: "f55b3ce1e59e8aee6690d96c7008c6f0ad7ccb1338c09da21180b521a5eca0b7"
    url: "https://docs.legis.wisconsin.gov/document/statutes/16.977"
    format: html
    citation: "Wis. Stat. s. 16.977"
    title: "Wis. Stat. 16.977 - Information technology portfolio management"
    doc_type: statute
    jurisdiction: wisconsin
    issuing_body: Wisconsin State Legislature; published by the Legislative Reference Bureau
    tags: [oversight]
    recheck: monthly
    why_relevant: "Requires the department to manage the IT portfolio of executive branch agencies under a management structure with criteria for selecting IT assets, methods to monitor and control IT projects and assets, and methods to evaluate project progress and system effectiveness."
  - id: wi-stat-16-979
    sha256: "636f12843636a110316ecd37b403b56c310b8d34781053f23cc7ccbac3a716d9"
    url: "https://docs.legis.wisconsin.gov/document/statutes/16.979"
    format: html
    citation: "Wis. Stat. s. 16.979"
    title: "Wis. Stat. 16.979 - Telecommunications operations and planning"
    doc_type: statute
    jurisdiction: wisconsin
    issuing_body: Wisconsin State Legislature; published by the Legislative Reference Bureau
    tags: [governance, cloud-resilience]
    recheck: monthly
    why_relevant: "The department's duty to develop a statewide long-range telecommunications plan, set telecommunications policy and standards, inventory state-owned or leased telecommunications equipment and review the operation of state telecommunications systems (sub. (2)). State agency telecommunications as part of the IT definition in s. 16.97; not the broadband or carrier regulation the scope statement leaves out."
  - id: wi-stat-16-61
    sha256: "b4f8e2b62cbe12659a920e90bae7fcbcb6a0b49013689c0b63a38cf8d5a9e7b6"
    url: "https://docs.legis.wisconsin.gov/document/statutes/16.pdf"
    format: pdf
    slice: {section_start: "16.61", section_end_before: "16.611"}
    citation: "Wis. Stat. s. 16.61"
    title: "Wis. Stat. 16.61 - Records of state offices and other public records"
    doc_type: statute
    jurisdiction: wisconsin
    issuing_body: Wisconsin State Legislature; published by the Legislative Reference Bureau
    tags: [data, governance]
    recheck: monthly
    why_relevant: "The state's records-retention statute, in scope by owner decision 2026-11-13 (a records provision whose focus is the governance of state IT, data and electronic records). The public records board must prescribe 'policies and standards that provide an orderly method for the disposition of other state records' (sub. (1)); 'public records' include 'optical discs, electronically formatted documents' (sub. (2) (b)); the board approves state agencies' records retention schedules and disposal (sub. (4)); subs. (5) to (9) govern the transfer of public records 'to optical disc or electronic format', that such records 'are protected from unauthorized destruction', when an electronic copy is 'deemed an original public record' and its preservation. Cited by the DET policy handbook for records retention obligations and the authority for ch. Adm 12 (electronic records). Taken from the Legislature's chapter 16 PDF cut to this section, because the section's own page serves only the first half (the window ends at sub. (5) (b)). Subs. (13) (historical society and university archives as depositories) and the exempt-forms and microfilm provisions ride along."
  - id: wi-stat-16-611
    sha256: "59e0ddb07a0e35168d778f1430e76e771577dd2cf6ec811c1a721c56a2dd513d"
    url: "https://docs.legis.wisconsin.gov/document/statutes/16.611"
    format: html
    citation: "Wis. Stat. s. 16.611"
    title: "Wis. Stat. 16.611 - State public records; optical disc and electronic storage"
    doc_type: statute
    jurisdiction: wisconsin
    issuing_body: Wisconsin State Legislature; published by the Legislative Reference Bureau
    tags: [data]
    recheck: monthly
    why_relevant: "Directs the Department of Administration to prescribe by rule the procedures for transferring state public records to optical disc or electronic format and maintaining them there, including procedures to ensure authenticity, accuracy, reliability and accessibility and protection from unauthorized destruction, and the procedures for the department's own operation of an electronic records system (sub. (2)); the proposed rules go first to the public records board (sub. (3)). The authority for ch. Adm 12, which the section's cross-reference names (s. Adm 12.01)."
  - id: wi-stat-134-98
    sha256: "24222b409da8f2c34a8e5c6fd8643120b737ae36cf84bb672e43fd714596b558"
    url: "https://docs.legis.wisconsin.gov/document/statutes/134.98"
    format: html
    citation: "Wis. Stat. s. 134.98"
    title: "Wis. Stat. 134.98 - Notice of unauthorized acquisition of personal information"
    doc_type: statute
    jurisdiction: wisconsin
    issuing_body: Wisconsin State Legislature; published by the Legislative Reference Bureau
    tags: [data, cybersecurity]
    recheck: monthly
    why_relevant: "The breach-notification statute. Its definition of entity expressly includes the state and any office, department, independent agency, authority, institution, association, society or other body in state government (sub. (1)(a)2.a.), so it binds state agencies that hold personal information; it also binds private entities and cities, villages, towns and counties, which ride along. Located in ch. 134 (business regulation), a non-IT chapter; one section."
  - id: wi-stat-19-68
    sha256: "51731833a2df2b14db256cf1cd5ab36ced5668f4db366e59ce61040a76ed31c7"
    url: "https://docs.legis.wisconsin.gov/document/statutes/19.68"
    format: html
    citation: "Wis. Stat. s. 19.68"
    title: "Wis. Stat. 19.68 - Collection of personally identifiable information from Internet users"
    doc_type: statute
    jurisdiction: wisconsin
    issuing_body: Wisconsin State Legislature; published by the Legislative Reference Bureau
    tags: [data, digital-services]
    recheck: monthly
    why_relevant: "In scope by owner decision 2026-11-13 (a provision whose own focus is the governance of state IT): 'No state authority that maintains an Internet site may use that site to obtain personally identifiable information from any person who visits that site without the consent of the person from whom the information is obtained.' It binds state agencies' websites; Internet protocol addresses are excepted. One section of subchapter IV of chapter 19 (personal information practices); the rest of the subchapter is general privacy practice and is left out (see left_out)."
  - id: wi-stat-19-69
    sha256: "1fc8c4b524232710083e6806bce1abf9ef7c0c697543596c1dd54dfb2e80bbe4"
    url: "https://docs.legis.wisconsin.gov/document/statutes/19.69"
    format: html
    citation: "Wis. Stat. s. 19.69"
    title: "Wis. Stat. 19.69 - Computer matching"
    doc_type: statute
    jurisdiction: wisconsin
    issuing_body: Wisconsin State Legislature; published by the Legislative Reference Bureau
    tags: [data, oversight]
    recheck: monthly
    why_relevant: "In scope by owner decision 2026-11-13 (a provision whose own focus is the governance of state IT and data): a state authority 'may not use or allow the use of personally identifiable information maintained by the state authority in a match under a matching program' (the 'computerized comparison of information in one records series to information in another', s. 19.62 (3)) unless it has specified in writing the purpose, legal authority, justification and the information matched, copies the specification to the public records board within 30 days, and notifies an individual in writing before an adverse action based on a match."

  # ---- Administrative rules
  - id: wi-adm-12
    sha256: "1f4ece6af0945ec406c16e1c086ecd66a441109511ef17d68a9246639ef69396"
    url: "https://docs.legis.wisconsin.gov/document/administrativecode/ch.%20Adm%2012"
    format: html
    citation: "Wis. Admin. Code ch. Adm 12"
    title: "Chapter Adm 12 - Electronic Records Management- Standards And Requirements"
    doc_type: rule
    jurisdiction: wisconsin
    issuing_body: Wisconsin Department of Administration; published by the Legislative Reference Bureau
    tags: [data, governance]
    recheck: monthly
    why_relevant: "The Department of Administration's rule for public records kept in electronic format: state and local agencies must keep electronic public records accessible, accurate, authentic, reliable, legible and readable through their life cycle, document their policies, restrict access, and design systems that can produce an official record copy. Promulgated under ss. 16.611, 16.612 and 227.11(2)(a) to implement s. 16.61. It binds local agencies as well as state agencies, which ride along. The only IT chapter among the department's chapters Adm 1 to Adm 95 (see the left-out record)."

  # ---- Statewide IT policies and standards: DET Policies and Standards page (det.wi.gov/Pages/policies.aspx, 4 items on 2026-11-12)
  - id: wi-det-aup
    sha256: "6ef58846361bc6f22b86e9e136bf61bd46353a4f57793a8180228e8ae0191dd8"
    url: "https://det.wi.gov/Documents/AUP%20-%20Effective%20Date%203.10.2025.pdf"
    format: pdf
    citation: "Acceptable Technology Use, Access, and Security Policy (AUP)"
    title: "State of Wisconsin Acceptable Technology Use, Access, and Security Policy"
    doc_type: policy
    jurisdiction: wisconsin
    issuing_body: Wisconsin Department of Administration, Division of Enterprise Technology
    tags: [governance, cybersecurity, data, ai]
    recheck: monthly
    identity_text: "Acceptable Technology Use, Access, and Security Policy"
    why_relevant: "The enterprise acceptable-use policy for all executive branch agencies (not the Department of Justice, Department of Military Affairs, Investment Board, UW System Board of Regents or Technical College System Board), issued under Wis. Stat. 16.971 to 16.975. Covers general usage, non-public information, public records, personal devices, IT security and credentials, remote work, and a section on artificial intelligence (AI) usage with separate duties for agency IT and for users: the state's only AI instrument found. Listed on the DET Policies page (last revised 3/10/2025)."
  - id: wi-det-it-security-policy-handbook
    sha256: "c3f728d39ff53a97325425d2b1b8dbe27687a0701e6566bc9ec14b5165967550"
    url: "https://det.wi.gov/Documents/ITSecurityPolicyHandbook.pdf"
    format: pdf
    citation: "IT Security Policy Handbook"
    title: "State of Wisconsin IT Security Policy Handbook"
    doc_type: policy
    jurisdiction: wisconsin
    issuing_body: Wisconsin Department of Administration, Division of Enterprise Technology
    tags: [cybersecurity, governance]
    recheck: monthly
    identity_text: "State of Wisconsin IT Security Policy Handbook"
    why_relevant: "The executive branch IT security policy baseline: statutory authority (Wis. Stat. 16.971 and 16.973), scope, roles, compliance and enforcement, then one policy per control family (access control, awareness and training, audit, configuration management, contingency planning and so on), derived from NIST SP 800-53 Rev. 5. Owner: Bureau of Security. Listed on the DET Policies page (3/10/2026)."
  - id: wi-det-it-security-standards-handbook
    sha256: "d13359e32188d6b82d3550f1707a85527bc3fc559efddc453c56719eea66324e"
    url: "https://det.wi.gov/Documents/ITSecurityStandardsHandbook.pdf"
    format: pdf
    citation: "IT Security Standards Handbook"
    title: "State of Wisconsin IT Security Standards Handbook"
    doc_type: standard
    jurisdiction: wisconsin
    issuing_body: Wisconsin Department of Administration, Division of Enterprise Technology
    tags: [cybersecurity, governance, data, cloud-resilience]
    recheck: monthly
    identity_text: "State of Wisconsin IT Security Standards Handbook"
    why_relevant: "The enterprise security standards that implement the IT Security Policy Handbook: 26 numbered standards (100 Access Control through 290 Removal of Prohibited Foreign Products and 500 Program Management, including 170 Incident Response, 191 Data Classification and 270 Personally Identifiable Information Processing and Transparency), in one 108-page document, with the control-selection methodology. Owner: DET Bureau of Security. Listed on the DET Policies page (last revised 3/10/2026)."
  - id: wi-det-flaw-remediation-si-2
    sha256: "1baa476790c61119246127c099913eb00d00aed44aad89f588f8b0d7caeb06b2"
    url: "https://det.wi.gov/Documents/FlawRemediationSI-2StateStandard.pdf"
    format: pdf
    citation: "Flaw Remediation (SI-2) Security Standard"
    title: "Flaw Remediation (SI-2) Security Standard"
    doc_type: standard
    jurisdiction: wisconsin
    issuing_body: Wisconsin Department of Administration, Division of Enterprise Technology
    tags: [cybersecurity]
    recheck: monthly
    identity_text: "Flaw Remediation (SI-2)"
    why_relevant: "The tiered patching and mitigation standard for state systems: Tier 1 (critical public-facing and CISA KEV vulnerabilities) mitigated within 24 hours and fully remediated within seven days, further tiers, risk acceptance and unsupported systems. Four pages. Listed on the DET Policies page (last revised 7/15/2026); the file's own issuance table shows version 1.2 issued 7-13-26."

  # ---- Executive orders. All four are scans with a machine-read text layer, so each is a stub (see its reason). Status: no rescission appears in the LRB subject index (January 2026) or the Legislature's lists.
  - id: wi-eo-evers-184
    url: "https://docs.legis.wisconsin.gov/document/executiveorders/2023/184.pdf"
    format: pdf
    citation: "Executive Order #184 (Evers)"
    title: "Relating to Cybersecurity and Prohibiting the Use of Certain Foreign Technologies"
    doc_type: executive_order
    jurisdiction: wisconsin
    issuing_body: Office of the Governor
    tags: [cybersecurity, governance]
    recheck: monthly
    stub: true
    stub_reason: "Text not committed, measured 2026-11-12. The Legislature's PDF is a page scan (a full-page image on every page, about 300 ppi, per pdfimages) with a hidden text layer that is a machine reading and holds recognition errors, so it is not text of record (the layer opens with the noise ':,., ww,, a,,' and reads 'recogruzmg' for 'recognizing', 'Chieflnformation' for 'Chief Information' and 'ofDOA-DET' for 'of DOA-DET'). The corpus's two-engine OCR procedure (src/ingest_ocr.py) runs ocrmypdf without --force-ocr and so stops on any page that already has text (ingest run 2026-11-12: 'PriorOcrFoundError: page already has text!'); it needs a shared-code option to set the layer aside (Colorado's executive order stub met the same layer problem). Becomes a document when that option exists and the two engines clear the word and figure bars."
    why_relevant: "Governor Evers' January 2023 order directing DOA-DET, under Wis. Stat. 16.971 to 16.975, to continue investigating and to bar certain foreign technologies on state systems. Cited by the DET standards handbook as an authority. Found on the Legislature's executive-order archive for 2019- (Tony Evers) and the LRB index entry 'Cybersecurity and prohibiting the use of certain foreign technologies'."
  - id: wi-eo-thompson-242
    url: "https://docs.legis.wisconsin.gov/document/executiveorders/1995/242.pdf"
    format: pdf
    citation: "Executive Order #242 (Thompson)"
    title: "Statement of Direction Relating to the Management of Information Technology in the State of Wisconsin"
    doc_type: executive_order
    jurisdiction: wisconsin
    issuing_body: Office of the Governor
    tags: [governance, oversight]
    recheck: monthly
    stub: true
    stub_reason: "Text not committed, measured 2026-11-12. The Legislature's PDF is a page scan (a full-page image on every page, about 300 ppi, per pdfimages) with a hidden text layer that is a machine reading and holds recognition errors, so it is not text of record (the layer reads 'WHERE~S', 'ilIl.1§lra,led' and 'c9Hsolij:lation' for words of the second and fifth recitals). The corpus's two-engine OCR procedure (src/ingest_ocr.py) runs ocrmypdf without --force-ocr and so stops on any page that already has text (ingest run 2026-11-12: 'PriorOcrFoundError: page already has text!'); it needs a shared-code option to set the layer aside (Colorado's executive order stub met the same layer problem). Becomes a document when that option exists and the two engines clear the word and figure bars."
    why_relevant: "Governor Thompson's 1995 statement of direction: the Department of Administration plans and administers the state's information technology on an enterprise basis and prepares an enterprise infrastructure assessment. Still on the LRB index with no rescission found; whether it remains operative is an OWNER DECISION."
  - id: wi-eo-thompson-408
    url: "https://docs.legis.wisconsin.gov/document/executiveorders/2000/408.pdf"
    format: pdf
    citation: "Executive Order No. 408 (Thompson)"
    title: "Relating to the Development and Implementation of Electronic Commerce Methods for the Delivery of State and Local Government Services in Wisconsin"
    doc_type: executive_order
    jurisdiction: wisconsin
    issuing_body: Office of the Governor
    tags: [digital-services]
    recheck: monthly
    stub: true
    stub_reason: "Text not committed, measured 2026-11-12. The Legislature's PDF is a page scan (a full-page image on every page, about 300 ppi, per pdfimages) with a hidden text layer that is a machine reading and holds recognition errors, so it is not text of record (the layer is largely unreadable, for example 'Rel:llill~ to tile Uc\\\"dllllllleJlI' for the first words of the order's title). The corpus's two-engine OCR procedure (src/ingest_ocr.py) runs ocrmypdf without --force-ocr and so stops on any page that already has text (ingest run 2026-11-12: 'PriorOcrFoundError: page already has text!'); it needs a shared-code option to set the layer aside (Colorado's executive order stub met the same layer problem). Becomes a document when that option exists and the two engines clear the word and figure bars."
    why_relevant: "Governor Thompson's 2000 order directing executive branch agencies to provide electronic government services and the Secretary of Administration to create an Internet-based service center. LRB index: 'Electronic government services for Internet: executive branch agencies to work with the Dept. of Administration to develop and implement'. No rescission found; whether it remains operative is an OWNER DECISION."
  - id: wi-eo-thompson-416
    url: "https://docs.legis.wisconsin.gov/document/executiveorders/2001/416.pdf"
    format: pdf
    citation: "Executive Order No. 416 (Thompson)"
    title: "Statement of Direction Relating to Proper Software License Compliance"
    doc_type: executive_order
    jurisdiction: wisconsin
    issuing_body: Office of the Governor
    tags: [procurement, governance]
    recheck: monthly
    stub: true
    stub_reason: "Text not committed, measured 2026-11-12. The Legislature's PDF is a page scan (a full-page image on every page, about 300 ppi, per pdfimages) with a hidden text layer that is a machine reading and holds recognition errors, so it is not text of record (the layer reads 'WIIEREAS', 'Gouldfurther' and 'Iaws' for 'WHEREAS', 'could further' and 'laws'). The corpus's two-engine OCR procedure (src/ingest_ocr.py) runs ocrmypdf without --force-ocr and so stops on any page that already has text (ingest run 2026-11-12: 'PriorOcrFoundError: page already has text!'); it needs a shared-code option to set the layer aside (Colorado's executive order stub met the same layer problem). Becomes a document when that option exists and the two engines clear the word and figure bars."
    why_relevant: "Governor Thompson's January 2001 order directing state agencies on software license compliance and the Department of Administration to set an IT purchase policy through qualified resellers and enforce license terms in IT contracts. No rescission found; whether it remains operative is an OWNER DECISION."

  # ---- Index pages, watched so the monthly drift run reports additions and removals
  - id: wi-watch-det-policies
    url: "https://det.wi.gov/Pages/policies.aspx"
    format: html
    citation: "DET Policies and Standards page"
    title: "DET Policies and Standards (index)"
    doc_type: policy
    jurisdiction: wisconsin
    tags: [governance, cybersecurity]
    recheck: monthly
