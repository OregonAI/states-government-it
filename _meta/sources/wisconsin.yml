left_out:
- text: '---- Wisconsin: found and left out (each was seen on an official page on 2026-11-12; the reason is recorded here)'
- text: |-
    Statutes. Read: the whole of Chapter 16 as the Legislature's PDF (109 pages, 2023-24 Statutes updated through 2025 Wis. Act 247, published 11-4-26), the Legislature's pages for ss. 15.103, 16.61, 16.754 and 134.98, and the statute references in the DET policy handbook, standards handbook and acceptable-use policy. Seeded: ss. 15.103, 16.97 to 16.977, 16.979, 16.61, 16.611, 134.98, 19.68 and 19.69. Owner decision 2026-11-13: a provision in law that is not itself about IT is in scope, as a section slice, when its own focus is the governance of state IT; s. 16.61 (records retention, electronic records) became a document that day, cut from the Legislature's chapter 16 PDF because its own page is cut off by the end of the Legislature's window (the stub reason is superseded), and ss. 19.68 and 19.69 were seeded as the two sections of the personal-information subchapter that govern state IT (below).
     - The central IT agency and the State CIO: the division is created by s. 15.103 (5) (seeded); no statute section was found that names or defines the "State Chief Information Officer": Chapter 16 as read has no occurrence of 'chief information officer', and executive order #184 uses it as a job title. The DET Senior Leadership page (https://det.wi.gov/Pages/Senior-Leadership.aspx) titles the division's administrator 'State Chief Information Officer - Division Administrator'.
     - s. 16.978: no section 16.978 appears in the chapter text read (the subchapter runs 16.97, 16.971, 16.972, 16.973, 16.974, 16.975, 16.976, 16.977, 16.979).
     - Subchapter IX of ch. 16, ss. 16.99 to 16.998 (Technology for Educational Achievement: educational telecommunications and school and library internet access, listed on the DET Policies page as a statute that pertains closely to DET): out of scope (broadband and telecom, K-12 and library services), not fetched. OWNER DECISION if wanted.
     - Subchapter VIII, ss. 16.98 and 16.981 (federal resource acquisition, transfer of appropriations): not IT.
     - s. 16.754 (preference for American-made materials, cited in the DET policy handbook's compliance references for the removal of prohibited foreign products): read in full on 2026-11-13 under the owner's decision of that day. It is a general purchasing preference for 'any goods, supplies, equipment or any other tangible products or materials' bought by the state when all other factors are equal; no word of it concerns information technology, so its own focus is not IT governance. Declined.
     - s. 16.612 (local government records; optical disc and electronic storage standards): the local-government counterpart of s. 16.611, read in full; it directs the department to set by rule standards for optical discs and electronically stored records filed with local governmental units, so it binds local governments, not state agencies. Left out.
     - ss. 16.70 to 16.77 (state procurement) and the rest of ch. 16 (other than ss. 16.61, 16.611 and 16.612, above): s. 16.974 (5), the IT contract review power, is seeded. Read in full on 2026-11-13 under the owner's decision of that day. Declined, because each is a general purchasing provision that merely applies to IT along with everything else: s. 16.70 (definitions for the purchasing subchapter; it defines 'computer services' and 'information technology' among its general terms) and s. 16.705 (contractual services: cost-benefit analysis, services performed in the United States, background checks for federal tax information; the section does not mention information technology). Not clearly inside decision 1, left for the owner: s. 16.71 (purchasing powers: delegation, prison industries, the University of Wisconsin System and other purchasing). Its sub. (1m) is IT governance in its own words: an executive branch agency may not enter into a contract 'relating to information technology or telecommunications' without the department's review and approval, which is the decision's own example of an IT purchasing section. It is not seeded because a section slice cannot take one subsection, the rest of s. 16.71 is general purchasing, and the same review power is already seeded in s. 16.974 (5). OWNER DECISION: whether to seed all of s. 16.71, or to extend the slice shape to a subsection. The rest of the purchasing subchapter was not read.
     - ss. 19.62 to 19.80 (subchapter IV of ch. 19, personal information practices of state and local authorities; the handbook cites s. 19.62 (5) for the definition of personally identifiable information): each of the nine sections that exist (19.62, 19.65, 19.67, 19.68, 19.69, 19.70, 19.71, 19.77, 19.80; no ss. 19.63 or 19.66, which answered 404) was fetched and read on 2026-11-13 under the owner's decision of that day. Seeded: s. 19.68 (a state authority's Internet site may not obtain personally identifiable information from a visitor without consent) and s. 19.69 (computer matching by a state authority). Declined, because they are general privacy and personnel rules for every authority and not IT governance: s. 19.62 (definitions of the subchapter, including 'personally identifiable information'), s. 19.65 (rules of conduct and training for employees), s. 19.67 (collection of information about an individual from the individual or by verification), s. 19.70 (an individual's right to challenge a record), s. 19.71 (sale of names or addresses), s. 19.77 (the attorney general's annual summary of case law), s. 19.80 (penalties).
     - Statutes outside chapters 15, 16 and 134 were not searched. The Legislature's statute search is an internal endpoint and was not used.
     - AI statutes binding state agencies: none found. The list read is Chapter 16 as published 11-4-26, which has no occurrence of 'artificial intelligence'. Web search (discovery only, nothing in the repo rests on it) found 2025 Wis. Act 34 (an AI-generated intimate imagery offense in the criminal code, deepfakes and AI crimes are out of scope) and, in the 2025 budget bills AB 50 and SB 45, a proposed department duty to develop AI tools for state agencies, which is not in the published Chapter 16 text read here (bills not enacted are out of scope).
- text: |-
    Administrative rules. Read: the Legislature's list of the Department of Administration's chapters (46 chapters, Adm 1 to Adm 95) and ch. Adm 12 (seeded, electronic records). The list was read for IT rules: none other than Adm 12. Left out: Adm 70 (electronic recording of documents in county register of deeds offices: local government), Adm 5 to Adm 10 and Adm 20 to Adm 24 (procurement, bidding and construction contracting), and the rest (parking, buildings, housing, energy, business certification and similar). DET sets its IT requirements by policy and standard, not by rule: the DET handbooks cite statutes and executive order #184, not an administrative-code chapter. Other agencies' rules (for example the Public Records Board, the Department of Justice) were not searched.
- text: |-
    Executive orders. Read: the Legislature's archive lists for Governor Evers (2019-), Walker, Doyle, Thompson and McCallum (the 2001-2002 archive list, 35 numbered orders without titles; the LRB index lists none of his on IT), the Legislative Reference Bureau's Index to Executive Orders by Wisconsin Governors 1965-2025 (January 2026, 106 pages; read for every entry on information technology, cybersecurity, data, privacy, electronic services, software, records and AI), and the Governor's page of titles. Evers #184 is on the owner's 'seed whole' list (2026-11-13) and stays a stub: re-measured on 2026-11-13, the Legislature's PDF is still a page scan (one 2559 by 4204 pixel image) under a machine-read text layer that opens ':,., ww,, a,,' and src/ingest_ocr.py still runs ocrmypdf without --force-ocr, so the obstacle is in shared code and is unchanged. Seeded as stubs: Evers #184 and Thompson #242, #408 and #416 (scans with a machine-read text layer, see each stub reason). Left out:
     - Evers #211 (August 2023, Governor's Task Force on Workforce and Artificial Intelligence): the AI order the CDT list names. It creates a task force in the Department of Workforce Development to study generative AI's effect on the labor market and recommend workforce and education policy; it does not govern the state's own use of AI, so it fails the inclusion test (subject: IT, data or AI as a government function). It asked for an advisory action plan, which the Department of Workforce Development published in July 2024, and was fetched and read in full on 2026-11-12. OWNER DECISION: it is the only Wisconsin executive order on AI.
     - Evers #182 (January 2023, re-creation of 28 non-statutory committees including the Governor's Information Technology Executive Steering Committee and the Wisconsin Technology Committee, two of the 28): an omnibus list of committees, not an instrument on IT; the committees expire under s. 14.019 unless a new order recreates them. The LRB index shows the two committees created by Walker (#99 in 2013 and #51 in 2011), recreated in 2015 and recreated by Evers in 2019 (#6) and 2023 (#182); #6 is superseded by #182 and was not fetched. OWNER DECISION.
     - Evers #190 (April 2023, updates to the Telecommunications Relay Service Council): telecom, out of scope.
     - The other Evers orders numbered 185 to 305: 121 in all, 120 of them titled on the Governor's page (re-counted from the page bytes on 2026-11-12; #200, #257, #260 and #278 are listed there) and #268 (a flag proclamation, fetched and read), which the page omits. By title: 78 flag proclamations (including the Pride flag order #204, whose title the page misspells), 17 emergency or disaster declarations and economic-disruption orders (#303, price gouging), and 21 others: special elections and sessions, commissions and task forces, education compliance, flood insurance, vaccinations, tribal treaty rights, wild rice, commutation and, #294, a ban on state workers profiting from insider information (conduct, not IT); #190 and #211 are named above. None other is on IT.
     - Evers #1 to #183 (2019 to 2022): not read order by order (the Legislature's archive lists numbers without titles); a keyword search of the LRB subject index for them lists none on IT other than the committee orders #6 and #182 (above); #184 itself was issued January 2023.
     - Earlier governors, by keyword search of the LRB index: Thompson #242, #408 and #416 (seeded as stubs) are the IT orders it lists for 1987 to 2001. Also listed and not fetched: Thompson #373 and #379 (1999 Governor's Task Force on Privacy), Lucey #38 (1976, review process for forms used by state agencies) and Knowles #1 (1967, a Task Force on Computer Services staff committee); by their index titles these are a task force, a one-time review and a committee. OWNER DECISION if wanted.      - Walker #189 (3/11/2016, 'Promoting open and transparent government through implementation of best practices and performance dashboards') and its continuation #235 (3/9/2017): fetched and read on 2026-11-12. They direct every state agency on public records requests (response times, a records email address, training) and, in #235, on posting three public-records metrics on agency performance dashboards. The subject is public-records access and agency performance reporting, not IT, data publication or AI, so they fail the inclusion test; both are page scans with a machine-read text layer like the stubs above. OWNER DECISION if the data-publication duty is wanted.
     - Doyle #129 (2005), #182 (2007) and #303 (2009): the eHealth Care Quality and Patient Safety Board, recreated, then rescinded by #303, which created the WIRED for Health Board (health information exchange): boards, health-sector, and #129 is rescinded. Not IT governance of state agencies.
     - Thompson #341 and #360 (1998 and 1999, Governor's Blue Ribbon Commission on Year 2000 Preparedness): a commission with a report required, for a date problem that has passed.
     - Thompson #317 (9/16/1997, directs the Department of Administration to oversee implementation of the FCC universal service fund program in Wisconsin): telecommunications, out of scope.
     - Earl #79 (1985, Wisconsin Land Records Committee, recreated by Thompson #1 in 1987): a committee; land records are not state agency IT.
     - Other Doyle and Walker orders on IT: none found in the LRB index; the committee orders above are the ones it lists.
- text: |-
    Statewide IT policy and standards library (the DET Policies and Standards page, https://det.wi.gov/Pages/policies.aspx, 4 items on 2026-11-12: two policies and two standards). Every row is a document: the Acceptable Technology Use, Access, and Security Policy, the IT Security Policy Handbook, the IT Security Standards Handbook (26 numbered standards inside one file) and the Flaw Remediation (SI-2) Security Standard. Found elsewhere and not seeded:
     - Numbered standard files that search results listed under https://det.wi.gov/Documents/ (for example 110, 170 and 210 'Standard Executive Branch', Combined_Security_Standards_2024.pdf, CloudBrokeragePolicy.pdf, CloudBrokerageProcessStandard.pdf): all answered HTTP 404 through the Fetcher on 2026-11-12 and are not linked from the Policies page. Not in force at those addresses; the current numbered standards are the sections of the Standards Handbook.
     - The State Strategic IT Plan 2026-2028 and its Quick Reference Guide (https://det.wi.gov/Pages/Strategic_Planning.aspx; the plan is required by s. 16.971 (2) (m)): strategy documents, not instruments.
     - DET Vendor Cloud Brokerage (https://det.wi.gov/Pages/Vendor_Cloud_Brokerage-.aspx, linked from the vendor resources page): a requirements and review-process page for vendors that provide or seek to provide cloud services to the state, with a Vendor Cloud Solution Information Form (.docx) and a non-disclosure agreement (.docx) attached. Not an item of the Policies page, an HTML SharePoint page the shared readers have no cleanup for, and the attached forms are not instruments. Watched. OWNER DECISION whether the page is a standard to be ingested with a state module hook.
     - DET Cloud Brokerage (https://det.wi.gov/Pages/Cloud_Brokerage.aspx, linked from the DET Security page): the Fetcher was redirected to the DET Customer Center sign-in page (a SharePoint 'Sign In' page on detcc.wi.gov). Sign-in only, so no text of record.
     - DET Customer Center (detcc.wi.gov): the Strategic Planning page says state employees and agency partners reach further material there; it is behind sign-in and not read. The International Travel Procedure (a PDF on detcc.wi.gov, labelled 'Internal Customer Use Only' on https://det.wi.gov/Pages/InternationalTravelReferences.aspx) was not fetched.
     - Report a Security Incident (https://det.wi.gov/Pages/Report_an_Incident_Contacts.aspx): a contact chart (state agencies to the Enterprise Service Desk, others to Emergency Management or the DOJ fusion center), not an instrument. The DET Security page (https://det.wi.gov/Pages/Security.aspx) is a page of links and resources, not an instrument.
     - DET Rates (https://det.wi.gov/Pages/rates.aspx) and the grants pages: the home page links a rates page and cybersecurity grant programs; not read order by order and not policy.
     - The Policies page's own links to the two statute subchapters and to NIST SP 800-53: references; the statutes are seeded or left out above, NIST is federal.
     - Forms, templates and workbooks linked from DET pages (for example DOA-10816 Vendor Cloud Solution Information Form): not instruments.
- text: |-
    Scope notes. The Policies page's 4 items were read from the page bytes and the PDFs fetched through the Fetcher on 2026-11-12; none of the four PDFs has a page with no text layer (checked per page: the few pages under 40 words are a cover, a last page or a page ending a list). The UW System, the Department of Justice, the Department of Military Affairs, the Investment Board and the Technical College System Board are outside the acceptable-use policy's scope by its own text, and are not given separate instruments. The statute pages carry one hazard: the Legislature's pages serve a window of neighbouring sections around the one asked for, so a section is taken from the page as the elements it tags with its own number; the subchapter and chapter pages (for example https://docs.legis.wisconsin.gov/document/statutes/subch.%20VII%20of%20ch.%2016) serve a partial window loaded by script and were not used. Statutes are not watched (no stable index page serves the section list); the chapter 16 PDF is the Legislature's file that holds subchapter VII and was read for discovery only.
