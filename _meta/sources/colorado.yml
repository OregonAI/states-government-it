# Found and left out: what was seen on an official page and not seeded, with the reason.
left_out:
- text: '---- Colorado found and left out (the reason is recorded here; docs/research/09 has the live pages against the August archive)'
- text: |-
    Executive orders (www.colorado.gov/governor pages and their Drive PDFs, read 2026-11-11; titles of all 869 rows read):
     - B 2019 013 (Digital Personal Identification Technology): in scope, stubbed above (text layer doubled; OCR not run).
     - D 2026 022 (10/20/2026, Establishing a High-Quality Cybersecurity Pathway from Colorado's High Schools into College, Careers, and
       Service; Drive file 1mph8DwEG_CThtnTmzHp4nNP7lDwisP7v), read in full: a K-12, higher education and workforce order. OIT is one of six
       directed offices (internships, a shared cyber range assessment, community cybersecurity clinics); the subject is a cybersecurity career
       pathway, not IT as a government function. Left out on the inclusion test; OWNER DECISION (borderline: it names OIT duties).
     - B 2020 009 (10/30/2020, restating broadband responsibilities in OIT) and D 2022 009 / D 2022 023 (accelerating broadband deployment):
       broadband is out of scope (domain.yml). The fifteen 'Activating the Colorado National Guard to Assist with Election Cybersecurity Defense
       Efforts' orders (D 2019 014 to D 2026 021): election systems are out of scope, and each activation is for one election period.
     - Not found on any year page: an order on state AI, data governance or IT security. governor.colorado.gov did not answer (ConnectTimeout, one
       request); spl.cde.state.co.us was not retried. The Governor's 'A' (appointment) and 'C' (clemency) orders are not instruments of this corpus.
- text: |-
    OIT's live pages (read 2026-11-11), items not seeded as documents:
     - POL 100-51 'Interacting with the Office of the Governor, Elected Officials, and Their Staff' (effective 11/3/2026, version 1.0), listed under
       OIT Internal Policies, file https://drive.google.com/file/d/1rweshKsE_2EwGG8UkYbP0ivbnRetiHUC/view?usp=sharing : read in full; it sets
       approval protocols for OIT employees' official communications with elected officials. Fails the inclusion test (not IT, data or AI as a function).
     - TS-APP-010 'Code Repositories (Repository Manager)' and TS-INF-010 'Enterprise Wireless': stubs above; the files print version '3.01 (Draft)'.
       TS-DBS-001 'Supported Databases and Versions' prints version 4.01 with Last Updated 'Not documented (Draft)': the same Draft marker on the Last Updated row,
       so it is a stub too (OWNER DECISION, as for the other two); the ingester refuses a Draft on either row.
     - Drafts for Consultation, comments until 12/18/2026, not in force: REF-ENT-001 'Enterprise Information Technology Governance Framework'
       (version 1.0, effective date N/A; working-draft PDF https://drive.google.com/file/d/1dhnoZ3zPxxpN97ncO-aq5RK569ai3UHS/view?usp=drive_link ) and
       POL-OIT-047 'Mandatory Instrument Lifecycle Management Policy' (version 5.0, effective date N/A, supersedes POL-100-47;
       https://drive.google.com/file/d/1Kslv3vl0EAM2xQnDcRuBazRzkM1CeT9F/view?usp=drive_link ). The Technology Direction Statement is also a draft.
     - The 2027 Regulatory Agenda and 2026 Regulatory Report (rules page, Drive file 1x3ZnW9FCFgoEUA1ubmmZLN5Z8Bxm2Khp): a report, not an instrument.
       The rules page's two ServiceHub articles (KB0013812 tips for effective comments, KB0013810 OIT Stakeholder Engagement Protocol) govern public
       rulemaking engagement, not IT; ServiceHub text is script-rendered in any case. The five rules it lists are the five seeded (8 CCR 1501-5, -7, -9, -11,
       -12); the Secretary of State's page for 1501-5 shows the version held (effective 06/30/2026) as current, which is the 'amended rules adopted' notice.
     - Guides ('Practical Help for Applying OIT's Requirements', as the section page calls them, not the rules, policies, technical standards and mandatory
       procedures it lists as requirements): Guide to Accessible Web Services and its sub-pages, User Experience Playbook, Guide to Artificial Intelligence
       and its sub-pages (Individual User Responsibilities; Approved & Prohibited GenAI Tools, formerly 'Free ChatGPT Prohibited'; Strategic Approach to GenAI;
       GenAI Risks & Considerations; Case Study: Google Gemini Pilot). OWNER DECISION: Individual User Responsibilities and Approved & Prohibited GenAI Tools
       carry directives ('Effective immediately, please discontinue using the free version of ChatGPT on any of your state-issued devices'); the Guide's pages
       still link the Statewide GenAI Policy at a ServiceHub article (KB0012606), the PDF of which is the document co-oit-genai-policy.
       The Statewide GenAI Agency Responsibilities page (.../guide-to-artificial-intelligence/statewide-genai-agency-responsibilities) is a sub-page of the same Guide, with
       must-directives of the same kind; it was ingested in the first live-page pass and is now left out under the same OWNER DECISION, so that all the Guide's sub-pages are
       treated alike (its text read 2026-11-11, HTTP 200 to the Fetcher; document, snapshot and ingester test fixture were from the same bytes). Restore it, with the two siblings,
       if the owner decides the Guide's directives are instruments.
     - The Glossary of Terms (https://oit.colorado.gov/glossary-of-terms): fetched; OIT calls it 'the single, authoritative source of definitions used across State
       IT governance instruments' that every instrument 'incorporates by reference'. It is part of how the instruments read, and no ingester for its layout is built:
       OWNER DECISION whether it enters.
- text: |-
    Documents the first pass held that the live pages no longer list (removed from the corpus in this change; both Drive files still download and their text
    is unchanged since the first pass, so nothing shows they were withdrawn: OIT's page only no longer lists them; restore by reverting this change's removal):
     - OIT Authority & Governance Operations Memorandum (revised Feb. 2026), Drive file 12jw2Gm4zQsgOwy0xx1HoOeVWOSWglH0q, listed under Governance on the August archive copy.
     - Vendor Selection Standard for Major IT Projects (OIT-FinSvc-100, v1.1, effective Nov. 30, 2018), Drive file 1iuPwfRpcwXxHVcsSlDe1jRCe9HA4rF8T. Neither number nor title appears on any
       live page or in any fetched instrument.
     - Five of the 54 ServiceHub lead-stubs name instruments that are not on the live pages: TS-APP-003 Development Frameworks, TS-APP-004 Programming Languages (Custom
       Applications), TS-APP-006 Functional Application Test Automation Tool, TS-INF-004 Kiosk Equipment, TS-OIT-006 Secure Applications Coding Standard. The live
       technical standards page 'superseding any standards posted prior' lists TS-APP-005, -009, -010, -011 and no other APP standard.
     - The archive sections ('Archived' CISP sets of 2026, 2022 and 2019; Major Projects Boards Policy POL 200-02; Project Lifecycle Methodology POL 200-01) are not on the
       live pages at all; they were not in force and stay out. No ServiceHub article is linked from the live Standards, Policies & Guides, Technical Standards or Policies
       & Governance pages, so no ServiceHub stub remains.
     - Employee-only items, if any (docs/research/02): none shown.
- text: |-
    Statutes not seeded:
     - C.R.S. 6-1-1701 to 6-1-1709 (Colorado Consumer Protection Act, part 17, artificial intelligence). In the
       2026 edition the part exists twice: the SB 24-205 text 'effective until January 1, 2027' and the text SB 26-189
       (signed; Session Laws 2026 ch. 131) 'repeals and reenacts' as 'effective January 1, 2027' (consequential
       decisions on or after that date; sections 6-1-1704 (4), 6-1-1705 (3) and 6-1-1706 (6) take effect on passage).
       Both bind a 'deployer' or 'developer', each a 'person doing business in' Colorado, and the part is enforced by
       the attorney general through the Consumer Protection Act, whose 'person' definition (6-1-102 (18)) lists
       individuals and business and legal entities and does not name the state or a state agency. Nothing in either
       text names a state agency as an obligated party. Private-sector AI regulation is out of scope (domain.yml).
       Whether a state agency can be a 'deployer' is a legal question; the owner decides. OWNER DECISION. If it
       enters, both versions are in the one section range and the document must be read with its editor's notes.
     - Other AI provisions found by searching every title of the 2026 CRS for 'artificial intelligence' and
       'automated decision' (each hit read at its section): 10-16-112.7 (insurance utilization review), 12-245-224.5
       and 25.5-1-209 (AI in psychotherapy; payment), 1-46-102 (AI-generated content in election communications),
       13-21-1502 (a definition in civil liability law), 18-7-107 to 109 (intimate digital depictions), and mentions
       inside 24-30-105 (statewide language access assessment, AI as one option to evaluate), 24-71.3-102 (Uniform
       Electronic Transactions Act commentary), 16-3-313 and 16-18-106 (criminal procedure), 25-17-705 and 39-36-102:
       private-sector, health, election, criminal or incidental. Colorado has no general statute on state agency
       use of AI. The agency-use statute found is C.R.S. 24-18-301 to 24-18-309 (title 24, article 18, part 3, facial
       recognition services, SB 22-113), which that 'artificial intelligence' and 'automated decision' search missed
       because the part never uses those words; it is stubbed above as co-crs-24-18-pt3 (OWNER DECISION, the same as
       Washington's RCW 43.386). The general-purpose government-use instrument found is the OIT GenAI policy stubbed
       above (2-3-1707, the AI impact task force, is inside the seeded 2-3 part 17).
     - Colorado Procurement Code (articles 101 to 112 of title 24) and 24-30-202: left out whole, as Oregon's and Washington's
       were. Owner decision of 2026-11-13: a provision of non-IT law is in scope as a section slice when its own focus is the governance of
       state IT. Seeded on that ground: 1 CCR 101-9 rule R-24-103-201.5-03 (information technology projects, above). Read in the title file
       and NOT seeded because it is not a cited candidate (it would qualify on its face; the owner may add it): 24-102-208 (software
       application contracts: a licence may not limit where a governmental body installs or runs the software).
     - 24-30-209 (statewide financial and human resources information technology systems, billing, cash fund): IT funding, which the
       owner decision of 2026-11-13 covers on its face; not seeded because no held document cites it (the owner may add it).
       24-75-302 (IT capital account of the capital construction fund): DECLINED on the focus test, read 2026-11-13: the section is the
       capital construction fund (transfers by year since 1988, assessment fees); the IT capital account is one subsection of it.
     - Owner decision of 2026-11-13, applied to the candidates held documents cite (each read in the title file 2026-11-13):
       SEEDED: 24-71.3-117 to 24-71.3-119 (state agencies' electronic records and signatures under OIT policy), above.
       APPROVED AND VERIFIED BUT NOT SEEDED: 24-72-501 to 24-72-502 (part 5, privacy policies of state governmental entities: every state
       governmental entity must create a policy for 'the collection, storage, transfer, and use of personally identifiable information' regardless
       of 'source or medium' and publish it on its website, 24-72-502 (1), (2); in force, a 2002 part, not repealed). A seed entry for it was
       built and ingested cleanly (slice 24-72-501 to 24-72-601) and removed, because the shared test
       tests/test_authority_refs_review.py (LEFT_OUT case 'colorado', '(C.R.S. 24-72-501, et seq.)') pins 24-72-501 as LEFT_OUT and fails the
       gate once it is held; the owner or the shared-file owner changes that test, then the entry is restored. DECLINED, general law that applies to IT
       along with everything else: the rest of 24-72 (the open-records right of access and 24-72-204; 24-72-202 is CORA's general definitions section, so at the level a
       slice can cut its focus is not IT, although its (6)(b)(X), (XI) and (XII) take an agency's information security plan under 24-37.5-404,
       information security incident reports and information security audit and assessment reports under 24-37.5-403 (2)(d) out of 'public
       records': specific to state IT security, so left for the owner to decide), the rest of 24-71.3
       (the Act's general validation of electronic records), 24-71 (an electronic signature is the parties' option), 24-80 (records
       management of every medium; its 24-80-107 on film and digital scans is not a cited candidate). DECLINED on the focus test:
       24-34-802 and 24-34-301 (18) (the section is anti-discrimination liability and remedies; the duty to meet OIT's accessibility
       standards is its subsection (1)(c), and the standards themselves are held as article 24-85 and 8 CCR 1501-11); 24-50-1001 to
       24-50-1004 (fingerprint background checks for people with access to federal tax information: personnel screening, no word of
       systems or electronic records); 1 CCR 101-1 rule 3-5, read in the bytes of the version in force (ruleVersionId 12610, effective 07/01/2026): the rule as a whole is
       about interagency agreements between state agencies in general, so it is not clearly inside the owner decision and is left for the owner;
       but its definition 2.3 ('Recurring Services', services OIT provides for more than two consecutive years) and section 5 say OIT bills
       agencies for recurring services without an interagency agreement or encumbrance, lists them 90 days before the fiscal year, and
       continues them unless the agency gives notice 60 days before: IT funding governance, which is why co-oit-delegation-of-authority-policy
       cites it. Related, in the same rule set, rule 3-1 section 7.5: 'Information technology Commitment Vouchers require approval by the
       Governor's Office of Information Technology' (the owner may want it). 24-74.1 (policies regarding data and
       access): about immigration enforcement information at schools, health facilities and libraries.
     - 24-37.5 parts 2, 3, 5 and 6 and many sections of part 1 are printed as (Repealed): not in force.
     - 6-1-713, 6-1-713.5 and 6-1-1301 et seq. (private-sector data protection and the Colorado Privacy Act); 18-5.5
       (cybercrime); 13-32-114 (judicial department IT fund; judicial branch IT is out of scope).
     - Bills: no bill is seeded. SB 26-189 is enacted and appears only as the 2027 version of part 17 above.
