  # ---- Colorado OIT instruments, rebuilt 2026-11-11 from OIT's LIVE pages (docs/research/09)
  # colorado.gov's shared firewall now answers the toolkit Fetcher (toolkit v1.37.0, ADR-0019 crawler-form User-Agent
  # 'Mozilla/5.0 (compatible; OregonAI-CivicCorpus/<version>; +https://github.com/OregonAI/<repo>)'; the gate and CI stay on the
  # v1.36.4 pin and read snapshots only). Every entry below was read from bytes fetched that day: OIT's pages
  # .../standards-policies-guides, /technical-standards (also served at /technical-standards-policies), /policies-governance and
  # /standards-policies-guides/general-oit-rules-information, and the Google Drive file each list item links. Each file entry's
  # `oit_link` is the link OIT prints, `url` is Google Drive's direct-download form of the same file (the form fetched),
  # `found_via` the OIT page and `listed_as` the list item's text. The live pages list 41 technical standards, 10 policies and
  # 3 procedures, all Drive PDFs; they no longer link ServiceHub articles for any of them, so the 54 earlier lead-stubs (built from the
  # August Wayback copy) are gone: 49 of their instruments are documents below, 5 are not on the live pages (left-out record).
  # Each PDF opens with a header table (Document ID, Title, Issuing Authority, Version, Effective Date, Last Updated): the ingester
  # requires the Document ID to equal `document_id`, the Issuing Authority line to name OIT, and refuses a version marked (Draft).
  - id: co-watch-oit-standards-policies-guides
    url: https://oit.colorado.gov/standards-policies-guides
    format: html
    citation: "OIT Standards, Policies & Guides"
    title: "OIT Standards, Policies & Guides (section index)"
    doc_type: policy
    jurisdiction: colorado
    tags: [governance]
    recheck: monthly
    watch_only: true
    why_relevant: "The section's front page: its Rules & Rulemaking, Policies & Governance and Technical Standards pages, the Mandatory Procedures it lists as PDFs (Delegation of Authority Procedure and the two Real-time Billing Dispute procedure files), the OIT Guides, and the Drafts for Consultation. Read 2026-11-11 (HTTP 200 to the Fetcher). A new or removed procedure shows here."
  - id: co-watch-oit-technical-standards
    url: https://oit.colorado.gov/standards-policies-guides/technical-standards
    format: html
    citation: "OIT Technical Standards"
    title: "OIT Technical Standards (list of the issued standards)"
    doc_type: policy
    jurisdiction: colorado
    tags: [governance]
    recheck: monthly
    watch_only: true
    why_relevant: "OIT's list of the technical standards the Office of Enterprise Architecture has issued (41 files on 2026-11-11, in five groups: Accessibility, Applications, Data and Databases, Information Security, Infrastructure), each a Google Drive PDF. The older address .../technical-standards-policies answers the same page. Additions, removals and re-links show here; the page says 'A Broader Review is Underway' and that the directory is expected to change."
  - id: co-watch-oit-policies-governance
    url: https://oit.colorado.gov/policies-governance
    format: html
    citation: "OIT Policies & Governance"
    title: "OIT Policies & Governance (current statewide policies)"
    doc_type: policy
    jurisdiction: colorado
    tags: [governance]
    recheck: monthly
    watch_only: true
    why_relevant: "OIT's list of Current Statewide Policies (Enterprise Governance, Generative AI, Information Security, Real-time Billing Disputes, OIT Internal Policies; 10 Google Drive PDFs on 2026-11-11) and of the governance frameworks open for comment. Additions, removals, and a draft's move to in-force show here."
  - id: co-watch-oit-rules-information
    url: https://oit.colorado.gov/standards-policies-guides/general-oit-rules-information
    format: html
    citation: "OIT General Rules Information"
    title: "OIT General OIT Rules Information (rulemaking page)"
    doc_type: policy
    jurisdiction: colorado
    tags: [governance]
    recheck: monthly
    watch_only: true
    why_relevant: "OIT's rulemaking page: it lists the five OIT rule sets in force (8 CCR 1501-5, -7, -9, -11, -12) with links to the Secretary of State, stakeholder notices (on 2026-11-11: amended Rules in Support of the Colorado Information Security Act adopted; Emergency IT Purchasing Rules repealed) and the regulatory agenda. A new rule, a repeal or a new notice shows here."

