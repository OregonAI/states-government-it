    why_relevant: "Rules under C.R.S. 24-37.5-106 (4) and 24-85-103 setting the accessibility standards for information technology systems that state agencies use, public-facing or internal, for individuals with a disability."
  - id: co-ccr-8-1501-12
    sha256: "7ac0541442f6f1ab4ccea6205bcf2eba4b8808ec7de6af3613736cff404aebb2"
