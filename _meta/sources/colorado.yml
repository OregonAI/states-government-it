  # ---- Colorado executive orders: the official lists are at www.colorado.gov/governor (read 2026-11-11, HTTP 200 to the Fetcher)
  # The Governor's page www.colorado.gov/governor/executive-orders links one page per year (2019 to 2026); each lists the orders
  # with a Google Drive PDF of each signed order. All 869 rows (A appointments, B boards, C clemency, D declarations and directives)
  # were read for titles; the ones about state IT, cybersecurity, data or AI are the stub below and the records in the left-out
  # comment. governor.colorado.gov itself did not answer (ConnectTimeout, one request).
  - id: co-eo-b-2019-013
    url: https://drive.google.com/uc?export=download&id=1Km0kUbib3FGiza6d8_C83KTFMC3fMn6W
    format: pdf
    citation: "B 2019 013"
    title: "Supporting Widespread Adoption of Digital Personal Identification Technology"
    doc_type: executive_order
    jurisdiction: colorado
    issuing_body: "Office of the Governor"
    tags: [digital-services, governance]
    recheck: monthly
    stub: true
    oit_link: "https://drive.google.com/file/d/1Km0kUbib3FGiza6d8_C83KTFMC3fMn6W/view?usp=sharing"
    found_via: "https://www.colorado.gov/governor/2019-executive-orders"
    stub_reason: "In scope and in force by the official record, but the file's text cannot be committed cleanly. The Governor's 2019 orders page links the PDF (listed as 'B 2019 013', 10/30/2019); the Fetcher read it on 2026-11-11 (HTTP 200, 1,010,943 bytes, 3 pages, produced by Adobe Acrobat 10.0 Paper Capture Plug-in). Its text layer holds every word twice at slightly different offsets (pdftotext prints 'Supporting Widespread Widespread Adoption Adoption of of Digital ...'), so extraction is not the order's text; the page images are legible. The order directs OIT, with the Department of Revenue's Division of Motor Vehicles and other executive branch agencies, to develop, launch and hold sole responsibility for Colorado Digital ID and related identification technology (sections II.A-H), exempts state law enforcement agencies in part (III), and ends 'This Executive Order shall remain in effect unless modified or rescinded by future Executive Order of the Governor' (IV). None of the Governor's 2019-2026 order lists shows a rescission of it. The two-engine OCR procedure was run on 2026-11-11 (tesseract through ocrmypdf --force-ocr, which sets the doubled layer aside, and PaddleOCR PP-OCRv6 on the original page images). The engines agree on 94% of the word sequence (bar 80%) but on only 85% of the 46 figures (bar 90%); with tesseract page-segmentation mode 4 the figure agreement was 87% of 44, and with mode 6 82% of 49. The figures are the order's own numbers (its number, the Article IV Section 2 citation, dates) and the engines read them differently, so the reading is not promotable and a single engine's text is not committed. Deduplicating the text layer by script would be an unreviewed transformation. Reopens when the Governor's office publishes a clean copy, or an OCR run clears the figure bar."
    why_relevant: "Directs OIT and the executive branch agencies on Colorado Digital ID (a mobile digital identity, with the myColorado app): authorizes it as a legal form of personal identification, lets agencies accept it from 12/01/2019, and gives OIT sole responsibility for it and related identification technology. The only Colorado order found on state IT, cybersecurity, data or AI that is clearly in force."

