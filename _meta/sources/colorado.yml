# Colorado seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
sources:

  # ==== Colorado (seed list proposed 2026-11-10/11; every statute entry below was read in the fetched title files) ====
  #
  # ---- Statutes: Colorado Revised Statutes 2026, the official title files of the Office of Legislative Legal
  # ---- Services (https://olls.info/crs/). The source is ONE Word-HTML file per title (Title 24 is 22 MB), so each
  # ---- entry is a slice of it: `slice: {article: n}` or `{article: n, part: m}` (crs_html_to_text in src/ingest.py).
  # ---- Entries cut from one title file share its url on purpose; the seed check keys uniqueness on url plus slice.
  - id: co-crs-24-37-5
    sha256: "5679f4e4d99e376a783af2697f19afb11a07298fecb048dbbd60d92aa5f1fe7c"
    url: https://olls.info/crs/crs2026-title-24.htm
    format: html
    citation: "C.R.S. title 24, article 37.5"
    title: "Office of Information Technology"
    doc_type: statute
    jurisdiction: colorado
    issuing_body: "Colorado General Assembly; published by the Office of Legislative Legal Services"
    tags: [governance, oversight, funding, procurement, cybersecurity, data, digital-services, cloud-resilience]
    recheck: monthly
    slice: {article: "37.5"}
    why_relevant: "The enabling statute of the Governor's Office of Information Technology (OIT) and its chief information officer: creation of the office and the information technology revolving fund (24-37.5-103), the office's roles and its duty to establish, maintain and enforce information technology oversight and standards (24-37.5-105), state agency responsibilities (24-37.5-105.2), the CIO's duties and rulemaking power (24-37.5-106), the information security part (part 4: chief information security officer, agency information security plans, security incidents), the interdepartmental data protocol and government data advisory board (part 7), asset inventory, budget request and technical debt reports (part 8). The source file serves the whole article, so the Colorado broadband office (part 9, out of scope) comes with it, as the broadband sections came with ORS chapter 276A."
  - id: co-crs-24-37-7
    sha256: "5679f4e4d99e376a783af2697f19afb11a07298fecb048dbbd60d92aa5f1fe7c"
    url: https://olls.info/crs/crs2026-title-24.htm
    format: html
    citation: "C.R.S. title 24, article 37.7"
    title: "Statewide Internet Portal Authority"
    doc_type: statute
    jurisdiction: colorado
    issuing_body: "Colorado General Assembly; published by the Office of Legislative Legal Services"
    tags: [digital-services, governance]
    recheck: monthly
    slice: {article: "37.7"}
    why_relevant: "Creates the statewide internet portal authority and sets its mission: the officially recognized statewide internet portal giving the public, state agencies and local governments one-stop electronic access to information, products and services (24-37.7-105)."
  - id: co-crs-24-33-5-pt19
    sha256: "5679f4e4d99e376a783af2697f19afb11a07298fecb048dbbd60d92aa5f1fe7c"
    url: https://olls.info/crs/crs2026-title-24.htm
    format: html
    citation: "C.R.S. title 24, article 33.5, part 19"
    title: "Colorado Cybersecurity"
    doc_type: statute
    jurisdiction: colorado
    issuing_body: "Colorado General Assembly; published by the Office of Legislative Legal Services"
    tags: [cybersecurity, governance]
    recheck: monthly
    slice: {article: "33.5", part: "19"}
    why_relevant: "Creates the Colorado cybersecurity council within the Department of Public Safety, as a steering group developing cybersecurity policy guidance for the Governor and a whole-of-state cybersecurity approach for the state and local governments (24-33.5-1902), and the cyber operation center, cybersecurity education and research provisions and cybersecurity cash fund (24-33.5-1903 to 1906)."
  - id: co-crs-24-73
    sha256: "5679f4e4d99e376a783af2697f19afb11a07298fecb048dbbd60d92aa5f1fe7c"
    url: https://olls.info/crs/crs2026-title-24.htm
    format: html
    citation: "C.R.S. title 24, article 73"
    title: "Security Breaches and Personal Information"
    doc_type: statute
    jurisdiction: colorado
    issuing_body: "Colorado General Assembly; published by the Office of Legislative Legal Services"
    tags: [data, cybersecurity]
    recheck: monthly
    slice: {article: "73"}
    why_relevant: "Duties of every governmental entity that holds personal identifying information: a written disposal policy (24-73-101), reasonable security procedures and practices, including for third-party service providers (24-73-102), and notification of a security breach (24-73-103). A governmental entity is the state and any state agency or institution, and local governments (24-73-101 (4)(a))."
  - id: co-crs-24-74
    sha256: "5679f4e4d99e376a783af2697f19afb11a07298fecb048dbbd60d92aa5f1fe7c"
    url: https://olls.info/crs/crs2026-title-24.htm
    format: html
    citation: "C.R.S. title 24, article 74"
    title: "Protection of Personal Identifying Information"
    doc_type: statute
    jurisdiction: colorado
    issuing_body: "Colorado General Assembly; published by the Office of Legislative Legal Services"
    tags: [data]
    recheck: monthly
    slice: {article: "74"}
    why_relevant: "Limits on how state agencies and political subdivisions share personal identifying information, an instruction to reduce the personal identifying information they collect, limits on access to their records, and a civil penalty for data privacy breaches (24-74-103 to 24-74-107). Government-held data privacy; the legislative declaration ties it to the enforcement of federal immigration law."
  - id: co-crs-24-85
    sha256: "5679f4e4d99e376a783af2697f19afb11a07298fecb048dbbd60d92aa5f1fe7c"
    url: https://olls.info/crs/crs2026-title-24.htm
    format: html
    citation: "C.R.S. title 24, article 85"
    title: "Information Technology Access for Individuals Who are Blind or Visually Impaired"
    doc_type: statute
    jurisdiction: colorado
    issuing_body: "Colorado General Assembly; published by the Office of Legislative Legal Services"
    tags: [digital-services, procurement]
    recheck: monthly
    slice: {article: "85"}
    why_relevant: "State information technology accessibility: accessibility standards for individuals with a disability (24-85-103) and accessibility criteria and contract terms in the procurement of information technology (24-85-104)."
  - id: co-crs-2-3-pt17
    sha256: "da1cb86ba9d7e5549a314c294404229a0bb07399511225bd13e6ae6a35723c8f"
    url: https://olls.info/crs/crs2026-title-02.htm
    format: html
    citation: "C.R.S. title 2, article 3, part 17"
    title: "Joint Technology Committee"
    doc_type: statute
    jurisdiction: colorado
    issuing_body: "Colorado General Assembly; published by the Office of Legislative Legal Services"
    tags: [oversight, governance, ai]
    recheck: monthly
    slice: {article: "3", part: "17"}
    why_relevant: "The legislature's Joint Technology Committee, which oversees the Office of Information Technology and the chief information security officer (2-3-1704), and the artificial intelligence impact task force (2-3-1707). Included for the oversight of executive-branch IT; the committee itself is a legislative body."

  # ---- Colorado stub: a statute held out for an owner decision (the Washington equivalent, RCW 43.386, is stubbed the same way)
  - id: co-crs-24-18-pt3
    url: https://olls.info/crs/crs2026-title-24.htm
    format: html
    citation: "C.R.S. title 24, article 18, part 3"
    title: "Use of Facial Recognition Services by State and Local Government Agencies"
    doc_type: statute
    jurisdiction: colorado
    issuing_body: "Colorado General Assembly; published by the Office of Legislative Legal Services"
    tags: [ai, governance, data]
    recheck: monthly
    slice: {article: "18", part: "3"}
    stub: true
    stub_reason: "Borderline for scope, owner decision (the same call as Washington's RCW 43.386): the part governs state and local agency use of facial recognition services (accountability reports, meaningful human review, testing, training, record keeping; 24-18-302 to 24-18-306) but 24-18-307 and 24-18-308 are law-enforcement provisions (surveillance and tracking, prohibited uses, warrants; disclosure to a criminal defendant), and the scope statement puts law-enforcement technology out except where a general agency-AI rule names it. It passes the domain test otherwise: 24-18-301 (2) defines 'Agency' as 'An agency of the state government or of a local government' or a state institution of higher education, and 24-18-301 (14)(b) makes the office of information technology the reporting authority for a state agency. The source was read on 2026-11-11 in the title 24 file already fetched (133 lines, PART 3 heading to the source note 'L. 2022: Entire part added, (SB 22-113), ch. 463, ... effective August 10'); the slice ingests cleanly, so the entry becomes a document the moment the owner takes it in (remove stub and stub_reason, run src/ingest.py)."
    why_relevant: "Colorado's only enacted statute found that regulates state agency use of an AI technology (facial recognition): notice of intent and accountability reports, meaningful human review of decisions with legal or similarly significant effects, pre-use testing, user training and record keeping (SB 22-113). The Office of Information Technology is the reporting authority for state agencies."

  # ---- Colorado administrative rules: 8 CCR 1501, Governor's Office of Information Technology (Code of Colorado Regulations)
  # www.sos.state.co.us/CCR answers the toolkit Fetcher only through the curl transport (docs/research/07). Read 2026-11-11: the
  # Secretary of State's browse list (NumericalDeptList.do) names department 1501 'Office of the Governor' and, under it, agency
  # 'Governor's Office of Information Technology' (agencyID 168); that agency's list (NumericalCCRDocList.do?deptID=6&agencyID=168,
  # the watch entry below) names nine rule sets, 8 CCR 1501-4 to 1501-12 less 1501-10 (not listed). Each rule's page shows a
  # 'Current version' with its effective date. IN FORCE and seeded here: 1501-5, 1501-7, 1501-9, 1501-11, 1501-12. NOT in force,
  # left out: 1501-4 (INFORMATION AND TECHNOLOGY MANAGEMENT CODE, current version is the repeal notice, 'Entire rule repealed
  # eff. 04/14/2014'), 1501-6 (RULES IN SUPPORT OF THE OFFICE OF INFORMATION TECHNOLOGY, 'repealed eff. 04/14/2026', one-page notice),
  # 1501-8 (PUBLIC SAFETY TRUST FUND, listed '[Repealed eff. 06/30/2024]'). The url of each entry is the PDF of the rule's current
  # version, which the page says 'constitutes the official version of the rule and shall govern in all cases'; ruleVersionId pins
  # the version, so a new version of a rule is noticed through the watch entry (a new Current version row), and the entry is then
  # re-pointed by the owner. The five leads in the earlier note (1501-5, -6, -9, -11, -12) were checked: -6 is repealed.
  - id: co-ccr-8-1501-5
    sha256: "8f847b47ae14dd5479aa75a046128d4d1401e42d11ef52129da2e4d69d6ebeaa"
    url: https://www.sos.state.co.us/CCR/GenerateRulePdf.do?ruleVersionId=12587&fileName=8%20CCR%201501-5
    format: pdf
    citation: "8 CCR 1501-5"
    title: "RULES IN SUPPORT OF THE COLORADO INFORMATION SECURITY ACT"
    doc_type: rule
    jurisdiction: colorado
    issuing_body: "Office of the Governor, Governor's Office of Information Technology"
    tags: [cybersecurity, governance]
    recheck: monthly
    why_relevant: "Rules adopted by the Chief Information Security Officer under the Colorado Information Security Act (C.R.S. 24-37.5-403, 404, 404.5): every public agency maintains an annual agency or enterprise cybersecurity plan (ACSP or ECSP, due July 15), what the plan contains, and the NIST Cybersecurity Framework the rules incorporate by reference."
  - id: co-ccr-8-1501-7
    sha256: "a263b64c583b1487602e4621cc077270bbfdaa58c9972528f8ea7959af33311a"
    url: https://www.sos.state.co.us/CCR/GenerateRulePdf.do?ruleVersionId=3366&fileName=8%20CCR%201501-7
    format: pdf
    citation: "8 CCR 1501-7"
    title: "RULE IN SUPPORT OF CENTRALIZED IT MANAGEMENT AND CREATION OF ENTERPRISE ARCHITECTURE OFFICE AND DATA MANAGEMENT PROGRAM"
    doc_type: rule
    jurisdiction: colorado
    issuing_body: "Office of the Governor, Governor's Office of Information Technology"
    tags: [governance, oversight, cloud-resilience]
    recheck: monthly
    why_relevant: "Rule under C.R.S. 24-37.5-104 that governs every state agency's IT: it creates the Office of Enterprise Architecture in OIT, which sets enterprise standards for all technical domains and runs the enterprise architecture and data management programs, and aligns IT investment with state policy."
  - id: co-ccr-8-1501-9
    sha256: "4a1e446a23bbf4ea58f47823435039b6d2b5f59bbd9ca8ddc736d535c4fc0afa"
    url: https://www.sos.state.co.us/CCR/GenerateRulePdf.do?ruleVersionId=7073&fileName=8%20CCR%201501-9
    format: pdf
    citation: "8 CCR 1501-9"
    title: "COLORADO RULES REGARDING ELECTRONIC TRANSACTIONS BY COLORADO GOVERNMENTAL AGENCIES"
    doc_type: rule
    jurisdiction: colorado
    issuing_body: "Office of the Governor, Governor's Office of Information Technology"
    tags: [digital-services, cybersecurity]
    recheck: monthly
    why_relevant: "Rules naming OIT as the Policy Authority for governmental electronic transactions (C.R.S. 24-71.3): agencies must use technologies OIT authorizes, follow its security standards, and OIT may suspend an agency that does not."
