- id: md-sfp-3-5-powers-and-duties-of-the-secretary
  sha256: "8ef06ffb8ca4508bf18df3bd245c199dc715a607277a1127b2fcc713932ec272"
  url: https://mgaleg.maryland.gov/mgawebsite/Laws/StatuteText?article=gsf&section=3.5-301&enactments=true
  format: html
  citation: Md. Code, State Fin. & Proc. §§ 3.5-301 to 3.5-315, 3.5-317 to 3.5-319
  title: 'State Finance and Procurement Article, Title 3.5, Subtitle 3: Secretary of Information Technology, master plan, project oversight, investment fund, nonvisual access, data inventory and privacy officers (§§ 3.5-301 to 3.5-315, 3.5-317 to 3.5-319)'
  doc_type: statute
  issuing_body: Maryland General Assembly; compiled and published by the Department of Legislative Services on the General Assembly website
  tags:
  - governance
  - oversight
  - funding
  - procurement
  - data
  - digital-services
  - cybersecurity
  article: gsf
  sections:
  - 3.5-301
  - 3.5-302
  - 3.5-303
  - 3.5-304
  - 3.5-305
