  - 3.5-307
  - 3.5-308
  - 3.5-309
  - 3.5-310
  - 3.5-311
  - 3.5-312
  - 3.5-313
  - 3.5-314
  - 3.5-315
  - 3.5-317
  - 3.5-318
  - 3.5-319
  found_via: https://mgaleg.maryland.gov/mgawebsite/Laws/Statutes (section pages requested by number; see the left-out notes for the numbers tried)
  why_relevant: 'The statute DoIT''s policies cite as ''3.5-301 to 3.5-309'' (its older policies cite the same duties as ''SF&P 3A-301-309''): definitions (3.5-301), exemptions (3.5-302), the Secretary''s duties (3.5-303), the statewide information technology master plan (3.5-304, 3.5-306), each unit''s IT policies, standards and plans (3.5-305), review and approval of IT purchases and project requests (3.5-307, 3.5-308), the Information Technology Investment Fund (3.5-309), the nonvisual access requirements (3.5-311), delegation (3.5-312), security-sensitive data (3.5-314), the Information Sharing and Analysis Center (3.5-315), biennial independent assessments of the cybersecurity and IT systems of each unit (3.5-317), and the annual data inventory and the unit Privacy Officer (3.5-318, 3.5-319, in the October 1, 2026 view). Section 3.5-313 (the searchable State payment-data website) rides along. Sections 3.5-316 and 3.5-320 to 3.5-325 returned no text. The page for 3.5-309 prints two versions of the section: ''IN EFFECT'' and, after it, ''// EFFECTIVE JUNE 30, 2031 PER CHAPTERS 436 AND 437 OF 2026 //'' with the text that takes over then; the document keeps only the version marked IN EFFECT and the snapshot keeps both (owner decision, see the left-out record).'
  jurisdiction: maryland
  recheck: monthly
