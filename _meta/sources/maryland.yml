# Maryland seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Issue #19. Discovery 2026-11-11: DoIT's policy library (home, eight category pages, the suite's directives and transitional lists),
# the AI portal, the General Assembly's statute section pages, COMAR title 14 and title 01 (executive orders) as published by the Division
# of State Documents, and the Governor's executive order list. Seed entries with `sections:` are statute documents built from one page per section.
