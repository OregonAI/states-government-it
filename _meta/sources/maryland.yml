    ---- Maryland: found and left out (each was seen on an official page on 2026-11-11; the reason is recorded here). 'Owner decision' marks a judgment call a reviewer should confirm.
- text: |-
    Rules: COMAR title 14, subtitle 33 (Department of Information Technology; chapter 01 and chapter 02, nonvisual access) is seeded as one document. The Title 14 contents page (maryland-dsd/law-html, publication/2026-10-26, comar/14/index.html) lists 'Subtitle 33 DEPARTMENT OF INFORMATION TECHNOLOGY' and the subtitle's contents page lists those two chapters only. No chapter implements the DoIT regulations that SF&P 3.5-404 and 3.5-406 mention (certification of compliance with minimum security standards, local cybersecurity preparedness plans): DoIT's page on minimum security standards for networkMaryland says the frequency is 'not yet established in regulation'. The contents pages of other COMAR titles were not read, so a DoIT-related rule filed under another agency's title would not have been found; a search for 'Information' or 'Technolog' in the Title 14 subtitle names found only subtitle 33.
- text: |-
    Source of the COMAR text and of the executive orders, owner decision: the Library of Maryland Regulations (regs.maryland.gov) prints on every page 'Please do not scrape. Instead, bulk download the CC BY-NC-SA-4.0 HTML or XML or CC0 HTML or XML' (github.com/maryland-dsd/law-html and law-xml-codified, and the -cc0 copies), licenses the version it serves under CC BY-NC-SA 4.0 with copyright held by the State of Maryland, and says it is dedicated to the public domain under CC0 1.0 180 days after publication. Its robots.txt (fetched 2026-11-11) allows all paths for the agent '*' except '/_*', carries 'Content-signal: search=yes,ai-train=no', and disallows by name Amazonbot, Applebot-Extended, Bytespider, CCBot, ClaudeBot, Google-Extended, GPTBot and meta-externalagent; this corpus's agent (OregonAI-CivicCorpus) is none of those and the Fetcher does not enforce robots.txt. To follow the 'do not scrape' request the seed takes the text from the Division of State Documents' own bulk publication, the CC BY-NC-SA HTML repository at its dated branch publication/2026-10-26 (raw.githubusercontent.com, 2 pages for the rule and the contents pages, one file per order), not from regs.maryland.gov. The Fetcher read regs.maryland.gov for four pages only (robots.txt, the home page, the section page COMAR 14.33.02.01 while the layout was being discovered, and the 14.33 contents page that is the one watched page). Consequences for the owner: (1) the NC term of CC BY-NC-SA and the ai-train=no signal bear on whether this corpus may mirror these pages; (2) the seed urls name a dated branch, so the monthly drift run will never see a change there: the watched contents page is the only detector, and the seed needs a new branch name after each publication (the repository's default branch changes with each one).
- text: |-
    Statutes: seeded as seven documents (State Finance and Procurement Article title 3.5, subtitles 1 and 2, 2A, 3, 4, 8 and 9, and State Government Article 10-1301 to 10-1308). The General Assembly's site serves one section per page and its section list and Previous/Next buttons are fed by its internal API, which this corpus does not call, so the sections were found by requesting each number in these ranges through the Fetcher (the page answers 200 with 'File Not Found' for a number that does not exist), in the view 'in effect as of October 1st of this year' (enactments=true, the site's default): State Finance and Procurement 3.5-101 to 3.5-119, 3.5-201 to 3.5-215, 3.5-2A-01 to 3.5-2A-11, 3.5-301 to 3.5-325, 3.5-401 to 3.5-415, 3.5-501 to 3.5-515, 3.5-601 to 3.5-611, 3.5-701 to 3.5-711, 3.5-801 to 3.5-811, 3.5-901 to 3.5-925, 3.5-1001 to 3.5-1003; State Government 10-1301 to 10-1311 and 9-2901 to 9-2905. Sections found: 3.5-101, 3.5-201 to 3.5-205, 3.5-2A-01 to 3.5-2A-06, 3.5-301 to 3.5-315, 3.5-317 to 3.5-319, 3.5-401 to 3.5-406, 3.5-701 and 3.5-702, 3.5-801 to 3.5-807, 3.5-901 to 3.5-907, 10-1301 to 10-1308 and 9-2901; every other number in the ranges returned 'File Not Found' (3.5-316 is cited as the 'Modernize Maryland Commission' section by 3.5-317 and returned none). A section outside those ranges, or a subtitle with letters other than 2A, would not have been found. A first listing taken in the January 1 view (enactments=false) lacked 3.5-319 and ended its subtitle 9 at 3.5-905, which is why the October 1 view is the one seeded. The statute documents are bundles of the listed sections, so the monthly drift run, which reads each entry's url (the first section only), will report them as changed every month until corpus-toolkit can recheck a multi-page source (the same limit the California slices have).
- text: |-
    Statute sections found and left out: 3.5-701 and 3.5-702 (the Department of Aging's Senior Call-Check and Social Connections Program, filed in title 3.5 but a service program, not IT governance); State Government 9-2901 (Maryland Cybersecurity Council: a council in the Attorney General's office whose members include private-sector and higher-education representatives and whose subject is cybersecurity of the State's critical infrastructure generally, not the security of State systems; owner decision, it would belong with 3.5-2A on the playbook's cybersecurity item). Subtitle 3 carries along 3.5-313 (the State payment-data website) and subtitle 4 carries 3.5-406 (local governments) because the seed takes whole subtitles; subtitle 8 carries 3.5-807 (the Workgroup on Artificial Intelligence Implementation, which includes industry members and is printed as effective until June 30, 2029).
- text: |-
    Statutes not read: breach and data statutes outside State Government 10-1301 to 10-1308 that bind private businesses (the Commercial Law personal-information protection act, the online data privacy act), Public Safety 14-104.1 (local government incident reporting, cited by DoIT's local-government pages), the Public Information Act, State records and archives statutes, and procurement law outside title 3.5 (State Finance and Procurement division II): the playbook leaves procurement-code sections out pending an owner decision on section-level slicing, and the others were not fetched. They are named here so a reviewer can say whether any belongs.
- text: |-
    AI legislation: the AI portal's list of laws (https://ai.maryland.gov/ai-maryland/legislation, updated July 29, 2026, watched) names SB 818 (2024, Ch. 496), the Artificial Intelligence Governance Act of 2024, which is codified in 3.5-801 to 3.5-807 (seeded); SB 114 (2026, Ch. 434, a 3-1-1 expansion program using AI and an oversight board) and SB 1068/HB 1141 (2024, Ch. 450, a DoIT evaluation of a 3-1-1 portal that may use AI): service-program and study provisions, not governance of State IT, and not fetched; SB 597 (2026, Ch. 633, the Maryland Artificial Intelligence Partnership in the University System of Maryland: a university program); HB 956 (2025, Ch. 105, the Workgroup, codified at 3.5-807 and carried by the seeded subtitle); HB 820 (2025, Ch. 747, AI in health insurance utilization review: binds insurers, private); SB 294 (2025, Ch. 628, the Maryland Cybersecurity Council's AI and quantum scope: see 9-2901 above). Owner decision on the 3-1-1 acts. A search of the sections read found no other Maryland statute on State agency use of AI; the Code was not searched in full.
- text: |-
    Executive orders: the Governor's list (https://governor.maryland.gov/official-actions/executive-orders, watched; 117 orders on 3 pages, all Governor Moore's 2023 to 2026 orders; the page has a keyword filter and no filter by governor) and the Division of State Documents' year index pages for 2015 to 2026 (92 titles read for 2015 to 2026, and 92 more for 1971 to 2014, of which seven year pages do not exist: 1974 to 1977, 1979, 1982, 1997) were read. Seeded: 01.01.2024.02 (AI), 01.01.2019.07 (Cyber Defense Initiative), 01.01.2021.09 (State Chief Data Officer), 01.01.2021.10 (Maryland Data Privacy), 01.01.2022.03 (MD THINK), 01.01.2007.26 (Information Technology), 01.01.1983.18 (Privacy and State Data System Security). Left out: 01.01.2021.11 (MD THINK; amended and restated in full by 01.01.2022.03, whose text differs by the added definitions and the Executive Director; the older order is not in force as printed); 01.01.2025.06 (Statewide Digital Infrastructure Group in DoIT: coordination of wired and wireless communications and broadband infrastructure, which the domain file excludes as broadband and telecom; owner decision because it sits in DoIT and names 'digital information technology infrastructure'); 01.01.2023.05 (Council on Innovation and Impact), 01.01.2025.08 (Office of Performance Improvement), 01.01.2024.25 (Plain Language Initiative), 01.01.2024.20 (communications interoperability: public safety), 01.01.2024.38 and 01.01.2023.03 (procurement and minority business reporting generally), 01.01.2026.16 (data center development: ratepayers and energy), 01.01.2026.09 (executive branch employees' use of confidential information in prediction markets: conduct), and the other orders, which do not govern State IT, cybersecurity, data or AI by title. The Governor's AI Principles page (https://governor.maryland.gov/official-actions/ai-principles) was listed in the site menu and not read. Orders are filed in COMAR only if the Division publishes them: the Division's 2025 and 2026 year pages list fewer orders than the Governor's list, so an order on IT that the Division did not file would be found only on the Governor's list; none was seen there by title. The status of the seeded orders is 'printed in COMAR with no rescission note'; later orders were not searched for a rescission.
- text: |-
    DoIT policy library: reconciled row by row against the library home (https://doit.maryland.gov/policies/Pages/default.aspx), its eight category pages (Accessibility, AI, Cybersecurity & Privacy Policy Suite, Departmental, Hardware, MITDP, Telework, Websites and Data), the suite's Emergency and Binding Operational Directives and Transitional Governing Policy Documents pages, and the AI portal's policies page (ai.maryland.gov/state-employee-guidance/policies, which lists the six AI instruments and not the roadmap). The library has no status column; where a page prints a revision history or a 'DRAFT' marking it was read. Every row is a document (62 seeded from DoIT), a stub (1) or one of the items below. Rows listed in more than one place are one document: Communication Recordings (Departmental page, transitional list and the PDF of policy 20-11: the PDF is the document), Foreign Travel / 'Traveling with State-Issued Technology' (Hardware page and transitional list), Prohibited Technologies (policy home, directives list), the KEV directive and the public-disclosure guidelines (policy home and their lists), the Responsible AI Policy, and the Desktop / Laptop Policy (policy home and category pages).
- text: |-
    DoIT library, text of record is the PDF where the page says so: for the numbered 20-xx policies the HTML page repeats the PDF and says 'The PDF version of this policy represents the authoritative policy document ... shall prevail', so the PDFs are seeded and the 12 pages are left out as duplicates (Communication Recordings x2, Enterprise Architecture, Intake Process, IT Policy Program, Key Terms, RSA Programs, Boundary Protection, MITDP Fund Disbursements, MITDP Procedures, IT Support for Telework and Maryland Digital Accessibility Policy). The 20-05 file prints policy number 20-06 and the 20-11 file prints 20-24 in its footer; both are recorded as printed. Documents attached to these policies are seeded as separate documents where they are instruments: the Enterprise Architecture Handbook (version 1D), the RSA Program Policy Manual (last update 01 November 2023) and the MITDP Standards Manual (the file name ends 'DRAFT-V4'; the document prints no draft marking).
- text: |-
    DoIT library, Cybersecurity & Privacy Policy Suite table (32 rows): 11 policies and 11 standards seeded; 9 standards left out because their cover prints 'DRAFT' under the document number (this corpus takes in-force instruments only; the table does not mark them, and the page says the suite 'replaces legacy IT standards'; owner decision, they are one rerun away if the owner treats the marking as a stale watermark): MD-STD-301-AC Access Control Standard (MD-STD-301-AC-01); MD-STD-302-AT Awareness & Training Standard (MD-STD-302-AT-01); MD-STD-305-CM Configuration Management Standard (MD-STD-305-CM-01); MD-STD-306-CP Contingency Planning Standard (MD-STD-306-CP-01); MD-STD-307-IA Identification & Authentication Standard (MD-STD-307-IA-01); MD-STD-311-PE Physical & Environmental Protection Standard (MD-STD-311-PE-01); MD-STD-312-PL Planning Standard (MD-STD-312-PL-01); MD-STD-315-PT PII and Transparency Standard (MD-STD-315-PT-01); MD-STD-320-SR Supply Chain & Risk Management Standard (MD-STD-320-SR-01); and the 'Cybersecurity & Privacy Glossary' (38 pages, last updated 07/02/2026), a reference list of terms drawn largely from NIST sources, left out as a glossary, not a requirement (owner decision).
- text: |-
    DoIT library, left out as not instruments or out of scope: Accessibility: 'ADA Title II Final Rule Update' (an explanation of the Department of Justice's federal rule and its April 24, 2026 deadline; federal requirement) and the 'Digital Accessibility Initiative' page linked from the policy home (a services page). AI: '2025 AI Roadmap' (the Governor's AI Subcabinet's memorandum 'MEMORANDUM FOR: Governor Wes Moore and the Maryland General Assembly, SUBJECT: 2025 Maryland AI Enablement Strategy & AI Study Roadmap': a strategy document). Cybersecurity suite: 'Cybersecurity and Privacy Policy Suite FAQs' (an FAQ page) and 'The Modernizing Maryland's Security Standards' fact sheet (3-page PDF; explanatory); the two spreadsheets attached to the 2026-03-06 directive ('Non-Compliant Data Sheet' and 'Public-Facing Asset Data Call Sheet', .xlsx: forms or workbooks); the 'Vulnerability Disclosure Program (VDP) Frequently Asked Questions' page (an FAQ for the directive) and the statewide VDP program page (a service description). Transitional list: 'Cybersecurity Incident Reporting Requirements for Local Governments' (binds county governments, local school systems and local health departments), 'Cybersecurity Incident Reporting Requirements for Public Utilities' (binds public service companies, which are private), 'Cybersecurity Legal Requirements for Local Governments (Local Cybersecurity Act of 2022)' and 'Guidelines for Locals to Certify Compliance with State Minimum Cybersecurity Standards' (local governments): the domain file excludes local-government instruments; 'Minimum Security Standards for Connecting to networkMaryland' (it says it applies to each unit of local government and local agencies that use the network and 'any entities connecting to' it; whether that reaches State units is not stated; owner decision); 'State Minimum Cybersecurity Standards Best Practices Guidebook' (says 'This document should not be viewed as an authoritative policy'; guidance for agencies and local jurisdictions; owner decision). Departmental: the 'IT Policy Program' template PDF (a template). MITDP Oversight pages (doit.maryland.gov/MITDP-Oversight): the overview page (criteria, dashboard, deadlines and portfolio list), 'MITDP Oversight Process' (a description of the Oversight Division's monitoring) and 'SDLC Template Library' (a pointer to the Launchpad site) are informational pages; https://doit.maryland.gov/MITDP-Oversight/Pages/default.aspx answered HTTP 401 (sign-in), while the same section's pages above answered 200.
- text: |-
    The State's System Development Life Cycle and MITDP Launchpad (https://maryland-gov.github.io/mitdp/sdlc/ and /launchpad/, 'This content is published by the State of Maryland Department of Information Technology (DoIT)', version 1.3, updated Oct 21, 2026 as printed): a multi-tab framework site with templates, linked from DoIT's SDLC page ('Find the latest version of our SDLC at ...'). The SDLC page is watched; it is not seeded because the Launchpad part is templates and the site is a web application rather than a policy text (owner decision, the SDLC is the standard MITDP policy 20-02 and SF&P 3.5-906 require units to follow).
- text: |-
    Other pages read and not seeded: the DoIT AI services page and ai.maryland.gov pages (portal, state employee guidance; watched where they list instruments), DoIT's Cybersecurity services pages, and the General Assembly's Laws pages. Pages not fetched: DoIT's contracts and procurement pages (IT Contracts & Procurement, DoIT Contracts, Statewide Contracts): procurement and contracting pages, outside the policy library; the DoIT Offices pages. The Maryland Register (proposed regulations) was not read, so a proposed DoIT regulation is not known.
- text: |-
    Fetching notes: every request went through the toolkit Fetcher (the crawler User-Agent; the curl-on-challenge transport was on and no host challenged). doit.maryland.gov, mgaleg.maryland.gov and ai.maryland.gov answered every requested page with 200 except the one 401 above and the 404s for robots.txt and sitemap.xml; robots.txt on doit.maryland.gov and mgaleg.maryland.gov answered 404 (so no robots position), governor.maryland.gov's robots.txt is the standard Drupal list and disallows none of the paths read. DoIT's e-mail addresses print as '[email protected]' because the site obscures them; that is kept as published. PDFs: every seeded PDF was checked page by page for pages with no text layer; none has one (the RSA manual's text layer contains character errors such as 'ofthe', kept as published). The statute text is the 'in effect as of October 1' view; the General Assembly's page says the Session Laws prevail over the Code in a conflict.
- text: |-
    Owner decisions added in review. (1) Two DRAFT calls, review together: the MITDP Standards Manual (md-doit-mitdp-standards-manual) is seeded although its file name ends 'DRAFT-V4' and the PDF metadata Subject reads 'EPMO-MITDP-Standards-Manual-DRAFT-V4' (its pages print no draft marking; DoIT's MITDP Procedures page links it as the manual), while the nine cybersecurity suite standards listed above are left out because their cover prints 'DRAFT'. Either both are in force or neither; the owner decides. (2) COMAR 14.33.02 .08 to .11 (md-comar-14-33): the chapter's Administrative History says .03 to .11 were repealed on March 7, 2022 (49:5 Md. R. 366) and only .03 to .06 adopted and .12 recodified as .07, but the publisher's file and the State Documents contents page (14.33.02/index.html, branch publication/2026-10-26) still print .08 to .11. They are in the document as printed; if the owner agrees they are repealed, the document is cut to .01 to .07 (test first) and regenerated. (3) State Finance and Procurement 3.5-309 (md-sfp-3-5-powers-and-duties-of-the-secretary): the General Assembly's page prints the section twice, 'IN EFFECT' and '// EFFECTIVE JUNE 30, 2031 PER CHAPTERS 436 AND 437 OF 2026 //' with different text; the document reads only the version marked IN EFFECT, the snapshot holds both, and the 2031 version is not mirrored until it is in effect.
