  why_relevant: DoIT's duties to coordinate State government telecommunication equipment, systems and services (3.5-401), networkMaryland (3.5-404), and the annual duty of each unit of State government to report cybersecurity preparedness assessments and an inventory of information systems, data and cloud solutions to the Office of Security Management and the Governor (3.5-405). Section 3.5-406, which sets local government cybersecurity duties and the incident reporting criteria DoIT cites for units of State government, rides along; it is not about State units alone.
