    Administrative rules: 09 NCAC Chapter 06 (Office of Information and Technology Services) at http://reports.oah.state.nc.us/ncac.asp has four subchapters on the OAH page (a watch entry): 06A IT procurement (4 rules, seeded), 06B procurement requests (88 rule headings, seeded), 06C the 911 Board (41 rules: emergency telephone service, scoped out by domain.yml; left out), 06D Government Data Analytics Center (4 rules, seeded). Each seeded document is OAH's one HTML file for the subchapter, as the page serves it; rules marked repealed or expired ride along as published: 06A .0103 (expired May 1, 2015), and 06B .0102, .0203, .0207, .0312, .0403, .0702, .1008 (repealed effective September 1, 2013) and .1303 (repealed effective July 1, 2015). The Title 09 chapters 01 to 05 and 07 are reserved, budget, repealed or expired. Other titles of the Administrative Code were not searched for IT rules (the DIT's rules are in Title 09 chapter 06; the Department of Administration's purchasing rules in Title 01 are general procurement and out). The rules site is HTTP only and has no robots.txt (404). Its pages link nc.gov's Disclaimer & Terms of Use, which grants permission to copy and distribute non-image files, documents and information 'for non-commercial use, provided they are copied and distributed without alteration and appropriately cite to the source'. This is a non-commercial term, recorded for the owner (the playbook asks for it in the PR); the rules are mirrored unaltered with the source cited.
