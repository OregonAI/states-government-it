# North Carolina seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Discovery 2026-11-11 through the toolkit Fetcher: NCDIT's State IT Policies, State IT Standards, Statewide Information
# Security Policies, IT Procurement and AI & Policy pages (and every file they link), the General Assembly's statute
# pages (ncleg.gov), the Office of Administrative Hearings' rules pages (reports.oah.state.nc.us), the Governor's
# executive order list (governor.nc.gov, all 22 pages).
sources:

- id: nc-gs-143b-art-15
  sha256: "02396f79c6b8810b62bdfb538255548dfd52e4147f487aab3b0fbe6241995dd6"
  url: https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/ByArticle/Chapter_143B/Article_15.html
  format: html
  citation: G.S. 143B, Article 15
  title: General Statutes, Chapter 143B, Article 15. Department of Information Technology
  doc_type: statute
  jurisdiction: north-carolina
  issuing_body: North Carolina General Assembly
  tags: [governance, oversight, procurement, funding, cybersecurity, data, digital-services, cloud-resilience]
  recheck: monthly
  why_relevant: 'The enabling statute for the Department of Information Technology and the State Chief Information Officer (State CIO), and the statewide information technology law for executive branch agencies. Its parts, as the page prints them: general provisions, definitions and the Department''s powers, the State CIO''s duties and the consolidation of State information technology (Part 1, 143B-1320 to 143B-1325); planning, funding and reporting, including business continuity, the Information Technology Fund and Internal Service Fund and the Information Technology Strategy Board (Part 2); projects and management, project management standards, standardization and legacy applications (Part 3); procurement of information technology (Part 4, 143B-1350 to 143B-1362); data centers (Part 5); communications and portal services (Part 6); security of information technology: statewide security and privacy standards, State CIO approval of security standards and risk assessments, assessment of agency compliance with cybersecurity standards, and agency cooperation, training, liaisons and county and municipal reporting of cybersecurity incidents (Part 7, 143B-1375 to 143B-1379); the Government Data Analytics Center (Part 8); and, riding along as one page, criminal justice information (Part 9), the 911 Board (Part 10) and the Geographic Information Coordinating Council (Part 11). The page prints repealed sections 143B-1373.2, 143B-1374 and 143B-1405 and 143B-1410 as lines saying so.'

- id: nc-gs-143-art-84
  sha256: "ed5b62ca71c57a307f3b460b61aa722fd612117ff899e263cfd07587570ab362"
  url: https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/ByArticle/Chapter_143/Article_84.html
  format: html
  citation: G.S. 143, Article 84
  title: General Statutes, Chapter 143, Article 84. Various Technology Regulations
  doc_type: statute
  jurisdiction: north-carolina
  issuing_body: North Carolina General Assembly
  tags: [cybersecurity, governance]
  recheck: monthly
  why_relevant: 'Two duties on public agencies about their own networks and systems: G.S. 143-800 bars a State agency or local government entity from paying or communicating with an entity that has encrypted its data and demanded ransom, and requires it to consult the Department of Information Technology under G.S. 143B-1379; G.S. 143-805 bars a public agency from permitting the viewing of pornography on its network or on a device it controls, and requires the annual report to the State CIO that NCDIT''s reporting page collects.'

