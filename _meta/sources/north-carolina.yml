    Pages and areas not read, so no 'none found' is claimed for them: NCDIT's Privacy & Data Protection program pages (/programs/privacy-data-protection and its Fair Information Practice Principles page), Digital Accessibility and Online Safety pages, the Statewide IT Strategic Plan and NCDIT Strategic Plan pages (strategy documents), the Resources Guide, the N.C. IT Application Portfolio, and any NCDIT document library listing outside the pages above. The Department of Administration's and the Office of State Budget and Management's own IT-related pages were not searched. The identity of the instrument text of every PDF and Word file is checked by the ingester against a phrase the file prints.
