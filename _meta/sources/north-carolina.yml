  doc_type: statute
  jurisdiction: north-carolina
  issuing_body: North Carolina General Assembly
  tags: [data, cybersecurity, governance]
  recheck: monthly
  why_relevant: 'The State''s rule on how agencies collect, use, disclose and secure social security numbers and other personal identifying information: no agency of the State or its political subdivisions may collect one without legal authority, use it for another purpose, or "require an individual to transmit the individual''s social security number over the internet, unless the connection is secure or the social security number is encrypted" (subdivision (b)(7)), or require its use to access a website without a password or other authentication device (b)(8); an agency that experiences a security breach must comply with G.S. 75-65 (subsection (c1)). Seeded as one section page under the owner''s decision of 2026-11-13 (a privacy and breach section that binds agencies'' systems and data). Subsections (d) to (h) on recorded documents of registers of deeds and courts ride along in the section as printed.'

