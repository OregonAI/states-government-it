  stub: true
  stub_reason: 'The official PDF (4 pages, 729,504 bytes through the Fetcher, 2026-11-11, produced by Adobe Acrobat Pro DC Paper Capture) is a scan of the signed order carrying an embedded OCR text layer. Measured with pdftotext 24.02 -layout, the body reads cleanly but for a few errors, some in figures and citations: the letterhead is ''~faf£ of ~orf~ Qlarolina'', the statute chapter 116E is printed ''Chapter l 16E'', the year 2011 ''20 11'', ''Department oflnformation Technology'' runs words together, a quotation mark prints as two apostrophes in ''(''NCDIT"), ''06D. 0101'' has a stray space, and the Secretary of State''s attestation is ''all Elaine F. M ;''. The letters ''orth Carolina'' and ''ational Guard'' are intact (the wording of EO 254''s damage does not apply to this file). Committing a layer with errors in a citation and a year would not be the order, and the shared OCR path refuses a PDF that already has a text layer (ocrmypdf PriorOcrFoundError), so it cannot be re-read (ocrmypdf re-run 2026-11-11 on this file: PriorOcrFoundError). OWNER DECISION (borderline): take the layer as served, with these errors noted, as a document. Becomes a document when the shared reader can force OCR on a defective text layer (see the PR body). In force: Section 6 says it remains in effect until December 31, 2029, pursuant to G.S. 147-16.2(a), or until earlier rescinded or replaced.'

