  why_relevant: The Enterprise Project Management Office procedure on the roles, responsibilities and authorities of the Office and other participants in IT project management (document 0300-0300-005-A). The PDF has a text layer, but every "ti" ligature in it maps to no character.
  identity_text: PROJECT MANAGEMENT ROLES
  stub: true
  stub_reason: 'The PDF has a text layer, and it is damaged: pdftotext prints 58 replacement characters on 43 lines where the "ti" ligature glyphs are ("Responsibili?es", "Authori?es", "par?cipants"), measured 2026-11-11 on the 4-page file (document 0300-0300-005-A, revision 1.2). Committing that text would not be the instrument. The shared OCR path refuses a PDF that has a text layer (ocrmypdf exit 6, PriorOcrFoundError: page already has text), so the page images cannot be read either. Becomes a document when the shared reader can force OCR on a page whose text layer is defective (see the PR body) or the agency republishes the file.'

