  why_relevant: 'The procurement-code section on Best Value procurement, whose subsection (c), captioned "Information Technology", governs how the State buys IT: "The acquisition of information technology by the State of North Carolina shall be conducted using the Best Value procurement method", business process reengineering, system design and technology implementation may be combined in one solicitation, and for highly complex acquisitions the procuring agency and "the Division of Purchase and Contracts or the Department of Information Technology, as applicable" may use Solution-Based Solicitation and Government-Vendor Partnership. It is the section G.S. 143B-1350(b) says "shall apply to information technology procurements". Seeded as one section page under the owner''''s decision of 2026-11-13 (an IT purchasing section of a procurement code). Subsections (a) and (b) (definitions and intent) frame subsection (c); subsection (e), on the North Carolina Zoological Park, comes with the section as the General Assembly prints it.'

left_out:
- text: |-
    ---- North Carolina: found and left out (each was seen on an official page on 2026-11-11 and read through the Fetcher; the reason is recorded here)
- text: |-
    State IT Policies page (https://it.nc.gov/resources/state-it-policies), reconciled row by row: 40 document links in its five groups and the Annual Security Training group, plus the related-column links to the AI program page and the IT Procurement Rules page. 30 are seeded as documents (counting the Statewide Acceptable Use Policy and the Corrective Action Plan rows, whose links open a page that offers the files), 2 are stubs (Continuous Monitoring Plan 2016 and Secure Cloud Storage Phase I, scans the two-engine OCR refused), 8 are left out:
     - 'Telephony Policy – Direct Inward Dialed Number' (Enterprise Operations, version 1.0, November 26, 2024): a policy on the assignment of telephone numbers to the state telephone system, which is telecom; domain.yml scopes out 'broadband, 911 and telecom'. It was seeded in the first pass and is removed.
     - OWNER DECISION, recorded for review: 'PTA & PIA User Guide for State Agencies' and 'PTA & PIA User Guide for NCDIT Employees' are listed by the index as policy-library rows and are seeded as procedural documents of the privacy threshold analysis and privacy impact assessment process (the procedure they serve is seeded). They are user guides, so the owner may prefer them left out as guidance.
     - 'Continuous Monitoring Plan - Annual Assessment & Compliance Report Template' (Word, June 2018): a template for the agency's report, a form.
     - 'ESRMO Forensic Request Form' (Word, August 2018): a form.
     - 'Vendor Readiness Assessment Report (VRAR)' (March 2022): the page offers two Word questionnaires (state-hosted and non-state-hosted solutions) that vendors fill in; forms.
     - 'IRS Security Training Confirmation Form for Department of IT Contractors': a one-page signature form, and a federal (IRS) acknowledgement.
     - 'IRS Security Training for Department of IT Employees and Contractors' (https://www.irsvideos.gov/...): a federal IRS video page, not a state instrument; the Fetcher could not connect to it (connection error).
     - 'Statewide Glossary of Information Technology Terms Version Updates' (2 pages): a change list for the glossary, which is seeded.
     - '2025 Statewide Information Security Manual Revisions' (2 pages, March 2025): a table of the revisions made to the manual, which is seeded.
     The index prints a date for most rows; several differ from the date the file prints (the AI Framework row says August 2024 and the file August 2025; the procurement manual row July 2017 and the file 'Revised April 2025'; the Data Classification row June 2025 and the file version 2.0 February 2026). Each document carries what its file prints.
- text: |-
    Statewide Information Security Policies page (https://it.nc.gov/programs/cybersecurity-risk-management/esrmo-initiatives/statewide-information-security-policies): the second official listing of security policies, 27 document links. It holds the 18 SCIO-SEC policies (301 to 318; SCIO-SEC-310 is also a State IT Policies row), the signed Statewide Information Security Manual, and related-content links. All are seeded except: '2025 Statewide Information Security Manual & Policies' (237 pages, 9.9 MB, one compiled book of the manual and the same 18 policies; its pages 1 to 12 have no text layer, and the policies in it are seeded one by one from their own files, so it is a duplicate compilation, left out); the manual revisions table (above); and three related-content links that repeat rows already seeded (Data Classification & Handling Policy at /media/1545, the Acceptable Use Policy page, the Corrective Action Plan page). SCIO-SEC-320 (International Travel) and SCIO-SEC-321-00 (Mobile Device Management) are seeded from the State IT Policies page.
- text: |-
    State IT Standards page (https://it.nc.gov/resources/state-it-standards), reconciled row by row: 53 document links under Domain Management (1), Geographic Information Services (18) and IT Project Management (34), plus Desktop Configuration (no document; the page gives a contact address), Identity & Access Management (text on the page itself) and Vendor Engagement Resources (a link to the vendor engagement page). 12 are seeded as documents, 21 are stubs, 20 are left out:
     - Geographic Information Services, 18 rows, 6 seeded (the water and sewer data content standard of 1997, the parcel data standard of 2016, the state and local metadata profile, the LiDAR and orthophoto base mapping specifications, the GNSS data collection standards): these are the North Carolina data standards and specifications that state agencies work to. 12 left out: 'GIS Mobile Best Practices', 'Oblique Imagery Guidance', 'Assessing Cloud-Based Solutions for Geospatial Data and Mapping', 'Understanding Compression of Geospatial Raster Imagery' and 'GeoMapp Key Findings and Best Practices' (best-practice guides, white papers and a report, not instruments); 'LGC Bylaws' (the bylaws of a council committee); 'NC Parcel Data Standard Revision Summary (2016)' (a one-page summary of changes to a seeded standard); 'GICC-SMAC-State-Local-Gov-Metadata-Profile' (a second file of the seeded metadata profile, the same December 30, 2016 version, differing only in two web addresses); and four federal documents the page republishes: 'Geospatial OneStop Geodetic Control' (an ANSI standard), 'National Digital Elevation Program Guidelines' (USGS), 'North American Vertical Datum of 1988' (a 1993 Federal Register notice), 'U.S. National Grid - Format for Presenting Data' (FGDC-STD-011-2001). OWNER DECISION: whether geospatial data standards belong in a corpus on state IT governance; the six seeded are the ones a state body adopted as binding content standards.
     - IT Project Management, 34 rows. The reference tables of the seeded work instructions number the documents: a number ending '-A' or '-B' is a procedure, '-C' a Quality Work Instruction and '-D' a form or report. 5 Word work instructions are seeded as documents (Project Management Process, Project Initiation, Planning and Design, Execution and Build, Closeout). 21 are stubs, because their links answer HTTP 404 (measured 2026-11-11 through the Fetcher on the /open links the page prints; Project Closeout Report, Project Change Request, Project Security Review and Project Charter were also tried with /download?attachment and without a suffix, same answer; the content was not seen): the Roles, Responsibilities and Authorities procedure (0300-0300-005-A; its PDF's text layer is damaged, see its reason), Project Implementation (0300-0340-005-C), Quality Assurance Process (0800-0800-005-B), Quality Control Process (0810-0810-005-B), and 17 Quality Work Instructions numbered '-C': Project Charter 0300-0310-010-C, Project Financial Assessment 0300-0310-015-C, Project Assessment Type 0300-0310-020-C, Project Manager Assessment 0300-0310-025-C, Cost Estimation 0300-0310-030-C, Benefits Estimation 0300-0310-035-C, Project RFP Review 0300-0320-010-C, Project Contract Award Recommendation 0300-0320-015-C, Project Go-Live Readiness Assessment 0300-0330-010-C, Project Change Request 0300-0360-005-C, Project Weekly Status Report 0300-0370-005-C, Program/Project Review 0300-0375-005-C, Project Architecture Review 0300-0380-005-C, Project Security Review 0300-0381-005-C, Project Peer Review 0300-0382-005-C, Lessons Learned 0300-0390-005-C and Customer Feedback 0300-0395-005-C. 8 are left out as forms, reports and examples (also 404): Quality Control Decision Points (0810-0810-005-D, a form; it was a stub in the first pass and was called a process document in error), Project Change Request Form (0300-0360-005-D in the Project Management Process table, 0300-0360-015-D in the Project Execution and Build table), Project Closeout Report (0300-0350-005-D), Project RFP Review Form (0300-0320-010-D), Project Security Review Form (0300-0381-005-D), Project Weekly Status Report Form (0300-0370-005-D), Project Weekly Status Report Example (no number printed in the seeded instructions; the Closeout instruction prints 0300-0370-005-D for the report itself), and Project Decision Memo (no number: the revision histories of the seeded Project Initiation and Project Management Process say references to the Project Decision Memo were removed from them).
     - Identity & Access Management: the standard (state solutions must use NCID, the state's identity and access management service, and support SAML v2, LDAP and SOAP/WSDL; an exception needs just cause) is a section of the index page itself, which is a watch entry. The seed check rejects an unsliced second entry on the same url and accepts a slice only as an article or part, so it is not a document. SHARED CHANGE NEEDED: a way to seed a section of a page, or an OWNER DECISION to seed it from the page and drop the watch entry.
     - Desktop Configuration: no document (the page says to contact NCDIT Operations Support). Vendor Engagement Resources: see below.
- text: |-
    IT Procurement pages (https://it.nc.gov/resources/statewide-it-procurement and the pages it links), read: the Policies & Procedures page (links the manual, the rules page, the GSA purchasing procedures and the pressing-needs guidance: all four seeded or recorded as rules), the Exceptions page (a process page listing exception Forms A, B and C and a presentation: left out as forms and a presentation, and the guiding instruments it lists are seeded; OWNER DECISION if the page's own statement that an exception must be documented and approved should be a document), the Forms & Templates page (IT Procurement Intake Form, Request for Information, Invitation for Bids/Request for Quote forms, Instructions & Optional Terms for RFP, Request for Proposal form: templates, not instruments), the Resources page (a list of outside links), 'IT Procurement Process Overview' (a 5.5 MB PowerPoint deck), PCORE and Statewide IT Contracts (contract pages, not read to document level).
- text: |-
    Vendor Engagement page (https://it.nc.gov/resources/vendor-engagement) and GovRAMP adoption page (https://it.nc.gov/node/2707): both read. The vendor page's Architecture, Strategy, Security, Data, Digital and NCDIT Services sections link a Visio template, an architecture example, the strategic plans (strategy documents), and policies already seeded (the manual, the data classification policy, the digital accessibility standard); it adds no instrument. The GovRAMP page states the cloud requirements (new contracts with a cloud component from April 1, 2026, full compliance April 1, 2027) and links the policy document, which is seeded as nc-third-party-cloud-service-risk; the page is program prose with webinar videos and is left out.
- text: |-
    Artificial intelligence: no North Carolina statute on state agency use of AI was found. Read in full: chapters 143, 143A, 143B, 147, 132, 75, 114 and 126 of the General Statutes (the General Assembly's by-chapter pages), searched for 'artificial intelligence', 'machine learning' and 'automated decision' with no match; the AI materials are an executive order and NCDIT policies. Not read: the session law list for 2025 and 2026, and the bills a web search surfaced (S 747, H 1161), which were not enacted so far as the results showed (bills not yet enacted are out of scope). AI & Policy page (https://it.nc.gov/programs/ai-policy, a watch entry) and its subpages, all read: 'Principles for Responsible Use of AI' (a web page presenting seven principles and practices; the framework document that contains them is seeded; OWNER DECISION whether the web page, which says agencies 'must' test against the principles, should also be a document), 'Use of Publicly Available Generative AI' (a web page presenting the guidance of the seeded policy), 'AI Framework for Responsible Use' (a link page), 'AI Training' (outside course links), 'AI Inventory & Assessments' (describes the inventory and privacy threshold analysis duties and links an inventory template, a workbook, not fetched), 'AI Terms & Definitions' (a glossary table), 'More Resources' (outside links, NIST and federal), and the 'Statewide AI Strategic Roadmap' (35-page PDF of the AI Leadership Council, a strategy document, left out).
- text: |-
    Statutes not seeded:
     - G.S. 143B Article 15 parts: seeded whole as one page; parts that ride along are Part 6 communications and portal services (including the broadband programs, 143B-1373 to 143B-1374), Part 9 criminal justice information, Part 10 emergency telephone service (the 911 Board, 143B-1400 to 143B-1416), and Part 11 the Geographic Information Coordinating Council, which the domain scopes out (broadband, 911, telecom) or which are marginal. OWNER DECISION on slicing by part (the playbook's section-level slicing question).
     - G.S. 143-48.3 (electronic procurement): SEEDED 2026-11-13 as nc-gs-143-48-3 under the owner's decision of that day (a provision whose own focus is the governance of State IT); the earlier 'left out pending the owner's decision' is superseded.
     - G.S. 143-135.9 (Best Value procurements) was first declined as a general procurement method and is SEEDED as nc-gs-143-135-9 after review: its subsection (c), captioned 'Information Technology', governs the State's acquisition of IT. Read 2026-11-13 in the General Assembly's section pages and declined, because the provision's focus is not IT (the owner's decision admits a section only when it governs State IT): 143-52.1 and 143-53.1 (award recommendations and the bid benchmark for all State purchasing), 143-48(b) (annual reporting of purchases from minority-owned businesses), 66-325 (time and place of sending and receipt of electronic records: the Uniform Electronic Transactions Act between private parties), 143B-10(j)(3) (a department head's internal management policies: general organization law, with no IT subject). G.S. 66-58.5 (validity of electronic signatures between a person and a public agency, or between public agencies) is SEEDED as nc-gs-66-58-5.
     - Read 2026-11-13 in the General Assembly's section pages and not seeded, each for its own measured reason: G.S. 143-129.8 lets 'a political subdivision of the State' contract for information technology by a request-for-proposals procedure, so it binds local governments, which the inclusion test and domain.yml ('local government instruments') exclude; G.S. 143-59.1 (contracts with foreign vendors) is a tax-based vendor-eligibility rule, not a rule on State IT; G.S. 143-162.5 (executive-branch agencies' policies on issuing mobile devices) is not a candidate in docs/research/12, so the owner's decisions of 2026-11-13 do not approve it (listed for the owner).
     - Chapter 143B sections outside Article 15 that mention information technology (143B-139.4D health information technology coordination, 143B-146.13 school technology plan, 143B-1209.32 criminal record checks for the Department of IT, 143B-1301 and 143B-1314): sections of other departments' articles, or personnel; out.
     - G.S. 132-1.10 (social security numbers and other personal identifying information held by public agencies) and 132-6.1 (electronic data-processing and computer databases as public records), in the Public Records Act (chapter 132): a general public records chapter. Decided 2026-11-13 by the owner's rule (a provision is in scope when its own focus is the governance of State IT or data): both are SEEDED, as nc-gs-132-6-1 (the design and maintenance of agency databases and the security features of their systems) and nc-gs-132-1-10 (agencies' collection, use and disclosure of social security numbers and personal identifying information, with the internet and breach duties); the general right of access (G.S. 132-6) is not seeded. G.S. 75-65 (security breach notice, chapter 75, Identity Theft Protection Act): the duty binds a 'business'; out. 
     - G.S. 147-33.72 and following (the former Article 3D, State Information Technology Services, chapter 147): read; its sections are printed as repealed or reserved and its subject moved to 143B Article 15. 147-68.6 and 147-71.2 are in the State Auditor and State Treasurer articles.
     - G.S. 116E (the Education Longitudinal Data System, which the Government Data Analytics Center operates under 143B-1385 and 09 NCAC 06D) was read 2026-11-13 and is SEEDED whole as nc-gs-116e (the System is located administratively within the Department of Information Technology and the Center must adopt a data security and safeguarding plan: data governance under the State IT agency).
     - Statute sources: the General Assembly serves each article as static HTML and PDF (the by-article links its section lists print: /EnactedLegislation/Statutes/HTML/ByArticle/Chapter_143B/Article_15.html); no API was called. The index https://www.ncleg.gov/Laws/GeneralStatutesTOC was read for the chapter list.
- text: |-
    Executive orders: the Governor's list (https://governor.nc.gov/news/executive-orders, a watch entry) was read on all 22 pages: 432 rows, January 6, 2017 to October 22, 2026 (Governors Cooper and Stein; the list holds no order of an earlier governor, and none was sought on it). 241 rows carry a title: read by keyword for technology, cybersecurity, data, information, digital, artificial intelligence, broadband, internet, privacy, security, network, accessibility. 191 rows are titled only by a number ('Executive Order No. N', 2018 to 2024, with emergency, COVID-19 and Spanish-language duplicates among them). The first pass said each of those pages was fetched and searched and four matched; that was not a search of the orders themselves and it missed Executive Order No. 276, whose title contains 'information technology'. Re-done on 2026-11-11 through the Fetcher: for each of the 191 rows the page and the PDF it links ('/open') were fetched (191 PDFs, one per row), and the full text of every PDF was searched for 'information technology', 'cybersecurity', 'artificial intelligence', 'State CIO', 'Department of Information Technology', 'broadband', 'internet', 'data privacy' and 'data security' (the Spanish copies also for 'tecnolog', 'ciberseguridad', 'inteligencia artificial', 'seguridad de informaci' and 'banda ancha'), and the printed title of each order was read. 52 of the PDFs have no usable text layer; for this search only they were read with tesseract (nothing from that reading is committed), and a word broken by a poor embedded OCR layer would be missed. Result: the title of three orders is in scope and in force: Executive Order No. 249, No. 254 (with its Spanish copy) and No. 276 (cited by the seeded High Risk Applications policy as its authority). No title and no text among the 191 cites No. 249, 254 or 276, and none rescinds them. Other orders whose text matched a word, read and left out: No. 298 (Continuity of Operations Planning, January 11, 2024, in effect until rescinded: state agencies' continuity of operations plans, which mention the information technology business continuity plans required by G.S. 143B-1331; an emergency planning order, not IT governance; OWNER DECISION, borderline), No. 118 (unemployment claims by telephone and internet), No. 242 and No. 299 (extending the State Emergency Response Commission, whose members include the State Chief Information Risk Officer), No. 268 (Andrea Harris Equity Task Force; a DIT digital equity office is a member), No. 280 (age-friendly state; broadband outreach for older adults), No. 303 (education and reentry services; DIT assists with reentry tools), No. 326 (surplus property donations after Hurricane Helene; mentions DIT's support role). Seeded: Executive Order No. 24 (artificial intelligence, September 2, 2025; the PDF is an image-only scan, read by OCR). Stubs: Executive Order No. 276 (applications and websites on state information technology, January 12, 2023, in effect unless rescinded or replaced), No. 254 (Joint Cybersecurity Task Force, March 16, 2022, in effect until rescinded) and No. 249 (Longitudinal Data System Governance Board, February 15, 2022, in effect to December 31, 2029; OWNER DECISION, borderline, see its reason): their PDFs are scans carrying an embedded OCR layer with errors, which the shared OCR path refuses (see the stub reasons); EO 254 also has a Spanish-language copy (254 Spanish) as a duplicate row. Left out: Executive Order No. 35 (Commission on Accessibility, March 17, 2026: a commission in the Department of Administration whose four pillars include digital access and which NCDIT supports; OWNER DECISION, borderline), Executive Order No. 91 (2019 Task Force on Connecting North Carolina: broadband, out of scope), Executive Order No. 111 (Advisory Council on Film, Television and Digital Streaming: not IT governance), Executive Order No. 37 (state employee participation in prediction markets: not IT). The list's Termination notices (EO 3, 28 and the numbered ones) concern emergency orders.
    Leads not on the Governor's list, in-force status unconfirmed, not seeded: the seeded Former Email Mailbox Policy cites 'Executive Order 18 - Email Retention and Archiving Policy (July 7, 2009)' and 'Executive Order 12 - Amending the State Email Retention (May 21, 2013)', and the seeded Microsoft 365 policy cites 'McCrory, Pat Executive Order No. 012 Amending the State E-mail Retention and Archiving Policy': orders of Governors Perdue and McCrory on state email retention and archiving, which the list (from 2017) does not carry. An official copy was looked for by a web search (discovery only) and one State Archives address was tried through the Fetcher (HTTP 404); no official copy was found, so neither is seeded and whether either is still in force is unconfirmed. Re-tried 2026-11-13 (the owner having approved records-retention provisions tied to State IT): the State Archives' email page (archives.ncdcr.gov/email-public-record) was fetched through the Fetcher and holds no order text, its policy file (/e-mail-public-record-north-carolina-policy-its-retention-and-disposition/open) answers HTTP 404, and no official copy of Executive Order 18 (2009) or 12 (2013) was found (a web search pointed to a digitized copy at digital.ncdcr.gov, with no address that could be fetched). Executive Order 16 (1993) was not found either, and nothing read shows that it concerns records. They stay unseeded: no official bytes, and whether a later order or statute replaced them is unconfirmed.
