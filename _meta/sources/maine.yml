- id: me-eo-ai-task-force-2024-12
  sha256: "70eeba8ba5e8f362d2607f18f67a8734dee24488b5c0ba9a3999341d00d5d05e"
  url: https://www.maine.gov/governor/mills/index.php/official_documents/executive-orders/2024-12-order-establishing-maine-artificial-intelligence-task
