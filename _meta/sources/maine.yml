  - digital-services
  - data
  - funding
  - governance
  found_via: https://legislature.maine.gov/statutes/1/title1ch0sec0.html (Title 1 contents)
  why_relevant: 'The InforME Public Information Access Act: InforME, the system through which the State electronically provides public information and electronic services, the InforME Board, the network manager''s contract and duties, the responsibilities of State data custodians, financial requirements and the copyright and licensing terms of electronic public information. A digital-government governance and funding statute that binds State agencies as data custodians.'
  jurisdiction: maine
  recheck: monthly

- id: me-mrsa-1-ch14-a
