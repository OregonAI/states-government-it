- id: me-mrsa-10-ch210-b
  sha256: "94258a7b12e72faaf323187bae58b039d18036280032244a2f5e4cb220fd6fce"
  url: https://legislature.maine.gov/statutes/10/title10ch210-B.docx
  format: docx
  citation: 10 M.R.S. ch. 210-B
  title: Notice of Risk to Personal Data
  doc_type: statute
  issuing_body: Maine Legislature, Office of the Revisor of Statutes
  tags:
  - data
  - cybersecurity
  found_via: https://legislature.maine.gov/statutes/10/title10ch0sec0.html (Title 10 contents)
  why_relevant: 'Included for the provision that binds State agencies: the Notice of Risk to Personal Data Act defines ''person'' to include agencies of State Government, municipalities and public universities and colleges, so a State agency that maintains computerized personal information must investigate and give notice of a breach of the security of the system. The chapter binds information brokers and every other person alike, so most of it is not specific to government.'
  jurisdiction: maine
  recheck: monthly

- id: me-mrsa-10-ch1053
