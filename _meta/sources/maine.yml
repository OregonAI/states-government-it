left_out:
- text: '---- Maine: found and left out (each was seen on an official page on 2026-11-12; the reason is recorded here)'
- text: 'Statute copyright: Maine asserts copyright in its codified statutes. Each Revisor chapter file (Word) prints the
    disclaimer the Revisor requires of republishers ("All copyrights and other rights to statutory text are reserved by the
    State of Maine ... current through October 1, 2026 ... not officially certified ..."), and each statute document keeps
    it in its full text. The Revisor also asks to be sent one copy of any statutory publication. OWNER DECISION: whether to
    send that copy.'
- text: 'Statutes seeded as whole chapters, with what rides along: 5 M.R.S. ch. 163 carries subchapters 3 to 5 (geographic
    information systems, Maine Library of Geographic Information, appeals; sections 1991 to 2011) because the Revisor serves
    the chapter as one file; 10 M.R.S. ch. 210-B (breach notice) binds information brokers and every other person, and is
    seeded for the provision that binds State agencies (''person'' includes agencies of State Government). Slicing a chapter
    is not offered by the shared code for Maine; OWNER DECISION if sections should be separated.'
- text: 'AI statutes: none binding State agencies was found. Read: the Title 5 chapter list (chapters 163, 164, 310 Office
    of Policy Innovation and the Future, 337-D) and the chapter files of 5 M.R.S. chs. 6, 158, 163, 164, 310, 1 M.R.S. chs.
    14, 14-A, 14-B, 10 M.R.S. chs. 210-B, 1051, 1053 (none prints ''artificial intelligence'', ''machine learning'' or ''automated
    decision''), and the Title 10 chapter list, which shows the consumer-facing ''Communications with Consumers via Artificial
    Intelligence'' chapter (10 M.R.S. ch. 241, reallocated from ch. 239, sections 1500-DD to 1500-EE; it binds private parties,
    not read in full, out of scope). Search-only leads, not fetched and not in any listing read, so not claimed either way:
    a 2025 bill (HP 558) to add a Title 5 section on State purchase of AI software, and a 2026 public law on AI in mental
    health services (not government use). State-agency AI is governed here by the GenAI Policy (seeded) and the AI Task Force
    order (seeded).'
- text: 'Rules: MaineIT has no administrative rules. The Administrative Procedure Act office''s DAFS rule page lists umbrellas
    18-119, 18-125, 18-127, 18-134, 18-185, 18-352, 18-364, 18-389, 18-553, 18-554, 18-674 and 18-691 and none is for the
    Office of Information Technology (5 M.R.S. 2030-C only says the Department ''may adopt rules''). Read for IT rules: the
    DAFS, Secretary of State, Executive Department and Independent Agencies rule pages (the last two searched for IT terms
    and none found). Seeded: 29-250 ch. 950 (Digital Signatures). Left out: 29-255 (Maine State Archives) chs. 1 ''State and
    Local Government Agency Records Programs'', 2 ''State Records Center Facilities and Services'' and 3 ''Imaging State Records'':
    records-management rules, the same category as 5 M.R.S. ch. 6 below (OWNER DECISION). The Secretary of State''s other
    29-250 chapters (Bureau of Motor Vehicles chs. 1 to 190, including ch. 12 ''Sale of Records and Databases Related to Driver
    History'' and ch. 101 ''Electronic Lien Titling Program''; Bureau of Corporations, Elections and Commissions chs. 200
    to 520; ch. 900 Address Confidentiality) and 29-250 ch. 700 (notaries) and ch. 800 ''Procedures for the Electronic Filing
    of Rules'': motor-vehicle, corporate, election, notarial and rulemaking-procedure rules, not IT governance. 18-127 ch.
    158 ''Standards for Digital Parcel Maps'' (Maine Library of Geographic Information Board): a geospatial data standard
    for municipal parcel maps; geographic information is outside this corpus''s IT-governance scope unless the owner decides
    otherwise (OWNER DECISION). 90-590 (Maine Health Data Organization) rules: health-care data reporting by providers, not
    State IT.'
- text: 'Statute chapters found and left out: 5 M.R.S. ch. 6 (State Archivist; 5 M.R.S. 95-C includes electronic records management
    and records retention schedules) and 1 M.R.S. ch. 13 (Freedom of Access Act, public records): records and public-access
    law whose subject is records, not IT as a government function; same treatment as other states'' records chapters (OWNER
    DECISION). 10 M.R.S. ch. 1051 (Uniform Electronic Transactions Act): applies to private and governmental transactions
    alike and is mostly private-law; sections 9418 and 9419 on State agencies'' electronic records were not separated (OWNER
    DECISION). 5 M.R.S. ch. 155 (Purchases) and its section 1825-B: procurement code, a non-IT chapter (playbook: left out).
    5 M.R.S. ch. 337-D (Profiling and Data Collection) sits in the Human Rights part and was judged from its title only (not
    fetched). 10 M.R.S. ch. 1055 (Marketing and Data Collection Practices), ch. 208-A (Protection of Social Security Numbers):
    judged private-sector from their titles in the Title 10 contents (not fetched). 37-B M.R.S. 703(1-A), the definition of
    ''cyberattack'' that 5 M.R.S. 1972 cites, sits in the Emergency Management Agency chapter (not fetched; the whole chapter
    is out of scope).'
- text: 'Executive orders: read the Governor''s Official Documents page (Governor Mills; one page, oldest order January 3,
    2019, newest June 15, 2026; the titles of every order were searched for IT, data, cyber, digital, computer, internet,
    AI and electronic terms, and three matched). Seeded: Executive Order 25 FY 20/21 (Cybersecurity Advisory Council) and
    the December 20, 2024 AI Task Force order. Left out: Executive Order 5 FY 25/26 ''An Order Establishing the Maine Data
    Center Advisory Council'' (April 29, 2026): data-centre siting and economic policy, not government IT. The other orders
    of FY 19/20 to FY 25/26 concern emergencies, COVID-19, licensing, boards, buildings and energy; none is on State IT, data
    or AI (titles read in the list, the pages not opened). Executive Orders 2014-0003 and 2016-006, which Executive Order
    25 FY 20/21 says it repeals and supersedes, are not in any list read and not seeded. The Official Documents page covers
    Governor Mills only: lists of earlier governors'' orders were not found, so ''none found'' is claimed only for Governor
    Mills''s list. The Task Force''s reports (a draft final report and prep memos on the Future office''s site, found by search
    only and not fetched) would be reports, not instruments.'
- text: 'MaineIT directives: the Prohibited Technologies page cites ''OIT Cybersecurity Directive 2024-02''. No file of that
    directive and no list of directives was found on the MaineIT pages read (home, Policies & Standards, Architecture and
    Policy, Security and Risk Management service page, sitemap). The page itself is seeded as the instrument. The page''s
    own link target for 5 M.R.S. ch. 164 is the Public Law (PL 2023, c. 681, a Legislature document), not seeded: the chapter
    is.'
- text: 'Bureau of Human Resources Policy and Practices Manual (https://www.maine.gov/bhr/state-hr-professionals/rules-policies/policy-practices-manual),
    read row by row on 2026-11-12: two rows are statewide IT instruments and are seeded (6.7 Personal Use of Social Media; Policy and
    Work Rules Concerning the Use of State Information and Technology (I.T.) Equipment and Resources, DAFSITPolicy.pdf). Every other
    row (equal opportunity and accommodation, hiring and certification, 5.8 Human Resource Security Protocols, ethics and gifts,
    performance, pay, leave, benefits, labor relations, drug and alcohol policies) is a personnel policy, not IT, and is left out.'
- text: 'MaineIT policy library, row by row (69 rows, no status column, every row current): 66 PDFs are documents; 2 are stubs
    (Application Deployment Certification Templates, a blank sign-off form; Microsoft Power Platform: Escalation Path, a one-page
    flowchart); 1 row (''Social Media for Personal Use Policy'') links the Bureau of Human Resources page, seeded as a web-page
    document. Seeded beyond the table: General Architecture Principles (linked from the Architecture and Policy page) and
    the Prohibited Technologies and Digital Signatures pages (navigation links under Policies & Standards). Every MaineIT PDF prints
    a revision date in a form the hook reads (Latest Revision Date, Last Revision Date, Latest Revision, Current Revision Date (Version n), or
    a line REVISED <month year>), kept as printed as the document''s source_version. The web pages, the rule, the executive orders and the Bureau of Human Resources work rules print no revision date in
    that form, so their source_version is empty (the work rules print an effective date, March 2, 2015, which is the effective_date). The table''s ''Date Last Updated'' (year/month) agrees
    with the printed ''Latest Revision Date'' on 54 of the 58 rows that print one in that form and differs on 4: Application
    Deployment Certification Guidelines (table 2025/09, file ''September 4, 2026''), Data Classification Policy (2026/06,
    ''April 13, 2026''), Network Device Management Policy (2026/08, ''21 April 2026'') and System and Services Acquisition
    Policy (2026/05, ''December 12, 2025''). The Fetcher got the file the link serves; no row is withdrawn by the difference.'
- text: 'MaineIT pages and files found and left out: ''Request for Product Acceptance'' (request-product-acceptance.pdf, linked
    from Digital Signatures): a form. Accessibility page (https://www.maine.gov/oit/accessibility): explains the Digital Accessibility
    Policy (seeded) and links resources; its PDF digital-accessibility-policy.pdf is byte-identical to the library''s DigitalAccessibilityPolicy.pdf
    (same SHA-256 of the bytes fetched), so it is one document. Service Rates (FY24-25, FY26-27, FY28-29 .xlsx), ''MaineIT
    Billing'', ''Standard Service Level Agreements for Core Technology Services'' and the Service Catalog pages: rate workbooks
    and service descriptions, not instruments. Customer Service Portal pages: internal. PL 2023, c. 681 PDF: the session-law
    text of the statute seeded as 5 M.R.S. ch. 164.'
- text: 'Fetch notes: legislature.maine.gov and maine.gov answered the Fetcher (HTTP 200) for every URL used; the rules site
    (www.maine.gov/sos/cec/rules/rules.html) that the issue lead said returned 403 also answered 200 (98,076 bytes) and the
    agency rule pages under /sos/rulemaking/agency-rules/ were used instead. Whole-chapter HTML pages (title5ch163sec0.html)
    were read for contents and as the ''found via'' record; the Word chapter files are the text of record because the Revisor
    offers them and pandoc reads them. The Executive Order 25 FY 20/21 PDF is a scan carrying an embedded recognised-text
    layer; the committed text is that layer as the PDF holds it, including its recognition slips (for example ''Govermnent''
    for ''Government'', ''Chieflnformation Officer'', a stray symbol line beside the signature), which are kept, not corrected
    (never hand-edit document text). Page 45 of the Telecommunications Facilities & Wiring Specifications PDF is blank (rendered
    and looked at), so it is listed as no_text_pages.'

