  title: An Order Establishing the Maine Artificial Intelligence Task Force
  doc_type: executive_order
  issuing_body: Office of the Governor
  tags:
  - ai
  - governance
  identity_text: An Order Establishing the Maine Artificial Intelligence Task Force
  found_via: https://www.maine.gov/governor/mills/official_documents (FY 24/25 list, 'December 20, 2024'); the order page itself prints no date or number
  why_relevant: 'Creates the Maine AI Task Force, charged with recommending how to prepare the economy and workforce, how to protect residents from harmful uses of AI, and the most promising uses of AI by State agencies, quasi-State agencies and other public entities; the Chief Information Officer and the OIT AI Center of Excellence sit on its Technical Advisory Committee and OIT staffs it. Directed to report by October 31, 2025; the order has no end date. The only Governor''s order found on AI. OWNER DECISION: the order creates a study body whose report is delivered, so whether it is still ''in force'' is a judgment (it was not rescinded in the list read).'
  jurisdiction: maine
  recheck: monthly

