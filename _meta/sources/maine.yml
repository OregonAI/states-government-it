  title: Notice of Information Practices
  doc_type: statute
  issuing_body: Maine Legislature, Office of the Revisor of Statutes
  tags:
  - data
  - digital-services
  found_via: https://legislature.maine.gov/statutes/1/title1ch0sec0.html (Title 1 contents)
  why_relevant: Every public entity (the Legislature, the Judicial Department, State agencies and authorities, the university and community college systems, and local bodies) that has a publicly accessible Internet site must develop and post a policy on its practices relating to personal information collected on the site.
