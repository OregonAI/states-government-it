- id: me-mrsa-1-ch14-b
  sha256: "03ecec761e784817ebd20e68097f6f714efc3faa2ff57d92b1cd7b0de949aa98"
  url: https://legislature.maine.gov/statutes/1/title1ch14-B.docx
  format: docx
