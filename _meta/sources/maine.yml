# Maine seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Discovery 2026-11-12 through the toolkit Fetcher: the MaineIT Policies & Standards library, Architecture and Policy, Prohibited
# Technologies and Digital Signatures pages (maine.gov/oit), the Revisor's chapter files (legislature.maine.gov/statutes, Word),
# the Governor's Official Documents page, the Secretary of State's agency rule pages. Statutes are whole-chapter Word files: the
# Legislature asserts copyright in the codified statutes and asks republishers to keep its disclaimer, which each file prints
# and the document keeps (see left_out, first item). Statute and rule text is a Word file read by pandoc.
sources:

- id: me-mrsa-5-ch163
  sha256: "71dbd20aaea32183be0b4ee1136c87e92cf332f25fd3dcaac400c1e51d8a099f"
  url: https://legislature.maine.gov/statutes/5/title5ch163.docx
  format: docx
  citation: 5 M.R.S. ch. 163
  title: Office of Information Technology
  doc_type: statute
  issuing_body: Maine Legislature, Office of the Revisor of Statutes
  tags:
  - governance
  - oversight
  - funding
  - cybersecurity
  - data
  - procurement
  found_via: https://legislature.maine.gov/statutes/5/title5ch0sec0.html (Title 5 contents), https://legislature.maine.gov/statutes/5/title5ch163sec0.html
  why_relevant: 'The enabling statute for the Office of Information Technology and the Chief Information Officer: the Commissioner of Administrative and Financial Services appoints the CIO, who directs IT policy making, planning, architecture and standardization and the provision of IT and enterprise services across State Government (5 M.R.S. 1971-1972); the CIO sets IT policies and standards, including privacy, security and accessibility standards, approves agency IT plans and monitors compliance with statewide standards and architecture (1973); develops written standards for data processing and telecommunications, now including information security and cybersecurity (1974); an agency that buys data processing equipment, software or services without approval, or fails to follow the standards, may not buy until it complies, and the CIO may procure cybersecurity services on a retainer (1975, as amended by PL 2025, c. 698); confidentiality of vendor trade secrets and public access to documents on State computers (1976); the Office''s mission, services, internal service funds, responses to public records requests and fingerprint-based criminal history checks of the Office''s employees and its contractors'' employees (1981-1986). The file also carries subchapters 3 to 5 (geographic information systems, the Maine Library of Geographic Information and appeals, 5 M.R.S. 1991-2011), which ride along and are not separated.'
  jurisdiction: maine
  recheck: monthly

- id: me-mrsa-5-ch164
  sha256: "0c63a31f19c6d610b8536d2ac6779adf21cde810d193e91dc092020dc9430df9"
  url: https://legislature.maine.gov/statutes/5/title5ch164.docx
  format: docx
  citation: 5 M.R.S. ch. 164
  title: Cybersecurity and Protection of Critical Infrastructure
  doc_type: statute
  issuing_body: Maine Legislature, Office of the Revisor of Statutes
  tags:
  - cybersecurity
  - procurement
  - governance
  found_via: https://legislature.maine.gov/statutes/5/title5ch0sec0.html (Title 5 contents), https://legislature.maine.gov/statutes/5/title5ch163sec0.html, https://www.maine.gov/oit/prohibited-technologies (names PL 2023, c. 681)
  why_relevant: 'Enacted by PL 2023, c. 681 (An Act to Increase Cybersecurity in Maine): the Chief Information Officer maintains lists of prohibited companies, including foreign adversary business entities, and of prohibited information and communications technology and services; a State agency may not contract with a listed company or use, obtain or purchase listed technology unless the CIO waives the prohibition; local governmental entities, the judicial branch and the legislative branch are covered in their own sections; a bidder on a State contract certifies it is not a foreign adversary business entity; contracts with such entities and unwaived contracts with listed companies are void; the Department may adopt routine technical rules. The statute behind MaineIT''s Prohibited Technologies list.'
  jurisdiction: maine
  recheck: monthly

- id: me-mrsa-1-ch14
