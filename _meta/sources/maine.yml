  title: Data Governance Program
  doc_type: statute
  issuing_body: Maine Legislature, Office of the Revisor of Statutes
  tags:
  - data
  - governance
  found_via: https://legislature.maine.gov/statutes/1/title1ch0sec0.html (Title 1 contents)
  why_relevant: 'The Secretary of State and the Commissioner of Administrative and Financial Services establish a State data governance program: data project priorities, privacy compliance, data structure and data-sharing policies, records management and adherence to the State Archivist''s retention schedules, with quarterly consultations and an annual report to the Legislature.'
  jurisdiction: maine
