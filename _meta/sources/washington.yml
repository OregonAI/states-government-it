# Found and left out: what was seen on an official page and not seeded, with the reason.
left_out:
- text: '---- Washington: found and left out (each was seen on an official page on 2026-11-10; the reason is recorded here)'
- text: |-
    Rules: WaTech has no IT rules. Title 143 WAC (Consolidated Technology Services, the agency's former name)
    holds two chapters, 143-06 (public records procedure) and 143-10 (SEPA guidelines), neither IT governance
    (https://app.leg.wa.gov/wac/default.aspx?cite=143, watched below). RCW 43.105.057 only says the agency
    "shall adopt rules as necessary". WaTech sets IT requirements by policy and standard, not by WAC. The
    official bulk route for rules is the open directory https://lawfilesext.leg.wa.gov/law/WAC/; it was not needed.
     - Chapter 434-662 WAC (Secretary of State, preservation of electronic public records): no longer left out.
       Owner decision 1 of 2026-11-13 takes in provisions whose own focus is governance of state IT, and every
       section of this chapter is about electronic records; read in full on 2026-11-13 and seeded as wa-wac-434-662.
     - Records rules left out on 2026-11-13 after reading them (owner decision 1 tests the provision's own focus):
       chapter 434-615 WAC (custody of public records: 434-615-010, -020 and -030 govern ownership, custody and
       transfer of public records of every medium, no word of IT) and chapter 434-660 WAC (one section, 434-660-010
       'Statutory authority': the state archivist shall adopt standards for the accuracy and durability of
       'photographic, optical, electronic or other images' of public records; a statement of rulemaking authority
       over image media, not a rule on state IT).
     - WAC 292-110-010 (Executive Ethics Board, 'Use of state resources'), left out 2026-11-13: it governs the use of
       all state resources ('funds, facilities, tools, property, and their time'); only subsections (3)(a)(v) and (4)
       mention information systems and electronic records. A general provision that applies to IT along with
       everything else, so owner decision 1 does not reach it.
- text: |-
    Policy library items not seeded:
     - EA - 183.20.10 'Identity Management User Authentication Standard (Rescinded 8/13/2026)': the library
       page itself titles it rescinded, so it is not in force. Its page is still listed; the watch entries
       above will show it leaving.
     - Coversheets ('Policy Background' review notes for about 30 items, e.g. DATA-04_AIPolicy_Coversheet.pdf):
       rationale and due-diligence notes attached to a policy page, not the policy.
     - Other attachments on policy pages: spreadsheets (App & Infrastructure Inventory Template, Policy
       Rename Crosswalk), the Waiver Request for O365 and EAD (.docx), ADS definition guidance (MGMT-01-01-S),
       the DSHS/WaTech Innovation Exemption Justification (EA-03), the Admin_Financial_Criteria PDF (EA-122),
       Investment-Plan-FAQ and a .docx appendix (PM-01-01-PR), 502g.pdf (SEC-12) and a visual crosswalk
       (ServiceCatalogConsolidation.pdf, linked from every page). Forms, templates and supporting material.
     - 'Definition of Terms Used in Policies and Reports' (https://watech.wa.gov/policies/definition-terms-used-policies-and-reports):
       one HTML page of definitions, each tied to the policies that use it (for example 'Access ... Sources:
       SEC-04-03-S'), linked from every library listing page under the type 'Policy'. Not seeded: the
       ingester has no to_text for WaTech HTML pages, and the 109 items counted in the watch entries below are the
       listing table only. OWNER DECISION whether it enters (it would need a WaTech HTML cleanup first).
     - EA-01-01-G and DATA-01-03-G link byte-identical PDFs (the joint State Archives records and cloud
       storage guidelines, February 2019) under two library numbers, so two documents carry one text.
- text: |-
    AI material not seeded (WaTech AI Resources page): the State of Washington Generative AI Report (Sept 2024),
    the AI Task Force reports (Dec 2024, Dec 2025), the OFM workforce-impact report and the 2021 ADS Workgroup
    report and charter are reports, not instruments. The DES Washington State Procurement Manual (a manual,
    large, DES-owned) is left out as Oregon left out its procurement statutes. OWNER DECISION.
- text: |-
    Executive orders, in scope but not seeded (read in full on 2026-11-10; all are Active):
     - 16-07 'Building a Modern Work Environment': telework and mobile workforce; WaTech is told to provide shared
       technology services, but the order is about HR and workplace strategy. Borderline. OWNER DECISION.
     - 25-06 'Transforming Customer Experience and Service Delivery in State Government Operations' (09/03/2025,
       Active on the Governor's list): re-read in full on 2026-11-13 and still left out. Its purpose clause
       (section 1) is 'to improve customer experience throughout state government'; it creates the Your Washington
       office and customer-experience reporting duties for cabinet agencies. Its IT content (section 5: WA.gov as a
       central portal with WaTech, 'one front door', a data-sharing presumption in 5(c)) is a priority-action list
       inside a service-delivery order, and it directs no IT purchase, approval, funding, security or oversight.
       Owner decision 1 asks whether the provision's own focus is the governance of state IT; here it is not.
     - 25-05 'Data Center Workgroup': about data centers as an industry and their electricity use (Department
       of Revenue leads), not state IT. 16-06 'State Agency Enterprise Risk Management': mentions information
       systems once; general risk management.
     - 26-05 'Strengthening Fraud Prevention and Accountability for Public Funds' (10/27/2026, Active):
       fraud prevention for public funds, with one data-analytics duty for WaTech (section e: WaTech, DES and
       OFM 'shall evaluate opportunities to use existing data and analytics capabilities to identify
       suspicious payment trends while protecting confidential and legally restricted information').
       Borderline. OWNER DECISION.
     - Of the 122 Active orders listed, these are the only ones whose title or text concern state IT, data or
       AI. Orders were screened by title; the ten above that could be IT were read.
- text: |-
    Statutes not seeded:
     - Chapter 39.26 RCW (state procurement) apart from sections 39.26.340 and 39.26.235 (seeded: owner decision 1
       of 2026-11-13 takes in IT sections of a procurement code, and the site serves one page per section), and the
       other procurement chapters. Sections of 39.26 read on 2026-11-13 and left out because their focus is not IT:
       39.26.100 (exemptions: a list of unrelated exemptions of which subsections (2) data center and (7) small IT
       purchases are two), 39.26.090 (director's duties; subsection (3) on IT purchasing processes is one of many)
       and 39.26.265 (a preference for electronic products meeting environmental standards: environmental policy).
     - RCW 42.56.420 (public records exemptions for security information) and the rest of chapter 42.56:
       cited by WaTech policy SEC-01; the IT-specific part is a few subsections of a general exemption section.
     - RCW 39.24.240 is a misprint of RCW 39.34.240 in policies DATA-03 and DATA-04 (app.leg.wa.gov returns
       a page with no section content for cite=39.24.240). The correct section, 39.34.240 'Data requests -
       When written agreement required', is seeded above.
     - Chapter 40.14 RCW (records retention): general records law, not among the candidates the owner's decision of
       2026-11-13 was applied to; left out. Chapter 43.88 RCW (budget) apart from section 43.88.092 (seeded: its own
       subject is state IT spending, owner decision 1 of 2026-11-13): general budgeting.
     - Chapter 19.360 RCW (electronic signatures, state and local agencies), cited by SEC-11-01-G as 'RCW 19.360.020(4)':
       every section (19.360.010 to 19.360.060) is shown on the Legislature's chapter page as 'Repealed by 2020 c 57
       § 90'. Not in force, so not seeded (read 2026-11-13). The citing policy prints a repealed citation.
       The in-force successor is the Uniform Electronic Transactions Act of the same act (2020 c 57, chapter 1.80 RCW):
       RCW 1.80.160 (2020 c 57 § 17, 'Creation and retention of electronic records ... by governmental agencies') and
       RCW 1.80.170 (2020 c 57 § 18, 'Acceptance and distribution of electronic records by governmental agencies': an
       agency decides whether to use electronic signatures and may specify formats, systems and security controls).
       Both read in force through the Fetcher 2026-11-13. They are not listed candidates and are not seeded; they
       are the agency-addressed electronic-records and e-signature sections SEC-11-01-G relies on today, so an owner
       question (see the report).
     - RCW 43.386.070 and 43.386.080 (facial recognition, law enforcement and courts), left out 2026-11-13 (chapter
       43.386 RCW is served by the site one page per section, so the chapter is not taken whole): 070(1) discloses
       use to criminal defendants and 070(3) has judges report surveillance warrants to the administrator for the
       courts; 080(4)-(7) bind law enforcement on body worn cameras, probable cause, sketches and image
       manipulation. The focus is law enforcement and the courts, not state IT governance (domain.yml out_of_scope:
       law-enforcement technology). Borderline, named for the owner: 070(2) (records of use kept sufficient for
       public auditing) and 080(1)-(3) (warrant, exigency and viewpoint limits on any agency's use of the service).
       RCW 43.386.900 (findings) and 43.386.901 (effective date, 2021-07-01): context only, not governance.
     - RCW 38.52.030 and 38.52.040 (emergency management; 38.52.040(4) creates the cybersecurity advisory
       committee), left out 2026-11-13: the sections are about the emergency management council and director, and
       the committee advises 'industry and public sectors across all critical infrastructure sectors', so the focus
       is not the governance of state government IT. The held chapter 43.105 carries the WaTech side of that
       collaboration.
     - The 2024 act that created the Washington State AI Task Force (E2SSB 5838): a temporary study body
       referred to by search results; text not read, and it is not codified in the RCW chapters seeded here.
     - 2026 c 9 (HB 2606, Office of Privacy and Data Protection performance measures and duties; effective
       2026-06-11): already codified, its text is inside the RCW 43.105 document (43.105.369).
     - Bills reported by search as pending or unconfirmed (SB 719 automated decision systems inventory, HB 2667,
       SB 6284): not found on the legislature's site tonight (the bill page for SB 719 returned 'invalid bill
       request'); bills not enacted are out of scope. UNVERIFIED whether any was enacted.
