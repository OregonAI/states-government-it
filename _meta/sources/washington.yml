sources:

  # ======================================================================================
  # WASHINGTON (issue #5). Discovery tonight: WaTech policy library (watech.wa.gov/policies, 109 items),
  # Governor's Active executive order list (122 orders), RCW and WAC at app.leg.wa.gov, WaTech AI Resources page.
  # ======================================================================================

  # ---- Statutes: Revised Code of Washington (the app.leg.wa.gov page serves a whole chapter; sections are one page each)
  - id: wa-rcw-43-105
    sha256: "1287417df6e8a2929e07193d322e2fc0b3a5d6f3a19fb255fbdc3d0f57b6104a"
    url: "https://app.leg.wa.gov/rcw/default.aspx?cite=43.105&full=true"
    format: html
    citation: "RCW chapter 43.105"
    title: "Chapter 43.105 RCW - Washington Technology Solutions"
    doc_type: statute
    jurisdiction: washington
    issuing_body: Washington State Legislature; published by the Statute Law Committee and Code Reviser
    tags: [governance, oversight, funding, procurement, cybersecurity, data, ai, digital-services, cloud-resilience]
    recheck: monthly
    why_relevant: "The enabling statute for Washington Technology Solutions (WaTech) and its director, the State CIO (43.105.006-43.105.025, powers and duties 43.105.052-43.105.060, IT governance 43.105.054), the Office of Cybersecurity and the State CISO (43.105.450-43.105.470), the Office of Privacy and Data Protection including review of AI projects (43.105.369), the Technology Services Board (43.105.285-43.105.291), the statewide IT portfolio and major-project oversight (43.105.220-43.105.265), cloud and state data center use (43.105.375), and WaTech as central service provider and its revolving account (43.105.342, 43.105.385). The page serves the whole chapter, so the electronic public records access sections (43.105.351-43.105.359) and the K-20 network section (43.105.825, telecom) come with it."
  - id: wa-rcw-40-26
    sha256: "59359a6263f03218d2455c62b1ea29a92f1f54488d7edc5515bdd7cbca973884"
    url: "https://app.leg.wa.gov/rcw/default.aspx?cite=40.26&full=true"
    format: html
    citation: "RCW chapter 40.26"
    title: "Chapter 40.26 RCW - Biometric identifiers"
    doc_type: statute
    jurisdiction: washington
    issuing_body: Washington State Legislature; published by the Statute Law Committee and Code Reviser
    tags: [data]
    recheck: monthly
    why_relevant: "Governs how state agencies collect, use, store and retain biometric identifiers (notice and consent, no sale, retention limits). Government-held data; cited by WaTech policy DATA-03."
  - id: wa-rcw-42-56-590
    sha256: "f903d0ddb2745afec078eef42153db70a207242274995cd20a6dde76286dbbe5"
    url: "https://app.leg.wa.gov/rcw/default.aspx?cite=42.56.590"
    format: html
    citation: "RCW 42.56.590"
    title: "RCW 42.56.590 - Personal information - Notice of security breaches"
    doc_type: statute
    jurisdiction: washington
    issuing_body: Washington State Legislature; published by the Statute Law Committee and Code Reviser
    tags: [data, cybersecurity]
    recheck: monthly
    why_relevant: "The breach-notification duty of state and local agencies that own or license personal information (the agency-applicable provision; the rest of chapter 42.56, the Public Records Act, is out of scope). One section."
  - id: wa-rcw-39-26-340
    sha256: "b08c969fa896e9a26e6145fff8cafd4702b49f3c0986323c80455426c69a2a55"
    url: "https://app.leg.wa.gov/rcw/default.aspx?cite=39.26.340"
    format: html
    citation: "RCW 39.26.340"
    title: "RCW 39.26.340 - Data-sharing agreements - When required"
    doc_type: statute
    jurisdiction: washington
    issuing_body: Washington State Legislature; published by the Statute Law Committee and Code Reviser
    tags: [data, procurement, cybersecurity]
    recheck: monthly
    why_relevant: "Requires a written data-sharing agreement before an agency shares category 3 or higher data with a contractor, conforming to the data-sharing policies the Office of Cybersecurity sets under RCW 43.105.054. Cited by WaTech policies DATA-03 and DATA-04. One section of the state procurement chapter (the rest is left out, see the left-out notes)."
  - id: wa-rcw-39-34-240
    sha256: "b415faab8900ac63aad2f5eeaf019339d40a8a0f6b63c6584a1de0dac781ebbe"
    url: "https://app.leg.wa.gov/rcw/default.aspx?cite=39.34.240"
    format: html
    citation: "RCW 39.34.240"
    title: "RCW 39.34.240 - Data requests - When written agreement required"
    doc_type: statute
    jurisdiction: washington
    issuing_body: Washington State Legislature; published by the Statute Law Committee and Code Reviser
    tags: [data, cybersecurity]
    recheck: monthly
    why_relevant: "Requires a written agreement, conforming to the policies of the Office of Cybersecurity, before one public agency requests category 3 or higher data from another. The sibling of RCW 39.26.340 (agency to contractor), from the same act (2021 c 291). Cited by WaTech policies DATA-03 and POL-01. One section of the interlocal cooperation chapter."
  - id: wa-rcw-43-386-010
    sha256: "5014a1cb0f6c291f968e37ce2701e72011cdea5eed786e3f0107ba944840a974"
    url: "https://app.leg.wa.gov/rcw/default.aspx?cite=43.386.010"
    format: html
    citation: "RCW 43.386.010"
    title: "RCW 43.386.010 - Definitions."
    doc_type: statute
    jurisdiction: washington
    issuing_body: Washington State Legislature; published by the Statute Law Committee and Code Reviser
    tags: [ai, data]
    recheck: monthly
    why_relevant: "Definitions, including that for a state agency the 'legislative authority' is the technology services board: \"For a state agency, 'legislative authority' refers to the technology services board created in RCW 43.105.285\" (subsection 6). Fixes what a facial recognition service is when a state or local government agency uses it. One section of chapter 43.386 RCW (facial recognition), seeded as a section page under owner decision 1 of 2026-11-13; the rest of the chapter is left out, see the left-out notes. Cited by WaTech policy DATA-03."
  - id: wa-rcw-43-386-020
    sha256: "2759d6956bda5c3056bae8b2b1bdec79d4b8886a8847b4c6e15d7dfe8212731b"
    url: "https://app.leg.wa.gov/rcw/default.aspx?cite=43.386.020"
    format: html
    citation: "RCW 43.386.020"
    title: "RCW 43.386.020 - Notice of intent—Accountability report."
    doc_type: statute
    jurisdiction: washington
    issuing_body: Washington State Legislature; published by the Statute Law Committee and Code Reviser
    tags: [ai, data]
    recheck: monthly
    why_relevant: "A state agency \"using or intending to develop, procure, or use a facial recognition service must file with a legislative authority a notice of intent\" and \"must produce an accountability report\" before developing, procuring or using it, covering data security, retention, testing, training and breach notification; the report is public and updated every two years; an agency procuring the service \"must require vendors to disclose any complaints or reports of bias\". One section of chapter 43.386 RCW (facial recognition), seeded as a section page under owner decision 1 of 2026-11-13; the rest of the chapter is left out, see the left-out notes. Cited by WaTech policy DATA-03."
  - id: wa-rcw-43-386-030
    sha256: "b2b76fa38fbdf02d25846bbd44e55d6c526bb6310bf1ee54efe68d8e252c8bdc"
    url: "https://app.leg.wa.gov/rcw/default.aspx?cite=43.386.030"
    format: html
    citation: "RCW 43.386.030"
    title: "RCW 43.386.030 - Meaningful human review—When required."
    doc_type: statute
    jurisdiction: washington
    issuing_body: Washington State Legislature; published by the Statute Law Committee and Code Reviser
    tags: [ai, data]
    recheck: monthly
    why_relevant: "An agency \"using a facial recognition service to make decisions that produce legal effects concerning individuals or similarly significant effects concerning individuals must ensure that those decisions are subject to meaningful human review\": oversight of an AI technology's output in a state agency's decisions. One section of chapter 43.386 RCW (facial recognition), seeded as a section page under owner decision 1 of 2026-11-13; the rest of the chapter is left out, see the left-out notes. Cited by WaTech policy DATA-03."
  - id: wa-rcw-43-386-040
    sha256: "e40a34a078ddc4bdf413f3588a2ff6c8808b56df86b73bdf89867bda41cc0c15"
    url: "https://app.leg.wa.gov/rcw/default.aspx?cite=43.386.040"
    format: html
    citation: "RCW 43.386.040"
    title: "RCW 43.386.040 - Testing—When required."
    doc_type: statute
    jurisdiction: washington
    issuing_body: Washington State Legislature; published by the Statute Law Committee and Code Reviser
    tags: [ai, data]
    recheck: monthly
    why_relevant: "Before deploying a facial recognition service an agency \"must test the facial recognition service in operational conditions\": a testing duty on a state agency's use of an AI technology. One section of chapter 43.386 RCW (facial recognition), seeded as a section page under owner decision 1 of 2026-11-13; the rest of the chapter is left out, see the left-out notes. Cited by WaTech policy DATA-03."
  - id: wa-rcw-43-386-050
    sha256: "9951855f661bbde3d1533c873503501b266c66015ab9047a4eb25813ef1368fd"
    url: "https://app.leg.wa.gov/rcw/default.aspx?cite=43.386.050"
    format: html
    citation: "RCW 43.386.050"
    title: "RCW 43.386.050 - Performance differences across subpopulations—Testing and mitigation."
    doc_type: statute
    jurisdiction: washington
    issuing_body: Washington State Legislature; published by the Statute Law Committee and Code Reviser
    tags: [ai, data]
    recheck: monthly
    why_relevant: "An agency that deploys a facial recognition service \"must require a facial recognition service provider to make available an application programming interface or other technical capability\" for independent accuracy and bias tests: a procurement and testing duty for an AI technology. One section of chapter 43.386 RCW (facial recognition), seeded as a section page under owner decision 1 of 2026-11-13; the rest of the chapter is left out, see the left-out notes. Cited by WaTech policy DATA-03."
  - id: wa-rcw-43-386-060
    sha256: "940746389d89375eb1bffc18c1064fdadcc7eb1db65b2a375cc11bedbff74763"
    url: "https://app.leg.wa.gov/rcw/default.aspx?cite=43.386.060"
    format: html
    citation: "RCW 43.386.060"
    title: "RCW 43.386.060 - Training."
    doc_type: statute
    jurisdiction: washington
    issuing_body: Washington State Legislature; published by the Statute Law Committee and Code Reviser
    tags: [ai, data]
    recheck: monthly
    why_relevant: "An agency \"using a facial recognition service must conduct periodic training of all individuals who operate a facial recognition service or who process personal data obtained from the use of a facial recognition service\": a training duty on state agency use of an AI technology. One section of chapter 43.386 RCW (facial recognition), seeded as a section page under owner decision 1 of 2026-11-13; the rest of the chapter is left out, see the left-out notes. Cited by WaTech policy DATA-03."
  - id: wa-rcw-43-386-090
    sha256: "c56f279b2c9ce1049d60f40b314cb4d93dda11bcc413e63c7901c672467ff10b"
    url: "https://app.leg.wa.gov/rcw/default.aspx?cite=43.386.090"
    format: html
    citation: "RCW 43.386.090"
    title: "RCW 43.386.090 - Exemption—Federal regulations and orders—Airports and seaports."
    doc_type: statute
    jurisdiction: washington
    issuing_body: Washington State Legislature; published by the Statute Law Committee and Code Reviser
    tags: [ai, data]
    recheck: monthly
    why_relevant: "Bounds the duties of 43.386.020-.060: the chapter does not apply to an agency mandated to use a specific facial recognition service by federal regulation or order, which must instead \"report to a legislative authority\" (the technology services board for a state agency). Kept as the exemption that scopes those IT governance duties. One section of chapter 43.386 RCW (facial recognition), seeded as a section page under owner decision 1 of 2026-11-13; the rest of the chapter is left out, see the left-out notes. Cited by WaTech policy DATA-03."
  - id: wa-rcw-43-386-100
    sha256: "3fa215f5f861982a4ecb0edf477c80354fa048b3d11fb97260878727d8f9efc7"
    url: "https://app.leg.wa.gov/rcw/default.aspx?cite=43.386.100"
    format: html
    citation: "RCW 43.386.100"
    title: "RCW 43.386.100 - Exemption—Department of licensing—Drivers' licenses, permits, and identicards."
    doc_type: statute
    jurisdiction: washington
    issuing_body: Washington State Legislature; published by the Statute Law Committee and Code Reviser
    tags: [ai, data]
    recheck: monthly
    why_relevant: "Bounds the duties of 43.386.020-.060: \"Nothing in this chapter applies to the use of a facial recognition matching system by the department of licensing pursuant to RCW 46.20.037.\" Kept as the exemption that scopes those IT governance duties. One section of chapter 43.386 RCW (facial recognition), seeded as a section page under owner decision 1 of 2026-11-13; the rest of the chapter is left out, see the left-out notes. Cited by WaTech policy DATA-03."
  - id: wa-law-2026-c167
    url: "https://lawfilesext.leg.wa.gov/biennium/2025-26/Pdf/Bills/Session%20Laws/House/1170-S2.SL.pdf"
    format: pdf
    citation: "Chapter 167, Laws of 2026 (E2SHB 1170), section 6"
    title: "Artificial Intelligence - Disclosures - Content Provenance (Chapter 167, Laws of 2026)"
    doc_type: statute
    jurisdiction: washington
    issuing_body: Washington State Legislature
    tags: [ai, digital-services]
    recheck: monthly
    stub: true
    stub_reason: "Enacted and signed 2026-03-24 but not in force: the act takes effect 2027-02-01 and has no RCW chapter number yet (section 8 makes section 6 a new chapter in Title 42 RCW). The corpus holds in-force instruments only. Section 6 requires a government agency that makes an AI system available to interact with consumers to disclose the AI interaction; sections 1-5 bind private providers (out of scope). Becomes a document at the next code revision once in force."
    why_relevant: "Section 6 binds state and local government agencies that make an AI system available to interact with consumers: clear, plain-language disclosure before or at the time of interaction. The only enacted Washington statute found whose subject is agency disclosure of AI use."

  # ---- Rules: WaTech has no IT rules (see the left-out notes); the one chapter held is the Secretary of State's electronic records rules
  - id: wa-rcw-43-88-092
    sha256: "671157c7e0c1b447891ecf6a83b02a743536e50b8bedf999019365cefc54225a"
    url: "https://app.leg.wa.gov/rcw/default.aspx?cite=43.88.092"
    format: html
    citation: "RCW 43.88.092"
    title: "RCW 43.88.092 - Information technology budget detail - Information technology plan - Accounting method for information technology"
    doc_type: statute
    jurisdiction: washington
    issuing_body: Washington State Legislature; published by the Statute Law Committee and Code Reviser
    tags: [funding, oversight]
    recheck: monthly
    why_relevant: "One section of the state budget law (chapter 43.88 RCW, otherwise general budgeting and left out). Its own subject is state IT spending: agencies must provide, and the office of financial management collect, 'budget detail sufficient to allow review, analysis, and documentation of all current and proposed expenditures for information technology by state agencies' (subsection 1); 'The director of Washington technology solutions shall evaluate proposed information technology expenditures and establish priority ranking categories of the proposals' (subsection 3); and the biennial budget must carry an information technology plan and technology budget (subsection 4). Taken as a section slice under owner decision 1 of 2026-11-13; the site serves one page per section, so no slice is needed. Cited by RCW 43.105."
  - id: wa-rcw-39-26-235
    sha256: "520094f3e9f5ef808c24ec57590b2fcbfca743403dda8ec62f36ff974013f5a4"
    url: "https://app.leg.wa.gov/rcw/default.aspx?cite=39.26.235"
    format: html
    citation: "RCW 39.26.235"
    title: "RCW 39.26.235 - Purchase of wireless devices or services"
    doc_type: statute
    jurisdiction: washington
    issuing_body: Washington State Legislature; published by the Statute Law Committee and Code Reviser
    tags: [procurement, governance]
    recheck: monthly
    why_relevant: "One section of the state procurement chapter (the rest is left out, see the left-out notes). Its own subject is state IT purchasing: 'State agencies that are purchasing wireless devices or services must make such purchases through the state master contract, unless the state agency provides to Washington technology solutions evidence that the state agency is securing its wireless devices or services from another source for a lower cost'. The page's history prints 'Formerly RCW 43.19.797, 43.105.410' and the last amendment 2024 c 54 s 30. Taken as a section slice under owner decision 1 of 2026-11-13."
  - id: wa-wac-434-662
    sha256: "ac0dd3ee4e163c2cfab028831eb4c04eb7af0edda313fd720b2b9e47068148f3"
    url: "https://app.leg.wa.gov/wac/default.aspx?cite=434-662&full=true"
    format: html
    citation: "WAC chapter 434-662"
    title: "Chapter 434-662 WAC - Preservation of electronic public records"
    doc_type: rule
    jurisdiction: washington
    issuing_body: Office of the Secretary of State (state archivist); published by the Legislature's Code Reviser
    tags: [data, governance]
    recheck: monthly
    why_relevant: "The Secretary of State's rules for state and local agencies' electronic records, issued under chapters 40.14, 42.56 and 43.105 RCW: 'Electronic records must be retained in electronic format and remain usable, searchable, retrievable and authentic for the length of the designated retention period' (434-662-040); retention, disposition and transfer of electronic records to the digital archives, authentication and chain of custody, encryption, metadata, website management and email management (434-662-030 to 434-662-150). Whole chapter; every section is about electronic records. In force: all 13 sections are current on the Legislature's WAC page (2026-11-13), the latest filed WSR 08-21-073. Taken under owner decision 1 of 2026-11-13 (records provisions whose focus is state electronic records). Cited by WaTech policies DATA-01-03-G, EA-01-01-G and SEC-11-01-G."

