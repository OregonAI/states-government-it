    tags: [cybersecurity, cloud-resilience]
    identity_text: "State of Alaska Remote Access Options"
    recheck: "monthly"
    why_relevant: "The Office of Information Technology's statement of how employees may reach state systems remotely: a VPN only from a State-issued computer (it cites Information Security Policies ISP-172 and ISP-175: personal devices may not connect to the State network by VPN) and the authorized options that need no VPN (Outlook on the web, Office Online, SharePoint, Teams, Citrix). Linked from the OIT home page ('SOA Remote Access Guidance'). Employee guidance rather than a numbered policy; it is the only OIT-published document the library's public pages offer that states a rule (OWNER DECISION whether guidance belongs)."
