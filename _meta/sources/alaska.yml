left_out:
  - text: "The Office of Information Technology (OIT) and its Chief Information Officer have no statute. SB 38 of the 34th Legislature ('An Act establishing the office of information technology; relating to information technology projects undertaken by state agencies') is at '(S) STA then FIN', status date 01/22/2025, on the Legislature's bill page read 2026-11-11; it is not enacted and not ingested (bills not yet enacted are out of scope). The page is watched as ak-watch-bill-sb38."
  - text: "No statute on state-agency use of artificial intelligence was found. SB 2 ('An Act relating to disclosure of election-related deepfakes; relating to use of artificial intelligence by state agencies; and relating to transfer of data about individuals between state agencies') is at '(S) STA then JUD', status date 01/22/2025 on 2026-11-11: not enacted, not ingested, watched as ak-watch-bill-sb2. The list of passed legislation for the 34th Legislature (https://www.akleg.gov/basis/Bill/Passed/34, read 2026-11-11) was screened by title for artificial intelligence, information technology, cybersecurity, data, computer, software, digital, technology, privacy and electronic. The titles that matched were: electronic devices and ID cards for prisoners (HB 35), employment information disclosure (SB 181), digital product repair, apportioning taxable income to digital business, electronic pull-tabs, electronic driver's licenses and data sharing (SB 237), data centers and utilities (SB 250, at '(H) CRA'), the Uniform Commercial Code and electronic records (SB 252), software license contracts (SB 258, 'VETOED BY GOVERNOR') and the health information exchange (SB 272). Of those, HB 35 (CHAPTER 25 SLA 25), SB 181 (CHAPTER 54 SLA 26), SB 237 (CHAPTER 55 SLA 26), SB 252 (CHAPTER 49 SLA 26) and SB 272 (CHAPTER 19 SLA 26) were enacted; SB 250 (at '(H) CRA') was not and SB 258 was vetoed. Only SB 237 was read (next item); none of the others is about state IT governance by its title (titles only; the other bills were not read)."
  - text: "SB 237 (CSSB 237(JUD) am H, 'Relating to the powers of the commissioner of administration with respect to motor vehicles; relating to electronic identification cards; relating to data sharing by the Department of Administration; relating to electronic driver's licenses and permits'), shown on the passed-legislation list as CHAPTER 55 SLA 26, signed text read from the enrolled bill PDF (HTTP 200) on 2026-11-11. It is a 2026 session law that amends AS 18.65 and the motor vehicle code for electronic identification cards and driver's licenses; it adds no section on the executive branch's IT governance, is not yet in the statutes the Legislature's site serves (its statutes page is headed 'Alaska Statutes 2025'), and the enrolled copy prints no chapter number. Left out as a session law amending the motor vehicle and identification code. OWNER DECISION whether digital identity credentials belong."
  - text: "AS 44.21 sections left out: 44.21.010 and 44.21.025 to 44.21.060 (the Commissioner and the Department's other general provisions: accounts, vouchers, contracts with the United States, records of claims; AS 44.21.020 is not among them: its paragraphs (9) 'administer and supervise a statewide automatic data processing program' and (10) 'study, design, implement, and manage the telecommunications systems and services of the state under AS 44.21.305 - 44.21.330' are IT duties, so it is seeded as ak-st-44-21-020), 44.21.256 to 44.21.290 (Alaska Public Broadcasting Commission) and 44.21.400 to 44.21.470 (public advocacy). AS 44.21.300 is marked repealed (E.O. 66, 1987). The seeded runs are 44.21.020, 44.21.045, 44.21.150 to 44.21.170, 44.21.305 to 44.21.330 and 44.21.350 to 44.21.390, and 44.21.020 (one section), the sections Administrative Order 284 cites for the Department's information technology and telecommunication authority."
  - text: "AS 44.19.500 to 44.19.520 (read 2026-11-11): the run holds only markers 'Renumbered', 'Repealed, E.O.' and the definitions section 44.19.519; the Telecommunications Information Council that Administrative Order 208 relies on (as AS 44.19.502) has no section in that run."
  - text: "AS 40.21 (Alaska records management act: the State Archivist, agency records programs and retention schedules, 'electronic record' defined at 40.21.150; read in full 2026-11-11). Left out as records management, not IT governance by its text. OWNER DECISION."
  - text: "AS 45.48 sections left out: 45.48.100 to 45.48.290 (credit report security freeze, which binds consumer credit reporting agencies), 45.48.400 to 45.48.480 (use of social security numbers: 'a person may not ...', with a state-agency regulation power at 45.48.470 and an interagency disclosure rule at 45.48.440), 45.48.600 to 45.48.690 (identity theft victims and courts), 45.48.750 (card truncation) and 45.48.990 to 45.48.995. Read 2026-11-11; none is directed at state agencies as such except 45.48.440 and 45.48.470, which sit in a general social security number article. The seeded runs are 45.48.010 to 45.48.090 and 45.48.500 to 45.48.590, which name 'governmental agency'."
  - text: "Administrative Code: no rule chapter of the Office of Information Technology or of an IT agency was found. The Legislature's Administrative Code page (https://www.akleg.gov/basis/aac.asp) is script-rendered and its bytes hold no chapter list, so this is a negative from the print views read and the discovery search, not from a chapter index: 2 AAC 05.200 to 2 AAC 05.290 (seeded) and 2 AAC 96 (read in full 2026-11-11). 2 AAC 96 (Public Information) sets how public agencies respond to records requests, with articles on records in electronic form (2 AAC 96.355) and electronic services and products (2 AAC 96.400 to 96.470: public terminals, on-line access, software copyrights, fees). Left out as public-records access. OWNER DECISION. The procurement chapter 2 AAC 12 was named in a discovery search and was not fetched; procurement code sections are left out pending the owner's decision on section-level slicing."
  - text: "Administrative orders (the Governor's list, all eight pages, 361 orders, read 2026-11-11; Alaska's Governors direct state agencies by administrative order, and the Legislature's 'Executive Orders - Current' page https://www.akleg.gov/basis/Law/EO/34 (re-read in this pass) lists one order, 'Executive Order 136' (/PDF/34/EO/exor0136.pdf), which establishes the Department of Agriculture: read and left out as an agriculture reorganization. The page also links 'Executive Orders - Historical', which was not read. The reorganization orders that touch the Department of Administration, E.O. 120 (2021) and E.O. 122 (2022), are cited in the repeal markers of AS 44.21.020 and are already codified in the statutes seeded). Orders 285 to 361 and orders 51, 63, 65, 183, 203, 208, 217 and 261 were fetched and searched in full for information technology, computer, data, cyber, artificial intelligence, telecommunication, software, internet, electronic, digital, network, privacy, website and technology; the other orders before 285 were screened only on the listing's title and opening lines, not fetched, and the first screen's keyword list had no 'Y2K' or 'Year 2000' (a later pass added 177 and 181, below; no order revokes 284 or 314 in the 361 listing lines or the pages read). Seeded: 284, 314, 359, 360. Left out with reasons: 63 (1980: assigns data processing, word processing and data communications under AS 44.21.150 to 44.21.170 to the Department of Administration and creates a Data Processing Advisory Council and an Office of Information Management; the order that created the Office of Information Technology came after it and is seeded as the one in force; whether 63 is still operative was not established), 208 (2003: assigns state website guidelines to the Telecommunications Information Council; the statute it cites, AS 44.19.502, has no section, see above; whether it is still operative was not established), 183 (1999: agencies must post public notices on the Online Public Notice website: public notice, not IT governance), 261 (2011: education data sharing among the Department of Education and Early Development, the Department of Labor and Workforce Development and the Alaska Commission on Postsecondary Education: an education data policy, OWNER DECISION), 296 (employee privacy and union membership; rescinded by order 309), 298, 310, 320, 322 and 323 (broadband, public safety communications and 9-1-1), 352 (contracts and the State of Israel: it names information technology services only in a definition) and 358 (fiscal restraint: mentions technology in lieu of travel). 177 (Aug 28, 1998, 'Establishing a Year 2000 (Y2K) project office within the Office of the Governor', read 2026-11-11) and 181 (Jan 6, 1999, amends 177 and moves the Y2K project office to the Department of Administration, read): state-IT orders about the Year 2000 date change, spent, no current effect, 51 (1978, 'Office of Technology' on the list; the order's own text establishes the Office of Northern Technology for small-scale northern technologies: technology policy for the north, not state IT), 65 (1981, State Information Districts: the boundaries agencies use to report statistics by area, not information systems), 203 and 217 (2003 and 2004: the Division of Homeland Security and Emergency Services consolidation; no information technology text matched)."
  - text: "The OIT Information Security Policies (ISP series) are not published publicly: the library page answers HTTP 401 (see ak-stub-oit-isp-library). Copies of some policies were found as attachments to procurement notices on the State's public-notice host (aws.state.ak.us, URL form https://aws.state.ak.us/OnlinePublicNotices/Notices/Attachment.aspx?id=<n> with a capital O, P and N, https; Attachment ids 159678 and 118941 to 118946, 142581 and 143035; fetched 2026-11-11 through the Fetcher. Ids 118943 and 143035 answered HTTP 403 on the first request and HTTP 200 on a later one in a second pass; the same URL with http, or with lower-case 'onlinepublicnotices', answered 403, so the answer is not stable): ISP-001 Information Security Framework v1.1 (id 159678, 'Approved by: CIO', its Effective and Last Review fields print blank), ISP-112 Third Party Security v1.01 (ids 118941 and 142581, effective 7/1/2017), ISP-142 Equipment Security v1.0 (id 118942, effective 7/1/2017), ISP-164 Security Monitoring and Logging v1.0 (id 118944, effective 7/1/2017), ISP-152 Incident Reporting v1.01 (id 118943, effective 7/1/2017), ISP-179 Firewall Use v1.01 (id 118945, effective 7/1/2017), ISP-196 Cloud and Offsite Hosting v1.01 (id 143035, effective 7/1/2020) and ISP-195 Prohibited Use of Password Protected Content & Pre-Encrypted Attachments (id 118946, effective 7/1/2017). Left out: they are attachments to solicitations, not the library of record, OIT's own pages do not link them, and their currency cannot be shown (OIT has since changed ISP-178, its password policy; see the next item). Also named in bytes and not fetchable: ISP-002 (glossary), ISP-006 (template), ISP-132 (Security Awareness and Training, revised November 24, 2021, linked on OIT's public news post to https://oit-int.alaska.gov/media/1044/isp-132-security-awareness-and-training.pdf, which answered HTTP 401), ISP-166 and ISP-172 (named on OIT's public Web Waivers page), ISP-175 and ISP-178. OWNER DECISION whether these copies may stand for the policies."
  - text: "OIT public pages read 2026-11-11 and left out as not instruments: the home page and employee dashboard pages, including the news post 'Revised Training Security Policy' (https://oit.alaska.gov/home/news-service-announcements/revised-training-security-policy/, HTTP 200; it announces the revised ISP 132 and links it on the sign-in site) and the Web Waivers page (https://oit.alaska.gov/home/employee-dashboard/web-waivers/, HTTP 200; an employee page naming ISP-166 and ISP-172 for the web filter and waiver process); 'Updated ISP-178 Password Policy' (a news post and its one-page PDF summary, https://oit.alaska.gov/media/1353/password-change-one-page-summary-v2-1.pdf, which says the policy's minimum length is now 15 characters and expiry 365 days: a summary of the change, last edited 10/16/2026, not the policy); 'New AI Features for State of Alaska Employees' (an announcement of Teams transcription and Copilot Chat, no rule); the Policy and Governance, Service Catalog and Information Security pages (the first holds no text in the bytes, the last answered HTTP 401); the Service Catalog Master PDF (a catalog of services, linked, not fetched); and the FY 2027 enterprise strategic plan PDF (https://oit.alaska.gov/media/1348/oit_-enterprise_-strategic_-plan-fy_-2027.pdf, a strategy document, fetched). The Administrative Order 284 PDF that OIT hosts on its sign-in site (HTTP 401) is the same order seeded from the Governor's site."
  - text: "The home page of oit.alaska.gov answered HTTP 403 to https://oit.alaska.gov/ and HTTP 200 to https://oit.alaska.gov/home; the Fetcher was not retried with any other form."
