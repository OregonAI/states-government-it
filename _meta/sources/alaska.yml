# Alaska seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Discovery 2026-11-11 through the toolkit Fetcher: akleg.gov (statutes and Administrative Code print views, bill status and passed-legislation pages), gov.alaska.gov
# (all eight pages of the Governor's administrative-order list; orders 285 to 361 and 51, 63, 65, 183, 203, 208, 217, 261 read in full), oit.alaska.gov and oit-int.alaska.gov
# (the Office of Information Technology's public site and its sign-in site), aws.state.ak.us (public-notice attachments).
# Titles of the administrative orders: the order pages print only 'Administrative Order No. N'. Orders 284 and 314 carry the summary line of the Governor's list (its own wording, without the 'AO N' prefix); 359 and 360 have no list summary line, so the order's own heading is the title.
sources:

  - id: "ak-st-44-21-150"
    sha256: "901406d8d8a0d786f1dc41dbf98090ea0187736f31c9fca3dd00d3abbe403276"
    url: "https://www.akleg.gov/basis/statutes.asp?media=print&secStart=44.21.150&secEnd=44.21.170"
    format: "html"
    citation: "AS 44.21.150 – 44.21.170"
    title: "Automatic Data Processing (AS 44.21.150 – 44.21.170)"
    doc_type: "statute"
    jurisdiction: "alaska"
    issuing_body: "Alaska Legislature"
    tags: [governance, oversight, data]
    recheck: "monthly"
    why_relevant: "The statute that makes the Department of Administration responsible for operating and managing the automatic data processing resources and activities of the executive branch (s. 44.21.150), its powers and duties (s. 44.21.160: comply with the state information systems plan, central systems and programming staff, data processing plans, review of budget requests, standards, review of state systems, training, charging agencies) and the definitions (s. 44.21.170). Administrative Order 284 cites these sections as the authority under which the Commissioner of Administration oversees information technology, and creates the Office of Information Technology and its Chief Information Officer in that department. Alaska's statutes name no Office of Information Technology or CIO (see left_out on SB 38). The run is one print view of the Legislature's statutes page, sections 44.21.150 to 44.21.170; the page prints no history lines."
  - id: "ak-st-44-21-020"
    sha256: "fd2dc43d7b7e5c14538cfce29cc838530161d4a75b0d1977ff82efc774a885a7"
    url: "https://www.akleg.gov/basis/statutes.asp?media=print&secStart=44.21.020&secEnd=44.21.020"
    format: "html"
    citation: "AS 44.21.020"
    title: "Duties of department (AS 44.21.020)"
    doc_type: "statute"
    jurisdiction: "alaska"
    issuing_body: "Alaska Legislature"
    tags: [governance]
    recheck: "monthly"
    why_relevant: "The Department of Administration's general duties, which include its information technology duties: paragraph (9), 'administer and supervise a statewide automatic data processing program', and paragraph (10), 'study, design, implement, and manage the telecommunications systems and services of the state under AS 44.21.305 - 44.21.330'. Administrative Order 284 cites this section. The other paragraphs (surveys, accounts, vouchers, purchasing, mail and telephone services, retirement and personnel programs) ride along in the same one-section run (OWNER DECISION whether a section with two IT paragraphs is in scope). Paragraphs (5) and (11) are marked repealed (E.O. 122 of 2022, E.O. 120 of 2021)."
  - id: "ak-st-44-21-045"
    sha256: "62fa97bf8ac4fe237859352535266d368d6ad811e9b4b1c2c3e12cb76a8846e2"
    url: "https://www.akleg.gov/basis/statutes.asp?media=print&secStart=44.21.045&secEnd=44.21.045"
    format: "html"
    citation: "AS 44.21.045"
    title: "Information services fund; charges (AS 44.21.045)"
    doc_type: "statute"
    jurisdiction: "alaska"
    issuing_body: "Alaska Legislature"
    tags: [funding, governance]
    recheck: "monthly"
    why_relevant: "Establishes the information services fund, an internal services fund in the Department of Administration that receives reimbursement from state agencies and political subdivisions for the information services the department provides, and sets how the department charges and budgets for them (agencies must show expected fees and surcharges for the department's information services as an identifiable budget item). This is the funding model for the executive branch's central IT services. One section."
  - id: "ak-st-44-21-305"
    sha256: "e4319e2b46415c0a48ccbabe0d635ef44a465a891e244f88cda6379a023c7cb9"
    url: "https://www.akleg.gov/basis/statutes.asp?media=print&secStart=44.21.305&secEnd=44.21.330"
    format: "html"
    citation: "AS 44.21.305 – 44.21.330"
    title: "Telecommunications Services and Operations (AS 44.21.305 – 44.21.330)"
    doc_type: "statute"
    jurisdiction: "alaska"
    issuing_body: "Alaska Legislature"
    tags: [governance, cloud-resilience]
    recheck: "monthly"
    why_relevant: "Article 4 of the Department of Administration chapter: the Department's telecommunications powers and duties (s. 44.21.310: policy and planning, management of state telecommunications services and an inventory of state communications facilities, procurement under AS 36.30), its authority to plan, design, build and operate all telecommunications systems owned or leased by state agencies (s. 44.21.320), the rule that a state agency may build its own system only with the commissioner's written authorization and in compliance with the state information systems plan, and definitions. Administrative Order 284 cites these sections. Sections on public telecommunications, instructional television and the satellite television project ride along in the same run. OWNER DECISION: the whole run, not only the ride-along sections, sits against the telecom exclusion in _meta/domain.yml ('broadband, 911 and telecom'); it is seeded because AO 284 cites it and AS 44.21.020(10) assigns the department the state's telecommunications systems, and the decision covers the whole run."
  - id: "ak-st-44-21-350"
    sha256: "1b4c515fb1caaecd56aa90361ac5b063302ce445175b31b5885a13d8d6b7b7f3"
    url: "https://www.akleg.gov/basis/statutes.asp?media=print&secStart=44.21.350&secEnd=44.21.390"
    format: "html"
    citation: "AS 44.21.350 – 44.21.390"
    title: "Telecommunications Information (AS 44.21.350 – 44.21.390)"
    doc_type: "statute"
    jurisdiction: "alaska"
    issuing_body: "Alaska Legislature"
    tags: [governance, oversight]
    recheck: "monthly"
    why_relevant: "Article 5 of the Department of Administration chapter: the commissioner establishes guidelines and prepares the state short-range and long-range information systems plan (s. 44.21.350), directs state agencies to prepare agency information systems plans, sets guidelines for public access to information, and may authorize an agency's independent system only on a showing of necessity; every state agency must coordinate the design, development, management and operation of its information systems with the commissioner. Definitions in s. 44.21.390. Administrative Order 284 cites these sections."
  - id: "ak-st-45-48-010"
    sha256: "b5a686514070b2d60096a8bdcbcd6018d1fd0368661f5dc7b1c639d52f0a2f16"
    url: "https://www.akleg.gov/basis/statutes.asp?media=print&secStart=45.48.010&secEnd=45.48.090"
    format: "html"
    citation: "AS 45.48.010 – 45.48.090"
    title: "Disclosure of Breach of Security (AS 45.48.010 – 45.48.090)"
    doc_type: "statute"
    jurisdiction: "alaska"
    issuing_body: "Alaska Legislature"
    tags: [cybersecurity, data]
    recheck: "monthly"
    why_relevant: "Article 1 of the Personal Information Protection Act. It binds a 'covered person', which s. 45.48.090 defines to include a person doing business, a person with more than ten employees and a 'governmental agency' (a state or local governmental agency except the judicial branch): a covered person that owns or licenses personal information on a state resident must disclose a breach of the security of the information system to each resident affected, with the notice, delay, agency-notification and violation provisions that follow. It is the only Alaska statute found that sets a security-incident duty for state agencies, and it binds private covered persons in the same words. Credit-freeze, social security number and identity-theft articles of the chapter are left out (see left_out)."
  - id: "ak-st-45-48-500"
    sha256: "84b329da3adfe3fbf9aae908f8f4be1bd8e0e3db2f740799fd8be0a47baaf7c8"
    url: "https://www.akleg.gov/basis/statutes.asp?media=print&secStart=45.48.500&secEnd=45.48.590"
    format: "html"
    citation: "AS 45.48.500 – 45.48.590"
    title: "Disposal of Records (AS 45.48.500 – 45.48.590)"
    doc_type: "statute"
    jurisdiction: "alaska"
    issuing_body: "Alaska Legislature"
    tags: [data, cybersecurity]
    recheck: "monthly"
    why_relevant: "Article 5 of the Personal Information Protection Act. A business and a 'governmental agency' (a state or local governmental agency except the judicial branch) disposing of records that contain personal information must take all reasonable measures to protect against unauthorized access or use, including disposal of computer media and equipment, and must adopt written policies and procedures for destruction and disposal (s. 45.48.530); a governmental agency that knowingly violates it is liable for a civil penalty (s. 45.48.550). It binds businesses in the same words."
  - id: "ak-aac-2-05-200"
    sha256: "b69dc13241c429903275cfdff6be856ff1be518a3ad971129a7fe0ec58bdf549"
    url: "https://www.akleg.gov/basis/aac.asp?media=print&secStart=2.05.200&secEnd=2.05.299"
    format: "html"
    citation: "2 AAC 05.200 – 2 AAC 05.290"
    title: "Electronic signature verification system (2 AAC 05.200 – 2 AAC 05.290)"
    doc_type: "rule"
    jurisdiction: "alaska"
    issuing_body: "Department of Administration"
    tags: [digital-services, data]
    recheck: "monthly"
    why_relevant: "The Department of Administration's rules for its electronic signature verification system, in which the department acts as certifying authority when a state agency has elected to use the system: enrollment (by permanent fund dividend and a driver's license or identification card, with a user name and password), validation against the Permanent Fund Dividend Division and Division of Motor Vehicles databases, verification, and definitions. The one chapter of the Administrative Code found that regulates a state IT service of the department; the code has no rule chapter for the Office of Information Technology (see left_out)."
  - id: "ak-ao-284"
    sha256: "d331d0ceedf769e9ded6f2497c1aa7ac2cea05e4d12cfeee40e7eafe2a9f380e"
    url: "https://gov.alaska.gov/admin-orders/administrative-order-no-284/"
    format: "html"
    citation: "Administrative Order No. 284"
    title: "Reorganizing telecommunication and information technology services within the executive branch."
    doc_type: "executive_order"
    jurisdiction: "alaska"
    issuing_body: "Office of the Governor"
    tags: [governance, cybersecurity, oversight]
    recheck: "monthly"
    why_relevant: "Creates the Office of Information Technology in the Department of Administration, led by the Chief Information Officer, with a statewide capacity: it manages all information technology services and related resources in the executive branch, oversees enterprise systems, implements uniform security standards, oversees and annually reviews information security policies, standards and practices in all executive branch agencies and their contractors, reports annually to the Governor on agency compliance, and designates a Chief Information Security Officer. Transfers the Division of Enterprise Technology Services into the office and rescinds delegation orders under AS 44.21.150 to 44.21.170 and 44.21.305 to 44.21.330. Dated April 25, 2017; it takes effect immediately and the OIT's own page lists it as its establishing order. The state's central IT body rests on this order, not on a statute. No order was found that revokes it."
  - id: "ak-ao-314"
    sha256: "a8e0bf5ba98bf78a8319f5521f91a68cc3838d669a41568d29afe10cc57be4bb"
    url: "https://gov.alaska.gov/admin-orders/administrative-order-no-314/"
    format: "html"
    citation: "Administrative Order No. 314"
    title: "To establish an executive branch process of data analytics to better and more efficiently deliver state services and to identify the misuse of state resources."
    doc_type: "executive_order"
    jurisdiction: "alaska"
    issuing_body: "Office of the Governor"
    tags: [data, governance]
    recheck: "monthly"
    why_relevant: "Directs executive branch agencies to begin sharing the data they collect, within the limits of state and federal law, with the Department of Administration's data analytics services section, which develops the procedures, enters into memoranda of agreement on how data is transmitted, stored, accessed and shared, and reports quarterly to the Governor. Agencies stay bound by the statutes and regulations that protect the security and privacy of the information in state systems. The order prints 'Dated this 3rd day of February, 2020' (the Governor's list shows February 11, 2020); it takes effect immediately and stays in effect until revoked. No order was found that revokes it."
  - id: "ak-ao-359"
    sha256: "1dab6dc7393f09edca977077f4e635afdb9f4f5b7ad3c88a91be35ffec6bdb05"
    url: "https://gov.alaska.gov/admin-orders/administrative-order-no-359/"
    format: "html"
    citation: "Administrative Order No. 359"
    title: "Administrative Order No. 359"
    doc_type: "executive_order"
    jurisdiction: "alaska"
    issuing_body: "Office of the Governor"
    tags: [ai, oversight]
    recheck: "monthly"
    why_relevant: "Orders an annual Government Efficiency Review of all executive branch agencies, led by the Office of Management and Budget, in which every agency must utilize technology and artificial intelligence (AI) to review large datasets to determine how State funds are actually being spent, and recommend where technological or AI resources can realize efficiencies; one of the stated goals is to modernize processes to fully integrate IT solutions. Dated August 4, 2025, in effect until revoked. The only executive instrument found that directs agencies to use AI; it sets no rules for how AI may be used. Borderline for scope, and the first item for the owner's decision: its subject is budget review, and under _meta/domain.yml's inclusion test ('the subject is IT, data or AI as a government function') only one sentence qualifies. OWNER DECISION (lead item): keep as a document or move to left_out."
  - id: "ak-ao-360"
    sha256: "4a5579b245216d0f0b1c3c7ec7f0def10eb6d23b7fd66d77760695b459b30013"
    url: "https://gov.alaska.gov/admin-orders/administrative-order-no-360/"
    format: "html"
    citation: "Administrative Order No. 360"
    title: "Administrative Order No. 360"
    doc_type: "executive_order"
    jurisdiction: "alaska"
    issuing_body: "Office of the Governor"
    tags: [ai, digital-services]
    recheck: "monthly"
    why_relevant: "Replaces Administrative Orders 157 and 266 with a regulatory-reform order. Its guidelines tell agencies to leverage technology, such as artificial intelligence (AI), to support digitization, automation and public access to permitting information. Dated August 4, 2025, in effect until revoked. Mainly a rulemaking-process order; the AI sentence is its only IT content, so under _meta/domain.yml's inclusion test its subject is rulemaking, not IT. Borderline for scope, and the second item for the owner's decision: OWNER DECISION (lead item): keep as a document or move to left_out."
