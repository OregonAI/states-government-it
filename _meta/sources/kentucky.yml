left_out:
- text: |-
    ---- Kentucky: found and left out (each was seen on an official page on 2026-11-12 and read through the Fetcher; the reason is recorded here)
- text: |-
    COT Policies page (https://technology.ky.gov/policies-and-procedures/Pages/policies.aspx), reconciled row by row: 50 rows (43 CIO policies, type Policy; 7 ENT items, type Standards), all 50 seeded as documents. Procedures page: 2 rows, one seeded (the Agency Incident Response Guidelines) and one left out (the Enterprise Identity Management User Manual, see the record on it). The page lists every row in its HTML (no paging, filters or script-loaded rows). Titles differ from the printed ones in places (the index calls CIO-090 'Information Security Incident Response Policy', the file prints 'Incident Response Policy'; CIO-074 prints 'CIO-74'); each entry's identity_text is the phrase its file prints. OWNER DECISION, recorded for review: CIO-071 (Wireless Voice and Data Services), CIO-078 (Wireless LAN) and CIO-107 (Managed Print Services) are seeded because they govern executive branch use of state devices and networks, not telecom service; ENT-102, ENT-103, ENT-301, ENT-302 and ENT-303 are guidelines or processes that the index types as Standards and are seeded as the index types them.
- text: |-
    Enterprise Identity Management User Manual (https://technology.ky.gov/policies-and-procedures/PoliciesProcedures/EIM%20User%20Guide.pdf; the procedures page lists it as 'Enterprise Identity Management User Manual', type Standards; the file prints 'Enterprise Identity Management User Guide, Version 4.0'): left out. It is a user guide for the EIM portal, a table of contents of how-to sections ('Section 2: How EIM works' and others), not an instrument; the playbook leaves out forms, templates and similar items. OWNER DECISION: it was first seeded because the index types it Standards, and can be seeded if the owner reads it as COT guidance.
- text: |-
    COT Forms page (https://technology.ky.gov/policies-and-procedures/Pages/forms.aspx): 18 file links, all left out. They are forms or form instructions, not instruments: the Acknowledgement of Internet and Electronic Mail Acceptable Use Policy (.doc), New Technology SPR1 Request Form (.docx), Task Order Agreement COT-F010 (.docx) and its instructions (PDF), Acknowledgement of Confidentiality Agreement COT-F011 (.docx), Acknowledgment of Responsibility COT-F015 (.doc), Server Request Form COT-F045 (.xlsx), Data Center Equipment Installation Removal Request Form COT-F059 (.docx), Production Print Service COT-F070 (.docx), Record of IT Equipment Sanitization COT-F108 (.doc), Procurement Request COT-F180 (.doc) and its instructions (.doc), Staff Service Request Form COT-F181 (.doc) with its instructions (PDF), Staff Service Request EZ Form COT-F181EZ (.doc) with its instructions (PDF), Forensic Investigations Request form COT-F182 (.docx), Paging Service COT-F205 (.doc). The legacy .doc files could not be read in any case.
- text: |-
    COT Executive Orders page (https://technology.ky.gov/Pages/Executive-Orders.aspx), 7 rows, all scans with no text layer. One is a stub (2012-880, the two OCR engines disagree on the figures). Left out: Executive Order 2013-403 (June 14, 2013), 2010-436 (June 16, 2010), 2008-506 (June 6, 2008), 2007-502 (June 21, 2007), 2006-684 (June 19, 2006) and 2005-562 (June 16, 2005), each titled 'Relating to the Reorganization of the Finance and Administration Cabinet' (2005-562: of the Commonwealth's Office of Technology). They are organization charts for the Office under the reorganization power: the text of 2006-684 says 2005-562 'was not ratified by the General Assembly', 2007-502 says the same of 2006-379, 2006-683 and 2006-684, and 2010-436 says the same of 2009-772 and 2009-363, so each is replaced by the next; the Office's offices and divisions are now set by KRS 42.724 (amended 2014 and 2021), and KRS 12.028 as amended in 2021 requires General Assembly approval of reorganization plans. OWNER DECISION: whether 2008-506, 2010-436 and 2013-403 are in force cannot be read from the official page; they are left out as superseded organization charts and can be seeded if the owner reads them as in force.
- text: |-
    Governor's executive orders (all governors): no complete list of record could be read through the Fetcher. The Governor's site (governor.ky.gov) has no executive order list page (https://governor.ky.gov/executive-orders and /news/executive-orders answer 404; its news page loads its items by script; /attachments answers HTTP 401). The Secretary of State's Executive Journal (https://web.sos.ky.gov/execjournal/jrnl.aspx) is an ASP.NET search form (view-state fields, results returned to a form post), which the Fetcher, a GET client, cannot drive. So 'no executive order on state IT, cybersecurity, data or AI found' is stated only for COT's own list, which was read in full. A press report (not bytes from the state) says Executive Order 2026-494 (August 6, 2026) concerns the impact of private data centers on utility rates and the environment: it binds the Public Service Commission and the Energy and Environment Cabinet and is out of scope in any case (private-sector data centers). Needed for a complete answer: a way to read the Executive Journal (an owner decision on form posts) or a list from the Governor's office.
- text: |-
    COT pages read and holding no instrument: the home page, Memos (https://technology.ky.gov/Pages/Memos.aspx; prints only the headings 'Agency Contact' and 'Memorandum' and no list), the Office of the Chief Information Security Officer page (prose about its branches), Strategic and Capital IT Planning (prose and a link to Capital IT projects, a list of projects not an instrument), History. The Programs page (https://technology.ky.gov/Pages/Programs.aspx) answered HTTP 401 and was not read.
- text: |-
    KITS (https://technology.ky.gov/about-the-agency/Pages/kits.aspx): the library export is seeded as one standard (OWNER DECISION, see its entry). The page also links https://technology.ky.gov/about-the-agency/Pages/kits2.aspx (the KITS procedures and the request for a revision), read and holding no instrument beyond a contact line; the 'EAS' codes inside the export are rows of the one table, not separate files.
- text: |-
    Statutes, KRS chapter 42 (section list read in full, 184 rows): seeded 42.630 (the General Assembly's findings on geographic information systems), 42.720, 42.722, 42.724, 42.726, 42.728, 42.730, 42.731, 42.732, 42.650, 42.655, 42.740, 42.742, 42.744. Left out: 42.734, 42.736 and 42.738 (the Kentucky Wireless Interoperability Executive Committee and the statewide public safety interoperability plan: public safety radio, which domain.yml scopes out as telecom and 911); 42.746 (a statewide planning and mapping system for public buildings for emergency responders: emergency response); 42.747 (the Blockchain Technology Working Group, attached to COT, to study blockchain for critical infrastructure such as the electric grid and water supply: a study of utilities, not government IT; OWNER DECISION); 42.032 (a web site of executive branch expenditure records: budget transparency).
- text: |-
    Statutes, KRS chapter 1 (Boundaries; section list read in full, 6 rows): seeded 1.020 (the Kentucky State Plane Coordinate System, which charges the Commonwealth Office of Technology with the zones and is the authority cited by 200 KAR 41:010; OWNER DECISION, see KRS 42.650). Left out: 1.010 (a statement of the General Assembly's intent that 1.020 not displace metes and bounds or the public land system: land description, not IT, though it is the intent section for 1.020; can be seeded with it); 1.100, 1.200, 1.300 and 1.400 (the state's boundaries with other states).
- text: |-
    Statutes, KRS chapter 45 (budget): seeded 45.818 only. Left out: 45.253 (revolving, trust and agency accounts and charges for services by agencies; named in KRS 42.726's implementing list; read in full 2026-11-13 under the owner decision on provisions whose own focus is IT governance: it is a general budget-accounting section for every budget unit, and only subsections (6) and (7), which let the Commonwealth Office of Technology charge local agencies and credit its operating account, touch IT; its focus is not IT governance, and the slice shape cuts sections, not subsections; OWNER DECISION, can be seeded whole if the owner reads (6) and (7) as enough); 45.750 to 45.810 (capital construction and the Capital Projects and Bond Oversight Committee, read 45.760 and 45.763 in full and neither mentions information technology; 45.763 is about real property and equipment financing), and the rest of the chapter, per the playbook rule on non-IT sections of budget law. KRS chapter 45A (Model Procurement Code, section list read in full): no section about information technology found by its catchlines; left out.
- text: |-
    Statutes, KRS chapter 61: seeded 61.931, 61.932, 61.933, 61.9307, 61.980, 61.982, 61.984, 61.986 and 61.988. Left out: 61.934 (the same duty for the legislative and judicial branches, out of scope in domain.yml); 61.9305 (a working group on facial recognition technology and use policies for law enforcement agencies: law-enforcement technology, out of scope); 61.990 (a general penalty section for the chapter); the Open Records Act (61.870 to 61.884: public records access, not IT). KRS 61.931 to 61.933 define 'agency' to include local governments as well as the executive branch; they are seeded whole as published.
- text: |-
    Statutes, KRS chapter 369 (Information Technology): seeded 369.117, 369.118 and 369.119, the Uniform Electronic Transactions Act sections that bind governmental agencies. Left out: 369.101 to 369.116 and 369.120 (the Act's rules for private electronic transactions and signatures) and 369.130 to 369.139 (digital assets and wallets, regulating private persons). KRS chapter 171 (State Archives and Records, 171.420 to 171.740): records retention and management, not IT; 171.420 was read in full 2026-11-13 under the owner decision on provisions whose own focus is IT governance and declined: it creates the State Libraries, Archives, and Records Commission (seventeen members, the Commonwealth Office of Technology's executive director one of them) as the library advisory council and gives it authority over retention and destruction schedules for the records of state and local agencies of every kind; it says nothing about electronic records or information systems, so its focus is libraries and records generally, not IT; KRS chapter 12 (administrative organization) and 15: nothing found on IT or AI by catchline.
- text: |-
    Statutes on artificial intelligence: KRS 42.731 (2025 Ky. Acts ch. 66, Senate Bill 4) is the one found that binds state agencies. A press report (not bytes from the state) says House Bills 455 and 641 of the 2026 session concern AI in therapy and mental health chatbots and are not enacted as far as found; they are private-party rules in any case. The section lists read are the chapter pages for 12, 15, 42, 45, 45A, 61, 171 and 369; the other chapters were not read.
- text: |-
    Administrative regulations, https://apps.legislature.ky.gov/law/kar/titles.htm (136 titles read as a list) and Title 200 (chapters 001 to 041 read as a list; chapter 001 read as a list of regulations; chapter 041, Geographic Information Systems, read as a list of one regulation, 41:010, status Current, and that regulation read in full): seeded 200 KAR 1:016 and 200 KAR 41:010. Left out: 200 KAR 1:015 (Data Breach Notification Forms, status Expired, replaced by 1:016); 200 KAR 1:010 and 1:011 (repealed and inactive); 200 KAR 1:020 (access to public records: not IT). Title 14, Kentucky Information Systems Commission, status Expired. No regulation of the Commonwealth Office of Technology on artificial intelligence was found in Title 200, although KRS 42.731 directs them (the Title 200 chapter list names no technology chapter; chapter 041, titled 'Geographic Information Systems', is COT's geographic information chapter and lists one regulation, 41:010); the watch page on the Title 200 chapter list is there to catch one. Titles 725 (Libraries and Archives), 101 (Personnel) and others were not read chapter by chapter.
- text: |-
    Owner decision of 2026-11-13 (a provision in law whose own focus is the governance of state IT is in scope as a section slice; KRS sections are served one per PDF, so no slice is needed), applied to the candidates the citation pass named. Each was fetched through the Fetcher and read in full on 2026-11-13. SEEDED: KRS 186A.285 (the Commonwealth Office of Technology's executive director must approve any connection to the automated vehicle registration and titling system). LEFT OUT: KRS 11.080 and 11.090 to 11.110 (the Governor's power to have any state agency audited, studied or surveyed, his employees' access to agency records, and their pay; 11.080 only defines 'agency' for 11.090 to 11.110 and the audit looks at finances and bookkeeping; none of the four mentions information technology or electronic records, so the focus is general agency audit, not IT); KRS 186A.040 (the accessible online insurance verification system, in force since 2025 Ky. Acts ch. 39: although the Department of Vehicle Regulation builds and runs a state information system under it, with data-security, retention and disclosure rules, and subsection (7) has the Commonwealth Office of Technology support it, the section mostly sets duties of insurers, a technical advisory committee of insurers and the rules for notifying vehicle owners and revoking registrations, so its focus is motor vehicle insurance compliance, not IT governance; OWNER DECISION, borderline, can be seeded whole if the owner reads the section as the governance of a state system); KRS 45.253 and 171.420 (see the chapter 45 and chapter 171 records above).
- text: |-
    OWNER DECISION, copyright: Kentucky asserts copyright in its statutes (issue #31). The text of KRS sections, regulations, policies and orders is mirrored as published; the repo should not go public before the owner decides.
- text: |-
    Method notes: the Kentucky Administrative Regulations HTML page of a regulation prints both the current text and tracked changes; the regulation is seeded from the PDF its 'Download PDF' link serves (the file's name carries an internal document number, 13519, which changes when the regulation is amended). The title page URL pattern /law/kar/titles/200 was used where the titles page's relative links (href='200') answer 404; the same page also answers at /law/kar/TITLE200.HTM. KRS section files are one-page PDFs reached from the chapter page's own links; the file for each section prints its own Effective and History lines.
