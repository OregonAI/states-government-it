left_out:
- text: |-
    Utah left out, with the reason. Everything below was read from bytes fetched through the toolkit Fetcher on 2026-11-12.
- text: |-
    Statutes (Utah Code, XML or chapter lists read at le.utah.gov). Seeded: 63A-16, 63A-19, 63A-20, 63C-27.
     - 13-72 Artificial Intelligence Policy Act (text read in part: definitions, the Office, the learning laboratory, agreement terms): creates the Office of Artificial Intelligence Policy, a learning laboratory
       and regulatory mitigation agreements with private participants; obligations fall on persons using AI, not on state agencies as users.
       Out on the inclusion test (private-sector AI regulation). The chapter carries a repeal date of 7/1/2027.
     - 13-72a (AI applications relating to mental health), 13-77 (generative AI consumer disclosures), 13-72c (digital content provenance,
       effective 1/1/2027): obligations on private providers; 13-72c is not yet in force. Section lists read.
     - 63G-34 State Government - Interaction With Citizens And Others (read in full): requires state government to offer electronic submission
       of forms; effective 7/1/2027, so not in force.
     - 63G-32 Legal Personhood (read in full, 2 sections): 63G-32-102 says a governmental entity 'may not grant legal personhood to, nor recognize legal personhood in: artificial intelligence'
       (and other non-human things). It binds governmental entities on the legal status of AI, not on their use of AI or IT. Borderline on the inclusion test; OWNER DECISION.
     - 63G-15 State Issued Identification Number Act (read in full): a government entity may not use a nine digit number as a person's identification number where its information technology
       system can create another number or is being reprogrammed. Binds state IT systems, but on one narrow identifier rule; not seeded, and the owner may reverse that.
     - 63G-29 Social Credit Score Prohibition Act (read in full): binds governmental entities, but the subject is a prohibition on scoring
       people by social behaviour, not IT, data or AI as a government function. Borderline; OWNER DECISION.
     - 63A-12 Archives and Records Service and Management of Government Records (section list read): records management and the
       Government Records Office; 63A-12-117 sets technical standards for digital authentication systems. General records law, as other states'
       records acts were treated; OWNER DECISION on whether to seed 63A-12 and 63G-2 (Government Records Access and Management Act, chapter title read).
     - 63A-1 Department of Government Operations (section list read): the department the Division sits in; no IT subject in its section headings.
     - 63G-6a Utah Procurement Code (chapter title only): procurement code sections inside a non-IT chapter, left out pending the owner's decision on section-level slicing.
     - 63D-3 Unauthorized Access to Information Technology (Title 63D chapter list only): a criminal statute; crimes are out of scope.
     - 46-4 Uniform Electronic Transactions Act (chapter title only): general commercial and governmental e-records law, not read.
     - Title 53 and Title 67 chapter lists were read for IT, cybersecurity and AI chapters: none found other than those named above.
     - 63I-2 repeal dates: 63C-27 repeals 7/1/2032 and 13-72 and 13-72a on 7/1/2027, as the files print; the seeded 63C-27 says so.
- text: |-
    Administrative rules. Utah's administrative code is served only by the eRules public portal (adminrules.utah.gov, a JavaScript application:
    the /Code page returned an application shell with no rule text, and the two rule-page URLs tried answered 404). The Office of Administrative Rules
    offers monthly ZIP archives of only the rules that changed that month, and annual Index of Changes spreadsheets. So no Utah rule is a document, and none
    can be shown to be current; each rule named below is a stub (ut-rule-r895-*) with that measured reason. Technology Services rules named in fetched bytes: R895-7 Acceptable Use of Information Technology Resources (cited
    by DTS Policies 1000-0003 and 5000-0002); and, from the Index of Changes spreadsheets read (rules effective in 2025 and 2026): R895-3 Computer
    Software Licensing, Copyright, Control, Retention, and License; R895-4 Subdomain Naming Conventions for Executive Branch Agencies; R895-5
    Acquisition of Information Technology; R895-8 State Privacy Policy and Agency Privacy Policies; R895-14 Access to Information Technology for
    Users with Disabilities. The full R895 list is unknown (the spreadsheets list only changed rules). A route to the code text (a bulk file or a documented API)
    is an owner question; the watch entry on the Index of Changes page is the signal to re-check.
- text: |-
    Executive orders (governor.utah.gov list and rules.utah.gov Executive Documents list, every row title read; Herbert, Walker, Huntsman and Leavitt pages searched by title).
     - Seeded: 2026-08 (AI) as a document; 2022-06 (TikTok) and the 2001 CIO security order as stubs.
     - 2023-06 Directing the Chief Privacy Officer to Develop a Strategic Privacy Plan and 2023-01 Creating a Time-Limited Task Force on State Agency
       Collaboration and Data Sharing: both are scans, read by OCR (both engines agreed) for this check, and both orders end by their own terms
       ('shall remain in effect through Aug. 1, 2023' and 'through Aug. 30, 2023'). Expired, so not in force; left out.
     - 2026-03 Establishing a Higher Bar for Data Center Development in Utah (read in part): a framework for water, air, ratepayer and land
       use impacts of large private data centers, not state IT as a government function. Out.
     - 2026-06 Utah Quantum Initiative (searched for IT duties; economic development) and 2025-05 Expanding Government Efficiency (GRIT; read in part: general
       process improvement, no IT subject): out. 2026-01, -02, -04, -05, 2026-07 (Recovery Utah) and the rest of 2025, 2024, 2023, 2022 and 2021 by title: emergencies, wildfire,
       drought, workforce, military leave, service hours, water conservation, remote work and similar: out.
     - The governor's page labels both the AI order (October 6) and the November 6 flooding order '2026-08'; the flooding order's file name says 2026-09. Not an IT order.
     - Herbert-era orders 2016-1 and 2020-76 (Rescinding Prior Executive Orders) were read: they name no IT order. Leavitt-era orders on the
       Electronic Commerce Council (1999), telecommunications purchasing (1998) and the Wireless Interagency Network (1996), and Walker's
       2003 Wireless Integrated Network Board (superseded 2007): telecom or obsolete, titles only. Out.
     - A governor's Pro-Human AI Initiative of December 2025 is mentioned in order 2026-08; no separate instrument was found.
- text: |-
    Statewide IT policy library. The Division of Technology Services' /policies page no longer exists (https://dts.utah.gov/policies redirects to /get-help/).
    Its Get Help page offers state employees "Enterprise Policies" only through the IT Service Portal marked "Sign In Required" (services.dts.utah.gov answers
    the Fetcher with a sign-in application page, HTTP 200). No list of those policies is public, so they cannot be reconciled row by row; they are not seeded. Titles known only from citations
    (text behind the sign-in portal, not fetched; no url to stub): DTS Policy 1000-0002 (Establishing and Updating DTS Policies and Administrative Rules), cited by the fetched policies,
    and DTS Policy 3000-0001 (Acquisition of Goods and Services), cited by the committed text of 5000-0002. Other enterprise policies exist and their titles are unknown.
    The public subset is the Google Drive folder of ten items, reconciled row by row:
     - 1000-0003 Acceptable Use, 1000-0019 Vendor SLA Standards, 2000-0014 Background Investigations, 4000_0008 Enterprise Generative AI,
       5000-0002 Information Security: seeded.
     - 2000-0001 Code of Conduct: the Google Doc holds only a link to govops.utah.gov/policies/01-code-of-conduct/, whose page offers a PDF of the
       Department's conduct policy; human resources, not IT. Out.
     - 2000-0017 Drug Free Workplace: human resources. Out.
     - Three items whose shortcut says 'Original item deleted.' (Drive ids 1NBYhF_5Mai0E89x1R3MiDEyDfi-aWNJW, 132ujR20_TsxGvEIP9bsTqcb9-pUmTgjj,
       1kE0DJtISFzcPaQpnL2xKttUA6KQC2J2H): the folder bytes name them next to their ids as the Drive item names '4000-0002_Policy_EnterpriseUserAuthenticationStandards',
       '4000-0003_Policy_Internal_SoftwareDevelopmentLifeCycle' and '4000-0004_Policy_Internal_ChangeManagement'; the shortcut view answers HTTP 401 (Refused).
       Stubs ut-dts-4000-0002, -0003 and -0004 (titles are Drive item names, not printed titles).
     - The Google Docs are live documents: an edit by the Division changes the export, and the drift run will report it.
- text: |-
    Other official pages read and left out as not instruments: the DTS Artificial Intelligence page (goals and activities, no requirements), Strategic Plan,
    Services We Offer (FY2027 rates PDF is a rate sheet), the GovOps site, and the Office of Data Privacy site (privacy.utah.gov). The Office's Privacy Program Framework
    version 2.1 (37-page PDF, https://privacy.utah.gov/wp-content/uploads/Privacy-Program-Framework-2.1-1.pdf, read in part) is a resource the Office
    offers entities under 63A-19, in two-column layout; it presents itself as guidance. Borderline; OWNER DECISION. Its templates (privacy policy,
    notices, data sharing agreement, incident response, privacy impact assessment), the maturity model spreadsheet and infographics are forms and
    guidance, not instruments.
