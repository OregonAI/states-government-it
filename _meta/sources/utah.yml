    stub: true
    stub_reason: "The Office of Administrative Rules' Utah Administrative Code page (https://rules.utah.gov/publications/utah-adm-code/) redirects the Fetcher to the eRules application at https://adminrules.utah.gov/ (HTTP 200, 158,351 bytes): a JavaScript application shell with no rule text; its /Code page is the same shell, and the two rule-page paths tried (/public/rule...) answered HTTP 404. The url is the application's /Code page, whose shell is the same; the #fragment only keeps each seed url unique and is not a rule address. The Office documents no bulk file or API for the code's text (it offers monthly ZIP archives of only the rules changed that month, and annual Index of Changes spreadsheets). The number and title are copied from fetched bytes (cited by DTS Policies 1000-0003 and 5000-0002); the rule's text and current status could not be read."
