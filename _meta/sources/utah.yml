# Utah seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Built 2026-11-12 from bytes fetched through the toolkit Fetcher. The seed list is pre-approved for this run
# (owner's standing exception) and reviewed afterwards in the PR.
sources:

  # ---- Statutes: the Utah Code, the Legislature's per-chapter XML (le.utah.gov). Each chapter page's "Download Options"
  # ---- link to PDF, RTF and XML files whose names carry the version (C<title>-<chapter>_<version>.xml); the entry points at the
  # ---- current version's XML. When a chapter is amended the Legislature publishes a new file name, so the drift run reports
  # ---- the old name as gone and the entry is re-pointed (the chapter page lists the current version).
  - id: ut-code-63a-16
    sha256: "6b4167499b9d1f92061c1c86ec10c3397abb1bfc719f10f5a40c04f2e93c4162"
    url: https://le.utah.gov/xcode/Title63A/Chapter16/C63A-16_2026050620260506.xml
    format: xml
    citation: "Utah Code chapter 63A-16"
    title: "Governance Of Technology"
    doc_type: statute
    jurisdiction: utah
    issuing_body: "Utah Legislature"
    found_via: "https://le.utah.gov/xcode/Title63A/Chapter16/63A-16.html (its Download Options links)"
    tags: [governance, oversight, funding, cybersecurity, data, digital-services, cloud-resilience]
    recheck: monthly
    why_relevant: "The enabling statute of the Division of Technology Services and the state chief information officer: the Division and its duties (63A-16-103, -104), the CIO's appointment, powers and the executive branch IT strategic plan (63A-16-201, -202), agency IT plans (-203), rulemaking and policies (-205), accessibility standards for executive branch IT (-209), the chief information security officer (-210), the Utah Cyber Center (part 11, 63A-16-1101 to -1104), and critical infrastructure cyber security (part 13). The chapter file serves the whole chapter, so its geospatial resource center and public notice website parts (parts 5 and 6) come with it. Section 63A-16-216 (government websites and applications) is in the file with an effective date of 1/1/2027, printed under its heading: it is not yet in force."
  - id: ut-code-63a-19
    sha256: "1d921197d8224df0ba06514a6314eed9dc0dfca845d2a66528960fe7e0378e49"
    url: https://le.utah.gov/xcode/Title63A/Chapter19/C63A-19_2024050120240501.xml
    format: xml
    citation: "Utah Code chapter 63A-19"
    title: "Government Data Privacy Act"
    doc_type: statute
    jurisdiction: utah
    issuing_body: "Utah Legislature"
    found_via: "https://le.utah.gov/xcode/Title63A/63A.html (chapter list of Title 63A) and the chapter page https://le.utah.gov/xcode/Title63A/Chapter19/63A-19.html"
    tags: [data, governance, cybersecurity]
    recheck: monthly
    why_relevant: "Binds governmental entities: the state data privacy policy, the Utah Privacy Governing Board and Commission, the Utah Office of Data Privacy and chief privacy officer, entity duties (privacy annotations, training, privacy program report, contractor requirements, privacy notices, retention and disposition of personal data), data breach notification to the Cyber Center and the Attorney General, and the technology transparency study. Defines automated decision making and names it among the high-risk processing activities."
  - id: ut-code-63a-20
    sha256: "57229412b430925c35d547630bfb25007ef42c534c47729ce737d16ecceaeb38"
    url: https://le.utah.gov/xcode/Title63A/Chapter20/C63A-20_2026050620260506.xml
    format: xml
    citation: "Utah Code chapter 63A-20"
    title: "State-Endorsed Digital Identity"
    doc_type: statute
    jurisdiction: utah
    issuing_body: "Utah Legislature"
    found_via: "https://le.utah.gov/xcode/Title63A/63A.html (chapter list of Title 63A) and the chapter page https://le.utah.gov/xcode/Title63A/Chapter20/63A-20.html"
    tags: [digital-services, data, governance]
    recheck: monthly
    why_relevant: "The state-endorsed digital identity program: its creation and duties, the program manager, identity proofing, and the requirements on governmental entities (63A-20-304), with the duties it also places on digital wallet providers, verifiers and relying parties."
  - id: ut-code-63c-27
    sha256: "9821bc3a91f4957017707fa3a17220376a829a23b3218260a7cbe880529e80d6"
    url: https://le.utah.gov/xcode/Title63C/Chapter27/C63C-27_2022050420220504.xml
    format: xml
    citation: "Utah Code chapter 63C-27"
    title: "Cybersecurity Commission"
    doc_type: statute
    jurisdiction: utah
    issuing_body: "Utah Legislature"
    found_via: "https://le.utah.gov/xcode/Title63C/63C.html (chapter list of Title 63C) and the chapter page https://le.utah.gov/xcode/Title63C/Chapter27/63C-27.html"
    tags: [cybersecurity, governance]
    recheck: monthly
    why_relevant: "Creates the Cybersecurity Commission, its duties, staffing and reporting requirement. The file carries a repeal date of 7/1/2032 (63I-1-263)."

  # ---- Executive orders in force on state IT, cybersecurity, data or AI (Governor Cox: governor.utah.gov list and the Office of
  # ---- Administrative Rules' Executive Documents list, both read 2026-11-12; see left_out for every other order)
  - id: ut-eo-2026-08
    sha256: "9edf9b9c7c11029c4a1aacdc3ed02f0b5821287af4afd6cd75e44620ac5df073"
    url: https://governor.utah.gov/wp-content/uploads/2026.10.06-Pro-Human-AI-Executive-Order-1.pdf
    format: pdf
    citation: "Executive Order 2026-08"
    title: "Establishing Utah’s Pro-Human Approach to Artificial Intelligence in State Government"
    doc_type: executive_order
    jurisdiction: utah
    issuing_body: "Governor Spencer J. Cox"
    found_via: "https://governor.utah.gov/executive-orders/ (the October 6 row)"
    tags: [ai, governance, cybersecurity, digital-services]
    recheck: monthly
    why_relevant: "Governor's order of 6 October 2026 on state government use of AI: Pro-Human AI principles that agencies must apply, the Department of Government Operations' lead on AI-driven process improvement and technical safeguards against cyberattack and unauthorized AI agents, the State-Endorsed Digital Identity framework, agency duties (AI literacy training, transparency about AI use in processes that affect the public), and DTS duties (training strategy, uniform AI implementation standards). Effective until modified, amended, rescinded or superseded."
  - id: ut-eo-2022-06
    url: https://rules.utah.gov/wp-content/uploads/Utah-Executive-Order-No.-2022-06.pdf
    format: pdf
    citation: "Executive Order 2022-06"
    title: "Prohibiting the Use of TikTok by State Agencies and on State-owned Electronic Devices"
    doc_type: executive_order
    jurisdiction: utah
    issuing_body: "Governor Spencer J. Cox"
    found_via: "https://rules.utah.gov/publications/executive-documents/ (row of 12/12/2022, 'Utah Executive Order No. 2022-006'); the PDF prints 2022-06. The Governor's own list (https://governor.utah.gov/executive-orders/, Dec. 12, 2022 row) links a second official copy, Google Drive file 1g9JMD1bOvC84gvp4I0ZFiOii1XvwGBJu (https://drive.google.com/file/d/1g9JMD1bOvC84gvp4I0ZFiOii1XvwGBJu/view, titled 'EO 2022-06 TikTok.pdf')"
    tags: [cybersecurity, data, governance]
    recheck: monthly
    why_relevant: "Bars state agencies, their employees and their contractors from using TikTok on state-owned electronic devices, and directs the Department of Government Operations to investigate vulnerabilities TikTok presents to state networks. Effective until modified, amended, rescinded or superseded; not named by the rescission orders read."
    stub: true
    stub_reason: "The PDF is a scan whose embedded text layer is a poor machine reading of the page (the header prints as 'jftnttr l', and the body has 'ofusers', 'E1-l-l02' for 63E-1-102, '11.' and 'I.' for list markers), so it is not a faithful text; and the corpus's OCR procedure refuses a PDF that already has a text layer (ocrmypdf: PriorOcrFoundError, which needs --force-ocr). Re-reading it needs a shared change to src/ingest_ocr.py. The Governor's Google Drive copy (view page HTTP 200, 92,289 bytes, titled 'EO 2022-06 TikTok.pdf') was also fetched through the Fetcher by its visitor download link (https://drive.google.com/uc?export=download&id=1g9JMD1bOvC84gvp4I0ZFiOii1XvwGBJu, HTTP 200, 482,114 bytes): it is the same file as the rules.utah.gov PDF, byte for byte (identical SHA-256 5ee59a69733cdfcec367722a6b1baad92b130b27ac6081294b54f695570c84b9), so it has the same scan and text layer and offers no better text."
  - id: ut-eo-2001-12-11-cio-security
    url: https://rules.utah.gov/wp-content/uploads/ExecDoc6939.pdf
    format: pdf
    citation: "Executive Order, issued 12/11/2001"
    title: "Directing the Chief Information Officer to Develop and Implement Policy Promoting Security of State Information and Information Systems"
    doc_type: executive_order
    jurisdiction: utah
    issuing_body: "Governor Michael O. Leavitt"
    found_via: "https://rules.utah.gov/publications/executive-documents/executive-documents-of-michael-o-leavitt/ (row 'issued 12/11/2001 ... [published 01/01/2002]'); DTS Policy 2000-0014 cites it as authority"
    tags: [cybersecurity, governance]
    recheck: monthly
    why_relevant: "Governor Leavitt's order directing the state chief information officer to develop and implement policy promoting the security of state information and information systems. DTS Policy 2000-0014 cites it as the CIO's authority for security policy."
    stub: true
    stub_reason: "The Office of Administrative Rules' own link to this order (/wp-content/uploads/ExecDoc6939.pdf, read from its Leavitt executive documents page 2026-11-12) answers HTTP 404 to the Fetcher on two tries; no other official copy was found. The order is not on any rescission list read (the Herbert-era rescission orders 2016-1 and 2020-76 were read and name neither this order nor any IT order), so it may still be in force."

  # ---- Statewide IT policy library: the Division of Technology Services' public set. dts.utah.gov/policies now redirects to its
