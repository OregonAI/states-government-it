  identity_text: 715C.1 Definitions.
  found_via: Iowa Code chapter 715C (https://www.legis.iowa.gov/docs/code/715C.pdf, fetched, 2 sections). Found by reading its definition of 'person' (715C.1(10)), which includes 'government; governmental subdivision, agency, or instrumentality'.
  why_relevant: 'The breach notification statute. It is seeded because it expressly binds state agencies: 715C.1 defines ''person'' to include a government and a governmental subdivision, agency or instrumentality, so an agency that owns or licenses computerized personal information must notify consumers of a breach (715C.2). It also binds private persons, which are out of scope; the chapter is two sections and is taken whole. OWNER DECISION whether a general breach statute that binds agencies and businesses alike belongs.'
