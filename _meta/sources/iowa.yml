left_out:
- text: '---- Iowa: found and left out (each was seen in bytes fetched through the toolkit Fetcher on 2026-11-11 unless it says it was seen only in a web search; the reason is recorded here)'
- text: 'Where Iowa''s IT law and policy sit (so the reconciliation below can be checked): the Office of the Chief Information Officer was folded into the Department of Management by 2024 Acts, ch 1185. Iowa Code chapter 8B (Information Technology) now prints only ''Provisions of chapter repealed or transferred to chapter 8, subchapters II and XI, by 2024 Acts, ch 1185, sections 83, 85'' (https://www.legis.iowa.gov/docs/code/8B.pdf, fetched, one page; watched, not a document). The IT statute is chapter 8 subchapter XI (8.76 to 8.93). The OCIO web site ocio.iowa.gov is now the Department of Management''s. Its rules remain in the Administrative Code under ''Chief Information Officer, Office of the [129]'' and still cite chapter 8B.'
- text: 'Iowa Code chapter 8 sections left out (the chapter''s section index https://www.legis.iowa.gov/law/iowaCode/sections?codeChapter=8&year=2026 was read in full): 8.79 Targeted service areas, 8.86 Fiberoptic network conduit installation program, 8.87 Broadband permitting process and 8.91 Empower rural Iowa broadband grants (subchapter XI, but broadband is out of scope in _meta/domain.yml); every section of subchapters I, III to X and the rest of subchapter II except 8.5 (budget, appropriations, funds and grants: not IT; 8.5 is seeded because it holds the CIO designation and the cybersecurity duty, see its entry). 8.6 ''Specific powers and duties'' is printed as repealed by 2024 Acts, ch 1185, section 83. The sections were seeded one by one from the Legislature''s per-section PDFs, so no other section of chapter 8 rides along; the whole-chapter PDF (https://www.legis.iowa.gov/docs/code/8.pdf, 112 pages, fetched) was read only to find the IT sections.'
- text: 'Iowa Code chapter 554G (Cybersecurity programs, an affirmative defense in tort actions: https://www.legis.iowa.gov/docs/code/554G.pdf, fetched): it governs private covered entities'' liability; 8.93(2) says a state or local entity that complies with it is deemed a covered entity. Left out as a private-sector liability statute; 8.93 (seeded) carries the state-facing rule. Iowa Code chapter 8A (Department of Administrative Services: https://www.legis.iowa.gov/docs/code/8A.pdf, fetched and searched for ''information technology'', ''cyber'' and ''software'': no IT provision; its hits are electronic access to documents and electronic purchasing format). Iowa Code chapter 22 (public records, fetched) was not read for IT content and is not seeded.'
- text: 'Artificial intelligence, statutes: none found that binds state agencies. List read: the Legislative Services Agency''s Legal Background Briefing ''State of Artificial Intelligence Laws'' (June 2026, https://www.legis.iowa.gov/docs/publications/BF/1607981.pdf, fetched, read in full), which says Senate File 2417 (2026 Iowa Acts, ch 1068, Iowa Code chapter 554J) is the General Assembly''s first law that directly addresses AI and describes it as requirements for operators of conversational AI services (private operators: out of scope, so not seeded); it names no enacted law on AI use by government agencies and says the General Assembly ''considered legislation related to ... the use of AI by government agencies''. A bill on a state AI inventory (Senate Study Bill 3014) and House File 2199 were seen only in web-search results and the briefing''s footnote, not in bytes of a bill text, and bills not enacted are out of scope. The only state-agency AI instrument found is the Department of Management''s Generative AI Policy (seeded).'
- text: 'Administrative rules, reconciled row by row. Agency table https://www.legis.iowa.gov/law/administrativeRules/agencies (read: ''Chief Information Officer, Office of the[129]'' is the only IT agency row). Agency [129] (https://www.legis.iowa.gov/docs/iac/agency/129.pdf, fetched, analysis read in full): chapters 1 to 7 are rescinded or reserved (office procedures, records, petitions, declaratory orders, rule making, contested cases, waivers; rescinded effective 2/25/26 and 2026 Iowa Acts, Senate File 2463); chapter 8 and chapter 10 are seeded; chapter 9 is reserved; chapters 20 (Broadband infrastructure, targeted service areas), 21 (Broadband infrastructure, project certification) and 22 (Broadband grants program) are broadband and left out. Administrative Services Department [11] (https://www.legis.iowa.gov/docs/iac/agency/11.pdf, fetched, table of contents read): its Title II ''Information Technology'' is listed as chapters 20 to 34 reserved; nothing seeded. Management Department [541] (https://www.legis.iowa.gov/docs/iac/agency/541.pdf, fetched, analysis read: chapters 1 organization, 8 public records and fair information practices, 11 grants enterprise management, 12 DAS customer council, 13 suspension and reinstatement of state funds): no IT chapter; nothing seeded. Other agencies'' rules were not searched for IT content (the Administrative Code has about 80 agencies).'
- text: 'Executive orders, reconciled. List: the Legislature''s page of all governors'' orders (https://www.legis.iowa.gov/publications/otherResources/executiveOrders, 247 rows read, with the ''Description'' and ''Further Disposition'' columns). Only the descriptions were searched, by keyword (technolog, cyber, informat, data, comput, artificial, digital, network, software, internet, security, innovation, efficien, app, broadband, website, electronic), and every hit was read; an order whose description does not use those words was not read. SEEDED (no recorded further disposition; the Legislature''s list is the status of record): Reynolds 18, Branstad 87, 73, 61, 66, Culver 26 (the older five are OWNER DECISIONS, see each entry). LEFT OUT: Reynolds 12 (February 10, 2025, Department of Government Efficiency Task Force: its scope is government efficiency and it asks the task force to evaluate AI and automation, a one-line mention; it expires on submission of a final report and whether it was submitted is not shown; OWNER DECISION), Branstad 65 (1998, Iowa Geographic Information Council: GIS coordination; read; OWNER DECISION whether GIS is IT governance), Reynolds 11 (June 6, 2024: rescinds or amends about 65 older orders; its text was read as a scan (discovery) and does not list 87, 73, 66, 65, 61 or Culver 26; it is not itself an IT instrument). The list holds no order, under any number, on generative AI. The Governor''s directive of 2025-02-19 to the Department of Management on state use of RedNote, Lemon8 and DeepSeek was seen only in news reports found by web search (a directive, not a numbered order, like the TikTok directive of 2022-12-13 that standard 1056 implements); its text was not found on governor.iowa.gov or ocio.iowa.gov, and 1056 (12/14/2022) names only TikTok, so the directive''s text is not published in the standards library; nothing is seeded for it. OWNER DECISION / lead for a reviewer: whether to look for the directive''s text through a records request. Older orders on IT that the list records as rescinded or repealed (Branstad 18 and 33, Vilsack 3, Culver 20) are out by the in-force rule. The orders'' PDFs are scans read by OCR: see each entry.'
- text: 'OCIO standards library (https://ocio.iowa.gov/standards, read in full), reconciled row by row: 29 PDF links in 8 table sections (Data Backup 1, Security 18, Internet and Web 4, Platform Architecture - Hardware 1, Desktop 2, Taxonomy 1, Project Governance 2). 27 are seeded (ia-ocio-1027 to 1056, except the two below). LEFT OUT: media 1031, the FAQ to the Email Security Standard (FAQ dated February 9, 2012: an explanatory document, not an instrument) and media 1035, ''Agency Enterprise Information Security Standards Status Report 2012'' (a blank report form to be returned to the Information Security Office: a form). The index''s ''Policy PDF'' column holds no link on any row; its note says such a link would supersede the standard, so none is superseded. Every standard is old (2008 to 2017, one of 2022); the index still lists them all as the ''Enterprise IT Standards'', so they are seeded; several cite bodies and Code sections that no longer exist (for example the Technology Governance Board and section 8A.204): OWNER DECISION whether the oldest are kept. The standards'' ''web version'' pages (about 27 pages such as /data-backup-standard) repeat the PDFs; two were read (Data Backup, Project Governance) and match the PDF''s opening; none is seeded separately. Library filter: none, every row taken.'
- text: 'State of Iowa policy portal (https://policies.iowa.gov/search/?agency=1, ''State of Iowa'' scope): ''4 policies found. Showing 1-4. Page 1 of 1''; all four are the Department of Management''s and all four are seeded. The agency menu lists 18 agencies; the Department of Administrative Services scope (?agency=4) returned ''No policies''; the other 16 agencies were not each fetched, and the State of Iowa scope, which rolls up the agencies, shows only these four. The policy ''Department of Management Procurement and Contract Signing Policy'' lists one attachment, SignaturePolicyComms.pdf (94.4 KB); the portal link (/policies/<slug>/documents/3/download/) answered with the portal''s HTML page, not a PDF, so the attachment could not be read and is left out. Each policy''s PDF version (/pdf/) is generated anew at every request (two fetches of one policy differed by one byte), so the policies are taken from their HTML pages.'
- text: 'Pages of the OCIO site read and left out as not instruments: (a) IT Procurement - Contracts, Sourcing and Vendor Management and its sub-pages (Terms & Conditions and Forms; Information Technology Master Agreements; Vendor Information; IT Governance Initiation Process): contract templates, forms and guides, not instruments: IT General Terms and Conditions rev. 7.1.2026 (Word), IT Business Associate Agreement, IT Qualified Service Organization Agreement, Federal Certifications, Sole Source Justification Form, Emergency Procurement Justification Form, DOM Statement of Work Template, Statement of Work Guidance, Contract Negotiation Reference Guide, Vendor Quarterly Report Template, IT Master Agreements Guide, two ServiceDesk Plus how-to guides. OWNER DECISION whether the IT General Terms and Conditions (the terms a vendor under a state IT contract accepts) belong, since a vendor under a state contract is within the inclusion test; they are a template and a Word file and are not seeded. (b) ''General Terms and Conditions of Cybersecurity Services'' (media 193): the terms on which the department sells cybersecurity services to entities; a service contract. (c) Enterprise IT Plan - March 2025 (media 797), the 2019 Cyber Security Strategy (media 241), the FY23 Internal Services Report (media 240) and the IowAccess annual reports on the Reports page: strategy documents and reports. (d) Strategic IT Consolidation page, Help for Iowa Constituents, Cybersecurity page (an incident-report Google form and links): no instrument. (e) Archived Documents (https://ocio.iowa.gov/archived-documents, 2 pages read, 25 items) and Proposed Rules & Regulatory Analyses (2 pages read, 21 items, one more on the Code, Rules & Policies page): regulatory analyses and red tape review reports of rule making for chapters 129-1 to 7, 541, 543, 545 and 547, rule-making records. (f) Broadband, Lean Enterprise, Local Government, State Budget, Boards & Committees and Data & Analytics sections: not IT governance or out of scope.'
- text: 'The Governor''s own list of executive orders (https://governor.iowa.gov/meet-governor-kim-reynolds/executive-orders, fetched through the Toolkit Fetcher on 2026-11-11 and read): Reynolds orders 1 to 20 are listed with a one-line description each. No in-scope order beyond those seeded: Order 19 (Iowa Office of Outdoor Recreation) and Order 20 (Iowa Medicaid Fraud Elimination Task Force) are out of scope. Order 18 is on both lists. Press releases on governor.iowa.gov that web search returned (for example a June 2026 item on moving state IT to the cloud) were not fetched and nothing is claimed from them.'
- text: 'Digital Asset Policy (ADMN.302.01.D): the seeded Digital Accessibility Policy (ADMN.303.02.E) names it as the policy that ''governs how websites are built and operated and sets the required Public-Facing Notices''. It is not in the portal''s State of Iowa list (4 rows, all read) and the pattern-built URL https://policies.iowa.gov/dom/policy/digital-asset-policy/ answered HTTP 404 through the Fetcher on 2026-11-11 (the address is a guess from the portal''s slug pattern, not copied from an index). Left out: not found. OWNER DECISION: whether to seek it; and whether it supersedes ia-ocio-1048 (Web Site Policy Notices, 2017) and ia-ocio-1047 (Web Content Management System, 2015), and whether the 2026 Digital Accessibility Policy supersedes ia-ocio-1049 (Website Accessibility, 2017). None of these questions is settled by the bytes read; all three standards stay seeded as the index lists them.'
