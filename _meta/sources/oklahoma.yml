  stub: true
  stub_reason: 'The Governor''s own news release of the AI task force (September 2023) links the order at this Secretary of State address. The Fetcher got HTTP 200 and 234,665 bytes of text/html (the Secretary of State''s site page, not a PDF; the same bytes came for the 2066.pdf address in the March 2023 continuance release), so the order''s text was not served. The Secretary of State''s executive order database (https://execleg.sos.ok.gov/ExecOrders.html, 20,884 bytes) prints ''Loading records...'' and fills from a script, whose endpoint is not a page a visitor''s link points to and was not called. The order''s content (the Governor''s Task Force on Emerging Technologies on AI and generative AI; each agency to name an AI expert; a task force report due December 31, 2023) is known only from search results and the Governor''s release and was not read in bytes. OWNER DECISION: whether a task-force order whose report was delivered December 29, 2023 is still in force; orders of a Governor terminate 90 days after the next Governor''s inauguration unless continued (75 O.S. 256, printed on the database page).'
  why_relevant: 'The Governor''s executive order on government use of AI: it created a task force to study AI and generative AI in the executive branch and told each state agency to name an AI expert.'
