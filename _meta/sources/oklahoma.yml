# Oklahoma seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Discovery 2026-11-12 through the toolkit Fetcher: the OMES Information Services policy library and its pages (oklahoma.gov/omes),
# the OMES Laws & Rules page, the Legislature's statute index and title PDFs, OSCN's statute index and section pages, the Secretary
# of State's executive order pages, the Governor's pages. robots.txt of oklegislature.gov and oscn.net disallow every path for every
# agent and rules.ok.gov's carries content signals (ai-train=no); docs/spec.md sets robots aside for the pilot and the Fetcher does not enforce it.
