  recheck: monthly
  slice: {section_start: '34.43', section_end_before: '34.44'}
  why_relevant: Requires all state agencies to submit their detailed information technology budgets to the Chief Information Officer of OMES for approval; disbursements for those expenses are budgeted to and made from a special allotment account created by the Director of OMES; the section does not preclude agencies from programming and expending intra-agency data processing costs for cost allocation. OMES's index lists it as 'State Agencies' Submission of Information Technology Budgets to Office of Management and Enterprise Services - Disbursements'.
  currency_note: 'Section 34.43 was last amended by Laws 2026, c. 184, § 8 (HB 3944), eff. Sept. 1, 2026: the enrolled bill (https://www.oklegislature.gov/cf_pdf/2025-26%20ENR/hB/HB3944%20ENR.PDF, fetched 2026-11-12) amends 34.43 in its section 8 and says ''This act shall become effective September 1, 2026'', and the PDF prints the amended text. Currency, checked 2026-11-12 from the Legislature''s own bytes fetched that day: its statutes index (https://www.oklegislature.gov/osStatuesTitle.html) says ''The Oklahoma Constitution and Oklahoma Statutes were last updated on November 12th, 2026'', and the Title 62 PDF was created 2026-11-10 (Last-Modified Wed, 11 Nov 2026 04:58:13 GMT; 820 pages) and prints the 2026 session''s amendments (Laws 2026). The ingester refuses a slice that prints an amendment note with an effective date later than the day it runs, so no section here is a version that has not yet taken effect. OSCN, the other official copy, answered the Fetcher''s requests with a Turnstile challenge (HTTP 201, ''OSCN Turnstile'') and was not used.'
