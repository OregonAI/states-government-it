left_out:
- text: '---- Oklahoma: found and left out (each was seen on an official page on 2026-11-12; the reason is recorded here)'
- text: |-
    OMES statewide IT policy and standards library (https://oklahoma.gov/omes/divisions/information-services/about-information-services/policy-and-standards.html, 271,538 bytes, read in full). Every item was reconciled:
     - Standards tab, nine groups, 138 distinct linked PDFs (Administration 4, Applications and Data 29, Enterprise Systems 4, IT Accessibility 1, IT Enterprise Governance 17, IT Operations 5, Network and Servers 15, Security 52, Workplace Services 11): 134 are seeded as documents, 3 as stubs (CONFIDENTIAL placeholders) and 1 (the Election Technology Standard, also a CONFIDENTIAL placeholder) is left out as out of scope, below. All 138 PDFs were fetched through the Fetcher (HTTP 200) and every page of each has a text layer (checked page by page with pdftotext). The page prints a second link behind the '(PDF)' label of 7 rows (Caching, Cross-channel Communications Marketing Solutions, Data Storage, Development - Continuous Integration and Continuous Delivery, DevOps, Digital Public Facing Identity and Graphic Design Software) that points at GiantITProjectMgmtStandard.pdf, not at the row's own file; the row's title link names the right file, and the title links were taken. The Enterprise Reference Architecture row links the site https://reference-architecture.ok.gov/ (an architecture reference, not an instrument; the Reference Architecture Standard row is seeded); the Enterprise Governance page's 'Enterprise Reference Architecture Map' (PDF) and accessible Word version are architecture diagrams and are left out.
     - Policies tab, 5 rows: all 5 seeded.
     - Statutes tab: a sentence naming 62 O.S. 34.11.1 through 34.33, 62 O.S. 35.1 through 35.9 and OAC Title 260 chapter 115; the first two are seeded as documents narrowed to the sections shown in force, the third is seeded; see the Statutes item below.
     - Administration tab, 32 PDFs: the quarterly 'Progress Report on Unification' reports of fiscal years 2012 to 2019 (29) and the IT and Telecommunications annual reports of 2009, 2010 and 2011 (3). Reports, not instruments: left out.
     - Standards that are not about IT as such but are in the library: 'Election Technology Standard' (a one-page CONFIDENTIAL placeholder; left out, not a stub, because election systems are out_of_scope in domain.yml), 'Lottery Technology Standard' and 'Intelligent Transportation System Standard' (CONFIDENTIAL placeholders, stubs), 'HR Investigation Standard', 'Background Check Standard', 'International Travel Standard' (personnel-adjacent standards on the Security list; seeded because OMES lists them as CIO standards, OWNER DECISION), and 'Statutory Reporting Collection Process Standard'.
- text: 'Other OMES Information Services pages read, and what they hold: IT Procurement (links the delegation memorandum, seeded; the IT Strategic Plan 2026-2028 (a 30,181,110-byte strategy document, not an instrument, fetched and left out); the Enterprise Reference Architecture Glossary and the Security Certification workbook (.xlsx, forms); ''OMESSNSMPolicy.pdf'', the OMES Social Networking and Social Media Policy OMES-006 of 2019 (effective 11/01/2019, next scheduled review 11/01/2021, a policy for OMES''s own staff; the library lists the 2026 Guidelines instead; left out as superseded in practice, OWNER DECISION)); IT Statutory and Regulatory Reporting (links the CIO memorandum, seeded, and a training .docx, three worksheet .xlsx files and the Telecommunications Plan form PDF: forms and workbooks, left out); Cyber Command pages (cybersecurity measures, notices, training and newsroom pages were listed and not treated as instruments; the Prohibited and Permitted Technology tables are watch pages); the FAQ and the CIO and IT-unification history pages (not treated as instruments).'
- text: 'Administrative rules: OMES''s Laws & Rules page (https://oklahoma.gov/omes/about-omes/laws-and-rules.html, 278,685 bytes) lists five Title 260 chapters as PDFs. Seeded: chapter 15 (Accessibility of Information Technology, a document with a currency note, OWNER DECISION) and chapter 115 (Procurement, whose Part 9 is IT acquisitions; a stub, because OMES''s own April 2024 copy shows amendments the chapter PDF lacks and the two texts differ in substance; if it is taken later, the rest of the chapter rides along, OWNER DECISION). Left out as not IT: chapter 1 (Administrative Operations, 2 pages), chapter 5 (County Community Safety Investment Fund Rules) and chapter 10 (Prompt Payment to Vendors and Employees). The PDFs print ''Codified 9-11-06'' (chapters 1 and 15) and show 2022 modification dates; OMES''s page, last modified Sep 18, 2025, is the only currency evidence: the official rules portal https://rules.ok.gov/ answered the Fetcher HTTP 403 on ''/'', ''/home'' and ''/code'' (the Fetcher was built with the toolkit''s curl-on-challenge option, which it uses only for a challenge page; a plain 403 is a refusal and was recorded as one), so the portal''s current text was not read and the PDFs'' currency is unverified (OWNER DECISION). Chapter 115 was compared word by word with the April 2024 compilation: the compilation adds the amendment note ''amended at 39 Ok Reg 1163, eff 9-11-22'' (260:115-1-1 and 260:115-7-3) and differs in text (supplier notification, bid-bond subsection headings, verification of registration with the Secretary of State; the 9-11-22 amendment is the latest in the chapter), so the chapter PDF is stale. Chapter 15 is not in the compilation and could not be compared. OMES also posts ''CentralPurchasingAdminRules.pdf'' (46 pages, ''Last revised April 11, 2024'', which says of itself ''This is an unofficial copy of the Administrative Rules ... superseded by the official rules available at the Oklahoma Rules Portal''): not used as text of record and left out; it adds chapters 120 (State Use Program) and 85 (Recycling), not IT. Other agencies'' rules on IT (for example higher education or the Department of Public Safety) were not searched. The pages say ''All proposed rules for OMES may be found on the State of Oklahoma''s Online Filing System'' (not read).'
- text: 'Statutes. Eight entries, taken from OMES''s named ranges: 62 O.S. 34.11.2 to 34.31.2 (OMES names 34.11.1 through 34.33; narrowed, see below), 35.1 to 35.8 (Information Technology Consolidation and Coordination Act; seeded as 35.1 to 35.9, narrowed), 34.202 to 34.210, 34.43, 36 (a stub), 41.5a-4, and 74 O.S. 3106.3 to 3106.4 and 3113.1. Seven are documents cut from the Legislature''s per-title PDFs; the first two were chosen from December 2025 editions and re-measured against the November 2026 ones. They were chosen from the Legislature''s Title 62 and Title 74 PDFs (read in full as text, December 2025 editions), OSCN''s index of Titles 62 and 74 (headings read), OMES''s own ''IT Procurement-Related Statutes in Title 62'' page (34.11.1 to 34.31.2 and 35.4) and OMES''s Laws & Rules page. Cybersecurity statutes for state systems are in those entries: 34.32 (standard security risk assessment; left out, below), 35.8 (security standards), 34.11.10 (security breach transparency) and 74 O.S. 3113.1 (breach disclosure by state agencies). Left out: 62 O.S. 34.3 to 34.10 (OMES''s creation, director and general fiscal powers, listed on OMES''s Laws & Rules page; budget and state finance law, not IT), 34.11 (central accounting), 34.34 to 34.100 (budget, allotment and payment law; 34.43 alone is seeded), 34.200 to 34.201, 34.301 to 34.501, 45.1 to 45.10 (program performance budgeting), 46 to 49 (taxpayer transparency, funds), 62 O.S. 36.1 (Oklahomans Virtually Everywhere Act of 2019; read as a heading only), 41.1 to 41.5a-3 and other renumbered or repealed sections, 74 O.S. 118.1 to 118.17 (Data Processing Planning and Management Act of 1971, all repealed), 74 O.S. 5018 and 5019 (Oklahoma State Data Center, repealed), 74 O.S. 85.41C (database of active contracts: procurement), 74 O.S. 464 and 3602 (electronic filing and reports), 51 O.S. 24A (Open Records Act: out of scope as in the other states), 24 O.S. (the OSCN index of Title 24 printed no act headings and was not searched for a breach act; the breach statute that binds state agencies is 74 O.S. 3113.1, which the Legislature''s PDF prints). IN FORCE, measured 2026-11-12 from the Legislature''s own bytes: its statutes index says the Constitution and Statutes were last updated on November 12th, 2026, and the PDFs (os62.pdf created 2026-11-10, 820 pages; os74.pdf created 2026-11-11, 1,453 pages) print the 2026 session''s acts, so the December 2025 currency gap in the first reading is closed. Where an act takes effect after the PDF is made the Legislature prints the section once, as it will read then: Laws 2026, c. 445 (SB 1877, enrolled bill fetched from the Legislature''s cf_pdf/2025-26 ENR folder: ''This act shall become effective January 1, 2027'') amends 62 O.S. 34.11.1 (its section 131), 34.32 (132), 35.9 (142) and 36 (143), and the PDF prints each only in that January 2027 version (it refers to ''Section 378 of this act''); 34.6, which the PDF prints as two versions, is outside these ranges. Those four sections are therefore not shown to be in force, and no official copy fetched in this run prints the text that is (OSCN, which lists each as a second version, answered its index pages with a Turnstile challenge on 2026-11-12: recorded, not solved or worked around). What was done: 34.11.1 and 34.32 are cut out of the first entry (34.11.2 to 34.31.2), 35.9 out of the second (35.1 to 35.8), and 62 O.S. 36 stays a stub that carries its slice. Left out for that reason: 62 O.S. 34.11.1 (the Chief Information Officer), 34.32 (standard security risk assessment and audit of state systems), 35.9 (quarterly progress reports); each becomes a document once the Legislature''s PDF prints it in force (after 2027-01-01), and 34.11.1 and 34.32 would then need their own entries. SUPERSEDED 2026-11-13: the owner decided that a provision whose own focus is the governance of state IT is in scope as a section slice, so 62 O.S. 34.33 (agreements to administer information technology and telecommunications infrastructure and security; slice 34.33 to 34.34) is now the document ok-62-os-34-33, and 62 O.S. 34.11.1.1 (performance metrics, data sets; the Chief Information Officer''s data sets for data.ok.gov) and 34.11.1.2 (Oklahoma Employment Security Commission Information Technology Innovation Revolving Fund) are now the document ok-62-os-34-11-1-1 (slice 34.11.1.1 to 34.11.1, which the PDF prints before 34.11.1). The ingester refuses a slice that prints an amendment note with an effective date after the day it runs, so a section that has not yet taken effect cannot become a document unnoticed.'
- text: 'AI statutes binding state agencies: none found. Read: the Legislature''s Title 62 and Title 74 PDFs (searched for ''artificial intelligence'' and ''generative'': no hit in either), the OSCN index of Title 74 (act and section headings), and discovery-only web results for the 2024 to 2026 sessions. House Bill 3545 (2026, state agency AI use: prohibited and restricted uses, an annual OMES report) and House Bill 3828 (2024, an OMES inventory of state agency AI systems) are bills; HB 3545''s tracked status stops in committee in February to April 2026 and no enactment was found; HB 3828''s outcome was not found. Bills not enacted are out of scope. A 2026 law on AI in public schools (signed May 12, 2026 per a news result) binds schools, not state IT, and was not read. The state''s AI rules are OMES''s ''Use of AI in Oklahoma State Government Standard'' and ''Use of AI Agents and Agentic Systems Standard'' (seeded), made under the CIO''s authority in 62 O.S. 35.'
- text: 'Executive orders. The Secretary of State''s order database (https://execleg.sos.ok.gov/ExecOrders.html) is script-rendered (''Found 7 total records'', ''Loading records...''; no list in the page) and its feed was not called. Found through the Governor''s and OMES''s own pages: Executive Order 2022-33 (TikTok on government devices; seeded as a document, read from the Governor''s PDF, which carries the Secretary of State''s ''FILED December 8, 2022'' stamp) and 2023-24 (AI task force; stub). The Governor''s March 2023 release ''Governor Stitt Continues 19 Executive Orders'' (read in full) lists the orders continued; of those only 2022-33 concerns IT; 2022-31 (Oklahoma Information Fusion Center) is a homeland security order and was left out. Executive Order 2024-11 (the Governor''s PDF ''Final Draft_China Executive Order.pdf'', HTTP 200, read in full; it directs OMES to run an annual state risk assessment that includes cybersecurity vulnerability, to audit critical procurements and to study vulnerabilities in state critical infrastructure and cybersecurity, and directs the retirement systems to review portfolios) is not seeded: it is a national-security and supply-chain order rather than an IT order, borderline, OWNER DECISION; OMES''s DeepSeek ban cites it. The March 2025 DeepSeek ban itself was a directive and an OMES letter (a PDF behind a tracking link, not read), not a numbered order; it shows in the watched Prohibited Technology table. Whether an order is in force: an order of a Governor ends 90 days after the next Governor''s inauguration unless continued (75 O.S. 256, as the Secretary of State''s page prints it); 2022-33 is on the March 2023 continuance list; whether 2023-24 is still in force is not established. Orders on other topics that mention technology (for example 2019 orders) were not found in any list read. Not every order of the Governor since 2023 was read: the database could not be listed.'
- text: 'Statutes and rules sites: robots.txt was read for oklegislature.gov (Disallow: / for all agents and for ''/*.pdf$''), oscn.net (Disallow: / except /rss/ and /recaptcha/), rules.ok.gov (content signal search=yes, ai-train=no, use=reference; AI crawlers disallowed by name; our agent is none of them) and oklahoma.gov (Allow: /). docs/spec.md item 7 sets robots.txt and no-scrape terms aside for the pilot, and the Fetcher does not enforce it; the owner should know the Legislature''s PDFs and OSCN carry a blanket disallow and rules.ok.gov asks for no AI training use. No terms-of-use page was read for any of these hosts. The Fetcher''s requests to OSCN beyond the first were answered with a Cloudflare Turnstile challenge (measured above): a host that challenges is recorded, not worked around.'
- text: '74 O.S. 13002 (Software used in State Infrastructure; https://www.oscn.net/applications/oscn/DeliverDocument.asp?CiteID=552691): left out, though the Legislature''s November 2026 Title 74 PDF now prints it (section 13002, ''State infrastructure software restrictions - Removal and replacement''), added by Laws 2026, c. 428, § 7, eff. July 1, 2027, so it is not in force on 2026-11-12 and no text of it is current; it prohibits software from a federally banned corporation or a foreign adversary in state infrastructure and exempts a state infrastructure provider that replaces it from further permits. It binds state infrastructure rather than state agencies as such and has not passed the inclusion test. OWNER DECISION whether to seed it once it takes effect.'
- text: |-
    Authority-reference candidates read and declined, 2026-11-13 (owner decision of that day: a provision outside IT law is in scope as a section slice only when its own focus is the governance of state government IT; each statute was read in the Legislature's own title PDF: Titles 51 and 67 fetched through the Fetcher on 2026-11-13, Title 62 re-fetched the same day and byte-identical to the 2026-11-12 snapshot, Title 74 from the 2026-11-12 snapshot):
     - NOT DONE, borderline, OWNER DECISION: 74 O.S. 85.5 (Powers and duties of State Purchasing Director; cited by ok-pol-isd-procurement). Is a sentence that gives the Chief Information Officer sole authority over IT acquisition, inside a general purchasing section, a provision whose own focus is the governance of IT? Subsection A of the Legislature's Title 74 PDF (os74.pdf, created 2026-11-11; fetched 2026-11-12) reads, after the Purchasing Director's general authority: 'In order to carry out the powers and duties of the Chief Information Officer and the Information Services Division, the Chief Information Officer shall have sole and exclusive authority and responsibility for all acquisitions of information and telecommunications technology, equipment, software, products and related peripherals and services by state agencies.' Subsection G.5 lets the CIO designate information technology statewide contracts. Decision 1 names 'who may buy' state IT as qualifying, but the section as a whole (A to G: requisitions, bids, bonds, thresholds, training, audit, statewide contracts) is the Purchasing Director's general authority, so it is not clearly inside the decision and is not seeded. Separately, and not a question of focus: the PDF prints 85.5 twice (version 1, HB 3420, Laws 2026, c. 126, § 1, in force; version 2, SB 1877, Laws 2026, c. 445, § 306, whose act takes effect January 1, 2027), and the slice shape requires a section heading to appear exactly once, so the current slice code cannot cut either version. That is a limitation of the slice code, not a property of the law; it is reported as a shared change needed (multi-version sections).
     - 62 O.S. 34.3 (creation of the Office of Management and Enterprise Services; cited by ok-pol-hipaa-hitech): left out. It creates the whole of OMES in the Executive Department and defines 'state agency' and 'authorization' for the Oklahoma State Finance Act; it says nothing about information technology.
     - 51 O.S. 151 to 172 (cited by nine OMES standards as their authority): left out. These sections are the Governmental Tort Claims Act (151 short title, 153 liability, 155 exemptions, 158 settlement, 163 venue), liability law for the state and political subdivisions generally; 155.2 (state liability for Y2K failure) is one section of it and not the section the standards cite.
     - 67 O.S. 206 and 305 (cited by ok-std-data-classification-security): left out. Section 206 (duties of agency heads under the Records Management Act) requires every agency to keep a records program and to submit retention schedules for records of every kind, defined in section 203 as 'document, book, paper, photograph, microfilm, computer tape, disk ... or other material, regardless of physical form'; it is general records law, not a provision about electronic records or IT. Section 305 composes the Archives and Records Commission. Neither is about the governance of IT by its own focus.
     - NOT DONE, not read: OAC 60:10 (Archives and Records Commission rules; cited by ok-std-data-classification-security). The official text could not be read, so its focus was not judged. The Libraries Department's page (https://oklahoma.gov/libraries/law-legislative-reference/statutes-archives-and-records.html, fetched 2026-11-13) links the Title 60 PDF at oklahomarules.blob.core.windows.net, whose name the Fetcher could not resolve (ConnectError, name or service not known; getent finds no address), and the rules portal rules.ok.gov answered the Fetcher HTTP 403 on 2026-11-12. Nothing was taken from an unofficial mirror. The chapter's table of contents (general provisions, records, optical imaging, audio-video recordings, fees) shows an optical-imaging subchapter on imaging state records, which is a decision-1 candidate (electronic records) once the official text can be fetched.
     - OAC 580:16 (central purchasing rules; cited by ok-pol-isd-procurement as 'OAC Section 580:16'): left out. Title 580 is the old Department of Central Services' number; its rules moved into OMES's Title 260 (chapter 115, the stub ok-oac-260-115, whose own reason stands: the official PDF is out of date and the portal is refused). OMES's per-rule pages (oklahoma.gov/omes/legal/rules/260-115-1-1.html and 260-115-9-1.html) answered the Fetcher HTTP 404 on 2026-11-13. No official text of 580:16 was found, and the chapter is general purchasing law.
