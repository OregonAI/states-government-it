  title: 'Oklahoma Statutes Title 62, Section 34.33: Agreements to administer information technology and telecommunications infrastructure and security'
  doc_type: statute
  jurisdiction: oklahoma
  issuing_body: Oklahoma Legislature
  tags:
  - governance
  - funding
  - procurement
  recheck: monthly
  slice: {section_start: '34.33', section_end_before: '34.34'}
  why_relevant: 'OWNER DECISION 2026-11-13 (a provision whose own focus is the governance of state IT): ''The Office of Management and Enterprise Services is authorized to enter into a multi-year agreement to acquire land, develop, design, construct and furnish facilities necessary for the administration of the state''s information technology and telecommunications infrastructure and security. Such action shall not be subject to The Oklahoma Central Purchasing Act.'' The section also caps the computer-ready space at ten percent of the facility and at 9,000 square feet and lets OMES use fees, appropriations and federal funds to finance it. It is the last section of the range OMES names (62 O.S. 34.11.1 through 34.33); the first seeded range stops at 34.31.2 because 34.32 is not in force in the printed version.'
  currency_note: 'Currency, checked 2026-11-13 from the Legislature''s own bytes: its statutes index (https://www.oklegislature.gov/osStatuesTitle.html) says ''The Oklahoma Constitution and Oklahoma Statutes were last updated on November 12th, 2026'', and the Title 62 PDF was created 2026-11-10 (Last-Modified Wed, 11 Nov 2026 04:58:13 GMT; 820 pages) and prints the 2026 session''s amendments (Laws 2026). Section 34.33 prints one version, last amended by Laws 2012, c. 304, § 365, with no repeal or later-effective marker. The ingester refuses a slice that prints an amendment note with an effective date later than the day it runs. OSCN, the other official copy, answered the Fetcher''s requests with a Turnstile challenge (HTTP 201, ''OSCN Turnstile'') and was not used.'
- id: ok-62-os-34-43
  sha256: "1c4e4197fda46062838339fb02ab3ae0446946d9d468a04664fee5122107b795"
  url: https://www.oklegislature.gov/OK_Statutes/CompleteTitles/os62.pdf
