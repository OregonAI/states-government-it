  recheck: monthly
  stub: true
  stub_reason: 'OMES''s PDF of the chapter (Title260Chapter115.pdf, PDF modification date 30 Aug 2022) is out of date: its latest amendment note is 38 Ok Reg 1870, eff 9-11-21, while OMES''s own later copy, CentralPurchasingAdminRules.pdf (''Last revised April 11, 2024'', which calls itself an unofficial copy), shows 260:115-1-1 and 260:115-7-3 amended at 39 Ok Reg 1163, eff 9-11-22, and the two texts differ in substance (the supplier-notification paragraph, the bid-bond subsections and the verification of registration with the Secretary of State). The official rules portal https://rules.ok.gov/ answered the Fetcher HTTP 403 on ''/'' and ''/code'', so the current text of record cannot be read; the April 2024 copy is unofficial and itself dated. Whether to take it is an OWNER DECISION.'
  found_via: https://oklahoma.gov/omes/about-omes/laws-and-rules.html (Administrative Rules)
  why_relevant: OMES's procurement rules. OMES's Information Services page names this chapter as one of the three places the CIO's statutory duties are set out; its Part 9 is information technology acquisitions. The rest of the chapter (general state purchasing, supplier registration, protests, debarment, contract management) rides along because OMES serves the whole chapter as one PDF (OWNER DECISION, see left_out).
