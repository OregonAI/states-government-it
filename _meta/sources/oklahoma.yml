  slice: {section_start: '35.1', section_end_before: '35.9'}
  why_relevant: 'The Information Technology Consolidation and Coordination Act: CIO written approval of state agency IT purchases and leases (35.4), assessment of integral IT assets and positions (35.5), required shared services (35.6, with the Criminal Justice Information Systems Center for Excellence 35.6.1 and the Land Mobile Radio cooperative 35.6.2), exemptions (35.7), employing IT personnel (35.7a) and security standards (35.8). OMES cites it as the second place the CIO''s duties are set out, and its AI standard rests on it. Section 35.9 (quarterly progress reports) is not in this document: the PDF prints only the version that takes effect on January 1, 2027 (see left_out).'
  currency_note: 'Narrowed from the seeded range 35.1 to 35.9. Section 35.9 (quarterly progress reports) is excluded because the Legislature''s PDF prints it only as amended by Laws 2026, c. 445, § 142 (SB 1877), eff. Jan. 1, 2027, which is not the text in force on 2026-11-12. Currency, checked 2026-11-12 from the Legislature''s own bytes fetched that day: its statutes index (https://www.oklegislature.gov/osStatuesTitle.html) says ''The Oklahoma Constitution and Oklahoma Statutes were last updated on November 12th, 2026'', and the Title 62 PDF was created 2026-11-10 (Last-Modified Wed, 11 Nov 2026 04:58:13 GMT; 820 pages) and prints the 2026 session''s amendments (Laws 2026). The ingester refuses a slice that prints an amendment note with an effective date later than the day it runs, so no section here is a version that has not yet taken effect. OSCN, the other official copy, answered the Fetcher''s requests with a Turnstile challenge (HTTP 201, ''OSCN Turnstile'') and was not used.'
