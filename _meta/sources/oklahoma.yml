  recheck: monthly
  slice: {section_start: '34.11.2', section_end_before: '34.32'}
  why_relevant: 'The Information Services Division of OMES and the State Chief Information Officer''s initiatives, from OMES''s list of ''62 O.S. Sections 34.11.1 through 34.33'': state IT initiatives including open documents, IT project monitoring and security breach transparency (34.11.2 to 34.11.11), the Division''s duties and authority (34.12, 34.15, 34.20), the state portal (34.24 to 34.26), the Technology Applications Review Board (34.27), accessibility of information technology (34.28 to 34.29) and software acquisition and open source preference (34.31 to 34.31.2). Sections 34.14, 34.16 to 34.18 and 34.30 are repealed (the PDF prints their notices). Sections 34.11.1 (the Chief Information Officer) and 34.32 (the standard security risk assessment) are not in this document: the PDF prints only the version of each that takes effect on January 1, 2027 (see left_out).'
  currency_note: 'Narrowed from the seeded range 34.11.1 to 34.33. Section 34.11.1 (the Chief Information Officer) and section 34.32 (standard security risk assessment) are excluded because the Legislature''s PDF prints each only as amended by Laws 2026, c. 445, § 131 and § 132 (SB 1877), eff. Jan. 1, 2027, which is not the text in force on 2026-11-12; section 34.33, which is current, follows 34.32 and is its own entry, ok-62-os-34-33. Currency, checked 2026-11-12 from the Legislature''s own bytes fetched that day: its statutes index (https://www.oklegislature.gov/osStatuesTitle.html) says ''The Oklahoma Constitution and Oklahoma Statutes were last updated on November 12th, 2026'', and the Title 62 PDF was created 2026-11-10 (Last-Modified Wed, 11 Nov 2026 04:58:13 GMT; 820 pages) and prints the 2026 session''s amendments (Laws 2026). The ingester refuses a slice that prints an amendment note with an effective date later than the day it runs, so no section here is a version that has not yet taken effect. OSCN, the other official copy, answered the Fetcher''s requests with a Turnstile challenge (HTTP 201, ''OSCN Turnstile'') and was not used.'
- id: ok-62-os-34-11-1-1
  sha256: "1c4e4197fda46062838339fb02ab3ae0446946d9d468a04664fee5122107b795"
  url: https://www.oklegislature.gov/OK_Statutes/CompleteTitles/os62.pdf
  format: pdf
  citation: 62 O.S. 34.11.1.1 to 34.11.1.2
  title: 'Oklahoma Statutes Title 62, Sections 34.11.1.1 to 34.11.1.2: Chief Information Officer data sets and the Employment Security Commission IT Innovation Revolving Fund'
  doc_type: statute
  jurisdiction: oklahoma
  issuing_body: Oklahoma Legislature
  tags:
  - governance
  - data
  - funding
  recheck: monthly
  slice: {section_start: '34.11.1.1', section_end_before: '34.11.1'}
  why_relevant: 'OWNER DECISION 2026-11-13 (a provision whose own focus is the governance of state IT). Section 34.11.1.1: ''The Chief Information Officer shall source and submit to the State Governmental Technology Applications Review Board proposed state employee performance information metrics, convenience information sets and other data streams for possible publication on the "data.ok.gov" website'', assists the Board with performance metrics (34.27) and lists the data sets to be placed online (state expenditures, state revolving funds, school district spending data). Section 34.11.1.2: creates the Oklahoma Employment Security Commission Information Technology Innovation Revolving Fund, which OMES may spend ''for the purpose of augmenting the information technology infrastructure of the Oklahoma Employment Security Commission''. Both sit inside OMES''s named range 62 O.S. 34.11.1 through 34.33 and are in force.'
  currency_note: 'Currency, checked 2026-11-13 from the Legislature''s own bytes: its statutes index (https://www.oklegislature.gov/osStatuesTitle.html) says ''The Oklahoma Constitution and Oklahoma Statutes were last updated on November 12th, 2026'', and the Title 62 PDF was created 2026-11-10 (Last-Modified Wed, 11 Nov 2026 04:58:13 GMT; 820 pages) and prints the 2026 session''s amendments (Laws 2026). The PDF prints these two sections before section 34.11.1; section 34.11.1.1 prints one version (Laws 2011, c. 292, § 10) and 34.11.1.2 one (Laws 2023, 1st Ex. Sess., c. 36, § 1, eff. July 1, 2023), with no repeal or later-effective marker. The ingester refuses a slice that prints an amendment note with an effective date later than the day it runs. OSCN, the other official copy, answered the Fetcher''s requests with a Turnstile challenge (HTTP 201, ''OSCN Turnstile'') and was not used.'
