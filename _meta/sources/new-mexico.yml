# New Mexico seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md. Proposed 2026-11-12 from bytes fetched through the toolkit
# Fetcher that day (DoIT, State Records Center and Archives, NMOneSource, Governor's site, nmlegis.gov).
sources:
# ---- Statutes: NMSA 1978 Chapter 9, Articles 27 and 27A (document = one article cut from the Compilation Commission's whole-chapter PDF)
# Each statute entry's url is the whole-chapter PDF (Chapter 9, 476 pages) while its sha256 is the hash of the entry's JSON slice bundle, which is what is committed. The monthly
# drift run (corpus-detect-changes, which GETs each entry's url whole and compares a hash of the body with the entry's `sha256`) will download that PDF once per entry (twice) and
# cannot compare it with a baseline taken over a slice: expect both entries to be reported as changed every month, and treat that as noise until corpus-toolkit can recheck a sliced
# source (`recheck:` is not honoured by the toolkit, so it cannot route these entries elsewhere). Drift is the toolkit's; this repo has not run it for these entries.
- id: nm-nmsa-9-27
  sha256: "4612ba87ab10c57a61af2441e5cb6707b3db08a95143f98a2e23c502c1506ce9"
  url: https://nmonesource.com/nmos/nmsa/en/4357/1/document.do
  format: json
  citation: NMSA 1978, chapter 9, article 27
  title: Department of Information Technology
  doc_type: statute
  jurisdiction: new-mexico
  issuing_body: New Mexico Legislature; published by the New Mexico Compilation Commission (NMOneSource.com)
  tags:
  - governance
  - oversight
  - procurement
