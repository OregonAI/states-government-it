  slice:
    section_start: 14-15-1
    section_end_before: 14-16-1
  found_via: Cited by the held rule 1.12.7 NMAC and by 14-3-15.2 NMSA 1978 ('For the Electronic Authentication of Documents Act, see Chapter 14, Article 15'); owner decision 2026-11-13. Text read in the Chapter 14 PDF, the 'Chapter 14 NMSA 1978' document link of NMOneSource item 4383.
  why_relevant: 'The Electronic Authentication of Documents Act, the whole of Article 15 (14-15-1 to 14-15-6): its purpose is ''a centralized technical approach to authenticating electronic documents'' and ''electronic filing of documents with government agencies and ... efficient delivery of government services by means of reliable, secure electronic records and document transactions'' (14-15-2); it provides that ''the information technology commission shall adopt rules and standards to accomplish the purposes'' of the Act (14-15-5) and that the information technology management office may contract for services under it, subject to the Procurement Code (14-15-6). The whole article is IT governance of electronic authentication; 14-15-4 is printed ''Repealed.'' with its repeal note. Currency, checked 2026-11-13 from bytes fetched that day through the Fetcher: NMOneSource''s item page for Chapter 14 (https://nmonesource.com/nmos/nmsa/en/item/4383/index.do) sits under ''Current New Mexico Statutes Annotated 1978'' and the site prints ''Website last modified: 11/12/2026''; the chapter PDF (252 pages) was created 2026-10-27. The sections print no repeal or not-yet-effective marker (14-15-4 alone is printed ''Repealed.'', with its repeal note). The sections still name the information technology commission and office that no longer exist (Chapter 15, Article 1C is repealed): the Compilation Commission prints the text as current law and it is held as printed.'
- id: nm-nmsa-14-16-17
  sha256: "565222dc7e56c21a6b58980ce823a309ae7feea25e1ce98f7104c43bdccc2a89"
  url: https://nmonesource.com/nmos/nmsa/en/4383/1/document.do
  format: json
  citation: NMSA 1978, 14-16-17 to 14-16-19
  title: 'Uniform Electronic Transactions Act: electronic records of governmental agencies'
  doc_type: statute
  jurisdiction: new-mexico
  issuing_body: New Mexico Legislature; published by the New Mexico Compilation Commission (NMOneSource.com)
  tags:
  - digital-services
  - data
  - governance
  recheck: monthly
  slice:
    section_start: 14-16-17
    section_end_before: 14-16-20
  found_via: Cited by the held rule 1.12.7 NMAC (the New Mexico Uniform Electronic Transactions Act, Section 14-16-1 et seq NMSA 1978); owner decision 2026-11-13. Text read in the Chapter 14 PDF, the 'Chapter 14 NMSA 1978' document link of NMOneSource item 4383. Only the three sections addressed to governmental agencies are held; see left_out.
  why_relevant: 'Sections 14-16-17 to 14-16-19 of the Uniform Electronic Transactions Act, the three sections addressed to state agencies: each governmental agency of this state ''shall determine whether, and the extent to which, it will create and retain electronic records and convert written records to electronic records'' (14-16-17); the state records administrator issues rules for all governmental agencies, or an agency, ''giving due consideration to security'', issues its own rules on the format and systems for electronic records, the type of electronic signature, and ''control processes and procedures ... to ensure adequate preservation, disposition, integrity, security, confidentiality and auditability of electronic records'' (14-16-18, the authority of 1.12.7 NMAC); and the interoperability of those standards (14-16-19). Currency, checked 2026-11-13 from bytes fetched that day through the Fetcher: NMOneSource''s item page for Chapter 14 (https://nmonesource.com/nmos/nmsa/en/item/4383/index.do) sits under ''Current New Mexico Statutes Annotated 1978'' and the site prints ''Website last modified: 11/12/2026''; the chapter PDF (252 pages) was created 2026-10-27. The sections print no repeal or not-yet-effective marker.'
