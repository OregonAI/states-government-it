  - cybersecurity
  - data
  recheck: monthly
  slice:
    article: '27'
  found_via: Linked from DoIT's 'DoIT ACT, Policies & Rules' page (the DoIT Act row opens NMOneSource item 4357, Chapter 9); the whole-chapter PDF address is the 'Chapter 9 NMSA 1978' document link printed on that item's page.
  why_relevant: 'The Department of Information Technology Act: creates the department and the cabinet secretary who is the state chief information officer, and sets the department''s powers and duties over executive-agency information technology (9-27-5 and 9-27-6), including its rulemaking power (9-27-6) under which the 1.12 NMAC rules are issued. The source serves the whole of Chapter 9 as one PDF; this document is Article 27 of it, with the Compilation Commission''s annotations. Out-of-scope sections ride along with the slice (broadband and telecom, domain.yml): 9-27-13 (telecommunications services), 9-27-14, 9-27-15 and 9-27-15.1 (radio communications, the leased radio network and its report), 9-27-20 to 9-27-22 (telecommunications duties, the central telecommunication network and its charges), 9-27-25 (participation in the central telecommunication network), 9-27-26 (Indian nations, tribes and pueblos on the agency-owned statewide broadband network) and 9-27-27 (library broadband infrastructure fund). The governance sections are 9-27-4 to 9-27-6.'
