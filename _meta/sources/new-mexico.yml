left_out:
- text: |-
    ---- New Mexico found and left out. Every list below is the list actually read, on 2026-11-12, through the Fetcher; a 'none found' is stated with what was read.
- text: |-
    DoIT 'DoIT ACT, Policies & Rules' page (36 rows, read in full). Reconciliation, row by row:
     - DoIT Act (1 row, opens NMOneSource Chapter 9): documents nm-nmsa-9-27 (Article 27) and, from the same chapter PDF, nm-nmsa-9-27a (Article 27A).
     - NMAC DoIT Rules (12 rows: 1.12.1, 1.12.3 to 1.12.12, 1.12.20): 11 are documents from DoIT's PDFs. The 12th, 1.12.7 'Electronic Authentication', links a PDF that is the 1996 rule (issued by the Commission of Public Records, filed as 1 NMAC 3.2.70.2): the State Records Center and Archives' page of 1.12.7 NMAC prints 'History of Repealed Material: 1 NMAC 3.2.70.2 ... Repealed 6/30/15' and the part now reads 'Digital / Electronic Signature' (2015). The repealed text is NOT held; the SRCA text is (nm-nmac-1-12-7). A second listing of the same part (SRCA) also gave Part 2 (nm-nmac-1-12-2, an owner decision) and Part 21 (below).
     - Executive Orders (3 rows): 2024-011 and 2022-141 are documents (scans, read by OCR); 2008-011 is a stub (nm-eo-2008-011: the OCR text is not promotable, figure agreement 86% against a 90% bar).
     - Telecommunications Standards (1 row): stub nm-doit-telecom-standards (legacy .doc, probably telecom).
     - PM Express (1 row, the FY16 Quick Reference Guide PDF of 2016-04-15): left out. A user guide to a project-management process, not an instrument; DoIT's EPMO page links a newer PPTX edition (2024) of it.
     - Architectural Configuration Regulations (18 rows): 1.12.6 repeated (the same file as the rule: one document); the other 17 rows (Glossary of Terms, N-GUIDE-001, S-GUIDE-002, S-STD-001 to 007, 009 to 012, S-POL-003, N-STD-004, N-STD-008) are documents.
- text: |-
    SRCA NMAC pages read for Part 12 of Title 1: parts 1 to 12, 20 and 21 (each fetched, each prints text, none marked repealed; 1.12.13 to 1.12.19 are marked [RESERVED] on the SRCA's Title 1 listing of reserved and repealed parts). The SRCA's Title 1 page does not link its part pages (the part-page addresses are a pattern, see found_via), so there is no second index to watch; DoIT's rulemaking page is watched instead.
     - 1.12.21 NMAC, Grant Program Rules (DoIT and Connect New Mexico Council grants; the page's scope is the development, award and administration of grant programs of DoIT, the Office of Broadband Access and Expansion and the Connect New Mexico Council): left out. Broadband programs and grants are out of scope (domain.yml) and it is not IT governance of state systems. DoIT's rulemaking page lists its 2022 and 2023-2024 notices (not seeded either).
     - Replacement 1.12.5 and 1.12.9 NMAC ('Final Rule as Filed with the State Records Center and Archives', DoIT notice of final adoption 2026-11-04): adopted 2026-10-30, to be published in the New Mexico Register and to take effect on 2026-12-08. Not in force on 2026-11-12, so not seeded; the old texts above are the rules in force today. WHEN 2026-12-08 PASSES, replace nm-nmac-1-12-5 and nm-nmac-1-12-9 with the new texts (the notice names the filed PDFs; the retitled parts are 'Oversight of Information Technology Projects' and 'Certification of Information Technology Projects'). The same page's proposals, hearing transcript, comments and responses: rulemaking record, not instruments.
- text: |-
    Statutes (Chapters 9, 10, 13, 14, 15 and 57 of the NMSA 1978, the PDFs from NMOneSource, converted to text and searched for information technology, cybersecurity, artificial intelligence and automated decision; Articles 27 and 27A and 12C read in full; the viewer page itself is a shell that loads the chapter in a frame, and the chapter PDF is the 'Chapter n NMSA 1978' document link the frame prints):
     - Included: Chapter 9 Article 27 (Department of Information Technology Act) and Article 27A (Cybersecurity Act). Article 27 sits in Chapter 9 with unrelated departments, so each entry is an article slice; the Commission's annotations come with the text.
     - Chapter 15 Article 1C (Information Technology Management Act, the commission and the CIO office before DoIT): the chapter PDF prints 'Information Technology Management (Repealed.)' with only repealed-section notes. Nothing in force.
     - Chapter 57 Article 12C (Data Breach Notification Act, 57-12C-1 to 57-12C-12): duties are placed on 'a person' that owns or licenses personal identifying information, and the Act's definitions do not define 'person' or name state agencies. Not shown to bind state agencies in the bytes read: left out. OWNER DECISION (may bind agencies as persons; section-level reading needed).
     - Chapter 14 (Records, Rules, Legal Notices, Oaths), Articles 3 (Public Records), 15 (Electronic Authentication of Documents) and 16 (Uniform Electronic Transactions): first left out pending the owner's decision on section-level slicing. SUPERSEDED on 2026-11-13: the owner approved a provision outside an IT chapter as a section slice when its own focus is the governance of state IT; the provisions that pass that test are now documents (nm-nmsa-14-3-15-2, nm-nmsa-14-15, nm-nmsa-14-16-17) and the rest of the chapter, with the reasons, is in the 2026-11-13 record below. Chapter 13 (Public Purchases and Property): the Procurement Code; its hits for 'information technology' were references to DoIT's sunshine portal, the old commission and one telecommunications phrase; left out because that read found no section whose own focus is state IT purchasing. It was not re-read on 2026-11-13: it was not a candidate of the authority-references pass, and the owner's decision approves only the candidates.
     - Chapter 10 (Public Officers and Employees; the chapter PDF fetched through the Fetcher, NMOneSource item 4364, searched the same way) Article 16D, Sunshine Portal Transparency Act (10-16D-1 to 10-16D-6): the Department of Information Technology, with the Department of Finance and Administration, develops, operates and maintains the 'sunshine portal' web site that publishes the state's financial information (10-16D-3), and works with the Public Education Department on the school data extract (10-16D-6). Left out: the duty is DoIT's, but the subject is publication of financial transparency data, not governance of the state's own IT. OWNER DECISION (digital-services scope): the article could be seeded as a slice like Article 27 (the slice code reads any 'ARTICLE nn' heading). The same chapter's Article 16E, One-Stop Business Portal Act (10-16E-1 to 10-16E-4), likewise gives DoIT a public web portal for business transactions with state agencies: left out for the same reason and the same decision. No other Chapter 10 hit: 'information technology' otherwise appears only in a retirement-system provision (the system's own IT) and cross references to DoIT; no 'cybersecurity', 'artificial intelligence' or 'automated decision'.
     - AI: no statute on state-agency use of AI found. The word 'artificial intelligence' appears once in the five chapters read (Chapters 9, 13, 14, 15 and 57; Chapter 10 has none), in a Chapter 9 list of sectors for technology innovation prizes (economic development: out of scope). nmlegis.gov shows SB 68 of the 2026 session ('Artificial Intelligence Government Use Act', public bodies' AI policies and training) as 'Died (API.)', action postponed indefinitely: a bill never enacted, out of scope.
- text: |-
    DoIT Resource Library (44 rows, read in full). Documents: Generative AI Use Guidelines Policy, its Quick Guide (owner decision), Data Policy v1.0, eDiscovery Access and Use Policy v1.2 (4 rows). Left out (40 rows): 16 forms (billing 1, security 4, data center 3, enterprise 3, EPMO 3, SharePoint 1, the eDiscovery training request form 1); 1 video link ('Bill of IT'); and the 23 'NIST 800-53 Moderate Policy Templates' of the Office of Cybersecurity (Definitions, Roles and Responsibilities, 20 control-family policy templates OCS_01 to OCS_20, and a Policy Mapping Matrix, all Word files dated 06.2026). Forms and templates are not instruments (playbook). OWNER DECISION on the 23 templates: they are the Office of Cybersecurity's model policies that Executive Order 2024-011 directs agencies to adopt; the .docx files could be read with pandoc.
- text: |-
    DoIT Cybersecurity program page and its five sub-pages (read): the Approved Cybersecurity Plan (September 2023, strategy), the 2025 State Plan Update Memo, the Water and Wastewater Cybersecurity Plan and its approval letter, the Cybersecurity Planning Committee charter, three committee resolutions (2023, 2024, 2026) and the 'SoNM Statewide Cyber Plan', the Advisory Committee resolution, meeting notices, agendas and minutes, the point-of-contact designation form, the State and Local Cybersecurity Grant Program page, and the Executive Order 2024-011 risk assessment pack (overview PDF, Word survey form, Excel response worksheet): plans, committee records, forms and reports are not instruments. Only CISO Order No. 2025-01 is an instrument (document nm-ocs-ciso-order-2025-01).
- text: |-
    DoIT EPMO page and its sub-pages (read): contract templates (3 DoIT agreement templates, 4 professional services templates), project certification forms and templates (7 certification forms, the project monthly report template, TARC and IV and V templates, FY25 to FY27 PCC and TARC schedules, a questionnaire pair), FY28 strategic plan templates and training video, and the Project Certification Committee page (documents by year in the State's certification records system, 20 years): templates, forms, schedules and records, left out. Process documents that read as guidance and were opened: 'IT Procurement Approval Process' (letterhead of Governor Martinez and Cabinet Secretary Ackley, 3 pages, 'To define oversight and approval processes of IT procurements for state agencies'), 'DoIT Memorandum - IT Project Oversight Process' (letterhead of Governor Richardson, 5 pages), 'IT Purchase Exceptions' (the EO 2008-011 exception list), 'Contract Review and RFP Approval Process' (a one-page flow chart), the certification 'Timeline and Gates' chart and the DocuSign routing guide. None prints a current effective date or a statement that it is in force, so none is seeded. OWNER DECISION: the Procurement Approval Process, the Oversight memorandum and the Purchase Exceptions list are candidate policies if DoIT confirms they are current.
- text: |-
    IT Strategic Planning page (read): FY25-27 and FY2021-2023 statewide IT strategic plans, DoIT annual plans FY21 to FY26 and the FY28 agency plan guidance templates and calendar: strategy documents, templates and a calendar, left out.
- text: |-
    Executive orders: the Governor's current page (2026 and 2025 lists, 160 and 417 rows by link text, plus the 'Amending And Rescinding Executive Orders' list) and the archive (2019 to 2024, 221 rows for 2024, 147 for 2023, 164 for 2022, 68 for 2021, 85 for 2020, 36 for 2019, by link text) were read and every title searched for technology, cyber, data, artificial, information, digital, computer, software, internet, privacy, broadband, network and electronic. IT, cybersecurity or data orders found: 2024-011 and 2022-141 (documents). Left out on the inclusion test: 2020-015 and 2020-039 (temporary permission of notarial acts through audio-visual technology, a COVID-era notary rule, not IT as a government function) and 2021-048 (collection of voluntary self-identification data on sexual orientation and gender identity, a personnel-data practice, not IT governance; OWNER DECISION). No order on AI found. The Governor's pages do not carry orders before 2019, so 2008-011 comes from DoIT's page only; whether it was revoked could not be checked there.
- text: |-
    Owner decision 2026-11-13 (a provision whose own focus is the governance of state government IT is in scope as a section slice) applied to the New Mexico candidates of the authority-references pass (docs/research/12), each read in the Chapter 14 PDF (NMOneSource item 4383, the 'Chapter 14 NMSA 1978' document link, 252 pages, fetched 2026-11-13 through the Fetcher):
     - 14-3-15.2 (Public Records Act, electronic authentication; substitution for signature): seeded as nm-nmsa-14-3-15-2. The section is solely about electronic authentication and who sets its standards ('the commission' is the state commission of public records, 14-3-2); 1.12.7 NMAC is issued under it.
     - Article 15, Electronic Authentication of Documents Act (14-15-1 to 14-15-6): seeded whole as nm-nmsa-14-15; every section is about electronic authentication and the IT commission's and office's powers over it (14-15-4 is repealed and printed as such).
     - Article 16, Uniform Electronic Transactions Act, 14-16-17 to 14-16-19 (agencies decide whether to create and retain electronic records, the state records administrator's rules for all agencies or an agency's own rules on the format, systems, signature type and security of electronic records, and interoperability): seeded as nm-nmsa-14-16-17.
     - Article 16, 14-16-1 to 14-16-16 (short title, definitions, scope, variation by agreement, legal recognition of electronic records and signatures, notarization, retention of electronic records, admissibility, automated transactions, time and place of sending, transferable records): left out. A general law of electronic transactions between any parties (it applies to a 'person', which includes any individual, company or governmental agency, 14-16-2); it governs how electronic records and signatures are treated in commerce and in court, not how the state governs its own IT. The retention section (14-16-12) applies to 'a person', not to agencies, and reserves to a governmental agency the power to add its own requirements (14-16-12(g)).
     - Article 16, 14-16-20 and 14-16-21 (a governmental agency may provide by rule for an applicant to satisfy by electronic means its requirements for certifications, permits, registrations and licenses; the two sections are near-identical, enacted by Laws 2013, ch. 30 and ch. 68): left out. A permission to an agency to make licensing available online, not a rule on how the state's IT is governed, bought, secured or overseen.
     - Public Records Act sections other than 14-3-15.2 (for example 14-3-15.1, records of state agencies and copy fees for computerized databases): not candidates of the authority-references pass and not approved; not seeded.
