  found_via: Named on DoIT's cybersecurity program page ('Cybersecurity Act, Sections 9-27A-1 to 9-27A-5, NMSA 1978'); text read in the same Chapter 9 PDF as the DoIT Act.
  why_relevant: 'The Cybersecurity Act (2023): creates the Office of Cybersecurity and the state chief information security officer, its powers and duties including a centralized cybersecurity and data breach reporting process for agencies and political subdivisions (9-27A-3), and the cybersecurity advisory committee (9-27A-5). The source serves the whole of Chapter 9 as one PDF; this document is Article 27A of it, with the Compilation Commission''s annotations.'
- id: nm-nmsa-14-3-15-2
  sha256: "3c22c989b5fae351953a59f4fea784e9a0159e3d472489b9f9b4943136a24559"
  url: https://nmonesource.com/nmos/nmsa/en/4383/1/document.do
  format: json
  citation: NMSA 1978, 14-3-15.2
  title: Electronic authentication; substitution for signature
  doc_type: statute
  jurisdiction: new-mexico
  issuing_body: New Mexico Legislature; published by the New Mexico Compilation Commission (NMOneSource.com)
  tags:
  - digital-services
  - governance
  recheck: monthly
  slice:
    section_start: 14-3-15.2
    section_end_before: 14-3-16
  found_via: 'Cited by the held rule 1.12.7 NMAC (scope: ''to implement the electronic signature authority pursuant to the Public Records Act, Section 14-3-15.2 NMSA 1978''); owner decision 2026-11-13 (a provision whose own focus is the governance of state IT is in scope as a section slice). Text read in the Chapter 14 PDF, the ''Chapter 14 NMSA 1978'' document link of NMOneSource item 4383.'
  why_relevant: 'Section 14-3-15.2 of the Public Records Act, one sentence: ''Whenever there is a requirement for a signature on any document, electronic authentication that meets the standards promulgated by the commission may be substituted.'' In the Public Records Act ''commission'' means the state commission of public records (14-3-2), so the section makes the standards of that commission the test for substituting electronic authentication for a signature. The focus is IT governance: the section names the state commission of public records (14-3-2(C)) as the body whose standards decide when electronic authentication may replace a signature, and the electronic signature rule 1.12.7 NMAC (State Commission of Public Records and State Records Administrator) is issued under it. The sections around it, on records in general, are not in this document. Currency, checked 2026-11-13 from bytes fetched that day through the Fetcher: NMOneSource''s item page for Chapter 14 (https://nmonesource.com/nmos/nmsa/en/item/4383/index.do) sits under ''Current New Mexico Statutes Annotated 1978'' and the site prints ''Website last modified: 11/12/2026''; the chapter PDF (252 pages) was created 2026-10-27. The section prints no repeal or not-yet-effective marker.'
- id: nm-nmsa-14-15
  sha256: "406faec4bc7f41ff435b3eb2ae77354d78378990b445825d2069cd786673e689"
