  cut:
    from: ARTICLE 25 - GOVERNMENT ELECTRONIC TRANSACTIONS
    to: ARTICLE 26 - DEPARTMENT OF WORKFORCE SERVICES
  found_via: https://ets.wyo.gov/about-us/statutes-and-rules (the ETS page that lists its statutes; the section numbers are confirmed in the title PDF bytes)
  why_relevant: Lets the state chief information officer provide for state agency business to be conducted electronically, and directs the department to make rules that set standards and security parameters for state agencies conducting business electronically, authentication, certification of electronically transmitted information and conversion to paper (9-2-2501). The single section of the article.
- id: wy-ws-9-21
  sha256: "17ad008434b5bdfc81780d6b5d6ccc710c32506a48c9e03560c2f25eb3ac2661"
  url: https://wyoleg.gov/statutes/compress/title09.pdf#9-21
  format: json
  citation: W.S. 9-21-101 through 9-21-203
  title: 'Data Policies (Title 9, Chapter 21: state agency data policies; data privacy in government entities)'
  doc_type: statute
  jurisdiction: wyoming
  issuing_body: Wyoming Legislature
  tags:
  - data
  - cybersecurity
  - governance
  recheck: monthly
  cut:
    from: CHAPTER 21 - DATA POLICIES
    to: CHAPTER 22 - LIMITATIONS ON DELEGATES TO A CONVENTION FOR
  found_via: https://ets.wyo.gov/about-us/statutes-and-rules (the ETS page that lists its statutes; the section numbers are confirmed in the title PDF bytes)
  why_relevant: Article 1 (9-21-101) requires every executive branch agency to adopt, enforce and maintain a policy on the collection, access, security and use of data that complies with the standards set by the state chief information officer, including data security incident response and breach notification. Article 2 (9-21-201 to 9-21-203, created by Enrolled Act No. 32, Senate, 2026) limits the sale and transfer of personal data by government entities (the state and its agencies, and local governments), gives residents access and objection rights, and from July 1, 2027 requires a personal data collection and retention policy (9-21-203, which the page prints with its effective-date note). Binds state agencies as well as local entities.
- id: wy-eo-2023-02
  sha256: "a1874e564c3acb1ef1b200d47b6b201cd298372f962b36c66aec76cf4693f0a7"
