  title: Establishment of the Wyoming Cyber Assistance Response Effort Team
  doc_type: executive_order
  jurisdiction: wyoming
  issuing_body: Governor of Wyoming
  tags:
  - cybersecurity
  - governance
  recheck: monthly
  ocr: true
  official_link: https://drive.google.com/file/d/1M0ulotnunJAjhWgf0DfHgDJ5eOJT9gA8/view
  found_via: https://hls.wyo.gov/programs/care-team (the Office of Homeland Security page, link text "Executive Order (EO) 2023-02"); also named on https://ets.wyo.gov/cybersecurity/incident-response-management/cyber-assistance-response-effort-care-team and https://care.wyo.gov/exec-order. The title block is confirmed in the fetched bytes.
  why_relevant: Executive Order 2023-02 of Governor Mark Gordon establishes the Wyoming Cyber Assistance Response Effort (CARE) Team, with members from the Office of the Chief Information Officer and Enterprise Technology Services and other state agencies, led by the Office of Homeland Security, to review cybersecurity and technology-based threat information and assess vulnerabilities and report to the Governor. A scan with no text layer, read by the two-engine OCR procedure.
