- id: wy-ws-9-2-art-29
  sha256: "b4b60814929639a34f8a09979533428094ea6dd81311c8084de0d5fe2cfe93d6"
  url: https://wyoleg.gov/statutes/compress/title09.pdf#9-2-art-29
  format: json
  citation: W.S. 9-2-2901 through 9-2-2907
  title: Department of Enterprise Technology Services (Title 9, Chapter 2, Article 29)
  doc_type: statute
  jurisdiction: wyoming
  issuing_body: Wyoming Legislature
  tags:
  - governance
  - oversight
  - procurement
  - funding
  - cybersecurity
  - data
  recheck: monthly
  cut:
    from: ARTICLE 29 - DEPARTMENT OF ENTERPRISE TECHNOLOGY SERVICES
    to: ARTICLE 30 - STATE CONSTRUCTION DEPARTMENT
  found_via: https://ets.wyo.gov/about-us/statutes-and-rules (the ETS page that lists its statutes; the section numbers are confirmed in the title PDF bytes)
  why_relevant: 'The enabling statute for the Department of Enterprise Technology Services and the state chief information officer. As the slice prints it: the department is created (9-2-2901) with an information technology division and an information services division (9-2-2902); the governor appoints the state chief information officer with the advice and consent of the senate, who directs the department (9-2-2903); definitions (9-2-2904); the department''s duties in assisting the governor, including uniform IT standards (9-2-2905); and the office''s authority and duties (9-2-2906): the biennial IT plan, the IT governance program, review criteria for agency IT projects, procurements and purchases, adoption of IT policies and standards and agency compliance, expenditure review and approval, data security and privacy policies and standards for the state data infrastructure as the minimum requirements for all agencies (2906(d)(iii)), enterprise data analytics, billing for shared costs and rulemaking on telecommunications and software. 9-2-2907 is printed as repealed.'
- id: wy-ws-9-2-art-25
  sha256: "cce54322de4293d1d9975ac5b76da4b684814c8554d08681cbdf8f9dda42fe68"
