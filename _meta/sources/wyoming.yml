left_out:
- text: '---- Wyoming: found and left out (each was seen on an official page and read through the Fetcher on 2026-11-12; the reason is recorded here)'
- text: |-
    Statewide policy library (https://ets.wyo.gov/resources/policies-standards): every row was read, row by row. The front page links four category pages and the IT Policy Dictionary: IT Operations 6 rows (WyIT 1001-1006), Data 18 rows (WyIT 2001, 2001-G1, G2, S1-S4, 2002, 2003, 2004, the 2004 guide, 2005, 2006, 2008, 2009, 2011, 2013, 2014), International Travel 1 policy row (WyIT 3024) and Security & Privacy 25 rows (WyIT 3023 and 3001 to 3022, 3001-S and 3025). That is 50 policy, standard and guide files, all seeded as documents, plus the Dictionary: 51 library rows, 51 documents, 0 stubs. The Dictionary's cover PDF links 12 lettered PDFs (A, B, C, D, E-H, I, J-O, P, Q-R, S, T-Z and Mainframe Specific Definitions), seeded as 12 more documents (wy-wyit-dictionary-*), so 63 PDFs in all. Every file was fetched as PDF bytes with a text layer. The files are served from Google Drive, which the ETS page links (the url is the Drive export link built from the file id in the page's link, as Colorado's OIT files are; each file's title block is confirmed in its bytes).
    No status column exists on these lists: a row is a current item. No archived, draft or superseded section was found on the four category pages or the front page.
    Filter applied: none beyond the above; the Guides (WyIT 2001-G1, 2001-G2, the 2004 breach guide) are seeded as policy documents because the library lists them beside the policies they support (OWNER DECISION if guides should be treated as non-instruments).
    Quirks kept as published: the file for WyIT 2001-S2 (Data Steward Standard) prints the title 'Data Owner Standard' and the number 'WyIT.2001-S1' on its first page although its text and the index row are the Data Steward Standard (identity_text names a phrase only it prints); the 2004 guide's index row says '2004 - GL' and the file prints 'WyIT.2004-G1'; WyIT 3023's index row is dated 09/2026 and the file prints its own dates in its header table.
- text: 'Library rows that are not policies, left out: the Foreign Travel Request Form (a fillable form, sao.wyo.gov), the Telework Wyoming Policy link (https://ai.wyo.gov/for-state-employees/telework-wyoming, a Department of Administration and Information human resources page with a Google Drive Telework Policy file, approval process, sample agreement, safety checklist, FAQ and training pages; a personnel policy on where employees work, not IT, so not read as an instrument; OWNER DECISION if telework security belongs), and the Foreign Travel Approval link (see executive orders below).'
- text: |-
    Statutes. Read in the Legislature's own title PDFs (wyoleg.gov/statutes/compress/title09.pdf, 892 pages, PDF ModDate May 8 2026; titles 16, 28, 34 and 40 also read for the searches below). Seeded: Title 9 Chapter 2 Article 29 (the department, the CIO), Article 25 (government electronic transactions) and Chapter 21 (agency data policies; the 2026 data privacy act). ETS's own page lists these other sections, left out:
     - W.S. 40-21-118 (Acceptance and distribution of electronic records by governmental agencies) and 40-21-119 (Interoperability): sections of the Uniform Electronic Transactions Act chapter (Title 40, Chapter 21), which binds state agencies and directs ETS to make rules; non-IT chapter, section-level slice. OWNER DECISION on section-level slicing.
     - W.S. 9-2-3219 through 9-2-3221 (Title 9, Chapter 2: 9-2-3219 'Definitions.', 9-2-3220 'Wyoming public finance and expenditure of funds website.', 9-2-3221 'Rulemaking authority.'; headings read in the title PDF): the public finance and expenditure of funds website act. The website is administered by the Department of Administration and Information, and 9-2-3220(g) reads 'The state chief information officer shall provide an annual report to the committee on all initiatives, projects and expenditures under this act.' (ETS's Legislative Reporting page publishes the matching 'Report on WY Public Finance Site' files.) A CIO reporting duty inside a non-IT act, section-level slice. OWNER DECISION on section-level slicing.
     - W.S. 34-1-404 (Recording of documents) and 34-1-405 (Administration and standards): sections of the Uniform Real Property Electronic Recording Act (Title 34, Chapter 1, Article 4); 34-1-405 directs ETS to make rules for county clerks' electronic recording; counties are local government, so out of scope; same slicing owner decision.
     - W.S. 9-2-2019 (Department of enterprise technology services created, as part of the reorganization; a reorganization-plan section of Chapter 2): creates the department by reference to the division of information technology; the department's own creation is in the seeded 9-2-2901.
     - W.S. 9-2-117 (Office of rural health created; duties), 9-2-1005 (Payment of warrants; budget powers of governor), 9-2-1014 (Report required with budget request), 9-4-207 (Disposition of unexpended appropriations), 9-4-217 (Uniform state accounting system, with the payment processor provision cited in 9-2-2906), 28-1-115, 28-1-116 and 28-1-118 (agency plans, performance budgeting, revenue distribution reports), 7-19-201 (criminal history record information): budget, accounting, planning and personnel law; sections in non-IT chapters, not IT as a government function.
     - W.S. 9-2-1104 (heading read in the title PDF: the public safety communications commission) and 9-12-1509 (heading read: advisory council; broadband coordinator): telecom and broadband, out of scope per domain.yml. W.S. 21-2-202 and 18-3-402: listed on ETS's page under 'Education' and 'Counties' (County Clerk); the Title 21 and Title 18 PDFs were not fetched, so these two were not read; education and local government are out of scope per domain.yml.
     - W.S. 40-12-501 (breach of the security of the data system): reads 'maintained by a person or business'; it binds businesses and persons, not state agencies (state agency breach duties are in 9-21-101 and WyIT 2004).
     - Enrolled Act No. 32, Senate (2026, SF0020), https://wyoleg.gov/2026/Enroll/SF0020.pdf: the session law that created 9-21-201 to 9-21-203, read in full. Its sections 3 and 4 are not in the codified chapter: section 3 directs the state chief information officer, with the state archivist, to develop sample policies by January 1, 2027; section 4 sets the effective dates of 9-21-203 for counties, cities and other entities (July 1, 2028 and July 1, 2029). Not seeded (a session law, not codified); OWNER DECISION if session-law text should enter.
     No statute on the CIO or cybersecurity other than the above was found: the only security provisions in the ETS article are 9-2-2906(d)(iii) (data security and privacy standards) and the chapter 21 data policy duty. Searches of the title PDFs of titles 9, 16, 28, 34 and 40 for 'artificial intelligence' found no hit.
- text: 'Artificial intelligence statutes. None binding state agencies was found. The 2026 session''s HB0091 (ban on government use of AI for social scoring and biometric identification) was introduced 2/10/2026 and referred to House Judiciary, which recommended amend and do pass 7-1; the digest''s last entry is ''2/23/2026 H COW: Did not consider for COW'', and https://wyoleg.gov/2026/Enroll/HB0091.pdf answers with an HTML page, not an enrolled act. Enrolled Act No. 32, House (HB0102, 2026) was read: it is criminal law (using AI to commit offenses, synthetic sexual material, AI and children, AI promoting self-harm), out of scope per domain.yml (deepfakes and AI crimes). The state''s AI instruments are the WyIT policies seeded (1005, 3023).'
- text: 'Administrative rules: none seeded. The Secretary of State''s rules site (https://rules.wyo.gov/) answered the Fetcher (home page, Agencies.aspx 36,793 bytes) and Agencies.aspx lists ''Enterprise Technology Services (077)'' among 81 agencies, but the listing carries no link to any chapter, and the Administrative Code page (Search.aspx?mode=7, 33,603 bytes) is an empty search form that reads ''Results (0) No Results Found.'' Chapters appear only after a form is submitted (a search interface; the Fetcher makes GET requests and no site-internal endpoint was called), so no rule title, chapter number or text was confirmed in bytes. The statutes read direct ETS to make rules (W.S. 9-2-2501(c), 9-2-2906(g), 40-21-118(b), 34-1-405(a)), and web search (discovery only, nothing from it is used here) suggests ETS has chapters on electronic transactions. Reopens when a linked chapter page or a documented public listing for agency 077 is found; OWNER DECISION on whether a form-driven listing may be used. ETS''s own Statutes and Rules page links no rule chapters (it is watched).'
- text: 'Executive orders. The Governor''s list is not readable: https://governor.wyo.gov/, /executive-orders, /news-and-media/executive-orders, /sitemap.xml and /robots.txt each answered HTTP 200 with the same 907-byte script shell (an empty app element), so no list and no filter could be read and no ''all governors'' check was possible. Orders were found through other official pages: Executive Order 2023-02 (CARE Team; seeded as a scan read by OCR). Left out: (a) Executive Order 2026-03, ''Data Centers the Wyoming Way'', linked from the Governor''s news bulletin https://content.govdelivery.com/accounts/WYGOV/bulletins/41a4346 to a 5-page Google Drive PDF with no text layer (pdftotext returns nothing); it directs executive branch agencies on permitting and coordination for large data center development, not state IT or AI as a government function (OWNER DECISION; it would need ocr: true). (b) Executive Order 2024-01 on foreign travel approval, left out as borderline (OWNER DECISION; the order governs approval of employees'' foreign travel, and the device and information security rules for such travel are in the seeded WyIT 3024). It is published in two places, both read through the Fetcher on 2026-11-12. (1) ETS''s own page https://ets.wyo.gov/cybersecurity/general-cybersecurity-practices/foreign-travel (367,108 bytes; it names the order as ''Executive Order 2024-01, Foreign Travel Approval'') links a separate 2-page Google Drive copy of the order alone (file id 1mdu2Utzq1fREV96dTrdRUmo06ytLqb_8, 742,735 bytes): both pages are 300-dpi page images with no text layer (pdftotext returns 2 bytes), so it is a scan that could enter like Executive Order 2023-02 with ocr: true if the owner rules it in scope. (2) The International Travel library page links ''Foreign Travel Approval (EO)'' to a 13-page PDF on sao.wyo.gov (the State Auditor''s site, 5,207,852 bytes): all 13 pages are 300-dpi page images under a publisher OCR text layer (pdfimages lists an image on every page). It bundles the January 16, 2024 memorandum from the Governor''s Chief of Staff, the order, the request form, an older WyIT-3024 signed by Interim CIO Timothy ''TR'' Sheehan, and a ''WyIT-3024-G International Travel Information Security Guideline'' that the current policy library does not list. No other executive order on state IT, cybersecurity, data or AI could be confirmed in bytes.'
- text: 'Data privacy guides (https://ets.wyo.gov/data-privacy/data-privacy-for-government-entities, watched): two Google Docs guides, the Local Government Guide and the Wyoming Executive Branch Agencies guide, described on the page as a guide and enterprise policy template (WyIT-20xx) for the Data Privacy in Government Entities Act, effective July 1, 2027. They are templates and sample policies that entities may adopt or adapt, not yet numbered policies, so left out as templates; the agency guide is an OWNER DECISION if wanted before it becomes a numbered WyIT policy. The page''s statute compilation links point to the Legislature''s NXT gateway (not fetched).'
- text: 'Dictionary web pages: https://ets.wyo.gov/resources/policies-standards/it-policy-dictionary/ (landing) and the letter pages a, b, c, d, e-h, i, j-o, p, q-r, s, t-z (11 Google Sites pages, fetched, HTTP 200): web copies of the definitions. The A page was compared with the A PDF: the wording is nearly identical but not word for word (for example one definition reads ''is'' on the page and ''are'' in the PDF), and the pages have no Mainframe part, so the PDFs the dictionary policy itself links are the documents of record and the pages are watched, not seeded.'
- text: 'Other ETS pages read and left out as not instruments: Governance (Change Advisory Board, Wyoming Data Governance Council, GIS Advisory Board: descriptive pages of bodies, no charter file linked); Legislative Reporting (reports: the quality management model reports under W.S. 9-2-2906(b)(xiv), the federal program lists under 9-2-2906(o), the public finance site and PCI reports, bulk purchasing report); the 2026-2028 Strategic Plan (a strategy document); Cybersecurity pages including Incident Reporting, ChatGPT & AI, CARE Team and awareness campaigns (guidance and public information pages); Network Bids, services and maintenance pages (not policy). A separate employee site (etsresources.wyo.gov, itstateresources.wyo.gov) was linked from the ETS home page but not read.'
