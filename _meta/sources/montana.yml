  why_relevant: 'The statute on government use of AI (Title 2, chapter 21, part 1, enacted as Chapter 427, Laws of 2025): definitions, uses a government entity or state officer may not make of an AI system (cognitive behavioral manipulation, classification resulting in unlawful discrimination or disparate impact, malicious purposes, surveillance of public spaces with stated exceptions), disclosure when AI-produced material is published without human review or when the public interface is with an AI system, and human review of AI recommendations or decisions that could affect a person''s rights, duties or privileges.'
