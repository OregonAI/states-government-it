# Montana seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Discovery 2026-11-12 through the toolkit Fetcher: the Legislature's Montana Code Annotated (mca.legmt.gov), the State
# Information Technology Services Division's pages (sitsd.mt.gov), the Governor's executive order list (governor.mt.gov) and
# the former governors' archive (formergovernors.mt.gov), the Department of Administration's centralization page and its
# rules page, the statewide policy portal (montana.servicenowservices.com) and the rules site (rules.mt.gov).
# Statute entries are bundles of section pages: each entry's url is the first section's page, so the monthly drift run
# (corpus-detect-changes), which reads only that url, will not see a change to the other sections; the watch entries on
# the part indexes are the detector. Drift was not run here.
# The statewide IT policy library (the Montana Operations Manual policies) is not in the list: see left_out.
