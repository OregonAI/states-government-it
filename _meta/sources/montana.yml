  found_via: 'Section pages under https://mca.legmt.gov/bills/mca/ (Montana Code Annotated 2025, the Legislature''s static HTML tree): section numbers copied from the part''s section index, page addresses built from the numbers by the pattern in src/states/montana.py (section_url); every page''s printed section number is checked against the list at ingest. This section is the only one taken from Title 2, chapter 15, part 1.'
  why_relevant: 'The cybersecurity statute for state agencies: each department head is responsible for an adequate level of security for all data in the department, must keep written internal security policies, designate an information security manager, implement safeguards, have the security program evaluated internally, include security requirements in solicitations, and describe the security program in the agency IT plan. This section sits in Title 2, chapter 15, part 1 (general provisions on the executive branch); it is taken alone because it is the data-security duty the IT Act (2-17-534) implements.'
