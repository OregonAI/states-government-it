  found_via: 'Section pages under https://mca.legmt.gov/bills/mca/ (Montana Code Annotated 2025, the Legislature''s static HTML tree): section numbers copied from the part''s section index, page addresses built from the numbers by the pattern in src/states/montana.py (section_url); every page''s printed section number is checked against the list at ingest.'
  why_relevant: The Department of Administration maintains the IT resources through which citizens, businesses and other governments reach state information and services; agencies must establish digital access systems that meet the Department's minimum technical standards and publish specified information through them; the Department sets the policies, framework, controls and standards for those systems and provides security to protect their integrity.
