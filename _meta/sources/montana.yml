- id: mt-eo-9-2016
  url: https://formergovernors.mt.gov/bullock/docs/2016EOs/EO-09-2016%20Convergence%20Plan.pdf
  format: pdf
  stub: true
  stub_reason: 'A scan with no text layer (a copier''s image of two pages), read 2026-11-12 by the two-engine OCR procedure and NOT promoted: the engines agree on the words but on only 83% of the 17 figures (tesseract''s default layout and page-segmentation mode 4 gave the same 83%), under the 90% bar; the order''s paragraph numbers, the date and the signature are the contested figures, so the operative text would not be reliable and no text is committed. Reopens when a reading passes the figure bar (a third engine as tiebreaker) or the owner supplies a human transcription. The order was read from page images by the agent to confirm that it is in force until amended or rescinded and to see its heading (EXECUTIVE ORDER NO. 09-2016); those readings are not committed text.'
  citation: Executive Order No. 9-2016
  title: Implementing the State Information Technology Convergence Plan
  doc_type: executive_order
  issuing_body: Office of the Governor (Governor Bullock)
  tags:
  - governance
  - cloud-resilience
  - procurement
  found_via: Governor Bullock's executive order list at formergovernors.mt.gov/bullock (row 'Implementing the State IT Convergence Plan', 2016 orders); the heading of the fetched file reads 'EXECUTIVE ORDER NO. 09-2016'. No order repealing it appears on the current Governor's list.
  why_relevant: 'Directs the Department of Administration''s State Information Technology Services Division to implement an IT convergence plan (full use of shared enterprise infrastructure by December 31, 2017), restricts the purchase of servers, storage and cloud services to SITSD unless the Budget Director and State CIO direct otherwise, and requires agencies to use enterprise systems. It says it remains in effect until amended or rescinded; no rescission was found (a scan; see the stub reason).'
  jurisdiction: montana
  recheck: monthly
