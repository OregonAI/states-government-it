  why_relevant: 'The cybersecurity statute for state systems at the Department level: the Department provides centralized management and coordination of state policies for the security of data and IT resources, maintains the minimum security policies, framework, controls, standards, procedures and guidelines (implementing 2-15-114), sets guidelines for positions of special trust, standards for data exchange, a security training program, security requirements in solicitations, and technical help on request.'
