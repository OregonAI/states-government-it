  why_relevant: 'Government-held data and digital services: a government operator of a website or online service may not collect personally identifiable information online unless it identifies itself, describes its information practices and security steps, and meets the further conditions of 2-17-552; the Department of Administration may act against an agency that does not meet the state security policies. ''Governmental entity'' covers the state and its political subdivisions.'
