  found_via: 'Section pages under https://mca.legmt.gov/bills/mca/ (Montana Code Annotated 2025, the Legislature''s static HTML tree): section numbers copied from the part''s section index (title_0180/chapter_0050/part_0060/sections_index.html, which lists 18-5-601 to 18-5-605), page addresses built from the numbers by the pattern in src/states/montana.py (section_url) and every page''s printed section number checked against the list at ingest. The part is linked from the SITSD accessibility page. This part sits in Title 18 (public contracts), chapter 5 (special purchasing conditions).'
  why_relevant: 'Whole part on state IT procurement and accessibility (Title 18, chapter 5, part 6): when information technology equipment and software are procured for use by employees, program participants or the public, the state agency head shall ensure nonvisual access for blind or visually impaired users (18-5-603); the Department of Administration develops the technology access clause and nonvisual access standards, inserted in all state IT contracts (18-5-604); a state agency head may not approve excluding the clause (18-5-605). Owner decision: the playbook leaves sections inside procurement chapters out pending section-level slicing, but this is a whole part about IT, taken as one bundle.'
