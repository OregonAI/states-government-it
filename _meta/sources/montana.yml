  found_via: 'Section pages under https://mca.legmt.gov/bills/mca/ (Montana Code Annotated 2025, the Legislature''s static HTML tree): section numbers copied from the part''s section index, page addresses built from the numbers by the pattern in src/states/montana.py (section_url); every page''s printed section number is checked against the list at ingest.'
  why_relevant: 'The enabling statute for the Department of Administration''s IT authority and the State Chief Information Officer (Title 2, chapter 17, part 5): the state''s IT policy, the CIO''s duties (2-17-511), the Department''s power to establish and enforce statewide IT policies, standards and the state strategic IT plan and to approve agency IT plans and IT budget requests (2-17-512), the Information Technology Board''s duties (2-17-513), enforcement and exceptions (2-17-514, 2-17-515), the exemptions of the Department of Justice, Secretary of State, university system, State Auditor and Office of Public Instruction (2-17-516, 2-17-546), rulemaking (2-17-518), the strategic plan and agency IT plans (2-17-521 to 2-17-527). Sections 2-17-532 to 2-17-534 and 2-17-550 to 2-17-561 of the same part are separate documents; 2-17-543 to 2-17-545 (9-1-1 and mutual aid radio frequencies) are left out.'
