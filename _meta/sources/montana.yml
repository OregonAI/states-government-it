- id: mt-gov-memo-2023-05-17
  url: https://gov.mt.gov/_docs/governor/Governors-Memo-to-CIO-Agency-Directors-Prohibiting-the-Use-of-Apps-Tied-To-Foreign-Adversaries.pdf
  format: pdf
  stub: true
  stub_reason: 'The PDF (998,893 bytes, 2 pages, fetched through the Fetcher 2026-11-12) has an embedded text layer made by Adobe Paper Capture OCR (the file''s Producer field), and the layer has errors measured against the page image: the letterhead name reads GIANFOITTE for Gianforte, the app Lemon8 reads Lemons, and blogs reads biogs (footnote 1). Operative text of record cannot be hand-corrected, so no text is committed. Reopens when the Governor''s office publishes a clean text layer or the owner supplies a transcription.'
  citation: Governor''s memorandum of May 17, 2023 to the Chief Information Officer and executive agency directors
  title: Expanding TikTok prohibition to all social media applications that provide personal information or data to foreign adversaries
  doc_type: policy
  issuing_body: Office of the Governor
  tags:
  - cybersecurity
  - governance
  found_via: 'Reviewer finding, then fetched: the memorandum PDF on gov.mt.gov; its printed header reads DATE: May 17, 2023 and RE: Expanding TikTok prohibition to all social media applications that provide personal information or data to foreign adversaries; effective June 1, 2023. It extends the December 2022 prohibition (mt-gov-memo-2022-12-16). No order or memorandum rescinding it was found on the pages read.'
  why_relevant: 'A directive of the Governor to the State CIO and executive agency directors: no executive branch entity, official or employee may download or access the named applications on government-issued devices or while connected to the state network, and third-party firms working for the State may not use them; agencies must block and remove them and report exceptions to the Office of the Governor. It binds state entities and their contractors and its subject is state IT security, so it meets the inclusion test. Owner decision whether a gubernatorial memorandum counts as an instrument.'
  jurisdiction: montana
  recheck: monthly
