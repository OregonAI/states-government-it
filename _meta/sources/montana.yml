left_out:
- text: '---- Montana: found and left out (each was seen on an official page on 2026-11-12; the reason is recorded here). ''Owner decision'' marks a judgment call a reviewer should confirm.'
- text: 'The statewide IT policy and standards library, owner decision on how to proceed: the SITSD home page''s ''Policies'' link goes to the Department of Administration''s ServiceNow knowledge portal (montana.servicenowservices.com/citizen; the Montana Operations Manual policies and standards live there). The Fetcher got a 173 KB page whose entire visible text is ''Citizen Knowledge Home - Citizen Loading...'' (and ''Knowledge Article View - Montana Loading...'' for the knowledge article that the SITSD cybersecurity page links, KB0015400): an AngularJS shell whose content is loaded by the portal''s own script. The shell differs byte for byte on every fetch (it carries session values), so it is not watched either. No policy title, number or file could be read, so there are no per-policy stubs and no row-by-row reconciliation of the library: the library is unread, not empty. The portal''s internal data calls were not used. Reopens when a static listing or documented export is found or the owner supplies the list. The sites that used to hold the library (sitsd.mt.gov /Governance/IT-Policies, /Governance/Policy, /SITSD/policies, the policy.tech host montana.policytech.com) answered 404 or ''This is not a valid site''.'
- text: 'Montana Operations Manual policy copies hosted by other agencies, left out: a State Auditor host serves POL-Internet Privacy and Security Policy (printed Effective Date 02/01/2002, Last Revised 02/18/2015), a Department of Transportation host serves POL-Information Security Policy - Appendix B, Security Roles and Responsibilities (Effective Date 09/04/2015, Last Revised 12/13/2017) and mt.gov serves an older-format MOM-SITSD-POL-Internet Privacy and Security Policy. All three were fetched and read. They are copies of the Department of Administration''s policies on other agencies'' sites, last revised 2015 and 2017 by their own dates (the first took effect in 2002), and whether any is the version in force cannot be confirmed because the library of record cannot be read; the playbook''s rule is in force only and text of record from the issuing body. Owner decision: they could be seeded as policies if the owner accepts an agency-hosted copy as the text of record.'
- text: 'Rules, left out or stubbed: the SITSD rules are one stub (ARM Title 2, chapter 12): rules.mt.gov is a JavaScript application with no readable text (see that entry). The rulemaking notices the Department of Administration lists for SITSD are not instruments of themselves (they amend rules and give reasons), and the Department''s page links only the 2024 adoption notice as a file it hosts. Left out: ARM 2.12.208, Local Government Public Meeting Recordings (adopted by MAR 2-12-646, read in the Department''s PDF of the adoption notice: it binds local governing bodies, out of scope); MAR notices 2-13-585, 2-13-592, 2-13-593 and 2-13-605 (chapter 2.13: 9-1-1 grants, PSAP certification and Next Generation 9-1-1 technology standards, which are 9-1-1 and telecom, out of scope). The notice files linked from the Department''s page through rules.mt.gov/gateway/ShowNoticeFile.asp returned the same unreadable shell. The rule text of the other agencies'' notices on that page (banking, lottery, state financial services, state human resources, public meetings, permits) is outside the domain.'
- text: 'Statute sections found in Title 2, chapter 17, part 5 and left out: 2-17-543 to 2-17-545 (9-1-1 program, mutual aid frequencies and the mutual aid frequencies manual for land mobile radio, run by the Department of Justice: 9-1-1 and radio, out of scope); 2-17-501 to 2-17-503, 2-17-531, 2-17-541 and 2-17-542 (repealed or renumbered, printed as such on the part''s index). Chapter 17 parts 1 to 4, 6, 8 and 12 (real property and buildings, property and supplies, mailing and copying, vehicles, competition with private internet providers, the Capitol Complex master plan, building construction loans) were listed and not read: not IT. Part 6, government competition with private internet providers, is broadband, out of scope.'
- text: 'Other statutes considered and left out, owner decisions: Title 2, chapter 6, parts 10 to 12 (public information, records management and the State Records Committee, local government records): records and open-records law, not IT, and sections in chapters on other subjects are left out pending the owner''s decision on section-level slicing (2-6-1102, the Department of Administration''s records duties, is the nearest to IT); Title 2, chapter 15, part 10 other than 2-15-1021 and part 1 other than 2-15-114 (the Department''s and executive branch''s organization); procurement law (Title 18, chapter 4) and the Uniform Electronic Transactions Act (Title 30, chapter 18), which bind state agencies in sections inside non-IT chapters, were not read; private-sector breach, consumer data privacy and any 2025 ''right to compute'' law bind persons, not state agencies, and were not read. Law-enforcement uses of AI named in 2-21-102(4)(b) (Title 44, chapter 15, part 1, facial surveillance) are law-enforcement technology, out of scope. Not read: the Education and Workforce Data Governing Board''s statute (the Board is attached to the Department of Administration), and the Disaster and Emergency Services cybersecurity framework (Emergency Support Function 16), a plan.'
- text: 'Statute sections taken from outside Title 2, chapter 17: 2-15-114 and 2-15-1021 are sections of Title 2, chapter 15 (executive branch officers and agencies), taken because they are the agency data-security duty that 2-17-534 implements and the statute of the IT Board that 2-17-513 gives duties to. Owner decision: the playbook leaves sections inside non-IT chapters out, and these two are the exception. 2-17-546 (exemption of the criminal justice information network) is bundled with the IT Act because the Act''s scope sentences cite it with 2-17-516.'
- text: 'Executive orders, the lists read: the Governor''s list at governor.mt.gov (Governor Gianforte''s orders, 63 rows, Executive Order No. 1-2021 to 11-2026, read in full on 2026-11-12); the former governors'' archive''s list for Governor Bullock (formergovernors.mt.gov, orders 1-2013 to 13-2020) and for Governor Schweitzer (2005 to 2012, one page). The lists of Governors Martz, Racicot and earlier were not read. Seeded: 3-2025 (Gianforte) and 9-2016 (Bullock). By title, no other order on those lists is on state IT, cybersecurity, data or AI, except the ones below.'
- text: 'Executive orders found and left out: No. 5-2025, Creating the 406 Jobs Initiative (a workforce-development framework: its mentions of AI concern AI skills training and automation in the labor market and ask the Department of Administration to support workforce strategies; it does not set rules for state IT or for state use of AI); No. 4-2026 (repeals Executive Orders 3-2018 and 6-2018, on net neutrality in state contracting, telecom); No. 5-2026 (repeals Executive Orders 4-2014, 4-2016 and 12-2016, read: workforce and anti-discrimination in contracting); Bullock orders No. 5-2015 (created the Montana Information Security Advisory Council, ''shall exist for a period of four years''), No. 12-2017 (amended it, ''shall exist until June 12, 2019'') and No. 13-2020 (continued it, ''shall exist until June 30, 2021''): each read and expired by its own terms, and the Governor''s list since shows no continuation; No. 20-2019 (declares a cyber incident at a school district and authorizes spending: a one-time incident declaration); No. 14-2019 (designates a state health information exchange: health data outside state government IT; not read in full); No. 15-2018 (disclosure in state contracting; repealed by Executive Order No. 3-2021 per the list). The Bullock list''s row ''MISAC Continuance'' (Executive Order 21-2016) links a file that is the order continuing the Invasive Species Advisory Council, so the row is mislabeled on the official list; that order is not IT. The Bullock list''s links to the scans 5-2015, 12-2017, 13-2020 were fetched: 5-2015 and 12-2017 have no text layer and were read from page images only to find their end dates.'
- text: 'Not instruments, left out (forms, templates, plans, reports, minutes, contracts and guides found on the SITSD pages read): the State IT Strategic Plans 2016-18 to 2026-28 and the draft 2026-28 plan; the agency IT plans page; the IT biennial reports (2011 to 2026) and Volume 10 reports; the IT Board''s quarterly reports, LFC reports, presentations and minutes; the Enterprise IT Financial Workgroup''s agendas, minutes and presentations; the Esri subgroup charter, the DocuSign and Granicus master services agreements and the Esri enterprise agreement link (contracts); the accessibility resource center''s checklists, GIS accessibility guide, map alternative-text guide and inventory spreadsheet (guidance and workbooks; the page restates federal ADA Title II); the centralization site''s emails, org chart, timeline and transition-topics pages (the order itself is seeded); the MT-ISAC resource link (Acceptable Use) found by search, which answered 404 on the SITSD host.'
- text: 'Seed notes for the reviewer: (1) the statute bundles take each section page''s content block; the pages carry a host-injected script that differs per fetch, which is not kept. (2) Section page addresses are built from section numbers by a pattern (checked against all 44 section pages fetched, each printed number matching its path); the part section indexes (watched) print the same paths. (3) mt-eo-9-2016 is a scan whose two OCR readings agree on only 83% of its 17 figures (under the 90% bar), so it is a stub with the measured reason. (4) The Governor''s order links on governor.mt.gov are relative and do not resolve on that host (404 for the Fetcher at the page-relative path); the files are served under gov.mt.gov/Documents/GovernorsOffice/executiveorders/ (the address the Department of Administration''s page links for order 3-2025), so every order''s address there is built from the filename on the list: only 3-2025 is seeded and its title block was confirmed in the fetched bytes.'
- text: 'Owner decision, Information Technology Board Operating Procedures (mt-itb-operating-procedures-2026, ingested as a policy): the document is the procedural rules of a statutory advisory board (roles, membership, voting and quorum, meetings, SITSD support), not a statewide policy that binds agencies. It was ingested because it is the board''s own governing document under 2-17-513 and 2-15-1021. Decide whether board operating procedures count as an instrument; if not, move the entry to left_out.'
- text: 'Governor''s memoranda on state IT security (owner decision): the memoranda of December 16, 2022 (TikTok) and May 17, 2023 (social media applications tied to foreign adversaries) bind executive branch entities, officials, employees and third-party firms on state devices and the state network, so they are in scope if a gubernatorial memorandum counts as an instrument. Both are stubs because their PDF text layers are OCR with errors (see the two entries). Read: the Governor''s news release of December 2022 on news.mt.gov; the May 2023 release was not fetched.'
