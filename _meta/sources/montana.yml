  stub: true
  stub_reason: 'The rule text of record is the Secretary of State''s Administrative Rules of Montana at rules.mt.gov, a JavaScript application: the Fetcher received the same 894-byte page shell (a <div id="root"> and two script bundles, no rule text) for the home page and for every path tried on 2026-11-12 (/, /gateway/ChapterHome.asp?Chapter=2.12, /gateway/RuleNo.asp?RN=2.12.201, /gateway/Subchapterhome.asp, /gateway/ShowNoticeFile.asp?TID=11010), and the older mtrules.org host answered the same shell (www.mtrules.org failed with an incomplete TLS chain). The site''s internal data calls are not used. The rules cannot be listed or read, so no ARM section is named; chapter 2.12 is the chapter the Department of Administration files its SITSD notices under (MAR 2-12-623, 2-12-646) and 2-17-518 directs these rules (review and approval of IT acquisitions and software, exceptions, agency IT plans, policy-setting and appeals).'
  found_via: 'SITSD section of the Department of Administration''s administrative rules page (sitsd.mt.gov/About/administrative-rules): MAR notices 2-12-623 (2022: amendment and repeal of rules on review and approval of IT procurement and development, exceptions, centralized state facilities, agency IT plans, policies and standards, appeals) and 2-12-646 (2024: adopting ARM 2.12.208, local government public meeting recordings, authority 2-17-518).'
