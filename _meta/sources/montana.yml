  found_via: Row 'Integrating Information Technology Resources and Creating an Enterprise Information Technology Governance, Executive Order No. 3-2025, July 1, 2025' on the Governor's executive order list (governor.mt.gov/Newsroom/ExecutiveOrders), whose link is relative (View?doc=250626_EO_03-2025_FINAL.pdf); the address that serves the file is the one the Department of Administration's centralization page (centralization.mt.gov/faqs) links. The heading and title block were confirmed in the fetched bytes.
  why_relevant: 'Governor''s order integrating executive branch IT under the Department of Administration and the State CIO: overall responsibility for management and operation of all IT resources of executive branch agencies (exempting the Department of Justice, Secretary of State, University System, State Auditor, Office of Public Instruction and Public Service Commission), IT staff functionally reporting to the State CIO, a hiring freeze on IT positions unless the State CIO approves, a central Integrated Management Office, budget alignment, and agency access to IT inventories, systems, data and contracts. Effective July 1, 2025 until amended or rescinded.'
