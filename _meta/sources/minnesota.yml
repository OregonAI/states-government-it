left_out:
- text: '---- Minnesota: found and left out (each was seen on an official page on 2026-11-11 unless it says it was seen only in a web search; the reason is recorded here)'
- text: 'MNIT statewide policy and standards library (the HTML pages on mn.gov): NOT READABLE, SO NOT RECONCILED ROW BY ROW, AND NOT WATCHED. Measured through the toolkit Fetcher (crawler User-Agent, per-host rate limit): mn.gov HTML pages answer HTTP 200 with a 21,621-byte ''Radware Bot Manager Captcha'' page, never the library. Challenged on 2026-11-11: /mnit/government/policies/security/, /procurement/, /accessibility/, /geo/, /mnit/government/policies/index.jsp, /mnit/government/policies/security/index.jsp, /mnit/government/policies/security/ai-standard/ and its index.jsp, /mnit/about-mnit/security/index.jsp, /mnit/ and the Governor''s executive order list (mn.gov/governor/news/executive-orders/). The very first request, to https://mn.gov/mnit/government/policies/, returned a real 90,132-byte page (HTTP 200); every later request to it was challenged, and those first bytes were not kept. That page''s navigation named four sections of the library (Accessibility, Geospatial, Procurement, Security); the Security section''s list of documents is loaded by script from a feed and was never in a fetched page. No challenge was solved and no feed or other internal endpoint was called. Consequence: the library''s rows were never read, so ''every item in the library'' cannot be claimed. What was done instead: PDFs on mn.gov/mnit/assets are not challenged, so 26 policy and standard PDFs found by web search (discovery only: the mn.gov security library pages, and the ''Related Information'' lists printed in the PDFs) were fetched through the Fetcher and are seeded, each confirmed in its own bytes (title, version, approval date). They are the set that web search and the PDFs'' own printed links could surface, not a complete set: a first pass called 22 PDFs the whole set, and a reviewer''s one further search found the Security Incident Management Standard (now seeded), so a security document the searches did not surface is missing. Added after review, each fetched through the Fetcher with a text layer on every page: the Security Incident Management Standard (tcm38-323793, named in the Security Monitoring and Response Policy''s Related Information), the Supply Chain Risk Management Standard (tcm38-754632, in search results and in the Supply Chain policy''s Related Information), the Secure Systems Development and Acquisition Policy (tcm38-323789, a link printed inside three seeded PDFs) and the Vulnerability Disclosure Policy (tcm38-552936, in search results). OWNER DECISION: a reviewer with a browser should read the Security, Procurement and Accessibility pages at https://mn.gov/mnit/government/policies/ and add what is missing; the three section pages cannot be watch_only entries until the host answers the Fetcher, because the drift run would hash a CAPTCHA page.'
- text: 'Titles named in the Related Information lists of the 26 seeded MNIT PDFs (each list read from the committed snapshot text), and what became of each. SEEDED (each now a document): Security Incident Management Standard (named in the Security Monitoring and Response Policy; fetched from tcm38-323793, Version 1.8); Supply Chain Risk Management Standard (named in the Supply Chain Risk Management Policy; tcm38-754632); Secure Systems Development and Acquisition Policy (named in the Secure Configuration Standard, the Secure Systems Development and Acquisition Standard and the Supply Chain Risk Management Policy; tcm38-323789, a link printed in the PDFs); ''Logging and Monitoring Standard'' (the Security Monitoring and Response Policy''s name for the seeded Security Logging and Monitoring Standard); the other titles named are seeded under their own entries. NOT FOUND BY SEARCH, so neither seeded nor fetched: (1) the Privileged Access Management Standard, also printed as ''Privileged Account Management Standard'' (named in the Identity, Credential, and Access Management Policy and Standard; the Standard marks controls ''Withdrawn. See Privileged Access Management Standard.'', so privileged-access controls moved to a document that is not in this set and the access-control set has a gap). Searches run on 2026-11-11: ''Privileged Access Management Standard'' and ''Privileged Account Management Standard'' with mn.gov and mnit assets, in standard and extended web search, which returned only the Identity and Access Management documents, other states'' standards and the library''s Identity Access Management Standard page (mn.gov/mnit/government/policies/security/?id=38-323904, behind the CAPTCHA, not fetched). OWNER DECISION: add it once a URL is confirmed in bytes. (2) the DNS Naming Guideline for Servers (named in the Secure Configuration Standard): searched together with the other titles; no MNIT file of that title surfaced; a guideline in any case and not a policy or standard. (3) State Standards and Authoritative Source Cross Mapping (named in nearly every seeded policy and standard) and the Glossary of Information Security Terms: no current file found (the only glossary found, https://mn.gov/mnit/images/SEC_R_Glossary.pdf, fetched, is Version 1.01 of an Office of Enterprise Technology ''Enterprise Security Office Guideline'' of 45 pages, the agency''s name before MNIT: a guideline and not the current document); a cross mapping is a reference table and a glossary a reference document in any case. (4) Other MNIT security asset ids between tcm38-323777 and tcm38-323799: seeded ones are 323778 (IT Disaster Recovery Standard), 323779, 323780, 323781, 323782, 323784, 323785, 323786, 323787, 323788, 323789, 323791, 323793, 323794, 323795 and 323799 as the URLs of the entries or links printed in the PDFs; 323790 and 323792 were looked for by searching their ids and the likely titles and nothing surfaced, and no URL was guessed. Not instruments, named in the lists: Minnesota Statutes chapters 13, 16C and 16E (13 and 16E seeded; 16C is the OWNER DECISION above), HIPAA, FISMA, the CJIS Security Policy, IRS Publication 1075, PCI DSS, NIST SP 800-53, 53A, 53B and 161, GovRAMP Standards, the Minnesota Legislative Manual (Blue Book), Governor''s Executive Orders 15-13 and 15-14 (rescinded by 19-22 and 19-23, which are emergency assignments and continuity of government plans, fetched from the Legislative Reference Library archive and read: not IT instruments).'
- text: 'Superseded or not confirmed current, fetched or seen and left out: (1) https://mn.gov/admin/assets/mnit_physical_security_standard_tcm36-232172.pdf (fetched; ''Enterprise Physical and Environmental Security Standard'' Version 1.1, effective 1/1/2016): replaced by Version 1.8 of the Physical and Environmental Security Standard, which is seeded. (2) Accessibility standards, fetched: https://mn.gov/mnit/assets/Standard_Accessibility_090110_tcm38-610080.pdf (Office of Enterprise Technology ''Accessibility Standard'', number to be assigned) and https://mn.gov/mmb/assets/Stnd_State_Accessibility_tcm1059-232671.pdf (''Minnesota State Accessibility Standard'', Version 2.00, approved 10/03/2013). Neither is confirmed current: the library''s accessibility pages, which would say which standard applies, are behind the CAPTCHA. OWNER DECISION. (3) Seen only in a web search and not fetched, all under mn.gov/mnit/images/ and all Office of Enterprise Technology era (2011 and earlier): SEC_S_Physical_Security_and_Environmental_Protection.pdf, SEC_S_Enterprise_Security_Program_Applicability.pdf, SEC_S_Information_Sanitization_and_Destruction.pdf, SEC_S_Enterprise_Security_Portable_Computing_Devices.pdf. Newer files on the same subjects are seeded (the Applicability Standard, the Physical and Environmental Security Standard); the Information Sanitization and Destruction and Portable Computing Devices standards were not matched to a current document.'
- text: 'MNIT pages that were named in the library''s navigation or in a web search and are HTML behind the CAPTCHA (never fetched, so no URL is confirmed in bytes and none is a stub): the geospatial standards (A Methodology for Measuring and Reporting Positional Accuracy in Spatial Data; Codes for the Identification of Basins in Minnesota; ... of Counties in Minnesota; ... of River Reaches and Watercourses in Minnesota; ... of the States and the District of Columbia; ... of Watersheds (Hydrologic Units) in Minnesota; Coordinate Specifications for Spatial Data Exchange Between Minnesota State Agencies; CTU Identifier Codes; Minnesota Geographic Metadata; United States National Grid: ten titles, read in the first fetched page''s navigation), ''Statutory Basis for Accessibility'', the MNIT Social Media Use Policy, the Telework pages (Secure Teleworking, Telework Environment), the Public Artificial Intelligence Tool Security Standard page and its FAQs (the standard itself is seeded from its PDF), ''EO 20-22 - Minnesota Fusion Center'' and ''Executive Order 22-20 Summary'' pages, and the Procurement page''s lines (a March 2007 Department of Administration policy and the Viewstate hardware and software standards, both pointing to https://mn.gov/mnit/government/buyit/). OWNER DECISION: each needs a reviewer with a browser to decide whether it is an instrument or a guidance page.'
- text: 'MNIT Government Data Practices Manual (https://mn.gov/mnit/assets/mnit-data-practices-manual_tcm38-286378.pdf, fetched: 28 pages, dated 07/22/2026, ''MNIT Policies, Procedures and Forms''): the agency''s own compliance manual for its data practices duties with forms; not a statewide policy or standard and the library does not (as far as it could be read) list it. OWNER DECISION: add as a policy if the owner wants agency-level procedures.  Not instruments, not fetched: MNIT annual and quarterly reports, Technology Advisory Council, Cybersecurity Task Force and other committee pages, the service catalog (including the Copilot Chat and artificial intelligence service pages), whole-of-state cybersecurity plan pages, Technology Modernization Fund pages and success stories, all read as navigation text of the first fetched page.'
- text: 'Statutes: seeded are chapter 16E (the enabling statute, the cybersecurity duty in 16E.03 subd. 7 and incident reporting in 16E.36) and chapter 13 (Government Data Practices, which binds state agencies). Artificial intelligence: no enacted statute on state-agency use of AI was found. Searched: the full text of chapters 16E and 13 as printed by the Revisor (no ''artificial intelligence'', ''generative'', ''automated decision'' or ''algorithm'' in either); https://www.revisor.mn.gov/statutes/cite/13E answers HTTP 404. Web search (discovery only) surfaced only bills of the 94th Legislature: SF 4575 and HF 4536 (2026, would add a chapter 13E barring government entities from using generative AI to create official records) and private-sector bills; none is confirmed enacted and 13E is not in the Revisor''s statutes, so they are bills not yet enacted and out of scope. Chapter 120 of the 2026 session laws (https://www.revisor.mn.gov/laws/2026/0/120/, read) is the human services IT modernization act; its sections 16E.40 and 16E.50 are already in the seeded chapter 16E page. Not fetched, non-IT chapters that govern state procurement and records and that chapter 16E cross-refers to: 16B (Department of Administration), 16C (State Procurement), 138 (records). OWNER DECISION on whether section-level slices of 16B and 16C are wanted (the playbook leaves non-IT chapters out pending that decision). Out of scope by the domain test: the Minnesota Consumer Data Privacy Act and other private-sector data and AI laws, deepfake and nudification laws (2026 chapter 72), health insurer AI limits, the Legislative Commission on Cybersecurity (legislative branch).'
- text: 'Administrative rules: none by an information technology agency. The Revisor''s agency table (https://www.revisor.mn.gov/rules/, 105 rows, read in full) has no row for MNIT, MN.IT Services, the Office of Enterprise Technology or any other IT body. Seeded: Minn. R. chapter 1205 (Data Practices, Department of Administration). The Department of Administration''s other chapters (1200, 1215 Emergency 911 Communications, 1220, 1225, 1230 State Contracts, 1235, 1240, 1245, 1250 State Publications, 1255, 1260, 1265 Intercity Telephone Services, 1310 Building Security, 1320, 1340, 1345, 1355, 1365; read as their agency page''s titles) are not IT instruments (telecommunications and 911 are out of scope; 1230 is general state contracts, a non-IT chapter).'
- text: 'Executive orders: the Legislative Reference Library''s list of all executive orders (https://www.lrl.mn.gov/execorders/eoresults.aspx?gov=all, 1,359 rows, 1967 to 2026-10-30, read in full; the Governor''s own page is behind the CAPTCHA). A title and notes keyword filter (information technology, cyber, artificial, AI, data, technology, MNIT, security, privacy, digital, computer, electronic, software, internet, network, records) matched 63 rows, all read. In force and seeded: 22-20 (cybersecurity) and its amendment 24-07 (a stub: see its stub_reason). Walz orders left out: 19-02 (Blue Ribbon Council on Information Technology) and 20-77 (continues it ''through February 28, 2021'', fetched and read): expired; 19-10 (Task Force on Broadband): telecom, out of scope; 26-03 (permitting reform; one directive is ''Pilot artificial intelligence to find innovative ways to improve permitting timelines'', fetched; the AI line found by searching its text): a permitting order, not about state IT, and its text drops the ''ti'' ligature like 24-07; OWNER DECISION whether this single AI directive makes it an instrument; 25-01 and 25-10 (fraud; 25-10 paragraph 4 has MNIT assist agencies with data analysis technology, fetched, text searched): fraud orders, not IT instruments. No other order from 2019 on has an IT, data or AI title. Orders of earlier governors are not seeded: Minn. Stat. 4.035, subd. 3 (fetched and read) says an executive order expires 90 days after its governor leaves office unless an earlier date is set. Specifically read and left out: 05-04 (Pawlenty, ''Providing Direction to State Departments Regarding Information Technology Governance'', 2005, directs a State CIO and enterprise IT governance under chapters 16B, 16C and 16E; that is now chapter 16E''s department by statute) and 96-8 and 98-14 (Carlson, 1996 and 1998). OWNER DECISION on 05-04: whether the 2007 text of subd. 3 reaches an order issued in 2005 was not determined; nothing read shows 05-04 was in force in 2026.'
- text: 'Governor''s directives other than numbered executive orders were not looked for: the Governor''s site is behind the CAPTCHA and the Legislative Reference Library list holds numbered orders only.'
- text: 'Owner decision 2026-11-13 (IT-governance provisions inside non-IT chapters), applied to the Minnesota candidates; each section read in the Revisor''s full-chapter pages fetched through the Fetcher on 2026-11-13, and 16A.11 fetched again as its own page. Nothing from these chapters is seeded. (1) LEFT OUT, focus is not IT: chapter 16C sections 16C.02 to 16C.09 (the candidate named by the Supply Chain Risk Management Policy''s ''Key sections: 16C.03''): definitions, the commissioner''s general purchasing powers, ethics, contract management, procurement requirements, professional or technical services and general service contracts; they apply to every purchase of goods and services and the only technology wording in them is one item in a list of what a services contract must describe (16C.08, ''a description of the procurement method to be utilized to address accessibility standards for technology services'') and the example ''contracts for computer systems'' in a commodity-code list. (2) OWNER DECISION, 16A.11 (the governor''s budget to the legislature; a candidate cited by chapter 13 as 16A.672 only in a data classification, with 16A.1285, 16A.28 and 16A.671): subdivision 1 does carry IT-spending wording: ''Detailed recommendations as to information technology expenditure must be submitted as part of the detailed operating budget. Information technology recommendations must include projects to be funded during the next biennium and planning estimates for an additional two bienniums. Information technology recommendations must specify purposes of the funding such as infrastructure, hardware, software, or training.'' Declined as seeded because the section is the contents and timing of the governor''s whole budget (capital expenditure dates, parts one to four of the budget, the message, internal service fund investments of $100,000 or more in subd. 3(d)) and those three sentences are one requirement among them, but the decision 1 example ''a budget section on IT project funding or IT spending approval'' could be read to reach it. 16A.1285 (departmental earnings), 16A.28 (unused appropriations) and 16A.671 (certificates of indebtedness) are general budget and finance law with no IT focus. (3) OWNER DECISION, not cited by any candidate, so outside the approval as worded, though each section''s own focus is state IT and each was read whole with no repeal or expiry marker: Minn. Stat. 16C.145 (https://www.revisor.mn.gov/statutes/cite/16C.145), nonvisual technology access standards: ''(a) The commissioner shall develop nonvisual technology access standards. The standards must be included in all contracts for the procurement of information technology by, or for the use of, agencies, political subdivisions, and the Minnesota State Colleges and Universities.'' (paragraph (d) excepts executive branch agencies subject to section 16E.03, subdivision 9); Minn. Stat. 16A.81 (https://www.revisor.mn.gov/statutes/cite/16A.81), technology development lease-purchase financing: subd. 1(b) ''"Technology system project" means the development, acquisition, installation, and implementation of a technology system that is essential to state operations and is expected to have a long useful life'', subd. 2 ''The commissioner may enter into a lease-purchase agreement in an amount sufficient to fund a technology system project and authorize the public or private sale and issuance of certificates of participation'', subd. 4 ''Proceeds of the lease-purchase agreement and certificates of participation must be credited to a technology lease project fund in the state treasury.'' (4) 16A.065 (advance payment for software, subscriptions and United States documents): read, but it is not one of the cited sections and its focus is mixed (software and hosting beside booth space, boat slips, newspapers and Library of Congress deposits); OWNER DECISION. (5) Minn. Stat. 138.17 (Records Management Act, the candidate cited by chapter 13): records of every medium ''regardless of physical form or characteristics, storage media or conditions of use'' and of local governments and courts, the Records Disposition Panel, the archives and records inventory and schedules; it is a general records provision, and the only IT wording (optical disk reproductions, software in archive access limits) is incidental, so it fails the focus test.'
