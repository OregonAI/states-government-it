- id: mn-stat-16e
  sha256: "c855228d0b3763047e87a9d0cf95f3d246c327de3a0c32d858221443a54e6d72"
  url: https://www.revisor.mn.gov/statutes/cite/16E/full
  format: html
  citation: Minn. Stat. ch. 16E
  title: CHAPTER 16E. DEPARTMENT OF INFORMATION TECHNOLOGY SERVICES
  doc_type: statute
  jurisdiction: minnesota
  issuing_body: Minnesota Legislature; published by the Office of the Revisor of Statutes
  tags:
  - governance
  - oversight
  - funding
  - procurement
  - cybersecurity
  - data
  - digital-services
  - cloud-resilience
  recheck: monthly
  found_via: https://www.revisor.mn.gov/statutes/cite/16E and its full-chapter page /full; the Revisor's part table (ADMINISTRATION AND FINANCE) lists chapters 16 to 16E
  why_relevant: 'The enabling statute for the Department of Information Technology Services (MNIT) and the chief information officer: creation and responsibilities (16E.01), the CIO''s duties including cybersecurity policies, guidelines and standards for the executive branch (16E.03, subd. 7), the Technology Advisory Council (16E.036), data privacy (16E.06), the revolving fund (16E.14), the Geospatial Information Office (16E.30), county and local cybersecurity grants (16E.35), public agency and contractor cybersecurity incident reporting to the commissioner (16E.36) and the Human Services Systems Modernization Advisory Council and Fund (16E.40, 16E.50). The page serves the whole chapter, so repealed and expired sections ride along as their repeal notes (for example 16E.035, 16E.055 and 16E.20); no section of the chapter is out of scope. The chapter has no provision on artificial intelligence by that name (searched the full text: its only automation hit is ''automation, machine learning, predictive analytics, or advanced modeling tools'' in the human services modernization fund).'
- id: mn-stat-13
  sha256: "65179cd16ca587f8f670cd370fdc923266c91ab98abe4b434442a346b5495bf9"
  url: https://www.revisor.mn.gov/statutes/cite/13/full
  format: html
  citation: Minn. Stat. ch. 13
  title: CHAPTER 13. GOVERNMENT DATA PRACTICES
  doc_type: statute
  jurisdiction: minnesota
  issuing_body: Minnesota Legislature; published by the Office of the Revisor of Statutes
  tags:
  - data
  - cybersecurity
  recheck: monthly
  found_via: 'Named in the MNIT Information Security and Risk Management Program Policy (''Related Information: Minnesota State Statutes Chapter 13'') and in 16E.06'
  why_relevant: 'The Minnesota Government Data Practices Act: how state agencies and other government entities collect, classify, secure, share and dispose of government data, including the duty to notify of a breach in the security of data (13.055) and the classification of security information (13.37). The page serves the whole chapter (about 610,000 characters of text), so the many sections that classify one program''s or agency''s data (for example the health, tax, licensing and personnel data sections) ride along; OWNER DECISION whether the chapter stays whole or is sliced to its general sections. It prints no provision on artificial intelligence (searched the full text for ''artificial intelligence'', ''generative'', ''automated decision'', ''machine learning'' and ''algorithm'': no hit).'
- id: mn-rule-1205
  sha256: "f3ba4f14e1c47e9bffd6f0bf784618d4e1ef7ee5871fb297a6cf747d406953dc"
  url: https://www.revisor.mn.gov/rules/1205/full
  format: html
  citation: Minn. R. ch. 1205
  title: CHAPTER 1205, DATA PRACTICES
  doc_type: rule
  jurisdiction: minnesota
  issuing_body: Minnesota Department of Administration; published by the Office of the Revisor of Statutes
  tags:
  - data
  recheck: monthly
  found_via: https://www.revisor.mn.gov/rules/ (agency table, Administration Department, chapters 1200 to 1365) and https://www.revisor.mn.gov/rules/agency/103
  why_relevant: 'The Department of Administration''s rules implementing chapter 13 for data on individuals: access to public, private and confidential data, the responsible authority''s duties, classification, administrative appeal and the commissioner''s powers. They apply to all governmental entities that keep data on individuals, state agencies among them. The Revisor''s agency table lists no rules of MNIT or of any information technology agency, so this is the only rule chapter seeded. Part 1205.1800 rides along as its repeal notice.'
