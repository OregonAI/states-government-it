# Minnesota seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Issue #17. Discovery 2026-11-11 through the toolkit Fetcher: the Revisor of Statutes (statutes, rules, laws), the Legislative
# Reference Library's executive order list and archive, and MNIT's policy PDFs on mn.gov/mnit/assets. mn.gov HTML pages
# (the policy library, the Governor's site) answer a CAPTCHA to the Fetcher: see the left-out record.
