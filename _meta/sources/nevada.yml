  title: CHAPTER 242 - INFORMATION SERVICES
  doc_type: rule
  issuing_body: Governor's Technology Office (Chief Information Officer); published by the Legislative Counsel Bureau
  tags:
  - cybersecurity
  - governance
  why_relevant: 'The IT agency''s only administrative rule: NAC 242.110 adopts by reference the State Information Security Policies, Standards and Procedures in the form most recently published by the State Information Security Committee, binding every executive-branch agency that operates, manages or uses information technology and every employee, contractor or third party with access to state information, and sets the Chief''s review of each revision. It makes the security library seeded here binding. Issued under NRS 242.111; amended by R082-24 (9-16-24).'
  jurisdiction: nevada
  recheck: monthly
