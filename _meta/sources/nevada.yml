# Nevada seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Issue #38. Discovery 2026-11-12 through the toolkit Fetcher: the Governor's Technology Office site (it.nv.gov: Governance,
# Security Policies Standards & Procedures, ITAB, Organization, TIE, Service Desk, Services/Rates, Contact pages), the Legislative
# Counsel Bureau's NRS table of titles and chapters (833 chapter pages, all fetched and searched) and NAC table of chapters (413
# chapters listed; the IT agency's, NAC 242, and the others named in the left-out record read), the Governor's executive order
# lists (gov.nv.gov, 2023 to 2026), the digital accessibility site (ada.nv.gov), and the State Administrative Manual page of the
# Governor's Finance Office. Search engines were used for discovery only.
sources:
- id: nv-nrs-242
  sha256: "c125fedc50cbcc4cd4c34be3dc66a384fc0bed862e02008c0eaba7af40a53dea"
  url: https://www.leg.state.nv.us/NRS/NRS-242.html
  format: html
  citation: NRS ch. 242
  title: CHAPTER 242 - INFORMATION SERVICES
  doc_type: statute
  issuing_body: Nevada Legislature; published by the Legislative Counsel Bureau
  tags:
  - governance
  - oversight
  - funding
  - cybersecurity
  - procurement
  - data
  why_relevant: 'The enabling statute for the Governor''s Technology Office and the State Chief Information Officer: definitions, the Office and the Chief''s powers and duties (242.101), regulations (242.111), policies, standards, guidelines and the biennial state plan for executive-branch information systems (242.115), the Security Operations Center (242.116 to 242.119), the Information Technology Advisory Board (242.122 to 242.124), the Office of Information Security and Cyber Defense (242.127 to 242.129: duties, statewide strategic plan, incident response teams and plans), services to agencies, breach investigation (242.183), the Fund for Information Services, appropriate-use policies (242.300) and the Cybersecurity Talent Pipeline Program (242.390). Repealed sections (242.013, 242.031, 242.045, 242.141) ride along as ''Repealed'' headings. The page prints its revision stamp ''[Rev. 4/15/2026 ...--2025]''.'
  jurisdiction: nevada
  recheck: monthly
- id: nv-nrs-603a
  sha256: "8b95afcc7467b7c9932a0c928b2f87c9c754ad18f7da4d36212deb7e062eaf97"
  url: https://www.leg.state.nv.us/NRS/NRS-603A.html
  format: html
  citation: NRS ch. 603A
  title: CHAPTER 603A - SECURITY AND PRIVACY OF PERSONAL INFORMATION
  doc_type: statute
  issuing_body: Nevada Legislature; published by the Legislative Counsel Bureau
  tags:
  - data
  - cybersecurity
  why_relevant: 'Binds state agencies as ''data collectors'' (603A.030 includes any governmental agency): destruction of records containing personal information (603A.200), security measures (603A.210, 603A.215), and notice of a breach of the security of the system (603A.220), with the remedies (603A.260 to 603A.290). Owner decision: the playbook says to take the whole chapter and record what rides along; the chapter''s other two parts bind private operators and regulated entities, not agencies: NRS 603A.300 to 603A.360 (notice of information collected on the Internet from consumers) and 603A.400 to the end (security and privacy of consumer health data).'
  jurisdiction: nevada
  recheck: monthly
- id: nv-nrs-233f
  sha256: "f94a43bbd020a2cdf00babbf959b09f3cf6fdd8e2ea18d86b74d3b764a9ac85f"
  url: https://www.leg.state.nv.us/NRS/NRS-233F.html
  format: html
  citation: NRS ch. 233F
  title: CHAPTER 233F - STATE SYSTEM OF COMMUNICATIONS
  doc_type: statute
  issuing_body: Nevada Legislature; published by the Legislative Counsel Bureau
  tags:
  - governance
  - cloud-resilience
  why_relevant: 'The state''s own communications network run by the Chief of the Governor''s Technology Office: the Network Transport Services Unit and Unified Communications Unit, extension of the state communications system by an agency with the Chief''s approval (233F.117), agencies'' duty to give the Chief information and assistance (233F.150), and the Board''s advice. Owner decision: the domain excludes broadband, 911 and telecom in general; this chapter is the state agencies'' internal network, so it is seeded as IT infrastructure.'
  jurisdiction: nevada
  recheck: monthly
- id: nv-nrs-239b
  sha256: "9bae60669055eb5af9d11fe1bfc440cb23e0f93bbe5cc6f1b4d00e706086ae41"
  url: https://www.leg.state.nv.us/NRS/NRS-239B.html
  format: html
  citation: NRS ch. 239B
  title: CHAPTER 239B - DISCLOSURE OF PERSONAL INFORMATION TO GOVERNMENTAL AGENCIES
  doc_type: statute
  issuing_body: Nevada Legislature; published by the Legislative Counsel Bureau
  tags:
  - data
  - digital-services
  why_relevant: 'Rules for what personal information governmental agencies of the State and its subdivisions may collect, keep and publish: sexual orientation and gender identity information (239B.022 to 239B.026), race and ethnicity categories (239B.028), personal information in recorded and submitted documents (239B.030), databases of e-mail addresses and telephone numbers (239B.040) and personal information on agency websites (239B.050). Owner decision: a data chapter whose obligated parties include local governments and a few sections (FBI record requests, firefighter applicants) that are not IT; taken whole because the chapter is the unit the source serves.'
  jurisdiction: nevada
  recheck: monthly
- id: nv-nrs-281-195
  sha256: "13c141d830d6f6c56df58204a1b2fcd809cdf197b574059806f40fc0cc4af891"
  url: https://www.leg.state.nv.us/NRS/NRS-281.html
  format: html
  citation: NRS 281.195
  title: 'NRS 281.195: Access by state agency to computers assigned or loaned to officers, employees and contractors'
  doc_type: statute
  issuing_body: Nevada Legislature; published by the Legislative Counsel Bureau
  tags:
  - governance
  - oversight
  - cybersecurity
  jurisdiction: nevada
  recheck: monthly
  slice: {section_start: '281.195', section_end_before: '281.210'}
  why_relevant: 'Owner decision 2026-11-13 (a provision of a non-IT chapter whose own focus is state IT governance). NRS chapter 281 is the general provisions on public officers and employees; section 281.195, under the page''s heading ''Use of Computers'', governs how state agencies handle the computers they issue: an agency that accesses ''a computer of the state agency that has been assigned or loaned by the state agency to an officer, employee or contractor'' must give notice of the access within 48 hours before or after (subsections 1 and 2); the head of the agency or a state officer may authorize access without notice during an internal or law-enforcement investigation or, where the agency has adopted the procedure by regulation, during routine maintenance or after recording the access in a confidential log (subsections 3 to 5); and an agency that has a computer-use policy must adopt policies and procedures for responding to reports of inappropriate use, including the transfer, transmission and destruction of information (subsection 6). For an executive-branch agency, ''inappropriate use'' means a violation of the written appropriate-use policy created under NRS 242.300 (subsection 7(b)(1)), which ties the section to the IT agency''s chapter. The section''s definition of ''state agency'' (subsection 7(c)) also takes in units of the Legislative and Judicial Branches; it is one provision and is taken as printed. Left out of this document: the rest of chapter 281 (public officers'' oaths, nepotism, ethics-adjacent and financial-disclosure provisions), which is not IT governance.'
  currency_note: 'Currency, checked 2026-11-13 from the Legislative Counsel Bureau''s own bytes fetched through the Fetcher that day: the NRS chapter 281 page prints the revision stamp ''[Rev. 4/15/2026 12:06:24 PM--2025]'' and the section prints one version, with no ''Repealed'' or ''[Effective ...]'' marker on its heading and a history line that ends ''(Added to NRS by 2005, 671)'' with no later amendment. The ingester refuses a section whose heading carries a repeal notice or an effective-date version marker.'
- id: nv-nac-242
  sha256: "b8b6dedbfd38b6457f29af62326ea5ba73dd2cd3cb6e5d39b82fcfbbaf8a7508"
  url: https://www.leg.state.nv.us/NAC/NAC-242.html
