  identity_text: State Information Security Program Policy
  why_relevant: 'Listed on the Governor''s Technology Office page ''Security Policies, Standards & Procedures'' (https://it.nv.gov/governance/security-policies-standards--procedures/) as ''100 - State Information Security Program Policy - Effective 01/26/2023''. NAC 242.110 adopts the State Information Security Policies, Standards and Procedures by reference and binds every executive-branch agency, state employee and contractor with access to state information to them. The umbrella of the state security program: scope and applicability to executive-branch agencies, roles (CIO, State CISO, agency heads and information security officers, the State Information Security Committee), and the policy requirements the numbered standards implement, built on the NIST SP 800 series and CIS Controls. 63 pages.'
  jurisdiction: nevada
