left_out:
- text: '---- Nevada: found and left out (each was seen on an official page on 2026-11-12; the reason is recorded here). ''Owner decision'' marks a judgment call a reviewer should confirm. Every claim of ''none found'' names the list that was read.'
- text: 'Central IT body: the Governor''s Technology Office (GTO, headed by the State Chief Information Officer) at it.nv.gov. NRS 242.017 defines the Chief as ''the Chief of the Governor''s Technology Office within the Office of the Governor''; older text in the policy PDFs still names the Department of Administration, Enterprise IT Services (EITS) and the Office of the Chief Information Officer (OCIO); NRS 242 sections repealed by chapter 294, Statutes of Nevada 2025, are the old Department, Division and Administrator definitions.'
- text: 'Statutes seeded: NRS chapters 242 (the enabling statute and the cybersecurity duties of the Office of Information Security and Cyber Defense), 603A (breach and security duties of ''data collectors'', which include governmental agencies), 233F (the state communications system) and 239B (personal information held by agencies). All 833 NRS chapter pages in the LCB table of titles and chapters (https://www.leg.state.nv.us/NRS/, every page fetched 2026-11-12) were searched for ''artificial intelligence'', ''generative'', ''automated decision'', ''machine learning'', ''Chief Information Officer'', ''Governor''s Technology Office'', ''Security Operations Center'', ''information system'', ''information technology'' and ''cybersecurity''; the chapters below are what those searches and the chapter titles turned up.'
- text: 'Statutes about AI: the only chapters that print ''artificial intelligence'' as a duty or prohibition are NRS 414.0305 and 414.099 (chapter 414, emergency management: an emergency management plan must provide that final decisions on emergency response planning and resource allocation are not made by artificial intelligence; binds state and local emergency management, in a non-IT chapter), NRS 391.297 (chapter 391, school personnel: the Department of Education''s policy on AI use by school counselors, psychologists and social workers; K-12), NRS 433.567 (chapter 433: duties of providers of AI systems that offer mental health care, with duties of the Division; private providers), NRS 629.610 (chapter 629: providers of mental and behavioral health care), NRS 704.1833 (chapter 704: public utilities), NRS 294A (campaign practices: synthetic media), NRS 200 (an AI-made child sexual image in a crime definition) and NRS 603A (the words ''machine learning'' inside a definition of consumer health data). Left out: they bind private persons, schools or health providers, or sit as single sections of non-IT chapters. The owner''s decision of 2026-11-13 now covers single sections whose own focus is state IT governance, but NRS 414.099 (the one Nevada statute that restricts AI in a state and local government function) was not a named candidate of the authority-references pass, so it was not read or seeded: not done. NRS 242 itself contains none of these words. A Route Fifty article (September 2026) reports a legislative proposal on AI use by state and local agencies; a proposal is not an enacted law and nothing was fetched from it.'
- text: 'Statute chapters seen and left out as not about state IT: 205A (Technological Crime Advisory Board: law-enforcement and computer-crime policy), 239 (Public Records: not IT), 239C (Homeland Security: emergency planning; its ''information system'' definition concerns critical infrastructure), 333 (Purchasing: State: the procurement code; it names the Chief of the GTO in two places; the owner''s decision of 2026-11-13 approves the IT-governance sections of a procurement code, but the authority-references pass named no NRS 333 section as a candidate, so none was read or seeded: not done), 353 (State Financial Administration), 603 (Computers: private persons), 719 (Electronic Transactions, a uniform act on private transactions; sections 719.340 to 719.360 bind governmental agencies on electronic records and signatures: single sections of a non-IT chapter; the owner''s decision of 2026-11-13 would cover sections whose own focus is state IT governance, but they were not a named candidate of the authority-references pass, so they were not read or seeded: not done), 720 (Digital Signatures: licensing of certification authorities by the Secretary of State), 721 (Electronic Legal Material), 232 and 223 (department and Governor chapters: NRS 223.085 lets the Governor''s staff include ''Chief Information Officer of the State'': a single section whose focus the owner''s decision of 2026-11-13 could cover, but it was not a named candidate of the authority-references pass, so it was not read or seeded: not done), 218G (Legislative Audits) and 480 (Public Safety: NRS 480.900 to 480.950, ''Security of Information Systems'' and the Nevada Office of Cyber Defense Coordination, is printed as ''Repealed'' under chapter 513, Statutes of Nevada 2025, page 3572; its functions moved into NRS 242.127 to 242.129).'
- text: 'Section slice seeded under the owner decision of 2026-11-13 (a provision of a non-IT chapter is in scope when its own focus is the governance of state IT): NRS 281.195 (chapter 281, General Provisions: public officers and employees), nv-nrs-281-195, read 2026-11-13 from the Legislative Counsel Bureau''s NRS chapter 281 page (the seed entry''s url). Its focus is state agencies'' handling of the computers they issue (notice of access, the access log, policies for reports of inappropriate use, tied to the appropriate-use policy of NRS 242.300), so it is IT governance. The rest of chapter 281 is not IT and was not seeded; NRS 281.190 (unlawful withholding or destruction of records by a departing officer) is general records law and was declined.'
- text: 'Statute chapters in the NRS table of titles and chapters that were not seeded (chapter pages fetched 2026-11-12): NRS 400 (P-20W Research Data System Advisory Committee: assists in the coordination and management of the statewide longitudinal data system administered by the Governor''s Office of Workforce Innovation, NRS 400.027 and 400.037; its members are the Chancellor of the Nevada System of Higher Education, the Superintendent of Public Instruction and the Director of the Department of Employment, Training and Rehabilitation; OWNER DECISION: data governance of a state data system, which may pass the inclusion test, or education data excluded as K-12 and higher education), NRS 239A (Disclosure of Financial Information to Governmental Agencies: privacy of financial-institution records, not state IT) and NRS 378 (State Library, Archives and Public Records: records management, not IT; the rule chapter NAC 378 is named below).'
- text: 'Rules: NAC chapter 242 (Information Services) is the IT agency''s only chapter and holds the one section NAC 242.110, seeded. The NAC table of chapters (https://www.leg.state.nv.us/NAC/Chapters.html, 413 chapters, read 2026-11-12) names no other chapter of the Governor''s Technology Office. Left out: NAC chapter 480 (''Security of Information Systems'', Office of Cyber Defense Coordination, adopted 12-29-2020, page revised 5-22): it requires political subdivisions (local governments) to adopt, certify and report on cybersecurity incident response plans, so its obligated party is local government, which the domain excludes, and its authority (NRS 480.935 and 480.950) is the repealed text above; OWNER DECISION whether it is still in force and in scope. NAC 333 and 334 (purchasing), NAC 239 (Public Records), NAC 378 (State Library, Archives and Public Records) and NAC 720 (Digital Signatures: licensed certification authorities) are procurement, records or private-licensee rules and were not seeded.'
- text: 'Executive orders: none seeded. Governor Lombardo''s lists for 2023, 2024, 2025 and 2026 (https://gov.nv.gov/executive-actions/executive-orders/ and its four year pages, read 2026-11-12) print EO 2023-001 to 2023-011, 2024-001 to 2024-007, 2025-001 to 2025-003 and 2026-001 to 2026-005 (as read from the page text: the 2024 page headings read ''Executive Order 2024-006'' and ''Executive Order 2024-007'', but their link titles read ''EO 2026-006'' and ''EO 2026-007'', numbers the page prints for the two hiring-criteria extensions that EO 2025-001 and EO 2025-002 cite as 2024-006 and 2024-007; the 2023, 2025 and 2026 pages also repeat the earlier hiring-criteria orders as references). None is on state IT, cybersecurity, data or AI. The closest: EO 2023-003 and EO 2023-008 (freezing and then lifting the regulatory process), EO 2026-003 (a review of existing regulations by all executive-branch agencies) and EO 2026-005 (''Order Establishing the Nevada Standard for Responsible Data Center Development'': private data centers, not state IT); EO 2023-010 and its extensions (hiring criteria). The site lists no orders of earlier governors, so orders of former governors that remain in force could not be checked on an official list; the old path /Newsroom/ExecOrders/ answered HTTP 404. Cybersecurity Awareness Month is a proclamation, not an order. OWNER DECISION: EO 2026-005 (data centers) is left out as private-sector energy and tax policy.'
- text: 'Statewide IT policy library (https://it.nv.gov/governance/), row by row, 2026-11-12. Seeded as a document: the memorandum Guidelines for the Use and Security of AI Tools (11/15/2023). Stubs: Statewide Policy for Data Classification, Policy on the Responsible and Ethical Use of Artificial Intelligence in Nevada State Government Executive Branch and Statewide Policy for Reporting of Large Information Technology Projects (scans whose only text layer is the publisher''s reading, which ocrmypdf refuses with PriorOcrFoundError); Executive Branch Website and Domain Governance Standard, Technology Investment Evaluation (TIE) Policy, and Duplicate Spend Review and Enterprise Transition Planning (scans with no text layer that the OCR procedure could not promote). Left out: IT Strategy Development and Submission Policy (OCIO-2025-IT01): it prints ''Effective Date TBD'' in its own control block and its APPROVED BY block shows only ''Title CIO'', so it is not shown to be in force (it is also a scan whose only text layer is the copier''s reading, refused by ocrmypdf with PriorOcrFoundError); OWNER DECISION whether an instrument that prints no effective date is in force. NRS 242 and NAC 242 are the first two rows (seeded as statute and rule). The Security Policies, Standards & Procedures row is the security library (see below) and is watched. Left out: ''Nevada Tech Award Nomination Policy'' (control no. NTA-001, effective 7/22/2025: the rules of an awards program for state technology projects; it obligates no one to do anything with IT; OWNER DECISION), ''Nevada Technology Award Submission Instructions'' (how-to instructions, not an instrument), ''Helping You Register or Update Your Agency''s IT Projects'' (a how-to letter to agency leaders about the submission system, not an instrument; the policy it explains is seeded), and the memorandums ''Cyber Security Awareness Update - Email Spoofing 01/17/2024'', ''Cyber Security Awareness Month - Email Spoofing 10/16/2023'' (awareness advisories for staff, not instruments) and ''Guidance for Hosting Public Meeting 9/10/2024'' (a 48-page step-by-step tutorial in screenshots for Teams, Meet, Zoom and Webex, whose text layer holds little more than captions on 33 pages; OWNER DECISION whether a guidance tutorial belongs). The ''Meeting Calendar'' link (https://it.nv.gov/Governance/Meetings/) answered HTTP 404. The ITAB link under the old path (https://it.nv.gov/Governance/ITAB/Information_Technology_Advisory_Board_(ITAB)/) was read: an older ITAB page with the headings ITAB Members, ITAB Meetings and Materials and ITAB Bylaws and no document links; the current ITAB page is watched.'
- text: 'Security library (https://it.nv.gov/governance/security-policies-standards--procedures/), 46 links, 45 distinct URLs, row by row: 37 seeded. Left out: six forms and workbooks (S.2.04.01.1F State Security PSP Exception Request Form, .docx; S.3.04.03 1F Social Media Exception Request Form, .pdf; S.3.04.04 1F Acceptable Use Agreement 4.16.24, .docx, a form each employee signs; S.4.02.02.1F Mobile and Non-State Device Agreement Form, .docx; S.4.08.02.1F Information Security Incident Report Form, .docx; S.5.06.01 1F Cloud Services Assessment Worksheet, .xlsx), the Word copy of S.3.04.01 Personnel Security (the same standard as the seeded PDF: duplicate format), and the earlier revision E of S.5.01.01 (the index lists revisions E and F, ''S.5.01.01 - User Identification and Authentication (Passwords)'' with no effective date and ''S.5.01.01 F ... Effective 05/08/2025''; the file of the first prints Revision E, effective 12/31/2020; F replaces it, so only F is in force). The row for S.6.02.07 Technology Bans appears twice with the same URL. The index''s date text for S.5.04.03 reads ''Effective 1, 2021''; the file prints 9/01/2021 (the seeded text is the file''s).'
- text: 'Strategy and organization documents (not instruments): ''Statewide IT Strategy (FY23-FY27)'' (https://it.nv.gov/siteassets/itnew.nv.gov/content/governance/Statewide-IT-Strategy-TheNevadaWay_2.pdf) and the visual version of it (.../documents/OCIO_VISUAL_-_IT_Strategy-ADA.pdf), both linked from the Organization page: strategy documents. The IT Project Portfolio and IT Project Portfolio Update workbooks (.xlsx) on the IT Project Submission Update page and the ADA site''s accessibility checklists (Word, Excel, PowerPoint, Acrobat, NVDA, web review): spreadsheets and checklists. The it.nv.gov Stateweb resources (Ektron web-editing guides): training material.'
- text: 'Duplicate copy: https://it.nv.gov/uploadedFiles/itnewnvgov/content/Governance/Statewide Policy for Reporting of Large Information Technology Projects.pdf (linked from the IT Project Submission Update page) is a second file of the seeded STGC-2025-002 policy; pdftotext reads identical text from both files (the bytes differ). Not seeded twice. A draft of the AI policy (''...Executive Branch(draft).pdf'') appears in a search engine''s results on it.nv.gov; it is a draft, not the signed text seeded, and was not fetched.'
- text: 'State Administrative Manual (SAM), Governor''s Finance Office, Budget Division (https://www.gfo.nv.gov/siteassets/documents/final-sam-07-14-2026.pdf, ''Revised July 14, 2026'', 157 pages, fetched 2026-11-12): the whole manual is finance and administration policy; its Chapter 1600 ''Information Technology'' (revised January 11, 2022; October 2, 2024) is on pages 93 to 98 and is the ''SAM Chapter 1600 - IT Project Approval'' that the large-IT-projects policy cites. Left out: a 157-page manual in which one 6-page chapter is IT, and the playbook leaves sections of non-IT sources out pending an owner decision on slicing. OWNER DECISION: seed SAM 1600 if page slicing of a PDF is approved (the shared to_text ignores a seed `slice` for PDFs).'
- text: 'Digital accessibility: the ADA Technology Accessibility Guidelines (Control No. 101) and the Web Style Standard (Control No. 4.01) are Office of the CIO instruments hosted on ada.nv.gov and linked from every GTO page footer, not from the policy library; they are seeded because they bind all state entities on accessible IT and websites. Owner decision: both date from 2019 and print their own versions; no newer revision was found on the ADA site''s Resources or Digital Accessibility Statement pages. The Digital Accessibility Statement (https://ada.nv.gov/accessibility/digital-accessibility-statement/) is a statement of intent, not an instrument.'
- text: 'Scan-layer PDFs: five PDFs are scans of signed paper originals whose only text layer is a machine reading made by Adobe Paper Capture or a copier (Producer ''Paper Capture Plug-in with ClearScan'', RICOH or Xerox): the data classification policy, the AI policy, the large-IT-projects policy, the ITAB bylaws (four stubs) and the IT strategy policy (left out above). The repo procedure for scans is the two-engine OCR; ocrmypdf stops on each with PriorOcrFoundError (page already has text) and the layer carries recognition errors in words and digits (''Informatio11'', ''Go1 1er11or'', ''expe1tise'', ''qua1terly'', ''!TAB'', ''sh·ategies''), so effective dates and figures read from it are unverifiable; none of the five is committed as text. Shared change that would fix it: an `ocr` mode in src/ingest_ocr.py that passes --force-ocr (or --redo-ocr) to ocrmypdf for a PDF whose layer is a recognised scan. OWNER DECISION (not this PR''s call): accept publisher-layer text, recorded in docs/spec.md, or wait for that mode. The three scans with no text layer at all (TIE Policy, Website and Domain Governance Standard, Duplicate Spend Review) were read by the two-engine OCR procedure and not promoted: they are stubs. In all three the contested figures are footer page numbers and the signature block, which are not the instrument''s text; a shared change that excluded footers and signature blocks from the figure score (or accepted the words-only agreement of 0.96 to 0.99 for a page-number footer) would let them in; that is a decision about the shared bar, not made here.'
- text: 'Other files linked from the Governor''s Technology Office pages and not instruments (read 2026-11-12): the Services/Rates page''s current rate list (gto-rates-sheet-fy26-27-2.xlsx, a spreadsheet) and FY2022-2023 Service Level Agreement template (EITS_SLA-Template.docx, a template); the Service Desk page''s Office 365 password set-up instructions, VPN FAQs, computer imaging request instructions and form, email multi-factor authentication set-up documentation (how-to guides and a form) and a Word file named for the Mobile and Non-State Device Agreement Form (S.4.02.02.1F; not compared with the copy in the security library). The Mission Statement, Leadership Team, Client Services, Computing, DataComm, OISCD, Events and TIE pages link no further policy file.'
