  why_relevant: "Section of chapter 8, title 67 (Executive and administrative officers), which also holds the governor's and lieutenant governor's provisions; the page serves one section, so none of those ride along. ITS powers and duties: control and approval of telecommunications acquisition, oversight of cybersecurity policies, direction of agencies on information security, penetration tests and vulnerability scans, mandatory training, best practices and multifactor identification (subsections 5 to 12), criminal history checks for ITS staff, and rulemaking authority."
