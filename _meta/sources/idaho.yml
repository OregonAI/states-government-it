left_out:
- text: '---- Idaho: found and left out (each was seen on an official page on 2026-11-11; the reason is recorded here)'
- text: |-
    Rules: none seeded, NOT RESOLVED. A search lead (not an official page) named IDAPA 15.07.01, "Rules Governing Billing
    Procedures of the Office of Information Technology Services". The Administrative Rules Coordinator's 2018 archive
    PDF is real (https://adminrules.idaho.gov/rules/2018%20Archive/15/150701.pdf, fetched: title block "15.07.01 - Rules
    Governing Billing Procedures of the Office of Information Technology Services", authority "Section 67-827A(11)"). The same
    file name answered 404 under /rules/current/15/ and under the 2019, 2020, 2022, 2023, 2024 and 2025 archives (the
    2021 archive was not tried), and section 67-827A(11) now prints the multifactor-identification duty, with rulemaking authority at (14). So
    the chapter is probably repealed or renumbered, but that is not proven. The official current-rules listing
    (https://adminrules.idaho.gov/current-rules/ and the lead URL https://adminrules.idaho.gov/rules/current/, the same page)
    filters by agency with a script, showed a banner saying document search and listings had a temporary technical issue,
    and was not enumerated, so "no ITS or ITA rules" is NOT claimed. OWNER DECISION: re-check the rules index when its
    search works. The Fetcher was not used on any site-internal search or listing endpoint.
- text: |-
    AI statutes: none found that binds state agencies. Read on the Legislature's pages: H0687 (2026, "unbiased artificial
    intelligence in state government purchasing") passed the House 56-11-3 on 03/02, was received by the Senate and referred
    to State Affairs, and the page shows nothing after that; H0917 (2026, "use of AI to review administrative rules annually")
    shows only introduction and referral. Neither is enacted, and the corpus holds no bill not yet enacted. Two other
    2026 bills (S1297, a conversational-AI act; S1227, a K-12 classroom AI framework) appeared only in search results and were not fetched; S1297 binds
    private providers and S1227 is K-12, both out of scope by the domain file. Idaho's agency AI rules are the ITS AI Policy, Standard,
    and Guideline (seeded).
- text: |-
    Statutes: the other sections of title 67, chapter 8 (governor and lieutenant governor: 67-801 to 67-826) are not IT and
    are not seeded (the section pages serve one section each, so nothing rides along). Section 28-51-103 (payment card receipts) binds private
    persons. Beyond sections 67-827 to 67-837 and 28-51-104 to 28-51-107 no further Idaho Code section was looked up: the
    search of title 67 and title 28 was by the chapter section lists above and by web search, not by a full-text search of
    the code, so completeness for other titles (public records in title 74, procurement in title 67, chapter 92) is not claimed.
    Procurement and budget sections would be left out as non-IT chapters pending the owner's decision on section-level slicing.
- text: |-
    Copyright: the Legislature's pages print "(c) 2026 Idaho State Legislature" in their footer and Idaho asserts copyright in
    its code by statute (issue #28). The text is mirrored under the repo's reproduction policy; OWNER DECISION before the repo
    goes public.
- text: |-
    Executive orders: the Governor's list (https://gov.idaho.gov/executive-orders/) links 93 unique PDFs: 89 order PDFs for 2019 to 2026
    (Governor Little's; it holds no earlier governor's orders; the amended 2020-04, 2020-08 and 2020-15 each appear as extra files, and the
    2023-03 row links a file named Idaho-Outdoor-Recreation-Fund-Advisory-Council-Proclamation.pdf) and 4 attachments to EO 2022-03
    (Attachment1 to Attachment4, plans and agreements, not orders). Orders before 2019: Idaho Code 67-802 (fetched through the Fetcher
    on 2026-11-11) says "Each such executive order issued by the governor must prescribe a date after which it shall cease to be
    effective, which shall be within four (4) calendar years of the effective date of such order, and if no date after which such order
    shall cease to be effective is contained in the order, then such order shall cease to be effective four (4) calendar years from the
    issuance thereof, unless renewed by subsequent executive order", so every order issued before 2019 had lapsed by 2022 at the latest
    unless a later order renewed it (a renewal would be on the list), and none is in force; no earlier list was needed or searched.
    The same rule means EO 2022-06 (signed 14 December 2022, no sunset date in its text) lapses by 14 December 2026 at the latest (see its
    seed entry). All 89 order PDFs were fetched through the Fetcher and counted row by row on the list page saved from the Fetcher.
    34 have a text layer and were searched for "information technology", "cybersecurity", "artificial intelligence", "cyber" and
    "technology services": the only hit is EO 2019-07 (Idaho Broadband Task Force, which lists the ITS director as a member; broadband is
    out of scope). 55 are scans with no text layer and were judged by their titles on the list, none of which is on IT, cybersecurity,
    data or AI except EO 2022-06 (seeded). The 55th scan, found in the review of this list, is the 2023-03 file (Idaho Outdoor Recreation
    Fund Advisory Council; no text layer, judged by its file name and list title). Titles of two list rows (2026-01 and 2025-05, "The Idaho
    Act") do not say; they were not read by OCR. EO 2026-04 (information sharing between the executive and legislative branches) and EO
    2020-02 (transparency in agency guidance documents) are governance, not IT. OWNER DECISION: the 54 scans not read in full could be
    OCR-checked.
- text: |-
    ITA library (https://ita.idaho.gov/policies/, 128 rows read on 2026-11-11), reconciled row by row: 118 seeded as documents
    (36 P-policies, 52 S-standards of which 28 are GIS and
    other data-layer standards S4210 to S4269, and 30 G-guidelines). Not seeded: G515 "Critical Security Controls (CSCs) 1-6 Written
    Policy Template" (a template of example policy language with placeholders such as [Agency Name], 13 pages; the playbook leaves templates out) and
    "ITA Exemption Request Form" (a form, an .xls spreadsheet (exemption_request_form.xls); forms are not instruments).
    The library has no status column and lists no archived item.
    The library's guidelines are advisory; the corpus has no guideline type, so they are filed as doc_type standard (the Virginia
    precedent): OWNER DECISION. Possible supersession, kept because the library still lists it: P4570 (S6050 says it relocates
    requirements from P4570; P4570 was itself revised on 05/05/2026, so it is current). The data-layer standards (S4210 to S4269) govern
    GIS data exchanges between state agencies and are kept because the playbook says every library item; OWNER DECISION whether they are IT governance.
    Seven standards have a blank last page (no_text_pages; checked by rendering the page).
- text: |-
    ITA G536 "Firewall: Ports, Protocols and Services (PPS) Request" (https://ita.idaho.gov/wp-content/uploads/2025/07/G536-ADA.pdf,
    effective 2015) is left out: it is superseded. The revision history of S6040 (seeded, effective May 5, 2026) prints
    "05/05/2026 – Was previously G536, updates finalize definitions, clarify standard and emergency change workflows, refine technical
    and documentation requirements, and align terminology and formatting." The library still lists G536, but the corpus holds
    instruments in force only. OWNER DECISION: restore it (and set relationships.supersedes on S6040) if superseded guidelines should
    be kept.
- text: |-
    911 items left out under the domain file's exclusion "broadband, 911 and telecom" (_meta/domain.yml), each a row of the ITA library
    (128 rows read on 2026-11-11): P3040 "State 911 Multi-line Telephone Systems Policy" (https://ita.idaho.gov/wp-content/uploads/2025/07/p3040.pdf);
    S4230 "Framework Standard for Emergency Service Zones" (https://ita.idaho.gov/wp-content/uploads/2025/07/S4230-ADA.pdf);
    S4272 "Public Safety Answering Point" (.../2025/07/S4272-ADA.pdf), S4273 "Emergency Service Boundaries" (.../2025/07/S4273-ADA.pdf),
    S4270 "Site Structure Address Points" (.../2025/07/S4270-ADA.pdf), S4271 "Road Center Line" (.../2025/07/S4271-ADA.pdf) and S4274
    "Provision Boundaries" (.../2025/07/s4274.pdf) (the NG911 GIS data layers of 15 September 2022; each prints that the layer is
    required to support Next Generation 911). OWNER DECISION: the data layers are also GIS data governance (like the 28 other data-layer standards that are
    kept); restore any of the seven if the owner reads the exclusion as covering only telecom service, not the GIS data that feeds it.
- text: |-
    ITS pages: https://its.idaho.gov/policy-governance/ lists two ITS policies (seeded) and links the ITA library (watched above).
    The ITS Resource Library (https://its.idaho.gov/resource-library/) is a search form with no list in its page, not enumerated.
    From the ITS AI Help Center (https://its.idaho.gov/ai/ and its three audience pages) not seeded: the Idaho AI Advantage Framework
    and its two-page summary (strategy documents), the AI Guide for Agency Leadership, AI Quick Reference Guide, AI Guide: Getting Better
    Results, Microsoft 365 Copilot Best Practices and Guide to Data and Systems Classification (guides, not instruments), the AI Concept Brief
    (a .docx template), the Level 2, Level 3 and CUI cover sheets (fillable forms), a training audio file (.wav), and a link to an
    assessment request in the ITS service portal (a form).
