- id: "id-eo-2022-06"
  sha256: "14e07275e67f03fded85c98834e3562ac2c35430a9117c1c4a5ff0244d929524"
  url: "https://gov.idaho.gov//wp-content/uploads/2022/12/eo-2022-06.pdf"
