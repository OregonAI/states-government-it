  recheck: "monthly"
  why_relevant: "Section of chapter 8, title 67 (Executive and administrative officers), which also holds the governor's and lieutenant governor's provisions; the page serves one section, so none of those ride along. The enabling section for the Office of Information Technology Services (ITS) in the office of the governor and its administrator, the official designated to oversee and execute the coordination and implementation of all information technology services and cybersecurity policies in the state."
