  identity_text: "Information Security Policy Manual"
  stub: true
  stub_reason: "Page 4 of the 284-page PDF (the signed Intent page, with the administrator's signature and a handwritten date) is an image with no text layer and the other 283 pages have one. The two-engine OCR of page 4 was refused on 2026-11-11: the engines agree on only 50% of its one figure (the handwritten date; the bar is 90%), though the words agree. The text layer of the other pages is readable, so the document becomes ingestible if the owner accepts the manual with page 4 listed in no_text_pages (the Intent page would then be missing from the committed text) or if the OCR gate is relaxed for a handwritten date. OWNER DECISION."
  why_relevant: "Listed under 'ITS Policy' on the ITS Policy & Governance page (its.idaho.gov/policy-governance): how ITS manages its services, resources and operations for statewide IT functions, consistent with ITA policies and federal standards. The ITS information security policy manual; a 284-page PDF whose page 4 (the signed Intent page) is an image; see the stub reason."
