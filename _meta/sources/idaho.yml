  jurisdiction: "idaho"
  issuing_body: "Office of the Governor"
  tags:
  - "cybersecurity"
  - "governance"
  recheck: "monthly"
  ocr: true
  why_relevant: "Governor's order, on the Governor's executive order list as 'Executive Order 2022-06 : Banning TikTok on State Devices', that bars the TikTok application from state-owned devices and networks. The only order on the list whose subject is state IT or cybersecurity (see the left-out notes for how the other 88 order PDFs were checked). SUNSET: Idaho Code 67-802 says each executive order \"must prescribe a date after which it shall cease to be effective, which shall be within four (4) calendar years of the effective date of such order, and if no date after which such order shall cease to be effective is contained in the order, then such order shall cease to be effective four (4) calendar years from the issuance thereof, unless renewed by subsequent executive order\". The scan's text prints no sunset date and was signed 'on this 14 day of December in the year of our Lord two thousand twenty-two', so it ceases to be effective on 14 December 2026 at the latest unless renewed by a later order; at the next re-check after that date, move it to left_out. The PDF is a scan with no text layer, so it is read by the two-engine OCR procedure."
