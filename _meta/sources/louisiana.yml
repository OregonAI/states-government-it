left_out:
- text: |-
    ---- Louisiana: found and left out (each was seen on an official page on 2026-11-12 and read through the Fetcher; the reason is recorded here)
- text: |-
    OTS Policies and Forms (https://ots.la.gov/policies-forms), reconciled row by row: 3 policies and the link to the DOA policies. All 3 are seeded. The Division of Administration's legacy OTS page (https://doa.la.gov/doa/ots/policies-and-forms/) lists 12 'Statewide Policies and Forms' rows: 6 are seeded (Change Management Policy, End User Agreement, Incident Response Policy and Procedure, Data Sanitization Policy and Procedures, and the Movable Property Tagging policy, #2, and the AI policy, #3, whose seeded copies are the ots.la.gov pages), 6 are left out:
     - 'Statewide Policy #1: Information Security Policy (V.2.0)' PDF (https://www.doa.la.gov/media/wvmhsr1r/information-security-policy.pdf, 130 pages): the file prints 'Revision: 2.00, Date Published: December 16, 2015' and also 'Date Updated: 12/22/2025' and 'The Information Security Policy and Procedures were reviewed, approved, and published on 12/22/2025', the same approval line as the seeded ots.la.gov page. It is not an older revision: it is a second official copy of the current policy (PDF 37,240 words, page text 33,633) and the place where the citation 'OTS Statewide Policy No. 1' is printed. The HTML page was seeded because it is the OTS site's own page for the policy and is extracted as structured text; the PDF is left out as a duplicate. OWNER DECISION: seed the PDF as well if both copies are wanted.
     - 'Chain of Custody' (1-page PDF with blanks), 'Request for Policy Exception Form' (https://www.doa.la.gov/media/wlfppcdr/isp-exception-request-form.pdf), 'Risk Acceptance Form' (https://www.doa.la.gov/media/k2unypjh/isp-risk-acceptance-form.pdf): appendix forms of the Information Security Policy.
     - 'Third Party Information Security Questionnaire' (Excel workbook linked from the page, not fetched): a questionnaire vendors fill in.
     - 'Criminal History Review - Applicant Privacy Rights' (5-page PDF): the notice to applicants whose fingerprints are submitted to the State Police and the FBI; a notice of rights, not an IT instrument.
    The same page's 'Network Services and Telecommunications Forms' (General, Conferencing, Network Data Services, Voice Services, Wire and Cable groups: OTS-11, OTS-15, OTS-16 with its instructions, ticketing guide and planning checklist, OTS-26, OTS/S-1, OTS/S-2, OTS-103, OTS-104, OTS-30, OTS-39, OTS-7, OTS-32, OTS-60, OTS-65, OTS-50 and two quote-request forms) and 'Production Support Services Forms' (DA-200 Printing Request, DA-201 Estimate Request) are order, request and billing forms: forms are not instruments, and telecom and printing services are out of scope. None fetched.
- text: |-
    DOA Policies page (https://doa.la.gov/doa/hr/policies/doa-policies/), reconciled row by row: 22 rows, 8 seeded (Nos. 1, 2, 3, 5, 7, 20, 22, 23), 14 left out:
     - OWNER DECISION, recorded for review: No. 6 'Use of State Resources (Incorporates DOA Personnel Policy No. 24)' and No. 19 'Acquisitions'. No. 6 governs State-owned equipment, vehicles, records and IT resources together; No. 19 governs all DOA acquisitions and has an IT approval path (IT purchases of $100,000 or more need the Office of Information Technology). Both are general-purpose, so they are left out; the owner may want them.
     - No. 18 'Cellular Phone Utilization and Reimbursement': a telephone use and reimbursement policy; telecom is scoped out.
     - No. 24 'Records Retention Policy': records management, not IT.
     - Nos. 4 (In-Domicile Travel, which the index itself marks superseded by PPM 49), 12 (Bloodborne Pathogens Program), 13 (Drivers' Safety Policy), 14 (Bonds and Crimes Loss Control Program), 16 (Mail and Package Handling Procedures), 17 (Prohibition of Open Flames), 21 (Supplemental Benefits Solicitation Policy), 25 (State Vehicle Maintenance Policy), 26 (Receipt of Cash and Cash Equivalents), 27 (Workers' Comp Post-Accident Drug Testing Policy): not IT.
- text: |-
    Statutes. Sections were found in the Legislature's own table of contents of Titles 39, 42, 49, 51, 36 and 44 (captions searched for artificial, automated decision, algorithm, machine, cyber, information technology, technology services, breach, digital, geographic information; no caption names artificial intelligence), and every section on this list was fetched. Left out:
     - R.S. 39:15.4, 15.5, 15.6: the page prints each as repealed (Acts 2013, No. 184).
     - R.S. 39:140, 141, 142, 143 (Office of Telecommunications Management, merged into OTS by Act 241 of 2015) and R.S. 39:1751-1755 (procurement of telecommunications systems and services): telecom is scoped out. OWNER DECISION: these put telecom services under the state CIO and the owner may want them. Not fetched.
     - R.S. 51:2101-2105, 2107, 2109 (the cybersecurity information sharing act: legal protections for any person or entity that shares threat indicators, the state police's rulemaking): they bind private and public sharers alike and not state agencies as such; R.S. 51:2106, naming the state entities that receive the information, and R.S. 51:2108, which concerns state entities only (relief from the reporting requirements of 6 U.S.C. 1508), are seeded. R.S. 51:3071, 3072, 3075, 3076, 3077 (short title, findings, damages, financial institutions, rulemaking of the breach notification law): only the definitions (3073) and the duties (3074) that bind agencies are seeded.
     - R.S. 39:17.1-17.5 (Subpart E, Digitized Credentials) are seeded: 17.2 makes state credentials available in an electronic wallet and directs the commissioner of administration to adopt rules, a state entity's digital-identity service. OWNER DECISION: borderline; remove them if the owner reads the Subpart as outside the domain.
     - R.S. 9:2601-2619 (Louisiana Uniform Electronic Transactions Act) and R.S. 33:2933 (electronic governmental transactions), which OTS's enabling-legislation page links: general commercial and local-government law, not found in the IT body's statute; not fetched. OWNER DECISION on whether the electronic-records law belongs.
     - The Statewide Data Exchange Compact (Act 477 of 2026, 'R.S. 39:18.1 through 18.3' according to web search; enrolled bill not fetched): the Legislature's Title 39 table of contents fetched on 2026-11-12 lists no section 39:18.1-18.3, so there is no official page to fetch yet. Revisit when the table of contents lists it; the Title 39 watch entry will report it.
     - Session laws (Acts 712 of 2014, 241 and 46 of 2015, 45 and 15 of 2014, 409 of 2009, 308 of 2023) are the acts the sections above come from; the codified sections are seeded, not the acts. SCR 49 (2026) is a study resolution, not law. No statute binding state agencies' use of AI was found in the lists above.
- text: |-
    Rules. LAC 4:XV is the stub above (a shared-code limit). Other parts of the same Title 4 file, seen in the converted text and left out: Part IX Telecommunications (the Office of Telecommunications Management's rules; telecom), Part XVII Records Management Policies and Practices, Part XXIII ADA Accessibility (public meetings by electronic means for people with disabilities, a meeting-access rule), Part XXIV Reporting for Nongovernmental Entity Database, Part V Policy and Procedure Memoranda (general state administration), and Part XXI broadband grants (scoped out). Title 34 (Government Contracts, Procurement and Property Control) is the Office of State Procurement's general procurement rules: not read part by part and not seeded. The Code index lists one Word file per title; no other title was opened.
- text: |-
    Executive orders. The Governor's list (https://gov.louisiana.gov/news?cat=11) is script-rendered (the Governor's home page, which prints the latest orders as links, is watched instead: la-watch-gov-home-orders) ('Load More', empty in the page the Fetcher gets) and the site's feed behind it is an internal endpoint that is not used, so the list could not be read row by row; the Governor's home page lists the three latest orders, JML 26-106, 26-107 and 26-108. Orders were found by search and each seeded or left out here was fetched. 'None found' covers only these: found and in force: JML 25-109 and JML 26-107 (seeded as stubs). Left out:
     - JML 25-103 'State Government's Use of AI' (September 2025): amended by JML 25-109, whose heading reads 'Amended State Government's Use of AI' and which restates every section; 25-109 is seeded.
     - JML 26-020, JML 26-063 and the other earlier renewals of the cybersecurity state of emergency (JML 26-008 among them): each ran 30 days and has been replaced by a later renewal; the one effective October 30 to November 29, 2026 is JML 26-107. The seeded entry must be replaced with each renewal.
     - JBE 17-31 (Louisiana Cybersecurity Commission, December 2017), JBE 19-19 and JBE 2022-9 (amendments): the addresses web search gave (www.doa.la.gov/media/uu3nd3eq/jbe-17-31.pdf and doa.la.gov/media/tzxdypr1/jbe-2022-9-amending-cybersecurity-commission.pdf) answered 404 on 2026-11-12, so the text could not be fetched and whether they are in force could not be checked; the Legislature created the commission in statute in 2023 (R.S. 39:15.11-15.15, seeded). Not withdrawn as far as is known; revisit if an official address is found.
     - JML 26-058 (criteria for data center tax certifications: energy and economic development, not government IT), JML 26-038 (suspension of party primary elections), JML 26-106 (flags at half-staff) and JML 26-108 (tropical storm emergency): not IT.
     - JML 25-109 and JML 26-107 are in force but stubs (scans with an embedded, error-bearing OCR layer that the shared OCR path refuses); see the stub reasons.
- text: |-
    Not instruments or out of scope: OTS's strategy plan (office-of-technology-strategic-plan_fy24-fy28.pdf, a strategy document found by search, not fetched), the OTS news item 'OTS Publishes First State AI Policy' and the OTS pages on services, vendors and modernization (descriptions, not instruments).
