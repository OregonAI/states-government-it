- id: va-code-2-2-203-2-4
  sha256: "a797e557274e9c4956322976989cdb1d18079d210eaeb68fd3169dadf458f8a6"
  url: https://law.lis.virginia.gov/vacode/title2.2/chapter2/section2.2-203.2:4/
