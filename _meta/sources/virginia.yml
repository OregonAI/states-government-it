  - data
  why_relevant: 'How agencies that keep information systems with personal information collect, maintain, use and disseminate it: principles of information practice, the Internet privacy policy duty, rights of data subjects, agency reports on systems, Social Security number limits and civil remedies (2.2-3800 to 2.2-3809). Section 2.2-3803 is printed in two versions (effective until July 1, 2027 and effective July 1, 2027); the page carries both. Section 2.2-3804 (military recruiters and student information) rides along.'
