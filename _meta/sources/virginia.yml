- id: va-eo-22-2026
  sha256: "78530154c70f9232af3d8652f9c445cc2374e66dc241bac9ce3918fd09670aeb"
  url: https://www.governor.virginia.gov/media/governorvirginiagov/governor-of-virginia/pdf/eo/eo-22-establishing-va-data-center-accountability-and-ai-initiatives.pdf
  format: pdf
  citation: Executive Order 22 (2026)
  title: Establishing New Nation-Leading Standards and Initiatives to Implement the Virginia Data Center Accountability Framework and Responding to Unprecedented Risk From Artificial Intelligence
  doc_type: executive_order
  issuing_body: Office of the Governor
  tags:
  - ai
  - cybersecurity
  - governance
  identity_text: EXECUTIVE ORDER 22 (2026)
  why_relevant: Listed on the Governor's Executive Actions page as EO-22, September 18, 2026 (Governor Abigail D. Spanberger). Part II creates the rapid-response AI Task Force and an AI Policy Planning Unit in the Office of the Chief Transformation Officer, charged among other things to assess the cybersecurity risks AI poses to the Commonwealth's state systems and to support Commonwealth-wide secure and responsible use of AI, and directs all Secretariats and executive branch agencies to support the Task Force on request. Part I (the Data Center Accountability Framework) is outside this corpus's scope and rides along in the same document. VITA's AI page lists this order as guidance.
  jurisdiction: virginia
  recheck: monthly
- id: va-ed-6-2026
  sha256: "539c4756e5c474aa8977707579eeb3362ab4b61f023be8863aaea29ecc99ecf5"
  url: https://www.governor.virginia.gov/media/governorvirginiagov/governor-of-virginia/pdf/ed/ED-6-va-cyber-threats-ai-preparedness.pdf
  format: pdf
  citation: Executive Directive 6 (2026)
  title: Directing a Commonwealth-Wide Preparedness Approach to Cyber Threats Posed by Artificial Intelligence and Recursive Self-Improvement Development
  doc_type: executive_order
  issuing_body: Office of the Governor
  tags:
  - ai
  - cybersecurity
  identity_text: EXECUTIVE DIRECTIVE 6 (2026)
  why_relevant: Listed on the Governor's Executive Actions page as ED-6, October 23, 2026 (an executive directive, filed here as an executive order). Directs the Secretary of Public Safety and Homeland Security to establish a Cyber Consortium and a Commonwealth-wide cyber-attack prevention and response plan that addresses AI-related risks, in coordination with the AI Task Force and the CIO at VITA, and directs other executive branch agencies to cooperate.
  jurisdiction: virginia
  recheck: monthly
- id: va-eo-46-2025
  url: https://rosetta.virginiamemory.com/delivery/DeliveryManagerServlet?dps_pid=IE4126361
  format: html
  citation: Executive Order 46 (2025)
  title: Banning the Use of Deepseek Artificial Intelligence on State Government Technology
  doc_type: executive_order
  issuing_body: Office of the Governor
  tags:
  - ai
  - cybersecurity
  stub: true
  stub_reason: 'Text not obtainable and status not confirmed, measured 2026-11-11. VITA''s AI page links the order at the Library of Virginia''s digital archive (title of the page: ''Executive Order 46 (2025) Banning the Use of Deepseek Artificial Intelligence on State Government Technology''), but the Fetcher got a 15,273-byte JavaScript document-viewer page with no order text; the archive''s file stream is not a link on that page. The Governor''s own paths for the order (www.governor.virginia.gov and governor.am.virginia.gov, .../pdf/eo/EO-46.pdf) answered HTTP 404. The Executive Actions page says orders of former governors in effect are listed at the Library of Virginia in a script-rendered collection that was not readable. The order was issued by Governor Youngkin; no order read in this run rescinds it (EO-10 of 2026 rescinds only Executive Order 47), but that is not proof it is in force. Becomes a document when a readable official copy and its status are confirmed.'
  why_relevant: Bans the DeepSeek AI application on state government technology (VITA's AI page lists it under Guidance, next to Executive Order 30 marked RESCINDED).
  jurisdiction: virginia
  recheck: monthly
