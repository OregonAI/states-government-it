# Virginia seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Issue #14. Discovery 2026-11-11: VITA's Policies, Standards & Guidelines library (67 links), the Enterprise Architecture,
# Artificial Intelligence, Governance, IT Investment Management and Project Management pages, the Code of Virginia and
# Administrative Code on law.lis.virginia.gov (pages and the documented JSON API), and the Governor's Executive Actions page.
sources:
- id: va-code-2-2-ch20-1
  sha256: "96d388cbb5d748d9bd4fe62bca08c4dc32662f4756fa5d9396d95821705fb3e5"
  url: https://law.lis.virginia.gov/vacodefull/title2.2/chapter20.1/
  format: html
  citation: Va. Code tit. 2.2, ch. 20.1
  title: Chapter 20.1. Virginia Information Technologies Agency
  doc_type: statute
  issuing_body: Virginia General Assembly; published by the Division of Legislative Automated Systems on the Virginia Law portal
  tags:
  - governance
  - oversight
  - funding
  - procurement
  - cybersecurity
  - data
  - cloud-resilience
  why_relevant: 'The enabling statute for VITA and the Chief Information Officer of the Commonwealth: creation of the agency and the CIO (2.2-2005), definitions (2.2-2006), the CIO''s powers including policies, standards and guidelines for executive branch agencies (2.2-2007, 2.2-2007.1, 2.2-2011), security of government information (2.2-2009), procurement of information technology (2.2-2012, 2.2-2012.1), internal service funds (2.2-2013), agency IT plans (2.2-2014), the Division of Project Management and project oversight (2.2-2016 to 2.2-2021), the Virginia Technology Infrastructure Fund (2.2-2022 to 2.2-2024) and the Office of Data Governance and Analytics (2.2-2034.1). The page serves the whole chapter, so the repealed sections (2.2-2008, 2.2-2010, 2.2-2015, 2.2-2018, 2.2-2019, 2.2-2025, 2.2-2031 to 2.2-2033) ride along as their ''Repealed'' headings.'
  jurisdiction: virginia
  recheck: monthly
