    Owner decision of 2026-11-13 applied (a provision in a non-IT chapter is seeded as a section when its own focus is the governance of state IT; each candidate read in the official bytes the Fetcher served from law.lis.virginia.gov on 2026-11-13). Seeded: Va. Code 2.2-203.2:5 (Secretary of Administration; technology programs: the section is about enterprise IT projects, IT oversight committees and approval of the Commonwealth IT strategic plan). Left out, with the measured reason: (1) 2.2-225 (Secretary of Technology): the page reads 'Sections 2.2-225, 2.2-225.1. Repealed. Repealed by Acts 2020, c. 738, cl. 2', so it is not in force; its duties moved to 2.2-203.2:5. (2) 2.2-2457 and 2.2-2458 (Information Technology Investment Board): '2.2-2457 through 2.2-2458.1. Repealed by Acts 2010, cc. 136 and 145, effective March 11, 2010'; Chapter 24 lists Article 20 (the Board) with only 2.2-2457 'Repealed' and no 2.2-2458. (3) 2.2-2026 and 2.2-2027 (VGIN Division, cited by VITA's OTH 702-00): repealed. The page for 2.2-2025 reads '§§ 2.2-2025 through 2.2-2030. Repealed. Repealed by Acts 2020, c. 423, cl. 2' (the VGIN Division moved to the Department of Emergency Management); chapter 20.1's Article 4 lists only 2.2-2025, 'Repealed', and the 2.2-2026 and 2.2-2027 addresses return the Title 2.2 contents page. (4) 2.2-2423 (Virginia Geographic Information Network Advisory Board): a board of 19 members that advises the Geographic Information Network Division of the Department of Emergency Management 'on issues related to the exercise of the Division's powers and duties'; the section is membership, terms, quorum, compensation and staffing, and prints nothing that governs IT, so its focus is not IT governance. (5) 2.2-603 (authority of agency directors): the section is the general powers of every executive agency head (supervision, appropriations requests, employee speech, federal-funds and delinquency reports); only subsection F (directors secure the electronic data their agency holds and comply with the IT security and risk-management program of 2.2-2009) is IT, and a section slice cannot take one subsection. (6) 2.2-4303.01 (high-risk contracts): applies to every public contract over $5 or $10 million for goods, services, insurance or construction; VITA reviews only the IT ones, so it applies to IT along with everything else. (7) 2.2-1115 (execution of contracts and payment for purchases by the Division of Purchases and Supply): general centralized purchasing and accounting, no IT; subsection D (the Comptroller's warrants) is about purchases of any material, equipment or supplies. (8) 2.2-4300 to 2.2-4304 (Virginia Public Procurement Act core), left for the owner. 2.2-4300 reads as the policy of 'governmental procurement from nongovernmental sources' generally, and 2.2-4301 to 2.2-4303 are general definitions and methods of procurement. Each section has IT subdivisions, re-measured in the bytes served on 2026-11-13: 2.2-4303(H) lets agencies buy IT at public auction 'if approved by the Chief Information Officer'; 2.2-4304(B)(2) permits an agency to buy IT and telecommunications goods and services from another public body's contract 'if approved by the Chief Information Officer of the Commonwealth'; 2.2-4304(C) says that for 'telecommunications and information technology goods and services ... such arrangement shall be permitted if approved by the Chief Information Officer of the Commonwealth' and (C)(2) allows GSA purchases of IT 'upon approval of the Chief Information Officer of the Commonwealth'. Those subdivisions are who may buy and approve state IT, which decision 1 names, but each sits inside a general procurement section and a section-number slice cannot isolate a subdivision, so they are not seeded. Owner decision: whether to seed 2.2-4303 and 2.2-4304 whole. (9) 2.2-4310, 2.2-4343.1, 2.2-2001 and 2.2-2000.1 (small, women- and minority-owned business preferences): general procurement policy, not IT. (10) Executive Order 35 (2019) (Governor Northam; small, women- and minority-owned business equity): procurement policy for small, women- and minority-owned businesses, not IT. (11) Executive Order 19 (2018, Cloud Service Utilization and Readiness; Governor Northam): the Buy IT manual (28.1.4) says VITA developed its cloud governance 'First under Executive Order Number 19 (2018) ... and later under applicable language in the Appropriation Act and VITA's chapter of Title 2.2', and EA 300-02 (2022) removed its Appendix B 'EO19'; no official copy of the order or list showing it in force was found (the Library of Virginia list of former governors' orders is script-rendered, as for Executive Order 46), so it is not seeded. A reader who finds the order in force can seed it as an executive order. (The 2.2-4303(F) emergency-procurement duty is in the held VITA policy, and the 2.2-2009 security program is in the held chapter 20.1.)
