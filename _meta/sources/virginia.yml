left_out:
- text: |-
    ---- Virginia: found and left out (each was seen on an official page on 2026-11-11; the reason is recorded here). 'Owner decision' marks a judgment call a reviewer should confirm.
- text: |-
    Rules: none in force. Virginia's Administrative Code agency list (https://law.lis.virginia.gov/admincodeagencylist, 147 agency links, fetched 2026-11-11 through the Fetcher) names the 'Virginia Information Technologies Agency' at /admincode/title1/agency40/ (1VAC40). That agency page redirects to the Title 1 contents page (https://law.lis.virginia.gov/admincode/title1/), which lists Agencies 7, 17, 20, 30, 42, 45, 50, 55, 65, 75 and 80 and no Agency 40: VITA has no chapters, so no rule in force. (The first pass of this record said that no agency name contained 'Information' or 'Technolog'; that measurement was wrong, the agency is listed, and the conclusion rests on the Title 1 contents.) Title 1's contents page is watched, so a new 1VAC40 chapter raises a report. Va. Code 2.2-2007 says the CIO shall promulgate regulations, but VITA publishes its requirements as ITRM policies, standards and guidelines (seeded) and as Town Hall guidance documents, not as regulations. VITA's own 'VITA Rules' page is a supplier-rules instrument, seeded as a policy.
- text: |-
    Statutes about AI: none found that binds state agencies. The texts fetched in this run (Va. Code chapters 20.1, 35, 38, 38.1, 38.2, 4.3 and 55.3 of title 2.2, sections 2.2-2699.5, 2.2-2699.6, 2.2-203.2:4 and 18.2-186.6) contain neither 'artificial intelligence' nor 'generative'. VITA's AI standard and AI policy and the executive orders are the Virginia instruments on government AI. A web search (discovery only, nothing fetched from it) reported a 2026 act on independent AI verification organizations (SB 384 / HB 797) described as a study and verification-organization measure, which would bind private organizations and the Joint Commission on Technology and Science rather than state agencies; it was not found in the Code pages read and is a lead, not a finding. Owner decision: whether to look for 2026 session laws that are not yet codified.
- text: |-
