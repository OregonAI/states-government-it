left_out:
- text: |-
    ---- Virginia: found and left out (each was seen on an official page on 2026-11-11; the reason is recorded here). 'Owner decision' marks a judgment call a reviewer should confirm.
- text: |-
    Rules: none. Virginia's Administrative Code (law.lis.virginia.gov/admincode, read through the portal's documented JSON API, AdministrativeCodeGetTitleListOfJson and AdministrativeCodeGetAgencyListOfJson) lists 24 titles and 152 agencies; none of the agency names contains 'Information', 'Technolog', 'VITA', 'Cyber' or 'Data'. Va. Code 2.2-2007 says the CIO shall promulgate regulations, but VITA publishes its requirements as ITRM policies, standards and guidelines (seeded), not as regulations. VITA's own 'VITA Rules' page is a supplier-rules instrument, seeded as a policy. No rule watch page is seeded because there is no VITA agency page to watch.
- text: |-
    Statutes about AI: none found that binds state agencies. The texts fetched in this run (Va. Code chapters 20.1, 35, 38, 38.1, 38.2, 4.3 and 55.3 of title 2.2, sections 2.2-2699.5, 2.2-2699.6, 2.2-203.2:4 and 18.2-186.6) contain neither 'artificial intelligence' nor 'generative'. VITA's AI standard and AI policy and the executive orders are the Virginia instruments on government AI. A web search (discovery only, nothing fetched from it) reported a 2026 act on independent AI verification organizations (SB 384 / HB 797) described as a study and verification-organization measure, which would bind private organizations and the Joint Commission on Technology and Science rather than state agencies; it was not found in the Code pages read and is a lead, not a finding. Owner decision: whether to look for 2026 session laws that are not yet codified.
- text: |-
    Statute sections and chapters seen and left out: the rest of chapter 26 (Councils) and chapter 2 (Governor's secretaries) of title 2.2, whose seeded sections are ITAC (2.2-2699.5, 2.2-2699.6) and the Chief Data Officer (2.2-203.2:4); the rest of Chapter 6 of Title 18.2 around 18.2-186.6; chapter 37 (Virginia Freedom of Information Act), chapter 43 (Virginia Public Procurement Act, procurement code: the playbook leaves procurement sections out pending an owner decision on section-level slicing) and chapter 55.6 (Use of Automatic License Plate Recognition Systems, law-enforcement technology) of title 2.2. Owner decision: the seed takes four single sections out of non-IT chapters (2.2-2699.5, 2.2-2699.6, 2.2-203.2:4, 18.2-186.6) because each is IT or data specific or, for 18.2-186.6, names governments and agencies in its definition of the entities bound; the playbook's section-slicing rule is pending, so they may be moved to this list.
- text: |-
    Statutes seeded on a judgment: chapters 38.1 (Protection of Social Security Numbers Act) and 38.2 (Digital Certification of Government Records) are whole-chapter takes of small chapters about agency-held data and electronic records; chapter 35 (Information Technology Access Act) is accessibility of IT. Owner decision on all three.
- text: |-
    Executive orders and directives: the Governor's Executive Actions page (read 2026-11-11, Governor Abigail D. Spanberger) lists 22 executive orders (EO-1 to EO-22) and 6 executive directives (ED-1 to ED-6). All 28 PDFs were fetched and scanned for 'information technology', 'cyber', 'artificial intell', 'VITA' and 'chief information'. Seeded: EO-22 and ED-6. Left out: the other 26, which do not govern state IT, cybersecurity, data or AI. EO-19 (Unified Readiness Framework, all-hazards preparedness) names cyber incidents and cybersecurity as hazards the framework covers; it is emergency management, not IT governance (owner decision). EO-10 rescinds Executive Order 47 (not read as IT). Orders of former governors that remain in effect are listed at the Library of Virginia in a script-rendered collection that could not be read, so no earlier order could be confirmed in force; Executive Order 46 (2025, DeepSeek) is a stub for that reason and EO 30 (2024, AI) is listed on VITA's AI page as RESCINDED (not seeded: not in force).
- text: |-
    Policy library (VITA Policies, Standards & Guidelines, 67 links read row by row on 2026-11-11): 25 documents (24 PDFs and the Cloud Third Party Use Policy page), 1 stub (Enterprise Data Standards, a spreadsheet), 41 left out, listed in the next items. Reconciliation: 25 + 1 + 41 = 67.
- text: |-
    Policy library, left out (8 rows): 'COV ITRM PSG and Supporting Documents Overview' (a Word file, January 25, 2022, that explains the ITRM document framework and lifecycle process; an overview, not an instrument); the 'COV IT Glossary' page (a glossary); the 'EO 30' link in the Artificial Intelligence topic (rescinded); 'Hosted Environment Information Security Standard (SEC525)' and 'Information Security Standard (SEC501)', both listed under 'Superseded Standards' (the fetched PDFs print SEC525-5.0 and SEC501-12.0, August 25, 2022; superseded, so not in force); the Word-version link for the Commonwealth Project Management Guideline (CPM 110-05), which the Fetcher found to serve the same 98-page PDF as the PDF link (a duplicate); and the 'Project Management Division (PMD)' and 'IT Investment Management' links, which are pages (watched, with the Project Management and IT Investment Management pages).
- text: |-
    Policy library, Tools and Templates (33 rows, all left out as forms, templates, workbooks and guidance rather than instruments). Forms (4): Agency Security Awareness Training Solution Form, Agency Security Awareness Training Verification and Compliance Form (SEC527), Annual Risk Assessment Review and Certification, COV Security Standard Exception Form. Templates and worksheets (20): Application Template, Audit Corrective Action Plan Quarterly, Audit Corrective Action Plan Initial, BIA Template, Data Set Template, Interoperability Security Agreement Template, IT Risk Assessment Plan Template, IT Security Audit Plan Template, IT Security Audit Resources Template, Mission Essential Function Identification Worksheets, Public Kiosk Guideline Template, Risk Treatment Plan Template, Scan Treatment Plan Template, the four SEC530 SSP templates (All Controls, Organization Controls, Non-Sensitive System Specific, Sensitive System Specific), Security Roles and Responsibilities Template, System Inventory and Definition Template, VDEM Continuity Plan Template. Workbooks (3): COV Risk Register, SEC527 Crosswalk, SEC530 Control Summaries. Other (6): Archer User Manual (a software manual), COV ISO Certification and Continuing Education Requirements (a Commonwealth Security and Risk Management guideline, February 2026, on becoming a certified ISO; a guideline for a certification, owner decision), Resources for the Removal of Commonwealth Data from Electronic Media (a list of tools), VDEM Guide to Identifying Mission Essential Functions (a 2011 Virginia Department of Emergency Management guide, not a VITA instrument), Vulnerability Scanning and Intrusion Detection System (IDS) Reporting FAQs (an FAQ), and the 'Data Removal' page (a page of tool links that points to SEC514).
- text: |-
    Stale copies on other VITA pages, left out in favour of the library's current versions: the IT Investment Management page links Technology Management Policy GOV 105-04 (December 2, 2013; the library's GOV 105-05 is seeded) and ITIM Standard CPM 516-03 (August 3, 2021; the library's link, the Town Hall copy CPM 516-04, is seeded). The Security page links SEC501-10.1, IT Security Audit Standard SEC502 (an older file; the library's SEC502-05 is seeded), IT Security Audit Guideline SEC 512.00 (January 2009, a guideline that is not in the library index), an IT Security Audit Plan Template and a Corrective Action Plan Template.
- text: |-
    Enterprise Architecture page, left out: 12 technology roadmaps and 10 reference architectures and patterns (GitHub, CI/CD, Enterprise RAG, ETL, Event Logging, SSO, Identity Scope of Authority, MCP, Operational Application, Web Application), all 22 presentations in VITA's Ardoq account at vita.us.ardoq.com (a third-party hosted application that is not a state-run document host and was not fetched); the 'Technology Roadmap Definitions' PDF (a one-page table of roadmap classes, no obligations) the Cloud IT Operating Model RASCI workbook, and the 'Process for adding or updating the Cloud Services Roadmap' PDF (a two-page process slide); EA exception requests (an Archer process). Of the 21 EA requirements rows (counting the AI Standard and the Enterprise Data Standards workbook), 20 are seeded and the workbook is a stub. Owner decision: the EA requirements documents are EA225 requirement documents and are seeded as standards; two of them (EIA Framework, 2016, and Legacy IT Solutions Topic Report, 2019) are older reports that print 'requirements' and are in the index as such.
- text: |-
    Artificial Intelligence page, left out: the AI FAQs page (an FAQ), the New AI Registry Job Aid v1.1, October 2026 (a 13-page job aid for the registry) and its information session video, the Artificial Intelligence Roadmap (an Ardoq presentation), and ten templates and guidebooks that the page links from the Office of Data Governance and Analytics (AI Model Card, AI Explainability Model Card Instructions, AI Incident Response Form, AI Incident Response Playbook Template, AI System Implementation and Operations Plan, AI Vendor Assessment Plan, AI Bias and Fairness Guidebook, Algorithmic Impact Assessment, Data to AI Governance Map, GDCDPA Compliance Guidebook for AI Systems). ODGA's agency-resources page (watched) also points to a Data Governance and Literacy site on a SharePoint library open to Commonwealth employees and contractors only: sign-in-only, not read.
- text: |-
    IT Investment Management, Project Management and Commonwealth Technology Portfolio pages, left out by type (link counts on 2026-11-11): strategy documents (COV Technology Strategy 2023-2027 and the 2019 Commonwealth Technology Business Plan); reports (the quarterly lists of major IT projects and their presentations (28 PDFs on that page) and a Planview release note); job aids, process steps and training (18 files on the Agency IT Strategic Planning page, the training and presentation PDFs on the Project Management Training page, the ITIM and AITR training pages); the Project Management Templates & Tools page (58 files: templates, directions and worksheets); the IV&V statement-of-work templates and attachments on the PMD page. The PM standards CPM 110-05, CPM 111-05 and CPM 112-04.8 are seeded from the library. The sub-pages of these sections were read only as far as their link lists.
- text: |-
    Owner decisions, summary: (1) guidelines OTH 701-00 and CPM 110-05 are seeded as standards because the library lists them; (2) SEC503 and SEC505 bind circuit court clerks, not executive branch agencies; (3) the footer of VITA's library page reads '©2026 Virginia IT Agency. All Rights Reserved.' (recorded for the owner, as the issue asks); VITA's pages and PDFs are mirrored in full by this corpus, so the owner decides before the repo goes public; (4) the Town Hall copy of CPM 516-04 is a state-run host other than VITA; (5) the section-level statute takes and the three small chapters above; (6) EO-19 and EO 46 above.
