- id: va-code-2-2-ch55-3
  sha256: "179507696939bb50540da69d6884d2b043ab22b504b40eb80a62a73f918e8a2d"
  url: https://law.lis.virginia.gov/vacodefull/title2.2/chapter55.3/
  format: html
  citation: Va. Code tit. 2.2, ch. 55.3
  title: Chapter 55.3. Prohibition on the Use of Certain Products and Services
  doc_type: statute
  issuing_body: Virginia General Assembly; published by the Division of Legislative Automated Systems on the Virginia Law portal
  tags:
  - cybersecurity
  why_relevant: 'Binds every public body: no use of hardware, software or services prohibited by the U.S. Department of Homeland Security for federal systems, a 24-hour duty to report security incidents to the Virginia Fusion Intelligence Center (which shares them with the CIO), and confidentiality of cybersecurity information held by VITA (2.2-5514); no use of TikTok, WeChat or other ByteDance or Tencent applications and websites on government devices or networks (2.2-5514.1). The statute lead 2.2-5514 named in the issue is confirmed here.'
  jurisdiction: virginia
  recheck: monthly
- id: va-code-2-2-2699-5
  sha256: "c97c3e046bbcf48b61c467ea3ddc6d8ce3f076fea139a13611e1693ff8825857"
  url: https://law.lis.virginia.gov/vacode/title2.2/chapter26/section2.2-2699.5/
  format: html
  citation: Va. Code § 2.2-2699.5
  title: § 2.2-2699.5. Information Technology Advisory Council; membership; terms; quorum; compensation; staff
  doc_type: statute
  issuing_body: Virginia General Assembly; published by the Division of Legislative Automated Systems on the Virginia Law portal
  tags:
  - governance
  - oversight
  why_relevant: Establishes the Information Technology Advisory Council (ITAC) that advises the CIO and the Secretary of Administration on information technology; VITA staffs it. One section of the chapter on councils (the rest of chapter 26 is left out).
  jurisdiction: virginia
  recheck: monthly
