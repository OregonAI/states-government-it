- id: nh-st-21-r
  sha256: "6f8426b37eb586c337da0df42a6016f54e05b1533bbf73f4255357a2adc5c618"
  url: https://gc.nh.gov/rsa/html/I/21-R/21-R-mrg.htm
  format: html
  citation: RSA Chapter 21-R
  title: Chapter 21-R Department of Information Technology
  doc_type: statute
  jurisdiction: new-hampshire
  issuing_body: New Hampshire General Court
  tags:
  - governance
  - oversight
  - procurement
  - funding
  - cybersecurity
  - data
  - cloud-resilience
  recheck: monthly
  why_relevant: 'The enabling statute for the Department of Information Technology and the state CIO (21-R:2, 21-R:3: the commissioner is the chief information officer), and the state''s cybersecurity statute for the executive branch: the Chief Information Security Officer and the statewide information security manual (21-R:3 I-b, 21-R:4-a), the cybersecurity integration center (21-R:4 XXI), the Information Technology Council (21-R:6), IT plan approval, statewide standards and protocols with waivers (21-R:4 III, V, XVIII), IT purchasing approval by the Department (21-R:8-a), the statewide telecommunications fund (21-R:9-a), open standards and open data formats (21-R:10 to 21-R:14), the prohibition on Kaspersky software (21-R:15) and the Cybersecurity Advisory Committee (21-R:16). 21-R:9 and 21-R:12 print as repealed. The statute authorises a statewide information security manual and standards; the manual and standards themselves are not in the seed list: no page of them could be read through the Fetcher (see left_out). The text carries session-law Source lines but no effective date for the chapter.'
- id: nh-st-5-d
  sha256: "8f771e5edb3048ab0cc00c7be1264ab9e6973b7fd436009ba12f8a50ecb52700"
  url: https://gc.nh.gov/rsa/html/I/5-D/5-D-mrg.htm
  format: html
  citation: RSA Chapter 5-D
  title: Chapter 5-D Use of Artificial Intelligence by State Agencies
  doc_type: statute
  jurisdiction: new-hampshire
  issuing_body: New Hampshire General Court
  tags:
  - ai
  - governance
  - oversight
  recheck: monthly
  why_relevant: 'The statute on state-agency use of AI (2024, 209:1, eff. July 1, 2024): definitions of AI, generative AI and deepfakes; applicability to all computer systems operated by any state agency (defined to include the legislative and judicial branches and law enforcement) with exceptions for research systems at state-funded institutions of higher learning and installed consumer systems; prohibited uses (unlawfully discriminatory classification of persons, real-time remote biometric identification for public-space surveillance except by law enforcement with a warrant, deceptive or malicious deepfakes); human review of irreversible AI recommendations, disclosure of generative-AI content and of AI interaction; and compliance reporting to the Department of Information Technology, which is to apply its ''code of ethics for AI systems'' (5-D:5; that code is not in the seed list: no page of it could be read through the Fetcher; see left_out).'
- id: nh-st-359-n
  sha256: "4167c88cf1df36d675988df4a52f16c101024a2d3c0199ac8e0d64a43e24349b"
  url: https://gc.nh.gov/rsa/html/XXXI/359-N/359-N-mrg.htm
  format: html
  citation: RSA Chapter 359-N
  title: Chapter 359-N Regulation of Biometric Information
  doc_type: statute
  jurisdiction: new-hampshire
  issuing_body: New Hampshire General Court
  tags:
  - data
  - digital-services
  recheck: monthly
  why_relevant: 'Binds every ''government agency'', defined (359-N:1 II) as any employee, agent, elected official or entity of the state, a municipality or any other political subdivision: no agency may issue an identification card or device that requires biometric data, require biometric data as a condition of services, or obtain, retain or provide biometric data except as the chapter allows (359-N:2), with exemptions (359-N:3) and a civil action (359-N:4). Municipalities are covered by the same text and ride along.'
- id: nh-st-4-f
  sha256: "bcca88defde0be206f8107c7d83a61ba7c9320d88cf3a26ae1f54d3a31a178f0"
  url: https://gc.nh.gov/rsa/html/I/4-F/4-F-mrg.htm
  format: html
  citation: RSA Chapter 4-F
  title: Chapter 4-F New Hampshire Geographic Information System Committee
  doc_type: statute
  jurisdiction: new-hampshire
  issuing_body: New Hampshire General Court
  tags:
  - data
  - governance
  recheck: monthly
  why_relevant: 'Establishes the state GIS committee (members: the heads of thirteen state agencies including the Department of Information Technology, GRANIT at the University of New Hampshire, a municipal GIS manager and a regional-planning representative) and requires its member entities to share geospatial data and resources (4-F:1 III) and charges it with reviewing the use, development and coordination of geospatial data by state agencies. One section. Borderline: governs a government data function across agencies; kept as in scope (OWNER DECISION if the owner wants GIS out).'
