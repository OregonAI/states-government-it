left_out:
  - text: "RSA chapters 4-D (Office of Information Technology), 8-C (Department of Centralized Automated Data Processing), 7-A (Information Practices Act), 8-B (Records Management and Archives), 12-M (E-Commerce Advisory Commission), 21-T (State Procurement Policies and Procedures), 294-D (Digital Signature Act) and 17-O (Legislative Oversight Committee on Data Processing): the General Court's table-of-contents page for each prints 'Chapter is repealed' (read 2026-11-12). Not in force; no entry."
  - text: "RSA chapter 294-E (Uniform Electronic Transactions Act, https://gc.nh.gov/rsa/html/NHTOC/NHTOC-XXVII-294-E.htm), a general commercial-law chapter: sections 294-E:17, 294-E:18 and 294-E:19 are seeded one by one (nh-st-294-e-17 to -19) under the owner decision of 2026-11-13, because each governs state agencies' electronic records and the IT department's standards for them. The other 17 sections (294-E:1 to 294-E:16 and 294-E:20, among them 294-E:12 on retention of electronic records) are the general law of electronic records and signatures and stay out: their focus is not state IT governance. 294-E:12 is general retention law; its paragraph VII only preserves agencies' power to add requirements ('This section does not preclude a governmental agency of this state from specifying additional requirements for the retention of a record subject to the agency's jurisdiction'), and 294-E:18 I and III open 'Except as otherwise provided in RSA 294-E:12, VI'; the section as a whole does not govern state IT (read 2026-11-12)."
  - text: "RSA 359-C:19, 359-C:20 and 359-C:21 (Notice of Security Breach, three single-section pages, read in full 2026-11-12) and the rest of chapter 359-C: NOT seeded, OPEN OWNER QUESTION under the owner decision of 2026-11-13, which lists 'a privacy or breach section that binds state agencies' systems' as qualifying. For: 359-C:19 III defines 'person' to include 'any agency, authority, board, court, department, division, commission, institution, bureau, or other state governmental entity, or any political subdivision of the state', and 359-C:20 III(b) allows electronic notice 'if the agency or business' primary means of communication with affected individuals is by electronic means'; Nebraska (87-801 to 87-808) and Nevada (603A) hold their breach acts on the ground that they bind state agencies. Against: 359-C:20 I binds 'any person doing business in this state who owns or licenses computerized data', 359-C:19 V limits a 'security breach' to personal information 'maintained by a person doing business in this state', state entities appear only as one kind of person alongside corporations, trusts and individuals, and the subdivision is enforced under RSA 358-A as consumer-protection law. Question for the owner: does a breach statute that names state entities as 'persons' but conditions the duty on 'doing business in this state' count as binding state agencies? Sections 1 to 18 of the chapter are financial-records privacy (financial institutions) and stay out. Left out until answered."
  - text: "RSA chapters 91-A (Access to Governmental Records and Meetings) and 202-B (State Government Information Dissemination and Access Act: library depository of state publications): public-records and library law, not IT governance. Listed in the Title VI and Title XVI contents pages; not read beyond the contents. Left out."
  - text: "RSA chapter 91-C (Personal Privacy Protection Act, https://gc.nh.gov/rsa/html/VI/91-C/91-C-mrg.htm, read in full 2026-11-12): two sections. 91-C:1 bars public agencies and public bodies from disclosing, or requiring from a 501(c) organization, compilations of data identifying its members, supporters, volunteers or donors; 91-C:2 lists exemptions. It is donor-privacy and public-records law about one class of records, with nothing on information systems, data governance, cybersecurity or AI. Out of scope; left out."
  - text: "RSA chapter 9-F (Online Access to Budget Information and Reports, https://gc.nh.gov/rsa/html/I/9-F/9-F-1.htm, read in full 2026-11-12; 9-F:2 is repealed): declined under the owner decision of 2026-11-13. 9-F:1 requires the commissioner of administrative services to publish monthly expenditures, salaries, links to audit reports and budgets, and contracts on a transparency website 'to be created by the department of information technology'; the section's focus is fiscal disclosure, and the IT department is named only as the builder of the site, with no duty about how the state governs its systems or data. Not IT governance; left out."
  - text: "RSA chapter 21-U (Interagency Information Sharing by Financial Services Regulators, https://gc.nh.gov/rsa/html/I/21-U/21-U-mrg.htm, read in full 2026-11-12): four named financial regulators share complaint and enforcement data and keep a cooperative information-sharing database (21-U:2 II). An agency-program database for one regulatory field, not statewide IT governance. Out of scope; left out."
  - text: "RSA 21-I:11 (divisions of procurement and support services, public works and plant and property) and 21-I:14 (rulemaking authority of the commissioner of administrative services), read in full from the section pages 2026-11-12, and the general purchasing rules Adm 600 (Parts Adm 601 to 613, https://gc.nh.gov/rules/state_agencies/adm.html). 21-I:11 I(a)(8) is APPROVED under the owner decision of 2026-11-13 (an IT purchasing provision of a procurement code) but BLOCKED, not declined: the chief information officer must approve an agency's request to buy 'computer hardware, software, related licenses ... that either require an expenditure of more than $5,000' or are off the approved standards list, 'to ensure that the procurement is consistent with the state information technology plan'. The slice shape is whole-section only (section_start, section_end_before), and the General Court serves 21-I:11 as one page whose other paragraphs are purchasing of all supplies, surplus property, inventory, plant and property, and Buy America steel (21-I:11 III), so the paragraph cannot be cut without non-IT text coming with it. Needs a paragraph-level slice (shared change) or an owner answer on whether the whole section is wanted. The IT purchase approval is already described in the held chapter 21-R:8-a (nh-st-21-r). 21-I:14 XII is out: it reads 'Standards and procedures governing the purchase of all materials, supplies and equipment', with no IT focus. Adm 600 is general purchasing and out. The same chapter's 21-I:11-e (electronic reverse auctions) was not read as a candidate. Not seeded."
  - text: "RSA chapters 106-K (Criminal Justice Information System), 651-F (Information and Analysis Center), 644-A (Electronic Device Location Information), 359-H (Computer Spyware), 359-I (Identity Theft), 507-H (Expectation of Privacy), 359-B and other private-sector privacy or crime chapters, 189 student-data provisions: law enforcement, private-sector or K-12 subjects; out of scope under _meta/domain.yml. Chapter titles read in all 47 Title contents pages (1,914 chapter lines, 2026-11-12); a keyword pass over those titles (inform, data, cyber, comput, electronic, record, privacy, technolog, artificial, digital, internet, software, telecom, identity, secur, procure, online, automated, biometric, facial) found no other candidate."
  - text: "Administrative rules of the IT agency: none found. The Division of Administrative Rules' list 'Rules Listed by State Agency' (https://gc.nh.gov/rules/about_rules/listagencies.aspx, read in full 2026-11-12, 156 distinct agency pages linked) has no Department of Information Technology prefix; RSA 21-R gives the Department no rulemaking and has it adopt standards and a telephony manual outside RSA 541-A (21-R:4 XVIII, XX). The Department of Administrative Services' rule chapters (Adm 100, 200, 500 repealed, 600, 700, 800, 1000) hold nothing on IT; Adm 600 is general purchasing. Rules of other agencies on their own systems were not searched."
  - text: "The Department of Information Technology's statewide IT policies, standards and information security manual, which RSA 21-R:4-a and 21-R:4 XVIII say it adopts, and the code of ethics for AI systems that RSA 5-D:5 says it applies: no page of any of them could be read, no index of them was found in bytes fetched this run, and no gc.nh.gov page fetched links to the Department's site. Every www.nh.gov-family host tried answered the Fetcher HTTP 403 (Akamai 'Access Denied', measured 2026-11-12; hosts tried: www.doit.nh.gov, doit.nh.gov, mm.nh.gov, www.nh.gov, www.governor.nh.gov, governor.nh.gov, www.sos.nh.gov, www.das.nh.gov, das.nh.gov, including robots.txt). The statewide IT policy library therefore could not be enumerated and 'every item in the library' is NOT done; no stub is made because no URL for it is confirmed in bytes. Leads from web search are in docs/research/new-hampshire-leads.md, marked discovery only. Retry when the host answers the Fetcher."
  - text: "Governor's executive orders: governor.nh.gov and sos.nh.gov refuse the Fetcher (HTTP 403, same measurement; see stub nh-eo-governor-executive-orders), so no order was read and none could be checked in force. Leads from web search are in docs/research/new-hampshire-leads.md, marked discovery only."
  - text: "The index of the statewide IT policy library is not a watch entry or a stub: its address is not confirmed in bytes, and a watch needs a baseline fetch the host refuses. The executive order list is the one stub."
  - text: "NH was not checked for: other statutes bearing on state-agency data held outside the keyword pass above (for example agency-specific confidentiality chapters), session laws not yet codified in the RSA, and 2026 enacted bills. The statute pages are the General Court's current RSA."
