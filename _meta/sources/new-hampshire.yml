# New Hampshire seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Discovery 2026-11-12 through the toolkit Fetcher: gc.nh.gov (the RSA table of contents, all 67 Title pages, chapters 4-D, 4-F, 5-D, 7-A, 8-B,
# 8-C, 12-M, 17-O, 21-R, 21-T, 202-B, 294-D, 294-E, 359-C, 359-N), the General Court's administrative rules agency list and the Adm and other
# agency rule pages. Every www.nh.gov-family host (DoIT, Governor, Secretary of State, DAS) answered the Fetcher HTTP 403 Access Denied.
