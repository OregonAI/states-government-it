  doc_type: statute
  jurisdiction: new-hampshire
  issuing_body: New Hampshire General Court
  tags:
  - data
  - digital-services
  - governance
  - cybersecurity
  recheck: monthly
  why_relevant: 'Section slice of the Uniform Electronic Transactions Act, seeded under the owner decision of 2026-11-13 because the section itself governs state IT: ''the department of information technology, in cooperation with the secretary of state and the department of administrative services may develop standards by which a governmental agency may send and accept electronic records and electronic signatures ... and otherwise create, generate, communicate, store, process, use, and rely upon electronic records and electronic signatures'', with standards for format, type of electronic signature, third parties, and ''control processes and procedures ... to ensure adequate preservation, disposition, integrity, security, confidentiality, and auditability of electronic records'' (II(c)). The Department''s standards under it are not in the seed list (see left_out). One page per section; read 2026-11-12, no repeal or expiry marker, last amended eff. Aug. 9, 2021 (its Source line).'
