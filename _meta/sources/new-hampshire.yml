  stub: true
  stub_reason: 'Refused by the host, measured 2026-11-12 on this build machine through the toolkit Fetcher (make_fetcher, with the toolkit''s curl-on-challenge option on): every request to a www.nh.gov-family host answered HTTP 403 with an Akamai ''Access Denied'' page (title ''Access Denied'', body ''You don''t have permission to access ... on this server'', an errors.edgesuite.net reference), including robots.txt. Hosts tried: www.doit.nh.gov, doit.nh.gov, mm.nh.gov (DoIT''s file host), www.nh.gov, www.governor.nh.gov, governor.nh.gov, www.sos.nh.gov, www.das.nh.gov, das.nh.gov. It is a block on the client, not a missing page. No retry, no other client and no workaround was attempted, and nothing about this source was read in bytes: the URL is the link the General Court''s rules page prints for the Governor (confirmed in fetched bytes), but the executive order list''s own address is not known from bytes. The Governor''s orders (also published by the Secretary of State on sos.nh.gov, refused the same way) could not be listed, so none could be checked for IT, cybersecurity, data or AI content or for in-force status.'
  why_relevant: 'The Governor''s executive orders in force on state IT, cybersecurity, data or AI. Stub: refused, see stub_reason.'
- id: nh-st-294-e-17
  sha256: "2b7e22028cd65ff3d1fda47db485b176ab7449143d95ec5b8756b8804038be7e"
  url: https://gc.nh.gov/rsa/html/XXVII/294-E/294-E-17.htm
  format: html
  citation: RSA 294-E:17
  title: RSA 294-E:17 Creation and Retention of Electronic Records and Conversion of Written Records by Governmental Agencies
  doc_type: statute
  jurisdiction: new-hampshire
  issuing_body: New Hampshire General Court
  tags:
  - data
  - digital-services
  - governance
  recheck: monthly
  why_relevant: 'Section slice of the Uniform Electronic Transactions Act (a general commercial-law chapter), seeded under the owner decision of 2026-11-13 because the section itself governs state IT and records: ''The secretary of state in cooperation with the department of information technology and the department of administrative services may create standards by which a governmental agency may create and retain electronic records and convert written records to electronic records.'' The General Court serves one page per section, so the page is the section; no other section of the chapter rides along. Read 2026-11-12 from gc.nh.gov: no repeal or expiry marker, last amended eff. Aug. 9, 2021 (its Source line); the chapter''s table of contents lists it.'
- id: nh-st-294-e-18
  sha256: "4d434a25e4f2324229f38224e637b7a0adcd56d9d33c081a44bfc15fe2efe204"
  url: https://gc.nh.gov/rsa/html/XXVII/294-E/294-E-18.htm
