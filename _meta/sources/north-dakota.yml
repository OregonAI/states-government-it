left_out:
- text: |-
    ---- North Dakota: found and left out (each was seen on an official page on 2026-11-12 and read through the Fetcher; the reason is recorded here)
- text: |-
    NDIT IT Policies page (https://www.ndit.nd.gov/about-us/it-governance/it-policies), reconciled row by row: 3 rows (Artificial Intelligence, Data Classification, Prohibited Technologies), all seeded as documents. IT Guidelines page: 2 rows (Artificial Intelligence, International Traveler), both seeded, as policy-type documents (OWNER DECISION: guidelines are the tier below policy and standard that N.D.C.C. 54-59-09 names; seeded because the library lists them, the owner may prefer them left out as non-binding guidance). The IT Standards page lists no standard: it links one wiki page on wiki.nd.gov, whose host does not resolve (see the stub). The IT Principles page (nine one-line principles: Enterprise First, Citizen Focused, Responsible Data Use, Security and Privacy by Design, Reuse Before Buying or Building, Keep Solutions Simple, Use Consistent Technology, Integrate and Adapt, Use Open Standards) is web text with no document and is left out as a statement of principles, not an instrument (OWNER DECISION if it should be a document; it is not a watch entry only because the IT Governance landing page, which is, links it).
- text: |-
    State IT Governance Changes (https://www.ndit.nd.gov/sites/default/files/documents/about-Us/it-governance/doc/North-Dakota-State-IT-Governance-Changes.pdf): a change log, watched, not seeded as an instrument. It names two guideline documents that the Guidelines page no longer offers and that were not found, so they are left out as not published: 'Electronic Records Management Guidelines' (revisions 07/10/2017) and 'Electronic Signature Guidelines' (revisions 09/30/2004). It also says the Prohibited Technology List 'turned into a Standard. Moved to Wiki with other Standards' on 05/18/2026.
- text: |-
    Other NDIT pages read (the 66 pages linked from the home page's menus; every file they link was listed): Statewide IT Planning, IT Procurement, Initiative Intake, Project Management, Enterprise Architecture, Cybersecurity pages. They are process and service pages with no instrument. Files they link and left out as not instruments: Service-Level-Objectives.pdf (a service commitment), the billing rate sheets (ndit-telecommunications-projected-rates-25-27.pdf and the 2027-2029 Data Processing and Telecommunications Rates), the broadband reports and the BEAD Final Proposal (broadband and reports), the Digital Accessibility Hub quick cards, ADA one-pagers and the Website Tracker Template (guidance, a template), secure-file-transfer-system-user-guide-2022.pdf (a user guide), the annual report financial statements and five other states' IT service catalogs (reports), abbreviations-used-on-retention-schedules.pdf and the records retention schedule (https://apps.nd.gov/itd/recmgmt/rm/recSer/retention.pdf, not fetched: a retention schedule of records, which the Records Management Act in chapter 54-46 makes the state records administrator issue; OWNER DECISION whether schedules belong).
- text: |-
    Statutes. Seeded: chapter 54-59 (Information Technology Department), chapter 54-59.1 (Cybersecurity Incident Reporting Requirements), chapter 54-46 (Records Management). Read and left out: chapter 54-69 (Advanced Technology Review Committee: a Department of Commerce grant program that gives priority to artificial intelligence research proposals; it binds no agency's use of IT); chapter 51-30 (Notice of Security Breach for Personal Information: its duties fall on 'any person' with no mention of state agencies, so it is a private-sector law, and the agency duty is chapter 54-59.1); chapter 44-04 (Duties, Records, and Meetings: open records and meetings law, not IT). Statute sections inside non-IT chapters (procurement, budget: 54-44.4 and 54-44.1) were not read at section level and are left out pending the owner's decision on section slicing. The chapter file for 54-59 carries, as the Legislative Council prints it, sections on distributed ledger technologies (54-59-02.2), the health information technology office and exchange (54-59-26 to 54-59-31) and the statewide longitudinal data system (54-59-34, 54-59-36, 54-59-37), which ride along. Sections 54-59-02.1, 07, 13, 17, 18, 21, 25, 33, 35 and 38 print as repealed in the same file (including the criminal justice information sharing board, 54-59-21, repealed by S.L. 2015, ch. 37, § 15, and the health information technology advisory committee, 54-59-25, repealed by S.L. 2025, ch. 479, § 39).
- text: |-
    Statute sections inside non-IT chapters that the Century Code index (https://ndlegis.gov/general-information/north-dakota-century-code/index.html, read through the Fetcher on 2026-11-12) lists with an IT heading, left out as 'section inside a non-IT chapter, pending the owner's section-slicing decision' (headings as the index prints them): 54-35-15 'Information technology program - Staff - Powers and duties', 54-35-15.1 'Information technology committee - Appointment', 54-35-15.2 'Information technology committee - Powers and duties', 54-35-15.3 'Information technology project quality assurance - Information technology committee review - Suspension of funds' and 54-35-15.4 'Information technology committee - Information technology reviews' (OWNER DECISION: a legislative committee that binds executive agencies' IT projects through suspension of funds); 9-16-16 'Creation and retention of electronic records and conversion of written records by governmental agencies', 9-16-17 'Acceptance and distribution of electronic records by governmental agencies' and 9-16-18 'Interoperability'; 54-10-28 'Information technology responsibilities' and 54-10-29 'Audits of computer systems - Penalty' (State Auditor); 15-10-44 'Higher education information technology - Board duties - Reports' (with 15-10-44.1 to 15-10-44.3 under it on the index); 44-04-24 'Security system plan - Disaster and cybersecurity information - Exemption'. The text of these sections was not read; only the index headings were. Procurement and budget law (54-44.4, 54-44.1) is likewise left out unread.
- text: |-
    OMB IT Procurement Guidelines (https://www.omb.nd.gov/doing-business-with-the-state/procurement/guidelines-rules-and-laws/it-procurement-guidelines, read through the Fetcher on 2026-11-12): a web page, not a file, that states 'These guidelines are established by North Dakota Information Technology and the Office of Management and Budget State Procurement Office'. It is the same guideline tier as the NDIT guidelines seeded above, but it is a procurement-process page (IT plans, Technology Business Partners, the initiative intake requirement, the intake tracker) with no document, so it is left out as a procurement-process web page (OWNER DECISION, the same as for the NDIT guidelines: whether guidelines belong, and whether this page should be a watch entry). The page links two standards on ndit.nd.gov that the Fetcher could not reach (ConnectError '[Errno -2] Name or service not known' on 2026-11-12): 'Project Management for Information Technology Standard' (https://www.ndit.nd.gov/standards/POL0020207) and 'IT Procurement Standard' (https://www.ndit.nd.gov/standards/POL0020208); see the standards wiki stub.
- text: |-
    AI statutes: none found that binds state agencies. 'None found' is stated only for what was read: the 1,740 chapter headings on the Century Code index (https://ndlegis.gov/general-information/north-dakota-century-code/index.html) were searched for artificial intelligence, information, technology, cyber, data, records, electronic, digital, security and privacy, and no chapter is titled for AI; the full text of chapters 54-59, 54-59.1, 54-46, 54-69, 51-30 and 44-04 was searched for 'artificial intelligence' and it appears only in 54-69. Web discovery (not text of record) found the 2025 enactments on AI are HB 1167 (political content disclaimers, amends chapter 16.1-10) and bills on computer-generated sexual images, which bind private persons and are out of scope; a SB 2280 on health care AI was named by one secondary source and was not confirmed or read. State agency AI use is governed by NDIT's Artificial Intelligence Policy (seeded).
- text: |-
    Administrative Code (https://ndlegis.gov/agency-rules/north-dakota-administrative-code/index.html, every title and article heading read): the Information Technology Department has one title, Title 113 (North Dakota Health Information Network, article 113-02, chapter 113-02-01), which is seeded (OWNER DECISION: its participants are health care providers). Left out: Title 110 (Criminal Justice Information Sharing Board, marked Repealed on the index); article 4-05 (Records Management and Central Microfilm, Office of Management and Budget: the file reads 'Superseded by Article 4-06' and the index lists 4-06 as Repealed, so no rule is in force); article 4-09 (State Records Management, marked Repealed); article 4-10 (Forms Management, marked Repealed); article 10-13 (Criminal History Record Information) and article 10-18 (Criminal Justice Data Information Sharing), the Attorney General's law-enforcement data rules, scoped out by domain.yml (law-enforcement technology). The Administrative Code title index is not a watch entry: it is a 1 MB page of every agency's rules, whose changes would be reported as noise.
- text: |-
    Executive orders (https://www.governor.nd.gov/executive-orders, 2024 to date, 27 rows read; https://www.governor.nd.gov/executive-orders/executive-order-archive, 190 rows from 2023 back to 1963, read): seeded is Executive Order 2026-06 (rescinds the TikTok ban of Executive Order 2022-10 and keeps NDIT's cybersecurity enforcement). Executive Order 2022-10 (Burgum bans TikTok from state-owned devices) is not in force: 2026-06 rescinds it in its entirety. Read by title and left out as not about state IT, cybersecurity, data or AI: every other order on the lists (emergency and disaster declarations, hours of service waivers, special sessions, task forces and commissions). Orders whose title concerns IT but which could not be seeded: 2022-03 'Burgum Creates State Geospatial Committee' and 2001-06 'Establishing the Geographical Information Systems Technical Committee' (geospatial committees; the archive rows have no link and the file was not found: three URL patterns guessed for 2022-03 answered HTTP 404; also an OWNER DECISION whether a geospatial committee is within the domain); the Dalrymple orders of 2011-07-06 and 2013-04-10 'Additional Oversight of the Contracting and Implementation Process for Large Scale IT Projects' (archive rows with no link; they pre-date the statutory oversight in chapter 54-59 and their status could not be established, so they are not claimed to be in force; they are a stub candidate if the owner wants them chased); 2014-03-25 'Adds North Dakota Information Technology Department to Fusion Center' and 2012-09-14 'Statewide Interoperability Executive Committee' (law-enforcement and radio communications, scoped out).
- text: |-
    Note: issue #41 says to add north-dakota to `states` in _meta/domain.yml, but domain.yml says it does not list the states (they are the files in _meta/sources/), and a state PR edits no shared file; this branch does not edit it.
