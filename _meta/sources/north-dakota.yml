# North Dakota seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Discovery 2026-11-12 through the toolkit Fetcher: North Dakota Information Technology (ndit.nd.gov: home, IT Governance,
# Principles, Policies, Standards, Guidelines, Statewide IT Planning, IT Procurement, Cybersecurity GRC, and the 66 pages
# the home page's menus link under services, about-us and support), the Legislative Council's Century Code and
# Administrative Code indexes and chapter PDFs (ndlegis.gov), and the Governor's executive order list and archive
# (governor.nd.gov), and OMB's IT Procurement Guidelines page (omb.nd.gov).
