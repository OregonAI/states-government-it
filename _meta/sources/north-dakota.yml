  stub: true
  stub_reason: "The PDF is two page images (pdfimages: 1275 x 1650, 150 ppi) carrying a hidden OCR text layer that is garbled (pdftotext reads 'EXECUTTVE ORDER 2026-06', 'Eost Boulevord', 'lnformation', '2O22'), so the layer cannot be mirrored as the text. The shared two-engine OCR procedure refused it on 2026-11-12: ocrmypdf exit 6, PriorOcrFoundError 'page already has text! - aborting', because the file already has a text layer and the shared reader does not pass --force-ocr or --redo-ocr. Tesseract run by hand on the page image read the heading and the body correctly, so the order becomes a document when src/ingest_ocr.py can OCR a PDF that has a bad text layer (SHARED CHANGE NEEDED, not made here) or the Governor publishes a clean copy. Source: the file the Executive Orders page links."

