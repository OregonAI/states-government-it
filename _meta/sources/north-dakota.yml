- id: nd-ndcc-54-59
  sha256: "aec863f82a7d481c708ac236921170201f4378e5b7cd0ad60eda202f47af96f4"
  url: https://ndlegis.gov/cencode/t54c59.pdf
  format: pdf
  citation: N.D.C.C. chapter 54-59
  title: Chapter 54-59 - Information Technology Department
  doc_type: statute
  jurisdiction: north-dakota
  issuing_body: North Dakota Legislative Assembly
  tags:
  - governance
  - oversight
  - procurement
  - funding
  - cybersecurity
  - data
  - cloud-resilience
  recheck: monthly
  why_relevant: 'The enabling statute for the Information Technology Department and the state chief information officer, as the chapter file prints it. In force: the department''s responsibility for wide area network and statewide technology services (54-59-02), the CIO and the CIO''s duties (54-59-03, 54-59-04), the department''s powers and duties, including advising on and overseeing cybersecurity strategy for executive branch agencies (54-59-05), the business plan (54-59-06), required use of wide area network services (54-59-08), information technology standards (54-59-09), coordinators, plans and project planning (54-59-10, 54-59-11, 54-59-11.1), required use of electronic mail, server and desktop support services (54-59-22, 54-59-22.1), project reports (54-59-23), major project oversight (54-59-32), distributed ledger technologies (54-59-02.2), the health information technology office, loan and grant programs and health information exchange (54-59-26 to 54-59-31), the statewide longitudinal data system (54-59-34, 54-59-36, 54-59-37) and mandatory provision of information (54-59-39). The file prints these sections as repealed, with no text: 54-59-02.1 (prioritization of major projects) and 54-59-07 (State information technology advisory committee), both by S.L. 2023, ch. 481, § 4; 54-59-13 (compliance reviews, S.L. 2003, ch. 665, § 21); 54-59-17 and 54-59-18 (educational technology council, S.L. 2019, ch. 144, § 4); 54-59-21 (criminal justice information sharing board, S.L. 2015, ch. 37, § 15); and 54-59-25 (health information technology advisory committee), 54-59-33, 54-59-35 and 54-59-38 (statewide longitudinal data system committee), all by S.L. 2025, ch. 479, § 39.'

