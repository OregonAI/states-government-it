     - Miscellaneous: 'WVOT Communication Cabling Standards and Specifications 2024-2026' (Drive id 11FN71PZXhikTsEIr3VL_G0ylKw10w5Il; the IT Infrastructure page links the same file under id 1AIayJCwu-yZ5qcngVzKscHslxLcpfVuU), read in full as a text PDF in the first pass: a model Division 27 construction specification for contractors. It opens with blank 'Location:' and 'Scope of Work:' fields and says the owner's professionals shall review and amend it to match specific project requirements, so it is a template, left out for the same reason as the Data Protection Addendum. It was seeded in the first pass and removed after review. OWNER DECISION on whether a model construction specification is an instrument (the same decision as the addendum).
