- text: |-
    Other pages of the Office's site read, and what was left out of them:
     - Cyber Security (technology-services_1/cyber-security), its Audits and Risk Assessment pages: awareness material and guides, not instruments: 'Insider Threat Presentation' (Drive 1GywDQY9kOdQNjFtgrf9C4e7XOcYBIZ9B), 'Social Engineering' and 'The Transparent Network' (sign-in answers), 'Passport to Cybersecurity' (the presentation Drive 1C5yUJHCaPtqO1ngYBs9Ew5btbc8lHDHE that overviews WVOT-PO2002, whose policy is seeded), 'IP23 Handout' (a statewide contract handout, linked on every page), 'Password Standards' (Drive 1Zdb4weegj1zx8cDoCJfnXMF_eABsl-Xh, sign-in answer; it is probably WVOT-PR1017, a stub), and the 'WVOT Risk Assessment Guide' (Drive 13aZGWJQ8ISo1ZqANrYbd9MAiYQQzeCtA, a 15-page guide to completing the 2026 WV CSF assessment: a guide, left out).
     - CIO Review Services: the Privacy Impact Assessment form (Drive 1tmZfWFMY-Q1I3IxYDt7YNItiu7R7B5ZF, a form), the replaced SaaS addendum (above), and a second Drive id for CIO-19-001 (seeded once).
     - Artificial Intelligence page: the AI Task Force agendas and minutes (ten agendas and minutes files, 2024 to 2026: meeting records, not instruments), course lists, and the page's own lists of approved AI software (Google Gemini for Workspace, Microsoft CoPilot Chat, Microsoft CoPilot Studio with CIO review, Grammarly with a full license, Gemini Apps) and prohibited AI software (ChatGPT, DeepSeek, any model that transmits data outside the United States, any model banned under the FCC Secure Networks Act). The page is a Google Sites page with no policy number; it is watched (wv-watch-wvot-ai) but its lists are not mirrored as a document. OWNER DECISION: the lists are directive; WVOT-PO1035 and -PO1034 are the seeded policies.
     - Project Management page: states the oversight criteria; the forms, intake and templates are behind a sign-in extranet (sites.google.com/wv.gov/wvot-extranet).
     - Forms page (8 rows: the 4 above, plus four telecommunications request forms, Data TCR, Voice TCR, VOIP TCR, Telecommunications Backup): forms. 'Approved & Recommended Software', Vendor Resources, WVOT Rates, Service Desk, Training, Central Mail, Printing, Warehouse, State Records Center (forms, retention schedules and the Records Retention and Disposition Guidelines, a 283-page scan; records management is a non-IT chapter of law), Telecom (user guides, forms, billing inquiry), IT Statewide Contracts (statewide contract PDFs and a price list on state.wv.us: contracts, not instruments), About Us (the 2025-2030 Strategic Plan and the 2026 organizational chart: a strategy document and a chart), IT Infrastructure (the cabling file seeded once): not instruments.
- text: |-
    Statutes. Seeded: 32 sections, one entry each, because code.wvlegislature.gov serves one page per section and an article page holds only a contents list (the article page's 'Display all sections' loads the text by script from an internal endpoint, not used; its /pdf/ file prints the fetch date on every page and a watermark through the text, so it was not taken). Seeded: 5A-6-1 to 5A-6-9 except the repealed 5A-6-4a (13), all of 5A-6B (6), all of 5A-6C (4), 39A-3-1 to 39A-3-4 (4), and all of 46A-2A Breach of Security of Consumer Information (5, added after review: section 46A-2A-101(2) defines 'entity' to include governments, governmental subdivisions, agencies or instrumentalities, and 46A-2A-102(a) obliges an individual or entity that owns or licenses computerized data that includes personal information to give breach notice, so it binds state agencies; the enforcement section 46A-2A-104 is an unfair-or-deceptive-act remedy under the consumer chapter that the Attorney General enforces, and the article does not say in terms how it is enforced against an agency; the article sits in the consumer-protection chapter 46A, so OWNER DECISION on keeping it).
     - Left out, repealed (read from the section pages' own text, which the contents lists do not mark): 5A-6-4a ('[Repealed.]' Acts 2019 ch. 123); all of article 5A-6A Permitting and Licensing Information Act (nine sections 'Repealed', Acts 2016 ch. 37); all of article 5A-7 Information Services and Communications Division (sections 1 to 11 and 4a read, each prints '[Repealed]'; the division was merged into the Office of Technology on July 1, 2024, see 5A-6-1); articles 5-1B Chief Technology Officer (eight sections) and 5-1C Science and Technology Council (five sections), contents pages printing 'Repealed' under every section.
     - Left out, non-IT chapter: 5A-8-21 and 5A-8-22 (limits on release of state employees' personal information and personal information maintained by state entities, in the Public Records Management and Preservation Act, 5A-8) and the rest of 5A-8 (records management): Declined under the owner's 2026-11-13 decision (see the next bullet): section-level slicing of non-IT chapters is decided, not pending. 5A-3 (Purchasing Division) and 29B-1 (public records) were not sliced.
     - Owner decision of 2026-11-13 (a provision whose own focus is the governance of state IT is in scope as a section slice) applied to 5A-8-21, 5A-8-22 and 5A-8-24, read in bytes fetched through the Fetcher on 2026-11-13 (code.wvlegislature.gov/5A-8-21/, -22/, -24/, HTTP 200, no repeal marker, each in force). The section pages are one page per section, so no slice is needed; the test is the focus of the provision. Declined, the focus is not IT governance. 5A-8-21 deems a state officer's, employee's or retiree's home address, Social Security number, card numbers, driver's license number and marital status or former name 'confidential and exempt from disclosure, as an unreasonable invasion of privacy, to non-governmental entities in documents otherwise subject to disclosure under the provisions of 29B-1-1 et seq.': an exemption from the public-records right of access for personnel data, with no word on systems, electronic records, security or the IT authority. 5A-8-22 is the same kind of exemption for any individual's Social Security and card numbers held by executive agencies. 5A-8-24 (Daniel's Law) protects the home addresses and telephone numbers of judicial officers, prosecutors, public defenders and law-enforcement officers, binds 'a person, business, or association' as well as agencies, and gives a civil action and a misdemeanor: private-sector and general criminal law about a class of officials, not the governance of state IT. The cited line in WVEB-P101-2 is an authority reference for a privacy policy, which does not change what the sections govern.
     - Left out: 39A-3-5 Severability. 39A-1 (Uniform Electronic Transactions Act) and 39A-2 are private-transaction law.
     - Bills: Senate Bill 694 (2025) and Senate Bill 70 (2026), proposed Data Protection Act articles barring state agencies from foreign-adversary technology including AI, were found only by web search; their status was not confirmed in fetched bytes and unenacted bills are out of scope. No enacted AI statute binding state agencies was found other than 5A-6-9 (the Task Force, ending July 1, 2027). The Office's Cybersecurity expansion of 2026 (a bill the press calls HB 5638) is in 5A-6B as the page prints it today.
- text: |-
    State Privacy Office (Board of Risk and Insurance Management), Executive Branch Privacy Policies (https://brim.wv.gov/privacy/privacy-policies, read 2026-11-12 through the toolkit Fetcher, HTTP 200; the site privacy.wv.gov named in the policies was not used). Reconciliation of the page's links row by row: 21 links (the 'Additional Sample Notices' line has no link of its own). Outcome: 13 documents (from 15 links) and 6 links left out.
     - Documents (13): the memo reaffirming the policies (media 612), 'Privacy Policy Introduction' (file number WVEB-P100), 'Privacy Policy Definitions', WVEB-P101 Accountability, P101.1 Response to Unauthorized Disclosures, P101.2 Execution of Confidentiality Agreements, P101.3 Privacy Impact Assessment Guidance, P102 Consent, P103 Individual Rights, P104 Minimum Necessary and Limited Use, P105 Notice, P106 Security Safeguards and P106.1 Redaction Procedure. The Introduction and Definitions are each linked twice (media 618 and 621, 619 and 622; each pair is byte-identical) and are seeded once. Every file is a PDF with a text layer on every page (checked page by page). The dates the page prints beside rows sit between links and cannot be assigned to rows with certainty (for example 'Issued 1/20/2011' follows both P101.1 and P102); each document's source_version is read from the file's own header line as printed. WVEB-P101.3 prints its number as 'WVEB-101.3' and calls itself an educational resource and best-practices guide; it is held because the page lists it among the policies.
     - Left out, forms, templates and training material (6 links, plus two headings that carry no link of their own): 'Executive Branch Confidentiality Agreement Document' (media 614, the agreement every workforce member signs, a form; its PDF fonts extract as unreadable symbols), 'Executive Branch Short Form Notice' (media 628, a notice template, printed number WVEB-S108), 'Guide to Supporting Individual Rights' (media 629, a staff guide), 'Training Slides' (media 630, 15 slides), 'SPII Flow Chart' (media 631, a one-page chart) and 'Data Use Agreement Template' (media 632, a Word template with drafting notes). The headings 'Additional Sample Notices' and 'Minimum Necessary Training' carry no link.
     - The page says the policies were issued by the Chair of the Health Care Authority and reaffirmed on June 12, 2017 by the Director of the Board of Risk and Insurance Management after Executive Order 3-17 (the memo says the same); Executive Order 3-17 is not in bytes (see the executive order record below). The page says departments may issue their own policies; none were searched. Watched: wv-watch-brim-privacy-policies.
- text: 'Rules. Office of Technology, Title 163, from the Secretary of State''s agency list (https://apps.sos.wv.gov/adlaw/csr/rule.aspx?agency=Office%20of%20Technology): five rule sets Active (163-01 to 163-05), seeded. Left out: two amended versions the list shows ''In Progress'', not in force (163-02, ruleview.aspx?document=18519; 163-03, document=18518), and the Historical 163-03 of 3/2/2022 (document=17459, superseded by the 4/1/2026 rule). 163-01''s only readable file is a scan (the other file is WordPerfect), so it goes through the two-engine OCR procedure. Rules 163-02, -03, -04, -05 are read from the Word file filed with the rule (the 163-03 notice of filing, with its effective and sunset dates, is in the PDF only; the rule''s own section 1 prints them). Other agencies'' rules that touch IT (for example Title 148 Department of Administration, Purchasing) were not searched; the Code of State Rules agency list has no other IT agency.'
- text: 'Executive orders. None seeded. The Governor''s executive order page lists ten orders (Executive Orders 1-25 to 10-25, dated 1/14/2025 to 1/30/2025; titles read: Backyard Brawl, school choice, cessation of DEI, review of spending decisions, plan for more efficient government, plan to reduce rules, religious exemptions for school vaccines, review of outdated executive orders, Department of Revenue and Division of Financial Institutions, implementation of the President''s immigration orders): none on state IT, cybersecurity, data or AI. Executive Order 8-25 (read: the page''s PDF is an image-only scan, read once by tesseract for discovery only, not as text of record) directs the General Counsel to review old orders and does not itself rescind any. The Office of Technology''s policy page says its policies are issued under W. Va. Code 5A-6 ''and the Governor''s Executive Order 6-06 and 3-17''; those two orders (by the page''s text, of 2006 and 2017; web search says 3-17 is Governor Justice''s order giving the Office cyber risk oversight and the Board of Risk and Insurance Management the privacy duties) were NOT found in bytes: the Secretary of State''s Executive Journal (apps.sos.wv.gov/adlaw/executivejournal/searchexecutiveorders.aspx) is a form that needs a POST, which the Fetcher does not send, and the Governor''s page lists only the current governor''s orders. Measured state: no official bytes of either order were obtained, so existence, text, in-force status and IT-governance focus are unconfirmed (the policy page''s own word that they stand is not confirmation); the owner is asked for Executive Journal document addresses (readpdf.aspx?DocID=...). Both are probably image scans (Executive Order 8-25 is), so each would need ocr: true. UPDATE 2026-11-13 (owner decision: a provision whose focus is the governance of state IT is in scope; the authority-reference pass named Executive Orders 6-06, 3-17 and 7-03 as candidates, 7-03 from the citing policies, of March 25, 2003, never in bytes). Re-measured through the Fetcher: apps.sos.wv.gov/adlaw/executivejournal/ and searchexecutiveorders.aspx answer HTTP 200 and the only way to a document is the search form (method POST, action ./searchexecutiveorders.aspx), with no link a visitor follows to any order; sos.wv.gov/admin-law/Pages/ExeOP.aspx answers HTTP 404. No official bytes of 6-06, 7-03 or 3-17 were obtained, so existence, text, in-force status (the policies say 6-06 and 3-17 still stand; whether 3-17 changed 6-06 and whether 7-03 is superseded is unread) and IT-governance focus are unconfirmed, and none is seeded or stubbed. Still waiting for Executive Journal document addresses (readpdf.aspx?DocID=...) from the owner; each is likely an image scan needing ocr: true.'
- text: |-
    Mechanics and risks recorded for the reviewer:
     - Fetch forms: Drive files by drive.google.com/uc?export=download&id=<id> (the form Colorado's seed uses; the id is the one in the index's /view link), Google Docs by docs.google.com/document/d/<id>/export?format=docx (a documented export link of the document the index links; the URL is built from the pattern, the title and number were confirmed in the fetched bytes). Drive re-renders its PDFs on each download (Colorado recorded the same): the byte hash may change while the text does not.
     - The newer WVOT policy PDFs carry a zero-width space (U+200B) around runs of text; it is kept as extracted, and the ingester's identity and version checks look through it.
     - Drift: the toolkit hashes an html page's text. The Code's section pages print a page-generation time in a hidden element (id='duration', for example 0.37599992752075 then 0.29164218902588 on two fetches a few minutes apart) and the Secretary of State's rule list prints the current time; each would report a change on every drift run. The Google Sites and governor pages were byte-text stable across two fetches. Needed shared change: corpus.yml volatile_patterns for those two elements (see the PR).
     - The seed list was not drift-run (not allowed in this run).
