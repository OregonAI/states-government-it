left_out:
- text: |-
    ---- South Carolina: found and left out (each was seen on an official page on 2026-11-12 and read through the Fetcher unless the line says otherwise; the reason is recorded here)
- text: |-
    Governance and Resources page (https://www.admin.sc.gov/services/technology-services/governance-resources), the Department of Administration's statewide IT policy and standards library, reconciled row by row: 26 rows (25 links and the SCDIS-210 row, which has no link). 11 are seeded as documents, 1 is a stub (SCDIS-200, an Excel workbook), 14 are left out:
     - 'IT Governance' (Information_Technology_Governence.pdf, 12 pages, a PowerPoint export made 2023-06-13; the file prints the title 'IT Shared Services Strategic Governance'): the library lists it under Governance, but the file prints 'CONFIDENTIAL DRAFT – for discussion purposes' as the footer of two of its slides (the Agency Work Group and Technology Work Group charter slides), and a draft is not in force. It was first seeded and is now left out. OWNER DECISION: the owner may want it as the Department's published governance framework despite the footer; the sibling 'IT Shared Services Governance Overview', which carries no draft marker, is seeded.
     - 'IT Shared Services Overview' (4 pages): an explanatory summary of the shared services effort (it cites Executive Order 2016-07 and Proviso 117.121) that states no requirement of its own. OWNER DECISION: the sibling 'IT Shared Services Governance Overview' is seeded because it establishes the governance groups and priority criteria; the owner may prefer both, or neither.
     - Strategies group: 'State Cloud Computing Strategy' (2018), 'Statewide Strategic Information Technology Plan' (the 2022 plan, marked Current by the page) and the 2018-2020 and 2016-2018 plans: strategy and planning documents, not instruments. The 2022 plan is the plan section 1-11-10 and Executive Order 2022-03 refer to.
     - 'SCDIS-210 Information Security Technology Standards (V2.0)': the page prints it with no link and says the standards are undergoing realignment, with initial publication targeted for July 1, 2026; no current document is published. The 2015 draft 'SCDIS-210 Information Security Technology Coverage Measurement Standards' (version 1.1 draft 5, effective 01-Jul-2017) is still served (found by web search, fetched 2026-11-12) but no page read links it and the Department says the standard is being replaced, so it is not seeded.
     - 'Template Data Inventory Tool': a workbook guidance and template for the data inventory (12 pages); a template.
     - 'Data Classification Auditing and Monitoring Plan Template' (version 1.5, May 1, 2014): a template.
     - 'Privacy Threshold Analysis/Privacy Impact Assessment Guidance and Template' (Enterprise Privacy Office, February 2016, 33 pages): guidance that carries the blank assessment template. OWNER DECISION: it may be wanted as guidance; it is left out as a template.
     - 'Training Presentation for use with PTA/PIA Guidance and Template': a training deck.
     - 'Cisco Secure Client Deployment Instructions' (5 pages): a technical how-to for one product, not an instrument.
     - 'Sample Language and Clauses for Acceptable Use Acknowledgements' (3 pages): sample clauses the file says are not to be used as is; a template.
     - 'Interconnection Security Agreement (ISA) (Template)': a blank agreement.
- text: |-
    Files the Department serves that no page read links (found by web search for discovery only; each fetched through the Fetcher on 2026-11-12 and answering 200; the Governance and Resources page, re-read the same day, lists none of them and none is linked from a page read). Not seeded; OWNER DECISION on each, with the status reason below:
     - 'SCDIS-201 Information Security and Privacy Incident Response Standards' (SCDIS-201_Information_Security_and_Privacy_Incident_Response_Standards.pdf; prints Version 1.0, Issued October 7, 2016, Effective July 1, 2016): it cites the 'SCDIS Information Security Program Master Policy' (now retitled the Statewide Information Security Program Policy) and SCDIS-200, and no index lists it.
     - The 'DIS - Information Security Policy' series of the Division of Information Security, all in the /Documents/PMOOTIS/ folder: Information_Security_Policy_Handbook.pdf (19 pages, Word 2010, 'Information Security Policy Handbook', revision history 1.0 22-Oct-2014 and 1.1 03-Nov-2014); Information_Security_Policy_Data_Protection_and_Privacy.pdf (13 pages, 'v1.0 - October 30, 2013', final version February 10, 2014; the seeded Data Handling Guidelines cite 'Data Protection and Privacy v1.0, effective October 30, 2013' as their basis); Information_Security_Policy-Handbook_Appendices.pdf (81 pages, version 1.0 22-Oct-2014, sample charts and plans); IT_Risk_Strategy_Policy.pdf (10 pages, cover 'V0.1 - April 21, 2014' although its revision table says 1.0); Risk_Management_Policy.pdf (11 pages, 'v1.0 - October 15, 2013', final version February 10, 2014); Mobile_Security_Policy.pdf (11 pages, 'v1.0 - October 30, 2013', final version February 10, 2014).
     - Status reason, OWNER DECISION: the 2013-2015 series is apparently replaced by the Statewide Information Security Program Policy (version 2.0, January 1, 2026, whose revision history begins with the 2014 'Initial draft' and says the title changed from 'Information Security Program Master Policy'), SCDIS-200 and the agencies' own policies built on it, and the current library page lists none of them; but none of the files says it is rescinded or superseded, and SCDIS-201 may still be the incident response standard in force. They are left out as not shown to be in force; the owner may want SCDIS-201 and the Data Protection and Privacy policy added.
- text: |-
    Other technology pages read: Information Security and Privacy, Enterprise Privacy Office FAQs, Incident Response (a process description with the Security Operations Center's contact details) and Forms and Forums publish no instrument (IT Forums lists professional associations). Shared Services Forms lists eight request forms (IT-3000A, B, C, D, G, H, J and M, including the TikTok Whitelist Request): forms. The IT Shared Services page and Cloud Services page link the IT Shared Services Catalog (a service catalog), the Cloud Services Welcome Packet and the Agency Relationship Management assignments list: not instruments. IT Planning, IT Data Collection, Data Analytics and Agency Relationship Management describe programs and link the IT data collection system (gateway.sc.gov) and proviso text on the General Assembly's site.
- text: |-
    Artificial intelligence: the AI Center of Excellence page links 'South Carolina State Agencies Artificial Intelligence Strategy' (June 2024, 18 pages; fetched 2026-11-12): a strategy document, not an instrument; left out. The page states the AI Center of Excellence was established in 2025 by the Department and that Proviso 117.194 (GP: AI Appropriations) requires agencies and institutions funded for AI to coordinate their AI efforts and budget requests with it. No statute on state-agency AI use was found: the chapter titles of all 63 title pages of the Code of Laws (1,311 chapter rows, read again on 2026-11-12) were scanned for these keywords, as substrings: information, technology, data, computer, cyber, privacy, artificial, digital, internet, procurement, enterprise, security, identity, record, electronic, telecommunication, software, network. 46 rows matched; none names artificial intelligence, and Title 1 chapter 11 prints no 'artificial' or 'cyber'. The rows that matched are seeded or recorded below, or are matches of the keyword with another meaning (social security, deed and real-property recording, canvass records, enterprise zones, insurance and medical records and the like) or are judged from their titles as not binding state agencies on IT: Title 7 ch. 17, Title 8 ch. 9 and ch. 30 (repealed), Title 9 ch. 3 and ch. 5, Title 11 ch. 56, Title 12 ch. 10 and ch. 24, Title 17 ch. 30 (interception of communications, criminal), Title 19 ch. 5 (public documents as evidence), Title 30 ch. 5, 6, 7, 11, 13 and 15 (recording and recordation; ch. 6 is the Uniform Real Property Electronic Recording Act, which governs county recording offices), Title 33 ch. 16, Title 35 ch. 6, Title 37 ch. 21, Title 38 ch. 13, 93 and 97, Title 39 ch. 54 and 77, Title 40 ch. 18, Title 42 ch. 19, Title 44 ch. 40 and 115, Title 54 ch. 17, Title 56 ch. 10, Title 58 ch. 42, Title 59 ch. 105 and 116, Title 60 ch. 4 (confidential library records, titles only, not fetched). The page is a watch entry.
- text: |-
    Appropriations provisos (OWNER DECISION 2026-11-13, superseding the earlier reason that budget law is left out pending section-level slicing): the Department's instruments cite their authority as provisos of the annual General Appropriations Act, which are not in the Code of Laws. The owner approved a provision that is not itself about IT, as a section slice, when its own focus is the governance of state IT. Read on 2026-11-13 through the Fetcher: the General Assembly's page for H. 5126, the FY 2026-27 Act (https://www.scstatehouse.gov/sess126_2025-2026/appropriations2026/gab5126.php, 'As Ratified by the General Assembly on August 11, 2026. Governor's vetoes are marked'), its index of the ratified version, Part IB (the provisos, tap1b.pdf, 325 pages) and the Governor's veto message of August 17, 2026 (gmbvto26.pdf, an image-only PDF, read by OCR for this check: fourteen numbered vetoes (line items of Part IA and provisos of Part IB, among them 92D.6 paragraph B, which cites Proviso 117.194, and 117.207, 117.226 and 118.18); none is a proviso seeded here). Approved and verified, NOT seeded (shared code blocks it): 93.9 (DOA: Cyber Security), 117.96 (GP: Data Breach Notification), 117.106 (GP: Statewide Strategic Information Technology Plan Implementation), 117.194 (GP: AI Appropriations) and 117.120 (GP: Mobile Device Protection Plan, the current form of the proviso SWM-300 cites as 117.148 of the FY 2018-19 Act). Each governs state IT on its own words, is unvetoed and prints no later effective date, and the state module cuts each from Part IB as a slice (tested on real pages of the PDF). The seed check accepts the entries, but tests/test_authority_refs.py fails the gate for any held statute whose citation src/authority_forms.py cannot parse, and that file has no form for an Appropriations Act proviso (the S.C. Code form needs 'S.C. Code' and a title-chapter-section number, and the Act is not in the Code), so a held proviso is reported as 'unparsed'. The fix is in the shared file: add the five ids to FORMS['south-carolina'].uncitable (as Maine, Utah and Washington do for an order or session law cited otherwise than by a form), or a form for provisos. The five entries are ready in docs/research/south-carolina-provisos.md. A proviso is temporary law for the fiscal year (FY 2026-27, to June 30, 2027) and the entry will need re-seeding from the next Act each year; the text is the Act as ratified, which the veto message shows is the law for every proviso seeded. Declined: the Statewide Information Security Program Policy names 'Provisos 93.9, 117.96, 117.102 and 117.107 of the 2025 General Appropriations Act'; those are FY 2025-26 numbers, a temporary Act that expired June 30, 2026 and was not read, and in the FY 2026-27 Act 117.102 is 'GP: SCOIS Transfer' (the Occupational Information System) and 117.107 is 'GP: Sentencing Reform Oversight Committee Reauthorization', neither IT governance, so nothing is seeded under those numbers. The shared services overview's Proviso 117.121 (a 2016 Act number) is 'GP: Board Meeting Coverage' in the FY 2026-27 Act (its subject, shared IT services, is in 117.106), and the Data Collection page's Proviso 117.71 (2018 version) is 'GP: Reduction In Force' in this Act: not seeded. Approved and verified like the five above (read 2026-11-13 in Part IB, tap1b.pdf, through the Fetcher; also NOT seeded, blocked by the same shared file): 117.101 'GP: Information Technology and Information Security Plans' ('all state agencies must submit an information technology plan and an information security plan to the Department of Administration' by August first), 117.95 'GP: Technology and Remediation' (funds for the Division of Information Security 'to develop and implement a statewide information security program'), 117.117 'GP: SCEIS Data Entry Compliance' (the Department 'shall develop and issue written SCEIS data entry standards and guidelines for agency compliance', which agencies must follow) and 117.209 'GP: Statewide Data Initiative' (the Department operates a Statewide Data Initiative and agencies must keep a data inventory, follow its 'data creation, security, and privacy' standards and enter into data sharing agreements); see docs/research/south-carolina-provisos.md. Declined: 117.73 'GP: Information Technology for Health Care' (one agency's health information exchange, not a governance rule for state IT) and 117.27 'GP: School Technology Initiative' (K-12, scoped out by domain.yml).
- text: |-
    Executive orders: the Governor's list (https://governor.sc.gov/executive-branch/executive-orders) was read in full: 443 orders, numbered 2017-04 to 2026-25 (Governor McMaster's; earlier administrations' orders are in the State Library's digital collection, which the page links: see Executive Order 2016-07 below). Where the index prints no title the file name was read. Two are seeded (2017-08 and 2022-03). Left out: 2022-27 'Formalizing New Statewide Cybersecurity Initiative' (the filed copy's file name reads 'Formalizing S.C. Cybersecurity Ecosystem Coordination Initiative'): it directs the Department of Commerce to coordinate a statewide cyber industry, workforce and economic development initiative with private and academic partners, and agencies to assist; OWNER DECISION, it is cybersecurity but not IT as a government function, so it is left out and may be wanted. 2025-31 'Adoption of Updated Telecommuting & Remote Work Policies & Procedures' (a human resources policy for state employees, not IT). 2019-21 'FOIA Compliance' (access to public records). 2018-59 'Transfer of Disaster Recovery to the Department of Administration' (read: it moves the disaster-recovery housing grant office, not IT). The other 437 rows are states of emergency, flags, appointments, suspensions, leave with pay, transportation waivers, elections and similar; no title or file name among them names information technology, data, cybersecurity or AI. Executive Order 2016-07 (January 2016, requiring cabinet agencies to use IT shared services) is named in the IT Shared Services Overview and is outside the Governor's list; it may still be in force and is not readable at an official source in this run. Measured 2026-11-12: the State Library's collection page the Governor's page links (https://dc.statelibrary.sc.gov/handle/10827/22) answers the Fetcher with 200 and an 827-byte page that is only a script shell ('<ds-app></ds-app>', title DSpace); the list of orders is drawn by script from the site's internal REST API, which the rules forbid calling, so no order can be read or even listed from it. OWNER DECISION: whether to add EO 2016-07 once a readable official copy is found (the owner may have one); Executive Order 2022-03 carries the shared services directive forward, which may make 2016-07 superseded in part. No rescission of 2017-08 or 2022-03 appears in the list.
- text: |-
    Statutes: the Code of Laws title pages (all 63) were read for chapter titles. Three chapters are seeded (Title 1 chapter 11, Title 11 chapter 53, Title 30 chapter 2). Title 11 chapter 35, 'South Carolina Consolidated Procurement Code' (fetched through the Fetcher on 2026-11-13, 376,930 bytes; a procurement code that holds the State's IT procurement provisions among many others; it was left out pending an owner decision on section-level slicing, which the owner made on 2026-11-13: seeded as one section slice, SECTION 11-35-820, 'Creation of Information Technology Management Office', the only section whose own subject is IT; SECTION 11-35-1580, 'Information technology procurements', is printed as repealed by 2019 Act No. 41, eff May 13, 2019, so it is not in force; the definitions in 11-35-310, the Board's exemption and regulation powers and the other sections that list information technology among supplies, services and construction apply to IT along with everything else and are not taken). Left out: Title 16 chapter 16, 'Computer Crime Act' (criminal law, scoped out by domain.yml; judged from its title). Title 30 chapter 4, 'Freedom of Information Act' (access to public records, not IT). Title 37 chapter 20 'Consumer Identity Theft Protection', Title 38 chapter 99 'Insurance Data Security Act' and Title 44 chapter 117 'Prescription Information Privacy Act' (judged from their titles as binding private persons or regulated industries, not state agencies; not fetched). The chapters below were fetched through the Fetcher on 2026-11-12 (200) and read:
     - Title 26 chapter 6, 'Uniform Electronic Transactions Act' (t26c006.php): most of the chapter governs private transactions, but three sections bind government agencies on IT and data: SECTION 26-6-170 'Creation and retention of electronic records by government agencies' ('Each governmental agency of this State shall determine if, and the extent to which, it will create and retain electronic records and convert written records to electronic records'), SECTION 26-6-180 'Government agencies sending and accepting electronic records and signatures; format' (each agency decides whether to send, accept and rely on electronic records and signatures and, in consultation with the Department of Administration and giving due consideration to security, may specify their format, signature type and the control processes for preservation, integrity, security and auditability) and SECTION 26-6-195 'Service of process to e-mail address by government agency' (an agency may serve process by e-mail under Department of Administration policies and procedures). SECTION 26-6-190 'Development of standards and procedures; service of process' also directs the Department to adopt standards for the use of electronic records, electronic signatures and security procedures by public entities. OWNER DECISION 2026-11-13 (superseding the earlier reason that sections of non-IT chapters are left out pending a decision on section-level slicing): the four sections are addressed to state agencies and govern their electronic records, signatures, standards and e-mail service, so they are seeded as one slice, 26-6-170 to 26-6-195 (the chapter's other sections, which govern private transactions, are not taken; 26-6-210, the Computer Crime Act cross-reference, is not part of it). Re-read from the Fetcher bytes of 2026-11-13: the page prints no repeal or later effective date for them.
     - Title 30 chapter 1, 'Public Records, Reports and Official Documents' (t30c001.php): the chapter is records law, not IT, and is not taken whole. OWNER DECISION 2026-11-13: SECTION 30-1-90 is seeded as a one-section slice (id sc-code-30-sec-1-90) because its subsection (D) governs electronic records: no record of long-term value, 'including those filed, kept, or stored electronically, or those records converted from paper to magnetic, optical, film, or other media', may be disposed of or erased without an approved records schedule. SECTION 30-1-80 'Records management program' (the Archives establishes a program for the creation, utilization, maintenance, retention, preservation and disposal of public records, paper included) is left out: its own focus is general records management, it never mentions electronic records, information technology or data systems, and a provision that merely applies to IT along with everything else is not approved. It was first seeded together with 30-1-90 and removed on review. The other sections of the chapter (30-1-10 to 30-1-70 on custodians, removal, penalties and protection of records, and 30-1-100 to 30-1-180 on the Archives' further powers, microfilming and loose-leaf books) are not taken; 30-1-100(A) and 30-1-120 mention electronic and optical disc systems and microfilm only inside the Archives' own preservation programs.
     - Title 26 chapter 2, 'Electronic Notaries Public' (t26c002.php): binds notaries public, electronic notary solution providers and the Secretary of State's registration of them (SECTION 26-2-20, 26-2-80, 26-2-120), not state agencies as IT users; left out.
     - Title 48 chapter 60, 'South Carolina Manufacturer Responsibility and Consumer Convenience Information Technology Equipment Collection and Recovery Act' (t48c060.php): binds computer and television manufacturers, retailers, collectors and recoverers, with the participation and liability of counties and municipalities (SECTION 48-60-57, 48-60-62); electronic-waste recycling, not state IT management; most of it is repealed December 31, 2029 by 2022 Act No. 234, per the page's editor's note; left out.
     Section 1-11-490, which binds agencies on breaches, is inside the seeded chapter.
- text: |-
    Rules: the Code of Regulations master page (current through State Register Volume 50, Issue 3, effective March 27, 2026) was read for its chapter list: it has no chapter for the Department of Administration or for an IT agency. Chapter 19, 'State Budget and Control Board' (the Department's predecessor), was read whole as its PDF (231 pages; the chapter's HTML page answered 404, so the PDF is the only copy the Fetcher could get), and is left out: Article 2, 'Information Resource Management', holds standards for 9-1-1 (Subarticle 1) and the South Carolina 211 Network certification (Subarticle 2), which domain.yml scopes out as telecom and 911 or which are not IT; the rest is travel, general services, human resources, retirement, hospital data reporting and the procurement regulations of 19-445, among them 19-445.2115 'Information Technology Procurements' (software licensing under Section 11-35-510) and 19-445.2027 'Electronic Commerce', which are procurement sections of a mixed chapter. OWNER DECISION 2026-11-13 (superseding the earlier reason that section-level slicing is not decided): the two IT procurement regulations are seeded as slices of the chapter PDF, 19-445.2027 'Electronic Commerce' and 19-445.2115 'Information Technology Procurements' (re-read in the PDF fetched 2026-11-13 through the Fetcher: 652,242 bytes, 231 pages, metadata dated July 22, 2025; the General Assembly's master page states the files are current through State Register Volume 50, Issue 3, effective March 27, 2026, and each regulation's HISTORY line prints an effective date in 2020 and no later amendment). Other IT-related text in 19-445 is not taken: the other regulations mention information technology only among supplies, services and construction.
