    Other technology pages read: Information Security and Privacy, Enterprise Privacy Office FAQs, Incident Response (a process description with the Security Operations Center's contact details) and Forms and Forums publish no instrument (IT Forums lists professional associations). Shared Services Forms lists eight request forms (IT-3000A, B, C, D, G, H, J and M, including the TikTok Whitelist Request): forms. The IT Shared Services page and Cloud Services page link the IT Shared Services Catalog (a service catalog), the Cloud Services Welcome Packet and the Agency Relationship Management assignments list: not instruments. IT Planning, IT Data Collection, Data Analytics and Agency Relationship Management describe programs and link the IT data collection system (gateway.sc.gov) and proviso text on the General Assembly's site.
