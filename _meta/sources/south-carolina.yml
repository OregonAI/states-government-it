    Artificial intelligence: the AI Center of Excellence page links 'South Carolina State Agencies Artificial Intelligence Strategy' (June 2024, 18 pages; fetched 2026-11-12): a strategy document, not an instrument; left out. The page states the AI Center of Excellence was established in 2025 by the Department and that Proviso 117.194 (GP: AI Appropriations) requires agencies and institutions funded for AI to coordinate their AI efforts and budget requests with it. No statute on state-agency AI use was found: the chapter titles of all 63 title pages of the Code of Laws (1,311 chapter rows, read again on 2026-11-12) were scanned for these keywords, as substrings: information, technology, data, computer, cyber, privacy, artificial, digital, internet, procurement, enterprise, security, identity, record, electronic, telecommunication, software, network. 46 rows matched; none names artificial intelligence, and Title 1 chapter 11 prints no 'artificial' or 'cyber'. The rows that matched are seeded or recorded below, or are matches of the keyword with another meaning (social security, deed and real-property recording, canvass records, enterprise zones, insurance and medical records and the like) or are judged from their titles as not binding state agencies on IT: Title 7 ch. 17, Title 8 ch. 9 and ch. 30 (repealed), Title 9 ch. 3 and ch. 5, Title 11 ch. 56, Title 12 ch. 10 and ch. 24, Title 17 ch. 30 (interception of communications, criminal), Title 19 ch. 5 (public documents as evidence), Title 30 ch. 5, 6, 7, 11, 13 and 15 (recording and recordation; ch. 6 is the Uniform Real Property Electronic Recording Act, which governs county recording offices), Title 33 ch. 16, Title 35 ch. 6, Title 37 ch. 21, Title 38 ch. 13, 93 and 97, Title 39 ch. 54 and 77, Title 40 ch. 18, Title 42 ch. 19, Title 44 ch. 40 and 115, Title 54 ch. 17, Title 56 ch. 10, Title 58 ch. 42, Title 59 ch. 105 and 116, Title 60 ch. 4 (confidential library records, titles only, not fetched). The page is a watch entry.
