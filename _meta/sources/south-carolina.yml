left_out:
- text: |-
    ---- South Carolina: found and left out (each was seen on an official page on 2026-11-12 and read through the Fetcher unless the line says otherwise; the reason is recorded here)
- text: |-
    Governance and Resources page (https://www.admin.sc.gov/services/technology-services/governance-resources), the Department of Administration's statewide IT policy and standards library, reconciled row by row: 26 rows (25 links and the SCDIS-210 row, which has no link). 11 are seeded as documents, 1 is a stub (SCDIS-200, an Excel workbook), 14 are left out:
     - 'IT Governance' (Information_Technology_Governence.pdf, 12 pages, a PowerPoint export made 2023-06-13; the file prints the title 'IT Shared Services Strategic Governance'): the library lists it under Governance, but the file prints 'CONFIDENTIAL DRAFT – for discussion purposes' as the footer of two of its slides (the Agency Work Group and Technology Work Group charter slides), and a draft is not in force. It was first seeded and is now left out. OWNER DECISION: the owner may want it as the Department's published governance framework despite the footer; the sibling 'IT Shared Services Governance Overview', which carries no draft marker, is seeded.
     - 'IT Shared Services Overview' (4 pages): an explanatory summary of the shared services effort (it cites Executive Order 2016-07 and Proviso 117.121) that states no requirement of its own. OWNER DECISION: the sibling 'IT Shared Services Governance Overview' is seeded because it establishes the governance groups and priority criteria; the owner may prefer both, or neither.
     - Strategies group: 'State Cloud Computing Strategy' (2018), 'Statewide Strategic Information Technology Plan' (the 2022 plan, marked Current by the page) and the 2018-2020 and 2016-2018 plans: strategy and planning documents, not instruments. The 2022 plan is the plan section 1-11-10 and Executive Order 2022-03 refer to.
     - 'SCDIS-210 Information Security Technology Standards (V2.0)': the page prints it with no link and says the standards are undergoing realignment, with initial publication targeted for July 1, 2026; no current document is published. The 2015 draft 'SCDIS-210 Information Security Technology Coverage Measurement Standards' (version 1.1 draft 5, effective 01-Jul-2017) is still served (found by web search, fetched 2026-11-12) but no page read links it and the Department says the standard is being replaced, so it is not seeded.
     - 'Template Data Inventory Tool': a workbook guidance and template for the data inventory (12 pages); a template.
     - 'Data Classification Auditing and Monitoring Plan Template' (version 1.5, May 1, 2014): a template.
     - 'Privacy Threshold Analysis/Privacy Impact Assessment Guidance and Template' (Enterprise Privacy Office, February 2016, 33 pages): guidance that carries the blank assessment template. OWNER DECISION: it may be wanted as guidance; it is left out as a template.
     - 'Training Presentation for use with PTA/PIA Guidance and Template': a training deck.
     - 'Cisco Secure Client Deployment Instructions' (5 pages): a technical how-to for one product, not an instrument.
     - 'Sample Language and Clauses for Acceptable Use Acknowledgements' (3 pages): sample clauses the file says are not to be used as is; a template.
     - 'Interconnection Security Agreement (ISA) (Template)': a blank agreement.
- text: |-
    Files the Department serves that no page read links (found by web search for discovery only; each fetched through the Fetcher on 2026-11-12 and answering 200; the Governance and Resources page, re-read the same day, lists none of them and none is linked from a page read). Not seeded; OWNER DECISION on each, with the status reason below:
     - 'SCDIS-201 Information Security and Privacy Incident Response Standards' (SCDIS-201_Information_Security_and_Privacy_Incident_Response_Standards.pdf; prints Version 1.0, Issued October 7, 2016, Effective July 1, 2016): it cites the 'SCDIS Information Security Program Master Policy' (now retitled the Statewide Information Security Program Policy) and SCDIS-200, and no index lists it.
     - The 'DIS - Information Security Policy' series of the Division of Information Security, all in the /Documents/PMOOTIS/ folder: Information_Security_Policy_Handbook.pdf (19 pages, Word 2010, 'Information Security Policy Handbook', revision history 1.0 22-Oct-2014 and 1.1 03-Nov-2014); Information_Security_Policy_Data_Protection_and_Privacy.pdf (13 pages, 'v1.0 - October 30, 2013', final version February 10, 2014; the seeded Data Handling Guidelines cite 'Data Protection and Privacy v1.0, effective October 30, 2013' as their basis); Information_Security_Policy-Handbook_Appendices.pdf (81 pages, version 1.0 22-Oct-2014, sample charts and plans); IT_Risk_Strategy_Policy.pdf (10 pages, cover 'V0.1 - April 21, 2014' although its revision table says 1.0); Risk_Management_Policy.pdf (11 pages, 'v1.0 - October 15, 2013', final version February 10, 2014); Mobile_Security_Policy.pdf (11 pages, 'v1.0 - October 30, 2013', final version February 10, 2014).
     - Status reason, OWNER DECISION: the 2013-2015 series is apparently replaced by the Statewide Information Security Program Policy (version 2.0, January 1, 2026, whose revision history begins with the 2014 'Initial draft' and says the title changed from 'Information Security Program Master Policy'), SCDIS-200 and the agencies' own policies built on it, and the current library page lists none of them; but none of the files says it is rescinded or superseded, and SCDIS-201 may still be the incident response standard in force. They are left out as not shown to be in force; the owner may want SCDIS-201 and the Data Protection and Privacy policy added.
