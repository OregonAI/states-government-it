    Rules: the Code of Regulations master page (current through State Register Volume 50, Issue 3, effective March 27, 2026) was read for its chapter list: it has no chapter for the Department of Administration or for an IT agency. Chapter 19, 'State Budget and Control Board' (the Department's predecessor), was read whole as its PDF (231 pages; the chapter's HTML page answered 404, so the PDF is the only copy the Fetcher could get), and is left out: Article 2, 'Information Resource Management', holds standards for 9-1-1 (Subarticle 1) and the South Carolina 211 Network certification (Subarticle 2), which domain.yml scopes out as telecom and 911 or which are not IT; the rest is travel, general services, human resources, retirement, hospital data reporting and the procurement regulations of 19-445, among them 19-445.2115 'Information Technology Procurements' (software licensing under Section 11-35-510) and 19-445.2027 'Electronic Commerce', which are procurement sections of a mixed chapter. OWNER DECISION: section-level slicing of 19-445 would add the two IT procurement regulations.
