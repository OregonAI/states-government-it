# South Carolina seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Discovery 2026-11-12 through the toolkit Fetcher: the General Assembly's Code of Laws (the master page, all 63 title pages
# and the chapter pages named below) and Code of Regulations (master page and chapter 19), the Department of Administration's
# technology pages (Governance and Resources, Information Security and Privacy, AI Center of Excellence, Forms and Forums,
# IT Shared Services, IT Planning, Data Analytics, Agency Relationship Management, Cloud Services and the others the
# technology menu lists) and every file the Governance and Resources page links, and the Governor's executive order list.
sources:

- id: "sc-code-1-ch-11"
  sha256: "12c642417fc7afe5a517eb0831beaff7b961c10baab6c998bae6b6b9a231dfe3"
  url: "https://www.scstatehouse.gov/code/t01c011.php"
  format: "html"
  citation: "S.C. Code Title 1, Chapter 11"
  title: "Code of Laws, Title 1, Chapter 11. Department of Administration"
  doc_type: "statute"
  jurisdiction: "south-carolina"
  issuing_body: "South Carolina General Assembly (Legislative Council)"
  tags: [governance, oversight, cybersecurity, data, cloud-resilience]
  recheck: "monthly"
  why_relevant: "The Department of Administration's chapter, and the enabling statute for the State's central IT function. Section 1-11-10 creates the Department and transfers to it the Division of State Information Technology (including the Data Center, Telecommunications and Information Technology Services, the South Carolina Enterprise Information System and the Division of Information Security), and requires the Division to submit the Statewide Strategic Information Technology Plan to the Director biennially; section 1-11-190 lists the Department's responsibilities for assessing, evaluating and inventorying information technology and developing policies and standards for its management; section 1-11-430 covers the supply and use of telecommunication systems for state government; section 1-11-435 asks the Office of the State CIO for a Critical Information Technology Infrastructure Protection Plan and directs agencies and political subdivisions to assist; section 1-11-490 requires a state agency to notify residents of a breach of the security of agency-held personal identifying information. The page prints the whole chapter, and most of it is outside this corpus's scope and rides along: real property leasing and easements, fleet management, insurance and the Insurance Reserve Fund, the state ceiling on private activity bonds (Article 3), employee and retiree insurance (Article 5), the 211 network and other sections. Sections printed as repealed keep their line. OWNER DECISION, recorded for review: the chapter is taken whole because the playbook allows it for an enabling statute and section-level slicing is not decided; the owner may prefer slicing it to the sections above."

- id: "sc-code-11-ch-53"
  sha256: "28196c18bdf49f062b9222a9cfad7a2fe6a03dcab1fcdd8d14d17197220e1a09"
  url: "https://www.scstatehouse.gov/code/t11c053.php"
  format: "html"
  citation: "S.C. Code Title 11, Chapter 53"
  title: "Code of Laws, Title 11, Chapter 53. South Carolina Enterprise Information System"
  doc_type: "statute"
  jurisdiction: "south-carolina"
  issuing_body: "South Carolina General Assembly (Legislative Council)"
  tags: [governance, funding, oversight]
  recheck: "monthly"
  why_relevant: "The statute that mandates the South Carolina Enterprise Information System (SCEIS), the state's shared enterprise resource system, for all agencies except lump-sum agencies and the legislative branch: agency special accounts for implementation costs, the SCEIS Oversight Committee, the implementation schedule and its reporting, and the State Office of Human Resources' authority to adapt human resource processes to the system."

- id: "sc-code-30-ch-2"
  sha256: "5bb36add33815ba91f0b84e0ea9820e49936289897564cb6ba7a5505f3be441b"
  url: "https://www.scstatehouse.gov/code/t30c002.php"
  format: "html"
  citation: "S.C. Code Title 30, Chapter 2"
  title: "Code of Laws, Title 30, Chapter 2. Family and Personal Identifying Information Privacy Protection"
  doc_type: "statute"
  jurisdiction: "south-carolina"
  issuing_body: "South Carolina General Assembly (Legislative Council)"
  tags: [data, cybersecurity, digital-services]
  recheck: "monthly"
  why_relevant: "The privacy statute that binds public bodies. Article 1, the Family Privacy Protection Act of 2002, requires every state agency, board, commission, institution and department to develop privacy policies and procedures limiting collection of personal information, and governs the posting of the privacy policy on web sites and the release of personal information. Article 3 limits the collection, use and disclosure of social security numbers by public bodies and, in section 30-2-310, requires the secure disposition of records and of information technology hardware or storage media (the Department of Administration's SCDIS-501 procedure is issued under it). The page prints the whole chapter, so Article 5 (the Law Enforcement Personal Privacy Protection Act) and Article 7 (the Judicial Personal Privacy Protection Act), which let officers and judges have personal contact information in public records restricted, ride along. One section on the page is not yet in force: SECTION 30-2-60, 'Removal of public records' (eviction filings and records to be removed from the public index seven years after final disposition), prints 'Section effective January 1, 2027.' (2026 Act No. 214, H.4270); the chapter is taken whole, as the page prints it."

- id: "sc-code-11-sec-35-820"
  sha256: "e1e23bc9430f480f6bf7277607e7eefdb421d1d3289a305ac60468777447d675"
  url: "https://www.scstatehouse.gov/code/t11c035.php"
  format: "html"
  citation: "S.C. Code § 11-35-820"
  title: "Code of Laws, Section 11-35-820. Creation of Information Technology Management Office (Consolidated Procurement Code)"
  doc_type: "statute"
  jurisdiction: "south-carolina"
  issuing_body: "South Carolina General Assembly (Legislative Council)"
  tags: [governance, procurement]
  recheck: "monthly"
  slice: {section_start: "11-35-820", section_end_before: "11-35-830"}
  why_relevant: "OWNER DECISION 2026-11-13: a provision in law that is not itself about IT is in scope, as a section slice, when its own focus is the governance of state government IT. The slice is one section of Title 11, Chapter 35, the South Carolina Consolidated Procurement Code, which is not IT law as a whole. Section 11-35-820 creates, within the Division of Procurement Services, the Information Technology Management Office headed by the Information Technology Management Officer, which 'is responsible for administering all procurement and contracting activities undertaken for governmental bodies involving information technology', and requires that 'all procurements involving information technology, and any pre-procurement and post-procurement activities in this area, must be conducted in accordance with the regulations promulgated by the board.' It is the only section of the chapter whose own subject is IT: Section 11-35-1580, 'Information technology procurements', is printed as repealed (2019 Act No. 41, eff May 13, 2019), and the other sections that name information technology (the definitions in 11-35-310, and the general procurement rules that list it among supplies, services and construction) apply to IT along with everything else and are not taken."

- id: "sc-code-26-sec-6-170-to-195"
  sha256: "32cdd1b7a08ef77de356a63f7d29f3b014bb92ff78be934d23f485022bfa882d"
  url: "https://www.scstatehouse.gov/code/t26c006.php"
  format: "html"
  citation: "S.C. Code §§ 26-6-170 to 26-6-195"
  title: "Code of Laws, Sections 26-6-170 to 26-6-195. Uniform Electronic Transactions Act: government agencies' electronic records and signatures"
  doc_type: "statute"
  jurisdiction: "south-carolina"
  issuing_body: "South Carolina General Assembly (Legislative Council)"
  tags: [governance, data, digital-services]
  recheck: "monthly"
  slice: {section_start: "26-6-170", section_end_before: "26-6-210"}
  why_relevant: "OWNER DECISION 2026-11-13: a provision in law that is not itself about IT is in scope, as a section slice, when its own focus is the governance of state government IT. The slice is four sections of Title 26, Chapter 6, the Uniform Electronic Transactions Act, most of which governs private transactions and is not taken. The sections taken are addressed to state agencies: 26-6-170, 'Each governmental agency of this State shall determine if, and the extent to which, it will create and retain electronic records and convert written records to electronic records'; 26-6-180, each agency decides whether to send, accept and rely on electronic records and signatures and, in consultation with the Department of Administration and 'giving due consideration to security', may specify their format, signature type and the control processes for 'preservation, disposition, integrity, security, confidentiality, and auditability'; 26-6-190, 'The South Carolina Department of Administration shall adopt standards to coordinate, create, implement, and facilitate the use of common approaches and technical infrastructure ... to enhance the utilization of electronic records, electronic signatures, and security procedures by and for public entities of the State' (its subsections B and C, on the Secretary of State's model procedures and on service of process on corporations, ride along with it); and 26-6-195, an agency may serve process by e-mail under policies and procedures the Department develops for the United States Postal Service Electronic Postmark."

- id: "sc-code-30-sec-1-90"
  sha256: "30db8a9b2598cf1e7b103800615e665e8d1de6b74c5d830d83fcb3dd81dab8e9"
  url: "https://www.scstatehouse.gov/code/t30c001.php"
  format: "html"
  citation: "S.C. Code § 30-1-90"
  title: "Code of Laws, Section 30-1-90. Public records: agency records schedules and retention, electronic records included"
  doc_type: "statute"
  jurisdiction: "south-carolina"
  issuing_body: "South Carolina General Assembly (Legislative Council)"
  tags: [governance, data]
  recheck: "monthly"
  slice: {section_start: "30-1-90", section_end_before: "30-1-100"}
  why_relevant: "OWNER DECISION 2026-11-13: a provision in law that is not itself about IT is in scope, as a section slice, when its own focus is the governance of state government IT. The slice is one section of Title 30, Chapter 1, 'Public Records, Reports and Official Documents', which is records law and is not taken whole. Section 30-1-90 has agencies help the Archives prepare an inventory and records schedules 'mandating a time period for the retention of each series of records', and in subsection (D) provides that no record of long term or enduring value, 'including those filed, kept, or stored electronically, or those records converted from paper to magnetic, optical, film, or other media', may be disposed of, destroyed, or erased without an approved records schedule. Those words make it the State's rule for retaining and disposing of electronic records, which is IT and data governance. The neighbouring section 30-1-80 (the Archives' general records management program for all public records) is not taken: its own focus is records management in general and it never mentions electronic records or information technology."
- id: "sc-reg-19-445-2027"
  sha256: "69733e3fc67018e9e5611e7dd8fa63d803bb41a82fdc3bd07381bb03b16b0908"
  url: "https://www.scstatehouse.gov/coderegs/Chapter%2019.pdf"
  format: "pdf"
  citation: "S.C. Code Regs. 19-445.2027"
  title: "Code of Regulations, 19-445.2027. Electronic Commerce (Procurement Regulations)"
  doc_type: "rule"
  jurisdiction: "south-carolina"
  issuing_body: "South Carolina State Fiscal Accountability Authority (State Budget and Control Board), published by the General Assembly (Legislative Council)"
  tags: [procurement, governance, digital-services]
  recheck: "monthly"
  slice: {section_start: "19-445.2027", section_end_before: "19-445.2030"}
  why_relevant: "OWNER DECISION 2026-11-13: a provision in law that is not itself about IT is in scope, as a section slice, when its own focus is the governance of state government IT. The slice is one regulation of Chapter 19, 19-445, the procurement regulations, which are not IT rules as a whole. 19-445.2027 lets the State use electronic commerce (electronic mail, web technology, purchase cards, electronic funds transfer and data interchange) in procurement; says agencies 'may exercise broad discretion in selecting the information technology that will be used' but their head 'shall ensure' that the systems, technologies, procedures and processes are implemented uniformly, reuse existing infrastructure, comply with interoperability standards and 'are capable of ensuring authentication and confidentiality commensurate with the risk'; deems agencies using the procurement functionality of SCEIS to comply; and lets agencies accept electronic signatures and records in State contracts under the Uniform Electronic Transactions Act. The HISTORY line prints 'SCSR 44-4 Doc. No. 4861, eff April 24, 2020.' The General Assembly serves Chapter 19 as one PDF (the chapter's HTML page answers 404); its master page states the files are current through State Register Volume 50, Issue 3, effective March 27, 2026, and the PDF's own metadata dates it July 22, 2025."

- id: "sc-reg-19-445-2115"
  sha256: "69733e3fc67018e9e5611e7dd8fa63d803bb41a82fdc3bd07381bb03b16b0908"
  url: "https://www.scstatehouse.gov/coderegs/Chapter%2019.pdf"
  format: "pdf"
