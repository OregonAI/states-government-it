    OWNER DECISION, appropriations provisos: the Department's own instruments cite their authority as provisos of the annual General Appropriations Act, which are not in the Code of Laws: the Statewide Information Security Program Policy names Provisos 93.9, 117.96, 117.102 and 117.107 of the 2025 Act; the Mobile Device Protection Policy names Proviso 117.148 of the FY 2018-19 Act; the shared services overview names Proviso 117.121; the IT Planning page names Proviso 117.106 of the 2026-2027 Act, the Data Collection page links Proviso 117.71 (2018 version); the AI Center of Excellence page names Proviso 117.194. They bind state agencies on IT, cybersecurity and AI, but they are temporary budget law published inside the whole Appropriations Act (a PDF of hundreds of pages), and the playbook leaves budget law out pending an owner decision on section-level slicing. None was fetched.
- text: |-
    Executive orders: the Governor's list (https://governor.sc.gov/executive-branch/executive-orders) was read in full: 443 orders, numbered 2017-04 to 2026-25 (Governor McMaster's; earlier administrations' orders are in the State Library's digital collection, which the page links: see Executive Order 2016-07 below). Where the index prints no title the file name was read. Two are seeded (2017-08 and 2022-03). Left out: 2022-27 'Formalizing New Statewide Cybersecurity Initiative' (the filed copy's file name reads 'Formalizing S.C. Cybersecurity Ecosystem Coordination Initiative'): it directs the Department of Commerce to coordinate a statewide cyber industry, workforce and economic development initiative with private and academic partners, and agencies to assist; OWNER DECISION, it is cybersecurity but not IT as a government function, so it is left out and may be wanted. 2025-31 'Adoption of Updated Telecommuting & Remote Work Policies & Procedures' (a human resources policy for state employees, not IT). 2019-21 'FOIA Compliance' (access to public records). 2018-59 'Transfer of Disaster Recovery to the Department of Administration' (read: it moves the disaster-recovery housing grant office, not IT). The other 437 rows are states of emergency, flags, appointments, suspensions, leave with pay, transportation waivers, elections and similar; no title or file name among them names information technology, data, cybersecurity or AI. Executive Order 2016-07 (January 2016, requiring cabinet agencies to use IT shared services) is named in the IT Shared Services Overview and is outside the Governor's list; it may still be in force and is not readable at an official source in this run. Measured 2026-11-12: the State Library's collection page the Governor's page links (https://dc.statelibrary.sc.gov/handle/10827/22) answers the Fetcher with 200 and an 827-byte page that is only a script shell ('<ds-app></ds-app>', title DSpace); the list of orders is drawn by script from the site's internal REST API, which the rules forbid calling, so no order can be read or even listed from it. OWNER DECISION: whether to add EO 2016-07 once a readable official copy is found (the owner may have one); Executive Order 2022-03 carries the shared services directive forward, which may make 2016-07 superseded in part. No rescission of 2017-08 or 2022-03 appears in the list.
- text: |-
    Statutes: the Code of Laws title pages (all 63) were read for chapter titles. Three chapters are seeded (Title 1 chapter 11, Title 11 chapter 53, Title 30 chapter 2). Left out: Title 11 chapter 35, 'South Carolina Consolidated Procurement Code' (a procurement code that holds the State's IT procurement provisions among many others; the playbook leaves such sections out pending an owner decision on section-level slicing; not fetched). Title 16 chapter 16, 'Computer Crime Act' (criminal law, scoped out by domain.yml; judged from its title). Title 30 chapter 4, 'Freedom of Information Act' (access to public records, not IT). Title 37 chapter 20 'Consumer Identity Theft Protection', Title 38 chapter 99 'Insurance Data Security Act' and Title 44 chapter 117 'Prescription Information Privacy Act' (judged from their titles as binding private persons or regulated industries, not state agencies; not fetched). The chapters below were fetched through the Fetcher on 2026-11-12 (200) and read:
     - Title 26 chapter 6, 'Uniform Electronic Transactions Act' (t26c006.php): most of the chapter governs private transactions, but three sections bind government agencies on IT and data: SECTION 26-6-170 'Creation and retention of electronic records by government agencies' ('Each governmental agency of this State shall determine if, and the extent to which, it will create and retain electronic records and convert written records to electronic records'), SECTION 26-6-180 'Government agencies sending and accepting electronic records and signatures; format' (each agency decides whether to send, accept and rely on electronic records and signatures and, in consultation with the Department of Administration and giving due consideration to security, may specify their format, signature type and the control processes for preservation, integrity, security and auditability) and SECTION 26-6-195 'Service of process to e-mail address by government agency' (an agency may serve process by e-mail under Department of Administration policies and procedures). SECTION 26-6-190 'Development of standards and procedures; service of process' also directs the Department to adopt standards for the use of electronic records, electronic signatures and security procedures by public entities. OWNER DECISION on section-level slicing: the playbook leaves sections of non-IT chapters out pending that decision; the sections named are the ones to slice if the owner wants them (the whole chapter is 21 sections, 29,954 characters as read).
     - Title 30 chapter 1, 'Public Records, Reports and Official Documents' (t30c001.php): SECTION 30-1-80 'Records management program' (the Archives establishes and administers a program for the creation, utilization, maintenance, retention, preservation and disposal of public records) and SECTION 30-1-90 (agencies assist with inventories and records schedules; no record of long-term value, 'including those filed, kept, or stored electronically', may be disposed of or erased without an approved records schedule) bind agencies on records management, which is data governance. The chapter is records law, not IT; left out pending the owner decision on section-level slicing (OWNER DECISION: sections 30-1-80 and 30-1-90).
     - Title 26 chapter 2, 'Electronic Notaries Public' (t26c002.php): binds notaries public, electronic notary solution providers and the Secretary of State's registration of them (SECTION 26-2-20, 26-2-80, 26-2-120), not state agencies as IT users; left out.
     - Title 48 chapter 60, 'South Carolina Manufacturer Responsibility and Consumer Convenience Information Technology Equipment Collection and Recovery Act' (t48c060.php): binds computer and television manufacturers, retailers, collectors and recoverers, with the participation and liability of counties and municipalities (SECTION 48-60-57, 48-60-62); electronic-waste recycling, not state IT management; most of it is repealed December 31, 2029 by 2022 Act No. 234, per the page's editor's note; left out.
     Section 1-11-490, which binds agencies on breaches, is inside the seeded chapter.
