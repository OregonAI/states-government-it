  text_layer: "scanner-ocr"
  why_relevant: "SWM-300, effective 11/2018, issued under Proviso 117.148 (Mobile Device Protection Plan) of the FY 2018-19 Appropriations Act: it describes the assignment, use and management of state-issued mobile communication devices and requires agencies to use the statewide contract for protecting state-owned mobile devices. One page. The PDF was made by an office scanner (Canon iR-ADV C5560: one full-page image, 1275 by 1650 pixels, 150 ppi) and its text layer is the scanner's own OCR, not read through the corpus's two-engine OCR procedure and not verified against the page: it renders the logo as stray characters ('J', 'a d min', '.', 'f', 'DEPARTMENT o ADMINISTRATION') and drops words (under the signature the page prints 'South Carolina Department of Administration Executive Director', the text reads 'harolina Department of Administration Executive Director'). The page prints 'Effective 11/2018', a month with no day, so effective_date is empty. See shared_changes_needed: the shared OCR path does not accept a page that already has a text layer."

