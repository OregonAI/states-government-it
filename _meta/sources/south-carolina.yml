- id: "sc-admin-statewide-infosec-program-policy"
  sha256: "ab79f26878271e71696aebaf4a4a25e3149990daef6fd6e4a58255d672dcb950"
  url: "https://www.admin.sc.gov/sites/admin/files/Documents/PMOOTIS/SC%20Statewide%20Information%20Security%20Program%20Policy.pdf"
  format: "pdf"
  citation: "SC Admin DIS: Statewide Information Security Program Policy (January 1, 2026)"
  title: "South Carolina Statewide Information Security Program Policy"
  doc_type: "policy"
  jurisdiction: "south-carolina"
  issuing_body: "South Carolina Department of Administration"
  tags: [cybersecurity, governance]
  recheck: "monthly"
  identity_text: "Statewide Information Security Program Policy"
  no_text_pages: [2, 16]
  why_relevant: "Establishes the Statewide Information Security Program (SC InfoSec Program): its authority (Provisos 93.9, 117.96, 117.102 and 117.107 of the 2025 General Appropriations Act, as the policy states), scope (all executive-branch state agencies; judicial and legislative agencies are exempt), program objectives and components, program governance and the roles shared between the Division of Information Security and agencies. Version 2.0 dated January 1, 2026, retitled from 'Information Security Program Master Policy'. PDF pages 2 (blank) and 16 have no text layer and add no text: page 16 is an image of the policy authorization block (the State Chief Information Security Officer's authorization, dated January 30, 2026, with a signature), which the text therefore lacks. Page 16 is readable: measured on 2026-11-12, page 16 alone OCRs cleanly through the shared Tesseract path (659 characters, including 'Date of Current Revision: January 1, 2026' and 'Authorized by: Ben Willis'). The two-engine procedure could not be used because of a limit in the shared OCR code, not because the page cannot be read: page 2 is blank but carries a whitespace-only text layer (an embedded font with no glyphs), so the shared check treats it as a scan that needs OCR (listing only page 16 fails with 'page 2 has no text layer'), and with pages 2 and 16 both listed ocrmypdf aborts with PriorOcrFoundError (page 2 'already has text'). See shared_changes_needed: src/ingest_ocr.py should treat a page whose text layer is only whitespace as blank, or OCR it with skip-text. Page 16 is therefore missing from the text until that change."

- id: "sc-admin-mobile-device-protection-policy"
  sha256: "fbf26ceb82e2220b5333f35491545f6ba5b87e4f392a308e8499036d997bcd09"
  url: "https://www.admin.sc.gov/sites/admin/files/Documents/PMOOTIS/Mobile_Device_Protection_Policy.pdf"
