    title: "DEPARTMENT OF MANAGEMENT SERVICES PROJECT MANAGEMENT AND OVERSIGHT"
    doc_type: rule
    jurisdiction: florida
    issuing_body: "Department of Management Services"
    tags: [oversight]
    recheck: monthly
    stub: true
    stub_reason: "Legacy Word 97-2003 binary (.doc), a Composite Document File V2 file, served one file per chapter by the Department of State's flrules.org (readFile.asp link on the chapter page). Measured 2026-11-11 on this build machine: antiword, catdoc, soffice and libreoffice are not installed (`which` finds none), pandoc reads docx and odt but not .doc ('couldn't unpack docx container: Did not find end of central directory signature'), and the repo's shared readers (src/ingest_docx.py) take .docx only. The rule's own page (RuleNo.asp) offers only the same .doc link and no HTML or PDF view, and no other official rendering of the rule text was found (Cornell, Justia and similar mirrors are unofficial and not used). The chapter .doc was fetched through the Fetcher (69,632 bytes) to measure this; its text is not committed. Re-measured 2026-11-13 for the owner's approval of this candidate (a 'seed whole' item): still no .doc reader on this machine (antiword, catdoc, soffice, libreoffice, abiword and wvText are not installed; pandoc 3.11 does not read .doc; olefile is not in the shared .venv, which may not be extended), and the shared ingester refuses the format outright: src/ingest.py `derive` raises for every format in the toolkit's UNSUPPORTED set, which holds 'doc'. A state module cannot lift that, so the obstacle is in shared code. The entry becomes a document when a .doc reader exists and src/ingest.py lets a state's to_text read a 'doc' source (see the report's shared_changes_needed). The approval stands; the stub is the true state."
    found_via: "https://www.flrules.org/gateway/ChapterHome.asp?Chapter=60GG-1"
    why_relevant: "Chapter 60GG-1 (rules 60GG-1.001 to 60GG-1.004 in force; 60GG-1.005 to 60GG-1.009 shown as Repealed; each shown effective 6/17/2026): purpose and applicability, project management standards, project oversight requirements, and the plan of action and milestones for Florida information technology projects. Issued by the Department of Management Services, Florida Digital Service, under s. 282.0051 (rulemaking authority listed on the chapter's rule pages)."
