left_out:
- text: '---- Florida: found and left out (each was seen on an official page on 2026-11-11; the reason is recorded here)'
- text: |-
    Statutes outside chapter 282. Chapter 282 is seeded whole (Parts II and III ride along: Part II accessibility of information and technology, 282.601 to 282.606, is in scope; Part III, 282.701 to 282.802, holds the SUNCOM telecommunications services, a telecom subject, with s. 282.802, the Government Technology Modernization Council, which is in scope for AI).
     - s. 112.22, 'Use of applications from foreign countries of concern prohibited' (chapter 112): SEEDED 2026-11-13 as fl-st-112-22 under the owner's decision that a provision whose own focus is the governance of state IT is in scope (the earlier reason, a pending decision on section-level slicing, is superseded). The Legislature serves it on its own page, so no slice is needed.
     - s. 286.101, 'Foreign gifts and contracts' (chapter 286, public business: miscellaneous): defines 'foreign country of concern' and requires disclosure of foreign contracts and gifts; general to state agencies and not IT. Left out.
     - s. 501.171 (security of confidential personal information; breach notice): SEEDED 2026-11-13 as fl-st-501-171 (its own page; it names 'governmental entity' (any instrumentality of this state holding electronic personal information) and requires it to 'take reasonable measures to protect and secure data in electronic form', a section that binds state agencies' systems). The earlier reason (pending decision) is superseded.
     - s. 287.057, including (11) and (26) (procurement of commodities or contractual services), and s. 287.042 (powers of the Department of Management Services as purchasing agency), the IT-oriented citations of the 60GG-1 FAQ and EO 22-216: owner decision 2026-11-13 approves such a section only when the provision's own focus is IT governance. Both were read in the official pages (fetched 2026-11-13) and fail that test. s. 287.057(11) (a contract may be awarded without competition if state or federal law prescribes the contractor) and (26) (a continuing oversight team for each contractual services contract of $5 million or greater, whatever the service) say nothing of information technology; the only IT wording in the section is the state chief information officer's consultation on the online procurement program in (24). s. 287.042 is the general purchasing power; its IT words are two riders, (3)(h) ('procedures to be used by state agencies when procuring information technology commodities and contractual services that ensure compliance with public records requirements') and (4)(b) (procedures for procuring information technology consultant services), in a section about all commodities and services. The seed's slice shape cuts by section, not by subsection, so the IT riders cannot be taken alone. Left out.
     - s. 216.023 (legislative budget requests; the NPV guide cites (4)(a)10): NOT SEEDED, an owner question, not a finding on focus. It was read in the official page (fetched 2026-11-13). Paragraph (4)(a)10 ('For projects that exceed $10 million in total cost ... The governance structure for information technology-related projects must incorporate the applicable project management and oversight standards established pursuant to s. 282.0051') and subsection (7) (an inventory of technology-related projects over $1 million) are themselves IT project governance, the kind of budget provision decision 1 names. The obstacle is the tooling: the seed's slice shape cuts by section, not by paragraph, so the paragraph cannot be taken alone, and the rest of s. 216.023 is the general budget-request rule for every agency's request, which decision 1 does not approve. Owner question: seed the whole of s. 216.023 as one section page, or wait for a sub-section slice.
     - chapter 20 (creation of the Department of Management Services): not one of the candidates the owner approved and its wording was not read; left out.
- text: |-
    AI statutes binding state agencies: none found in the sources read. Read: the whole text of chapter 282 (the words 'artificial intelligence' occur only in s. 282.802, the council's duty to recommend legislative reforms and a state code of ethics for AI systems in state government, which studies and recommends and does not regulate agency use), s. 112.22 and the Prohibited Applications List (which names AI applications among the prohibited). Not read in bytes: the Legislature's 2026 bill and chapter-law lists. Web discovery (not evidence, nothing from it is in the repo) reported that the 2026 bills on government AI use (SB 146, the AI Bill of Rights, HB 1395) did not pass; a reviewer should confirm that against the Legislature's bill pages. Chapter 282's own text prints History lines citing 2026 session laws (ch. 2026-66, 2026-115, 2026-120 and 2026-233), so the 2026 edition read is current through the 2026 session.
- text: |-
    Executive orders: read the Governor's list for every year with the visitor filter form (Executive Orders category, each year 2020 to 2025 read through its last page, 1,514 rows, and the 2026 list, 214 rows; the default view shows 2026 only; the 2019 orders are reachable only through the Any/All view (field_date_value=All, the seeded watch URL), whose pages 70 to 84 hold 255 orders from 2019 (#2019-10 onward): those pages were read and the 255 titles scanned with the same keyword list, and none names an IT subject; the Ethics category was not read). Every title was scanned with a keyword filter (artificial, cyber, technolog, information, data, digital, DOGE, efficien, AI, software, foreign, social, application, network, computer, record, security, China, internet, website) and the site's keyword box was tried with 15 words over all years; only two titles name an IT subject.
     - Executive Order 22-216, Strengthening Florida Cybersecurity Against Foreign Adversaries: seeded.
     - Executive Order 25-44, Ensuring Government Efficiency (the Florida DOGE order, 24 February 2025; each agency's DOGE team is to use 'advanced technology, such as artificial intelligence' to find unnecessary spending): its Section 5 reads 'shall expire on March 31, 2026', and no order extending it was found in the 2026 titles. Expired, so not in force; also a fiscal-efficiency order, not an IT instrument.
     Titles are mostly 'assigns', 'extends', 'suspends' and emergency-management lines; an order on IT filed under a title that does not name it would not be found by this scan (a limit, stated).
- text: |-
    Rules, Florida Administrative Code (Department of Management Services, read on flrules.org on 2026-11-11: the Department page, Divisions 60GG, 60FF, 60EE, 60DD and every chapter page of them listed below).
     - 60GG-1 to 60GG-5 and 60FF-3 are seeded as stubs (legacy .doc, see the stub reason).
     - 60FF-1 (State Communications Definitions; Usage Qualifications; Exemptions and Clearances, 14 rules) and 60FF-2 (State Communications Order Processing and Billing, 7 rules): SUNCOM telecommunications customer eligibility, orders and billing; telecom is out of scope (60FF-1.005, a customer's notice of a security concern about a network solution, and 60FF-1.013, clearance requests on interoperability and security, are the only security lines). Same legacy .doc source. Borderline for 60FF-1: OWNER DECISION.
     - 60FF-4 (Florida Statewide Law Enforcement Radio System), 60FF-5 (E911 Board), 60FF-6 (State E911 Plan) and 60FF1-5 (Emergency Communications Board): radio, 911 and law-enforcement communications, out of scope. Only the chapter titles on the division page were read.
     - 60EE-1 (Accessible and Electronic Information Technology): all four rules shown '(Transferred)', effective 1/23/2007; not in force at this location (the accessibility duty is in s. 282.601 to 282.606 in the seeded chapter 282).
     - 60DD-2 (Florida Information Resource Security Policies and Standards): all ten rules '(Transferred to 71A-2...)', 2004. 60DD-6 (eligibility and use of the state communications system): all eight '(Repealed)'. 60DD-7 (Information Technology Life Cycle Policies and Standards): all fourteen '(Repealed)', 2004. Repealed or transferred; not in force. 60DD-1, -4, -5 and -8 (wireless 911, regulated communications services, communications procurement, radio): telecom, out of scope.
     - Division 60I (Information Technology Resource Procurement Advisory Council) and 60J are listed on the Department page with no link and no rules.
     - Division 60A (State Purchasing, procurement rules) and other agencies' rules (for example records management) were not enumerated for IT content in this pass: a gap, stated.
     - Inside seeded chapters, repealed rules are shown on the chapter pages (60GG-1.005 to 60GG-1.009, 60GG-3.004, 60GG-5.001, 60GG-5.003, 60FF-3.001) and are not separate instruments.
- text: |-
    Florida Digital Service library (digital.fl.gov, read through the Fetcher: its sitemap of 67 page URLs and the Cybersecurity, Cybersecurity Capabilities, Incident Reporting, Local Resources, Local Government Cybersecurity Protection Program, Prohibited Applications List, Weekly Cyber Threat Intelligence Advisory, Enterprise Architecture, Data & Interoperability, Project Oversight, Project Oversight Resources, Resources, Professional Development and Collaboration, Digital Forward and Technology Councils pages). There is no policy and standards library as such (the standards are in rule chapter 60GG, and the chapter 282 text read creates no policy library). Every file the pages link was reconciled:
     - Project Oversight Resources, 37 rows: 2 seeded (the 60GG-1 FAQ and the Net Present Value guide); 1 left out as a graphic ('Decision Process for Rule Chapter 60GG-1, F.A.C.', a one-page flow chart whose text layer is its title and 'digital.fl.gov', 196 characters); 1 left out as a tips sheet ('Tips for Effective Schedule Development', 2019, issued under the predecessor 'Division of State Technology', a two-page tips sheet on Microsoft Project scheduling with no stated authority; OWNER DECISION); 18 Word files (project charter, business case, plans, SOW, closing package checklist, status report, Project Manager Training Assessment and the like) and 15 Excel workbooks (risk and complexity assessment, RACI chart, decision escalation matrix, logs, spending plan, monthly status report and the like): forms, templates and workbooks, not instruments.
     - Cybersecurity pages: 'Prohibited Applications List' seeded. Left out: 'Local Government Cybersecurity Resource Packet - Florida Digital Service - 2025' (v2.0; guidance for local governments, out of scope); the 'Local Government Attestation Form' (a Smartsheet form) and the incident report form; 'FLDS-CSOC-After-Action-Report-Form' (PDF and Word, a form); the 'Weekly Cyber Threat Intelligence Advisory' page (a recurring threat bulletin, not an instrument).
     - 'FLDS - Strategic Plan and Market Analysis Enterprise Approach to Zero Trust' (PDF, linked from Enterprise Architecture, Data & Interoperability, Digital Forward and Resources): a strategic plan and market analysis, not an instrument.
     - Technology Councils page: 38 meeting notices and agendas (Florida Cybersecurity Advisory Council, Government Technology Modernization Council and their work groups, February to August 2026): not instruments.
     - Pages about teams, leadership, jobs, professional development and Digital Forward: no instrument.
     - OWNER DECISION on the two guidance documents seeded as policy (the 60GG-1 FAQ and the NPV guide): both are Florida Digital Service guidance to agencies, neither is a rule or a numbered policy. The playbook excludes forms, templates, workbooks, reports and strategy documents and does not name guidance; they are in so the reviewer sees them, and come out if the owner says guidance is not an instrument.
     - Index pages: the Resources, Cybersecurity and Project Oversight pages are rendered in the browser from script data (a Next.js page), and the toolkit's HTML text of them is navigation only (measured: 377 and 411 characters, none of the file names), so a watch on them would never see a new file. The page list (sitemap.xml) and the flrules.org and Governor's pages are watched instead; the stale-file risk (a new quarterly Prohibited Applications List gets a new download number) is that the seeded file's url does not move. A toolkit issue text is in the PR body.
    Other places checked: dms.myflorida.com (the Florida Digital Service page there is script-rendered and its text is navigation only; the Department's site was not otherwise crawled); cyberflorida.org (a University of Central Florida resource page, not a state agency; not read).
