# Florida seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Discovery 2026-11-11 through the toolkit Fetcher: leg.state.fl.us (chapter 282 and sections 112.22 and 286.101), flrules.org (Departments, Divisions 60GG, 60FF,
# 60EE, 60DD, every chapter page of them), digital.fl.gov (Florida Digital Service: its sitemap, all Resources, Cybersecurity, Project Oversight, Enterprise
# Architecture and Technology Councils pages), dms.myflorida.com, flgov.com (executive order list, every year 2020 to 2026).
sources:

  # ---- Statute: one page for the whole chapter on the Legislature's own host
  - id: fl-st-282
    sha256: "c06e38863552e121682463a2644dcfb3541d3cdc275c37bec944b82d891cb7b5"
    url: "https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0200-0299/0282/0282.html"
    format: html
    citation: "Chapter 282, Florida Statutes"
    title: "Chapter 282. Communications and Data Processing"
    doc_type: statute
    jurisdiction: florida
    issuing_body: Florida Legislature
    tags: [governance, oversight, procurement, cybersecurity, data, ai, digital-services, cloud-resilience]
    recheck: monthly
    why_relevant: "The enabling statute for the Florida Digital Service within the Department of Management Services (s. 282.0051: enterprise architecture, information technology policy, project management and oversight standards, annual compliance assessments) and the state's information technology law. Part I, Information Technology Management (ss. 282.003 to 282.319): definitions, the state data center (282.201), the cloud-first policy (282.206), the State Cybersecurity Act (282.318, the statute behind rule chapter 60GG-2), local government cybersecurity and ransomware incident compliance (282.3185, 282.31855, 282.3186) and the Florida Cybersecurity Advisory Council (282.319). Part II, Accessibility of Information and Technology (ss. 282.601 to 282.606). Part III, Communication Information Technology Services (ss. 282.701 to 282.802): the SUNCOM state network, a telecommunications service that rides along, and s. 282.802, the Government Technology Modernization Council, charged to recommend legislative reforms and a state code of ethics for artificial intelligence systems in state government. Chapter 282 is the only enacted Florida statute found that mentions artificial intelligence in government, and it studies rather than regulates (see left_out)."
  # ---- Statute sections outside chapter 282: owner decision 2026-11-13 (a provision whose own focus is the governance of state IT), one page per section
  - id: fl-st-112-22
    sha256: "499c8c287bd0ec59b8c03cb26619e3850f14c47f8336e2d46ddd015c1a67cfe3"
    url: "https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0100-0199/0112/Sections/0112.22.html"
    format: html
    citation: "Section 112.22, Florida Statutes"
    title: "Section 112.22. Use of applications from foreign countries of concern prohibited"
    doc_type: statute
    jurisdiction: florida
    issuing_body: Florida Legislature
    tags: [cybersecurity]
    recheck: monthly
    why_relevant: "The statute behind the Prohibited Applications List and rule 60GG-2.008. Its own subject is the security of government devices and networks: a public employer 'shall ... Block all prohibited applications from public access on any network and virtual private network that it owns, operates, or maintains', 'Restrict access to any prohibited application on a government-issued device' and 'Retain the ability to remotely wipe and uninstall' one; 'The department shall ... Compile and maintain a list of prohibited applications and publish the list on its website' (the department being the Department of Management Services) and 'shall adopt rules necessary to administer this section'. 'Public employer' includes the state and its agencies, so it binds state agencies (it also reaches counties, school boards and municipalities, which the section's own definition names). Seeded as the single section under the owner's decision of 2026-11-13."
  - id: fl-st-501-171
    sha256: "1a46d0fb32c5df0d2bc7436a288522b7974690fe1d053d7b0f5229e921a053e9"
    url: "https://www.leg.state.fl.us/statutes/index.cfm?App_mode=Display_Statute&URL=0500-0599/0501/Sections/0501.171.html"
    format: html
    citation: "Section 501.171, Florida Statutes"
    title: "Section 501.171. Security of confidential personal information"
    doc_type: statute
    jurisdiction: florida
    issuing_body: Florida Legislature
    tags: [cybersecurity, data]
    recheck: monthly
    why_relevant: "The data-security and breach-notice section that chapter 282 and Executive Order 22-216 send state agencies to (s. 282.318 'state agencies shall provide notice in accordance with s. 501.171'). It binds state agencies' electronic data: 'governmental entity' means 'any department, division, bureau, commission, regional planning agency, board, district, authority, agency, or other instrumentality of this state that acquires, maintains, stores, or uses data in electronic form containing personal information'; subsection (2) 'Each covered entity, governmental entity, or third-party agent shall take reasonable measures to protect and secure data in electronic form containing personal information'; the notice duties in subsections (3) to (6) apply to a governmental entity ((1)(b)); and subsection (7) has the Department of Legal Affairs report each year on 'reported breaches of security by governmental entities or third-party agents of governmental entities' and name any governmental entity that violated them. The section also binds private commercial 'covered entities'; the Legislature serves it as one section and it is mirrored whole. Seeded as the single section under the owner's decision of 2026-11-13 (a breach section that binds state agencies' systems)."
  # ---- Executive order: in force, not expired
  - id: fl-eo-22-216
    sha256: "a70fb17625b56700b772135fb42ab145c116b9f8f205b77a979101474bf0b8e9"
    url: "https://www.flgov.com/eog/sites/default/files/executive-orders/2024/EO-22-216.pdf"
    format: pdf
    citation: "Executive Order 22-216"
    title: "Strengthening Florida Cybersecurity Against Foreign Adversaries"
    doc_type: executive_order
    jurisdiction: florida
    issuing_body: "Office of the Governor"
    tags: [cybersecurity, procurement]
    identity_text: "EXECUTIVE ORDER NUMBER 22-216"
    recheck: monthly
    why_relevant: "Directs the Department of Management Services to adopt rules so that information and communications technology used by state and local governments is not susceptible to exploitation by foreign countries of concern (s. 286.101); state agencies headed by gubernatorial appointees must conform their practices. It states no expiry (its Section 5: effective immediately). Listed on the Governor's executive order page under 2022 (the file sits in the site's 2024 folder). The PDF's own text layer is imperfect OCR and is mirrored as the file prints it."
  # ---- Florida Digital Service: the policy and guidance items on digital.fl.gov
  - id: fl-fds-prohibited-applications-list
    sha256: "0a9a65cc65e1370156c226b68c204b0b693835b2c6e130a359fb34ac46fb211f"
    url: "https://www.digital.fl.gov/content/download/163205/file/Prohibited%20Applications%20List_FINAL_4_30_2026.pdf"
    format: pdf
    citation: "Prohibited Applications on Government Devices List (April 30, 2026)"
    title: "Prohibited Applications on Government Devices List"
    doc_type: policy
    jurisdiction: florida
    issuing_body: "Department of Management Services, Florida Digital Service"
    tags: [cybersecurity, ai]
    identity_text: "Prohibited Applications on Government Devices List"
    recheck: monthly
    why_relevant: "The list the Department of Management Services, through the Florida Digital Service, determined under s. 112.22(1)(f), F.S., and rule 60GG-2.008, F.A.C.: 41 applications, among them AI applications (DeepSeek, Kimi, MiniMax Agent, Z.AI AI Agent App, StepFun AI Assistant and others), each with the date it was added. Public employers must keep them off government devices and evaluate applications not listed. Linked from the Prohibited Applications List page as 'Prohibited Applications List 04/30/2026'; the Florida Digital Service publishes it quarterly."
  - id: fl-fds-60gg-1-faq
    sha256: "75b1d767e97f5936f9a87262749880199a4cee82ffe0caf864aef00560a8c363"
    url: "https://www.digital.fl.gov/content/download/465034/file/FLDS%202026%20Rule%2060GG-1%20FAQ.pdf"
    format: pdf
    citation: "Rule Chapter 60GG-1, F.A.C. FAQ"
    title: "Rule Chapter 60GG-1 F.A.C. Frequently Asked Questions"
    doc_type: policy
    jurisdiction: florida
    issuing_body: "Department of Management Services, Florida Digital Service"
    tags: [oversight]
    identity_text: "Rule Chapter 60GG-1, F.A.C. FAQ"
    recheck: monthly
    why_relevant: "The Florida Digital Service's guidance to state and Cabinet agencies ('Enterprise Agencies') on the requirements of rule chapter 60GG-1, F.A.C. (IT project management and oversight): which projects are excluded, the operations-and-maintenance threshold, and how the rule applies. Listed on the Project Oversight Resources page as 'Rule Chapter 60GG-1 F.A.C. Frequently Asked Questions'. Guidance, not the rule itself: OWNER DECISION whether guidance belongs (see left_out)."
  - id: fl-fds-npv-guide
    sha256: "66d2103fa1529ad3de365098509bd104999768a707f0fc0a552c7364e27a924c"
    url: "https://www.digital.fl.gov/content/download/604413/file/Net%20Present%20Value%20Guide%20for%20State%20Information%20Technology%20Projects.pdf"
    format: pdf
    citation: "Net Present Value Guide for State Information Technology Projects"
    title: "Net Present Value Guide for State Information Technology Projects"
    doc_type: policy
    jurisdiction: florida
    issuing_body: "Department of Management Services, Florida Digital Service"
    tags: [oversight, funding]
    identity_text: "Using Net Present Value to"
    recheck: monthly
    why_relevant: "The Florida Digital Service's guide to calculating Net Present Value for state IT project analysis and comparing projects when only some can be funded, tied to the Schedule IV-B and the Legislative Budget Request instructions. The file prints its title as 'Using Net Present Value to Prioritize State Information Technology Projects'; the Project Oversight Resources page lists it as 'Net Present Value Guide for State Information Technology Projects'. Guidance: OWNER DECISION (see left_out)."
  # ---- Rules: Florida Administrative Code chapters, stubs (legacy .doc, no reader on this machine)
  - id: fl-fac-60gg-1
    sha256: ""
    url: "https://www.flrules.org/gateway/readFile.asp?sid=0&tid=0&cno=60GG-1&caid=1724677&type=4&file=60GG-1.doc"
    format: doc
