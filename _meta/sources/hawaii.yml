# Hawaii seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Discovery 2026-11-11 through the toolkit Fetcher: data.capitol.hawaii.gov (the HRS directory, chapters 27, 27C, 27G, 27J, 487J, 487N, 487R, the 2026 session
# bill directory), ets.hawaii.gov (home, Policies, IT Governance, IT Steering Committee, Reports, For Vendors, Cybersecurity Program, site map, every library
# row), data.hawaii.gov (Policies and Documents, AI literacy, sitemap), governor.hawaii.gov (executive order list pages 1 to 3, the sitemaps, the 2026-07-14
# release on the AI acts), budget.hawaii.gov and spo.hawaii.gov (the documents the IT Governance page links), ags.hawaii.gov, ltgov.hawaii.gov and lrb.hawaii.gov (rules).
# Statute entries are one HRS section each: the Legislature serves the code as one file per section, so a section is the unit that can be fetched and watched.
