    why_relevant: 'The department''s list of its administrative rule chapters (14 entries on 2026-11-11, none for the Office of Enterprise Technology Services): the watch sees a rule chapter for ETS appear.'
left_out:
  - text: 'RULES, none found. Administrative rules of the Office of Enterprise Technology Services: section 27-43(a)(12) authorizes the CIO to adopt rules under chapter 91, but no ETS rule chapter was found in the three lists read on 2026-11-11: the Lieutenant Governor''s Administrative Rules page (https://ltgov.hawaii.gov/the-office/administrative-rules/, which has no unified code and links each department''s rules; its Title 3 entry is the Department of Accounting and General Services), the Department''s own Administrative Rules page (https://ags.hawaii.gov/administrative-rules/, which lists Office of the Comptroller, Accounting Division, Archives Division, Automotive Management Division, Building Code Council, Campaign Spending Commission, Central Services Division, Land Survey Division, Election Commission, Office of Elections, Procurement Policy Board, Public Works Division, State Foundation on Culture and the Arts and State Procurement Office, with proposed changes for the State Procurement Office, the Automotive Management Division, the Office of Elections and the Office of Information Practices) and the Legislative Reference Bureau''s directory page (https://lrb.hawaii.gov/admin-rules-directory/, which only links a 2001 Table of Statutory Sections Implemented). The Department''s page is seeded as a watch page. Not read: the rule text of any department.'
  - text: 'ARTIFICIAL INTELLIGENCE STATUTES, none found binding state agencies. (1) Act 247 (HB 2137, 2026), relating to artificial intelligence: civil remedies for harmful deepfake imitations of an individual; private conduct. (2) Act 248 (SB 3001, 2026), relating to artificial intelligence: disclosures, self-harm response protocols and annual reports to the Department of Health by operators of AI companions, and protections for minors; private operators. Both are described in the Governor''s release of 2026-07-14 (https://governor.hawaii.gov/newsroom/office-of-the-governor-news-release-gov-green-signs-legislation-to-support-kupuna-care-and-strengthen-ai-protection/), which signed three measures, two on AI. (3) HB 2597 (2026): out as not in force (bills not yet enacted). The legislature''s directory of 2026 bills (https://data.capitol.hawaii.gov/sessions/session2026/bills/) holds HB2597_.HTM, HB2597_HD1_.HTM and HB2597_SD1_.HTM and no CD1 file; the SD1 (https://data.capitol.hawaii.gov/sessions/session2026/bills/HB2597_SD1_.HTM) is the last version in the directory and says it would take effect on January 1, 2077, a placeholder effective date, so even if it had passed it would not be in force. The HD1 text was fetched (https://data.capitol.hawaii.gov/sessions/session2026/bills/HB2597_HD1_.pdf). It is not among the acts in the Governor''s release. The fetched HRS sections (chapters 27, 27C, 27G, 27J, 128B, 487J, 487N, 487R) contain no occurrence of ''artificial intelligence''. HRS as the Legislature serves it is dated 2026-01-06 in its directory listing, before the 2026 acts. The only AI instrument found is the CDO-007 guideline (seeded).'
  - text: 'STATUTE SECTIONS OF CHAPTER 27 NOT SEEDED (each section file was fetched and read): 27-1 to 27-5 (functions of statewide concern, assignment by governor), 27-6 (extended state information and services: the Governor''s office reviews requests for providing information and services to the public), 27-7 (departmental data sharing through the statewide longitudinal data system for education and workforce research; sets an ETS data-sharing working group; OWNER DECISION: data governance across agencies, but its subject is education-to-workforce research data), 27-8 (food contracts), 27-9 (parking), 27-11 to 27-15, 27-21 to 27-22 (schools, health, repealed), 27-26 (junior police), 27-31 and 27-32 (highways, parks), 27-36 and 27-42 (repealed), 27-41 (special advisor for technology development: promotion of high technology industry, not state IT), 27-45 (broadband-related permits: automatic approval of permit applications), 27-51 to 27-54 (Hawaii performance partnerships board), 27-61 to 27-65 (Office of wellness and resilience, repealed) and Part X, 27-71 to 27-75 (broadband office, strategic broadband coordinator and broadband revolving fund within the Department of Accounting and General Services: broadband infrastructure policy, not the state''s own IT; OWNER DECISION if broadband counts). Chapter 27C (27C-1, 27C-2: the Governor''s office state information service for public information needs) and chapter 27J (apostilles and certifications) were read and are out of scope. 487J-3, 487N-3 and 487R-3 (Penalties; civil action: they bind businesses only; each records a government-agency carve-out, no action may be brought against a government agency under the chapter, so the obligated party is not the state), 487J-6 (business scanning of identification cards) and 487J-7 (pharmacy benefit managers) bind businesses only. Chapter 26 section 26-6 (the Department of Accounting and General Services'' functions, cited by an ETS report) and chapter 92F (the Uniform Information Practices Act, a general public-records law, cross-referenced from 27-44) were not fetched: the first is a department-organization section, the second is general public-records law, which the other states'' seed lists also leave out.'
  - text: 'STATUTES, a convention to confirm: the Legislature serves HRS as one file per section, so each section is a document (hi-st-*), not a chapter. A chapter-level document would carry out-of-scope sections (chapter 27 has 46 section files across Parts I to X). OWNER DECISION whether the per-section form is wanted; a chapter form would need a shared change (a snapshot that joins a directory''s files). Bracketed section numbers and headings in the files (e.g. [§27-43.5]) are mirrored as printed; their meaning was not looked up.'
  - text: 'POLICY LIBRARY, reconciled row by row (https://ets.hawaii.gov/policies/, one table, eight rows on 2026-11-11, all seeded): ETS Doc No. 306 PC Acquisition Guidelines (hi-pol-ets-306), 306.01 Recommended PC Specifications (hi-std-ets-306-01), 508 Secure Device Policy (hi-pol-ets-508), 508.01 Secure Device Standards (hi-std-ets-508-01), 509 Secure Access Policy - Next Generation Network (hi-pol-ets-509), 510 Secure Access Policy - Microsoft Office (hi-pol-ets-510), 103.01 Social Media Guidance (hi-pol-ets-103-01), 104.01 Hawaii Electronic Information Technology Disability Access Standards (hi-std-ets-104-01). No row shows a status column: every row was treated as current. Four findings for the owner: (a) 508.01: the library row''s page and the PDF it offers differ (page ''Desktop/Laptop: 14 characters'', PDF ''Desktop/Laptop: 10 characters'' in the Device passwords row); the page is seeded, the PDF (https://ets.hawaii.gov/wp-content/uploads/2018/10/ETS-Policy-No.-508.01-Secure-Device-Standards-20180918.pdf) is left out as a second copy: OWNER DECISION which is of record. (b) 508, 509 and 510: the library row links a web page; the seeded file is the PDF the page offers, whose words equal the page''s (measured by word comparison). (c) 104.01: the file prints ''Effective Date: April 20, 2026'' where the row prints effective 2025/01/01. (d) The State Data Office page says its guidelines ''are now posted on the ETS website'', but none of the seven CDO guidelines is a row of the ETS table.'
  - text: 'DATA AND AI GUIDELINES, reconciled (https://data.hawaii.gov/policies-and-documents/, seven entries, all seeded): CDO-001 Data Quality, CDO-002 Data Privacy, CDO-003 Data Catalog, CDO-004 Data Classification, CDO-005 Data Retention, CDO-006 Open Data, CDO-007 GenAI Assistant Technologies Usage. Not seeded: a draft ''Acceptable AI Use Guidelines'' Word file (https://data.hawaii.gov/wp-content/uploads/2026/06/2026-6-22-Acceptable-AI-Use-Guidelines-DRAFT.docx, fetched, 84,270 bytes) that prints ''Document No: CDO-007'' and ''Published: Date'' (a template placeholder), is named DRAFT and is not listed on the Policies and Documents page: a draft is not in force; the watch page will show it if it is published (OWNER DECISION, and note the number CDO-007 is already used by the GenAI guideline). The State Data Office''s other pages (the sitemap lists overview, data governance, meetings, membership, glossary, literacy, success stories, AI literacy) are not instruments; only the AI literacy page was read.'
  - text: 'IT GOVERNANCE PAGE (https://ets.hawaii.gov/it-governance/) items not seeded: EM 22-03 Attachment A, the Governor''s Budget Execution Policies for fiscal year 2023 (budget.hawaii.gov, 56 pages, fetched): budget execution policy for a past fiscal year, not an IT instrument; SPO-050 (an .xls form) and the ETS-001 Telecommunications Request form and its instructions (forms); the ''GSA IT Schedule 70 instructions'' (https://ets.hawaii.gov/wp-content/uploads/2019/03/GSAITSchedule70-r1-instructions.pdf, one page, fetched): ETS''s request-and-approval procedure under Procurement Circular 2017-06, a procedure sheet: OWNER DECISION; the GSA''s own FAQ page (a federal site, not a Hawaii source). Seeded from that page: Administrative Directive 18-03, Procurement Circular 2017-06 and the two ETS guidelines (306, 306.01, also library rows). The IT Steering Committee charter is seeded from the ets.hawaii.gov URL its page links from the caption image (the sidebar''s ets80 link answered HTTP 522; see its entry). The committee''s meeting pages are agendas and minutes, not instruments.'
  - text: 'REPORTS AND STRATEGY DOCUMENTS, not instruments (ETS Reports page https://ets.hawaii.gov/reports/, IT Steering Committee page, Cybersecurity Program page, all read): the CIO annual reports 2017 to 2025, the State IT Strategic Plans 2019, 2021 and 2025 and a 2019 overview presentation, the Act 119 (2015), Act 179 (2022) and Act 173 IT consolidation reports, the Act 172 reports, the 2024 IPSC annual PIA summary, the January 2024 Report on the State Executive Branch Cybersecurity Program, quarterly security and penetration reports, independent verification and validation reports, the 2024 Cybersecurity Awareness Month proclamation and release, the CISA ransomware fact sheet and the cybersecurity newsletters. The For Vendors page links only the ETS reports page and the State Procurement Office site.'
  - text: 'EXECUTIVE ORDERS, none on IT, cybersecurity, data or AI. The Governor''s list (https://governor.hawaii.gov/category/newsroom/executive-orders/, pages 1 to 3, read 2026-11-11) holds: 26-02 renewable energy technology system credits in tax year 2026; 26-01, 25-05, 25-06, 24-02 and 24-03 (civil service and exempt employees excluded from bargaining units; 26-01 and 24-02 and 24-03 read in the PDF, 25-05 and 25-06 by their list titles); 25-10 CREDIT Task Force (reliable energy and decarbonization; read in the PDF); 25-09 Hawaii Relief Program; 25-08 statewide traffic and roadway safety framework; 25-04 deposit beverage container distributor independent audits; 25-02 Operation Hire Hawaii workforce transition; 25-01 renewable energy; 24-06 medical cannabis primary caregivers; 24-01 trauma-informed state; and Land Executive Orders 4688 to 4695 (public land set-asides). The numbers 25-03, 25-07, 24-04 and 24-05 do not appear on the list; the list has no filter for earlier governors and no order before 2023 appears, so no order of an earlier governor was checked; the Governor''s site sitemaps (2022 to 2026 posts) were searched by title for cyber, artificial, technology, data, digital and executive order and showed no further order. The Governor''s Administrative Directive 18-03 on IT project governance is seeded; no index of administrative directives was found on governor.hawaii.gov or budget.hawaii.gov.'
