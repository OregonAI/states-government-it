  - id: hi-st-27-43
    sha256: "9494a671f56315265f524db3e39defcda5542a10ef93e749a8d5c5aed951f627"
    url: https://data.capitol.hawaii.gov/hrscurrent/Vol01_Ch0001-0042F/HRS0027/HRS_0027-0043.htm
    format: html
    citation: Hawaii Revised Statutes section 27-43
    title: Office of enterprise technology services; chief information officer; information technology steering committee; establishment; responsibilities
    doc_type: statute
    jurisdiction: hawaii
    issuing_body: Hawaii State Legislature
    tags:
    - governance
    - oversight
    - procurement
    - funding
    - cybersecurity
    - cloud-resilience
    recheck: monthly
    found_via: https://data.capitol.hawaii.gov/hrscurrent/Vol01_Ch0001-0042F/HRS0027/ (the chapter directory listing)
    why_relevant: 'The enabling statute for the Office of Enterprise Technology Services within the Department of Accounting and General Services and for the State''s Chief Information Officer, who organizes, manages and oversees statewide information technology governance: the state IT strategic plan, statewide technology standards, review of each department''s IT budget request and procurement against enterprise architecture policies and standards (including security management), the IT steering committee, the shared services technology special fund, the annual report and rulemaking under chapter 91. The ETS policy library cites this section as its authority.'

  - id: hi-st-27-43-5
