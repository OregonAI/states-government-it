    format: html
    citation: Hawaii Revised Statutes section 27-43.5
    title: Additional duties of the chief information officer relating to security of government information
    doc_type: statute
    jurisdiction: hawaii
    issuing_body: Hawaii State Legislature
    tags:
    - cybersecurity
    - governance
    recheck: monthly
    found_via: https://data.capitol.hawaii.gov/hrscurrent/Vol01_Ch0001-0042F/HRS0027/ (the chapter directory listing)
    why_relevant: 'The cybersecurity provision for state systems: the CIO provides for periodic security audits of all executive branch departments and agencies, may contract private auditors, may direct specific remedial actions for insufficient administrative, technical and physical controls, and the audited bodies must cooperate. The only section in chapter 27 that names security (chapter 128B, cybersecurity, is the other statute on state cybersecurity: see hi-st-128b-1).'

