left_out:
- text: |-
    ---- Pennsylvania: found and left out (each was seen on an official page, through the Fetcher, on 2026-11-11; the reason is recorded here)
- text: |-
    IT POLICY LIBRARY, how it was read and what that means. The library is public at https://www.pa.gov/agencies/oa/policies/it-policies (HTTP 200). The page says: 'This site contains all Commonwealth IT Policies available to the public. Other types of documents (Standards, Procedures, and Guidelines) are accessible only by Commonwealth employees on IT Central.' The rows of the list are not in the HTML the Fetcher gets: the page holds the Sort & Filter shell and an empty results template ('No results found'), and the rows are drawn by script from a search service. Calling that service is a site-internal API and was not done. So the list itself was NOT read row by row. What was read instead: the Office of Administration's IT Policy Crosswalk (https://www.pa.gov/content/dam/copapwp-pagov/en/oa/documents/programs/information-technology/documents/it-policy-crosswalk.pdf, 15 pages, read in full), which maps 93 old ITP numbers to the consolidated 'policies, standards, procedures, and guidelines' effective January 6, 2025. Every name in the crosswalk's new column that ends in 'Policy' was fetched at the library's file address (https://www.pa.gov/content/dam/copapwp-pagov/en/oa/documents/policies/it-policies/<lower-case title>.pdf, the address the library's own AI page links for the Artificial Intelligence Policy) and 36 answered HTTP 200 with a PDF with a text layer: those 36 are seeded (all 36 named in the crosswalk). A policy that is in the library but named in neither the crosswalk nor the guesses below would be missed: that is the gap in this 'every item' claim, and it is the owner's to close by reading the library list in a browser.
- text: |-
    IT POLICY LIBRARY, names tried that did not answer (HTTP 404 through the Fetcher, none read): 'information security officer policy', 'it resource patching policy' (the crosswalk's spelling; the file is 'IT Resources Patching Policy', seeded), 'incident reporting policy', 'virtualization policy', 'accreditation policy', 'enterprise telecommunications policy', 'checks policy', 'device security policy', 'screensaver policy', 'testing policy', 'operating system policy', 'e-mail policy', 'browser policy', 'cloud policy', 'identity management policy', 'wireless policy', 'social media policy', 'it asset management policy', 'backup policy', 'disaster recovery policy', 'security awareness policy', 'remote access policy', 'email policy', 'enterprise architecture policy', 'cybersecurity policy', 'vendor risk policy', 'open data policy', 'acceptable use policy', 'telecommunications policy', 'web policy', 'application certification and accreditation policy', 'contractor background checks policy', 'information security officers policy'. The crosswalk's row for ITP-SEC016, Commonwealth of Pennsylvania Information Security Officer Policy, reads 'N/A - Rescinded'; a web-search result listed a PDF at the 'information security officer policy' address, but the Fetcher got HTTP 404 and nothing from it was read, so it is not an entry.
- text: |-
    IT POLICY LIBRARY, standards, procedures, guidelines, forms and templates: about 75 distinct names in the crosswalk's new column (a rough parse of the extracted text, e.g. User Authentication Standard, Data Management Standard, Network Technology Standard, Penetration Testing Standard, Virtual Private Network Standard, Digital Accessibility Standard, IT Project Standard, six Generative AI guidelines, IT Policy Exception Procedure and Request Form, Change Blackout Request Form). Not seeded: the library page itself says they are 'accessible only by Commonwealth employees on IT Central'. IT Central (https://pagov.sharepoint.com/sites/OA-GRC/SitePages/IT-Policies.aspx) answered the Fetcher with HTTP 200 and a redirect to login.microsoftonline.com (a Microsoft sign-in page): sign-in only. Their file names were guessed at the public library address for five of them (digital accessibility standard, data management standard, network technology standard, AI transcription software guideline, IT policy exception procedure): all HTTP 404. Several seeded policies cite these standards by name; the standards' text is not public. If the owner counts standards as in scope, they are stubs for a person with a Commonwealth sign-in.
- text: |-
    IT POLICY LIBRARY, the 93 old ITP numbers (ITP-ACC001 to ITP-TEL001, e.g. ITP-BUS012, ITP-SEC000): replaced by the consolidated documents on January 6, 2025 per the crosswalk, so not in force; not fetched. Of the 93 rows, the crosswalk marks 'N/A - Rescinded': ITP-INF014 (electronic postmarks), ITP-INT001, ITP-INT002, ITP-INT003, ITP-INT006 and ITP-SEC016 (Information Security Officer Policy). Rows whose new document is only a standard, procedure, guideline or form (e.g. ITP-APP030, ITP-PLT002, ITP-PLT005, ITP-PLT012, ITP-PLT017, ITP-PLT019, ITP-SEC007, ITP-SEC012, ITP-SEC017, ITP-SEC039, ITP-SYM008, ITP-TEL001, ITP-INF006, ITP-INF009) have no public policy to seed. The old numbers are still cited inside some executive orders and management directives.
- text: |-
    IT Policy Glossary (https://www.pa.gov/agencies/oa/policies/it-policy-glossary): the page's list is drawn by script like the policy list; the HTML the Fetcher got holds the empty results shell and no definitions. Not an instrument; not read as a list.
- text: |-
    EXECUTIVE ORDERS. The list on the policies page (filter links, all governors and years) is drawn by script; the static record is Manual 210.03 Amended, Index of Issuances, July 1, 2026 (https://www.pa.gov/content/dam/copapwp-pagov/en/oa/documents/policies/ml/m210_3.pdf, 17 pages, read in full; a line count of its printed text finds about 154 executive-order rows, 230 management-directive rows and 27 manual rows). Its rescissions print as text ('Rescinded by EO 2026-01 - 4/15/2026'); strike-through formatting does not survive text extraction, so a row struck through without that note would not show. Seeded: 2016-06 (the central IT body), 2016-07 (open data and data governance), 2023-01 (Pennsylvania Longitudinal Data System), 2023-08 (digital experience strategy; it rescinded EO 2019-04, listed 'Rescinded by EO 2023-08 - 4/25/2023') and 2023-19 (generative AI). The index lists no AI executive order other than 2023-19 through July 1, 2026 and no later IT order (the last rows are 2026-01 to 2026-03, on disability policy and councils). The file address for these PDFs, https://www.pa.gov/content/dam/copapwp-pagov/en/oa/documents/policies/eo/<number>.pdf (2014_02.pdf for 2014-02), is the one the AI page links for 2023-19.
- text: |-
    EXECUTIVE ORDERS left out, borderline, OWNER DECISION: 2014-02 Pennsylvania Justice Network (JNET) Governance Structure (3/18/2014; fetched at .../eo/2014_02.pdf) and its implementing Management Directive 245.16 Amended (fetched, 7 pages, issued by the Office for Information Technology): a justice-information-sharing IT network governed from the Office for Information Technology; left out because the domain excludes law-enforcement technology. If the owner reads JNET as shared enterprise IT governance, both are ready to seed. Left out as not state IT: 2023-05 Pennsylvania Office of Transformation and Opportunity (economic development; its text was fetched and its opening read), 1988-08 Pennsylvania State Data Center (census data; title only), 2012-05 Commonwealth Continuity of Government (title only), 2026 executive order on data center development (the Governor's data-center press release is linked from the AI page; about electricity ratepayers and developers, not state IT; codified at 4 Pa. Code 7.1081, 'Protecting Pennsylvania Consumers from Data Center Impacts'). Rescinded, so not in force: 2019-04 (by 2023-08), 2015-01 and the other rows the index marks rescinded. The other roughly 140 executive-order rows are not on IT, data or AI by title.
- text: |-
    4 PA. CODE (https://www.pacodeandbulletin.gov/Display/pacode?file=/secure/pacode/data/004/004toc.html, 'changes effective through 56 Pa.B. 6006 (September 5, 2026)'). Title 4 codifies executive orders by subchapter, so IT instruments exist there too: chapter 7 subchapter KKK 'Use of Generative Artificial Intelligence Technologies' (7.991), chapter 7a subchapter N 'Open Data, Data Management and Data Governance' (7a.151) and R 'Enterprise Information Technology Governance' (7a.191), chapter 5 subchapters WWW 'Pennsylvania Longitudinal Data System' (5.1041) and YYY 'Commonwealth Office of Digital Experience' (5.1061), chapter 6 subchapter SS 'Pennsylvania Justice Network (JNET) Governance Structure' (6.541). These are the same orders as the executive orders seeded; the codified copy is a second mirror, and each chapter is one page serving every subchapter, which needs a slicing hook. Left out, OWNER DECISION: whether to mirror the codified subchapters as rules; the chapter pages are watched. ADMINISTRATIVE RULES OF THE IT AGENCY: none found. The Office of Administration's own chapter, 4 Pa. Code chapter 2 (Offices of Administration and the Budget; read), holds fee-award and interest-penalty rules and one 1992 computer service charge notice, no IT rule; chapters 1, 3, 6, 6a, 9 and 11 were searched for 'information technology', 'cyber', 'chief information', 'computer', 'artificial intelligence' and 'electronic records', and the hits are the index of issuances in chapter 1, the continuity-of-government data processing plan in chapter 3, and the council memberships and codified orders above. The Office for Information Technology issues directives, policies and bulletins, not regulations, in what was read.
- text: |-
    STATUTES. No statute creating the Office for Information Technology or the Chief Information Officer was found: Executive Order 2016-06 (seeded) rests on 'Sections 501 and 502 of the Administrative Code of 1929, 71 P.S. §§ 181, 182' (coordination among departments, as the order recites them) and creates the office itself. Read: the Administrative Code of 1929 as the General Assembly serves it (the General Assembly's act list prints it as 'The Administrative Code of 1929', A175, PDF, 399 pages, text searched for 'information technology', 'chief information', 'Office of Administration', 'cyber' and 'geospatial'): the only information-technology provision is section 432.1, the State Geospatial Coordinating Board (with the Office of Administration's duty to make resources available), and no section creates the IT office. Left out, OWNER DECISION: that Act is one 399-page document on all state agencies (the playbook's section-level slicing question); section 432.1 alone is relevant. Acts that bind state agencies and were seeded: Act 94 of 2005 (breach notification; 'State agency' is an 'entity') and Act 69 of 1999 (Electronic Transactions Act, chapter 5 on governmental agencies and the Office of Administration's standards). Consolidated titles: the 75 entries on the page (the Constitution and the titles) (https://www.palegis.us/statutes/consolidated); no title is an IT code, and Title 62 (Procurement), where IT purchasing sits, was not fetched or searched: general procurement code, left out under the playbook rule on sections inside non-IT chapters, OWNER DECISION. Unconsolidated acts: the General Assembly's act-name search pages were read for the words CYBERSECURITY and CYBER (no act name contains either), ARTIFICIAL (2026 Act 99 'Artificial Intelligence Deceptive Advertising Act - Enactment': private advertisers, out of scope), COMPUTER, DATA, DIGITAL (2025 Act 35, digital forgery: a crime, out of scope), ELECTRONIC, INFORMATION, INTERNET, TECHNOLOGY, TELECOMMUNICATIONS, RECORDS, GEOSPATIAL, NETWORK, OPEN, MAPPING and ADMINISTRATION. Left out by title as not binding state agencies' IT: Consumer Protection Against Computer Spyware Act (2010 Act 86), Information Technology Education Act (1984 Act 145, 1993 Act 80), Child Internet Protection Act (2004 Act 197), Uniform Real Property Electronic Recording Act (2012 Act 100), the Crimes Code amendments, Insurance Data Security (2023 Act 2, insurers), Legislative Data Processing Committee acts (legislative branch). Acts 151 of 2022 and 33 of 2024 amend Act 94 and are folded into the PDF of Act 94 (the PDF prints each amendment). No enacted statute on state-agency use of AI was found: none of the act names those searches returned is such an act; bills are out of scope. Right-to-Know Law (Act 3 of 2008) was not read: public records, not IT.
- text: |-
    MANAGEMENT DIRECTIVES (policy). The directives are in the index of issuances (about 230 rows; the 'Information Technology Management' category holds 240.07, 245.13, 245.15, 245.16, 245.18, 245.19); the list on the policies page is script-drawn. Their PDFs are at https://www.pa.gov/content/dam/copapwp-pagov/en/oa/documents/policies/md/<hundred series>/<number>.pdf (for example 205_34.pdf and 245_16.pdf under the 200 folder; the leading zero of the second part is dropped: 535_9.pdf under 500). Seeded (10): 205.34, 205.35, 205.37, 205.43, 210.12, 245.13, 245.18, 245.19, 310.37, 535.09; stub (1): 210.11, a scan. Rows were chosen by title from the whole index (grep for information, data, computer, technology, cyber, security, record, electronic, system, software, network, telecom, internet, web, digital, privacy, e-mail, social, mobile, cloud, SAP, open). Left out: 205.42 Authorized use of Social Media on Behalf of the Commonwealth (3/17/2025; fetched; contact agency is the Governor's Office of Digital Strategy: communications practice, OWNER DECISION), 210.05 State Records Management (fetched; the records program, not IT, though the Records Management Policy seeded says to read the two together; OWNER DECISION), 240.07 Submission of Changes to the Commonwealth Telephone Directory (fetched; directory entries), 245.15 Pennsylvania Statewide Radio Network (fetched; radio, out of scope as telecom), 245.16 JNET (see above), 310.36 Identifying, Recording, and Reporting Computer Software as a Capital Asset (index: 'Rescinded 7/5/2024'), 205.36 Right-to-Know Law Compliance, 310.25, 310.28, 310.29, 310.33, 310.34 and 310.39 (SAP accounting procedures of the Office of the Budget: financial transactions, not read), 570.11 Amending Data in Retirement and Personnel/Payroll System (personnel data entry, not read). The manuals (27 rows) were not read beyond a keyword scan of their titles; 210.03 itself is watched.
- text: |-
    NOT INSTRUMENTS, seen and left out: the IT Policy Crosswalk and Manual 210.03 are indexes (watched); OpenAI pilot report 2025 (https://www.pa.gov/content/dam/copapwp-pagov/en/oa/documents/programs/information-technology/documents/openai-pilot-report-2025.pdf, a report, linked from the AI page); the Governor's March 21, 2025 letter on AI and employees (a letter, linked from the AI page); the AI page's press releases and 'timeline of AI milestones'; the Commonwealth Artificial Intelligence Resource Center and its 'Guidelines for AI' (pagov.sharepoint.com, not requested; the same host answered a sign-in redirect for IT Central); the Office for Information Technology pages (about-it, geospatial services, State Geospatial Coordinating Board, CODE PA) which describe programs; administrative circulars (the policies page lists a 2024 filter).
- text: |-
    PUBLIC POLICY, effective dates and status. Seeded IT policies print 'Effective Date' and 'Scheduled Review' blocks; several carry effective dates in September and October 2026 and say they replace earlier versions (Information Security Policy, effective October 05, 2026: 'This document replaces, in its entirety, the Information Security Policy, dated January 6, 2025'; Access Management Policy, effective June 10, 2026, replaces the March 11, 2025 version): the library serves one file per title, so no superseded version was seeded. Policy documents are copied as the PDFs print them. The management directives and executive orders print a 'Date:' (not an 'Effective date:'), so their effective_date stays empty.
