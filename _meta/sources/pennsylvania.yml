- id: pa-act-94-2005-breach-of-personal-information-notification
  sha256: "a4ac2206173993b2a23caea46ed7f6e6ca7ec1f3d5dc98d3e22469b33f45d9df"
  url: https://www.palegis.us/statutes/unconsolidated/law-information/view-statute?txtType=PDF&SessYr=2005&ActNum=0094.&SessInd=0
  format: pdf
  citation: Act of Dec. 22, 2005, P.L. 474, No. 94
  title: Breach of Personal Information Notification Act
  doc_type: statute
  jurisdiction: pennsylvania
  issuing_body: Pennsylvania General Assembly
  tags: [data, cybersecurity]
  recheck: monthly
  why_relevant: 'Defines "entity" to include a State agency and binds it: a State agency that determines it is the subject of a breach of the security of the system must notify the affected residents, a State agency contractor must notify the agency, and the Act sets the notice methods, the consumer reporting agency notice and the credit monitoring a breached entity owes (section 5.1 to 5.4 as amended by Acts 151 of 2022 and 33 of 2024). Private businesses and political subdivisions are covered by the same Act; the page serves the whole Act.'
- id: pa-act-69-1999-electronic-transactions
  sha256: "918e96248d24f1b2b2ef75464cd547588cf83aabebc811f85a2167a99bf757a4"
  url: https://www.palegis.us/statutes/unconsolidated/law-information/view-statute?txtType=PDF&SessYr=1999&ActNum=0069.&SessInd=0
  format: pdf
  citation: Act of Dec. 16, 1999, P.L. 971, No. 69
  title: Electronic Transactions Act
  doc_type: statute
  jurisdiction: pennsylvania
  issuing_body: Pennsylvania General Assembly
  tags: [digital-services, governance]
  recheck: monthly
  why_relevant: 'Chapter 5 (Governmental Agencies) lets each governmental agency decide whether and how it creates, retains, sends and accepts electronic records and signatures, with the security and preservation controls it may specify, and requires executive agencies to comply with the standards the Office of Administration publishes on electronic records and the electronic postmark (sections 501 to 503): the statutory base for the Office of Administration''s electronic-records standards. Chapters 1 to 3 and 7 to 9 (validity of electronic records between private parties) ride along because the PDF serves the whole Act.'
