# Nebraska seed list: every instrument this state's part of the corpus holds or knows about.
# Key reference: _meta/sources/README.md. Rules: _meta/CLAUDE.md.
# Discovery 2026-11-12 through the toolkit Fetcher: the Legislature's statute pages (browse-statutes, chapter indexes, the print-friendly
# chapter pages), the NITC Standards and Guidelines index and all 122 files it links, the Governor's executive-order index (309 order rows, 304 linked,
# all governors) and the orders read, the NITC legal and commission pages, the OCIO site (cio.nebraska.gov), rules.nebraska.gov.
# Statute entries are slices of the Legislature's whole-chapter page: `slice: {article: <first section>, part: <last section>}` (the seed
# check allows these two keys; here they are the first and last section number, inclusive). Provisions of non-IT chapters (81, 84, owner decision
# 2026-11-13) use the shared shape slice: {section_start, section_end_before} (the end section is not in the document). A drift run reports any change on the
# chapter page against every slice of it: chapter 86 also holds telecommunications law, so such a report is not necessarily an IT change.
sources:
  - id: ne-rs-86-501-530
    sha256: "3e5e2201afbd7c4d8e1fae1e31f0a0b8299005cb92136197a423551b2da2ce0d"
    url: "https://nebraskalegislature.gov/laws/display-chapters.php?chapter=86"
    format: html
    citation: "Neb. Rev. Stat. sections 86-501 to 86-530"
    title: "Information Technology Infrastructure Act, Neb. Rev. Stat. 86-501 to 86-530"
    doc_type: statute
    jurisdiction: nebraska
    issuing_body: "Nebraska Legislature"
    tags: [governance, oversight, procurement, funding, cloud-resilience]
    slice: {article: "86-501", part: "86-530"}
    recheck: monthly
    why_relevant: "The enabling statute for the Nebraska Information Technology Commission (86-515, 86-516: statewide technology plan, minimum technical standards, guidelines and architectures), the Office of Chief Information Officer (86-519) and the Chief Information Officer (86-520, 86-520.01 IT purchase standards), with the Community Technology and Government Technology Collaboration funds, legislative review, the agency IT plan report (86-524.01) and enterprise projects. 86-511 and 86-521 print as repealed by Laws 2026, LB905 and stay in the slice as printed."
  - id: ne-rs-86-550-568
    sha256: "3e5e2201afbd7c4d8e1fae1e31f0a0b8299005cb92136197a423551b2da2ce0d"
    url: "https://nebraskalegislature.gov/laws/display-chapters.php?chapter=86"
    format: html
    citation: "Neb. Rev. Stat. sections 86-550 to 86-568"
    title: "Intergovernmental Data Services Program Act, Neb. Rev. Stat. 86-550 to 86-568"
    doc_type: statute
    jurisdiction: nebraska
    issuing_body: "Nebraska Legislature"
    tags: [governance, data, cloud-resilience]
    slice: {article: "86-550", part: "86-568"}
    recheck: monthly
    why_relevant: "The intergovernmental data services program run by the Office of Chief Information Officer: the system through which state agencies and local governments share applications and data, the officer and division duties, budget, rules and the revolving fund. 86-553 and 86-566 print as repealed and stay as printed."
  - id: ne-rs-86-569-573
    sha256: "3e5e2201afbd7c4d8e1fae1e31f0a0b8299005cb92136197a423551b2da2ce0d"
    url: "https://nebraskalegislature.gov/laws/display-chapters.php?chapter=86"
    format: html
    citation: "Neb. Rev. Stat. sections 86-569 to 86-573"
    title: "Geographic Information Systems Council, Neb. Rev. Stat. 86-569 to 86-573"
    doc_type: statute
    jurisdiction: nebraska
    issuing_body: "Nebraska Legislature"
    tags: [governance, data]
    slice: {article: "86-569", part: "86-573"}
    recheck: monthly
    why_relevant: "Creates the Geographic Information Systems Council, which sets guidelines and policies for statewide GIS operations and data and advises the Chief Information Officer on information technology policy; the NITC GIS standards (chapter 3) rest on it."
  - id: ne-rs-86-5-100
    sha256: "3e5e2201afbd7c4d8e1fae1e31f0a0b8299005cb92136197a423551b2da2ce0d"
    url: "https://nebraskalegislature.gov/laws/display-chapters.php?chapter=86"
    format: html
    citation: "Neb. Rev. Stat. section 86-5,100"
    title: "Network Nebraska, Neb. Rev. Stat. 86-5,100"
    doc_type: statute
    jurisdiction: nebraska
    issuing_body: "Nebraska Legislature"
    tags: [governance, cloud-resilience, funding]
    slice: {article: "86-5,100", part: "86-5,100"}
    recheck: monthly
    why_relevant: "The Chief Information Officer develops and maintains Network Nebraska, the statewide network for state agencies, local governments and educational entities, aggregates agency demand and sets its cost structure. The section sits in the chapter 86 run of telecommunications sections; only this section of the run is the state network."
  - id: ne-rs-86-611
    sha256: "3e5e2201afbd7c4d8e1fae1e31f0a0b8299005cb92136197a423551b2da2ce0d"
    url: "https://nebraskalegislature.gov/laws/display-chapters.php?chapter=86"
    format: html
    citation: "Neb. Rev. Stat. section 86-611"
    title: "Digital and electronic signatures and electronic communications authorized, Neb. Rev. Stat. 86-611"
    doc_type: statute
    jurisdiction: nebraska
    issuing_body: "Nebraska Legislature"
    tags: [digital-services, cybersecurity]
    slice: {article: "86-611", part: "86-611"}
    recheck: monthly
    why_relevant: "A state agency or political subdivision may accept a digital or electronic signature and an electronic communication (subsection 3); the Secretary of State adopts the rules, which must require an audit trail and security related to the risk of fraud or misuse (subsection 4). The rest of the Uniform Electronic Transactions Act (86-612 to 86-643) is left out (see left_out)."
  - id: ne-rs-86-644
    sha256: "3e5e2201afbd7c4d8e1fae1e31f0a0b8299005cb92136197a423551b2da2ce0d"
    url: "https://nebraskalegislature.gov/laws/display-chapters.php?chapter=86"
    format: html
    citation: "Neb. Rev. Stat. section 86-644"
    title: "Electronic postmark; use by state agency, Neb. Rev. Stat. 86-644"
    doc_type: statute
    jurisdiction: nebraska
    issuing_body: "Nebraska Legislature"
    tags: [digital-services, data]
    slice: {article: "86-644", part: "86-644"}
    recheck: monthly
    why_relevant: "Lets a state agency use the email address of a person it regulates or does business with, and accept a U.S. Postal Service electronic postmark in lieu of certified mail where the sender and receiver consent: how state agencies communicate electronically."
  - id: ne-rs-87-801-808
    sha256: "aa843343b7752d1a84e71f023b36d94d3d687ffd9218684fbeba89fea6ddaffc"
    url: "https://nebraskalegislature.gov/laws/display-chapters.php?chapter=87"
    format: html
    citation: "Neb. Rev. Stat. sections 87-801 to 87-808"
    title: "Financial Data Protection and Consumer Notification of Data Security Breach Act of 2006, Neb. Rev. Stat. 87-801 to 87-808"
    doc_type: statute
    jurisdiction: nebraska
    issuing_body: "Nebraska Legislature"
    tags: [data, cybersecurity]
    slice: {article: "87-801", part: "87-808"}
    recheck: monthly
    why_relevant: "The data breach statute. It is included because it binds state agencies: 87-802 defines \"commercial entity\" to include a \"government, governmental subdivision, agency, or instrumentality\", so an agency that owns or licenses computerized personal information must investigate a breach, notify residents and the Attorney General (87-803) and keep reasonable security procedures (87-808). It also binds private entities; the whole act rides along."
  - id: ne-eo-25-04
    sha256: "65d441a72616796d8b741223af52a6e1922677a70786f77e6da593563803b122"
    url: "http://govdocs.nebraska.gov/docs/pilot/pubs/eofiles/25-04.pdf"
    format: pdf
    citation: "Executive Order No. 25-04"
    title: "Banning the Use or Download of Applications, Software, and Platforms Created or Owned by China-based Companies or Companies Affiliated with the Chinese Communist Party"
    doc_type: executive_order
    jurisdiction: nebraska
    issuing_body: "Office of the Governor"
    tags: [cybersecurity, governance]
    recheck: monthly
    found_via: "Executive Orders index on govdocs.nebraska.gov (row 25-04, filed 03/05/25); the link on the index is eofiles/25-04.pdf"
    why_relevant: "Directs the Office of the Chief Information Officer to investigate and prevent the download and use of applications, software and platforms of China-based companies on state-owned or operated devices, networks and infrastructure. Dated March 5, 2025 (Governor Jim Pillen); no later order on the index rescinds it."
  - id: ne-eo-96-1
    sha256: ""
    url: "http://govdocs.nebraska.gov/docs/pilot/pubs/eofiles/96-1.pdf"
    format: pdf
    citation: "Executive Order No. 96-1"
    title: "Create Information Resources Cabinet"
    doc_type: executive_order
    jurisdiction: nebraska
    issuing_body: "Office of the Governor"
    tags: [governance]
    recheck: monthly
    stub: true
    stub_reason: "The text exists only as a 3-page scan (Adobe Acrobat 6.0 Paper Capture, 298,295 bytes fetched 2026-11-12 through the Fetcher from govdocs.nebraska.gov, the host the Governor's index links; the older host www.nlc.state.ne.us does not resolve). Its text layer is garbled recognition output (for example 'govermwnt', 'te~~~lo users g y', 'Secretary of State' beside 'I v day of January'), so it cannot be mirrored as text. The shared OCR procedure was tried (seeded with ocr: true) and refused: ocrmypdf exited 8 because the PDF is RC4-encrypted with owner restrictions (pdfinfo: 'Encrypted: yes (print:yes copy:yes change:no addNotes:no algorithm:RC4)'), and stripping that encryption is not something the procedure does. Not decrypted by hand. In force: the Governor's order list (309 order rows read) shows no order rescinding it; whether the Cabinet still meets was not found."
    found_via: "Executive Orders index on govdocs.nebraska.gov (row 96-1, Jan. 10, 1996); the link on the index is eofiles/96-1.pdf"
    why_relevant: "Creates the Information Resources Cabinet (Governor E. Benjamin Nelson) to set enterprise-wide information technology infrastructure goals and guidelines and to recommend technology investment allocations."
