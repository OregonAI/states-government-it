    slice: {section_start: "81-1120.27", section_end_before: "81-1120.28"}
    recheck: monthly
    why_relevant: "Sets what state employees and officials may use the state's IT for: \"The facilities of the state's telecommunications systems are provided for the conduct of state business\", with personal use of the state's telecommunications systems, cellular telephones, electronic handheld devices or computers limited to essential personal business kept to a minimum; subsection (2) governs how a legislator's long-distance call records are shown in an audit. NITC 7-101 cites it (81-1120.27(1)). Owner scope decision 2026-11-13 (IT governance provision of a non-IT chapter)."
  - id: ne-rs-84-1204-1205
    sha256: "725a049c533510db3d503ba65da59922af3d9587f586b342de301efad6b39a75"
    url: "https://nebraskalegislature.gov/laws/display-chapters.php?chapter=84"
    format: html
    citation: "Neb. Rev. Stat. sections 84-1204 to 84-1205"
    title: "State Records Board; network manager for the state portal, Neb. Rev. Stat. 84-1204 to 84-1205"
    doc_type: statute
    jurisdiction: nebraska
    issuing_body: "Nebraska Legislature"
    tags: [governance, digital-services, funding]
    slice: {section_start: "84-1204", section_end_before: "84-1205.01"}
    recheck: monthly
    why_relevant: "The Records Management Act's two sections that govern the state's electronic access to public records: the State Records Board shall \"Develop and maintain the portal for providing electronic access to public records or electronic information and services\", \"Provide appropriate oversight of a network manager\", approve fees and may grant funds to an agency \"for the development of programs and technology\" (84-1204); the board may contract a network manager who provides the portal's infrastructure and runs it (84-1205). The rest of the Act (general records management, retention schedules, microfilm) is left out (see left_out). Owner scope decision 2026-11-13 (IT governance provision of a records chapter)."
  - id: ne-rs-84-1205-03
    sha256: "725a049c533510db3d503ba65da59922af3d9587f586b342de301efad6b39a75"
    url: "https://nebraskalegislature.gov/laws/display-chapters.php?chapter=84"
    format: html
    citation: "Neb. Rev. Stat. section 84-1205.03"
    title: "State agency; electronic access to public records; approval required, Neb. Rev. Stat. 84-1205.03"
    doc_type: statute
    jurisdiction: nebraska
    issuing_body: "Nebraska Legislature"
    tags: [governance, procurement, digital-services]
    slice: {section_start: "84-1205.03", section_end_before: "84-1205.04"}
    recheck: monthly
    why_relevant: "A state agency that wants to enter an agreement \"with a private vendor or the network manager to provide electronic access to public records or electronic information and services for a fee\" must request the State Records Board's approval and include the contract and \"any security provisions for the protection of confidential or sensitive records\"; courts and the Legislature report instead. Owner scope decision 2026-11-13 (IT governance provision of a records chapter)."
  - id: ne-rs-84-1205-05
    sha256: "725a049c533510db3d503ba65da59922af3d9587f586b342de301efad6b39a75"
    url: "https://nebraskalegislature.gov/laws/display-chapters.php?chapter=84"
    format: html
    citation: "Neb. Rev. Stat. section 84-1205.05"
    title: "Board; reports, Neb. Rev. Stat. 84-1205.05"
    doc_type: statute
    jurisdiction: nebraska
    issuing_body: "Nebraska Legislature"
    tags: [governance, oversight]
    slice: {section_start: "84-1205.05", section_end_before: "84-1205.06"}
    recheck: monthly
    why_relevant: "The State Records Board \"shall provide annual reports to the Executive Board of the Legislative Council and Nebraska Information Technology Commission\" on the portal and electronic access to public records: the oversight reporting line of the state portal to the IT Commission. Owner scope decision 2026-11-13 (IT governance provision of a records chapter)."
  - id: ne-rs-84-1228
    sha256: "725a049c533510db3d503ba65da59922af3d9587f586b342de301efad6b39a75"
