  - id: ne-rs-81-1117
    sha256: "920c6dab2677d1c6c7b3430958283d671320ffe53aadc7ba1b721621883cc6df"
    url: "https://nebraskalegislature.gov/laws/display-chapters.php?chapter=81"
    format: html
    citation: "Neb. Rev. Stat. section 81-1117"
    title: "Information management services administrator; powers, duties, and responsibilities; Information Management Revolving Fund, Neb. Rev. Stat. 81-1117"
    doc_type: statute
    jurisdiction: nebraska
    issuing_body: "Nebraska Legislature"
    tags: [governance, procurement, oversight, funding]
    slice: {section_start: "81-1117", section_end_before: "81-1117.01"}
    recheck: monthly
    why_relevant: "A section of the State Administrative Departments chapter that governs state IT: \"No state agency shall hire, purchase, lease, or rent any information management item listed in subsection (1) of this section without the written approval of the information management services administrator\" (subsection (2)(e)); the administrator, subject to review and approval by the Chief Information Officer, reviews agency computer applications and information management installations, sets the system of charges for information management services and the Information Management Revolving Fund, and defines standards and common data elements and approves or disapproves separate data banks. Printed with Laws 2026, LB905 (Operative Date: July 1, 2026, already passed). Owner scope decision 2026-11-13 (IT governance provision of a non-IT chapter). Cited by NITC 1-204 and 1-205."
  - id: ne-rs-81-1120-02
    sha256: "920c6dab2677d1c6c7b3430958283d671320ffe53aadc7ba1b721621883cc6df"
    url: "https://nebraskalegislature.gov/laws/display-chapters.php?chapter=81"
    format: html
    citation: "Neb. Rev. Stat. section 81-1120.02"
    title: "Communications system; terms defined, Neb. Rev. Stat. 81-1120.02"
    doc_type: statute
    jurisdiction: nebraska
    issuing_body: "Nebraska Legislature"
    tags: [governance]
    slice: {section_start: "81-1120.02", section_end_before: "81-1120.03"}
    recheck: monthly
    why_relevant: "Defines the terms of the act that governs the state's communications system: the division is \"the division of communications of the office of Chief Information Officer\" and the communications system is \"the total communications facilities and equipment owned, leased, or used by all departments, agencies, and subdivisions of state government\". It says who the IT authority is and what its system covers; NITC 1-101 takes its definition of communications from it. Owner scope decision 2026-11-13 (IT governance provision of a non-IT chapter)."
  - id: ne-rs-81-1120-17
    sha256: "920c6dab2677d1c6c7b3430958283d671320ffe53aadc7ba1b721621883cc6df"
    url: "https://nebraskalegislature.gov/laws/display-chapters.php?chapter=81"
    format: html
    citation: "Neb. Rev. Stat. section 81-1120.17"
    title: "Division of communications; powers and duties, Neb. Rev. Stat. 81-1120.17"
    doc_type: statute
    jurisdiction: nebraska
    issuing_body: "Nebraska Legislature"
    tags: [governance, procurement]
    slice: {section_start: "81-1120.17", section_end_before: "81-1120.18"}
    recheck: monthly
    why_relevant: "Powers and duties of the Office of Chief Information Officer's division of communications over the state's communications systems: \"To coordinate the purchase, lease, and use of communications services equipment and facilities for state government\", \"approve all purchases and contracts for such communications activities\", consolidate agency radio and telephone systems, and standardize policies for their use so that systems in the domain of public safety or security are not compromised. Printed with Laws 2026, LB905 (Operative Date: July 1, 2026, already passed). Cited by NITC 1-204. Owner scope decision 2026-11-13 (IT governance provision of a non-IT chapter)."
  - id: ne-rs-81-1120-20
    sha256: "920c6dab2677d1c6c7b3430958283d671320ffe53aadc7ba1b721621883cc6df"
    url: "https://nebraskalegislature.gov/laws/display-chapters.php?chapter=81"
    format: html
    citation: "Neb. Rev. Stat. section 81-1120.20"
    title: "Joint use of communications; departments; agencies; cooperation, Neb. Rev. Stat. 81-1120.20"
    doc_type: statute
    jurisdiction: nebraska
    issuing_body: "Nebraska Legislature"
    tags: [governance, procurement]
    slice: {section_start: "81-1120.20", section_end_before: "81-1120.21"}
    recheck: monthly
    why_relevant: "Binds state agencies to \"coordinate all communications services or facilities procurement through the Director of Communications\" and to cooperate in consolidating and jointly using communications systems: the procurement review of the Office of the Chief Information Officer that NITC 1-204 rests on. Owner scope decision 2026-11-13 (IT governance provision of a non-IT chapter)."
