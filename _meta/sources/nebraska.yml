  - id: ne-nac-209-1
    sha256: ""
    url: "https://rules.nebraska.gov/"
    format: html
    citation: "209 NAC 1"
    title: "Title 209, Chapter 1. Records Relating to the Nature, Location, or Function of Cybersecurity"
    doc_type: rule
    jurisdiction: nebraska
    issuing_body: "Nebraska Information Technology Commission"
    tags: [cybersecurity, data]
    recheck: monthly
    stub: true
    stub_reason: "The only official source of the codified rule is the Secretary of State's rules portal, https://rules.nebraska.gov/. The Fetcher got HTTP 200 and 803 bytes from it: an empty script shell (\"You need to enable JavaScript to run this app.\", one script bundle), no rule text, and the same 803 bytes from the static-looking paths tried under www.nebraska.gov/rules-and-regs/regsearch/. The text is reachable only through the portal's own JavaScript, which is not a page a visitor's link points to and is not called. The rule exists: the Commission's hearing notice (https://nitc.nebraska.gov/about/legal/docs/2025/notice-of-public-hearing-209-nac-1.pdf, read) proposes it as implementing Neb. Rev. Stat. 84-712.05(26), and the certificate of adoption in the July 11, 2025 meeting packet (https://nitc.nebraska.gov/commission/meetings/docs/2025/07-11-2025-docs.pdf, read) says the Commission adopted it on July 11, 2025. The NITC legal page (https://nitc.nebraska.gov/about/legal/) offers only the DRAFT (209-20nac-201-draft-2025-02-24.pdf, headed \"209 NAC 1 (DRAFT)\"), which is not the text of record, so it is not mirrored."
    why_relevant: "The only administrative rule found for the Commission: it lists the categories of cybersecurity records a public entity may withhold under Neb. Rev. Stat. 84-712.05(26) (personnel, risk management, technical controls, monitoring logs, incident response and others)."
