  expected:
  - id: co-crs-24-85
    quote: may require that the contractor's compliance with accessibility standards for an individual
      with a disability adopted by the office of information technology pursuant to section 24-85-103
      is determined and attested to by a qualified third party
    where: 24-85-104 (5)(d)
  - id: co-oit-ts-oea-001
    quote: This standard shall be used by employees of OIT, agencies supported by OIT, and vendors contracted
      by OIT or its stakeholders
    where: 2. Scope
  - id: co-ccr-8-1501-11
    quote: The rules apply to all information and communication technology (ICT) in active use, whether
      public-facing or internal-facing, that the public entity provides or makes available directly or
      through contractual, licensing, or other arrangements.
    where: 11.2 Scope and Purpose, C
