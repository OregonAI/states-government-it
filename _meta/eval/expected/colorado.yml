- number: 20
  expected: []
  none_reason: Searched keyword for GovRAMP, FedRAMP, StateRAMP, authorization and cloud across statutes,
    rules, policies and standards and read the cloud hits (8 CCR 1501-12 definition of cloud service,
    TS-DBS-014, TS-DAT-001, CISP-003 section 8). None requires or accepts GovRAMP or FedRAMP authorization
