- number: 12
  expected:
  - id: co-crs-2-3-pt17
    quote: '"Artificial intelligence" or "artificial intelligence system" means any machine-based system
      that, for any explicit or implicit objective, infers, from the inputs the system receives, how to
      generate outputs'
    where: 2-3-1701 (1)
  - id: co-oit-genai-policy
    quote: 'GenAI: An artificial intelligence technology that creates synthetic digital content of images,
      videos, audio, text, and other digital content from large bodies of data in response to user prompts.'
    where: 5. Definitions
- number: 13
  expected:
  - id: co-oit-genai-policy
    quote: Refer all high-risk cases to OIT's Chief Information Officer, or designee, in consultation
      with the Governor's Office and the relevant state agency's executive leadership for review.
    where: 6. Responsibilities, Office of Information Technology Responsibilities
  - id: co-crs-2-3-pt17
    quote: There is created the artificial intelligence impact task force for the purposes of considering
      issues and proposing recommendations regarding protections for consumers and workers
    where: 2-3-1707 (2)(a)
- number: 14
  expected:
  - id: co-oit-genai-policy
    quote: This policy remains in effect until superseded or rescinded by the State Chief Information
      Officer.
    where: 8. Expiration
  - id: co-crs-2-3-pt17
    quote: 'The task force shall consider issues and propose policy recommendations to the committee related
      to:'
    where: 2-3-1707 (3)
- number: 15
  expected:
  - id: co-oit-genai-policy
    quote: This also applies to third-party vendor use cases and projects.
    where: 2. Policy
- number: 16
  expected:
  - id: co-oit-genai-policy
    quote: GenAI used by state agencies may assist a human reviewer but may not independently make determinations
      materially impacting individuals or entities.
    where: 6. Responsibilities, Human Review of Consequential Decisions
  stub_would_answer:
