  expected:
  - id: co-ccr-8-1501-5
    quote: An annual information security plan created by the Office of Information Security within OIT
      for State Agencies. The ECSP includes an assessment of current risk, covers incident response and
      disaster recovery
    where: 5.4 Definitions (Enterprise Cybersecurity Plan)
  - id: co-crs-24-37-5
    quote: "the department of law, the department of state, the department of treasury, or state-supported institutions of higher education, for the purpose of providing disaster recovery services."
    where: "24-37.5-106 (3)"
  - id: co-crs-24-37-5
    quote: "\"Disaster recovery\" means the provisioning of the office's provided services for operational recovery, readiness, response, and transition of information technology applications, systems, or resources."
    where: "24-37.5-102 (8)"
  - id: co-oit-cisp-002
    quote: Public agencies must implement incident response, continuity management, and contingency planning
      in accordance with this policy.
    where: 4. Policy
