  expected:
  - id: co-crs-24-33-5-pt19
    quote: "Review the need to conduct risk assessments of local government systems, providing additional cybersecurity services to local governments, and proposing necessary statutory or policy changes;"
    where: "24-33.5-1902 (1)(b)"
  - id: co-crs-24-33-5-pt19
    quote: "Develop a whole-of-state cybersecurity approach for the state and for local governments, including the coordination and setting of strategic statewide cybersecurity goals, roadmaps, and best practices;"
    where: "24-33.5-1902 (1)(a)"
  - id: co-crs-24-37-5
    quote: "The chief information officer may enter into contracts with any local government, state agency, or political subdivision of the state, including the legislative and judicial departments"
