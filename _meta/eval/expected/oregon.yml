- number: 17
  expected: []
  none_reason: 'Searched all 49 Oregon documents (keyword: accessib, WCAG, Section 508, ADA, disabilit,
    coordinator; read every hit). No instrument names a technology accessibility coordinator or sets a
    vendor accessibility verification process. The only on-topic text is one AI-specific mitigation in
    or-eis-ai-attachment-b (Risk 9, ''Ensure AI systems comply with applicable accessibility standards'')
    and a mention of accessibility in a principle of or-das-107-004-190; neither concerns a coordinator
    or vendor verification. ORS 276A mentions accessibility only for the transparency website, open data
    and information systems generally (276A.253, 276A.365), with no coordinator or vendor duty. Oregon
    seeds no accessibility instrument.'
