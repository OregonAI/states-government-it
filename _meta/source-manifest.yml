    why_relevant: "Requires a written data-sharing agreement before an agency shares category 3 or higher data with a contractor, conforming to the data-sharing policies the Office of Cybersecurity sets under RCW 43.105.054. Cited by WaTech policies DATA-03 and DATA-04. One section of the state procurement chapter (the rest is left out, see the left-out notes)."
