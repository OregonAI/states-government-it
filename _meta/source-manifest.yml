  # ---- California found and left out (the reason is recorded here)
  #
  # Access, as fetched 2026-11-11 with the toolkit Fetcher (shipped User-Agent, curl transport on a challenge):
  #  - www.cdt.ca.gov, www.gov.ca.gov, www.genai.ca.gov, www.govops.ca.gov, oal.ca.gov: reached (HTTP 200). An earlier pass recorded them as refused: the refusal was scored on the Python client's
  #    connection, not on the declared identity (Cloudflare managed challenge to httpx, HTTP 200 to curl with the same User-Agent).
  #  - Still refused: leginfo.legislature.ca.gov (HTTP 403, challenge, also to curl), www.sco.ca.gov (challenge), www.library.ca.gov (HTTP 403, no challenge header). Statutes stay on the Legislature's
  #    bulk download (downloads.leginfo.legislature.ca.gov).
  #  - The CCR is published through Westlaw (OAL contract); oal.ca.gov now answers but links to it. Nothing about the two seeded Secretary of State chapters changes.
  #  - SIMM 5300-A is not public (its entry is a stub, reason in the entry).
  #
  # Statutes found and not seeded (found by the table of contents' chapter headings in the bulk download, and by web search; classified by heading unless the entry says it was read):
  #  - Gov. Code 11135 (nondiscrimination in state-funded programs): amended in 2016 by SB 1442, the bill that added 7405; read only its opening words. General civil rights law
  #    with, at most, an electronic technology provision. OWNER DECISION.
  #  - Gov. Code chapter 7.5 of Part 1, Division 3, Title 2 (11790, Hawkins Data Center): the Department of Justice's data center; law-enforcement technology is out of scope.
  #  - Gov. Code chapter 5.8 of the same part (11549.50-11549.59, Office of Broadband and Digital Literacy): broadband is out of scope.
  #  - Gov. Code chapter 10 of the same part (11850-11895, FISCal, the state financial information system): a statute on one state IT system (listed in the table of contents; its
  #    text was not read). OWNER DECISION, the same class as Colorado's 24-30-209.
  #  - Gov. Code 8592.1-8592.22 (Public Safety Communication Act of 2002; Manny Alert Act): emergency communications, out of scope.
  #  - Gov. Code 7929.200, 7929.205 and 7929.215 and the rest of the Public Records Act (7920.000 et seq.): general public-records law; only 7929.210 (information security records) is seeded.
  #  - Pub. Contract Code 22101-22109 (Acquisition of Electronic Data Processing): sits in Part 3, 'Contracting by Local Agencies'; local government is out of scope. Pub. Contract Code 22350-22355
  #    (Part 5.5, Year 2000 Problem Vendor Compliance): not read; a 1999 vendor-compliance policy. Pub. Contract Code 6611 (Innovation Procurement Sprints, named by web search results on
  #    Executive Order N-04-19) was not read.
  #  - The general state procurement law (Pub. Contract Code 10100 et seq., 10290 et seq.) and the State Contracting Manual: left out as Oregon, Washington and Colorado left theirs out (OWNER DECISION);
  #    only the IT-specific chapter (12100-12113) is seeded.
  #  - Civ. Code 1798.80 et seq. (customer records, breach notice by businesses), the California Consumer Privacy Act (1798.100 et seq.), Bus. & Prof. Code 22757.10-22757.16 (Transparency in Frontier
  #    Artificial Intelligence Act), Civ. Code 3110-3111 (AI training data transparency), Bus. & Prof. Code 4999.8-4999.9 (AI health advice) and Health & Safety Code 1339.75 (AI in health care
  #    services): private-sector obligations, out of scope (the Transparency in Frontier AI Act has its own CDT initiative page; its obligated parties are developers, not state agencies).
  #  - Education Code 35265-35267 and 89270 (cybersecurity in schools and the CSU): K-12 and higher education, out of scope.
  #  - Penal Code computer crime (502): crime law, out of scope.
  #
  # Rules:
  #  - Division 8 conflict-of-interest codes of the Department of Technology (chapter 119 of Division 8 and the former Department of Information Technology's chapter 74), seen in a web search,
  #    are out of scope. No other CCR chapter on state IT was found; Westlaw could not be read, so the search is not exhaustive.
  #  - Whether more CCR chapters belong (for example other Secretary of State standards for electronic records) is an owner decision; the two seeded ones are those the web search named.
  #
  # Executive orders: the CDT list has 20 orders. Entries above: N-12-23, N-5-26, N-6-26 and N-9-26 (documents), N-30-25 (a stub: pages 2-4 of its PDF are scans) and N-04-19 (a stub: its PDF is a scan). B-34-15 is a document (archive page).
  #  - N-9-26 (18 Sep 2026, the AI oversight order the Governor's release page headlines 'to accelerate independent oversight and advance the creation of an AI kill switch') is not on the CDT list
  #    (the list's newest row is N-6-26); it is seeded because it is an AI instrument of the state's own government.
  #  - Seeded as stubs (the reason is in each entry), because no official page or file carrying the order's own text could be fetched: S-03-10 (2/9/2010), S-16-04 (9/16/2004), S-13-04 (8/24/2004), D-59-02 (7/1/2002), D-57-02
  #    (5/31/2002), D-17-00 (9/9/2000), D-10-99 (10/16/1999). The Governor's current and archive sites (www.gov.ca.gov category pages back to January 2019; www.archive.gov.ca.gov, the Brown administration's
  #    archive) do not hold Schwarzenegger or Davis orders; the State Library's list of executive orders (https://www.library.ca.gov/government-publications/executive-orders/) answers HTTP 403
  #    to the Fetcher with curl, and the page that holds the list loads its table by script. Web search found only news and agency letters about them (a Department of Finance budget letter cites S-03-10), which are not
  #    the orders. Whether any of these older orders is still in force could not be checked.
  #  - Judged from the CDT titles only, out of scope or borderline: S-06-09 ICT Digital Literacy, S-06-07 Healthcare Improvement, S-21-06 Expanding Broadband Access and Usage in California,
  #    S-12-06 eHealth Action Forum, S-04-06 Emergency Preparedness, S-5-04 California Performance Review, D-55-02 Banning No-Bid State Contracts.
  #  - SIMM 18 mentions Executive Order S-09-09 (8 June 2009, state contract expenditures); it is not on the CDT list and was not read.
  #  - TL 22-01 prints Executive Order N-6-22 (sanctions against Russia, 4 March 2022); not an IT order.
  #
  # Technology Letters not seeded:
  #  - TL 25-06: Clarification on Procuring Business Telecommunications Systems and Services Including Contact Center Services. Active; telecommunications procurement: out of scope.
  #  - TL 22-01: Procurement Guidance for Executive Order N-6-22. Active; procurement guidance for Executive Order N-6-22 (sanctions against Russia): not an IT governance instrument. The index links it to the TL 22-02 page; its own page is https://www.cdt.ca.gov/policy/technology-letters/22-01/ (listed in the CDT's sitemap, https://www.cdt.ca.gov/sitemap_index.xml, fetched 2026-11-11).
  #  - TL 18-01: California Cybersecurity Maturity Metrics. Superseded by PS-014.
  #  - TL 17-06: Update to Cloud Computing Policy – Infrastructure and Platform. Superseded by TL 23-03.
  #  - TL 17-05: Internet Domain Name Policy. Superseded by TL 21-02.
  #  - TL 16-09: Tribal Consultation Policy. Active; a tribal consultation policy, not an IT governance instrument.
  #  - TL 16-01: Cloud Productivity Solutions. Superseded by TL 17-06.
  #  - TL 14-07: Project Approval Lifecycle, Stage 1 Business Analysis and Stage 2 Alternatives Analysis. Superseded by TL 15-02.
  #  - TL 14-06: Mobile Computing Device Request. Superseded by TL 17-02.
  #  - TL 14-04: Cloud Computing Policy. Superseded by TL 17-06.
  #  - TL 14-03: Register to Vote Graphic Image Requirement. Active; a Register to Vote graphic image requirement for websites, not an IT governance instrument.
  #  - TL 14-02: Update Feasibility Study Report (FSR) to Align with Stage 1 Business Analysis. Superseded by TL 15-02.
  #  - TL 14-01: Mobile Phone Usage. Superseded by TL 17-02.
  #  - TL 13-05: Information Technology Capital Plan (ITCP) Instructions. Superseded by TL 14-05.
  #  - TL 13-03: Transition of Information Technology Project Procurement Authority. Superseded by TL 18-06.
  #  - TL 13-02: Project Approval Lifecycle, Stage 1 Business Analysis. Superseded by TL 15-02.
  #  - TL 13-01: Smartphone Usage. Superseded by TL 14-01.
  #  - TL 12-15 FAQs: Encrypting Mainframe and Server Tapes FAQs. same address as TL 12-15 on the index (one PDF); not a separate file.
  #  - TL 12-14: Updated Information Technology Cost Report. Superseded by TL 17-01.
  #  - TL 12-13: Information Technology Capital Plan Instructions and Templates for 2012-13. Superseded by TL 13-05.
  #  - TL 12-12: Process to Purchase Tablet Devices. Superseded by TL 14-06.
  #  - TL 12-06: Telecommunication Procurement Authority. Active; telecommunications procurement: out of scope.
  #  - TL 12-01: Feasibility Study Report (FSR) Improvement Quick Wins. Superseded by TL 15-02.
  #  - TL 11-02: Postponement of 2012 IT Cost Reporting. Superseded by TL 12-14.
  #  - TL 23-02: Business Telecommunications Systems and Services Policy. Active; telecommunications procurement: out of scope.
  #  - TL 26-02 prints an issue date of 9/25/2026 on the index; the index is dated 2026-11-11, so it is not a future date (an earlier pass called it a typo; that was a stale claim).
  #
  # Information Technology Policy Letters not seeded (31 rows; 18 of the 20 Active rows are entries):
  #  - ITPL 11-06: Information Technology Capital Plan Instructions and Templates for 2011-12. Superseded by TL 13-05.
  #  - ITPL 11-05: Information Technology Acquisition Plan Process Revisions. Rescinded 12/9/2011.
  #  - ITPL 11-04: Changing References from Predecessor Organizations to the California Technology Agency. Active; a name-change notice (what to call the agency); it sets no IT requirement. OWNER DECISION if the notice belongs.
  #  - ITPL 11-02: Service Contracts With Information Technology Components. Superseded by TL 12-04.
  #  - ITPL 11-01: Department Director Certification of Information Technology Acquisition Plans. Rescinded 12/9/2011.
  #  - ITPL 10-18: Information Technology Expenditure Reporting and Cost Optimization. Superseded by TL 11-2.
  #  - ITPL 10-12: Reducing Charges for 411 Directory Assistance. Active; telephone directory-assistance charges: telecom, out of scope.
  #  - ITPL 10-11: Information Technology Capital Plan Instructions, Economic Analysis Worksheet Revisions, and Reporting Clarifications. Superseded by TL 13-05.
  #  - ITPL 10-04: Low Power Office Computing. Superseded by TL 12-3.
  #  - ITPL 09-06: IT Acquisition. Rescinded 12/9/2011.
  #  - ITPL 09-04: Computer Room Construction. Superseded by TL 12-5.
  #  - ITPL 09-02: Information Technology Capital Planning Process, Forms and Instructions. Superseded by TL 13-05.
  #  - ITPL 09-01: California Project Management Methodology and Other Associated Information. Superseded by TL 16-04.
  #
  # SAM chapters not seeded: 1600 (records management), 4500 and 4600 (telecommunications), the IT fiscal sections inside chapter 6000 (6000/6700) and automated accounting systems inside 7200
  # (7200/7260) named on the CDT key policies page (parts of chapters whose other sections are not IT), and every non-IT chapter. 'Market Research' and the Statewide Forms program: not read.
  #
  # Other CDT pages seen and not seeded (the CDT sitemap, fetched 2026-11-11): 'Schedule for submission of Technology Recovery Plans' (https://www.cdt.ca.gov/security/policy/schedule-for-submission-of-technology-recovery-plans/):
  # a table of due dates by state entity (some entity names are outdated), not an instrument; the schedule policy is SIMM 5330-C. The policy-update announcements (PS-0nn, for example PS-033, a new
  # procurement process for GenAI office productivity tools) and 'Tech Alerts' (TA-25-05) announce changes and options: covered by the watch entry for the announcements page. The SIMM/SAM revision-summary
  # pages (https://www.cdt.ca.gov/policy/simm-sam-history/) list changes to the manuals; they are history, not instruments. Budget letters (Department of Finance) are outside the CDT library.
  # The 'Policy/Guidelines Update' PG-001 (January 2018) and the SIMM 05A page's links to superseded letters are not seeded.

  # ---- Index pages to watch (additions and removals go through seed-list review)
