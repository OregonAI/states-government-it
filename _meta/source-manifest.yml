  # ==== Colorado (seed list proposed 2026-11-10/11; every statute entry below was read in the fetched title files) ====
  #
  # ---- Statutes: Colorado Revised Statutes 2026, the official title files of the Office of Legislative Legal
  # ---- Services (https://olls.info/crs/). The source is ONE Word-HTML file per title (Title 24 is 22 MB), so each
  # ---- entry is a slice of it: `slice: {article: n}` or `{article: n, part: m}` (crs_html_to_text in src/ingest.py).
  # ---- Entries cut from one title file share its url on purpose; the seed check keys uniqueness on url plus slice.
  - id: co-crs-24-37-5
    sha256: "5679f4e4d99e376a783af2697f19afb11a07298fecb048dbbd60d92aa5f1fe7c"
    url: https://olls.info/crs/crs2026-title-24.htm
    format: html
    citation: "C.R.S. title 24, article 37.5"
    title: "Office of Information Technology"
    doc_type: statute
    jurisdiction: colorado
    issuing_body: "Colorado General Assembly; published by the Office of Legislative Legal Services"
    tags: [governance, oversight, funding, procurement, cybersecurity, data, digital-services, cloud-resilience]
    recheck: monthly
    slice: {article: "37.5"}
    why_relevant: "The enabling statute of the Governor's Office of Information Technology (OIT) and its chief information officer: creation of the office and the information technology revolving fund (24-37.5-103), the office's roles and its duty to establish, maintain and enforce information technology oversight and standards (24-37.5-105), state agency responsibilities (24-37.5-105.2), the CIO's duties and rulemaking power (24-37.5-106), the information security part (part 4: chief information security officer, agency information security plans, security incidents), the interdepartmental data protocol and government data advisory board (part 7), asset inventory, budget request and technical debt reports (part 8). The source file serves the whole article, so the Colorado broadband office (part 9, out of scope) comes with it, as the broadband sections came with ORS chapter 276A."
  - id: co-crs-24-37-7
    sha256: "5679f4e4d99e376a783af2697f19afb11a07298fecb048dbbd60d92aa5f1fe7c"
    url: https://olls.info/crs/crs2026-title-24.htm
    format: html
    citation: "C.R.S. title 24, article 37.7"
    title: "Statewide Internet Portal Authority"
    doc_type: statute
    jurisdiction: colorado
    issuing_body: "Colorado General Assembly; published by the Office of Legislative Legal Services"
    tags: [digital-services, governance]
    recheck: monthly
    slice: {article: "37.7"}
    why_relevant: "Creates the statewide internet portal authority and sets its mission: the officially recognized statewide internet portal giving the public, state agencies and local governments one-stop electronic access to information, products and services (24-37.7-105)."
  - id: co-crs-24-33-5-pt19
    sha256: "5679f4e4d99e376a783af2697f19afb11a07298fecb048dbbd60d92aa5f1fe7c"
    url: https://olls.info/crs/crs2026-title-24.htm
    format: html
    citation: "C.R.S. title 24, article 33.5, part 19"
    title: "Colorado Cybersecurity"
    doc_type: statute
    jurisdiction: colorado
    issuing_body: "Colorado General Assembly; published by the Office of Legislative Legal Services"
    tags: [cybersecurity, governance]
    recheck: monthly
    slice: {article: "33.5", part: "19"}
    why_relevant: "Creates the Colorado cybersecurity council within the Department of Public Safety, as a steering group developing cybersecurity policy guidance for the Governor and a whole-of-state cybersecurity approach for the state and local governments (24-33.5-1902), and the cyber operation center, cybersecurity education and research provisions and cybersecurity cash fund (24-33.5-1903 to 1906)."
  - id: co-crs-24-73
    sha256: "5679f4e4d99e376a783af2697f19afb11a07298fecb048dbbd60d92aa5f1fe7c"
    url: https://olls.info/crs/crs2026-title-24.htm
    format: html
