# Every upstream source this corpus consumes. Human-approved via PR BEFORE any
# ingestion (review gate #1).
#
# WHICH KEYS THE TOOLKIT ACTUALLY READS (corpus_toolkit/sources/changes.py):
#   url     REQUIRED. Missing it raises KeyError mid-run, not a clean error.
#   format  Strongly recommended. Without it the format is INFERRED FROM THE URL
#           EXTENSION — and an extensionless URL that actually serves a PDF is
#           inferred as html, so drift detection runs an HTML-to-text converter
#           over PDF bytes and reports a change EVERY RUN, FOREVER. Declare it
#           whenever the URL does not end in a real extension.
#   id      Used to name the snapshot and report which source drifted.
#
# Everything else below is for humans and for this repo's own ingester; the
# toolkit ignores it. That is fine — record what your reviewers need.
#
# sources:
#   - id: ""                # -> _meta/snapshots/<id>.<format>
#     url: ""               # REQUIRED
#     format: pdf           # html | pdf | json | xlsx | ... declare it explicitly
#     citation: ""
#     title: ""
#     doc_type: ""
#     recheck: monthly | quarterly | annual | biennial
#     sha256: ""            # filled at first fetch
#     why_relevant: ""
#     references_out: []
#     identity_text: ""     # optional, PDF policies/standards only: a phrase the document itself
#                           # prints, which the ingester requires before it writes anything. Used
#                           # when the printed title differs from `title` and the policy number is
#                           # not printed. Without it: the citation's policy number, else the title.
sources:

  # ---- Statute: Oregon Revised Statutes
  - id: or-ors-276a
    sha256: "0e26bc1b159f6bf4cf639a7bfaabfebcc6971fb3d78de4147ccc8925b142a663"
    url: https://www.oregonlegislature.gov/bills_laws/ors/ors276A.html
    format: html
    citation: ORS chapter 276A
    title: Chapter 276A - Information Technology (2025 Edition)
    doc_type: statute
    jurisdiction: oregon
    issuing_body: Oregon Legislative Assembly; published by the Legislative Counsel Committee
    tags: [governance, oversight, funding, procurement, cybersecurity, data, ai, digital-services, cloud-resilience]
    recheck: monthly
    why_relevant: 'The State CIO enabling statute (276A.200-276A.209: State CIO, oversight of state IT,
      State Information Technology Operating Fund) and the cybersecurity statutes (276A.300-276A.335 information
      systems security; 276A.550-276A.575 Oregon Cybersecurity Center of Excellence and Oregon Cybersecurity
      Advisory Council), plus IT quality management (276A.223), funding request review (276A.226) and enterprise
      IT strategy and portfolio oversight (276A.230-276A.242), covered products on state IT assets incl.
      AI (276A.340-276A.348), open data and Chief Data Officer (276A.350-276A.374), Electronic Government
      Portal (276A.270-276A.276) and GIS (276A.500-276A.515). The source serves the whole chapter as one
      page, so the broadband sections (276A.400-276A.424, out of scope) come with it.'

