  # ---- Policy: Statewide Information Management Manual (SIMM) and the State's GenAI guidelines, California Department of Technology
  # Rebuilt 2026-11-11 from bytes fetched with the toolkit Fetcher using its curl transport (Fetcher(curl_on_challenge=True), toolkit ADR-0018): www.cdt.ca.gov challenges the
  # Python (httpx) client with a Cloudflare managed challenge (HTTP 403, cf-mitigated: challenge) and answers system curl, sending the same honest OregonAI User-Agent, with HTTP 200.
  # Sources: the SIMM index https://www.cdt.ca.gov/policy/simm/ (29 rows: 19 policies, 10 guidelines), each section's own page, the sub-pages of SIMM 19 (19A-19H), 40, 55 and 5300,
  # and the files they link. Granularity: one entry per file or page that carries an instrument. Link text is the title as printed, with the file-format marker "(PDF)", "(DOCX)",
  # "(XLSX)" and the leading "A:" or "Exhibit B1" label removed. The section landing pages that only list files (SIMM 15, 17 apart, 19 and 19A-19H, 22, 25, 30, 45, 50, 55, 58, 60, 66, 71, 80,
  # 110-141, 150, 160, 170, 180, 5300) are not documents: each file they list is an entry; SIMM 05A, 10, 18, 40A, 40B, 55A, 55D, 5305-B, 5305-B/C FAQs, 5355-B and 5360-A are web pages that
  # are the instrument and are documents. A PDF with a text layer is a document. A fill-in form, certification, transmittal or template PDF is a stub (reason: form or template); a
  # Word file is a stub (reason: Word file), for a later step; a spreadsheet is a stub (reason: spreadsheet); a scan with no text layer is a stub (reason: OCR needed).
  # Left out of the SIMM layer: SIMM 45 Appendices A, B and D (the page marks them Retired); the SIMM 5355-B PDF (the same standard as its web page, which is the entry); the Cal-CSIRS and SAFE
  # designee forms, FAQs and user guide on the SIMM 5300 page (operating forms and a system how-to, not instruments); the SAM 5300 'People, Process and Technology: A Navigational Guide'
  # PDF on that page (a guide to the SAM and SIMM 5300 material, not an instrument; OWNER DECISION); the 'Statewide Enterprise Architecture Program - FAQs' item on SIMM 58 (not a file); and links on
  # the SIMM 5355-B page to earlier copies of other standards that now answer 404 (SIMM-5305_A_2023-12.pdf, SIMM-5345-A-...-Final.pdf, SIMM-5355-A.pdf under /wp-content/uploads/2023, 2025 and
  # 2019): the current copies are the entries from the SIMM 5300 page.
  # The SIMM 5305-F and SIMM 150 risk assessments are documents: each prints a revision history, a table of contents, purpose and instructions as well as its questions.
  # The identity check compares the PDF or page with the entry's title, or with its identity_text where the printed title differs.
