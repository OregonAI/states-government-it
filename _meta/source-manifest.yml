    why_relevant: 'The state''s information technology acquisition law: 12100 finds that ''the unique aspects of information technology goods and services'' warrant a separate chapter; the Department of General Services and the Department of Technology maintain IT acquisition policies in the State Administrative Manual (12102, 12102.1), award rules for large-scale systems integration projects (12102.2), and postevaluation of IT services contracts (12102.3).'
  - id: ca-gov-16-5
    url: https://downloads.leginfo.legislature.ca.gov/pubinfo_2025.zip
    format: json
    citation: Cal. Gov. Code § 16.5
    title: 'Government Code section 16.5: Digital signatures in written communications with a public entity'
    doc_type: statute
    jurisdiction: california
    issuing_body: California Legislature
    tags: [digital-services, governance]
    recheck: monthly
    slice: {code: GOV, section: '16.5'}
    why_relevant: 'The digital-signature statute for written communications with a public entity: a digital signature has the force of a manual signature if it embodies the attributes listed (16.5(a)), including that it ''conforms to regulations adopted by the Secretary of State'' (16.5(a)(5)). Those regulations are the Secretary of State''s Cal. Code Regs., tit. 2, div. 7, ch. 10 (ingested below), whose notes cite this section as their authority.'
