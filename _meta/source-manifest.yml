  # ---- Executive orders (Governor's order list; EO 23-26 and 26-26 are scans read by OCR, EO 16-13 is a stub: its OCR failed the figure gate)
  - id: or-eo-16-13
    sha256: "c98a066e73ac17694ad74204e2122fee7871761fd822acf8aba1ac10486e2f2c"
    url: https://www.oregon.gov/gov/eo/eo_16-13.pdf
    format: pdf
    citation: Executive Order No. 16-13
    title: Unifying Cyber Security in Oregon
    doc_type: executive_order
    jurisdiction: oregon
    issuing_body: Office of the Governor
    tags: [cybersecurity, governance]
    recheck: monthly
    stub: true
    stub_reason: "A scan with no text layer, read 2026-11-11 by the two-engine OCR procedure and NOT promoted: the engines agree on the words (0.985) but on only 75% of the 23 figures (tesseract's default layout) or 81% (page-segmentation mode 4), under the 90% bar. Tesseract drops the order's paragraph numbers 1-7 (a stray '1' and 'i)' precede seven unnumbered paragraphs, while the body cites 'section 1' and 'section 4'), reads 'section 1' as 'section |', the signing day as '[1b aay' (paddle: '12 hday') and the signature as 'AAb 4'; the operative text would be wrong, so no text is committed. Reopens when a reading passes the figure bar (a third engine such as docTR as tiebreaker, or a human transcription the owner supplies)."
    why_relevant: Directs the transfer of executive department IT security functions to the Office of the
      State CIO. Listed on the Governor's order list; no rescission found.
