    title: 'Government Code section 12168.7: Uniform statewide standards for public records in electronic media or cloud storage (trusted systems)'
    doc_type: statute
    jurisdiction: california
    issuing_body: California Legislature
    tags: [data, cloud-resilience]
    recheck: monthly
    slice: {code: GOV, section: '12168.7'}
    why_relevant: Has the Secretary of State, 'in consultation with the Department of Technology', approve and adopt uniform statewide standards for storing and recording public records in electronic media or in a cloud computing storage service, including a requirement that a trusted system be used (12168.7(b), (c)); a state agency's records must comply (12168.7(d)(2)). Cal. Code Regs., tit. 2, div. 7, ch. 15 (ingested below) implements it and cites it as its authority.

  # ---- Administrative rules: California Code of Regulations (CCR)
  # The CCR is published only through Westlaw (OAL contract with Thomson Reuters; oal.ca.gov answered the toolkit's Fetcher with HTTP 403, Cloudflare managed challenge), so
  # the expectation was that every California rule is a stub. Two chapters are the exception: the Secretary of State publishes them on its own site (www.sos.ca.gov, which
  # loads for the Fetcher), under Title 2, Division 7. No Department of Technology or Office of Information Security regulation was found (a web search on 2026-11-11
