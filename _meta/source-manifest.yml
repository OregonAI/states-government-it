    jurisdiction: washington
    issuing_body: Washington State Legislature; published by the Statute Law Committee and Code Reviser
    tags: [data, cybersecurity]
    recheck: monthly
    why_relevant: "Requires a written agreement, conforming to the policies of the Office of Cybersecurity, before one public agency requests category 3 or higher data from another. The sibling of RCW 39.26.340 (agency to contractor), from the same act (2021 c 291). Cited by WaTech policies DATA-03 and POL-01. One section of the interlocal cooperation chapter."
  - id: wa-rcw-43-386
    url: "https://app.leg.wa.gov/rcw/default.aspx?cite=43.386&full=true"
    format: html
    citation: "RCW chapter 43.386"
    title: "Chapter 43.386 RCW - Facial recognition"
    doc_type: statute
    jurisdiction: washington
    issuing_body: Washington State Legislature; published by the Statute Law Committee and Code Reviser
    tags: [ai, data]
    recheck: monthly
    stub: true
    stub_reason: "Borderline for scope, owner decision: the chapter governs state and local agency use of facial recognition services (accountability reports, meaningful human review, testing, training) but section 43.386.070 and 43.386.080 are law-enforcement provisions, and the scope statement puts law-enforcement technology out except where a general agency-AI rule names it. The source fetched fine on 2026-11-10; the entry becomes a document if the owner takes it in."
    why_relevant: "Washington's only enacted statute found that regulates agency use of an AI technology (facial recognition) with human review, testing and accountability-report duties. Cited by WaTech policy DATA-03."
  - id: wa-law-2026-c167
    url: "https://lawfilesext.leg.wa.gov/biennium/2025-26/Pdf/Bills/Session%20Laws/House/1170-S2.SL.pdf"
    format: pdf
    citation: "Chapter 167, Laws of 2026 (E2SHB 1170), section 6"
    title: "Artificial Intelligence - Disclosures - Content Provenance (Chapter 167, Laws of 2026)"
    doc_type: statute
    jurisdiction: washington
    issuing_body: Washington State Legislature
    tags: [ai, digital-services]
    recheck: monthly
    stub: true
    stub_reason: "Enacted and signed 2026-03-24 but not in force: the act takes effect 2027-02-01 and has no RCW chapter number yet (section 8 makes section 6 a new chapter in Title 42 RCW). The corpus holds in-force instruments only. Section 6 requires a government agency that makes an AI system available to interact with consumers to disclose the AI interaction; sections 1-5 bind private providers (out of scope). Becomes a document at the next code revision once in force."
    why_relevant: "Section 6 binds state and local government agencies that make an AI system available to interact with consumers: clear, plain-language disclosure before or at the time of interaction. The only enacted Washington statute found whose subject is agency disclosure of AI use."

