  # ---- Found and left out (each was seen on an official page on 2026-11-10; the reason is recorded here)
  #
  # Word files read on 2026-11-11 (the ingester reads .docx with pandoc since this change):
  #  - Attachment A to the Responsible AI Usage Policy, 'Agency AI Adoption Strategy Template and
  #    Instructions': judged an instrument (guidance, required components, revision history) and now a
  #    seed entry above.
  #  - Attachment C, 'AI Use Form' (https://www.oregon.gov/eis/Documents/Attachment-C-AI-Use-Form.docx).
  #    Read 2026-11-11: a form of required questions with check boxes, titled 'Information Technology
  #    Investment Artificial Intelligence Use Form' and to be submitted to EIS. Judged a form, so left
  #    out. OWNER DECISION: whether forms enter the corpus (the form is the only place its questions
  #    are stated, so the owner may overrule).
  #
  # Forms and workbooks (forms to fill in, not instruments; owner may overrule):
  #  - 107-004-130 'IT Investment Form' (https://www.oregon.gov/das/Policies/107-004-130_Attachment.docx).
  #  - 107-004-150_PR 'Cloud and Hosted Systems Workbook form'
  #    (https://www.oregon.gov/das/Policies/107-004-150_PR_Attachment.doc).
  #  - 107-004-160 'Data Governance Plan Template' (https://www.oregon.gov/das/Policies/Data%20Governance%20Plan%20Template.docx)
  #    and 'Data Governance Maturity Model' (https://www.oregon.gov/das/Policies/Data%20Governance%20Maturity%20Model.xlsx).
  #  - 107-004-180 budget category workbook and transmittal form (already noted on the entry above).
  #
  # Overtaken, not in force (read by OCR 2026-11-11; two engines agree on 98% of the words):
  #  - State CIO Memorandum, 2026-04-20, 'Statewide policy 107-004-052 update'
  #    (https://www.oregon.gov/eis/Documents/State%20CIO%20Memo-107-004-052%2020260420.docx.pdf; a scan).
  #    It says section (4), the disallowance of offshore and foreign services added to the policy 'effective
  #    February 17, 2026', 'is temporarily paused to allow the continuance of procurement activities' and
  #    that updates to the policy 'are in process and will be forthcoming soon'. The 2026-10-01 version of
  #    107-004-052 (seeded above) prints 'SUPERSEDES: Policy #107-004-052 (2/17/2026)', carries section
  #    (4) without any pause, and makes its disclosure-and-review rule effective with that policy's date,
  #    October 1, 2026. The pause was of the superseded version's section, so the memo is overtaken by the
  #    policy's own terms; the policy does not name the memo. Left out as not in force. OWNER: confirm with
  #    EIS that the memo is withdrawn (the EIS page still listed it as a directive on 2026-11-10).
  #
  # Out of scope (not IT governance of state agencies):
  #  - 107-001-016 'Mobile Communication Device Usage While Driving' (https://www.oregon.gov/das/Policies/107-001-016.pdf;
  #    effective 1/1/2010 in the DAS feed; listed in both the DAS IT-category feed and the EIS policy
  #    feed). By its title a rule about driving, not about IT governance; the number is in DAS's general (107-001) series.
  #    OWNER DECISION: it is tagged IT by DAS, so it could enter.
  #  - State CIO memo 'Enterprise Telephony System - Amendments, Changes'
  #    (https://www.oregon.gov/eis/State%20CIO%20Letters%20and%20Memos/eis-telecom-20220223.pdf).
  #    The EIS page lists it as 2022/02/23; the PDF prints 'Date: February 25, 2022'. Directs telephony
  #    contract changes and exceptions; telecom service procurement is borderline out of scope.
  #    OWNER DECISION.
  #
  # Drafts, not in force (the EIS policy page, 'Closed Comment Period: drafts are available until
  # approved'; the page says no policies are currently out for comment):
  #  - IT Asset Management (Software) Policy 107-004-010 and IT Asset Management (Software) Procedure
  #    107-004-010_software_PR (draft for comment).
  #  - Cloud Security (Tracked Changes) 107-004-150 and Cloud Security Procedure 107-004-150_PR
  #    (tracked-changes drafts for comment).
  #  The in-force 107-004-010 and 107-004-150 policies are seeded above. When a draft is approved the
  #  monthly drift run on the EIS policy page will show it.
  #
  # Executive orders, contested category (the Governor's EO feed lists both as 'Public Records'):
  #  - EO 2016-6 (https://www.oregon.gov/gov/eo/eo_16-06.pdf) and EO 2018-5
  #    (https://www.oregon.gov/gov/eo/eo_18-05.pdf). Public records are a records-management matter
  #    rather than IT governance. OWNER DECISION: not seeded, no text read to decide.
  #
  # Statute outside chapter 276A (each page fetched from oregonlegislature.gov, 2025 Edition). All pass
  # the inclusion test as state-agency IT procurement and governance, but the ingester mirrors a whole
  # chapter per page, and each chapter is mostly unrelated law (ch. 291 about 26,000 words; ch. 279A
  # and 279B about 19,500 each). OWNER DECISION whether partial-chapter statutes enter, and how
  # (a whole-chapter mirror, or provision-level entries with oversight/procurement tags):
  #  - ORS 291.032 'Providing technical services involving management and organization' and ORS 291.034
  #    'Providing technical services involving data processing' (chapter 291, https://www.oregonlegislature.gov/bills_laws/ors/ors291.html).
  #  - ORS 291.042 'Copyright, patent or other use of state data processing programs, information or
  #    materials; disposition of moneys collected' (chapter 291).
  #  - ORS 291.047 'Public contract approval by Attorney General; exemptions; rules': the Attorney General
  #    approves information technology contracts calling for payment in excess of $75,000 (chapter 291).
  #  - ORS 279A.050 'Procurement authority': the State CIO may review any solicitation document for
  #    procuring information technology or telecommunications before it issues
  #    (https://www.oregonlegislature.gov/bills_laws/ors/ors279A.html).
  #  - ORS 279B.030(4): materials from a cost analysis for IT services go to the State CIO, who adopts
  #    rules (https://www.oregonlegislature.gov/bills_laws/ors/ors279B.html).
  #
  # OAR chapter 128 division 10 (broadband) is left out, noted at the top of the rules section.

